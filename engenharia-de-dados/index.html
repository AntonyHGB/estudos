uivos. Em tabelas grandes, isso é a diferença entre segundos e horas.\u003c/p>\n\u003cp>\u003cstrong>Como escolher a coluna de partição:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Deve aparecer nos filtros da maioria das consultas (senão não serve para nada).\u003c/li>\u003cli>Cardinalidade moderada. Data é o caso ideal.\u003c/li>\u003cli>Distribuição razoavelmente uniforme.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Sobre-particionamento é um erro tão comum quanto sub-particionamento.\u003c/strong> Particionar por \u003ccode>ano/mes/dia/hora/user_id\u003c/code> gera milhões de diretórios com arquivos minúsculos. Consequências: listar os objetos vira lento e caro (em object storage, listagem é uma operação de API, e milhões de chamadas custam tempo e dinheiro); o metadado da tabela incha; o planejamento da query passa a demorar mais que a execução; e cada arquivo pequeno tem overhead fixo de abertura e de leitura de footer.\u003c/p>\n\u003cp>\u003cstrong>Regras práticas úteis para citar em entrevista:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Mire partições de \u003cstrong>algumas centenas de MB a poucos GB\u003c/strong>.\u003c/li>\u003cli>Mantenha o número total de partições na casa de \u003cstrong>milhares\u003c/strong>, não de milhões.\u003c/li>\u003cli>Se uma partição típica tem menos de ~100 MB, você está particionando fino demais — suba um nível de granularidade (de dia para mês, por exemplo).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Para a segunda dimensão de filtro, use clustering em vez de mais um nível de partição.\u003c/strong> Clustering (ou sort key, ou Z-ordering) ordena fisicamente os dados dentro do arquivo por uma ou mais colunas, o que estreita os intervalos de min/max por bloco e melhora muito o pruning por estatística — sem criar diretórios. Z-ordering é uma curva de preenchimento de espaço que preserva localidade em \u003cstrong>múltiplas\u003c/strong> dimensões simultaneamente, sendo útil quando as consultas filtram por combinações variáveis de duas ou três colunas.\u003c/p>\n\u003cp>Formatos de tabela modernos ainda adicionam duas melhorias importantes sobre o modelo Hive: \u003cstrong>hidden partitioning\u003c/strong> (a partição é derivada de uma coluna real por transformação declarada, então o usuário filtra pela coluna natural e o pruning acontece automaticamente) e \u003cstrong>partition evolution\u003c/strong> (mudar o esquema de particionamento sem reescrever dados históricos).\u003c/p>\n\u003ch3 id=\"h-1-5-o-problema-dos-small-files\">1.5 O problema dos small files\u003c/h3>\n\u003cp>É o problema operacional mais comum em data lakes, e um dos que mais aparece em entrevistas práticas.\u003c/p>\n\u003cp>\u003cstrong>Como surge:\u003c/strong> ingestão frequente (um job a cada 5 minutos gera 288 arquivos por dia por partição); streaming com micro-batches curtos; paralelismo alto na escrita (200 tasks escrevendo geram 200 arquivos por partição); ou particionamento fino demais.\u003c/p>\n\u003cp>\u003cstrong>Por que dói:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Overhead por arquivo.\u003c/strong> Cada arquivo Parquet exige abrir, ler o footer com o schema e as estatísticas, e depois ler os dados. Com arquivos de 1 MB, o overhead domina o trabalho útil.\u003c/li>\u003cli>\u003cstrong>Listagem cara.\u003c/strong> Em object storage, listar objetos é uma chamada de API paginada. Milhões de objetos significam milhares de chamadas antes de a query começar.\u003c/li>\u003cli>\u003cstrong>Compressão pior.\u003c/strong> Dictionary e RLE precisam de volume para serem eficazes; arquivos pequenos têm dicionários pequenos e razão de compressão ruim.\u003c/li>\u003cli>\u003cstrong>Estatísticas menos úteis.\u003c/strong> Menos linhas por bloco significa intervalos de min/max menos discriminantes.\u003c/li>\u003cli>\u003cstrong>Metadados inchados\u003c/strong> no catálogo e no formato de tabela, degradando o planejamento.\u003c/li>\u003cli>Historicamente, o NameNode do HDFS guardava metadados em memória, então arquivos pequenos eram um limite físico do cluster — vale mencionar como contexto se o assunto for Hadoop.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Como resolver:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Compactação periódica\u003c/strong> (compaction / \u003ccode>OPTIMIZE\u003c/code>): reescrever muitos arquivos pequenos em poucos grandes. É uma tarefa de manutenção de primeira classe, com custo e agendamento próprios — não um detalhe.\u003c/li>\u003cli>\u003cstrong>Controlar o paralelismo da escrita.\u003c/strong> Fazer \u003ccode>coalesce\u003c/code>/\u003ccode>repartition\u003c/code> antes de gravar, para que o número de arquivos por partição seja intencional e não um acidente do número de tasks.\u003c/li>\u003cli>\u003cstrong>Agrupar micro-batches.\u003c/strong> Escrever a cada 30 minutos em vez de a cada minuto, quando a latência permite.\u003c/li>\u003cli>\u003cstrong>Repensar o particionamento\u003c/strong>, se ele é a causa raiz.\u003c/li>\u003cli>\u003cstrong>Padrão de duas camadas\u003c/strong>: uma tabela de ingestão otimizada para escrita (arquivos pequenos, latência baixa) e uma tabela servida otimizada para leitura, alimentada por um processo de compactação. É o mesmo espírito do Merge-on-Read.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Tamanho alvo:\u003c/strong> a faixa comumente recomendada é \u003cstrong>128 MB a 1 GB\u003c/strong> por arquivo, com row groups de 128 a 512 MB. O limite superior importa porque row group grande demais aumenta o consumo de memória na leitura (o engine lê o row group inteiro para uma coluna) e reduz a granularidade do pruning.\u003c/p>\n\u003ch3 id=\"h-1-6-object-storage-o-que-muda\">1.6 Object storage: o que muda\u003c/h3>\n\u003cp>Data lakes e lakehouses rodam sobre object storage (S3, GCS, ADLS), que \u003cstrong>não é um sistema de arquivos\u003c/strong>, e as diferenças importam:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Não há diretórios de verdade.\u003c/strong> \"Pastas\" são prefixos no nome do objeto. Listar por prefixo é uma operação de API, não uma leitura de inode — daí o custo de listagem.\u003c/li>\u003cli>\u003cstrong>Objetos são imutáveis.\u003c/strong> Você não altera parte de um objeto; você o substitui inteiro. É por isso que UPDATE e DELETE em data lake exigem reescrever arquivos ou usar delete files.\u003c/li>\u003cli>\u003cstrong>Rename não é atômico nem barato.\u003c/strong> Em sistemas de arquivos, rename é uma operação de metadado. Em object storage, é copiar e deletar. Isso quebrou os commit protocols originais do Hadoop, que dependiam de rename atômico de diretório — e é uma das razões da existência dos formatos de tabela.\u003c/li>\u003cli>\u003cstrong>Latência alta por requisição, throughput agregado altíssimo.\u003c/strong> A estratégia certa é fazer menos requisições maiores e em paralelo, não muitas pequenas. Isso reforça tudo que foi dito sobre small files.\u003c/li>\u003cli>\u003cstrong>Consistência.\u003c/strong> Os principais provedores hoje oferecem consistência forte de leitura após escrita, mas historicamente havia consistência eventual em listagem, o que causava bugs sutis (o job escrevia arquivos e a listagem seguinte não os via). Vale conhecer como contexto histórico.\u003c/li>\u003cli>\u003cstrong>Classes de armazenamento e ciclo de vida.\u003c/strong> Dados frios podem migrar para camadas mais baratas com latência de recuperação maior. Definir política de ciclo de vida é parte da engenharia de custo e frequentemente é a alavanca de economia mais fácil que existe.\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Dizer que colunar é rápido \"porque é otimizado para leitura\", sem explicar.\u003c/strong> A resposta precisa citar os três mecanismos: menos I/O por ler só as colunas necessárias, compressão muito melhor por homogeneidade, e execução vetorizada.\u003c/p>\n\u003cp>\u003cstrong>Confundir Avro com formato colunar.\u003c/strong> Avro é orientado a linha. É um erro frequente e revela que a pessoa só decorou uma lista de \"formatos de big data\".\u003c/p>\n\u003cp>\u003cstrong>Achar que Parquet resolve tudo sozinho.\u003c/strong> Sem dados ordenados ou clusterizados, as estatísticas de min/max não filtram nada e o pruning não acontece. O formato dá a capacidade; o layout determina se ela é usada.\u003c/p>\n\u003cp>\u003cstrong>Ignorar splittability.\u003c/strong> Propor CSV+gzip para arquivos grandes cria um gargalo de uma única task que nenhuma configuração de cluster resolve.\u003c/p>\n\u003cp>\u003cstrong>Particionar por coluna de alta cardinalidade.\u003c/strong> \u003ccode>user_id\u003c/code> ou \u003ccode>id_transacao\u003c/code> como partição gera milhões de diretórios com arquivos minúsculos. É o erro de particionamento mais comum.\u003c/p>\n\u003cp>\u003cstrong>Tratar compactação como opcional.\u003c/strong> Sem ela, o lake degrada continuamente. É trabalho de manutenção recorrente, com custo e monitoramento próprios.\u003c/p>\n\u003cp>\u003cstrong>Esquecer o custo de listagem em object storage.\u003c/strong> Muita gente raciocina como se fosse um sistema de arquivos local. A operação de listar é cara e é frequentemente o gargalo invisível.\u003c/p>\n\u003cp>\u003cstrong>Assumir que renomear coluna em Parquet é seguro.\u003c/strong> Sem uma camada que rastreie colunas por ID, renomear equivale a apagar e criar, e os dados históricos daquela coluna somem silenciosamente.\u003c/p>\n\u003cp>\u003cstrong>Escolher o compressor antes de olhar o encoding e a ordenação.\u003c/strong> O ganho de ordenar os dados antes de gravar frequentemente supera qualquer troca de algoritmo de compressão.\u003c/p>\n\u003cp>\u003cstrong>Não ter política de retenção de snapshots.\u003c/strong> Time travel retém arquivos que seriam deletados. Sem expiração, o storage cresce indefinidamente e o metadado degrada o planejamento das queries.\u003c/p>\n\u003cp>\u003cstrong>Usar \u003ccode>SELECT *\u003c/code> em tabela colunar.\u003c/strong> Anula o column pruning, que é justamente a maior vantagem do formato.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. Qual a diferença entre armazenamento em linha e colunar?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Em formato de linha, os valores de um registro ficam fisicamente juntos; em colunar, os valores de uma mesma coluna ficam juntos. Isso significa que consulta analítica, que lê poucas colunas de muitas, lê só o necessário no formato colunar — se a tabela tem 200 colunas e a query usa 5, você lê 2,5% dos dados. Além disso, valores do mesmo tipo e domínio na mesma coluna comprimem muito melhor, e a CPU processa em lote com instruções vetorizadas.\u003c/p>\n\u003cp>Formato de linha continua melhor em OLTP, porque lá você lê e escreve o registro inteiro, e atualizar uma linha em colunar exigiria mexer em N estruturas comprimidas.\u003c/p>"},{"titleHtml":"🟢 P2. Quando usar Parquet e quando usar Avro?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Parquet é colunar: use para armazenamento analítico, onde as consultas leem poucas colunas de muitas linhas. Avro é orientado a linha, com schema embutido e regras claras de evolução: use para transporte de registros completos e para escrita — mensagens em Kafka, camada de ingestão bruta, casos onde você sempre lê o registro inteiro.\u003c/p>\n\u003cp>A regra prática é: Avro para escrever e transportar, Parquet para ler e analisar. Um pipeline típico ingere em Avro ou JSON e converte para Parquet na camada analítica.\u003c/p>"},{"titleHtml":"🟢 P3. Por que arquivos pequenos são um problema num data lake?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Porque o overhead por arquivo passa a dominar. Cada arquivo exige abrir, ler o footer com schema e estatísticas, e só então ler dados — com arquivos de 1 MB, o custo fixo é maior que o trabalho útil. Em object storage, listar milhões de objetos é uma sequência de chamadas de API que atrasa a query antes mesmo de ela começar. A compressão fica pior, porque dictionary e RLE precisam de volume. E as estatísticas por bloco ficam menos discriminantes, reduzindo o pruning.\u003c/p>\n\u003cp>A solução é compactação periódica, controlar o paralelismo da escrita, e revisar o particionamento se ele for a causa.\u003c/p>"},{"titleHtml":"🟢 P4. O que é partition pruning?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É o engine pular arquivos ou diretórios inteiros que não podem conter linhas que satisfaçam o filtro, sem lê-los. Se a tabela é particionada por data e a query filtra um mês, ele lê 30 diretórios em vez de milhares. É o maior ganho isolado de performance disponível em tabelas grandes.\u003c/p>\n\u003cp>O detalhe importante é que ele só acontece se o predicado for utilizável: aplicar uma função sobre a coluna de partição, ou ter incompatibilidade de tipo, impede o pruning e força varredura completa — e isso falha silenciosamente, a query devolve o resultado certo, só que caríssima.\u003c/p>"},{"titleHtml":"🟡 P5. Como o Parquet consegue pular dados sem ler tudo?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Pela estrutura hierárquica e pelas estatísticas. Um arquivo Parquet é dividido em row groups; dentro de cada row group, cada coluna é um column chunk, subdividido em pages. Cada nível carrega estatísticas — min, max e contagem de nulos.\u003c/p>\n\u003cp>Quando a query filtra por \u003ccode>valor &amp;gt; 1000\u003c/code>, o engine lê o footer, verifica as estatísticas de cada row group e descarta aqueles cujo máximo é menor ou igual a 1000, sem descomprimir nada. Isso é o predicate pushdown operando no nível do formato.\u003c/p>\n\u003cp>O ganho depende de os dados estarem \u003cstrong>ordenados ou agrupados\u003c/strong> pela coluna filtrada. Se os valores estiverem espalhados aleatoriamente, todo row group terá min baixo e max alto, e nenhum será descartado — as estatísticas ficam inúteis. É por isso que clustering ou sort na escrita importa tanto: ele estreita os intervalos e torna as estatísticas discriminantes. Parquet também suporta bloom filters por coluna, que ajudam em igualdade sobre alta cardinalidade, onde min/max não filtram bem.\u003c/p>"},{"titleHtml":"🟡 P6. O que é splittability e por que importa?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Um arquivo é splittable quando o engine consegue começar a ler do meio, permitindo que várias tasks processem partes diferentes em paralelo. Importa porque define se o paralelismo do cluster pode ser usado num arquivo grande.\u003c/p>\n\u003cp>Um CSV comprimido com gzip não é splittable: para chegar ao meio você precisa descomprimir desde o início. Um arquivo de 50 GB nesse formato vira uma única task, independentemente do tamanho do cluster — é um gargalo que nenhum ajuste de configuração resolve.\u003c/p>\n\u003cp>Parquet e ORC contornam isso porque comprimem por página interna, não o arquivo inteiro, então cada row group é lido independentemente e o arquivo permanece splittable mesmo com um algoritmo que não seria splittable sozinho.\u003c/p>"},{"titleHtml":"🟡 P7. Snappy, Zstd ou gzip? Como você escolhe?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Pelo eixo taxa versus velocidade, e por quem é o gargalo.\u003c/p>\n\u003cp>Snappy é rápido com taxa moderada, e foi o padrão histórico do Parquet quando CPU era o gargalo. Zstd dá taxa significativamente melhor com velocidade competitiva e nível ajustável, e virou a escolha preferida na maior parte dos casos modernos — especialmente quando você paga por byte armazenado e transferido, porque a economia de storage e de rede compensa o pouco de CPU adicional. Gzip tem taxa boa mas descompressão lenta. LZ4 é para dados intermediários e shuffle, onde velocidade domina.\u003c/p>\n\u003cp>E acrescentaria uma coisa que costuma render mais que a escolha do algoritmo: em Parquet, a maior parte da compressão vem do encoding colunar — dictionary, RLE, delta — não do compressor genérico. Ordenar os dados por uma coluna de baixa cardinalidade antes de gravar cria longas sequências repetidas que o RLE captura, e pode melhorar a taxa mais do que trocar de algoritmo.\u003c/p>"},{"titleHtml":"🟡 P8. Qual o tamanho ideal de arquivo e por quê?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> A faixa que eu miro é 128 MB a 1 GB por arquivo, com row groups entre 128 e 512 MB.\u003c/p>\n\u003cp>O limite inferior existe porque abaixo disso o overhead por arquivo — abertura, leitura de footer, chamada de API — passa a dominar, e a compressão piora. O limite superior existe porque o engine lê o row group inteiro de uma coluna para processá-lo, então row groups muito grandes aumentam o consumo de memória e reduzem a granularidade do pruning: um row group de 5 GB tem estatísticas menos discriminantes que dez de 500 MB.\u003c/p>\n\u003cp>Na prática eu ajustaria pelo padrão de acesso: leitura muito seletiva favorece arquivos e row groups menores para pruning fino; varredura completa favorece arquivos maiores para reduzir overhead.\u003c/p>"},{"titleHtml":"🟡 P9. Como você decidiria entre particionar por mais uma coluna ou usar clustering?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Particionamento físico cria diretórios e é ótimo para a dimensão principal de filtro — tipicamente tempo. Mas cada nível adicional multiplica o número de diretórios e leva a arquivos pequenos, então ele não escala para várias dimensões.\u003c/p>\n\u003cp>Para a segunda e terceira dimensões, uso clustering: ordenar fisicamente os dados dentro dos arquivos por essas colunas. Isso estreita os intervalos de min/max por bloco e melhora muito o pruning por estatística, sem criar diretórios nem fragmentar arquivos.\u003c/p>\n\u003cp>Z-ordering é a variante para múltiplas dimensões simultâneas: uma curva de preenchimento de espaço que preserva localidade em duas ou três colunas ao mesmo tempo, útil quando as consultas filtram por combinações variáveis. O custo é que ele é subótimo para cada dimensão isolada comparado a ordenar só por ela — é um compromisso entre dimensões, e só vale quando o padrão de consulta é realmente misto.\u003c/p>\n\u003cp>Regra prática: particione pela dimensão que aparece em quase toda consulta; clusterize pelas que aparecem em algumas.\u003c/p>"},{"titleHtml":"🔴 P10. Um pipeline de streaming está gerando milhões de arquivos pequenos. Como resolver sem aumentar a latência?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O conflito é real: latência baixa exige commits frequentes, e commits frequentes geram arquivos pequenos. Não dá para resolver só ajustando um lado.\u003c/p>\n\u003cp>A solução estrutural é \u003cstrong>separar as duas responsabilidades em duas camadas\u003c/strong>. Uma tabela de ingestão otimizada para escrita, com commits frequentes e arquivos pequenos, servindo quem precisa de dado fresco. E uma tabela servida otimizada para leitura, alimentada por um processo de compactação que roda periodicamente e consolida. Quem precisa de latência lê a primeira; quem precisa de performance de varredura lê a segunda. É o mesmo espírito do Merge-on-Read.\u003c/p>\n\u003cp>Complementarmente, três ajustes: \u003cstrong>controlar o paralelismo da escrita\u003c/strong> — frequentemente o número de arquivos é acidental, resultado de N tasks escrevendo, e um \u003ccode>coalesce\u003c/code> antes da gravação já reduz drasticamente sem afetar latência. \u003cstrong>Revisar o particionamento\u003c/strong>, porque particionamento fino multiplica o problema: com partição por hora e 200 tasks, são 4.800 arquivos por dia por definição. E \u003cstrong>agrupar micro-batches\u003c/strong> até o limite que o requisito de latência permite — de 1 para 5 minutos frequentemente é imperceptível para o usuário e reduz o número de arquivos em 5 vezes.\u003c/p>\n\u003cp>A compactação precisa ser tratada como job de primeira classe: tem custo de compute, precisa de monitoramento, e em formato transacional precisa lidar com concorrência contra os writers. Deixá-la implícita é como esse problema chega ao estado de milhões de arquivos.\u003c/p>"},{"titleHtml":"🔴 P11. Por que ordenar os dados antes de escrever pode melhorar drasticamente a performance de leitura?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Por dois mecanismos que se somam.\u003c/p>\n\u003cp>\u003cstrong>Compressão.\u003c/strong> Encodings colunares dependem de repetição local. Se os dados estão ordenados por uma coluna de baixa cardinalidade, aquela coluna vira longas sequências do mesmo valor, que o run-length encoding representa em quase nada. Colunas correlacionadas com ela também melhoram. Já vi reduções de 40% ou mais no tamanho da tabela só por ordenar antes de gravar.\u003c/p>\n\u003cp>\u003cstrong>Pruning por estatística.\u003c/strong> As estatísticas de min/max por row group só filtram se os intervalos forem estreitos. Com dados aleatórios, todo row group tem min baixo e max alto, e o engine não consegue descartar nenhum — as estatísticas existem mas são inúteis. Ordenado, cada row group cobre uma faixa estreita, e uma consulta seletiva descarta a maioria deles sem ler.\u003c/p>\n\u003cp>O custo é a ordenação na escrita, que exige um shuffle e é cara. Então vale quando a tabela é escrita uma vez e lida muitas — que é o caso da maioria das tabelas analíticas. Por isso \u003ccode>OPTIMIZE ... ZORDER BY\u003c/code> e comandos equivalentes existem: eles reescrevem os dados ordenados como operação de manutenção, amortizando o custo entre muitas leituras.\u003c/p>"},{"titleHtml":"🔴 P12. Explique como funciona a evolução de schema em Parquet e em Avro. Quais são os limites?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> São modelos diferentes.\u003c/p>\n\u003cp>\u003cstrong>Avro\u003c/strong> foi projetado em torno disso. O schema é armazenado com os dados, e a leitura usa dois schemas: o de escrita (writer) e o de leitura (reader), resolvidos por regras explícitas de compatibilidade. Adicionar campo com valor default é backward compatible — leitores novos leem dados antigos. Remover campo que tinha default é forward compatible — leitores antigos leem dados novos. Isso é o que torna Avro adequado para mensageria de longa vida, e é a base do funcionamento de um Schema Registry.\u003c/p>\n\u003cp>\u003cstrong>Parquet\u003c/strong> guarda o schema no footer de cada arquivo, e a evolução é gerenciada pela camada acima. Adicionar coluna funciona: arquivos antigos não a têm e o engine devolve NULL. Remover é ignorar na leitura. Mas \u003cstrong>renomear e mudar tipo\u003c/strong> são os problemas: se a resolução é por nome, renomear equivale a remover e adicionar, e você perde os dados históricos daquela coluna silenciosamente.\u003c/p>\n\u003cp>É exatamente por isso que formatos de tabela como Iceberg rastreiam colunas por \u003cstrong>ID\u003c/strong> e não por nome ou posição: renomear vira uma mudança de metadado, sem tocar nos arquivos, e reordenar colunas é seguro. Sem essa camada, evolução de schema em Parquet puro é frágil.\u003c/p>\n\u003cp>Os limites que permanecem em ambos: mudança de tipo incompatível (string para int) exige reescrita ou uma coluna nova; alterar a semântica de um campo sem mudar o tipo não é detectável por nenhum mecanismo automático — o schema continua válido e os dados ficam errados. Esse último caso é o argumento para contratos de dados com semântica documentada, não só schema.\u003c/p>"},{"titleHtml":"🔴 P13. Como você reduziria o custo de armazenamento de um data lake de 5 PB?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Eu atacaria em cinco frentes, na ordem de retorno sobre esforço.\u003c/p>\n\u003cp>\u003cstrong>Primeiro, dado que ninguém usa.\u003c/strong> Logs de acesso do storage mostram o que não é lido há meses. Em qualquer lake grande, uma fração significativa é dado morto: tabelas de experimentos abandonados, cópias intermediárias que viraram permanentes, backups de migrações antigas. Deletar ou arquivar isso costuma ser a maior economia disponível, e é a primeira coisa a fazer — não faz sentido otimizar o formato de dado que não deveria existir.\u003c/p>\n\u003cp>\u003cstrong>Segundo, política de ciclo de vida.\u003c/strong> Migrar dado frio para classes mais baratas automaticamente, com base em idade e padrão de acesso. É configuração, não engenharia, e o retorno é imediato.\u003c/p>\n\u003cp>\u003cstrong>Terceiro, compressão e formato.\u003c/strong> Se ainda houver JSON ou CSV parados no lake, converter para Parquet com Zstd tipicamente reduz de 5 a 10 vezes. E, dentro do Parquet, ordenar por colunas de baixa cardinalidade antes de gravar melhora a taxa substancialmente.\u003c/p>\n\u003cp>\u003cstrong>Quarto, retenção e manutenção do formato de tabela.\u003c/strong> Snapshots antigos e arquivos órfãos acumulam silenciosamente e podem representar uma fração grande do volume total. Expiração de snapshots e limpeza de órfãos precisam estar agendadas. E compactação, além de performance, reduz overhead de metadado.\u003c/p>\n\u003cp>\u003cstrong>Quinto, duplicação.\u003c/strong> Em lakes grandes é comum a mesma tabela existir em três lugares porque três times a copiaram. Consolidar exige governança e conversa, mas o volume envolvido costuma ser grande.\u003c/p>\n\u003cp>E eu mediria antes de agir: quebrar o custo por prefixo, por time e por tabela, e atacar o topo da lista. Sem isso, o esforço se dispersa em otimizações que afetam 2% do volume. Também alinharia com o negócio o que é exigência regulatória de retenção — porque nessa parte a economia não está disponível, e descobrir isso depois de deletar é o pior resultado possível.\u003c/p>"},{"titleHtml":"🔴 P14. Quais são as implicações de object storage não ser um sistema de arquivos?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Quatro implicações práticas.\u003c/p>\n\u003cp>\u003cstrong>Não há diretórios.\u003c/strong> \"Pastas\" são prefixos no nome do objeto, e listar por prefixo é uma chamada de API paginada, não uma leitura de metadado local. É por isso que milhões de arquivos pequenos degradam a query antes mesmo de ela começar a ler dados.\u003c/p>\n\u003cp>\u003cstrong>Objetos são imutáveis.\u003c/strong> Não se altera parte de um objeto; substitui-se inteiro. É a razão física de UPDATE e DELETE em data lake exigirem reescrever arquivos (copy-on-write) ou registrar deltas (merge-on-read).\u003c/p>\n\u003cp>\u003cstrong>Rename não é atômico nem barato\u003c/strong> — é copiar e deletar. Isso quebrou os commit protocols originais do Hadoop, que dependiam de rename atômico de diretório para publicar resultados. É uma das razões de existirem formatos de tabela: eles substituem o rename por um commit de metadado.\u003c/p>\n\u003cp>\u003cstrong>Latência alta por requisição, throughput agregado altíssimo.\u003c/strong> A estratégia certa é fazer poucas requisições grandes e muitas em paralelo, não muitas pequenas em série. Isso justifica os tamanhos-alvo de arquivo e explica por que leitura com muitas requisições pequenas é desproporcionalmente lenta.\u003c/p>\n\u003cp>Vale acrescentar que historicamente havia consistência eventual na listagem, o que causava bugs em que um job escrevia arquivos e a listagem seguinte não os enxergava. Os principais provedores hoje oferecem consistência forte após escrita, mas o padrão arquitetural de não confiar em listagem para determinar o conteúdo de uma tabela — e usar um manifesto explícito — permanece correto, e é o que formatos de tabela fazem.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Por que o formato \u003cstrong>colunar\u003c/strong> é mais rápido em analytics? (resposta completa)","a":["Porque é um formato mais moderno","Três mecanismos: lê só as colunas necessárias (menos I/O), valores homogêneos comprimem muito melhor (dictionary/RLE/delta), e a CPU processa em lote com vetorização","Porque elimina a necessidade de joins","Porque os dados ficam em memória"],"c":1,"e":"Só dizer que é otimizado para leitura é a resposta rasa. E OLTP continua em linha porque lê/escreve o registro inteiro — colunar é hostil a escrita pontual."},{"n":"🟢","levelName":"basico","q":"Quando usar \u003cstrong>Avro\u003c/strong> em vez de Parquet?","a":["Nunca — Parquet é superior em tudo","Para escrever e transportar registros completos (mensagens Kafka, ingestão bruta): Avro é orientado a linha, com schema embutido e regras de evolução; Parquet é para ler e analisar","Quando os dados são maiores que 1 TB","Quando o dado é numérico"],"c":1,"e":"Confundir Avro com formato colunar é erro clássico. O pipeline típico ingere em Avro/JSON e converte para Parquet na camada analítica."},{"n":"🟡","levelName":"intermediario","q":"Por que um \u003cstrong>CSV de 50 GB comprimido com gzip\u003c/strong> é um gargalo insolúvel por configuração?","a":["Porque o gzip corrompe arquivos grandes","Porque não é splittable: para ler o meio é preciso descomprimir desde o início, então o arquivo inteiro vira uma única task, independentemente do tamanho do cluster","Porque CSV não suporta paralelismo por natureza","Porque a rede limita transferências acima de 10 GB"],"c":1,"e":"Parquet/ORC contornam comprimindo por página interna: cada row group é lido independentemente e o arquivo permanece splittable mesmo com gzip nas páginas."},{"n":"🟡","levelName":"intermediario","q":"Qual a faixa de \u003cstrong>tamanho-alvo de arquivo\u003c/strong> num data lake, e por quê?","a":["1 a 10 MB, para maximizar o paralelismo","128 MB a 1 GB: abaixo disso o overhead por arquivo (abertura, footer, chamadas de API) domina e a compressão piora; acima, row groups grandes consomem memória e reduzem a granularidade do pruning","10 a 50 GB, para minimizar o número de objetos","O tamanho é irrelevante com formatos de tabela"],"c":1,"e":"Small files é o problema operacional mais comum em lakes: listagem cara em object storage, dicionários pequenos, estatísticas pouco discriminantes e metadados inchados."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>ordenar os dados antes de gravar\u003c/strong> pode melhorar drasticamente a leitura?","a":["Porque o engine exige dados ordenados","Dois mecanismos: cria sequências repetidas que o RLE comprime em quase nada, e estreita os intervalos de min/max por row group, tornando o pruning por estatística efetivo","Porque reduz o número de arquivos gerados","Porque evita o shuffle na leitura"],"c":1,"e":"Com dados aleatórios, todo row group tem min baixo e max alto — as estatísticas existem mas não filtram nada. O ganho de ordenar frequentemente supera qualquer troca de algoritmo de compressão."},{"n":"🟡","levelName":"intermediario","q":"Consultas filtram por data (sempre) e por categoria (às vezes). Como organizar o layout físico?","a":["Particionar por data e por categoria em dois níveis de diretório","Particionar por data e usar clustering/Z-ordering por categoria: cada nível extra de partição multiplica diretórios e gera small files; clustering melhora o pruning sem fragmentar","Particionar só por categoria","Não particionar e confiar nos bloom filters"],"c":1,"e":"Regra: particione pela dimensão que aparece em quase toda consulta; clusterize pelas que aparecem em algumas. Z-ordering preserva localidade em múltiplas dimensões simultâneas."},{"n":"🔴","levelName":"avancado","q":"Streaming gera milhões de arquivos pequenos. Como resolver \u003cstrong>sem aumentar a latência\u003c/strong>?","a":["Reduzir a frequência de commit e aceitar a latência maior","Duas camadas: tabela de ingestão otimizada para escrita servindo quem precisa de dado fresco, e tabela compactada otimizada para leitura — mais controle do paralelismo de escrita e revisão do particionamento","Aumentar o cluster de leitura","Migrar de Parquet para CSV"],"c":1,"e":"O conflito é estrutural: commits frequentes = arquivos pequenos. A separação de responsabilidades (mesmo espírito do Merge-on-Read) resolve os dois lados; a compactação vira job de primeira classe."},{"n":"🔴","levelName":"avancado","q":"Por que \u003cstrong>renomear coluna\u003c/strong> em Parquet puro é perigoso, e como o Iceberg resolve?","a":["Não é perigoso — renomear é operação de metadado em qualquer formato","Com resolução por nome, renomear equivale a remover e adicionar: os dados históricos daquela coluna somem silenciosamente; o Iceberg rastreia colunas por ID, tornando o rename uma mudança de metadado segura","O Parquet bloqueia renomes automaticamente","O Iceberg reescreve todos os arquivos ao renomear"],"c":1,"e":"Schema evolution por ID de coluna é uma das razões de existirem formatos de tabela. Limite que permanece: mudar a semântica de um campo sem mudar o tipo — nenhum mecanismo automático detecta."}]},{"id":"08","fullTitle":"08 — Apache Spark","shortTitle":"Apache Spark","subtitle":"Arquitetura · Lazy evaluation e DAG · Transformações wide e narrow · Catalyst e Tungsten · AQE · Joins · Memória · Tuning e diagnóstico","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-arquitetura\">1.1 Arquitetura\u003c/h3>\n\u003cp>Um job Spark tem três papéis:\u003c/p>\n\u003cp>\u003cstrong>Driver.\u003c/strong> Executa o programa principal, constrói o plano lógico, o otimiza, quebra em estágios e tarefas, e as agenda nos executores. Mantém o \u003ccode>SparkContext\u003c/code>/\u003ccode>SparkSession\u003c/code> e coleta resultados. É um ponto único de falha: se o driver morre, o job morre. Também é onde o \u003ccode>collect()\u003c/code> traz dados — motivo pelo qual \u003ccode>collect()\u003c/code> sobre um dataset grande estoura a memória do driver e é um erro clássico.\u003c/p>\n\u003cp>\u003cstrong>Cluster manager.\u003c/strong> Aloca recursos: YARN, Kubernetes, Standalone, ou o gerenciador do serviço gerenciado. O Spark não gerencia máquinas, ele pede recursos.\u003c/p>\n\u003cp>\u003cstrong>Executors.\u003c/strong> Processos JVM nos nós de trabalho que executam as tarefas e mantêm dados em cache. Cada executor tem um número de \u003cstrong>cores\u003c/strong> (tarefas simultâneas) e uma quantidade de memória.\u003c/p>\n\u003cp>Hierarquia de execução, e é importante saber nomear corretamente:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Job\u003c/strong>: disparado por uma \u003cstrong>ação\u003c/strong> (\u003ccode>count\u003c/code>, \u003ccode>write\u003c/code>, \u003ccode>collect\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Stage\u003c/strong>: um conjunto de tarefas que pode rodar sem shuffle. \u003cstrong>As fronteiras entre estágios são exatamente os shuffles.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Task\u003c/strong>: a unidade mínima — uma tarefa processa \u003cstrong>uma partição\u003c/strong>. O número de tarefas de um estágio é o número de partições.\u003c/li>\u003c/ul>\n\u003cp>Daí decorre a relação que responde muitas perguntas: \u003cstrong>paralelismo efetivo = min(número de partições, total de cores disponíveis)\u003c/strong>. Se você tem 100 cores e 10 partições, 90 cores ficam ociosos. Se tem 10 cores e 10.000 partições minúsculas, o overhead de agendamento domina.\u003c/p>\n\u003ch3 id=\"h-1-2-lazy-evaluation-e-o-dag\">1.2 Lazy evaluation e o DAG\u003c/h3>\n\u003cp>Transformações (\u003ccode>map\u003c/code>, \u003ccode>filter\u003c/code>, \u003ccode>join\u003c/code>, \u003ccode>groupBy\u003c/code>) \u003cstrong>não executam nada\u003c/strong>. Elas constroem um plano — o DAG de operações. Só uma \u003cstrong>ação\u003c/strong> (\u003ccode>count\u003c/code>, \u003ccode>collect\u003c/code>, \u003ccode>write\u003c/code>, \u003ccode>show\u003c/code>) dispara a execução.\u003c/p>\n\u003cp>\u003cstrong>Por que isso é bom:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Permite ao otimizador \u003cstrong>ver a query inteira\u003c/strong> antes de decidir. Ele pode reordenar filtros, combinar operações, eliminar colunas não usadas e escolher algoritmos de join com base no plano completo.\u003c/li>\u003cli>Permite \u003cstrong>fundir operações\u003c/strong> (pipelining): dois \u003ccode>filter\u003c/code> seguidos e um \u003ccode>map\u003c/code> viram uma única passada sobre os dados, sem materializar intermediários.\u003c/li>\u003cli>Evita computar o que não é necessário.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Consequências práticas que caem em entrevista:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Erros aparecem só na ação, não na linha que os causou — o que torna o debug menos intuitivo.\u003c/li>\u003cli>\u003cstrong>Um DataFrame não é um resultado, é uma receita.\u003c/strong> Se você usa o mesmo DataFrame em duas ações, ele é recomputado inteiro nas duas, a menos que você faça \u003ccode>cache\u003c/code>/\u003ccode>persist\u003c/code>. É a causa número um de jobs desnecessariamente lentos.\u003c/li>\u003cli>\u003ccode>count()\u003c/code> para \"verificar\" um DataFrame no meio do pipeline dispara a execução completa de tudo que veio antes.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-3-transformações-narrow-e-wide\">1.3 Transformações narrow e wide\u003c/h3>\n\u003cp>\u003cstrong>Narrow\u003c/strong>: cada partição de saída depende de \u003cstrong>uma\u003c/strong> partição de entrada. \u003ccode>map\u003c/code>, \u003ccode>filter\u003c/code>, \u003ccode>select\u003c/code>, \u003ccode>union\u003c/code>. Não há movimentação de dados; várias narrow consecutivas são fundidas num único estágio e executadas em uma passada.\u003c/p>\n\u003cp>\u003cstrong>Wide\u003c/strong>: cada partição de saída depende de \u003cstrong>várias\u003c/strong> partições de entrada. \u003ccode>groupByKey\u003c/code>, \u003ccode>reduceByKey\u003c/code>, \u003ccode>join\u003c/code> (não-broadcast), \u003ccode>distinct\u003c/code>, \u003ccode>repartition\u003c/code>, \u003ccode>orderBy\u003c/code>. Exigem \u003cstrong>shuffle\u003c/strong>, e portanto criam uma fronteira de estágio.\u003c/p>\n\u003cp>Essa distinção é o vocabulário central para falar de performance em Spark. Otimizar um job é, na prática, reduzir o número e o custo dos shuffles.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>repartition\u003c/code> vs \u003ccode>coalesce\u003c/code>\u003c/strong> — pergunta muito frequente:\u003c/p>\n\u003cul>\u003cli>\u003ccode>repartition(n)\u003c/code> faz shuffle completo e produz \u003ccode>n\u003c/code> partições \u003cstrong>balanceadas\u003c/strong>. Pode aumentar ou diminuir. Caro, mas resolve desbalanceamento.\u003c/li>\u003cli>\u003ccode>coalesce(n)\u003c/code> \u003cstrong>apenas funde\u003c/strong> partições existentes, sem shuffle completo. Só diminui. Barato, mas pode deixar partições desbalanceadas.\u003c/li>\u003cli>O detalhe que separa: \u003ccode>coalesce\u003c/code> reduz o paralelismo \u003cstrong>de todo o estágio anterior\u003c/strong>, porque não há fronteira de shuffle. Se você faz \u003ccode>coalesce(1)\u003c/code> antes de gravar depois de uma transformação pesada, aquela transformação inteira passa a rodar com paralelismo 1. Nesse caso, \u003ccode>repartition(1)\u003c/code> é mais lento no papel mas frequentemente mais rápido no total, porque preserva o paralelismo até o shuffle final.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>\u003ccode>reduceByKey\u003c/code> vs \u003ccode>groupByKey\u003c/code>\u003c/strong> (modelo RDD, mas ainda cobrado): \u003ccode>reduceByKey\u003c/code> faz agregação parcial \u003cstrong>no lado do map\u003c/strong> antes do shuffle, reduzindo drasticamente o volume trafegado. \u003ccode>groupByKey\u003c/code> move tudo e agrega depois. Para agregações associativas e comutativas, \u003ccode>reduceByKey\u003c/code> é sempre preferível. A API de DataFrame faz essa otimização automaticamente, o que é um dos argumentos para preferir DataFrame a RDD.\u003c/p>\n\u003ch3 id=\"h-1-4-catalyst-e-tungsten\">1.4 Catalyst e Tungsten\u003c/h3>\n\u003cp>\u003cstrong>Catalyst\u003c/strong> é o otimizador de queries do Spark SQL. Ele opera em quatro fases:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Análise.\u003c/strong> Resolve nomes de colunas e tabelas contra o catálogo, valida tipos, produz um plano lógico resolvido.\u003c/li>\u003cli>\u003cstrong>Otimização lógica.\u003c/strong> Aplica regras baseadas em equivalência: predicate pushdown (empurrar filtros para perto da fonte), column pruning (descartar colunas não usadas), constant folding, simplificação de expressões booleanas, eliminação de subconsultas redundantes, reordenação de joins.\u003c/li>\u003cli>\u003cstrong>Planejamento físico.\u003c/strong> Gera planos físicos candidatos — qual algoritmo de join, qual estratégia de agregação — e escolhe por custo, usando estatísticas.\u003c/li>\u003cli>\u003cstrong>Geração de código (whole-stage codegen).\u003c/strong> Compila o estágio inteiro em bytecode JVM otimizado, eliminando chamadas virtuais e materialização de objetos intermediários. Um estágio com vários operadores vira um único loop compilado.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Tungsten\u003c/strong> é a camada de execução de baixo nível: gerenciamento de memória fora do heap (evitando pressão de GC), formato binário compacto para os dados em memória, algoritmos cache-aware de sort e hash, e processamento vetorizado. Catalyst decide \u003cem>o que\u003c/em> fazer; Tungsten faz \u003cem>rápido\u003c/em>.\u003c/p>\n\u003cp>\u003cstrong>A implicação prática, e o motivo pelo qual isso cai em entrevista:\u003c/strong> RDD não passa por Catalyst — o Spark não consegue enxergar dentro de uma lambda arbitrária. DataFrame e Dataset com expressões SQL passam. Por isso a mesma lógica escrita em DataFrame frequentemente roda muito mais rápido que em RDD. E UDFs em Python são uma \u003cstrong>caixa preta\u003c/strong> para o Catalyst: ele não consegue otimizar através delas, não consegue empurrar predicados, e além disso há custo de serialização entre a JVM e o processo Python. UDFs vetorizadas (Pandas UDF / Arrow) reduzem o custo de serialização mas continuam opacas ao otimizador. A recomendação padrão é usar funções nativas sempre que possível.\u003c/p>\n\u003ch3 id=\"h-1-5-adaptive-query-execution-aqe\">1.5 Adaptive Query Execution (AQE)\u003c/h3>\n\u003cp>AQE é otimização em \u003cstrong>tempo de execução\u003c/strong>, usando estatísticas reais coletadas durante o job em vez de estimativas feitas antes. Introduzido no Spark 3.0 e \u003cstrong>ativo por padrão desde a 3.2\u003c/strong>.\u003c/p>\n\u003cp>O problema que resolve: o Catalyst planeja antes de executar, com base em estatísticas que podem estar ausentes, desatualizadas ou impossíveis de estimar (o resultado de um filtro complexo, o efeito de um join encadeado). Estimativas erradas produzem planos ruins. AQE corrige o plano no meio do caminho, entre estágios, quando os números reais já estão disponíveis.\u003c/p>\n\u003cp>Três otimizações principais:\u003c/p>\n\u003cp>\u003cstrong>Coalescing de partições pós-shuffle.\u003c/strong> Depois do shuffle, o AQE olha os tamanhos reais das partições e funde as pequenas contíguas até atingir um tamanho alvo (padrão da ordem de 64 MB, configurável). Isso resolve o problema clássico de \u003ccode>spark.sql.shuffle.partitions\u003c/code> fixo em 200: com dados pequenos você tinha 200 tarefas minúsculas com overhead dominante; agora o número se ajusta sozinho.\u003c/p>\n\u003cp>\u003cstrong>Conversão de sort-merge join em broadcast join.\u003c/strong> Se, após executar os estágios anteriores, um lado do join acabou sendo pequeno o suficiente, o AQE troca a estratégia e elimina o shuffle. É particularmente valioso quando o tamanho só é conhecido depois de um filtro seletivo.\u003c/p>\n\u003cp>\u003cstrong>Skew join optimization.\u003c/strong> Detecta partições anormalmente grandes em relação à mediana e as divide em sub-partições, replicando o lado correspondente. Resolve automaticamente boa parte dos casos de skew que antes exigiam salting manual.\u003c/p>\n\u003cp>Numa entrevista, mencionar que o AQE está ligado por padrão desde a 3.2 e que ele resolve automaticamente muito do que antigamente era tuning manual mostra que você está atualizado — e é uma boa resposta ao ser perguntado \"como você resolve skew\".\u003c/p>\n\u003ch3 id=\"h-1-6-estratégias-de-join\">1.6 Estratégias de join\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Broadcast Hash Join\u003c/strong>: o lado pequeno é enviado inteiro a todos os executores; join local, sem shuffle. Controlado por \u003ccode>spark.sql.autoBroadcastJoinThreshold\u003c/code> (padrão na casa de 10 MB) ou por hint explícito. É a melhor opção quando cabe. O risco é OOM se o lado transmitido for maior do que se estimou.\u003c/li>\u003cli>\u003cstrong>Shuffle Hash Join\u003c/strong>: ambos os lados são shuffleados pela chave; constrói hash table por partição. Sem ordenação, mas exige memória para a hash table.\u003c/li>\u003cli>\u003cstrong>Sort Merge Join\u003c/strong>: ambos shuffleados e ordenados, depois merge. É o padrão para dois lados grandes. Mais robusto quanto a memória (pode fazer spill de forma graciosa), mais caro em CPU pela ordenação.\u003c/li>\u003cli>\u003cstrong>Broadcast Nested Loop Join\u003c/strong>: fallback para condições que não são de igualdade. Custo quadrático — se aparecer no plano para tabelas grandes, é um sinal de alerta, normalmente indicando condição de join mal escrita.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Dynamic Partition Pruning (DPP):\u003c/strong> quando uma fato particionada é juntada com uma dimensão filtrada, o Spark consegue derivar em runtime quais partições da fato podem ser podadas, com base nos valores que sobraram na dimensão. Pode eliminar a maior parte do I/O em modelos star schema. É uma das otimizações de maior impacto em warehouse sobre Spark, e vale citar.\u003c/p>\n\u003ch3 id=\"h-1-7-memória-e-configuração\">1.7 Memória e configuração\u003c/h3>\n\u003cp>A memória de um executor se divide em:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Reserved memory\u003c/strong>: uma fatia fixa para o próprio Spark.\u003c/li>\u003cli>\u003cstrong>Unified memory\u003c/strong> (fração configurável do restante, padrão 0,6), dividida entre:\u003cul>\u003cli>\u003cstrong>Execution memory\u003c/strong>: shuffle, sort, hash tables de join, agregações.\u003c/li>\u003cli>\u003cstrong>Storage memory\u003c/strong>: dados em cache.\u003c/li>\u003cli>As duas se emprestam mutuamente: execução pode expulsar blocos de cache quando precisa, mas cache não expulsa execução.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>User memory\u003c/strong>: estruturas de dados do código do usuário.\u003c/li>\u003cli>\u003cstrong>Overhead\u003c/strong> (fora do heap): buffers de rede, off-heap do Tungsten, e — importante em PySpark — a memória dos processos Python, que \u003cstrong>não\u003c/strong> vive no heap da JVM. Jobs PySpark que estouram memória frequentemente precisam de mais overhead, não de mais heap.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Configurações que realmente importam\u003c/strong> (e por quê):\u003c/p>\n\u003cul>\u003cli>\u003ccode>spark.sql.shuffle.partitions\u003c/code>: número de partições após shuffle. O padrão histórico é 200, o que é errado para quase todo mundo — pequeno demais para dados grandes, grande demais para dados pequenos. Com AQE, o coalescing corrige o excesso automaticamente, mas o valor inicial ainda importa como teto.\u003c/li>\u003cli>\u003ccode>spark.sql.autoBroadcastJoinThreshold\u003c/code>: limite para broadcast. Aumentar pode dar ganhos grandes; aumentar demais causa OOM.\u003c/li>\u003cli>Número de cores por executor: valores muito altos (acima de ~5) tendem a sofrer com contenção de I/O e GC; muito baixos desperdiçam overhead de JVM por executor. A faixa de 3 a 5 cores por executor é a heurística usual.\u003c/li>\u003cli>Memória por executor: executores gigantes têm pausas de GC longas. Vários executores médios costumam ser melhores que poucos enormes.\u003c/li>\u003cli>\u003ccode>spark.sql.files.maxPartitionBytes\u003c/code>: quanto cada partição lê da fonte, o que determina o paralelismo inicial.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Spill\u003c/strong> é o conceito prático mais útil: quando execution memory não basta, o Spark escreve em disco para continuar. O job não falha, apenas fica muito mais lento. Spill visível na interface é um dos sinais mais confiáveis de que há pressão de memória ou partições grandes demais.\u003c/p>\n\u003ch3 id=\"h-1-8-cache-persist-e-checkpoint\">1.8 Cache, persist e checkpoint\u003c/h3>\n\u003cp>\u003cstrong>\u003ccode>cache()\u003c/code> / \u003ccode>persist()\u003c/code>\u003c/strong> guardam o resultado para reutilização. Níveis: só memória, memória e disco, serializado (menos espaço, mais CPU), com replicação. O padrão para DataFrame é \u003ccode>MEMORY_AND_DISK\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Quando cachear:\u003c/strong> quando o mesmo DataFrame é usado por \u003cstrong>múltiplas ações\u003c/strong> e recomputá-lo é caro. Fora disso, cache é contraproducente: consome memória que a execução precisa, e pode causar spill ou expulsão de dados úteis.\u003c/p>\n\u003cp>\u003cstrong>Erro comum:\u003c/strong> cachear um DataFrame usado uma única vez. Não há ganho — apenas custo de escrita no cache e memória ocupada.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>checkpoint()\u003c/code>\u003c/strong> persiste em storage confiável e \u003cstrong>trunca a linhagem\u003c/strong>. Cache mantém a linhagem (porque o cache pode ser perdido junto com o executor); checkpoint a descarta. Use quando a linhagem ficou longa demais — típico em loops iterativos, onde o plano cresce a cada iteração até o driver ter dificuldade só para planejar.\u003c/p>\n\u003ch3 id=\"h-1-9-spark-structured-streaming-o-essencial\">1.9 Spark Structured Streaming — o essencial\u003c/h3>\n\u003cp>Modelo conceitual: o stream é tratado como uma \u003cstrong>tabela infinita\u003c/strong> à qual linhas são acrescentadas, e a query é reexecutada incrementalmente sobre ela. A mesma API de DataFrame serve batch e streaming, o que é a grande vantagem de manutenção.\u003c/p>\n\u003cp>Pontos que caem:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Micro-batch\u003c/strong> por padrão (latência de segundos), com modo de baixa latência disponível para casos que precisam de milissegundos e abrem mão de algumas operações.\u003c/li>\u003cli>\u003cstrong>Output modes\u003c/strong>: \u003ccode>append\u003c/code> (só linhas novas, o único que funciona para muitas operações), \u003ccode>update\u003c/code> (linhas alteradas), \u003ccode>complete\u003c/code> (o resultado inteiro a cada batch, só viável para agregações pequenas).\u003c/li>\u003cli>\u003cstrong>Checkpoint\u003c/strong> guarda offsets e estado; é obrigatório para recuperação e para exactly-once com sinks idempotentes.\u003c/li>\u003cli>\u003cstrong>Watermark\u003c/strong> define até quando esperar dados atrasados e permite descartar estado antigo. Sem watermark, agregações por janela retêm estado indefinidamente.\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Chamar \u003ccode>collect()\u003c/code> num dataset grande.\u003c/strong> Traz tudo para a memória do driver. É o erro mais rápido de identificar e um dos mais cometidos.\u003c/p>\n\u003cp>\u003cstrong>Cachear indiscriminadamente.\u003c/strong> Cache de DataFrame usado uma vez só é puro custo, e consome memória que a execução precisa — podendo tornar o job mais lento, não mais rápido.\u003c/p>\n\u003cp>\u003cstrong>Achar que aumentar recursos resolve skew.\u003c/strong> A tarefa gargalo continua igual. Mais executores só encarecem o mesmo tempo de execução.\u003c/p>\n\u003cp>\u003cstrong>Usar \u003ccode>coalesce(1)\u003c/code> antes de gravar após uma transformação pesada.\u003c/strong> Reduz o paralelismo de todo o estágio anterior. \u003ccode>repartition(1)\u003c/code> é frequentemente mais rápido no total.\u003c/p>\n\u003cp>\u003cstrong>Não fazer \u003ccode>repartition\u003c/code> pela coluna antes de \u003ccode>partitionBy\u003c/code> na escrita.\u003c/strong> Gera o produto cartesiano de tasks por valores de partição em arquivos pequenos.\u003c/p>\n\u003cp>\u003cstrong>Usar UDF Python quando existe função nativa.\u003c/strong> Quebra a otimização do Catalyst e adiciona serialização entre JVM e Python.\u003c/p>\n\u003cp>\u003cstrong>Ignorar que PySpark usa memória fora do heap.\u003c/strong> Ajustar só \u003ccode>executor.memory\u003c/code> sem ajustar overhead leva a containers mortos pelo gerenciador de recursos, com erro que não parece OOM de JVM.\u003c/p>\n\u003cp>\u003cstrong>Confundir cache com checkpoint.\u003c/strong> Cache mantém a linhagem e pode ser perdido; checkpoint persiste em storage confiável e trunca a linhagem. Problemas diferentes.\u003c/p>\n\u003cp>\u003cstrong>Assumir que \u003ccode>shuffle.partitions = 200\u003c/code> é razoável.\u003c/strong> É o padrão histórico e quase nunca é o valor certo. Com AQE isso importa menos, mas ainda funciona como teto.\u003c/p>\n\u003cp>\u003cstrong>Não olhar a distribuição de tarefas na UI.\u003c/strong> A média esconde skew. O que importa é o máximo comparado à mediana.\u003c/p>\n\u003cp>\u003cstrong>Esquecer watermark em streaming com estado.\u003c/strong> Estado ilimitado, falha semanas depois, difícil de diagnosticar.\u003c/p>\n\u003cp>\u003cstrong>Dizer que \"Spark é rápido porque processa em memória\".\u003c/strong> É uma simplificação que entrevistadores usam como filtro. Spark é rápido por várias razões — otimização de plano, geração de código, execução vetorizada, evitar materializar intermediários — e ele \u003cstrong>usa disco\u003c/strong> o tempo todo, em shuffle e em spill. Dizer só \"in-memory\" sinaliza conhecimento de marketing, não de arquitetura.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. Explique a arquitetura do Spark.","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Tem três papéis. O driver executa o programa principal, constrói e otimiza o plano, quebra em estágios e tarefas, e as agenda. O cluster manager — YARN, Kubernetes ou standalone — aloca recursos. Os executores são processos JVM que rodam as tarefas e mantêm dados em cache.\u003c/p>\n\u003cp>A execução se organiza em job (disparado por uma ação), stage (conjunto de tarefas sem shuffle entre elas — as fronteiras de estágio são exatamente os shuffles) e task (a unidade mínima: uma tarefa processa uma partição).\u003c/p>\n\u003cp>O driver é ponto único de falha, e é onde \u003ccode>collect()\u003c/code> traz os dados — por isso \u003ccode>collect()\u003c/code> num dataset grande estoura a memória do driver.\u003c/p>"},{"titleHtml":"🟢 P2. O que é lazy evaluation e qual a vantagem?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Transformações não executam nada; elas constroem um plano. Só uma ação dispara a execução.\u003c/p>\n\u003cp>A vantagem é que o otimizador vê a query inteira antes de decidir: ele reordena filtros, elimina colunas não usadas, funde operações numa única passada e escolhe algoritmos de join com base no plano completo. Se cada transformação executasse imediatamente, nada disso seria possível.\u003c/p>\n\u003cp>A consequência prática é que um DataFrame não é um resultado, é uma receita. Se você o usa em duas ações, ele é recomputado nas duas — a menos que faça cache. Essa é uma das causas mais comuns de job desnecessariamente lento.\u003c/p>"},{"titleHtml":"🟢 P3. Qual a diferença entre transformação narrow e wide?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Narrow é quando cada partição de saída depende de uma única partição de entrada — \u003ccode>map\u003c/code>, \u003ccode>filter\u003c/code>, \u003ccode>select\u003c/code>. Não há movimentação de dados, e várias narrow consecutivas são fundidas num estágio só.\u003c/p>\n\u003cp>Wide é quando cada partição de saída depende de várias de entrada — \u003ccode>groupBy\u003c/code>, \u003ccode>join\u003c/code>, \u003ccode>distinct\u003c/code>, \u003ccode>orderBy\u003c/code>. Exige shuffle, e portanto cria uma fronteira de estágio.\u003c/p>\n\u003cp>É a distinção central para falar de performance: otimizar um job Spark é, na prática, reduzir o número e o custo dos shuffles.\u003c/p>"},{"titleHtml":"🟢 P4. Diferença entre \u003ccode>repartition\u003c/code> e \u003ccode>coalesce\u003c/code>.","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> \u003ccode>repartition(n)\u003c/code> faz shuffle completo e gera n partições balanceadas; pode aumentar ou diminuir o número. \u003ccode>coalesce(n)\u003c/code> apenas funde partições existentes sem shuffle completo; só diminui, e pode deixar partições desbalanceadas.\u003c/p>\n\u003cp>O detalhe que costuma decidir a resposta: \u003ccode>coalesce\u003c/code> reduz o paralelismo de todo o estágio anterior, porque não há fronteira de shuffle. Se você faz \u003ccode>coalesce(1)\u003c/code> antes de gravar, depois de uma transformação pesada, aquela transformação inteira passa a rodar com uma única task. Nesse caso, \u003ccode>repartition(1)\u003c/code> é mais caro no papel mas normalmente mais rápido no total, porque preserva o paralelismo até o shuffle final.\u003c/p>"},{"titleHtml":"🟡 P5. O que é o Catalyst e o que ele faz?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É o otimizador do Spark SQL, e opera em quatro fases. Análise: resolve nomes contra o catálogo e valida tipos. Otimização lógica: aplica regras de equivalência — predicate pushdown, column pruning, constant folding, simplificação de expressões, reordenação de joins. Planejamento físico: gera candidatos, escolhe algoritmo de join e estratégia de agregação por custo, usando estatísticas. E geração de código: compila o estágio inteiro em bytecode otimizado, eliminando chamadas virtuais e objetos intermediários.\u003c/p>\n\u003cp>A implicação prática mais importante é que ele só enxerga o que consegue analisar. RDD com lambdas arbitrárias é opaco. UDFs em Python também são caixa preta: o Catalyst não otimiza através delas, não empurra predicados, e ainda há custo de serialização entre JVM e Python. Por isso a recomendação de usar funções nativas e API de DataFrame sempre que possível.\u003c/p>"},{"titleHtml":"🟡 P6. O que é AQE e quais problemas resolve?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Adaptive Query Execution é otimização em tempo de execução: entre estágios, o Spark usa estatísticas reais em vez das estimativas feitas antes de executar. Está ligado por padrão desde a 3.2.\u003c/p>\n\u003cp>Resolve três coisas. Coalescing de partições pós-shuffle: olha os tamanhos reais e funde as pequenas até um tamanho alvo, o que corrige o problema clássico do \u003ccode>shuffle.partitions\u003c/code> fixo em 200. Conversão de sort-merge em broadcast join, quando um lado acabou sendo pequeno depois de um filtro cujo efeito não era estimável antes. E skew join: detecta partições muito maiores que a mediana e as divide em sub-partições, replicando o outro lado — o que resolve automaticamente boa parte dos casos que antes exigiam salting manual.\u003c/p>\n\u003cp>O valor conceitual é que ele ataca a causa raiz de planos ruins, que é estimativa de cardinalidade errada.\u003c/p>"},{"titleHtml":"🟡 P7. Quando você usaria \u003ccode>cache()\u003c/code> e quando não?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Cacheio quando o mesmo DataFrame é consumido por \u003cstrong>múltiplas ações\u003c/strong> e recomputá-lo é caro — típico em pipelines que derivam vários resultados do mesmo intermediário, ou em algoritmos iterativos.\u003c/p>\n\u003cp>Não cacheio quando o DataFrame é usado uma vez só: não há ganho, só custo de escrita no cache e memória ocupada. E memória ocupada por cache é memória que a execução não tem, o que pode causar spill e deixar o job \u003cstrong>mais\u003c/strong> lento. Cache indiscriminado é uma das causas de degradação mais comuns que vejo.\u003c/p>\n\u003cp>Também prefiro não cachear datasets muito maiores que a memória disponível — o cache é parcialmente expulso, e o Spark acaba recomputando partições sem que fique óbvio.\u003c/p>\n\u003cp>Se a linhagem estiver muito longa, especialmente em loops iterativos onde o plano cresce a cada iteração, uso \u003ccode>checkpoint\u003c/code> em vez de cache: ele persiste em storage confiável e trunca a linhagem, enquanto cache a mantém.\u003c/p>"},{"titleHtml":"🟡 P8. Quais estratégias de join o Spark tem e como ele escolhe?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Broadcast hash join envia o lado pequeno inteiro para todos os executores e faz o join local, sem shuffle — é a melhor opção quando cabe, e é escolhida quando o tamanho estimado fica abaixo do threshold de broadcast. Shuffle hash join shuffleia os dois lados e constrói hash table por partição, sem ordenar. Sort merge join shuffleia e ordena os dois lados e faz merge — é o padrão para dois lados grandes, mais caro em CPU mas mais robusto quanto a memória, porque faz spill graciosamente. E broadcast nested loop join, que é fallback para condições que não são de igualdade, com custo quadrático — se aparecer no plano para tabelas grandes, normalmente indica condição de join mal escrita.\u003c/p>\n\u003cp>A escolha depende de tamanho estimado, tipo de condição e configuração. E como as estimativas podem estar erradas, o AQE pode trocar a estratégia em runtime.\u003c/p>\n\u003cp>Vale mencionar também o dynamic partition pruning: ao juntar uma fato particionada com uma dimensão filtrada, o Spark deriva em runtime quais partições da fato podem ser podadas. Em star schema, isso pode eliminar a maior parte do I/O.\u003c/p>"},{"titleHtml":"🟡 P9. Por que UDFs em Python são desencorajadas?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Por dois motivos que se somam.\u003c/p>\n\u003cp>O primeiro é a opacidade para o Catalyst: uma UDF é uma caixa preta, então o otimizador não pode empurrar predicados através dela, não pode eliminar colunas, e não pode incluí-la na geração de código do estágio. Ela quebra a fusão de operadores.\u003c/p>\n\u003cp>O segundo é serialização: os dados precisam sair da JVM, ser serializados, atravessar para um processo Python, ser processados, e voltar. Isso custa CPU e memória — e a memória dos processos Python fica fora do heap da JVM, o que é uma causa comum de OOM mal diagnosticado em PySpark.\u003c/p>\n\u003cp>Pandas UDF, ou UDF vetorizada com Arrow, reduz muito o custo de serialização porque transfere em lote num formato colunar compartilhado, mas continua opaca ao otimizador. A ordem de preferência é: função nativa do Spark SQL primeiro, Pandas UDF se não houver nativa, UDF Python linha a linha como último recurso.\u003c/p>"},{"titleHtml":"🔴 P10. Um job Spark que rodava em 20 minutos passou a levar 3 horas. Como você investiga?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Começo pela Spark UI, olhando os estágios em ordem de duração, para localizar onde o tempo foi.\u003c/p>\n\u003cp>Dentro do estágio lento, olho a \u003cstrong>distribuição de duração das tarefas\u003c/strong>. Se a mediana é baixa e o máximo é altíssimo, é skew — e aí investigo a chave de shuffle, procurando NULLs ou valores sentinela concentrados. Se todas as tarefas estão uniformemente lentas, é volume, recursos ou I/O.\u003c/p>\n\u003cp>Verifico \u003cstrong>spill\u003c/strong> de memória e disco nas métricas do estágio. Spill alto significa pressão de memória: ou as partições cresceram, ou alguém adicionou cache, ou o volume aumentou. É um dos sinais mais confiáveis.\u003c/p>\n\u003cp>Verifico se o \u003cstrong>plano mudou\u003c/strong>. A causa mais comum de regressão brusca é a perda de um broadcast join: a tabela que era pequena cresceu e passou do threshold, e o que era broadcast virou sort-merge com shuffle de terabytes. Comparo o plano físico com o histórico.\u003c/p>\n\u003cp>Verifico \u003cstrong>número e tamanho de partições de entrada\u003c/strong>. Se a origem passou a ter muitos arquivos pequenos, o paralelismo explode e o overhead domina. Se passou a ter poucos arquivos grandes não splittable, o paralelismo colapsa.\u003c/p>\n\u003cp>Verifico \u003cstrong>tempo de GC\u003c/strong>. GC alto indica executores grandes demais, cache excessivo ou objetos intermediários demais.\u003c/p>\n\u003cp>E verifico o ambiente: contenção com outros jobs no cluster, degradação do storage, mudança de versão do runtime.\u003c/p>\n\u003cp>O erro que eu evitaria é aumentar recursos antes de diagnosticar. Se a causa é skew, mais executores não mudam nada — a tarefa gargalo continua a mesma, e você só paga mais caro pelo mesmo tempo.\u003c/p>"},{"titleHtml":"🔴 P11. Você tem um join entre uma tabela de 10 TB e outra de 50 GB. O job falha com OOM. O que faz?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Primeiro entendo \u003cstrong>onde\u003c/strong> o OOM acontece, porque a causa é diferente em cada caso.\u003c/p>\n\u003cp>\u003cstrong>Se é no driver\u003c/strong>, quase sempre é uma tentativa de broadcast de algo grande demais — o driver coleta o lado a ser transmitido antes de distribuir — ou um \u003ccode>collect()\u003c/code> indevido no código. Se o Spark está tentando fazer broadcast de 50 GB porque a estimativa de tamanho está errada (comum quando as estatísticas não existem ou quando há compressão), desabilito o broadcast para esse join ou corrijo o threshold.\u003c/p>\n\u003cp>\u003cstrong>Se é nos executores\u003c/strong>, as causas prováveis são: partições grandes demais depois do shuffle; skew concentrando dados numa tarefa; ou hash table de shuffle hash join que não cabe.\u003c/p>\n\u003cp>O que eu faria, em ordem:\u003c/p>\n\u003cp>\u003cstrong>Reduzir o que entra no join.\u003c/strong> Filtrar e projetar antes. Frequentemente os 50 GB viram 2 GB depois de aplicar o filtro de data e selecionar só as colunas necessárias — e aí broadcast passa a ser viável, o que elimina o shuffle e resolve tudo. Essa é a intervenção de maior retorno e a mais esquecida.\u003c/p>\n\u003cp>\u003cstrong>Verificar skew\u003c/strong>, comparando bytes por tarefa. Se houver, ligar AQE (se estiver desligado) ou aplicar salting.\u003c/p>\n\u003cp>\u003cstrong>Aumentar o número de partições de shuffle\u003c/strong>, para que cada tarefa processe menos dados. É o ajuste mais direto contra partição grande demais.\u003c/p>\n\u003cp>\u003cstrong>Forçar sort-merge join\u003c/strong> em vez de shuffle hash join, porque ele faz spill de forma graciosa em vez de estourar.\u003c/p>\n\u003cp>\u003cstrong>Ajustar a memória\u003c/strong>, incluindo o overhead — especialmente se for PySpark, onde os processos Python vivem fora do heap e o sintoma de falta de overhead é o container ser morto pelo gerenciador de recursos, não um OOM de JVM.\u003c/p>\n\u003cp>E, se esse join for recorrente, consideraria co-particionar as duas tabelas pela chave (bucketing), o que elimina o shuffle permanentemente ao custo de reescrevê-las uma vez.\u003c/p>"},{"titleHtml":"🔴 P12. Explique o que acontece quando você chama \u003ccode>df.write.partitionBy(\"data\").parquet(...)\u003c/code> e quais problemas isso pode causar.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O Spark escreve os dados em diretórios separados por valor de \u003ccode>data\u003c/code>. Cada task escreve os registros que possui para os diretórios correspondentes às datas presentes na sua partição.\u003c/p>\n\u003cp>Daí vêm dois problemas.\u003c/p>\n\u003cp>\u003cstrong>Explosão de arquivos.\u003c/strong> Se você tem 200 partições em memória e 30 datas distintas, no pior caso são 6.000 arquivos — 200 por data, cada um pequeno. É o mecanismo pelo qual small files surgem em pipelines aparentemente normais. A solução é fazer \u003ccode>repartition(\"data\")\u003c/code> antes de gravar, garantindo que cada data esteja concentrada em poucas tasks, e portanto em poucos arquivos.\u003c/p>\n\u003cp>\u003cstrong>Skew na escrita.\u003c/strong> Se \u003ccode>repartition(\"data\")\u003c/code> for feito e uma data tiver muito mais dados que as outras, uma task fica com todo o volume daquela data. O compromisso é \u003ccode>repartition(n, \"data\")\u003c/code>, que distribui cada data por n tasks — trocando um pouco mais de arquivos por escrita balanceada.\u003c/p>\n\u003cp>Há ainda dois cuidados. \u003cstrong>Cardinalidade da coluna de particionamento\u003c/strong>: particionar por algo de alta cardinalidade gera milhões de diretórios com arquivos minúsculos e degrada listagem e planejamento. E \u003cstrong>modo de escrita\u003c/strong>: \u003ccode>overwrite\u003c/code> com particionamento estático pode apagar a tabela inteira em vez de só as partições afetadas, dependendo da configuração de overwrite dinâmico — é uma armadilha destrutiva e bem conhecida. Em tabelas gerenciadas por formato transacional, prefiro usar as operações do próprio formato, que tratam isso de forma segura e atômica.\u003c/p>"},{"titleHtml":"🔴 P13. Como você dimensionaria um cluster Spark para um job novo?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Não começaria pelo cluster, começaria pelo dado, porque o dimensionamento é derivado dele.\u003c/p>\n\u003cp>\u003cstrong>Volume e paralelismo.\u003c/strong> Estimo quantos dados são lidos e quantas partições isso gera. Quero partições na casa de 128 a 256 MB, o que me dá o número de tarefas. O número de cores deve estar na mesma ordem de grandeza do número de tarefas — mais cores que tarefas é desperdício, muito menos significa várias ondas de execução, o que é aceitável mas alonga o job.\u003c/p>\n\u003cp>\u003cstrong>Cores por executor.\u003c/strong> Uso a heurística de 3 a 5. Acima disso há contenção de I/O e a JVM sofre; abaixo, o overhead fixo por executor se multiplica.\u003c/p>\n\u003cp>\u003cstrong>Memória por executor.\u003c/strong> Estimo pelo maior estado que uma tarefa precisa segurar: a maior partição de shuffle, a hash table do maior join, mais folga para overhead. Prefiro vários executores médios a poucos gigantes, porque executores grandes têm pausas de GC longas e uma falha custa mais trabalho perdido. Em PySpark, reservo overhead adicional explicitamente, porque os processos Python ficam fora do heap.\u003c/p>\n\u003cp>\u003cstrong>Shuffle partitions.\u003c/strong> Ajusto para que cada partição pós-shuffle fique na faixa alvo. Com AQE ligado, o coalescing corrige o excesso automaticamente, então errar para mais é mais seguro que errar para menos.\u003c/p>\n\u003cp>Depois disso, eu \u003cstrong>mediria\u003c/strong>: rodo com uma amostra representativa, olho a UI e ajusto pelo que aparecer — spill indica falta de memória ou partições grandes; tarefas muito curtas indicam paralelismo excessivo; cores ociosos indicam partições de menos.\u003c/p>\n\u003cp>E consideraria alocação dinâmica, que ajusta o número de executores conforme a demanda dos estágios — útil quando o job tem estágios de necessidades muito diferentes, e útil para custo, embora adicione latência de escala.\u003c/p>"},{"titleHtml":"🔴 P14. Qual a diferença entre RDD, DataFrame e Dataset, e o que você usaria hoje?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> RDD é a abstração original: uma coleção distribuída de objetos, com API funcional e sem schema. Dá controle total, mas é opaco ao otimizador — o Spark não enxerga dentro de uma lambda arbitrária, então não há predicate pushdown, nem column pruning, nem geração de código.\u003c/p>\n\u003cp>DataFrame é uma coleção distribuída com schema, conceitualmente uma tabela. As operações são expressas como expressões que o Catalyst entende e otimiza, e a execução usa o formato binário do Tungsten em vez de objetos JVM. É por isso que a mesma lógica em DataFrame roda muito mais rápido que em RDD.\u003c/p>\n\u003cp>Dataset é o DataFrame tipado, disponível em Scala e Java: tem schema e passa pelo Catalyst, mas oferece verificação de tipos em tempo de compilação. Em Python não existe distinção prática, porque a linguagem não é tipada estaticamente — \u003ccode>DataFrame\u003c/code> é \u003ccode>Dataset[Row]\u003c/code>.\u003c/p>\n\u003cp>Hoje eu usaria DataFrame/SQL por padrão. Iria para RDD só em casos que a API estruturada não expressa — controle fino de particionamento, algoritmos customizados sobre dados não tabulares — e aceitando conscientemente que perco a otimização.\u003c/p>\n\u003cp>O ponto conceitual por trás disso é que a API estruturada é \u003cstrong>declarativa\u003c/strong>: você diz o que quer e o engine decide como. RDD é imperativo: você diz como, e o engine só executa. A camada declarativa é o que permite melhorar o desempenho sem mudar seu código — e é literalmente o que aconteceu com AQE, que acelerou jobs existentes sem que ninguém reescrevesse nada.\u003c/p>"},{"titleHtml":"🔴 P15. No Structured Streaming, o que acontece se você não definir um watermark numa agregação por janela?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O Spark não tem como saber quando uma janela pode ser considerada fechada, então ele mantém o estado de \u003cstrong>todas\u003c/strong> as janelas abertas indefinidamente, para o caso de chegar um evento atrasado pertencente a qualquer uma delas.\u003c/p>\n\u003cp>O resultado é que o estado cresce sem limite. O job funciona bem no começo e degrada progressivamente: checkpoints ficam cada vez mais lentos, o uso de memória sobe, a latência aumenta, e eventualmente ele falha por falta de memória. O modo de falha característico é aparecer semanas depois do deploy, quando ninguém associa mais o incidente à mudança — o que torna esse um dos bugs mais frustrantes de streaming.\u003c/p>\n\u003cp>O watermark resolve declarando quanto atraso você tolera. Quando o watermark ultrapassa o fim de uma janela, o resultado é finalizado e o estado é descartado. O custo é que eventos que chegarem depois disso são ignorados — e por isso o valor do watermark é uma decisão de negócio entre latência, custo de estado e tolerância a perda, não um número técnico.\u003c/p>\n\u003cp>Vale notar que watermark também interage com o output mode: em modo \u003ccode>append\u003c/code>, a linha de uma janela agregada só é emitida quando o watermark a fecha, então um watermark longo atrasa a saída na mesma medida. E que o mesmo raciocínio vale para joins entre streams e para deduplicação com estado — qualquer operação que mantenha estado por chave precisa de um limite temporal, senão o estado é ilimitado por construção.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"O que é \u003cstrong>lazy evaluation\u003c/strong> no Spark?","a":["Executar transformações em threads de baixa prioridade","Transformações só constroem o plano; a execução acontece na ação (count, write, collect) — o que permite ao otimizador ver a query inteira antes de decidir","Adiar a leitura do disco até a memória encher","Compactar o DAG antes de executar"],"c":1,"e":"Consequência prática: um DataFrame é uma receita, não um resultado. Usá-lo em duas ações recomputa tudo duas vezes — a menos que haja cache. E as fronteiras de estágio são exatamente os shuffles."},{"n":"🟢","levelName":"basico","q":"Qual a diferença entre transformações \u003cstrong>narrow e wide\u003c/strong>?","a":["Narrow usam pouca memória; wide usam muita","Narrow: cada partição de saída depende de uma de entrada (map, filter) — sem movimentação, fundidas num estágio; wide: dependem de várias (groupBy, join) — exigem shuffle e criam fronteira de estágio","Narrow rodam no driver; wide nos executores","Wide são sempre mais rápidas por paralelizarem mais"],"c":1,"e":"É o vocabulário central de performance em Spark: otimizar um job é reduzir o número e o custo dos shuffles."},{"n":"🟡","levelName":"intermediario","q":"Qual o perigo de \u003cstrong>coalesce(1)\u003c/strong> antes de gravar, após uma transformação pesada?","a":["Gera arquivos duplicados","Sem fronteira de shuffle, ele reduz o paralelismo de todo o estágio anterior: a transformação pesada roda com uma única task; repartition(1) costuma ser mais rápido no total","Corrompe o particionamento da tabela","Nenhum — coalesce é sempre preferível por evitar shuffle"],"c":1,"e":"repartition(1) é mais caro no papel (shuffle completo), mas preserva o paralelismo da transformação até o shuffle final."},{"n":"🟡","levelName":"intermediario","q":"Quais são as três otimizações do \u003cstrong>AQE\u003c/strong> (ligado por padrão desde o Spark 3.2)?","a":["Cache automático, broadcast forçado e compressão","Coalescing de partições pós-shuffle pelos tamanhos reais, conversão de sort-merge em broadcast join quando um lado acabou pequeno, e divisão automática de partições com skew","Vetorização, codegen e pushdown","Realocação de executores, spill preventivo e replicação"],"c":1,"e":"AQE ataca a causa raiz de planos ruins: estimativa de cardinalidade errada. Ele corrige o plano entre estágios usando estatísticas reais — e resolve boa parte do skew que antes exigia salting manual."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>UDFs em Python\u003c/strong> são desencorajadas no Spark?","a":["Porque Python é uma linguagem lenta demais para dados","São caixa preta para o Catalyst (sem pushdown, sem codegen, quebram a fusão de operadores) e pagam serialização JVM↔Python; Pandas UDF reduz a serialização mas continua opaca","Porque não funcionam em clusters Kubernetes","Porque só aceitam tipos numéricos"],"c":1,"e":"Ordem de preferência: função nativa do Spark SQL → Pandas UDF (Arrow) → UDF linha a linha. E a memória dos processos Python vive fora do heap da JVM — causa comum de OOM mal diagnosticado."},{"n":"🟡","levelName":"intermediario","q":"O que \u003cstrong>collect()\u003c/strong> faz e qual o risco?","a":["Materializa o DataFrame no cluster com replicação","Traz todos os dados para a memória do driver — num dataset grande, estoura o driver; é o erro mais clássico do Spark","Compacta as partições em memória","Persiste o resultado em disco local dos executores"],"c":1,"e":"O driver é ponto único de falha e não é dimensionado para receber datasets. Para inspecionar, use show/take; para exportar, escreva em storage."},{"n":"🟡","levelName":"intermediario","q":"Quando \u003cstrong>cache()\u003c/strong> vale a pena — e quando atrapalha?","a":["Sempre vale: memória não utilizada é desperdício","Vale quando o mesmo DataFrame é usado por múltiplas ações e recomputá-lo é caro; atrapalha em uso único — consome memória da execução e pode causar spill, deixando o job mais lento","Só vale em jobs de streaming","Nunca vale com AQE ligado"],"c":1,"e":"E cache ≠ checkpoint: cache mantém a linhagem (pode ser perdido com o executor); checkpoint persiste em storage confiável e trunca a linhagem — para cadeias longas e loops iterativos."},{"n":"🔴","levelName":"avancado","q":"Escrever com \u003cstrong>partitionBy(data)\u003c/strong> tendo 200 partições em memória e 3
