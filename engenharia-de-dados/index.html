 usual é aprovar com limite de valor reduzido.\u003c/p>\n\u003cp>\u003cem>\"Como garante consistência entre as features de treino e as de inferência?\"\u003c/em> Este é o \u003cstrong>training-serving skew\u003c/strong>, e é o problema mais importante e mais subestimado do cenário. Se a feature \"média dos últimos 30 dias\" é calculada de um jeito no batch de treino e de outro no streaming online, o modelo recebe em produção uma distribuição diferente da que viu no treino, e a performance despenca sem erro nenhum aparecer. Mitigações: definir a feature uma vez só e derivar as duas implementações da mesma especificação; usar um feature store que gere ambas; e — o mais confiável — validar continuamente comparando a distribuição das features online com a do treino.\u003c/p>\n\u003cp>\u003cem>\"Como lida com dado atrasado no cálculo das features?\"\u003c/em> Watermark curto, porque a decisão é agora e uma feature ligeiramente desatualizada é melhor que uma feature tardia. Dados que chegam depois corrigem a feature para as próximas transações, não para a que já foi decidida — e isso é aceitável e precisa ser declarado.\u003c/p>\n\u003cp>\u003cem>\"Exactly-once é necessário aqui?\"\u003c/em> Para a decisão, não: cada transação é processada uma vez pelo serviço síncrono. Para as features agregadas, duplicatas inflam contadores, então preciso de deduplicação por ID de transação — mas at-least-once com dedup por chave é suficiente e muito mais barato que transações.\u003c/p>"},{"titleHtml":"🔴 Cenário 3 — Migrar um data warehouse legado para a nuvem","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Enunciado típico:\u003c/strong> \u003cem>\"A empresa tem um Oracle/Teradata on-premise com 15 anos de pipelines. Você foi contratado para migrar. Como conduz?\"\u003c/em>\u003c/p>\n\u003cp>Este cenário testa julgamento e gestão de risco mais do que tecnologia, e é comum em vagas sênior.\u003c/p>\n\u003cp>\u003cstrong>Clarificação.\u003c/strong> Qual a motivação real — custo, performance, fim de suporte, escalabilidade, ou decisão corporativa já tomada? Qual o volume e quantos pipelines? Quantos consumidores e quais são críticos? Há prazo imposto? O time atual conhece a nuvem alvo? Existe documentação e lineage? Qual o apetite a risco de interrupção?\u003c/p>\n\u003cp>\u003cstrong>A primeira resposta que impressiona:\u003c/strong> não é sobre tecnologia, é sobre \u003cstrong>sequenciamento e risco\u003c/strong>. Migração big bang de um warehouse de 15 anos falha com altíssima probabilidade, porque ninguém sabe tudo que depende dele. A abordagem correta é incremental, com convivência.\u003c/p>\n\u003cp>\u003cstrong>Plano.\u003c/strong>\u003c/p>\n\u003cp>\u003cem>Fase 0 — Descoberta.\u003c/em> Inventariar tabelas, pipelines e consumidores. A fonte mais confiável são os \u003cstrong>logs de acesso\u003c/strong>, não a documentação nem as entrevistas — a documentação está desatualizada e as pessoas superestimam o que usam. Tipicamente, uma fração grande dos objetos não é acessada há meses. Classificar por criticidade e por acoplamento. Essa fase revela o escopo real, e frequentemente descobre que 30% do sistema pode simplesmente ser aposentado — o que muda o projeto inteiro.\u003c/p>\n\u003cp>\u003cem>Fase 1 — Definir a arquitetura alvo e a estratégia por objeto.\u003c/em> Para cada pipeline, uma decisão entre: \u003cstrong>rehost\u003c/strong> (mover como está, rápido e sem ganho arquitetural), \u003cstrong>refactor\u003c/strong> (reescrever aproveitando as capacidades novas), \u003cstrong>replace\u003c/strong> (substituir por ferramenta gerenciada) ou \u003cstrong>retire\u003c/strong> (aposentar). Migrar tudo com refactor é caro demais e migrar tudo com rehost desperdiça a migração. A mistura é a resposta, e a proporção depende de criticidade e de vida útil esperada.\u003c/p>\n\u003cp>\u003cem>Fase 2 — Convivência (strangler fig).\u003c/em> Replicar os dados para o novo ambiente e rodar os dois em paralelo. Migrar por domínio, começando pelo menos crítico e mais autocontido, para aprender com baixo risco. Cada domínio migrado tem o resultado \u003cstrong>comparado automaticamente\u003c/strong> entre os dois sistemas por um período — diff de linhas e de métricas-chave. Essa comparação automatizada é o mecanismo central de segurança e o que permite migrar com confiança; sem ela, cada corte é um salto no escuro.\u003c/p>\n\u003cp>\u003cem>Fase 3 — Corte por consumidor.\u003c/em> Redirecionar dashboards e consumidores gradualmente, com possibilidade de rollback. Manter o legado disponível até a confiança estar estabelecida.\u003c/p>\n\u003cp>\u003cem>Fase 4 — Descomissionamento.\u003c/em> Só quando o uso do legado for comprovadamente zero, medido, não presumido.\u003c/p>\n\u003cp>\u003cstrong>Riscos a levantar espontaneamente — é isso que se avalia aqui:\u003c/strong>\u003c/p>\n\u003cp>\u003cem>Divergência de resultados.\u003c/em> Diferenças de tipo, de arredondamento, de tratamento de NULL, de collation e de fuso horário entre os sistemas produzem números ligeiramente diferentes. Isso destrói a confiança do usuário mesmo quando o novo está mais correto. Precisa ser antecipado, medido e explicado.\u003c/p>\n\u003cp>\u003cem>Lógica não documentada.\u003c/em> Regras de negócio embutidas em procedures de 15 anos que ninguém entende e cujo autor saiu da empresa. É a maior fonte de atraso em migrações reais.\u003c/p>\n\u003cp>\u003cem>Consumidores desconhecidos.\u003c/em> Sempre existem — uma planilha crítica de alguém, um script que roda numa máquina esquecida, uma integração com um sistema de terceiros. Por isso o descomissionamento precisa ser medido, não presumido.\u003c/p>\n\u003cp>\u003cem>Modelo de custo diferente.\u003c/em> On-premise é custo fixo já pago; nuvem é variável e proporcional ao uso. Uma consulta ineficiente que era invisível passa a ter fatura. Sem FinOps desde o começo, a migração \"econômica\" fica mais cara — e esse é um resultado comum e embaraçoso.\u003c/p>\n\u003cp>\u003cem>Capacitação do time.\u003c/em> Migrar tecnologia sem migrar competência produz um sistema novo operado com práticas antigas.\u003c/p>\n\u003cp>\u003cstrong>O que eu recomendaria explicitamente:\u003c/strong> não tratar como projeto de migração pura. Aproveitar para consertar o que estava errado — testes de qualidade, lineage, ownership, contratos — nos domínios que serão refatorados de qualquer forma. Mas \u003cstrong>não\u003c/strong> tentar consertar tudo, porque migração com escopo aberto não termina. Definir o que está fora de escopo é tão importante quanto definir o que está dentro.\u003c/p>"},{"titleHtml":"🔴 Cenário 4 — Métricas de produto para milhões de usuários","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Enunciado típico:\u003c/strong> \u003cem>\"Desenhe o sistema de analytics de um produto com 50 milhões de usuários ativos. O time de produto precisa de funis, retenção e testes A/B.\"\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Clarificação.\u003c/strong> Quantos eventos por usuário por dia? Latência aceitável — os dashboards de produto precisam ser de hoje ou de ontem basta? Quantos analistas consultam e com que frequência? Precisa de análise ad hoc ou só de dashboards pré-definidos? Há necessidade de análise por coorte e por usuário individual, ou só agregada? Retenção do histórico?\u003c/p>\n\u003cp>\u003cem>Premissas:\u003c/em> 50 milhões de usuários ativos, 50 eventos/usuário/dia = 2,5 bilhões de eventos/dia. Latência de horas é aceitável para produto; testes A/B precisam de leitura diária.\u003c/p>\n\u003cp>\u003cstrong>Estimativa.\u003c/strong> 2,5 bilhões × 1 KB ≈ 2,5 TB/dia brutos; em Parquet comprimido, ~300 GB/dia; ~110 TB/ano. Média de ~29.000 eventos/s, pico talvez 100.000/s. \u003cstrong>Aqui a escala é real e dita o design\u003c/strong>, ao contrário do cenário 1.\u003c/p>\n\u003cp>\u003cstrong>Arquitetura.\u003c/strong>\u003c/p>\n\u003cp>\u003cem>Ingestão.\u003c/em> SDK no cliente com batching e retry local (essencial em mobile, onde a conexão é intermitente) enviando para um endpoint de coleta que escreve em Kafka. Kafka dimensionado para 100.000 eventos/s no pico — com cerca de 10 MB/s por partição como referência conservadora, isso demanda partições na casa das dezenas a poucas centenas. Chave = \u003ccode>user_id\u003c/code>, para preservar ordem por usuário, o que importa para reconstruir funis e sessões.\u003c/p>\n\u003cp>\u003cem>Deduplicação.\u003c/em> Retry no cliente gera duplicatas com certeza. Cada evento carrega um \u003ccode>event_id\u003c/code> gerado no cliente, e a deduplicação acontece na ingestão dentro de uma janela — não globalmente, porque manter estado de bilhões de IDs para sempre é inviável.\u003c/p>\n\u003cp>\u003cem>Armazenamento.\u003c/em> Object storage com formato de tabela, particionado por data e por tipo de evento. Clustering por \u003ccode>user_id\u003c/code> dentro da partição, porque análise de funil e de retenção agrupa por usuário e isso melhora muito o pruning.\u003c/p>\n\u003cp>\u003cem>Processamento.\u003c/em> Batch horário ou diário para as tabelas modeladas. Não vejo necessidade de streaming: nenhuma decisão de produto é tomada em segundos. Se surgir a demanda de monitoramento operacional em tempo real, adiciono um caminho de streaming apenas para métricas agregadas de saúde, não para toda a análise.\u003c/p>\n\u003cp>\u003cem>Camada de serving — a decisão mais importante aqui.\u003c/em> Analistas fazendo consultas ad hoc sobre 110 TB no warehouse é caro e lento. A resposta é uma combinação:\u003c/p>\n\u003cp>Tabelas \u003cstrong>pré-agregadas\u003c/strong> para as perguntas conhecidas — DAU/MAU por segmento, funis padrão, coortes de retenção. Responde a maior parte das perguntas por uma fração do custo.\u003c/p>\n\u003cp>Um banco \u003cstrong>OLAP de baixa latência\u003c/strong> (ClickHouse, Druid, Pinot) para exploração interativa, alimentado pelo batch. Esses bancos são projetados exatamente para esse padrão: consultas agregadas sobre eventos com latência sub-segundo.\u003c/p>\n\u003cp>O \u003cstrong>lake completo\u003c/strong> disponível para análises profundas e não antecipadas, aceitando que essas são mais lentas e mais caras.\u003c/p>\n\u003cp>\u003cem>Testes A/B.\u003c/em> Atribuição de variante registrada como um evento no momento da exposição, não inferida depois — inferir atribuição é uma fonte clássica de viés. A análise junta exposição com eventos de conversão, e o cálculo de significância estatística é feito sobre isso.\u003c/p>\n\u003cp>\u003cstrong>Aprofundamentos prováveis:\u003c/strong>\u003c/p>\n\u003cp>\u003cem>\"Como calcula retenção D1/D7/D30 eficientemente?\"\u003c/em> Materializo uma tabela de atividade diária por usuário — uma linha por usuário por dia ativo, que é muito menor que a tabela de eventos. A partir dela, retenção é um self-join ou uma window sobre um dataset já reduzido em ordens de grandeza. Calcular retenção direto sobre 110 TB de eventos crus a cada consulta é o erro que torna o sistema caro.\u003c/p>\n\u003cp>\u003cem>\"E \u003ccode>COUNT(DISTINCT user_id)\u003c/code> sobre bilhões de linhas?\"\u003c/em> Exato é caro porque exige shuffle de todos os IDs distintos, e não é incrementalmente combinável — você não pode somar distintos de dois dias para obter o distinto do período. Uso \u003cstrong>HyperLogLog\u003c/strong>: um esboço probabilístico com erro tipicamente abaixo de 2%, que é \u003cstrong>mergeable\u003c/strong> — posso calcular o esboço por dia e combinar para qualquer período sem reprocessar os eventos. Para métricas de produto, 2% de erro é irrelevante e a economia é de ordens de grandeza. Ofereceria o cálculo exato como opção sob demanda para os poucos casos que exijam (relatório financeiro, por exemplo).\u003c/p>\n\u003cp>\u003cem>\"Como lida com evento de schema variável?\"\u003c/em> Eventos de produto evoluem constantemente e cada tipo tem propriedades diferentes. Uso um schema base comum — \u003ccode>event_id\u003c/code>, \u003ccode>user_id\u003c/code>, \u003ccode>event_name\u003c/code>, \u003ccode>timestamp\u003c/code>, contexto de dispositivo — mais um campo de propriedades semiestruturado. Com um tipo variant ou com colunas materializadas para as propriedades mais consultadas, tenho flexibilidade sem perder performance. E um Schema Registry com compatibilidade validada, senão o time de produto quebra a análise sem saber.\u003c/p>"},{"titleHtml":"🟡 P1. Como você decide entre batch e streaming num projeto novo?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Pela pergunta \"qual decisão é tomada com esse dado e em quanto tempo?\". Se ninguém age em menos de um dia, streaming é custo sem retorno.\u003c/p>\n\u003cp>Streaming se justifica quando existe uma ação cujo valor decai rapidamente — bloquear uma fraude, recomendar na sessão, disparar um alerta operacional. E o custo é grande: estado para manter e recuperar, reprocessamento muito mais difícil, testes mais complexos, operação 24/7 e mudança de código com estado sendo dolorosa.\u003c/p>\n\u003cp>Meu padrão é começar em batch e migrar só o que tiver justificativa clara. Também considero micro-batch a cada 5–15 minutos como meio-termo, que atende a maior parte do que as pessoas chamam de tempo real com uma fração da complexidade — e frequentemente é uma mudança de agendamento, não de arquitetura.\u003c/p>"},{"titleHtml":"🟡 P2. Como você estimaria a infraestrutura necessária para um pipeline novo?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Começo pelo volume: eventos por segundo no pico (não a média — pico costuma ser 2 a 5× a média), tamanho médio do evento, e daí volume diário e anual, aplicando o fator de compressão do formato alvo, que costuma ser de 5 a 10× para Parquet sobre JSON.\u003c/p>\n\u003cp>Com isso derivo três coisas. O \u003cstrong>storage\u003c/strong>, que é a conta mais simples e geralmente a menos preocupante. O \u003cstrong>compute de processamento\u003c/strong>, estimado pelo volume por janela dividido pelo throughput que um nó processa, com folga. E o \u003cstrong>throughput de ingestão\u003c/strong>, que define partições do Kafka ou paralelismo do coletor — e é frequentemente o gargalo real, mais que o volume total.\u003c/p>\n\u003cp>Depois verifico o caminho de leitura, que muita gente esquece: quantos usuários consultam, com que frequência, e quanto cada consulta varre. Um sistema pode ser trivial na escrita e caro na leitura.\u003c/p>\n\u003cp>E declaro explicitamente as premissas e o que aconteceria se o volume crescesse 10× — porque o que se avalia aqui é o raciocínio quantitativo, não a exatidão do número.\u003c/p>"},{"titleHtml":"🔴 P3. Como você projetaria um sistema que precisa servir tanto BI quanto um produto voltado ao usuário?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> São padrões de acesso incompatíveis, e a primeira coisa é dizer isso. BI faz poucas consultas complexas varrendo muito dado, com latência de segundos aceitável. Um produto faz milhares de requisições por segundo, cada uma lendo pouquíssimo, com latência de dezenas de milissegundos exigida. Nenhum sistema serve bem os dois.\u003c/p>\n\u003cp>Então eu separaria as camadas de serving compartilhando o pipeline de processamento: uma fonte de verdade no lake/warehouse, e duas materializações a partir dela. Para BI, tabelas modeladas no warehouse. Para o produto, uma camada de baixa latência — key-value store, banco OLAP de latência sub-segundo, ou cache — com apenas os dados e agregados que o produto consome, no formato exato em que ele consome.\u003c/p>\n\u003cp>Os pontos que eu levantaria: \u003cstrong>consistência entre as duas\u003c/strong> — elas vão divergir temporariamente, e é preciso definir quanto é aceitável e como se detecta divergência; \u003cstrong>caminho de atualização\u003c/strong>, se é o mesmo job escrevendo nos dois ou uma cascata; e \u003cstrong>SLA diferente\u003c/strong>, porque o produto é caminho crítico de usuário e precisa de disponibilidade e alerta em outro patamar. E deixaria explícito que a camada do produto é derivada, não uma segunda fonte de verdade — senão em dois anos existem duas verdades.\u003c/p>"},{"titleHtml":"🔴 P4. Como você decidiria construir versus comprar em cada camada da plataforma?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Meu viés padrão é \u003cstrong>comprar ou usar gerenciado\u003c/strong>, e construir apenas onde há diferenciação real. O custo de construir é sistematicamente subestimado porque as pessoas comparam o esforço de fazer funcionar com o preço da ferramenta, ignorando manutenção, plantão, evolução e o custo de o autor sair da empresa.\u003c/p>\n\u003cp>Eu compraria: ingestão de fontes comuns (conectores de SaaS e de bancos são commodity e horríveis de manter), orquestração, catálogo, observabilidade e o warehouse. Nada disso diferencia o negócio.\u003c/p>\n\u003cp>Eu construiria: lógica de negócio e modelagem, que são por definição específicas; integrações com sistemas proprietários da empresa; e qualquer coisa onde a escala ou o requisito seja tão fora do comum que as ferramentas de mercado não atendam — o que é mais raro do que os engenheiros gostam de achar.\u003c/p>\n\u003cp>Os critérios que eu aplicaria: isso é diferenciação competitiva ou infraestrutura? Qual o custo total em 3 anos, incluindo o tempo do time? Qual o custo de sair depois, se a escolha for errada? O time tem capacidade de manter isso quando quem construiu não estiver mais aqui?\u003c/p>\n\u003cp>E acrescentaria uma consideração de fase: startup pequena deve comprar quase tudo, porque tempo de engenharia é o recurso mais escasso. Empresa grande com escala atípica pode ter caso econômico para construir componentes específicos — e frequentemente esse caso aparece quando a fatura da ferramenta gerenciada passa a ser maior que o custo de um time dedicado.\u003c/p>"},{"titleHtml":"🔴 P5. Seu pipeline principal falhou e o dashboard executivo não vai atualizar hoje. O que você faz?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Nesta ordem, e a ordem é o que se avalia.\u003c/p>\n\u003cp>\u003cstrong>Comunicar antes de resolver.\u003c/strong> Avisar os consumidores imediatamente, com o que se sabe e uma estimativa mesmo que grosseira. Descobrir sozinho que o dado está velho é muito pior que ser avisado. Isso leva dois minutos e preserva confiança.\u003c/p>\n\u003cp>\u003cstrong>Deixar claro o estado do dado.\u003c/strong> Um dashboard com dado de ontem sem indicação disso é pior que um dashboard indisponível, porque alguém decide achando que é de hoje. Marcar como desatualizado é ação de contenção e vem antes do diagnóstico.\u003c/p>\n\u003cp>\u003cstrong>Diagnosticar com foco em restaurar, não em entender.\u003c/strong> A pergunta imediata é \"consigo entregar o dado de hoje?\", não \"por que quebrou?\". Se há um caminho de contorno — reprocessar parcialmente, entregar um subconjunto crítico, usar uma fonte alternativa — ele vale mais agora.\u003c/p>\n\u003cp>\u003cstrong>Restaurar, validar antes de publicar.\u003c/strong> Republicar dado errado depois de uma falha é o cenário que realmente destrói confiança.\u003c/p>\n\u003cp>\u003cstrong>Comunicar a normalização\u003c/strong> e o que mudou.\u003c/p>\n\u003cp>\u003cstrong>Depois, e só depois, o post-mortem\u003c/strong> — sem culpados, focado em: por que não foi detectado antes, por que a recuperação foi lenta, e o que muda para não repetir. Cada incidente desses deveria virar um teste ou um alerta novo.\u003c/p>\n\u003cp>O que eu evitaria é sumir para investigar e reaparecer três horas depois com a causa raiz. Durante um incidente, comunicação vale mais que velocidade de diagnóstico.\u003c/p>"}],"quiz":[{"n":"🟡","levelName":"intermediario","q":"Quais as fases corretas dos \u003cstrong>45 minutos\u003c/strong> de uma entrevista de design?","a":["Desenhar a arquitetura → escolher ferramentas → discutir custos","Clarificar (5–8 min) → estimar com números → arquitetura de alto nível → aprofundar onde importa → falhas, operação e evolução","Escolher o stack → justificar → responder objeções","Estimar custos → desenhar → validar com o entrevistador"],"c":1,"e":"Sair desenhando sem clarificar é o erro número um. E declare as premissas em voz alta: vou assumir X, Y, Z — me corrija se algum estiver errado."},{"n":"🟡","levelName":"intermediario","q":"Qual a conversão mais útil para \u003cstrong>estimativas rápidas\u003c/strong>?","a":["1 dia ≈ 10⁴ segundos","1 dia ≈ 10⁵ segundos, então 1.000 eventos/s ≈ 100 milhões de eventos/dia — e dimensione pelo pico (2 a 5× a média), não pela média","1 TB/dia ≈ 3 PB/ano","1 evento JSON ≈ 1 MB"],"c":1,"e":"Outras referências: evento JSON de 0,5–2 KB cai para 50–200 bytes em Parquet comprimido (5–10×); 1 TB/dia ≈ 0,37 PB/ano. O objetivo da estimativa é redirecionar o design para o gargalo real."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>serving analítico ≠ serving de baixa latência\u003c/strong>?","a":["São o mesmo padrão com hardwares diferentes","O warehouse responde poucas consultas complexas sobre bilhões de linhas em segundos; um produto faz milhares de requisições/s lendo pouquíssimo em milissegundos — propor que o produto consulte o warehouse é erro conceitual visível","A diferença é apenas o custo da licença","Baixa latência exige streaming de ingestão"],"c":1,"e":"A solução: fonte de verdade única e duas materializações — tabelas modeladas para BI, e key-value/OLAP de baixa latência (ClickHouse, Druid, Pinot) alimentado pelo pipeline para o produto."},{"n":"🔴","levelName":"avancado","q":"Num sistema de fraude onde a transação \u003cstrong>espera a decisão em 200 ms\u003c/strong>, qual o enquadramento correto?","a":["Um pipeline de streaming com watermark curto","Não é um pipeline de dados: é um serviço síncrono de baixa latência (scoring + feature store online) com pipelines por trás — streaming atualizando features e batch treinando o modelo","Um job batch com frequência de 1 minuto","Uma consulta direta ao data lake por transação"],"c":1,"e":"Confundir o caminho de decisão com o pipeline é o erro central do cenário. E defina o comportamento de degradação: se o feature store cair, aprovar com limite reduzido é a resposta usual — mas é decisão de negócio."},{"n":"🔴","levelName":"avancado","q":"Numa migração de warehouse legado de 15 anos, qual a \u003cstrong>fonte mais confiável\u003c/strong> para o inventário do que é usado?","a":["A documentação oficial do sistema","Os logs de acesso: documentação está desatualizada e pessoas superestimam o que usam — tipicamente uma fração grande dos objetos está morta, e descobrir isso muda o projeto inteiro","Entrevistas com os usuários mais antigos","O diagrama ER original"],"c":1,"e":"Abordagem: strangler fig (convivência), migração por domínio começando pelo menos crítico, comparação automatizada de resultados entre os dois sistemas, e descomissionamento medido — não presumido."},{"n":"🟡","levelName":"intermediario","q":"O entrevistador diz: \u003cem>o dashboard precisa ser em tempo real\u003c/em>. Qual a melhor reação?","a":["Propor Kafka + Flink imediatamente","Perguntar qual decisão é tomada com o dado e em quanto tempo — frequentemente o requisito real é minutos (micro-batch resolve) ou a pessoa quer um alerta, que é muito mais barato que um dashboard","Recusar o requisito como inviável","Aceitar e dimensionar para milissegundos"],"c":1,"e":"E perguntar: o número pode mudar depois de exibido? Streaming com late data se corrige retroativamente, e muita gente pede tempo real e depois reclama que o valor de ontem mudou."},{"n":"🟡","levelName":"intermediario","q":"COUNT(DISTINCT user_id) diário sobre bilhões de eventos, combinável por período. Qual a abordagem?","a":["Calcular exato todo dia sobre a tabela completa","HyperLogLog: esboço probabilístico com erro &lt; 2%, mergeable — calcula-se por dia e combina-se para qualquer período sem reprocessar; distintos exatos não são combináveis entre dias","Amostrar 1% dos usuários e extrapolar","Manter uma tabela com todos os IDs vistos por dia"],"c":1,"e":"Distinto de dois dias não é a soma dos distintos. Para métricas de produto, 2% de erro é irrelevante; ofereça o exato sob demanda para casos que exijam (financeiro)."},{"n":"🟡","levelName":"intermediario","q":"Propor Kafka + Flink + lakehouse para \u003cstrong>100 mil eventos/dia\u003c/strong> sinaliza o quê?","a":["Domínio das tecnologias modernas","Falta de julgamento: superdimensionar é erro que reprova — reconhecer que um Postgres e um cron resolvem, e dizer em que ponto deixariam de valer, é resposta muito mais forte","Preparação para crescimento futuro, sempre desejável","Alinhamento com as melhores práticas de mercado"],"c":1,"e":"100 mil eventos/dia ≈ 1 evento/s. A senioridade aparece em parear complexidade com o problema — e em explicitar o limite em que a resposta simples quebra."}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('site-data').textContent);
const SKEY = 'estudos:' + DATA.siteKey;
const LETTERS = ['A','B','C','D','E'];

/* ------- progresso em localStorage ------- */
function getMark(topicId, idx){ return localStorage.getItem(SKEY + ':' + topicId + ':' + idx) || ''; }
function setMark(topicId, idx, v){
  const k = SKEY + ':' + topicId + ':' + idx;
  if (v) localStorage.setItem(k, v); else localStorage.removeItem(k);
}
function getQuizAns(topicId, idx){
  const v = localStorage.getItem(SKEY + ':quiz:' + topicId + ':' + idx);
  return v === null ? null : +v;
}
function setQuizAns(topicId, idx, v){ localStorage.setItem(SKEY + ':quiz:' + topicId + ':' + idx, String(v)); }
function clearQuiz(topicId){
  const t = DATA.topics.find(x => x.id === topicId);
  if (!t) return;
  t.quiz.forEach((_, i) => localStorage.removeItem(SKEY + ':quiz:' + topicId + ':' + i));
}
function topicProgress(t){
  let done = 0;
  t.cards.forEach((c, i) => { if (getMark(t.id, i)) done++; });
  return { done, total: t.cards.length };
}
function quizProgress(t){
  let answered = 0, correct = 0;
  t.quiz.forEach((q, i) => {
    const a = getQuizAns(t.id, i);
    if (a !== null){ answered++; if (a === q.c) correct++; }
  });
  return { answered, correct, total: t.quiz.length };
}

/* ------- sidebar ------- */
function renderSidebar(activeId){
  const el = document.getElementById('sidebar');
  let h = '<div class="brand"><span class="em">' + DATA.emoji + '</span><h1>' + DATA.title +
          '<small>material de entrevistas</small></h1></div>';
  h += '<a class="nav-item' + (activeId === 'home' ? ' active' : '') + '" href="#home"><span class="num">🏠</span> Início &amp; guia de uso</a>';
  h += '<div class="nav-label">Temas</div>';
  for (const t of DATA.topics){
    const qp = quizProgress(t);
    const badge = qp.total ? (qp.answered ? '🎯 ' + qp.correct + '/' + qp.answered : '🎯 ' + qp.total) : '';
    h += '<a class="nav-item' + (activeId === t.id ? ' active' : '') + '" href="#topic/' + t.id + '">' +
         '<span class="num">' + t.id + '</span><span>' + t.shortTitle + '</span>' +
         '<span class="prog">' + badge + '</span></a>';
  }
  el.innerHTML = h;
}

/* ------- home ------- */
function renderHome(){
  renderSidebar('home');
  const totalQ = DATA.topics.reduce((a,t)=>a+t.cards.length,0);
  const totalZ = DATA.topics.reduce((a,t)=>a+t.quiz.length,0);
  let h = '<div class="topic-head"><h1>' + DATA.emoji + ' ' + DATA.title + '</h1>' +
          '<p class="sub">' + DATA.topics.length + ' temas · ' + totalQ + ' questões abertas comentadas · ' + totalZ + ' questões de múltipla escolha</p></div>';
  h += '<div class="home-grid">';
  for (const t of DATA.topics){
    const qp = quizProgress(t);
    h += '<div class="home-card" onclick="location.hash=\'#topic/' + t.id + '\'">' +
         '<div class="n">TEMA ' + t.id + '</div><div class="t">' + t.shortTitle + '</div>' +
         '<div class="s">' + t.subtitle + '</div>' +
         '<div class="qn">❓ ' + t.cards.length + ' abertas · 🎯 ' + t.quiz.length + ' de múltipla escolha' +
         (qp.answered ? ' — ' + qp.correct + '/' + qp.answered + ' acertos' : '') + '</div></div>';
  }
  h += '</div>';
  h += '<div class="readme"><h2>Como usar este material</h2>' + "<p>Material de estudo conceitual para entrevistas técnicas de Engenharia de Dados. O foco é <strong>entender e defender conceitos</strong>, não escrever código. Não há exercícios para rodar: há explicações densas, perguntas reais de entrevista com respostas modelo, follow-ups esperados e as armadilhas que derrubam candidatos.</p>\n<hr>\n<h2 id=\"h-como-usar-este-material\">Como usar este material</h2>\n<p><strong>1. Faça um diagnóstico primeiro.</strong> Você não sabe seu nível hoje. Cada pergunta está marcada com dificuldade:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Marca</th><th>Nível</th><th>O que significa</th></tr></thead><tbody><tr><td>🟢</td><td><strong>Básico</strong></td><td>Esperado de qualquer candidato, inclusive júnior. Errar aqui elimina.</td></tr><tr><td>🟡</td><td><strong>Intermediário</strong></td><td>Nível pleno. Exige experiência prática e noção de trade-offs.</td></tr><tr><td>🔴</td><td><strong>Avançado</strong></td><td>Sênior / staff. Exige raciocínio sobre sistemas, falhas e decisões de arquitetura.</td></tr></tbody></table></div>\n<p>Passe por cada arquivo lendo <strong>só as perguntas</strong>, sem ler as respostas. Responda em voz alta (isso importa — pensar e falar são habilidades diferentes). Marque cada pergunta:</p>\n<ul><li>✅ respondi bem e completo</li><li>⚠️ sei o conceito mas travei ou fui raso</li><li>❌ não sei</li></ul>\n<p>Se você acerta a maioria das 🟢 mas trava nas 🟡, seu nível é júnior/pleno-inicial. Se acerta as 🟡 com folga e trava nas 🔴, você está em pleno/sênior. Se as 🔴 são confortáveis, foque em <code>12-design-de-sistemas-de-dados.md</code>, que é onde entrevistas sênior realmente se decidem.</p>\n<p><strong>2. Só depois leia o resumo conceitual.</strong> Ler antes de tentar responder cria a ilusão de que você sabe. Você reconhece o conteúdo, mas não consegue produzi-lo sob pressão. Tente responder primeiro, mesmo mal.</p>\n<p><strong>3. Trabalhe as ⚠️ antes das ❌.</strong> Perguntas que você quase sabe rendem mais em menos tempo, e ⚠️ é justamente o que faz você parecer inseguro numa entrevista.</p>\n<p><strong>4. Leia sempre a seção \"Armadilhas comuns\".</strong> É a seção de maior densidade por linha. São erros conceituais específicos que entrevistadores usam de propósito para separar quem decorou de quem entendeu.</p>\n<p><strong>5. Fale em trade-offs, não em respostas finais.</strong> Quase nenhuma pergunta boa de engenharia de dados tem uma resposta certa. Tem uma resposta certa <em>dado um contexto</em>. A resposta que impressiona é sempre da forma: \"depende de X; se X, então A por causa de Y; se não-X, então B, porque o custo de A vira Z\". Se você responde só \"use Kafka\", perdeu a pergunta.</p>\n<hr>\n<h2 id=\"h-índice\">Índice</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>#</th><th>Arquivo</th><th>Tópico</th><th>Peso em entrevistas</th></tr></thead><tbody><tr><td>01</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"01\">01-modelagem-de-dados.md</a></td><td>OLTP vs OLAP, normalização, star/snowflake, SCD, Data Vault</td><td>⭐⭐⭐⭐⭐</td></tr><tr><td>02</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"02\">02-dw-datalake-lakehouse.md</a></td><td>Data warehouse, data lake, lakehouse, formatos de tabela</td><td>⭐⭐⭐⭐</td></tr><tr><td>03</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"03\">03-etl-elt-orquestracao.md</a></td><td>ETL vs ELT, idempotência, backfill, reprocessamento, CDC</td><td>⭐⭐⭐⭐⭐</td></tr><tr><td>04</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"04\">04-batch-streaming.md</a></td><td>Batch vs streaming, event-driven, exactly-once, watermarks</td><td>⭐⭐⭐⭐</td></tr><tr><td>05</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"05\">05-sistemas-distribuidos.md</a></td><td>Particionamento, sharding, shuffle, data skew, CAP</td><td>⭐⭐⭐⭐</td></tr><tr><td>06</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"06\">06-sql-conceitual.md</a></td><td>Window functions, joins, planos de execução, índices</td><td>⭐⭐⭐⭐⭐</td></tr><tr><td>07</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"07\">07-formatos-e-armazenamento.md</a></td><td>Parquet, Avro, ORC, colunar, compressão, file sizing</td><td>⭐⭐⭐</td></tr><tr><td>08</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"08\">08-spark.md</a></td><td>Arquitetura, lazy evaluation, Catalyst, AQE, tuning</td><td>⭐⭐⭐⭐</td></tr><tr><td>09</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"09\">09-kafka.md</a></td><td>Partições, consumer groups, offsets, retenção, EOS</td><td>⭐⭐⭐⭐</td></tr><tr><td>10</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"10\">10-airflow-orquestracao.md</a></td><td>DAGs, scheduling, dependências, sensores, Airflow 3</td><td>⭐⭐⭐</td></tr><tr><td>11</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"11\">11-qualidade-governanca.md</a></td><td>Qualidade, lineage, contratos de dados, LGPD/GDPR</td><td>⭐⭐⭐</td></tr><tr><td>12</td><td><a href=\"#\" class=\"topic-link\" data-topic=\"12\">12-design-de-sistemas-de-dados.md</a></td><td>A pergunta aberta de arquitetura + framework de resposta</td><td>⭐⭐⭐⭐⭐</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"h-trilha-sugerida-de-estudo\">Trilha sugerida de estudo</h2>\n<h3 id=\"h-fase-1-fundamentos-que-sempre-caem-semana-1-2\">Fase 1 — Fundamentos que sempre caem (semana 1–2)</h3>\n<p>Comece por aqui mesmo se você já é experiente. É o que mais aparece e o que mais gente erra por excesso de confiança.</p>\n<ol><li><strong><code>01-modelagem-de-dados.md</code></strong> — a base de tudo. Se você não sabe explicar por que um data warehouse é desnormalizado, nada mais vai fazer sentido.</li><li><strong><code>06-sql-conceitual.md</code></strong> — SQL cai em praticamente 100% das entrevistas. Foque em window functions e no custo de joins.</li><li><strong><code>03-etl-elt-orquestracao.md</code></strong> — idempotência e backfill são o coração do trabalho diário. Entrevistadores adoram porque separa quem já operou pipeline em produção de quem só leu sobre.</li></ol>\n<p><strong>Marco de conclusão:</strong> você consegue desenhar um star schema no papel e explicar SCD Tipo 2 sem consultar nada.</p>\n<h3 id=\"h-fase-2-arquitetura-e-plataforma-semana-3\">Fase 2 — Arquitetura e plataforma (semana 3)</h3>\n<ol><li><strong><code>02-dw-datalake-lakehouse.md</code></strong> — vocabulário obrigatório de qualquer conversa de arquitetura moderna.</li><li><strong><code>07-formatos-e-armazenamento.md</code></strong> — curto, mas rende muito. Explica <em>por que</em> o lakehouse funciona.</li><li><strong><code>05-sistemas-distribuidos.md</code></strong> — é aqui que 🔴 começam a aparecer. Data skew e shuffle explicam metade dos problemas de performance que você vai discutir.</li></ol>\n<p><strong>Marco:</strong> você explica por que Parquet é rápido em analytics e por que particionar por <code>user_id</code> num lake normalmente é má ideia.</p>\n<h3 id=\"h-fase-3-tempo-real-e-ferramentas-semana-4-5\">Fase 3 — Tempo real e ferramentas (semana 4–5)</h3>\n<ol><li><strong><code>04-batch-streaming.md</code></strong> — conceitos primeiro (event time, watermark, semânticas de entrega).</li><li><strong><code>09-kafka.md</code></strong> — depois do 04, porque Kafka é a implementação concreta daqueles conceitos.</li><li><strong><code>08-spark.md</code></strong> — arquitetura e otimização. Prepare-se para explicar um job lento.</li><li><strong><code>10-airflow-orquestracao.md</code></strong> — mais raso conceitualmente, mas cai muito em entrevista de plataforma.</li></ol>\n<p><strong>Marco:</strong> você explica a diferença entre at-least-once e exactly-once, e por que \"exactly-once\" quase nunca significa o que as pessoas acham que significa.</p>\n<h3 id=\"h-fase-4-sênior-semana-6\">Fase 4 — Sênior (semana 6)</h3>\n<ol><li><strong><code>11-qualidade-governanca.md</code></strong> — o que separa engenheiro de dados de \"pessoa que escreve pipeline\".</li><li><strong><code>12-design-de-sistemas-de-dados.md</code></strong> — a rodada que define o nível da oferta. Faça pelo menos 3 dos cenários do arquivo em voz alta, cronometrado em 45 minutos.</li></ol>\n<hr>\n<h2 id=\"h-trilha-comprimida-entrevista-em-1-semana\">Trilha comprimida (entrevista em ~1 semana)</h2>\n<p>Se o tempo é curto, na ordem: <code>01</code> → <code>06</code> → <code>03</code> → <code>12</code> → <code>04</code> → <code>05</code>.</p>\n<p>Esses seis cobrem a maior parte da superfície de uma entrevista técnica genérica. Os demais viram leitura de reforço.</p>\n<hr>\n<h2 id=\"h-ajuste-por-tipo-de-vaga\">Ajuste por tipo de vaga</h2>\n<p>Nem toda vaga de \"engenheiro de dados\" pesa os mesmos tópicos. Descubra na conversa inicial qual é o perfil e reordene:</p>\n<ul><li><strong>Analytics Engineering / dbt / BI-heavy</strong> → 01, 06, 03, 11. Modelagem e SQL dominam; streaming quase não cai.</li><li><strong>Plataforma / Big Data / Spark</strong> → 05, 08, 07, 12. Esperam que você raciocine sobre performance e custo em escala.</li><li><strong>Streaming / Real-time</strong> → 04, 09, 05, 12. Semânticas de entrega e late data são o centro.</li><li><strong>Cloud (AWS/GCP/Azure)</strong> → 02, 07, 03, 12, mais serviços gerenciados específicos do provedor (Redshift/BigQuery/Snowflake, Glue/Dataflow/Databricks).</li><li><strong>Vaga generalista / startup</strong> → tudo, com foco em 12: eles querem alguém que decide arquitetura sozinho.</li></ul>\n<hr>\n<h2 id=\"h-como-responder-bem-independente-do-tópico\">Como responder bem (independente do tópico)</h2>\n<p>Cinco hábitos que valem mais que qualquer conteúdo específico:</p>\n<p><strong>Estruture antes de falar.</strong> Dois segundos de silêncio para organizar são melhores que trinta segundos divagando. \"Vou separar em três partes: o que é, quando usar, e o trade-off principal.\"</p>\n<p><strong>Diga o nome das coisas.</strong> Falar \"quando os dados ficam desbalanceados entre as partições\" é ok. Falar \"data skew\" e depois explicar é melhor. Vocabulário preciso sinaliza experiência real.</p>\n<p><strong>Dê números, mesmo aproximados.</strong> \"Um arquivo Parquet deve ter algo entre 128 MB e 1 GB\" é infinitamente melhor que \"arquivos não devem ser pequenos demais\". Ordem de grandeza correta &gt; precisão.</p>\n<p><strong>Assuma o trade-off explicitamente.</strong> Toda escolha custa algo. Se você apresenta uma solução sem custo, o entrevistador vai concluir que você não conhece o custo.</p>\n<p><strong>Diga \"não sei\" quando não sabe — e continue.</strong> A resposta forte é: \"não conheço esse detalhe específico, mas pelo que sei de X, eu esperaria que funcionasse assim; e verificaria checando Y\". Isso mostra raciocínio. Inventar comportamento de tecnologia é o erro mais fatal da lista, porque destrói a confiança em tudo que você disse antes.</p>\n<hr>\n<h2 id=\"h-nota-sobre-versões\">Nota sobre versões</h2>\n<p>O material reflete o estado do ecossistema em 2026: Kafka em modo KRaft (ZooKeeper removido a partir do Kafka 4.0), Spark 3.x/4.x com AQE ligado por padrão desde a 3.2, Airflow 3 com asset-aware scheduling e DAG versioning, e Apache Iceberg como formato de tabela padrão em lakehouses novos. Detalhes de versão mudam; os conceitos por trás, não. Nas entrevistas, priorize demonstrar o conceito e sinalize quando estiver falando de um comportamento específico de versão.</p>" + '</div>';
  document.getElementById('main').innerHTML = h;
  bindTopicLinks();
  window.scrollTo(0,0);
}

/* ------- tópico ------- */
let currentTab = 'estudo';
let levelFilter = 'todos';
let statusFilter = 'todas';

function renderTopic(id, tab){
  const t = DATA.topics.find(x => x.id === id);
  if (!t){ location.hash = '#home'; return; }
  renderSidebar(id);
  currentTab = tab || currentTab || 'estudo';
  if (currentTab === 'quiz' && !t.quiz.length) currentTab = 'questoes';

  let h = '<div class="topic-head"><h1>' + t.fullTitle + '</h1>' +
          (t.subtitle ? '<p class="sub">' + t.subtitle + '</p>' : '') + '</div>';
  h += '<div class="tabs">' +
       '<button class="tab' + (currentTab==='estudo'?' active':'') + '" onclick="switchTab(\'estudo\')">📖 Estudo</button>' +
       '<button class="tab' + (currentTab==='quiz'?' active':'') + '" onclick="switchTab(\'quiz\')">🎯 Quiz <span class="count">(' + t.quiz.length + ')</span></button>' +
       '<button class="tab' + (currentTab==='questoes'?' active':'') + '" onclick="switchTab(\'questoes\')">❓ Questões abertas <span class="count">(' + t.cards.length + ')</span></button>' +
       '</div>';

  if (currentTab === 'estudo'){
    if (t.toc.length > 1){
      h += '<nav class="toc"><b>Nesta página</b>';
      for (const s of t.toc) h += '<a href="#' + s.id + '" onclick="event.preventDefault();document.getElementById(\'' + s.id + '\').scrollIntoView({behavior:\'smooth\'})">' + s.title + '</a>';
      h += '</nav>';
    }
    h += t.studyHtml || '<p class="empty">Sem conteúdo de estudo neste tema.</p>';
  } else if (currentTab === 'quiz'){
    h += renderQuiz(t);
  } else {
    h += renderOpenQuestions(t);
  }
  document.getElementById('main').innerHTML = h;
  bindTopicLinks();
  window.scrollTo(0,0);
}

/* ------- quiz de múltipla escolha ------- */
function renderQuiz(t){
  const qp = quizProgress(t);
  let h = '<div class="quiz-head">' +
          '<span class="score"><span class="ok">' + qp.correct + '</span> / ' + qp.answered + ' acertos</span>' +
          '<span class="detail">' + qp.answered + ' de ' + qp.total + ' respondidas — clique numa alternativa para responder; a correção aparece na hora.</span>' +
          '<button class="chip" onclick="if(confirm(\'Apagar suas respostas deste tema?\')){clearQuiz(\'' + t.id + '\');route(true);}">↺ Refazer quiz</button>' +
          '</div>';
  t.quiz.forEach((q, i) => {
    const ans = getQuizAns(t.id, i);
    const answered = ans !== null;
    h += '<div class="qz l-' + q.levelName + '" id="qz-' + i + '">' +
         '<div class="qnum">QUESTÃO ' + (i+1) + ' DE ' + t.quiz.length + ' · ' + q.n + '</div>' +
         '<div class="qtext">' + q.q + '</div>';
    q.a.forEach((alt, j) => {
      let cls = 'alt';
      if (answered){
        cls += ' locked';
        if (j === q.c) cls += ' correct';
        else if (j === ans) cls += ' wrong';
        else cls += ' dim';
      }
      const click = answered ? '' : ' onclick="answerQuiz(\'' + t.id + '\',' + i + ',' + j + ')"';
      h += '<div class="' + cls + '"' + click + '><span class="letter">' + LETTERS[j] + '</span><span>' + alt + '</span></div>';
    });
    if (answered){
      const ok = ans === q.c;
      h += '<div class="qz-exp"><span class="verdict ' + (ok?'ok':'nok') + '">' +
           (ok ? '✅ Correto!' : '❌ Você marcou ' + LETTERS[ans] + ' — a correta é ' + LETTERS[q.c] + '.') +
           '</span>' + q.e + '</div>';
    }
    h += '</div>';
  });
  return h;
}
function answerQuiz(tid, i, j){
  if (getQuizAns(tid, i) !== null) return;
  setQuizAns(tid, i, j);
  route(true);
  const el = document.getElementById('qz-' + i);
  if (el) el.scrollIntoView({block:'nearest'});
}

/* ------- questões abertas ------- */
function renderOpenQuestions(t){
  let h = '<div class="q-tools">' +
       chip('nivel','todos','Todos') + chip('nivel','🟢','🟢 Básico') + chip('nivel','🟡','🟡 Intermediário') + chip('nivel','🔴','🔴 Avançado') +
       '<span class="spacer"></span>' +
       chip('status','todas','Todas') + chip('status','pendentes','Não marcadas') + chip('status','revisar','Revisar ⚠️❌') +
       '<button class="chip" onclick="toggleAll(true)">Revelar todas</button>' +
       '<button class="chip" onclick="toggleAll(false)">Ocultar todas</button>' +
       '</div>';
  if (t.questionsIntroHtml) h += '<div class="q-intro">' + t.questionsIntroHtml + '</div>';
  let shown = 0;
  t.cards.forEach((c, i) => {
    const mark = getMark(t.id, i);
    if (levelFilter !== 'todos' && c.level !== levelFilter) return;
    if (statusFilter === 'pendentes' && mark) return;
    if (statusFilter === 'revisar' && mark !== 'meh' && mark !== 'bad') return;
    shown++;
    h += '<div class="card l-' + c.levelName + '" id="card-' + i + '">' +
         '<div class="card-q" onclick="toggleCard(' + i + ')"><span class="qt">' + c.titleHtml + '</span>' +
         '<span class="toggle">mostrar resposta ▾</span></div>' +
         '<div class="card-a">' + c.bodyHtml +
         '<div class="card-mark"><span>Como você foi?</span>' +
         markBtn(t.id, i, 'ok', '✅ Acertei', mark) +
         markBtn(t.id, i, 'meh', '⚠️ Parcial', mark) +
         markBtn(t.id, i, 'bad', '❌ Errei', mark) +
         (mark ? '<button class="mark-btn" onclick="mark(\'' + t.id + '\',' + i + ',\'\')">limpar</button>' : '') +
         '</div></div></div>';
  });
  if (!shown) h += '<p class="empty">Nenhuma questão com esse filtro.</p>';
  return h;
}

function chip(kind, val, label){
  const active = (kind==='nivel' ? levelFilter : statusFilter) === val;
  return '<button class="chip' + (active?' active':'') + '" onclick="setFilter(\'' + kind + '\',\'' + val + '\')">' + label + '</button>';
}
function markBtn(tid, i, v, label, current){
  return '<button class="mark-btn' + (current===v ? ' sel-' + v : '') + '" onclick="mark(\'' + tid + '\',' + i + ',\'' + v + '\')">' + label + '</button>';
}
function setFilter(kind, val){
  if (kind==='nivel') levelFilter = val; else statusFilter = val;
  route();
}
function switchTab(tab){
  currentTab = tab;
  route();
}
function toggleCard(i){
  const el = document.getElementById('card-' + i);
  el.classList.toggle('open');
  el.querySelector('.toggle').textContent = el.classList.contains('open') ? 'ocultar ▴' : 'mostrar resposta ▾';
}
function toggleAll(open){
  document.querySelectorAll('.card').forEach(el => {
    el.classList.toggle('open', open);
    el.querySelector('.toggle').textContent = open ? 'ocultar ▴' : 'mostrar resposta ▾';
  });
}
function mark(tid, i, v){
  setMark(tid, i, v);
  route(true);
  const el = document.getElementById('card-' + i);
  if (el){ el.classList.add('open'); el.querySelector('.toggle').textContent = 'ocultar ▴'; el.scrollIntoView({block:'nearest'}); }
}
function bindTopicLinks(){
  document.querySelectorAll('.topic-link').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      location.hash = '#topic/' + a.dataset.topic;
    });
  });
}

/* ------- roteamento ------- */
function route(keepScroll){
  const hash = location.hash || '#home';
  const scroll = keepScroll ? window.scrollY : 0;
  const m = hash.match(/^#topic\/(\d{2})/);
  if (m) renderTopic(m[1]);
  else renderHome();
  if (keepScroll) window.scrollTo(0, scroll);
  document.getElementById('sidebar').classList.remove('open');
}
window.addEventListener('hashchange', () => { route(); });
route();
</script>
</body>
