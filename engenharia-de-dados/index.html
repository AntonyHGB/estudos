o Real e Semânticas de Entrega","subtitle":"Batch vs streaming · Event time vs processing time · Watermarks e late data · Janelas · At-least-once, at-most-once, exactly-once · Event-driven · Lambda e Kappa","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-a-distinção-real-entre-batch-e-streaming\">1.1 A distinção real entre batch e streaming\u003c/h3>\n\u003cp>A definição comum — \"batch processa em lotes, streaming processa contínuo\" — é verdadeira mas rasa. A distinção que importa numa entrevista é sobre \u003cstrong>limites\u003c/strong>:\u003c/p>\n\u003cp>\u003cstrong>Batch processa um conjunto de dados delimitado (bounded).\u003c/strong> Você sabe onde ele começa e onde termina. Isso permite luxos enormes: reordenar tudo, ver o dataset inteiro antes de decidir, fazer múltiplas passadas, reprocessar do zero de forma barata, e falhar e recomeçar sem consequência.\u003c/p>\n\u003cp>\u003cstrong>Streaming processa um fluxo ilimitado (unbounded).\u003c/strong> Não existe \"o fim\". Isso significa que você nunca tem o conjunto completo, precisa produzir resultados incrementais, precisa decidir \u003cstrong>quando\u003c/strong> considerar um resultado pronto (sem nunca ter certeza de que não chegará mais nada), e precisa manter estado através de falhas porque não pode recomeçar do zero.\u003c/p>\n\u003cp>Essa é a razão de streaming ser mais difícil, e é o insight que faz uma boa resposta. Não é que o dado chega mais rápido — é que você tem que tomar decisões com informação incompleta, para sempre.\u003c/p>\n\u003cp>Uma formulação elegante que vale conhecer: \u003cstrong>batch é um caso especial de streaming\u003c/strong> (um stream com fim conhecido). É a tese por trás de engines unificadas como Apache Beam e do Structured Streaming do Spark, onde a mesma API expressa os dois. O inverso não é verdadeiro.\u003c/p>\n\u003cp>\u003cstrong>Micro-batch\u003c/strong> é o meio-termo: processar lotes muito pequenos em intervalos curtos (segundos). É como o Spark Structured Streaming funciona por padrão. Dá latência de segundos com um modelo de execução mais simples e throughput alto. Streaming \"verdadeiro\" (registro a registro, como Flink) chega a latência de milissegundos ao custo de mais complexidade. Saber que existe esse espectro — e que a escolha é sobre latência versus simplicidade — é melhor que tratar batch e streaming como binário.\u003c/p>\n\u003ch3 id=\"h-1-2-quando-usar-cada-um-a-parte-que-decide-a-resposta\">1.2 Quando usar cada um (a parte que decide a resposta)\u003c/h3>\n\u003cp>A pergunta certa não é \"batch ou streaming\", é \u003cstrong>\"qual é o custo de o dado estar desatualizado por N minutos?\"\u003c/strong>\u003c/p>\n\u003cp>Se ninguém age sobre o dado em menos de um dia — relatório mensal, dashboard consultado de manhã, treino de modelo semanal — streaming é custo sem retorno. Batch é mais barato, mais simples de operar, mais fácil de reprocessar e de testar.\u003c/p>\n\u003cp>Streaming se justifica quando existe uma \u003cstrong>ação com valor decaindo no tempo\u003c/strong>: detecção de fraude (bloquear antes de aprovar), recomendação em sessão, alerta operacional, precificação dinâmica, monitoramento de sistemas, ou quando o próprio produto expõe dados em tempo real ao usuário.\u003c/p>\n\u003cp>Um argumento secundário, mas legítimo: streaming pode ser mais barato que batch quando o volume é altíssimo e o processamento contínuo evita picos de compute gigantes em janelas curtas. E há o caso de a origem \u003cem>ser\u003c/em> um stream — se o dado já vem de Kafka, consumir em streaming pode ser mais simples que orquestrar micro-batches.\u003c/p>\n\u003cp>\u003cstrong>O custo real do streaming\u003c/strong>, que candidatos subestimam:\u003c/p>\n\u003cul>\u003cli>Estado precisa ser mantido, versionado e recuperado em falhas.\u003c/li>\u003cli>Reprocessamento é muito mais difícil: reprocessar um mês de stream exige releitura do log com retenção suficiente, e resultados podem diferir por questões de ordem e timing.\u003c/li>\u003cli>Testar é mais difícil: o comportamento depende de tempo e de ordem de chegada.\u003c/li>\u003cli>Debugar em produção é mais difícil: não há \"a tabela do dia\" para inspecionar.\u003c/li>\u003cli>Operação 24/7: um job de streaming que cai às 3h da manhã acumula lag, e o lag tem que ser recuperado.\u003c/li>\u003cli>Mudança de lógica: fazer deploy de nova versão de um job com estado exige migração de estado ou reprocessamento.\u003c/li>\u003c/ul>\n\u003cp>Numa entrevista, reconhecer explicitamente que \u003cstrong>streaming tem custo operacional muito maior\u003c/strong> e que a maioria dos casos de uso não precisa dele é um sinal forte de senioridade. Muitos candidatos tratam streaming como \"melhor\", quando é apenas diferente e mais caro.\u003c/p>\n\u003ch3 id=\"h-1-3-event-time-vs-processing-time-o-conceito-mais-cobrado\">1.3 Event time vs processing time — o conceito mais cobrado\u003c/h3>\n\u003cp>\u003cstrong>Processing time\u003c/strong>: o instante em que o sistema processou o registro. \u003cstrong>Event time\u003c/strong>: o instante em que o evento realmente aconteceu, no mundo. (Existe ainda o \u003cstrong>ingestion time\u003c/strong>: quando o evento entrou no sistema de mensageria — um meio-termo usado por conveniência.)\u003c/p>\n\u003cp>Eles divergem sempre, e às vezes muito: um app mobile offline pode enviar eventos com horas ou dias de atraso; uma partição de Kafka pode acumular lag; um retry pode reordenar mensagens.\u003c/p>\n\u003cp>\u003cstrong>Por que event time é quase sempre o correto para análise:\u003c/strong> se você conta \"vendas por hora\" usando processing time, um atraso no pipeline move vendas da hora 14 para a hora 15, e o resultado passa a descrever o \u003cem>seu sistema\u003c/em>, não o negócio. Pior: o resultado deixa de ser reprodutível — reprocessar o mesmo dado em outro momento dá números diferentes. Com event time, o resultado é determinístico e reflete a realidade.\u003c/p>\n\u003cp>\u003cstrong>O preço de usar event time\u003c/strong> é que você nunca sabe se todos os eventos de uma janela já chegaram. Isso leva direto ao próximo conceito.\u003c/p>\n\u003ch3 id=\"h-1-4-watermarks-e-late-data\">1.4 Watermarks e late data\u003c/h3>\n\u003cp>Um \u003cstrong>watermark\u003c/strong> é a afirmação do sistema de que \"provavelmente já vi todos os eventos com event time anterior a T\". É uma heurística sobre completude, não uma garantia.\u003c/p>\n\u003cp>Ele resolve o dilema fundamental do streaming: você precisa fechar a janela em algum momento para emitir o resultado, mas fechar cedo demais perde dados e fechar tarde demais aumenta a latência e o custo de manter estado. O watermark é o botão que controla esse trade-off, e ele é explícito e configurável justamente porque a resposta certa depende do negócio.\u003c/p>\n\u003cp>Na prática, o watermark costuma ser derivado do maior event time visto menos uma tolerância configurada (por exemplo, \"maior event time − 10 minutos\"). Quando o watermark passa do fim de uma janela, a janela é considerada completa, o resultado é emitido e o estado pode ser descartado.\u003c/p>\n\u003cp>\u003cstrong>Late data\u003c/strong> é o evento que chega depois de o watermark já ter passado sua janela. Opções de tratamento:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Descartar.\u003c/strong> Simples, e aceitável quando a fração é minúscula e o impacto é irrelevante. Precisa ser \u003cstrong>medido\u003c/strong>, não assumido — instrumentar a contagem de eventos descartados é obrigatório.\u003c/li>\u003cli>\u003cstrong>Enviar para um side output / dead letter\u003c/strong> e processar em batch depois. Padrão pragmático e muito usado.\u003c/li>\u003cli>\u003cstrong>Atualizar o resultado retroativamente.\u003c/strong> Reabrir a janela e reemitir. Exige que o destino suporte update e que os consumidores tolerem números que mudam. Caro em estado, porque exige manter janelas abertas por mais tempo (o \u003ccode>allowedLateness\u003c/code> do Flink, o modo update do Spark).\u003c/li>\u003cli>\u003cstrong>Reprocessamento em batch periódico\u003c/strong> que corrige o resultado do streaming — que é exatamente a ideia da arquitetura Lambda.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>O trade-off do watermark\u003c/strong>, que é a resposta que impressiona: watermark curto significa latência baixa e mais dados perdidos; watermark longo significa latência alta, mais estado retido (mais memória e mais custo) e menos perda. Não existe valor certo — existe uma decisão de negócio sobre quanto atraso é tolerável versus quanto de perda é tolerável. Dizer isso explicitamente é melhor do que citar um número.\u003c/p>\n\u003ch3 id=\"h-1-5-janelas-windowing\">1.5 Janelas (windowing)\u003c/h3>\n\u003cp>Como agregar um fluxo infinito? Recortando-o em janelas.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Tumbling (fixa)\u003c/strong>: intervalos fixos e não sobrepostos. \"A cada 5 minutos.\" Cada evento pertence a exatamente uma janela. É o caso mais comum.\u003c/li>\u003cli>\u003cstrong>Sliding (deslizante)\u003c/strong>: intervalos fixos com sobreposição. \"Últimos 10 minutos, atualizado a cada 1 minuto.\" Cada evento pertence a várias janelas — o que significa mais estado e mais compute. Usado para médias móveis e detecção de tendência.\u003c/li>\u003cli>\u003cstrong>Session\u003c/strong>: janela definida por inatividade. \"Agrupa eventos do mesmo usuário até que ele fique 30 minutos sem atividade.\" Tamanho variável, definido pelos dados. Fundamental para analytics de comportamento.\u003c/li>\u003cli>\u003cstrong>Global\u003c/strong>: uma única janela para todo o stream, fechada por um trigger customizado. Usada quando a lógica de agrupamento não é temporal.\u003c/li>\u003c/ul>\n\u003cp>Um detalhe frequentemente cobrado: janelas deslizantes com muita sobreposição multiplicam o estado. Uma janela de 24 horas deslizando a cada minuto significa que cada evento participa de 1440 janelas. Isso pode ser inviável, e a alternativa costuma ser agregação incremental sobre janelas menores.\u003c/p>\n\u003ch3 id=\"h-1-6-semânticas-de-entrega-o-tópico-onde-mais-gente-erra\">1.6 Semânticas de entrega — o tópico onde mais gente erra\u003c/h3>\n\u003cp>\u003cstrong>At-most-once\u003c/strong>: cada mensagem é entregue zero ou uma vez. Pode perder, nunca duplica. Implementado ao commitar o offset \u003cstrong>antes\u003c/strong> de processar. Aceitável para métricas de telemetria de alto volume onde perder 0,1% não muda nada, e onde latência importa mais que completude.\u003c/p>\n\u003cp>\u003cstrong>At-least-once\u003c/strong>: cada mensagem é entregue uma ou mais vezes. Nunca perde, pode duplicar. Implementado ao commitar o offset \u003cstrong>depois\u003c/strong> de processar com sucesso — se falhar entre processar e commitar, a mensagem é reprocessada. É o padrão da indústria, porque perder dado normalmente é pior que duplicar.\u003c/p>\n\u003cp>\u003cstrong>Exactly-once\u003c/strong>: cada mensagem afeta o resultado final exatamente uma vez.\u003c/p>\n\u003cp>\u003cstrong>E aqui está o ponto que separa candidatos:\u003c/strong> exactly-once \u003cstrong>delivery\u003c/strong> é impossível em sistemas distribuídos, num sentido teórico rigoroso — é o problema dos dois generais. Você nunca pode ter certeza absoluta de que a mensagem chegou sem um ack, e o ack pode se perder. O que os sistemas realmente oferecem é \u003cstrong>exactly-once processing semantics\u003c/strong> (EOS): a mensagem pode ser \u003cem>entregue\u003c/em> várias vezes, mas o \u003cstrong>efeito\u003c/strong> sobre o estado e sobre a saída acontece uma vez só.\u003c/p>\n\u003cp>Isso é obtido combinando três mecanismos:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Deduplicação na entrada\u003c/strong> (o produtor idempotente do Kafka atribui um ID e um número de sequência por partição, e o broker descarta duplicatas de retry).\u003c/li>\u003cli>\u003cstrong>Estado e offsets commitados atomicamente\u003c/strong> — a atualização do estado do processamento e o avanço do offset acontecem na mesma transação, então nunca ficam dessincronizados.\u003c/li>\u003cli>\u003cstrong>Escrita transacional ou idempotente no destino\u003c/strong> — o sink precisa participar, seja com transação (Kafka como destino, via transações), seja com escrita idempotente (upsert por chave).\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>O elo mais fraco é sempre o sink.\u003c/strong> Se o destino não participa da transação e não é idempotente — uma API externa, um arquivo em append, um e-mail — não há exactly-once, por mais que o framework prometa. O Kafka oferece EOS de ponta a ponta apenas quando origem e destino são Kafka (padrão read-process-write), ou quando o sink externo suporta transações ou idempotência via chave.\u003c/p>\n\u003cp>\u003cstrong>A conclusão prática, e a melhor resposta possível para esta pergunta:\u003c/strong> na maioria dos sistemas reais, você implementa \u003cstrong>at-least-once + idempotência no destino\u003c/strong>, e o resultado observável é equivalente a exactly-once, com muito menos complexidade e melhor performance. Exactly-once nativo custa throughput (transações adicionam coordenação e latência) e reduz as opções de arquitetura. Dizer isso mostra que você entende o conceito, não só o vocabulário.\u003c/p>\n\u003ch3 id=\"h-1-7-event-driven-e-arquiteturas\">1.7 Event-driven e arquiteturas\u003c/h3>\n\u003cp>\u003cstrong>Event-driven\u003c/strong> significa que componentes reagem a eventos publicados em vez de serem chamados diretamente. O produtor não sabe quem consome. Isso desacopla os sistemas: adicionar um consumidor novo não exige mudar o produtor.\u003c/p>\n\u003cp>Dois estilos que valem distinguir:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Event notification\u003c/strong>: o evento diz que algo aconteceu, e o consumidor busca os detalhes. Payload pequeno, mas gera chamadas de volta à origem e acopla temporalmente.\u003c/li>\u003cli>\u003cstrong>Event-carried state transfer\u003c/strong>: o evento carrega o estado necessário. O consumidor não precisa consultar ninguém. Payload maior, mas desacoplamento real — e é o que permite ao consumidor reconstruir seu estado relendo o log.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Event sourcing\u003c/strong> é mais radical: o log de eventos \u003cstrong>é\u003c/strong> a fonte de verdade, e o estado atual é uma projeção derivada dele. Permite reconstruir qualquer estado passado e criar novas visões relendo o histórico. O custo é complexidade alta e a necessidade de lidar com evolução de schema de eventos ao longo de anos.\u003c/p>\n\u003cp>\u003cstrong>CQRS\u003c/strong> (Command Query Responsibility Segregation) separa o modelo de escrita do modelo de leitura, frequentemente combinado com event sourcing. Vale conhecer o nome; raramente é o foco de uma entrevista de dados.\u003c/p>\n\u003cp>\u003cstrong>Arquitetura Lambda\u003c/strong>: duas camadas paralelas — uma batch, que reprocessa tudo e produz a verdade, e uma speed/streaming, que dá resultado aproximado com baixa latência. A camada de serving combina as duas. Resolve o problema de correção versus latência, mas o custo é manter \u003cstrong>duas implementações da mesma lógica\u003c/strong>, em linguagens e frameworks diferentes, que precisam concordar. Divergência entre elas é a fonte clássica de bugs.\u003c/p>\n\u003cp>\u003cstrong>Arquitetura Kappa\u003c/strong>: só streaming. Reprocessamento é feito relendo o log desde o início com a nova versão do código. Elimina a duplicação de lógica, ao custo de exigir retenção longa no log e um sistema de streaming maduro o suficiente para servir também como camada de reprocessamento em alto throughput.\u003c/p>\n\u003cp>A visão contemporânea: com engines unificadas (Beam, Structured Streaming, Flink) e formatos de tabela que suportam upsert e time travel, a distinção Lambda/Kappa perdeu força — você escreve uma lógica que roda nos dois modos sobre a mesma tabela. Mas o problema conceitual que Lambda tentava resolver (resultado aproximado agora versus correto depois) continua real, e frequentemente a solução prática é streaming produzindo o resultado corrente mais um job de reconciliação em batch corrigindo periodicamente — que é Lambda em espírito, com implementação compartilhada.\u003c/p>\n\u003ch3 id=\"h-1-8-estado-checkpointing-e-recuperação\">1.8 Estado, checkpointing e recuperação\u003c/h3>\n\u003cp>Um job de streaming com agregação mantém \u003cstrong>estado\u003c/strong> (as contagens parciais das janelas abertas, o estado de sessão por usuário, as tabelas de join). Se o job cair, esse estado precisa sobreviver.\u003c/p>\n\u003cp>\u003cstrong>Checkpoint\u003c/strong> é a persistência periódica e consistente do estado mais a posição de leitura no stream. Na recuperação, o job retoma do último checkpoint e reprocessa a partir dali. Isso é o que torna at-least-once possível, e — quando combinado com commit transacional — o que torna EOS possível.\u003c/p>\n\u003cp>O algoritmo clássico é o \u003cstrong>Chandy-Lamport\u003c/strong> (snapshot distribuído assíncrono), usado pelo Flink através de barreiras que fluem pelo grafo de operadores, permitindo capturar um estado global consistente sem parar o processamento.\u003c/p>\n\u003cp>Pontos práticos que aparecem em perguntas avançadas:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Frequência do checkpoint\u003c/strong> é um trade-off: mais frequente significa menos reprocessamento na recuperação, mas mais overhead constante.\u003c/li>\u003cli>\u003cstrong>Estado grande é um problema em si.\u003c/strong> Um job com dezenas de GB de estado tem checkpoints lentos e recuperação lenta. Backends de estado que gravam em disco local com upload incremental (RocksDB no Flink) existem por isso.\u003c/li>\u003cli>\u003cstrong>Mudança de código com estado\u003c/strong> é dolorosa: se você altera a estrutura do estado, o checkpoint antigo pode ficar incompatível. Savepoints (checkpoints explícitos e versionados) existem para migração planejada.\u003c/li>\u003cli>\u003cstrong>TTL de estado\u003c/strong> é obrigatório em qualquer job que mantém estado por chave (por exemplo, sessões por usuário). Sem expiração, o estado cresce para sempre e o job morre — normalmente semanas depois de entrar em produção, quando ninguém está olhando.\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Dizer que exactly-once é simplesmente possível.\u003c/strong> Sem distinguir delivery de processing semantics, e sem mencionar que o sink precisa participar, a resposta soa decorada. Entrevistadores usam essa pergunta justamente como filtro.\u003c/p>\n\u003cp>\u003cstrong>Tratar streaming como \"melhor\" que batch.\u003c/strong> Streaming é mais caro em operação, em reprocessamento, em testes e em debug. A resposta madura começa por perguntar se a latência é necessária.\u003c/p>\n\u003cp>\u003cstrong>Confundir event time com processing time em agregações.\u003c/strong> Agregar por processing time faz o resultado descrever o seu pipeline em vez do negócio, e destrói a reprodutibilidade. É um erro que passa despercebido até alguém comparar dois reprocessamentos.\u003c/p>\n\u003cp>\u003cstrong>Achar que watermark garante completude.\u003c/strong> É heurística. Sempre há dado que chega depois, e você precisa de uma estratégia explícita para ele — e de instrumentação medindo quanto está sendo descartado.\u003c/p>\n\u003cp>\u003cstrong>Esquecer TTL no estado.\u003c/strong> Um job que mantém estado por chave sem expiração cresce até morrer. Costuma quebrar semanas depois do deploy, quando ninguém associa mais o incidente à mudança.\u003c/p>\n\u003cp>\u003cstrong>Achar que adicionar consumidores sempre aumenta o throughput em Kafka.\u003c/strong> O paralelismo máximo de um consumer group é o número de partições. Consumidores extras ficam ociosos.\u003c/p>\n\u003cp>\u003cstrong>Ignorar que o sink pode ser o gargalo.\u003c/strong> Muito job \"lento\" está apenas esperando um destino lento. Escalar o processamento nesse caso não melhora nada e às vezes piora.\u003c/p>\n\u003cp>\u003cstrong>Monitorar \"o job está rodando\" em vez de consumer lag.\u003c/strong> Um job pode estar tecnicamente vivo e 6 horas atrasado. O sintoma que importa é lag, medido em tempo.\u003c/p>\n\u003cp>\u003cstrong>Propor join entre dois streams sem mencionar limite temporal de estado.\u003c/strong> Sem janela, o estado é ilimitado. Essa é a primeira coisa que um entrevistador espera ouvir nessa pergunta.\u003c/p>\n\u003cp>\u003cstrong>Subestimar a dificuldade de mudar código com estado.\u003c/strong> \"É só fazer deploy\" é a resposta de quem nunca operou streaming. Savepoints, compatibilidade de estado e deploy paralelo são o vocabulário certo.\u003c/p>\n\u003cp>\u003cstrong>Aceitar \"tempo real\" como requisito sem interrogar.\u003c/strong> Traduzir a exigência em decisão de negócio e em custo é parte do trabalho, e entrevistadores frequentemente estão testando exatamente isso.\u003c/p>\n\u003cp>\u003cstrong>Confundir micro-batch com batch.\u003c/strong> Spark Structured Streaming em micro-batch é streaming: mantém estado, offsets e semântica de janela. A diferença para streaming registro-a-registro é latência, não modelo.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. Qual a diferença entre processamento batch e streaming?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Batch processa um conjunto delimitado — você sabe onde começa e termina, pode ver tudo antes de decidir, fazer múltiplas passadas e reprocessar do zero barato. Streaming processa um fluxo ilimitado: nunca existe o conjunto completo, então você produz resultados incrementais, tem que decidir quando considerar uma janela pronta sem ter certeza de que não chega mais nada, e tem que manter estado através de falhas.\u003c/p>\n\u003cp>Essa é a razão de streaming ser mais difícil: não é a velocidade, é ter que decidir com informação permanentemente incompleta.\u003c/p>"},{"titleHtml":"🟢 P2. Quando você escolheria streaming em vez de batch?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Quando existe uma ação cujo valor decai rapidamente com o tempo: detecção de fraude que precisa bloquear antes de aprovar, recomendação dentro da sessão, alerta operacional, precificação dinâmica. Se ninguém age sobre o dado em menos de um dia, streaming é custo sem retorno.\u003c/p>\n\u003cp>E o custo é grande: estado para manter e recuperar, reprocessamento muito mais difícil, testes mais complexos, e operação 24/7. Por padrão eu iria de batch e só migraria o que tivesse justificativa de negócio clara.\u003c/p>"},{"titleHtml":"🟢 P3. O que é event time e processing time?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Event time é quando o evento aconteceu no mundo real; processing time é quando o sistema o processou. Eles divergem sempre — app offline, lag na fila, retry. Para análise, event time é quase sempre o correto: se você agrega por processing time, um atraso no seu pipeline move vendas de uma hora para outra, e o resultado passa a descrever o seu sistema em vez do negócio. Além disso, resultado por event time é reprodutível — reprocessar dá o mesmo número; por processing time, não.\u003c/p>"},{"titleHtml":"🟢 P4. O que são at-least-once e at-most-once?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> At-most-once entrega zero ou uma vez: pode perder, nunca duplica. Na prática é commitar o offset antes de processar. At-least-once entrega uma ou mais vezes: nunca perde, pode duplicar. É commitar o offset depois de processar com sucesso. At-least-once é o padrão da indústria, porque perder dado é geralmente pior que duplicar — e duplicata pode ser resolvida com idempotência no destino.\u003c/p>"},{"titleHtml":"🟡 P5. O que é um watermark e qual o trade-off de configurá-lo?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Watermark é a afirmação do sistema de que provavelmente já viu todos os eventos com event time anterior a um instante T. É heurística, não garantia. Serve para decidir quando fechar uma janela e emitir o resultado, já que num stream infinito você nunca tem certeza de completude.\u003c/p>\n\u003cp>O trade-off é direto: watermark curto dá latência baixa mas descarta mais dados atrasados; watermark longo captura mais dados mas atrasa o resultado e retém mais estado, o que custa memória e dinheiro. Não existe valor certo — é uma decisão de negócio sobre quanto atraso é aceitável versus quanta perda é aceitável. O que eu sempre faço é instrumentar a contagem de eventos descartados por atraso, para que essa decisão seja baseada em medida e não em suposição.\u003c/p>"},{"titleHtml":"🟡 P6. Explique os tipos de janela em streaming.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Tumbling são intervalos fixos sem sobreposição — cada evento cai em exatamente uma janela, e é o caso mais comum. Sliding são intervalos fixos com sobreposição, tipo \"últimos 10 minutos atualizados a cada minuto\" — cada evento cai em várias janelas, o que multiplica estado e compute. Session são definidas por inatividade: agrupa eventos de uma chave até um gap de N minutos sem atividade, com tamanho variável definido pelos dados — é o que se usa para analytics de comportamento. E global, uma janela única fechada por trigger customizado.\u003c/p>\n\u003cp>O detalhe prático: janela deslizante com muita sobreposição é uma armadilha de custo. Uma janela de 24 horas deslizando a cada minuto coloca cada evento em 1440 janelas. Nesse caso costuma valer mais agregar incrementalmente sobre janelas menores e compor.\u003c/p>"},{"titleHtml":"🟡 P7. Exactly-once é possível? Explique.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Exactly-once \u003cem>delivery\u003c/em> é impossível num sentido rigoroso — é o problema dos dois generais: você nunca tem certeza de que a mensagem chegou sem ack, e o ack pode se perder. O que os sistemas oferecem é exactly-once \u003cem>processing semantics\u003c/em>: a mensagem pode ser entregue várias vezes, mas o efeito sobre o estado e sobre a saída acontece uma vez.\u003c/p>\n\u003cp>Isso exige três coisas juntas: deduplicação na entrada (no Kafka, o produtor idempotente com PID e número de sequência por partição); estado e offset commitados atomicamente, para nunca ficarem dessincronizados; e um sink que participe da transação ou seja idempotente.\u003c/p>\n\u003cp>O elo fraco é sempre o sink. Se o destino é uma API externa não idempotente, não existe exactly-once, por mais que o framework prometa. Por isso, na maioria dos sistemas reais, a solução prática é at-least-once mais idempotência no destino — o resultado observável é o mesmo, com muito menos complexidade e melhor throughput.\u003c/p>\n\u003cp>\u003cem>Follow-up muito comum:\u003c/em> \"Por que exactly-once custa throughput?\" → Porque transações exigem coordenação: o coordenador de transação, os marcadores de commit/abort no log, e o fato de consumidores em modo \u003ccode>read_committed\u003c/code> só poderem ler até o ponto em que não há transação aberta pendente. Isso adiciona latência e reduz o paralelismo efetivo.\u003c/p>"},{"titleHtml":"🟡 P8. O que é late data e como você lida com ela?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É o evento que chega depois de o watermark já ter passado a janela dele. Quatro tratamentos possíveis, e escolho pelo impacto.\u003c/p>\n\u003cp>Descartar, quando a fração é minúscula e o impacto irrelevante — mas isso tem que ser medido, não assumido. Mandar para um side output ou dead letter e processar em batch depois, que é o pragmático e o que uso mais. Reabrir a janela e reemitir o resultado corrigido, o que exige que o destino aceite update e que os consumidores tolerem números que mudam — e custa estado, porque as janelas ficam abertas mais tempo. Ou corrigir com um job batch periódico, que é a ideia da arquitetura Lambda.\u003c/p>\n\u003cp>A pergunta que eu faria ao negócio antes de decidir é: um número que muda depois é aceitável, ou é pior que um número ligeiramente incompleto? Em relatório financeiro a resposta costuma ser oposta à de um dashboard operacional.\u003c/p>"},{"titleHtml":"🟡 P9. O que é checkpointing e por que é necessário?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É a persistência periódica e consistente do estado do job junto com a posição de leitura no stream. É necessário porque um job de streaming com agregação mantém estado — janelas abertas, sessões, tabelas de join — e se o processo cair sem ter persistido isso, o estado se perde e não há como recomeçar sem reler tudo desde o início.\u003c/p>\n\u003cp>Na recuperação, o job retoma do último checkpoint e reprocessa a partir dali, o que é exatamente o que produz at-least-once. Se o commit do estado e do offset for atômico, você chega a exactly-once processing.\u003c/p>\n\u003cp>O trade-off é a frequência: checkpoint mais frequente reduz o reprocessamento na recuperação mas adiciona overhead constante. E estado grande é um problema em si — checkpoint lento, recuperação lenta — o que motiva backends que gravam em disco local com upload incremental, como o RocksDB no Flink.\u003c/p>"},{"titleHtml":"🔴 P10. Descreva a arquitetura Lambda e a Kappa. Qual você escolheria hoje?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Lambda mantém duas camadas: uma batch que reprocessa tudo e produz o resultado correto, e uma de streaming que dá um resultado aproximado com baixa latência; a camada de serving combina as duas. Resolve o conflito entre correção e latência, mas o custo é manter duas implementações da mesma lógica, frequentemente em frameworks diferentes. Elas divergem, e essa divergência é a fonte clássica de bugs — alguém compara os dois números, eles não batem, e ninguém sabe qual está certo.\u003c/p>\n\u003cp>Kappa elimina a camada batch: só streaming, e reprocessamento é reler o log desde o início com a nova versão do código. Uma lógica só. Exige retenção longa no log e um sistema de streaming maduro o bastante para aguentar reprocessamento em alto throughput, que é uma carga bem diferente do regime normal.\u003c/p>\n\u003cp>Hoje eu não escolheria nenhuma das duas como dogma. Com engines unificadas e formatos de tabela com upsert e time travel, você escreve uma lógica que roda nos dois modos sobre a mesma tabela — o que captura o benefício do Kappa (uma implementação) sem exigir que o streaming carregue todo o peso do reprocessamento histórico. Na prática, o padrão que eu defendo é streaming produzindo o resultado corrente e um job batch de reconciliação corrigindo periodicamente. É Lambda em espírito, mas com a lógica compartilhada, que era o problema real.\u003c/p>"},{"titleHtml":"🔴 P11. Seu job de streaming acumulou 6 horas de lag durante a madrugada. O que você faz e como evita que se repita?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Primeiro diagnóstico, antes de qualquer ação: o lag é uniforme entre partições ou concentrado em algumas? Se está concentrado, é \u003cstrong>data skew\u003c/strong> ou uma partição com consumidor morto, e escalar não resolve. Se é uniforme, é capacidade ou uma degradação externa.\u003c/p>\n\u003cp>Verifico as causas mais comuns nessa ordem: um sink externo lento ou degradado (o mais frequente — o job não está lento, está esperando); crescimento do estado deixando o processamento e os checkpoints lentos; um pico legítimo de volume; ou GC pressure / falta de recursos.\u003c/p>\n\u003cp>Para recuperar: se a origem retém o suficiente, escalo o paralelismo temporariamente para drenar. Mas atenção — em Kafka, o paralelismo máximo é o número de partições, então adicionar consumidores além disso não ajuda em nada. Se o gargalo for o sink, escalar o consumidor só piora. E se o processamento tiver janelas por event time, drenar rápido pode disparar emissão de muitas janelas de uma vez, com pico de carga no destino.\u003c/p>\n\u003cp>Uma decisão que precisa ser explícita: \u003cstrong>recuperar tudo ou pular para o presente?\u003c/strong> Se o consumo alimenta um alerta operacional, dado de 6 horas atrás não tem valor e pode ser melhor pular para o fim e reprocessar o buraco em batch. Se alimenta uma tabela transacional, tem que recuperar tudo, em ordem.\u003c/p>\n\u003cp>Para evitar: alerta sobre \u003cstrong>consumer lag\u003c/strong> (não sobre \"job está rodando\" — o job estava rodando o tempo todo), com limiar baseado em tempo e não em número de mensagens; monitoramento separado da latência do sink; TTL no estado; testes de carga com volume de pico; e capacidade dimensionada com folga para picos, já que streaming não tem a elasticidade natural que o batch tem.\u003c/p>"},{"titleHtml":"🔴 P12. Você precisa fazer um join entre dois streams. Quais são os desafios?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Join entre streams é um dos problemas mais difíceis de streaming, por três razões.\u003c/p>\n\u003cp>\u003cstrong>Estado ilimitado.\u003c/strong> Para juntar A com B, você precisa reter registros de A esperando os de B. Como o stream é infinito, sem limite isso cresce para sempre. A solução é um \u003cstrong>interval join\u003c/strong> ou \u003cstrong>window join\u003c/strong>: definir que A só junta com B dentro de uma janela temporal (por exemplo, ±5 minutos de event time), o que permite descartar estado antigo. Isso significa aceitar que pares fora da janela nunca serão emitidos — uma perda deliberada, que precisa ser dimensionada com o negócio.\u003c/p>\n\u003cp>\u003cstrong>Ordem de chegada e assimetria.\u003c/strong> Os dois streams podem ter lags diferentes. Se A chega em tempo real e B com 10 minutos de atraso, seu watermark efetivo é o do stream mais atrasado, e a latência do resultado é ditada pelo pior dos dois.\u003c/p>\n\u003cp>\u003cstrong>Semântica do resultado.\u003c/strong> Um inner join emite só quando os dois lados chegam. Um outer join precisa decidir \u003cem>quando\u003c/em> desistir de esperar o outro lado — o que só é decidível via watermark, e significa que uma linha com NULL pode ser emitida e depois \"corrigida\" se o par chegar atrasado.\u003c/p>\n\u003cp>Um caso especial muito mais tratável é o \u003cstrong>stream-table join\u003c/strong> (enriquecer eventos com dados de referência): aqui um dos lados é uma tabela relativamente estática, mantida como estado local ou consultada externamente. É comum e bem suportado — em Kafka Streams via KTable, no Flink via lookup join ou broadcast state. A pergunta importante nesse caso é \u003cstrong>temporal\u003c/strong>: você quer juntar com o valor atual da tabela ou com o valor vigente no event time do evento? A segunda é a correta para reprocessamento determinístico e é o que \u003cstrong>temporal table join\u003c/strong> resolve, mas exige versionar a tabela de referência.\u003c/p>\n\u003cp>Na prática, quando o join é complexo, vale perguntar se ele precisa mesmo ser em streaming. Frequentemente enriquecer com um lookup e deixar o join pesado para o batch é a resposta mais barata e correta.\u003c/p>"},{"titleHtml":"🔴 P13. Como você garantiria exactly-once de ponta a ponta num pipeline Kafka → processamento → banco relacional?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Vou por partes, porque cada elo precisa de uma garantia diferente.\u003c/p>\n\u003cp>\u003cstrong>Produtor → Kafka:\u003c/strong> habilitar o produtor idempotente. O broker atribui um PID e rastreia número de sequência por partição, descartando duplicatas de retry. Isso elimina duplicação causada por reenvio do produtor. Se o produtor escreve em múltiplas partições ou tópicos como uma unidade, uso transações.\u003c/p>\n\u003cp>\u003cstrong>Kafka → processamento:\u003c/strong> o consumidor não pode commitar offset antes de processar. Além disso, offset e estado precisam avançar juntos.\u003c/p>\n\u003cp>\u003cstrong>Processamento → banco relacional:\u003c/strong> aqui está o elo decisivo, e é onde a resposta se define. Um banco relacional não participa da transação do Kafka, então não existe commit atômico entre os dois. Duas saídas viáveis:\u003c/p>\n\u003cp>\u003cem>A que eu prefiro:\u003c/em> \u003cstrong>escrita idempotente no destino\u003c/strong>. Cada registro carrega uma chave de idempotência determinística, e a escrita é um \u003ccode>MERGE\u003c/code>/upsert por essa chave. Aí o pipeline roda em at-least-once, duplicatas são absorvidas pelo upsert, e o resultado observável é exactly-once. Simples, performático, e não depende de nenhuma coordenação exótica.\u003c/p>\n\u003cp>\u003cem>A alternativa:\u003c/em> \u003cstrong>transação no destino que grava o dado e o offset na mesma transação\u003c/strong>, numa tabela de controle de offsets no próprio banco. Na recuperação, o job lê o offset do banco em vez do Kafka. Isso dá atomicidade real entre \"processei\" e \"avancei\", porque as duas informações vivem no mesmo sistema transacional. É o padrão two-phase-ish mais robusto sem transação distribuída de verdade.\u003c/p>\n\u003cp>O que eu \u003cstrong>não\u003c/strong> faria é assumir que ligar exactly-once no framework resolve. A garantia é sempre limitada pelo elo mais fraco, e num sink externo o framework não tem como impor nada.\u003c/p>"},{"titleHtml":"🔴 P14. Um stakeholder pede \"dados em tempo real\" para um dashboard. Como você conduz essa conversa?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> \"Tempo real\" quase nunca significa o que a pessoa diz. Eu faria três perguntas antes de qualquer discussão técnica.\u003c/p>\n\u003cp>\u003cstrong>Qual decisão você toma com esse dado, e em quanto tempo?\u003c/strong> Se a resposta é \"olho de manhã para acompanhar\", a latência necessária é horas, não segundos. Se é \"se cair abaixo de X eu paro a campanha\", aí sim há urgência, e o que ele quer na verdade é um \u003cstrong>alerta\u003c/strong>, não um dashboard — e alerta é muito mais barato de construir.\u003c/p>\n\u003cp>\u003cstrong>O que acontece se o número estiver 15 minutos desatualizado? E 1 hora?\u003c/strong> Isso transforma um requisito vago numa curva de custo versus valor, e frequentemente revela que a exigência era estética.\u003c/p>\n\u003cp>\u003cstrong>O número pode mudar depois de exibido?\u003c/strong> Streaming com late data produz números que se corrigem retroativamente. Muita gente pede tempo real e depois reclama que o valor de ontem mudou. É melhor descobrir isso antes.\u003c/p>\n\u003cp>Depois disso eu apresentaria o custo com honestidade: micro-batch a cada 5–15 minutos resolve a maioria dos casos com uma fração da complexidade de streaming verdadeiro, e frequentemente é uma mudança de agendamento em vez de uma nova arquitetura. Streaming real implica operação 24/7, reprocessamento difícil e um custo contínuo.\u003c/p>\n\u003cp>Se depois disso a necessidade se confirmar, eu construo. O ponto não é resistir ao pedido — é garantir que a complexidade que vou operar pelos próximos anos esteja pareada com valor real, e que quem pediu entenda o que está comprando.\u003c/p>"},{"titleHtml":"🔴 P15. O que acontece quando você precisa mudar a lógica de um job de streaming com estado que está em produção?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um dos pontos mais dolorosos de streaming, e a resposta depende do tipo de mudança.\u003c/p>\n\u003cp>\u003cstrong>Mudança que não afeta a estrutura do estado\u003c/strong> (ajustar um filtro, mudar um campo de saída): faço um savepoint — um checkpoint explícito e versionado — paro o job, subo a nova versão restaurando daquele savepoint. Downtime curto e sem perda.\u003c/p>\n\u003cp>\u003cstrong>Mudança que altera a estrutura do estado\u003c/strong> (novo campo na agregação, mudança de chave, mudança de tipo de janela): o estado antigo pode ser incompatível. Opções: escrever código de migração de estado, quando o framework suporta evolução de schema de estado; ou aceitar reprocessar, subindo o novo job desde um offset anterior no log e descartando o estado antigo — o que só é possível se a retenção do log cobrir a janela necessária.\u003c/p>\n\u003cp>\u003cstrong>Mudança que altera resultados históricos:\u003c/strong> aí precisa de um plano explícito, porque números já publicados vão mudar. Frequentemente a resposta é aplicar a nova lógica só daqui para frente e corrigir o histórico em batch.\u003c/p>\n\u003cp>Para mudanças arriscadas eu uso \u003cstrong>deploy paralelo\u003c/strong>: subo a nova versão consumindo o mesmo tópico com um consumer group diferente, escrevendo num destino sombra, comparo os resultados por algumas horas ou dias, e só então faço o corte. Custa o dobro de compute durante a janela, e vale cada centavo — porque o modo de falha de um job de streaming com estado é sutil e frequentemente só aparece depois de horas de operação, com estado acumulado.\u003c/p>\n\u003cp>Este é, aliás, um dos melhores argumentos para não usar streaming quando não é necessário: em batch, mudar a lógica e reprocessar é uma tarde de trabalho.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual a diferença \u003cstrong>essencial\u003c/strong> entre batch e streaming?","a":["Streaming processa mais rápido","Batch processa um conjunto delimitado (bounded); streaming processa um fluxo ilimitado — você nunca tem o conjunto completo e decide com informação permanentemente incompleta","Batch usa SQL e streaming usa código","Streaming não mantém estado"],"c":1,"e":"Não é sobre velocidade: é sobre limites. Bounded permite ver tudo antes de decidir e reprocessar barato; unbounded exige decidir quando fechar janelas e manter estado através de falhas."},{"n":"🟢","levelName":"basico","q":"Por que agregar por \u003cstrong>event time\u003c/strong> em vez de processing time para análise?","a":["Porque processing time não pode ser medido","Porque com processing time um atraso do pipeline move vendas de uma hora para outra: o resultado descreve o seu sistema, não o negócio — e deixa de ser reprodutível","Porque event time é mais rápido de calcular","Porque processing time exige relógios sincronizados"],"c":1,"e":"Reprocessar por event time dá o mesmo número; por processing time, não. O preço do event time é nunca saber se todos os eventos da janela chegaram — daí o watermark."},{"n":"🟡","levelName":"intermediario","q":"Qual é o \u003cstrong>trade-off\u003c/strong> ao configurar um watermark?","a":["Não há trade-off: quanto maior, melhor","Curto = latência baixa mas mais eventos atrasados descartados; longo = mais completude, porém mais latência e mais estado retido — é decisão de negócio, não técnica","Curto = mais memória; longo = menos memória","Watermark só afeta o throughput, não a correção"],"c":1,"e":"E o obrigatório: instrumentar a contagem de eventos descartados por atraso, para que a decisão seja baseada em medida, não em suposição."},{"n":"🟡","levelName":"intermediario","q":"Como se implementa \u003cstrong>at-least-once\u003c/strong> no consumo de uma fila?","a":["Commitando o offset antes de processar","Commitando o offset somente depois de processar com sucesso — se falhar no meio, a mensagem é reprocessada; nunca se perde, pode duplicar","Processando cada mensagem em duas threads","Usando exactly-once do framework"],"c":1,"e":"Commitar antes dá at-most-once (pode perder). At-least-once + idempotência no destino é o padrão da indústria — o resultado observável equivale a exactly-once com muito menos complexidade."},{"n":"🔴","levelName":"avancado","q":"O que é verdade sobre \u003cstrong>exactly-once\u003c/strong> em sistemas distribuídos?","a":["Exactly-once delivery é garantido pelo Kafka em qualquer topologia","Exactly-once delivery é impossível (dois generais); o que existe é exactly-once processing semantics — e o elo mais fraco é sempre o sink: destino externo não transacional e não idempotente anula a garantia","Exactly-once é o modo padrão de todos os frameworks modernos","Exactly-once elimina a necessidade de idempotência"],"c":1,"e":"EOS combina dedup na entrada, estado+offset atômicos e sink participante. Kafka dá EOS de ponta a ponta apenas quando origem e destino são Kafka."},{"n":"🟡","levelName":"intermediario","q":"Uma janela deslizante de \u003cstrong>24h atualizada a cada minuto\u003c/strong> tem qual problema?","a":["Não captura eventos noturnos","Cada evento participa de 1440 janelas — o estado e o compute multiplicam; a alternativa é agregação incremental sobre janelas menores compostas","Ela descarta eventos duplicados","Só funciona com processing time"],"c":1,"e":"Janelas sliding com muita sobreposição são uma armadilha de custo clássica. Tumbling (sem sobreposição) e session (por inatividade) são os outros tipos que caem em entrevista."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>TTL de estado\u003c/strong> é obrigatório em jobs de streaming com estado por chave?","a":["Para cumprir LGPD","Sem expiração, o estado cresce para sempre (sessões, joins, dedup) e o job degrada até morrer — tipicamente semanas após o deploy, quando ninguém associa mais o incidente à mudança","Para reduzir a latência do checkpoint inicial","TTL é opcional em frameworks modernos"],"c":1,"e":"Qualquer operação com estado por chave precisa de limite temporal: agregações sem watermark, joins entre streams sem janela e dedup sem TTL são todos estado ilimitado por construção."},{"n":"🔴","levelName":"avancado","q":"Qual era o problema central da arquitetura \u003cstrong>Lambda\u003c/strong>, e como a visão moderna o resolve?","a":["Latência alta demais na camada de streaming","Manter duas implementações da mesma lógica (batch e streaming) que divergem; hoje, engines unificadas e formatos de tabela permitem uma lógica só rodando nos dois modos — Lambda em espírito, com implementação compartilhada","Custo de storage da camada batch","Impossibilidade de reprocessar dados históricos"],"c":1,"e":"A Kappa eliminava a duplicação exigindo reprocessar tudo pelo log. A prática comum hoje: streaming produz o resultado corrente e um batch de reconciliação corrige periodicamente, com a lógica compartilhada."}]},{"id":"05","fullTitle":"05 — Sistemas Distribuídos Aplicados a Dados","shortTitle":"Sistemas Distribuídos Aplicados a Dados","subtitle":"Particionamento e sharding · Shuffle · Data skew · Teorema CAP e PACELC · Consistência · Replicação · Consenso · Tolerância a falhas","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-a-premissa-por-que-distribuir\">1.1 A premissa: por que distribuir\u003c/h3>\n\u003cp>Distribuir dados existe por três razões, e distingui-las importa porque cada uma tem soluções diferentes:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Volume\u003c/strong>: o dado não cabe numa máquina.\u003c/li>\u003cli>\u003cstrong>Throughput\u003c/strong>: uma máquina não dá conta da carga de leitura ou escrita.\u003c/li>\u003cli>\u003cstrong>Disponibilidade\u003c/strong>: uma máquina falha, e você precisa continuar operando.\u003c/li>\u003c/ul>\n\u003cp>E distribuir cria três problemas novos que não existiam:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Coordenação\u003c/strong>: para fazer algo consistente, as máquinas precisam concordar, e concordar custa tempo.\u003c/li>\u003cli>\u003cstrong>Falha parcial\u003c/strong>: numa máquina, ou funciona ou não funciona. Em N máquinas, uma pode falhar enquanto as outras continuam — e você pode não saber se ela falhou ou se só está lenta. Essa impossibilidade de distinguir \"morto\" de \"lento\" é a raiz de quase toda a dificuldade de sistemas distribuídos.\u003c/li>\u003cli>\u003cstrong>Movimentação de dados pela rede\u003c/strong>: rede é ordens de grandeza mais lenta que memória. Todo o trabalho de otimização em engines distribuídas se resume a \u003cstrong>evitar mover dados\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>Guarde esta frase, ela responde metade das perguntas deste arquivo: \u003cstrong>em processamento distribuído, o custo dominante é mover dados, não computá-los.\u003c/strong>\u003c/p>\n\u003ch3 id=\"h-1-2-particionamento-e-sharding\">1.2 Particionamento e sharding\u003c/h3>\n\u003cp>\u003cstrong>Partição\u003c/strong> é uma fatia horizontal de um dataset. \u003cstrong>Sharding\u003c/strong> é o mesmo conceito aplicado a bancos de dados, onde cada shard normalmente vive num servidor diferente. Os termos se sobrepõem; em contexto analítico fala-se em partição, em contexto OLTP fala-se em shard.\u003c/p>\n\u003cp>Vale distinguir dois eixos:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Particionamento horizontal\u003c/strong>: dividir linhas entre nós (o caso comum).\u003c/li>\u003cli>\u003cstrong>Particionamento vertical\u003c/strong>: dividir colunas entre nós ou tabelas (menos comum, mas é o que armazenamento colunar faz internamente).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Estratégias de particionamento:\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Por intervalo (range)\u003c/strong>: cada partição cobre uma faixa de valores (janeiro, fevereiro...). Vantagem: consultas por intervalo leem poucas partições, e é natural para dados temporais. Desvantagem: \u003cstrong>hotspot\u003c/strong> — se todo mundo escreve \"hoje\", a partição de hoje recebe toda a carga de escrita, e as antigas ficam ociosas. É o caso clássico de partição por data em sistemas de escrita intensa.\u003c/p>\n\u003cp>\u003cstrong>Por hash\u003c/strong>: aplica uma função hash na chave e usa o resto da divisão pelo número de partições. Vantagem: distribuição uniforme, sem hotspot. Desvantagem: perde a localidade — uma consulta por intervalo precisa varrer todas as partições, porque valores adjacentes caem em partições diferentes.\u003c/p>\n\u003cp>\u003cstrong>Híbrido (composite)\u003c/strong>: hash dentro de um range. Particionar por mês e, dentro do mês, por hash da chave. Combina pruning temporal com distribuição uniforme. É o padrão mais usado na prática em sistemas grandes.\u003c/p>\n\u003cp>\u003cstrong>Por lista\u003c/strong>: partições explícitas por valor (por país, por região). Simples e legível; ruim quando a distribuição é desigual (o país maior domina).\u003c/p>\n\u003cp>\u003cstrong>Round-robin\u003c/strong>: distribui sequencialmente, ignorando o conteúdo. Distribuição perfeitamente uniforme, zero localidade. Útil apenas quando não há chave de acesso dominante.\u003c/p>\n\u003cp>\u003cstrong>A decisão de chave de particionamento é a decisão mais consequente de um sistema distribuído de dados\u003c/strong>, e é difícil de reverter. Três critérios, e eles frequentemente conflitam:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Cardinalidade suficiente\u003c/strong>: precisa haver valores distintos bastantes para gerar partições em número adequado ao paralelismo.\u003c/li>\u003cli>\u003cstrong>Distribuição uniforme\u003c/strong>: nenhum valor pode concentrar uma fração grande dos dados.\u003c/li>\u003cli>\u003cstrong>Alinhamento com o padrão de consulta\u003c/strong>: se você filtra por data, particionar por data permite pruning; particionar por outra coisa força varredura completa.\u003c/li>\u003c/ol>\n\u003cp>Um erro clássico: particionar por \u003ccode>user_id\u003c/code> porque \"é a chave natural\". Se a maioria das consultas filtra por data, você perdeu o pruning, e além disso criou milhões de partições minúsculas — o problema de small files (ver arquivo 07).\u003c/p>\n\u003cp>Outro ponto que rende: \u003cstrong>granularidade da partição\u003c/strong>. Partições muito grandes matam o paralelismo e o pruning; partições muito pequenas geram overhead de metadados e arquivos pequenos. A regra prática em lakes é mirar partições na casa de centenas de MB a poucos GB, e o número total de partições em milhares, não milhões.\u003c/p>\n\u003ch3 id=\"h-1-3-shuffle-o-conceito-central-de-performance\">1.3 Shuffle — o conceito central de performance\u003c/h3>\n\u003cp>\u003cstrong>Shuffle\u003c/strong> é a redistribuição de dados entre nós para que registros que precisam ser processados juntos fiquem no mesmo lugar.\u003c/p>\n\u003cp>Por que é necessário: para somar vendas por cliente, todos os registros de um mesmo cliente precisam estar no mesmo executor. Se estão espalhados, precisam ser movidos. O mesmo vale para join (linhas com a mesma chave precisam se encontrar) e para ordenação global.\u003c/p>\n\u003cp>\u003cstrong>O que dispara shuffle\u003c/strong> (vale saber de cor): \u003ccode>GROUP BY\u003c/code>, \u003ccode>JOIN\u003c/code> (exceto broadcast), \u003ccode>DISTINCT\u003c/code>, \u003ccode>ORDER BY\u003c/code> global, \u003ccode>repartition\u003c/code>, window functions com \u003ccode>PARTITION BY\u003c/code> sobre uma chave diferente da atual, e agregações que não podem ser pré-agregadas localmente.\u003c/p>\n\u003cp>\u003cstrong>Por que shuffle é caro\u003c/strong> — e a resposta completa tem quatro partes, não uma:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Rede\u003c/strong>: os dados atravessam a rede entre nós.\u003c/li>\u003cli>\u003cstrong>Disco\u003c/strong>: o lado que produz (map side) escreve os blocos em disco antes de serem buscados; o lado que consome lê. Isso é I/O adicional em ambos os lados.\u003c/li>\u003cli>\u003cstrong>Serialização\u003c/strong>: os dados precisam ser serializados para transporte e desserializados na chegada — custo de CPU frequentemente subestimado.\u003c/li>\u003cli>\u003cstrong>Barreira de sincronização\u003c/strong>: o estágio seguinte só pode começar quando o shuffle terminar. Uma tarefa lenta atrasa todo o estágio (o problema do straggler).\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Como reduzir shuffle:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Broadcast join\u003c/strong>: se um lado é pequeno, envie uma cópia dele para todos os executores em vez de redistribuir os dois lados. Elimina o shuffle completamente. É a otimização de maior impacto e a primeira a mencionar.\u003c/li>\u003cli>\u003cstrong>Pré-particionar / bucketing\u003c/strong>: se as tabelas estão fisicamente particionadas pela mesma chave de join com o mesmo número de buckets, o join é local — nada se move.\u003c/li>\u003cli>\u003cstrong>Filtrar e projetar antes\u003c/strong>: mover menos linhas e menos colunas. Predicate pushdown e column pruning existem para isso.\u003c/li>\u003cli>\u003cstrong>Pré-agregar localmente\u003c/strong> (map-side combine): reduzir o volume antes de mandar pela rede. É o que faz \u003ccode>reduceByKey\u003c/code> ser melhor que \u003ccode>groupByKey\u003c/code> no modelo RDD.\u003c/li>\u003cli>\u003cstrong>Reordenar operações\u003c/strong>: filtrar antes de juntar, agregar antes de juntar quando a semântica permite.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-4-data-skew-o-problema-que-mais-aparece-na-prática\">1.4 Data skew — o problema que mais aparece na prática\u003c/h3>\n\u003cp>\u003cstrong>Data skew\u003c/strong> é a distribuição desigual de dados entre partições. Uma tarefa recebe 100× mais dados que as outras e vira o gargalo do estágio inteiro.\u003c/p>\n\u003cp>\u003cstrong>Como se manifesta:\u003c/strong> o job tem 200 tarefas, 199 terminam em 30 segundos e 1 leva 40 minutos. O sintoma na interface é sempre o mesmo — a distribuição de duração das tarefas tem uma cauda longuíssima. Frequentemente a tarefa lenta também estoura memória, porque precisa segurar tudo daquela chave.\u003c/p>\n\u003cp>\u003cstrong>Causas comuns:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Valores naturalmente desbalanceados\u003c/strong>: numa plataforma de e-commerce, o cliente \"consumidor não identificado\" pode ter 40% das transações.\u003c/li>\u003cli>\u003cstrong>NULLs\u003c/strong>: se você junta por uma coluna com muitos NULLs, todos os NULLs vão para a mesma partição de hash (dependendo do engine).\u003c/li>\u003cli>\u003cstrong>Valores default/sentinela\u003c/strong>: \u003ccode>-1\u003c/code>, \u003ccode>0\u003c/code>, \u003ccode>'UNKNOWN'\u003c/code>, \u003ccode>'N/A'\u003c/code> concentram milhões de linhas.\u003c/li>\u003cli>\u003cstrong>Distribuição de cauda longa genuína\u003c/strong>: leis de potência são a norma em dados de comportamento — poucos usuários geram a maior parte dos eventos.\u003c/li>\u003cli>\u003cstrong>Chave de partição com cardinalidade baixa\u003c/strong>: particionar por \u003ccode>pais\u003c/code> quando 80% do negócio está num país.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Como diagnosticar:\u003c/strong> olhar a distribuição de duração e de bytes lidos por tarefa (não a média — a média esconde skew; olhe o máximo versus a mediana). E, no dado, um \u003ccode>GROUP BY chave ORDER BY COUNT(*) DESC LIMIT 20\u003c/code> sobre a chave de join revela imediatamente se há concentração.\u003c/p>\n\u003cp>\u003cstrong>Como resolver\u003c/strong> (em ordem do mais simples ao mais invasivo):\u003c/p>\n\u003col>\u003cli>\u003cstrong>AQE / skew join automático.\u003c/strong> Engines modernas detectam partições anormalmente grandes em tempo de execução e as dividem automaticamente. No Spark, isso está ativo por padrão desde a 3.2 e resolve boa parte dos casos sem intervenção. Mencionar isso primeiro mostra que você está atualizado.\u003c/li>\u003cli>\u003cstrong>Broadcast join.\u003c/strong> Se o lado pequeno couber na memória dos executores, o skew do lado grande deixa de importar — não há redistribuição por chave.\u003c/li>\u003cli>\u003cstrong>Filtrar o problema.\u003c/strong> Se os NULLs ou o sentinela não têm significado para o join, remova-os antes. É a solução mais barata e frequentemente a correta.\u003c/li>\u003cli>\u003cstrong>Salting.\u003c/strong> Adicione um sufixo aleatório à chave do lado skewed (\u003ccode>chave_0\u003c/code>, \u003ccode>chave_1\u003c/code>, ... \u003ccode>chave_N\u003c/code>), e replique o lado pequeno N vezes com todos os sufixos. Isso quebra a chave quente em N partições. Custo: o lado replicado cresce N vezes, e a lógica fica mais complexa. É a solução clássica quando as anteriores não servem.\u003c/li>\u003cli>\u003cstrong>Separar e tratar em dois caminhos.\u003c/strong> Processe as chaves quentes de um jeito (broadcast, agregação separada) e o resto normalmente, unindo os resultados no fim. Mais trabalhoso, mas às vezes é o único jeito.\u003c/li>\u003cli>\u003cstrong>Mudar a chave de particionamento\u003c/strong> ou o modelo de dados. A solução estrutural, cara e às vezes a correta.\u003c/li>\u003c/ol>\n\u003ch3 id=\"h-1-5-teorema-cap-e-por-que-a-formulação-popular-está-errada\">1.5 Teorema CAP — e por que a formulação popular está errada\u003c/h3>\n\u003cp>\u003cstrong>Enunciado:\u003c/strong> num sistema distribuído sujeito a \u003cstrong>partição de rede\u003c/strong> (P), você precisa escolher entre \u003cstrong>consistência\u003c/strong> (C) e \u003cstrong>disponibilidade\u003c/strong> (A).\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Consistency\u003c/strong> aqui significa \u003cstrong>linearizabilidade\u003c/strong>: toda leitura vê a escrita mais recente confirmada. Não é o \"C\" de ACID.\u003c/li>\u003cli>\u003cstrong>Availability\u003c/strong> significa que toda requisição a um nó \u003cstrong>não falho\u003c/strong> recebe resposta (não necessariamente a mais atual).\u003c/li>\u003cli>\u003cstrong>Partition tolerance\u003c/strong> significa continuar operando quando mensagens entre nós se perdem ou atrasam.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>O erro que quase todo candidato comete:\u003c/strong> dizer \"escolha 2 de 3\". Isso está errado, e entrevistadores bons usam essa pergunta exatamente para pegar quem decorou.\u003c/p>\n\u003cp>Partição de rede \u003cstrong>não é uma escolha\u003c/strong> — é um fato da natureza. Cabos caem, switches falham, datacenters se isolam. Um sistema distribuído que \"escolhe CA\" está apenas escolhendo se comportar mal quando a partição inevitavelmente acontecer. A escolha real, e só vale \u003cstrong>durante\u003c/strong> uma partição, é: continuar respondendo com risco de dado desatualizado ou divergente (AP), ou recusar respostas para preservar a consistência (CP).\u003c/p>\n\u003cp>Exemplos concretos:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>CP\u003c/strong>: um banco de dados que, ao perder quórum, para de aceitar escritas. Preferir indisponibilidade a inconsistência. É o que você quer para saldo bancário.\u003c/li>\u003cli>\u003cstrong>AP\u003c/strong>: um sistema que aceita escritas em ambos os lados da partição e reconcilia depois (last-write-wins, CRDTs, vector clocks). É o que você quer para um carrinho de compras ou para um contador de curtidas.\u003c/li>\u003c/ul>\n\u003cp>E o mais importante: essa é uma escolha \u003cstrong>por operação\u003c/strong>, não por sistema. Muitos bancos modernos permitem escolher o nível de consistência por consulta. Dizer isso é o que transforma uma resposta correta numa resposta excelente.\u003c/p>\n\u003cp>\u003cstrong>PACELC\u003c/strong> é a extensão que vale citar e que muita gente não conhece: \u003cem>se\u003c/em> há \u003cstrong>P\u003c/strong>artição, escolha entre \u003cstrong>A\u003c/strong>vailability e \u003cstrong>C\u003c/strong>onsistency; \u003cstrong>E\u003c/strong>lse (em operação normal, sem partição), escolha entre \u003cstrong>L\u003c/strong>atência e \u003cstrong>C\u003c/strong>onsistência.\u003c/p>\n\u003cp>PACELC é mais útil que CAP na prática, porque partições são raras e o trade-off latência versus consistência é \u003cstrong>contínuo, todo dia\u003c/strong>. Toda vez que você usa uma réplica de leitura, está trocando consistência por latência e por escala — e isso não tem nada a ver com partição de rede. Um candidato que traz PACELC espontaneamente sinaliza leitura séria.\u003c/p>\n\u003ch3 id=\"h-1-6-modelos-de-consistência\">1.6 Modelos de consistência\u003c/h3>\n\u003cp>Um espectro, do mais forte ao mais fraco:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Linearizabilidade (strong)\u003c/strong>: o sistema se comporta como se houvesse uma única cópia e as operações acontecessem instantaneamente numa ordem global. Mais caro; exige coordenação em cada operação.\u003c/li>\u003cli>\u003cstrong>Serializabilidade\u003c/strong>: propriedade de transações — o resultado equivale a alguma execução serial. É sobre transações; linearizabilidade é sobre operações individuais em objetos. \u003cstrong>Strict serializability\u003c/strong> combina as duas.\u003c/li>\u003cli>\u003cstrong>Consistência causal\u003c/strong>: operações causalmente relacionadas são vistas na mesma ordem por todos; operações concorrentes podem ser vistas em ordens diferentes. Bom equilíbrio, e suficiente para muitos casos (evita \"ver a resposta antes da pergunta\").\u003c/li>\u003cli>\u003cstrong>Read-your-writes\u003c/strong>: você sempre vê suas próprias escritas. Uma garantia de sessão, barata e que resolve a maior parte da percepção de bug pelo usuário.\u003c/li>\u003cli>\u003cstrong>Eventual\u003c/strong>: sem novas escritas, todas as réplicas convergem eventualmente. Diz muito pouco — não diz quando, nem o que você vê nesse meio-tempo.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Read-your-writes é a garantia mais subestimada.\u003c/strong> A maior parte do que usuários percebem como bug em sistemas eventualmente consistentes é: \"editei meu perfil, recarreguei, voltou o antigo\". Garantir sessão consistente resolve isso sem pagar o preço de linearizabilidade global.\u003c/p>\n\u003cp>Em contexto analítico, o modelo relevante costuma ser \u003cstrong>snapshot isolation\u003c/strong>: cada consulta vê um estado consistente da tabela num ponto no tempo, mesmo que escritas estejam acontecendo. É exatamente o que formatos de tabela como Iceberg e Delta oferecem, e é a garantia certa para analytics — você não precisa de linearizabilidade, precisa que o relatório não misture estados.\u003c/p>\n\u003ch3 id=\"h-1-7-replicação\">1.7 Replicação\u003c/h3>\n\u003cp>\u003cstrong>Por que replicar:\u003c/strong> disponibilidade (sobreviver à perda de um nó), throughput de leitura (distribuir consultas), e proximidade geográfica (reduzir latência).\u003c/p>\n\u003cp>\u003cstrong>Modelos:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Single-leader (primary-replica)\u003c/strong>: todas as escritas vão para um nó, que propaga para réplicas. Simples, evita conflitos de escrita por construção. Limitações: o líder é gargalo de escrita, e a eleição de novo líder em falha é um momento delicado.\u003c/li>\u003cli>\u003cstrong>Multi-leader\u003c/strong>: vários nós aceitam escrita e replicam entre si. Bom para multi-região e operação offline. O custo é \u003cstrong>resolução de conflito\u003c/strong>, que é um problema genuinamente difícil e frequentemente sem solução automática satisfatória.\u003c/li>\u003cli>\u003cstrong>Leaderless (Dynamo-style)\u003c/strong>: cliente escreve em N nós e lê de N nós, usando quóruns. Com \u003ccode>W + R &amp;gt; N\u003c/code> você garante interseção entre o conjunto que escreveu e o que leu, o que dá leitura atualizada. Flexível: ajustar W e R desloca o trade-off entre latência de leitura e de escrita.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Síncrona vs assíncrona\u003c/strong> é o trade-off mais importante aqui. Replicação síncrona confirma a escrita só depois que a réplica confirmou: nenhum dado perdido em falha do líder, mas a latência de escrita passa a incluir a réplica, e se a réplica cair, as escritas travam. Assíncrona confirma imediatamente: rápida, mas há uma janela em que dados confirmados ao cliente ainda não estão na réplica — e se o líder morrer nessa janela, esses dados se perdem. Muitos sistemas usam \u003cstrong>semi-síncrona\u003c/strong>: síncrona para uma réplica, assíncrona para as demais.\u003c/p>\n\u003cp>\u003cstrong>Replication lag\u003c/strong> é o que gera as anomalias que usuários percebem: ler de uma réplica atrasada logo depois de escrever no líder devolve o valor antigo. As soluções de sessão (ler do líder por um período após escrever, ou rastrear a posição do log) existem exatamente para isso.\u003c/p>\n\u003ch3 id=\"h-1-8-consenso-e-coordenação\">1.8 Consenso e coordenação\u003c/h3>\n\u003cp>\u003cstrong>Consenso\u003c/strong> é fazer múltiplos nós concordarem sobre um valor, mesmo com falhas. É o que sustenta eleição de líder, commit distribuído e configuração replicada.\u003c/p>\n\u003cp>Algoritmos: \u003cstrong>Paxos\u003c/strong> (o clássico, notoriamente difícil de implementar), \u003cstrong>Raft\u003c/strong> (equivalente em garantias, projetado para ser compreensível — usado no etcd, no CockroachDB e no \u003cstrong>KRaft\u003c/strong> do Kafka, que substituiu o ZooKeeper a partir do Kafka 4.0), \u003cstrong>ZAB\u003c/strong> (do ZooKeeper).\u003c/p>\n\u003cp>Duas coisas que valem saber:\u003c/p>\n\u003cp>\u003cstrong>Consenso exige maioria (quórum).\u003c/strong> Com N nós, você tolera a falha de ⌊(N−1)/2⌋. Por isso clusters de consenso têm número ímpar de membros: 3 tolera 1, 5 tolera 2. Adicionar um quarto nó a um cluster de 3 não aumenta a tolerância — só aumenta o custo de coordenação. Essa é uma pergunta de entrevista frequente e específica.\u003c/p>\n\u003cp>\u003cstrong>Consenso é caro, então evite-o no caminho quente.\u003c/strong> Sistemas bem projetados usam consenso para metadados e coordenação (quem é o líder, qual é a configuração, qual é o commit da tabela) e mantêm o fluxo de dados fora dele. É exatamente o desenho do Kafka: consenso para metadados via KRaft, e o caminho de dados replicado por um protocolo mais leve baseado em ISR.\u003c/p>\n\u003cp>\u003cstrong>FLP impossibility\u003c/strong> é o resultado teórico de fundo: em um sistema assíncrono com pelo menos uma falha possível, não existe algoritmo de consenso determinístico que sempre termine. Na prática, algoritmos reais contornam isso com timeouts e aleatoriedade — o que significa que eles são \"corretos sempre, terminam quase sempre\". Citar isso não é obrigatório, mas mostra profundidade se a conversa for para esse lado.\u003c/p>\n\u003ch3 id=\"h-1-9-tolerância-a-falhas-em-processamento-distribuído\">1.9 Tolerância a falhas em processamento distribuído\u003c/h3>\n\u003cp>\u003cstrong>Falha de tarefa\u003c/strong> é rotina, não exceção. Frameworks lidam com retry automático em outro nó. Isso funciona apenas se a tarefa for \u003cstrong>determinística e sem efeito colateral\u003c/strong> — outra manifestação de idempotência.\u003c/p>\n\u003cp>\u003cstrong>Straggler\u003c/strong> (tarefa anormalmente lenta) é diferente de falha e mais insidioso: a tarefa não morre, só demora. Como o estágio só termina quando a última tarefa termina, um straggler atrasa tudo. Mitigação clássica: \u003cstrong>execução especulativa\u003c/strong> — o framework dispara uma cópia da tarefa lenta em outro nó e usa o primeiro resultado. Funciona bem quando a lentidão é do nó (disco degradado, contenção); \u003cstrong>não\u003c/strong> resolve quando a causa é skew, porque a cópia recebe os mesmos dados e demora igual. Distinguir isso é um bom sinal numa entrevista.\u003c/p>\n\u003cp>\u003cstrong>Lineage vs checkpoint\u003c/strong>: o Spark rastreia a linhagem das transformações e, se uma partição se perde, recomputa a partir da origem. Elegante, mas se a cadeia for longa, recomputar custa caro — daí a existência de checkpoint, que trunca a linhagem persistindo o resultado intermediário.\u003c/p>\n\u003cp>\u003cstrong>Backpressure\u003c/strong>: quando o consumidor não acompanha o produtor, o sistema precisa sinalizar para desacelerar em vez de acumular até estourar memória. Sistemas de streaming implementam isso; ausência de backpressure é causa comum de OOM em pipelines.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Dizer \"CAP: escolha 2 de 3\".\u003c/strong> Partição não é escolha. A resposta correta é que a escolha entre C e A só existe durante uma partição, e que é uma decisão por operação, não por sistema.\u003c/p>\n\u003cp>\u003cstrong>Confundir o \"C\" de CAP com o \"C\" de ACID.\u003c/strong> Em CAP é linearizabilidade; em ACID é preservação de invariantes de integridade pela transação. Não têm relação.\u003c/p>\n\u003cp>\u003cstrong>Achar que mais nós num cluster de consenso é sempre melhor.\u003c/strong> 4 nós toleram as mesmas falhas que 3 e coordenam mais devagar. Ímpar sempre.\u003c/p>\n\u003cp>\u003cstrong>Tratar skew como problema de recursos.\u003c/strong> Aumentar memória ou número de executores não resolve skew — o gargalo é uma única tarefa com dados demais. Mais recursos só encarecem o mesmo tempo de execução.\u003c/p>\n\u003cp>\u003cstrong>Esquecer NULLs como causa de skew.\u003c/strong> É a causa mais comum e a mais fácil de corrigir. Sempre verifique antes de partir para salting.\u003c/p>\n\u003cp>\u003cstrong>Dizer que broadcast join resolve tudo.\u003c/strong> Só funciona se um lado couber confortavelmente na memória de cada executor — e a cópia é replicada para todos, então o custo total é o tamanho vezes o número de executores. Broadcast de algo grande demais causa OOM no driver ou nos executores.\u003c/p>\n\u003cp>\u003cstrong>Confundir cache com checkpoint.\u003c/strong> Cache mantém a linhagem e pode ser perdido; checkpoint trunca a linhagem e persiste em storage confiável. São ferramentas para problemas diferentes.\u003c/p>\n\u003cp>\u003cstrong>Assumir que particionar mais é sempre melhor.\u003c/strong> Milhões de partições geram overhead de metadados, listagem lenta e arquivos pequenos, o que degrada tudo. Existe um ponto ótimo, e ele está mais perto de milhares do que de milhões.\u003c/p>\n\u003cp>\u003cstrong>Ignorar o custo de serialização no shuffle.\u003c/strong> Muita gente cita só rede. Serialização e I/O de disco frequentemente dominam, e é por isso que formatos e serializadores eficientes importam.\u003c/p>\n\u003cp>\u003cstrong>Achar que replicação é backup.\u003c/strong> Replicação propaga erros: um \u003ccode>DELETE\u003c/code> acidental é replicado em milissegundos para todas as réplicas. Backup e time travel resolvem problemas que replicação não resolve.\u003c/p>\n\u003cp>\u003cstrong>Propor consistência forte por reflexo.\u003c/strong> É cara e frequentemente desnecessária. Read-your-writes resolve a maior parte da percepção de problema por uma fração do custo — e em analytics, snapshot isolation é a garantia certa, não linearizabilidade.\u003c/p>\n\u003cp>\u003cstrong>Confundir straggler com falha.\u003c/strong> Um nó lento não gera erro; ele só atrasa. Execução especulativa existe para isso, mas não resolve skew — distinguir os dois casos é o que a pergunta está testando.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. O que é particionamento e por que é necessário?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É dividir um dataset em fatias que podem ser armazenadas e processadas independentemente. Necessário por três motivos: o dado não cabe numa máquina, uma máquina não dá conta da carga, ou você precisa sobreviver à falha de uma máquina. Em processamento, é o que permite paralelismo — cada partição vira uma unidade de trabalho. E em leitura, permite \u003cstrong>partition pruning\u003c/strong>: se você filtra por uma coluna de partição, o engine pula os arquivos irrelevantes sem lê-los.\u003c/p>"},{"titleHtml":"🟢 P2. Qual a diferença entre particionar por range e por hash?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Range agrupa valores contíguos numa mesma partição — bom para consultas por intervalo, especialmente temporais, porque permite pruning eficiente. O problema é hotspot: se todo mundo escreve dados de hoje, uma partição concentra toda a carga de escrita.\u003c/p>\n\u003cp>Hash distribui uniformemente aplicando uma função sobre a chave — elimina hotspot, mas destrói a localidade, então consulta por intervalo precisa varrer tudo.\u003c/p>\n\u003cp>Na prática o padrão mais comum é híbrido: range por tempo, e hash dentro de cada período, para ter pruning temporal com distribuição uniforme dentro dele.\u003c/p>"},{"titleHtml":"🟢 P3. O que é shuffle e por que é caro?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Shuffle é a redistribuição de dados entre nós para que registros que precisam ser processados juntos fiquem no mesmo lugar — necessário em \u003ccode>GROUP BY\u003c/code>, \u003ccode>JOIN\u003c/code>, \u003ccode>DISTINCT\u003c/code> e ordenação global.\u003c/p>\n\u003cp>É caro por quatro razões: os dados atravessam a rede, que é ordens de grandeza mais lenta que memória; o lado produtor escreve blocos em disco e o consumidor os lê, adicionando I/O nos dois lados; há custo de serialização e desserialização; e é uma barreira de sincronização — o próximo estágio só começa quando o shuffle inteiro terminar, então uma tarefa lenta atrasa tudo.\u003c/p>"},{"titleHtml":"🟢 P4. O que é data skew?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É quando os dados se distribuem de forma desigual entre partições, fazendo uma tarefa receber muito mais trabalho que as outras. O sintoma típico é 199 de 200 tarefas terminando em segundos e uma levando dezenas de minutos, frequentemente estourando memória. As causas mais comuns são valores naturalmente concentrados, NULLs numa chave de join, valores sentinela tipo \u003ccode>-1\u003c/code> ou \u003ccode>'UNKNOWN'\u003c/code>, e distribuições de cauda longa, que são a norma em dados de comportamento.\u003c/p>"},{"titleHtml":"🟡 P5. Como você diagnostica e resolve data skew?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Diagnóstico primeiro: olho a distribuição de duração e de bytes por tarefa, comparando o máximo com a mediana — a média esconde skew. E no dado, um \u003ccode>GROUP BY\u003c/code> na chave de join ordenado por contagem revela na hora se há concentração.\u003c/p>\n\u003cp>Para resolver, vou do mais barato ao mais invasivo. Primeiro verifico se o AQE está ativo — engines modernas detectam partições anormalmente grandes em runtime e as dividem sozinhas, e isso resolve boa parte dos casos. Depois, se um dos lados do join couber em memória, forço broadcast: sem redistribuição por chave, o skew deixa de importar. Terceiro, verifico se o problema são NULLs ou valores sentinela sem significado — nesse caso filtro antes, que é a solução mais barata e frequentemente a correta.\u003c/p>\n\u003cp>Se nada disso serve, aplico salting: adiciono um sufixo aleatório à chave do lado concentrado e replico o lado pequeno com todos os sufixos, quebrando a chave quente em N partições. O custo é replicar o lado pequeno N vezes e complicar a lógica. A alternativa é separar os caminhos: tratar as chaves quentes de um jeito e o resto normalmente, unindo no fim.\u003c/p>\n\u003cp>Estruturalmente, se o skew é recorrente, reconsidero a chave de particionamento ou o modelo.\u003c/p>"},{"titleHtml":"🟡 P6. Explique o teorema CAP.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Diz que, sob partição de rede, você escolhe entre consistência — no sentido de linearizabilidade, toda leitura vê a última escrita confirmada — e disponibilidade, no sentido de todo nó não falho responder.\u003c/p>\n\u003cp>O ponto que costuma ser dito errado é \"escolha 2 de 3\". Partição de rede não é uma escolha, é um fato: cabos caem. Um sistema que se diz \"CA\" só está escolhendo se comportar mal quando a partição acontecer. A escolha real existe apenas \u003cstrong>durante\u003c/strong> a partição: continuar respondendo com risco de divergência, ou recusar para preservar consistência.\u003c/p>\n\u003cp>E é uma escolha por operação, não por sistema — muitos bancos deixam escolher o nível de consistência por consulta. Para saldo bancário você quer CP; para carrinho de compras ou contador de curtidas, AP com reconciliação.\u003c/p>\n\u003cp>\u003cem>Follow-up esperado:\u003c/em> \"Conhece PACELC?\" → Sim, e acho mais útil na prática: se há Partição, escolha entre Availability e Consistency; senão (Else), escolha entre Latência e Consistência. Partições são raras; o trade-off latência versus consistência acontece todo dia. Toda vez que você lê de uma réplica, está fazendo essa troca, e isso não tem nada a ver com partição de rede.\u003c/p>"},{"titleHtml":"🟡 P7. Como você escolheria a chave de particionamento de uma tabela grande?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Três critérios que frequentemente conflitam, então é uma negociação.\u003c/p>\n\u003cp>\u003cstrong>Alinhamento com o padrão de consulta\u003c/strong>: se 90% das consultas filtram por data, particionar por data dá pruning e é o maior ganho disponível. Particionar por algo que ninguém filtra não serve para nada.\u003c/p>\n\u003cp>\u003cstrong>Distribuição uniforme\u003c/strong>: nenhum valor pode concentrar uma fração grande. Particionar por \u003ccode>pais\u003c/code> num negócio concentrado em um país cria skew garantido.\u003c/p>\n\u003cp>\u003c
