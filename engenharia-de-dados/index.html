cstrong>Diff de resultado.\u003c/strong> Para mudanças em transformação existente, rodar a versão nova em paralelo e comparar o output com o atual. É a técnica mais eficaz que existe em dados, porque testes unitários passam enquanto a lógica de negócio muda sutilmente em 3% das linhas — e é isso que destrói a confiança dos usuários.\u003c/p>\n\u003cp>\u003cstrong>Testes de qualidade em produção\u003c/strong>, rodando como parte do pipeline com padrão write-audit-publish: escreve em local temporário, valida, publica só se passar. Detectar depois de publicar já é tarde, porque alguém decidiu com o número errado.\u003c/p>\n\u003cp>E, para mudanças arriscadas, deploy gradual: rodar o novo escrevendo num destino sombra por alguns dias antes de cortar.\u003c/p>"},{"titleHtml":"🔴 P15. Qual a diferença entre orquestração e o que o dbt faz? Eles competem?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Não competem, operam em camadas diferentes.\u003c/p>\n\u003cp>O dbt é uma ferramenta de \u003cstrong>transformação\u003c/strong>: ele compila modelos SQL, resolve dependências entre eles por referências no código, e executa dentro do warehouse. Ele gera um DAG, mas é um DAG de modelos SQL \u003cstrong>dentro\u003c/strong> de um sistema, não de tarefas heterogêneas entre sistemas. Ele não ingere dados, não chama APIs, não roda containers, não agenda por si só em ambiente auto-hospedado.\u003c/p>\n\u003cp>O orquestrador coordena o ciclo completo: ingerir da origem, disparar o dbt, rodar validações, atualizar índices ou caches, notificar consumidores, e lidar com falha e retry em qualquer uma dessas etapas.\u003c/p>\n\u003cp>Na prática, o padrão comum é o Airflow disparando o dbt — frequentemente com granularidade fina, uma tarefa por modelo ou por grupo, para ter visibilidade e retry por modelo em vez de um bloco monolítico que falha inteiro. Existem integrações que expandem o grafo do dbt em tarefas do Airflow automaticamente.\u003c/p>\n\u003cp>A confusão surge porque ambos falam em DAG. A distinção que eu usaria é: dbt organiza \u003cstrong>transformações dentro do warehouse\u003c/strong>; o orquestrador organiza \u003cstrong>processos entre sistemas\u003c/strong>.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual é o papel correto de um orquestrador como o Airflow?","a":["Processar os dados com máxima performance","Coordenar: quando algo roda, em que ordem, e o que acontece na falha — disparando trabalho no warehouse, Spark ou containers, sem processar dado pesado nas próprias tasks","Substituir o warehouse nas transformações","Armazenar os dados intermediários dos pipelines"],"c":1,"e":"Carregar milhões de linhas num DataFrame dentro de uma task é usar o scheduler como cluster. XCom segue a mesma lógica: metadados pequenos e referências, nunca dados."},{"n":"🟡","levelName":"intermediario","q":"Um DAG diário com data interval do dia 13 \u003cstrong>executa quando\u003c/strong>?","a":["À meia-noite do próprio dia 13","No fim do intervalo — à meia-noite do dia 14 — porque o dia 13 só está completo depois que termina; o pipeline processa o dia 13","Ao meio-dia do dia 13","Assim que o primeiro dado do dia 13 chega"],"c":1,"e":"O nome antigo execution_date causou anos de confusão. O código deve usar data_interval_start/end como parâmetros — usar now() quebra o backfill, que passaria a processar o dia de hoje em todas as execuções."},{"n":"🟡","levelName":"intermediario","q":"Qual a armadilha do \u003cstrong>catchup\u003c/strong> ligado?","a":["Ele impede o DAG de rodar no horário","Ativar um DAG com start_date antiga dispara centenas de execuções de uma vez, podendo derrubar a origem — combine com max_active_runs ou desligue quando o histórico não interessa","Ele apaga o histórico de execuções","Ele duplica os DAG runs existentes"],"c":1,"e":"E se as execuções tiverem estado acumulado entre si, precisam rodar em ordem cronológica, não em paralelo."},{"n":"🟡","levelName":"intermediario","q":"O que pode ir no \u003cstrong>XCom\u003c/strong> — e o que não pode?","a":["Qualquer objeto serializável, sem restrição","Metadados pequenos (caminho de arquivo, ID de job, contagem); dados de verdade incham o banco de metadados e degradam o scheduler para todos — passe referências a storage","Apenas strings de até 255 caracteres","Nada — XCom foi descontinuado"],"c":1,"e":"O banco de metadados é o coração do Airflow. Custom XCom backends persistem em object storage transparentemente, mas o princípio permanece: orquestrador não é barramento de dados."},{"n":"🟡","levelName":"intermediario","q":"Muitos sensores esperando arquivos estão \u003cstrong>travando o cluster\u003c/strong>. Por quê, e qual a solução moderna?","a":["Sensores corrompem o banco de metadados; reinstalar o Airflow","Em modo poke cada sensor ocupa um slot de worker durante toda a espera; use modo reschedule ou deferrable operators — o triggerer assíncrono monitora milhares de condições com pouquíssimo recurso","Sensores exigem um executor dedicado","O timeout padrão é curto demais; basta aumentá-lo"],"c":1,"e":"É a causa clássica de cluster travado com workers ocupados sem fazer nada. Melhor ainda: disparo por evento (notificação do storage → API/watcher), eliminando a espera."},{"n":"🟡","levelName":"intermediario","q":"O que é orquestração \u003cstrong>orientada a dados\u003c/strong> e que problema resolve?","a":["Agendar DAGs com base no volume de dados","O pipeline declara dependência sobre datasets/assets e dispara quando eles são atualizados — elimina o frágil roda às 7h porque o outro roda às 6h, que falha silenciosamente quando a origem atrasa","Usar dados para prever o horário ótimo de execução","Rodar pipelines apenas quando o cluster está ocioso"],"c":1,"e":"Dependência implícita por horário é suposição não verificada: quando quebra, o pipeline processa dado incompleto sem falhar. Airflow 3 formalizou com asset-aware scheduling e watchers; Dagster nasceu assim."},{"n":"🟡","levelName":"intermediario","q":"O scheduler está lento para agendar tarefas. Quais as três frentes de investigação?","a":["Rede, DNS e certificados","Tempo de parse dos DAGs (código pesado no nível do módulo é pago a cada ciclo), banco de metadados inchado (task instances, XComs, histórico sem limpeza) e limites de concorrência — o efetivo é o menor entre global, DAG, task e pool","Versão do Python, memória do worker e logs","Timezone, criptografia e serialização"],"c":1,"e":"Aumentei os workers e não melhorou geralmente é limite de configuração, não de capacidade. E consulta a banco no corpo do DAG é multiplicada por cada ciclo de parse de cada arquivo."},{"n":"🔴","levelName":"avancado","q":"O \u003cstrong>dbt\u003c/strong> substitui o orquestrador?","a":["Sim — o dbt agenda e coordena todo o ciclo","Não: o dbt gera um DAG de modelos SQL dentro do warehouse; ele não ingere, não chama APIs, não coordena entre sistemas — o padrão é o orquestrador disparar o dbt","Sim, desde a versão com scheduler embutido","Não, porque dbt não usa DAGs"],"c":1,"e":"A confusão vem de ambos falarem em DAG. Distinção: dbt organiza transformações dentro do warehouse; o orquestrador organiza processos entre sistemas — ingestão, dbt, validações, notificações, falha e retry."}]},{"id":"11","fullTitle":"11 — Qualidade de Dados, Governança, Lineage e LGPD/GDPR","shortTitle":"Qualidade de Dados, Governança, Lineage e LGPD/GDPR","subtitle":"Dimensões de qualidade · Testes e observabilidade · Contratos de dados · Lineage · Catálogo e ownership · LGPD, GDPR e PII · Anonimização","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-por-que-qualidade-é-problema-de-engenharia-não-de-anális\">1.1 Por que qualidade é problema de engenharia, não de análise\u003c/h3>\n\u003cp>A intuição errada é que qualidade é responsabilidade de quem consome o dado — o analista descobre um número estranho e reporta. O problema desse modelo é o \u003cstrong>tempo de detecção\u003c/strong>: se o erro é descoberto quando alguém questiona um número, ele já circulou por dias, já embasou decisões, e já destruiu confiança.\u003c/p>\n\u003cp>E confiança é o ativo real de uma plataforma de dados. Uma vez perdida, os times constroem suas próprias planilhas paralelas, e você passa a ter N versões da verdade — que é o problema que a plataforma existia para resolver. Recuperar confiança é muito mais caro que mantê-la.\u003c/p>\n\u003cp>Por isso a qualidade tem que ser \u003cstrong>verificada no pipeline, antes da publicação\u003c/strong>, e não auditada depois.\u003c/p>\n\u003ch3 id=\"h-1-2-as-dimensões-de-qualidade\">1.2 As dimensões de qualidade\u003c/h3>\n\u003cp>Vocabulário padrão, e vale saber nomear:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Completude\u003c/strong>: os dados que deveriam estar lá estão? Faltam registros, faltam campos obrigatórios?\u003c/li>\u003cli>\u003cstrong>Acurácia\u003c/strong>: os valores refletem a realidade? É a dimensão mais difícil, porque exige uma referência externa.\u003c/li>\u003cli>\u003cstrong>Consistência\u003c/strong>: os dados concordam entre si e entre sistemas? A soma dos itens bate com o total do pedido? O warehouse bate com o sistema de origem?\u003c/li>\u003cli>\u003cstrong>Unicidade\u003c/strong>: há duplicatas? A chave é realmente única?\u003c/li>\u003cli>\u003cstrong>Validade / conformidade\u003c/strong>: os valores respeitam o formato, o tipo e o domínio esperados? CPF com dígito verificador válido, status dentro do conjunto permitido, valor não negativo?\u003c/li>\u003cli>\u003cstrong>Atualidade (timeliness/freshness)\u003c/strong>: o dado está disponível quando deveria? Um dado correto que chega tarde demais é inútil.\u003c/li>\u003cli>\u003cstrong>Integridade referencial\u003c/strong>: as chaves estrangeiras apontam para registros existentes?\u003c/li>\u003c/ul>\n\u003cp>Duas dimensões que candidatos esquecem e que rendem pontos:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Precisão/granularidade\u003c/strong>: o dado está no nível de detalhe necessário?\u003c/li>\u003cli>\u003cstrong>Interpretabilidade / semântica\u003c/strong>: o campo significa o que as pessoas acham que significa? Esse é o problema mais insidioso, porque nenhum teste automático o detecta — o schema é válido, os valores são plausíveis, e o número está errado porque \"receita\" significa coisas diferentes para dois times.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-3-testes-de-qualidade-como-e-onde\">1.3 Testes de qualidade: como e onde\u003c/h3>\n\u003cp>\u003cstrong>Testes na ingestão (schema e contrato).\u003c/strong> O dado que chega tem as colunas e tipos esperados? Falhar aqui é muito melhor que deixar o problema se propagar por dez camadas. É o \"shift left\" da qualidade.\u003c/p>\n\u003cp>\u003cstrong>Testes sobre o resultado da transformação.\u003c/strong> Os clássicos, que valem citar por nome:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Unicidade\u003c/strong> da chave primária.\u003c/li>\u003cli>\u003cstrong>Not null\u003c/strong> em campos obrigatórios.\u003c/li>\u003cli>\u003cstrong>Valores aceitos\u003c/strong> (o status está no conjunto válido).\u003c/li>\u003cli>\u003cstrong>Integridade referencial\u003c/strong> contra a dimensão.\u003c/li>\u003cli>\u003cstrong>Faixa de valores\u003c/strong> (idade entre 0 e 120, valor não negativo).\u003c/li>\u003cli>\u003cstrong>Volume de linhas\u003c/strong> dentro do esperado — comparado com o mesmo dia da semana anterior, não com ontem, porque sazonalidade semanal é forte na maioria dos negócios.\u003c/li>\u003cli>\u003cstrong>Reconciliação\u003c/strong> contra a origem em métricas-chave: a soma da receita no warehouse bate com a soma na origem?\u003c/li>\u003cli>\u003cstrong>Distribuição\u003c/strong>: a proporção de cada categoria mudou drasticamente? Isso pega mudanças silenciosas na origem que nenhum teste de schema detecta.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Onde os testes rodam importa tanto quanto o que testam.\u003c/strong> O padrão correto é \u003cstrong>write-audit-publish\u003c/strong>: escreve o resultado num local temporário, roda as validações contra ele, e publica atomicamente só se passar. Assim o dado ruim nunca fica visível. O antipadrão é publicar e depois auditar — quando o alerta chega, alguém já usou o número.\u003c/p>\n\u003cp>\u003cstrong>Severidade importa.\u003c/strong> Nem todo teste deve bloquear a publicação. Uma classificação útil:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Bloqueante\u003c/strong>: quebra de invariante estrutural (chave duplicada, FK órfã, volume 90% abaixo do esperado). Para o pipeline.\u003c/li>\u003cli>\u003cstrong>Alerta\u003c/strong>: desvio estatístico que merece investigação mas não invalida o dado.\u003c/li>\u003cli>\u003cstrong>Informativo\u003c/strong>: métrica monitorada ao longo do tempo.\u003c/li>\u003c/ul>\n\u003cp>Sem essa classificação, uma de duas coisas acontece: ou tudo bloqueia e as pessoas começam a desligar testes para o pipeline rodar, ou nada bloqueia e os alertas viram ruído ignorado. Ambas terminam no mesmo lugar.\u003c/p>\n\u003ch3 id=\"h-1-4-observabilidade-de-dados\">1.4 Observabilidade de dados\u003c/h3>\n\u003cp>Qualidade testa \u003cstrong>regras que você sabe escrever\u003c/strong>. Observabilidade detecta \u003cstrong>o que você não previu\u003c/strong>, monitorando o comportamento do dado ao longo do tempo. Os cinco pilares usualmente citados:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Freshness\u003c/strong>: quando o dado foi atualizado pela última vez?\u003c/li>\u003cli>\u003cstrong>Volume\u003c/strong>: quantas linhas chegaram, comparado ao histórico?\u003c/li>\u003cli>\u003cstrong>Schema\u003c/strong>: a estrutura mudou?\u003c/li>\u003cli>\u003cstrong>Distribuição\u003c/strong>: os valores estão dentro do padrão histórico (média, desvio, nulos, cardinalidade)?\u003c/li>\u003cli>\u003cstrong>Lineage\u003c/strong>: o que depende do quê, para avaliar impacto e rastrear causa.\u003c/li>\u003c/ul>\n\u003cp>A diferença prática: um teste falha quando você previu a regra. Observabilidade dispara quando algo \u003cem>mudou\u003c/em> — a taxa de nulos numa coluna saltou de 0,1% para 12%, sem que ninguém tenha escrito um teste para aquela coluna. É complementar, não substituto, e a combinação é o que dá cobertura real.\u003c/p>\n\u003cp>O risco da observabilidade automatizada é \u003cstrong>alerta demais\u003c/strong>. Detecção de anomalia sobre centenas de colunas gera ruído que ninguém lê. Ela precisa ser calibrada e priorizada por criticidade das tabelas.\u003c/p>\n\u003ch3 id=\"h-1-5-contratos-de-dados\">1.5 Contratos de dados\u003c/h3>\n\u003cp>Um \u003cstrong>contrato de dados\u003c/strong> é um acordo explícito e versionado entre quem produz e quem consome um dataset. O que ele contém:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Schema\u003c/strong>: campos, tipos, obrigatoriedade.\u003c/li>\u003cli>\u003cstrong>Semântica\u003c/strong>: o que cada campo significa, em português claro. Esta parte é a que mais falta e a que mais causa problema.\u003c/li>\u003cli>\u003cstrong>Garantias de qualidade\u003c/strong>: unicidade, faixas, regras de validade.\u003c/li>\u003cli>\u003cstrong>SLA\u003c/strong>: frequência de atualização, latência máxima, janela de disponibilidade.\u003c/li>\u003cli>\u003cstrong>Política de evolução\u003c/strong>: o que pode mudar, com quanto aviso, e qual o modo de compatibilidade.\u003c/li>\u003cli>\u003cstrong>Ownership\u003c/strong>: quem é responsável e como acioná-lo.\u003c/li>\u003cli>\u003cstrong>Classificação de sensibilidade\u003c/strong>: contém PII? Qual o nível de restrição?\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>O problema que resolve:\u003c/strong> sem contrato, o time de dados constrói pipelines sobre tabelas internas de aplicações que nunca prometeram estabilidade. Um desenvolvedor renomeia uma coluna numa refatoração legítima e quebra dez dashboards sem saber que eles existiam. O contrato torna a dependência \u003cstrong>visível e negociada\u003c/strong>, e transfere a responsabilidade de compatibilidade para o produtor.\u003c/p>\n\u003cp>\u003cstrong>O que faz um contrato funcionar:\u003c/strong> ele precisa ser \u003cstrong>verificado automaticamente\u003c/strong>, não ser um documento. Na prática isso significa: validação em CI do lado do produtor (a mudança quebra o contrato? o build falha), validação na ingestão do lado do consumidor, e — em mensageria — um Schema Registry com modo de compatibilidade configurado, que é a implementação técnica mais direta do conceito.\u003c/p>\n\u003cp>\u003cstrong>A parte difícil não é técnica, é organizacional.\u003c/strong> Contrato implica que o time de aplicação assume responsabilidade por consumidores analíticos, o que exige acordo de prioridade e frequentemente incentivo. Um contrato que o produtor não se sente responsável por cumprir é só documentação. Reconhecer isso numa entrevista é sinal de senioridade.\u003c/p>\n\u003ch3 id=\"h-1-6-lineage\">1.6 Lineage\u003c/h3>\n\u003cp>\u003cstrong>Lineage\u003c/strong> é o mapa de origem e transformação: de onde este dado veio, por quais processos passou, e o que depende dele.\u003c/p>\n\u003cp>Dois níveis:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Table-level\u003c/strong>: esta tabela deriva daquelas.\u003c/li>\u003cli>\u003cstrong>Column-level\u003c/strong>: esta coluna deriva daquelas colunas, por esta transformação. Muito mais útil e mais difícil de manter.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Para que serve, concretamente:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Análise de impacto\u003c/strong>: vou mudar esta tabela — o que quebra? Sem lineage, você descobre em produção.\u003c/li>\u003cli>\u003cstrong>Análise de causa raiz\u003c/strong>: este número está errado — de onde veio? Sem lineage, é arqueologia.\u003c/li>\u003cli>\u003cstrong>Compliance\u003c/strong>: onde estão os dados pessoais de um titular, em todas as cópias derivadas? Sem lineage, atender um pedido de exclusão sob LGPD é impossível de garantir.\u003c/li>\u003cli>\u003cstrong>Priorização e descomissionamento\u003c/strong>: esta tabela alimenta o relatório do conselho ou é um experimento abandonado? Isso decide o que merece SLA e o que pode ser deletado.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Como se obtém:\u003c/strong> parsing de SQL e de planos de execução (automático, cobertura boa, mas cega a lógica em código customizado); instrumentação dos frameworks (padrões como OpenLineage); metadados declarados pelo desenvolvedor (preciso mas depende de disciplina, e envelhece); e integração nativa em ferramentas que já conhecem as dependências, como dbt e Dagster.\u003c/p>\n\u003cp>O ponto realista: lineage automático raramente é completo. Ele perde o que acontece dentro de UDFs, de código Python arbitrário, e de sistemas fora da plataforma. Lineage parcial ainda é muito útil — mas apresentá-lo como completo é perigoso, principalmente em compliance.\u003c/p>\n\u003ch3 id=\"h-1-7-governança-catálogo-e-ownership\">1.7 Governança, catálogo e ownership\u003c/h3>\n\u003cp>\u003cstrong>Catálogo de dados\u003c/strong> é o inventário: quais datasets existem, o que significam, quem é dono, qual a sensibilidade, quando foram atualizados, quem os usa. Sem catálogo, você tem um data swamp por definição — o dado existe mas não é encontrável nem interpretável.\u003c/p>\n\u003cp>O que faz um catálogo funcionar (e a maioria falha aqui): ele precisa ser \u003cstrong>alimentado automaticamente\u003c/strong> e ter \u003cstrong>valor imediato para quem consulta\u003c/strong>. Catálogos que dependem de preenchimento manual de documentação ficam desatualizados em três meses e param de ser consultados, o que reforça o abandono. Metadados técnicos (schema, frequência, volume, lineage) devem vir automaticamente; metadados de negócio (significado, dono, criticidade) precisam de curadoria, e é aí que o processo precisa ser leve o suficiente para acontecer.\u003c/p>\n\u003cp>\u003cstrong>Ownership\u003c/strong> é o conceito mais subestimado de governança. Todo dataset precisa de um dono nomeado — uma pessoa ou um time, não \"a área de dados\". Sem dono: ninguém corrige, ninguém decide sobre mudanças, ninguém responde quando quebra, e ninguém autoriza a exclusão. A entropia sempre vence quando a responsabilidade é difusa.\u003c/p>\n\u003cp>\u003cstrong>Controle de acesso\u003c/strong> costuma operar em três granularidades: tabela, coluna (mascarar CPF para quem não precisa) e linha (cada gerente vê só sua região). O modelo mais gerenciável é baseado em papéis ou atributos, definido no catálogo e aplicado pelo engine — não implementado em views ad hoc espalhadas, que ninguém consegue auditar.\u003c/p>\n\u003cp>\u003cstrong>MDM (Master Data Management)\u003c/strong> vale conhecer: a disciplina de manter uma versão única e confiável das entidades centrais (cliente, produto, fornecedor) entre sistemas. É onde vivem os problemas de resolução de entidade — o mesmo cliente cadastrado três vezes com grafias diferentes.\u003c/p>\n\u003ch3 id=\"h-1-8-lgpd-e-gdpr-o-que-um-engenheiro-de-dados-precisa-saber\">1.8 LGPD e GDPR: o que um engenheiro de dados precisa saber\u003c/h3>\n\u003cp>Não é preciso ser advogado, mas é preciso conhecer os conceitos que \u003cstrong>restringem decisões de arquitetura\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Conceitos:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Dado pessoal\u003c/strong>: qualquer informação relacionada a pessoa natural identificada ou identificável. Inclui identificadores indiretos — IP, cookie, ID de dispositivo, e combinações que permitem reidentificação.\u003c/li>\u003cli>\u003cstrong>Dado pessoal sensível\u003c/strong> (LGPD) / \u003cstrong>categorias especiais\u003c/strong> (GDPR): origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, dado referente a saúde, vida sexual, dado genético e biométrico. Proteção reforçada e bases legais mais restritas.\u003c/li>\u003cli>\u003cstrong>Titular\u003c/strong>: a pessoa a quem o dado se refere.\u003c/li>\u003cli>\u003cstrong>Controlador\u003c/strong>: quem decide as finalidades e os meios do tratamento.\u003c/li>\u003cli>\u003cstrong>Operador\u003c/strong> (LGPD) / \u003cstrong>processador\u003c/strong> (GDPR): quem trata em nome do controlador.\u003c/li>\u003cli>\u003cstrong>Encarregado / DPO\u003c/strong>: canal de comunicação com titulares e autoridade.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Princípios que viram requisito técnico:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Finalidade e necessidade (minimização)\u003c/strong>: colete e retenha só o necessário para a finalidade declarada. Isso confronta diretamente a cultura de \"guarda tudo que talvez sirva\" do data lake — e é um ótimo ponto para levantar numa entrevista de arquitetura.\u003c/li>\u003cli>\u003cstrong>Base legal\u003c/strong>: todo tratamento precisa de uma. Consentimento é apenas uma delas; legítimo interesse, execução de contrato e obrigação legal são outras. Se a base é consentimento, ele precisa ser rastreável e revogável — o que significa que o pipeline precisa saber \u003cem>quem consentiu com o quê\u003c/em> e propagar revogações.\u003c/li>\u003cli>\u003cstrong>Direitos do titular\u003c/strong>: acesso, correção, portabilidade, eliminação, informação sobre compartilhamento, e revisão de decisões automatizadas. Cada um vira um requisito técnico concreto.\u003c/li>\u003cli>\u003cstrong>Retenção limitada\u003c/strong>: dado não pode ser mantido indefinidamente sem justificativa.\u003c/li>\u003cli>\u003cstrong>Segurança e privacy by design\u003c/strong>: proteção considerada desde a arquitetura, não adicionada depois.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Os problemas técnicos concretos que isso gera\u003c/strong> — e é aqui que a pergunta de entrevista mora:\u003c/p>\n\u003cp>\u003cstrong>Direito à eliminação em storage imutável.\u003c/strong> Parquet é imutável; um log de eventos é append-only; backups são imutáveis por definição. Como apagar uma pessoa? Abordagens: formatos de tabela com DELETE (que reescrevem ou usam deletion vectors), tombstones em log compactado no Kafka, e \u003cstrong>crypto-shredding\u003c/strong> — cifrar os dados de cada titular com uma chave própria e destruir a chave, tornando o dado irrecuperável sem reescrever nada. Crypto-shredding é a resposta elegante para backups e logs imutáveis, e citá-la impressiona.\u003c/p>\n\u003cp>\u003cstrong>Propagação da exclusão.\u003c/strong> Apagar da tabela principal não basta se o dado foi copiado para dez tabelas derivadas, um cache, um índice de busca e um sistema de terceiros. É exatamente por isso que lineage deixa de ser conveniência e vira requisito de compliance.\u003c/p>\n\u003cp>\u003cstrong>Anonimização vs pseudonimização.\u003c/strong> Distinção crucial e frequentemente cobrada:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Pseudonimização\u003c/strong> substitui identificadores por tokens, mas mantém a possibilidade de reidentificação com informação adicional (a tabela de mapeamento). Dado pseudonimizado \u003cstrong>continua sendo dado pessoal\u003c/strong> e continua sujeito à lei.\u003c/li>\u003cli>\u003cstrong>Anonimização\u003c/strong> torna a reidentificação impossível por meios razoáveis. Dado verdadeiramente anônimo sai do escopo da lei.\u003c/li>\u003cli>\u003cstrong>O ponto que separa candidatos:\u003c/strong> anonimização real é muito mais difícil do que parece. Remover o nome e o CPF não anonimiza nada — combinações de atributos (CEP, data de nascimento, sexo) reidentificam a maior parte das pessoas. Por isso existem k-anonimato (cada registro é indistinguível de pelo menos k-1 outros), l-diversidade e privacidade diferencial (adicionar ruído calibrado com garantia matemática). Muita coisa chamada de \"anonimizada\" na prática é apenas pseudonimizada, e essa confusão gera exposição regulatória real.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Transferência internacional.\u003c/strong> Ambas as leis restringem envio de dados para outros países sem salvaguardas. Isso afeta escolha de região de nuvem e de fornecedores.\u003c/p>\n\u003cp>\u003cstrong>Ambientes de desenvolvimento.\u003c/strong> Copiar a base de produção para dev é uma das violações mais comuns e menos discutidas. A solução é dado sintético ou mascarado — e mascarar preservando integridade referencial e distribuição estatística é um problema técnico não trivial.\u003c/p>\n\u003cp>\u003cstrong>Diferenças entre LGPD e GDPR\u003c/strong> que valem mencionar: são muito similares em estrutura e princípios; a LGPD tem dez bases legais (contra seis do GDPR), sanções com teto de 2% do faturamento no Brasil limitado a R$ 50 milhões por infração (contra até 4% do faturamento global no GDPR), e a autoridade brasileira é a ANPD. Para engenharia, as implicações práticas são essencialmente as mesmas.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Tratar qualidade como responsabilidade do consumidor.\u003c/strong> Se o erro é descoberto quando alguém questiona um número, já é tarde: ele circulou, embasou decisões e consumiu confiança.\u003c/p>\n\u003cp>\u003cstrong>Publicar e auditar depois.\u003c/strong> Write-audit-publish existe justamente para que o dado ruim nunca fique visível.\u003c/p>\n\u003cp>\u003cstrong>Fazer todo teste bloquear.\u003c/strong> As pessoas desligam os testes para o pipeline rodar, e você fica pior do que antes. Classifique severidade.\u003c/p>\n\u003cp>\u003cstrong>Alerta que ninguém lê.\u003c/strong> Alerta ignorado é pior que alerta ausente, porque treina o time a ignorar tudo. Meça a taxa de ruído e recalibre.\u003c/p>\n\u003cp>\u003cstrong>Confundir pseudonimização com anonimização.\u003c/strong> Dado pseudonimizado continua sendo dado pessoal e continua sujeito à lei. Remover nome e CPF não anonimiza.\u003c/p>\n\u003cp>\u003cstrong>Achar que apagar da tabela principal cumpre o direito à eliminação.\u003c/strong> Sem propagar para derivadas, caches, índices e terceiros, você não cumpriu — e sem lineage, não consegue nem afirmar que cumpriu.\u003c/p>\n\u003cp>\u003cstrong>Copiar produção para desenvolvimento.\u003c/strong> É uma das violações mais comuns e menos discutidas.\u003c/p>\n\u003cp>\u003cstrong>Catálogo alimentado manualmente.\u003c/strong> Fica desatualizado em três meses, para de ser consultado, e o abandono se retroalimenta. Metadados técnicos precisam ser automáticos.\u003c/p>\n\u003cp>\u003cstrong>Dataset sem dono nomeado.\u003c/strong> \"A área de dados\" não é dono. Sem responsável, ninguém corrige, ninguém decide e ninguém autoriza a exclusão.\u003c/p>\n\u003cp>\u003cstrong>Contrato de dados como documento.\u003c/strong> Se não é validado automaticamente no CI do produtor, é decoração.\u003c/p>\n\u003cp>\u003cstrong>Apresentar lineage automático como completo.\u003c/strong> Ele perde o que acontece dentro de UDFs e de código customizado. Em compliance, essa lacuna importa.\u003c/p>\n\u003cp>\u003cstrong>Medir qualidade por número de testes escritos.\u003c/strong> Métrica de atividade. O que importa é tempo de detecção e quem detectou.\u003c/p>\n\u003cp>\u003cstrong>Culpar o desenvolvedor que quebrou o schema.\u003c/strong> A dependência era invisível para ele. O problema é de processo, e a correção é contrato validado onde ele toma a decisão.\u003c/p>\n\u003cp>\u003cstrong>Tratar governança como problema de ferramenta.\u003c/strong> Sem ownership, patrocínio e consequência, nenhuma ferramenta resolve.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. Quais são as dimensões de qualidade de dados?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Completude (o que deveria estar lá está?), acurácia (reflete a realidade?), consistência (concorda entre si e entre sistemas?), unicidade (há duplicatas?), validade (respeita formato, tipo e domínio?), atualidade (chegou quando deveria?) e integridade referencial (as chaves apontam para registros existentes).\u003c/p>\n\u003cp>Eu acrescentaria uma que costuma ficar de fora e é a mais perigosa: a \u003cstrong>semântica\u003c/strong> — o campo significa o que as pessoas acham que significa. Nenhum teste automático pega isso, porque o schema é válido e os valores são plausíveis; o número está errado porque dois times definem \"receita\" de formas diferentes.\u003c/p>"},{"titleHtml":"🟢 P2. Que tipos de teste de qualidade você implementaria num pipeline?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Unicidade da chave primária, not null em campos obrigatórios, valores dentro do conjunto ou da faixa permitida, integridade referencial contra as dimensões, volume de linhas dentro do esperado — comparando com o mesmo dia da semana anterior, porque sazonalidade semanal é forte — e reconciliação contra a origem em métricas-chave.\u003c/p>\n\u003cp>Adicionaria testes de distribuição: se a proporção de cada categoria mudou bruscamente, algo mudou na origem, e isso não é detectado por teste de schema.\u003c/p>\n\u003cp>E o mais importante é \u003cstrong>onde\u003c/strong> eles rodam: uso write-audit-publish — escrevo num local temporário, valido, e publico atomicamente só se passar. Publicar e auditar depois significa que, quando o alerta chega, alguém já usou o número.\u003c/p>"},{"titleHtml":"🟢 P3. O que é lineage e para que serve?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É o mapa de origem e transformação: de onde o dado veio, por onde passou e o que depende dele.\u003c/p>\n\u003cp>Serve para quatro coisas na prática: análise de impacto antes de mudar algo, análise de causa raiz quando um número está errado, compliance — localizar todas as cópias derivadas de dados pessoais para atender um pedido de exclusão — e priorização, distinguindo a tabela que alimenta o relatório do conselho da que é experimento abandonado.\u003c/p>\n\u003cp>Column-level lineage é bem mais útil que table-level, e bem mais difícil de manter.\u003c/p>"},{"titleHtml":"🟢 P4. O que é dado pessoal segundo a LGPD?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Qualquer informação relacionada a pessoa natural identificada ou \u003cstrong>identificável\u003c/strong>. O ponto que costuma ser subestimado é o \"identificável\": inclui identificadores indiretos como IP, cookie e ID de dispositivo, e inclui combinações de atributos que permitem reidentificação mesmo sem nome ou CPF.\u003c/p>\n\u003cp>Há ainda a categoria de dado pessoal sensível — origem racial, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, genético e biométrico — com proteção reforçada e bases legais mais restritas.\u003c/p>"},{"titleHtml":"🟡 P5. O que é um contrato de dados e o que ele deve conter?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um acordo explícito e versionado entre produtor e consumidor de um dataset. Deve conter schema com tipos e obrigatoriedade, a \u003cstrong>semântica\u003c/strong> de cada campo em linguagem clara, garantias de qualidade, SLA de frequência e latência, política de evolução — o que pode mudar, com quanto aviso e sob qual modo de compatibilidade —, ownership e classificação de sensibilidade.\u003c/p>\n\u003cp>O problema que resolve é que, sem contrato, o time de dados constrói pipelines sobre tabelas internas de aplicações que nunca prometeram estabilidade. Um desenvolvedor renomeia uma coluna numa refatoração legítima e quebra dez dashboards sem saber que existiam.\u003c/p>\n\u003cp>E o que faz funcionar é ser \u003cstrong>verificado automaticamente\u003c/strong>: validação em CI do lado do produtor, validação na ingestão do lado do consumidor, e Schema Registry com modo de compatibilidade em mensageria. Contrato que é só documento não muda nada.\u003c/p>\n\u003cp>A parte difícil, aliás, não é técnica: é fazer o time de aplicação assumir responsabilidade por consumidores analíticos. Isso exige acordo organizacional, não ferramenta.\u003c/p>"},{"titleHtml":"🟡 P6. Qual a diferença entre testes de qualidade e observabilidade de dados?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Teste verifica uma regra que você \u003cstrong>sabia\u003c/strong> escrever: chave única, valor não negativo, FK válida. Observabilidade monitora o comportamento do dado ao longo do tempo e detecta o que você \u003cstrong>não previu\u003c/strong> — freshness, volume, mudança de schema, desvio de distribuição, e lineage para avaliar impacto.\u003c/p>\n\u003cp>Na prática: um teste falha quando você antecipou o problema. Observabilidade dispara quando a taxa de nulos numa coluna salta de 0,1% para 12% sem que ninguém tivesse escrito um teste para aquela coluna.\u003c/p>\n\u003cp>São complementares, e a cobertura real vem da combinação. O risco da observabilidade automatizada é gerar alerta demais — detecção de anomalia sobre centenas de colunas produz ruído que ninguém lê, então precisa ser calibrada e priorizada pela criticidade das tabelas.\u003c/p>"},{"titleHtml":"🟡 P7. Como você lida com o \"direito ao esquecimento\" numa arquitetura de data lake?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O problema é que a arquitetura é feita de coisas imutáveis: Parquet não se altera, logs são append-only, backups são imutáveis por definição.\u003c/p>\n\u003cp>Três abordagens, e normalmente uso mais de uma.\u003c/p>\n\u003cp>\u003cstrong>Formato de tabela com DELETE.\u003c/strong> Iceberg ou Delta suportam remoção de linha, seja reescrevendo os arquivos afetados, seja com deletion vectors. Resolve a camada analítica.\u003c/p>\n\u003cp>\u003cstrong>Tombstones em log compactado.\u003c/strong> No Kafka, publicar uma mensagem nula para a chave do titular num tópico compactado remove o valor na compactação. É o mecanismo padrão ali.\u003c/p>\n\u003cp>\u003cstrong>Crypto-shredding.\u003c/strong> Cifrar os dados de cada titular com uma chave individual e destruir a chave quando a exclusão é solicitada. O dado permanece fisicamente mas se torna irrecuperável. É a resposta elegante para backups e logs históricos que não podem ser reescritos.\u003c/p>\n\u003cp>Mas o desafio maior não é apagar da tabela principal — é \u003cstrong>propagar\u003c/strong>. O dado foi copiado para tabelas derivadas, agregados, caches, índices de busca e possivelmente sistemas de terceiros. É exatamente por isso que lineage deixa de ser conveniência e vira requisito de compliance: sem ele, você não consegue nem afirmar que cumpriu.\u003c/p>\n\u003cp>Na prática, eu desenharia para isso desde o começo: isolar PII em poucas tabelas com referência por identificador substituto nas demais, de modo que apagar de um lugar propague por construção em vez de exigir caçada.\u003c/p>"},{"titleHtml":"🟡 P8. Qual a diferença entre anonimização e pseudonimização?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Pseudonimização substitui identificadores por tokens, mas mantém a possibilidade de reidentificação com informação adicional — tipicamente uma tabela de mapeamento guardada separadamente. Dado pseudonimizado \u003cstrong>continua sendo dado pessoal\u003c/strong> e continua sujeito à lei; a pseudonimização é uma medida de segurança, não uma saída do escopo regulatório.\u003c/p>\n\u003cp>Anonimização torna a reidentificação impossível por meios razoáveis, e aí o dado sai do escopo.\u003c/p>\n\u003cp>O ponto crítico é que anonimização real é muito mais difícil do que parece. Remover nome e CPF não anonimiza: combinações de CEP, data de nascimento e sexo reidentificam a maior parte das pessoas. Por isso existem técnicas formais — k-anonimato, onde cada registro é indistinguível de pelo menos k-1 outros; l-diversidade; e privacidade diferencial, que adiciona ruído calibrado com garantia matemática.\u003c/p>\n\u003cp>Na prática, muita coisa chamada de \"anonimizada\" é apenas pseudonimizada, e essa confusão gera exposição regulatória real. Eu seria explícito sobre qual das duas estou entregando.\u003c/p>"},{"titleHtml":"🟡 P9. Como você garantiria qualidade sem bloquear a entrega do time?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Classificando severidade, porque tratar tudo como bloqueante é o caminho mais rápido para as pessoas desligarem os testes.\u003c/p>\n\u003cp>\u003cstrong>Bloqueante\u003c/strong> para quebra de invariante estrutural: chave duplicada, FK órfã, volume 90% abaixo do esperado. Publicar isso é pior que atrasar.\u003c/p>\n\u003cp>\u003cstrong>Alerta\u003c/strong> para desvio estatístico que merece investigação mas não invalida o dado.\u003c/p>\n\u003cp>\u003cstrong>Informativo\u003c/strong> para métricas monitoradas ao longo do tempo.\u003c/p>\n\u003cp>Além disso, faria três coisas. Começar pelas tabelas críticas em vez de tentar cobrir tudo — cobertura uniforme é cara e dilui a atenção. Automatizar os testes óbvios na criação da tabela (unicidade da PK, not null nos obrigatórios) para que a linha de base seja gratuita. E medir o ruído: se um alerta dispara toda semana e ninguém age, ele está errado e precisa ser recalibrado ou removido, porque alerta ignorado é pior que alerta ausente — ele treina o time a ignorar.\u003c/p>"},{"titleHtml":"🔴 P10. Como você implementaria governança de dados numa empresa que não tem nenhuma?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Não começaria por ferramenta nem por política escrita. Começaria por um problema concreto que doa, porque governança sem dor percebida vira burocracia rejeitada.\u003c/p>\n\u003cp>\u003cstrong>Primeiro, inventário e criticidade.\u003c/strong> Descobrir o que existe, quem usa (logs de acesso são a melhor fonte, muito melhor que perguntar), e quais são os poucos datasets que sustentam decisões importantes. Governança começa por eles, não por tudo.\u003c/p>\n\u003cp>\u003cstrong>Segundo, ownership.\u003c/strong> Cada dataset crítico ganha um dono nomeado. É a intervenção de maior retorno e a mais barata: sem dono, ninguém corrige nada e a entropia vence. E \"o time de dados\" não é dono útil.\u003c/p>\n\u003cp>\u003cstrong>Terceiro, classificação de sensibilidade.\u003c/strong> Marcar o que é PII e o que é sensível, porque isso determina controle de acesso e é a parte com risco regulatório.\u003c/p>\n\u003cp>\u003cstrong>Quarto, catálogo alimentado automaticamente.\u003c/strong> Schema, frequência, volume, lineage e quem consulta devem vir de metadados automáticos. Só o significado de negócio precisa de curadoria humana — e esse processo tem que ser leve, porque catálogo que depende de documentação manual fica desatualizado em três meses e para de ser consultado.\u003c/p>\n\u003cp>\u003cstrong>Quinto, testes de qualidade nas tabelas críticas\u003c/strong> com write-audit-publish, e SLA declarado.\u003c/p>\n\u003cp>\u003cstrong>Sexto, controle de acesso por papel\u003c/strong>, definido centralmente e aplicado pelo engine, em vez de views ad hoc que ninguém consegue auditar.\u003c/p>\n\u003cp>E o que realmente decide o resultado: \u003cstrong>um fórum de decisão e incentivos\u003c/strong>. Governança falha quando é imposta por um time sem autoridade sobre quem produz os dados. Precisa de patrocínio, de participação dos donos de domínio, e de consequência quando o contrato é quebrado. Eu apresentaria isso explicitamente como condição, porque prometer governança sem isso é prometer o que não se pode entregar.\u003c/p>"},{"titleHtml":"🔴 P11. Um número no dashboard executivo está errado. Como você conduz?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Antes de investigar, uma pergunta: \u003cstrong>está errado ou está diferente do que a pessoa esperava?\u003c/strong> Uma fração grande desses casos é divergência de definição, não bug. \"Receita\" líquida ou bruta? Inclui cancelamentos? Qual fuso horário define o dia? Descobrir isso primeiro economiza horas.\u003c/p>\n\u003cp>Se for bug de verdade:\u003c/p>\n\u003cp>\u003cstrong>Contenção primeiro.\u003c/strong> Sinalizar o dashboard como sob investigação, para que ninguém tome mais decisões com ele. Isso vem antes do diagnóstico — o custo de decisões erradas continua correndo enquanto você investiga.\u003c/p>\n\u003cp>\u003cstrong>Delimitar.\u003c/strong> Quando começou? Afeta todas as métricas ou uma? Todos os períodos ou só recentes? Isso já aponta para a camada provável: se só o período recente está errado, é uma mudança na origem ou no pipeline; se o histórico inteiro mudou, alguém reprocessou com lógica nova.\u003c/p>\n\u003cp>\u003cstrong>Seguir o lineage de trás para frente\u003c/strong>, comparando em cada camada com a anterior, até achar onde a divergência aparece. Sem lineage, isso é arqueologia; com ele, são minutos.\u003c/p>\n\u003cp>\u003cstrong>Verificar as suspeitas usuais:\u003c/strong> duplicação por join com chave não única — a causa mais comum, porque infla números de forma plausível; mudança de schema ou de semântica na origem; carga parcial que foi publicada; alteração de lógica que não foi comunicada; e fuso horário na fronteira do dia.\u003c/p>\n\u003cp>\u003cstrong>Corrigir e reprocessar\u003c/strong> com write-audit-publish, validando contra a origem antes de publicar.\u003c/p>\n\u003cp>\u003cstrong>Depois, o mais importante:\u003c/strong> um post-mortem sem culpados que responda por que o teste automático não pegou. Toda ocorrência dessas deveria virar um teste novo. Se o mesmo tipo de problema acontece duas vezes, o processo falhou, não a pessoa. E comunicar proativamente aos consumidores o que houve e o que foi corrigido — silêncio destrói mais confiança que o erro em si.\u003c/p>"},{"titleHtml":"🔴 P12. Como você desenharia uma plataforma de dados para atender LGPD desde o início?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Privacy by design significa que as restrições entram na arquitetura, não como camada adicionada depois.\u003c/p>\n\u003cp>\u003cstrong>Minimização na ingestão.\u003c/strong> Não coletar o que não tem finalidade declarada. Isso confronta diretamente a cultura de \"guarda tudo que talvez sirva\" do data lake, e é uma conversa que precisa ser explícita — porque tecnicamente é mais fácil guardar tudo, e juridicamente é o oposto.\u003c/p>\n\u003cp>\u003cstrong>Isolamento de PII.\u003c/strong> Concentrar dados pessoais em poucas tabelas, com as demais referenciando por identificador substituto. Isso torna acesso, mascaramento e exclusão tratáveis: você controla um perímetro pequeno em vez de caçar PII espalhada por trezentas tabelas.\u003c/p>\n\u003cp>\u003cstrong>Classificação automática e obrigatória.\u003c/strong> Toda coluna tem classificação de sensibilidade como metadado, e as políticas de acesso e mascaramento são derivadas dela pelo engine, não implementadas manualmente por tabela. Colunas não classificadas devem ser tratadas como restritas por padrão.\u003c/p>\n\u003cp>\u003cstrong>Mascaramento dinâmico por papel.\u003c/strong> O mesmo dado exibe CPF completo para quem tem base legal e mascarado para os demais, sem manter duas cópias.\u003c/p>\n\u003cp>\u003cstrong>Crypto-shredding por titular\u003c/strong> em camadas históricas e backups, para que a exclusão seja viável sem reescrever dados imutáveis.\u003c/p>\n\u003cp>\u003cstrong>Rastreamento de consentimento e base legal como dado de primeira classe\u003c/strong>, propagado pelo pipeline. Se a base é consentimento, o pipeline precisa saber quem consentiu com o quê e reagir a revogações — não adianta a política existir se o dado não carrega essa informação.\u003c/p>\n\u003cp>\u003cstrong>Retenção automatizada.\u003c/strong> Política por dataset, aplicada por processo, não por lembrete. Retenção manual não acontece.\u003c/p>\n\u003cp>\u003cstrong>Lineage como requisito\u003c/strong>, porque sem ele você não consegue provar que uma exclusão se propagou.\u003c/p>\n\u003cp>\u003cstrong>Ambientes de desenvolvimento com dado sintético ou mascarado.\u003c/strong> Copiar produção para dev é uma das violações mais comuns e menos discutidas, e mascarar preservando integridade referencial e distribuição é um problema técnico que precisa ser resolvido de verdade, não improvisado.\u003c/p>\n\u003cp>\u003cstrong>Trilha de auditoria\u003c/strong> de quem acessou o quê, que é exigível e frequentemente esquecida.\u003c/p>\n\u003cp>E eu envolveria o DPO ou o jurídico nas decisões de arquitetura desde o começo, porque várias dessas escolhas dependem de interpretação legal — base legal aplicável, prazo de retenção, o que conta como anonimizado — e engenheiro decidindo isso sozinho é como esses problemas surgem.\u003c/p>"},{"titleHtml":"🔴 P13. Como você mediria se a qualidade de dados está melhorando?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Com métricas de resultado, não de atividade. \"Número de testes escritos\" é métrica de atividade e não diz nada sobre confiabilidade.\u003c/p>\n\u003cp>\u003cstrong>Tempo de detecção.\u003c/strong> Quanto tempo entre o problema ocorrer e ser detectado. É a métrica mais importante, porque tudo depende dela: se cai de dias para minutos, o dano cai junto.\u003c/p>\n\u003cp>\u003cstrong>Origem da detecção.\u003c/strong> Que fração dos incidentes foi encontrada pelo monitoramento versus reportada por um usuário. Descobrir pelo usuário é o pior caso, e a proporção entre os dois é um indicador direto de maturidade.\u003c/p>\n\u003cp>\u003cstrong>Tempo de resolução\u003c/strong>, e quanto dele é diagnóstico — porque diagnóstico longo aponta falta de lineage e de observabilidade, que é acionável.\u003c/p>\n\u003cp>\u003cstrong>Incidentes recorrentes.\u003c/strong> O mesmo tipo de problema repetindo indica que a correção tratou sintoma. Idealmente, cada incidente vira um teste, e a recorrência tende a zero.\u003c/p>\n\u003cp>\u003cstrong>Cumprimento de SLA de freshness\u003c/strong> nas tabelas críticas.\u003c/p>\n\u003cp>\u003cstrong>Cobertura ponderada por criticidade\u003c/strong>, não cobertura bruta — 100% de testes em tabelas irrelevantes não vale nada.\u003c/p>\n\u003cp>E duas métricas de confiança, que são o objetivo real: a \u003cstrong>taxa de ruído dos alertas\u003c/strong> (fração de alertas que não geraram ação — se for alta, o sistema está treinando as pessoas a ignorar) e alguma medida de confiança do consumidor, seja uma pesquisa simples, seja o indicador indireto de quantos times mantêm planilhas paralelas em vez de usar a plataforma.\u003c/p>"},{"titleHtml":"🔴 P14. Um time de aplicação mudou o schema e quebrou seu pipeline. Como você evita que isso se repita?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Trataria como falha de processo, não do desenvolvedor — do ponto de vista dele, ele fez uma refatoração legítima numa tabela interna do serviço dele, e ninguém disse que havia dez dashboards dependendo dela. A dependência era invisível.\u003c/p>\n\u003cp>\u003cstrong>Curto prazo: falhar cedo e alto.\u003c/strong> Validação de schema na ingestão, que interrompe o pipeline com erro claro em vez de propagar silenciosamente. Um schema mudado que só aparece dez camadas adiante como número errado é muito pior que uma falha na porta de entrada.\u003c/p>\n\u003cp>\u003cstrong>Médio prazo: tornar a dependência visível e contratual.\u003c/strong> Um contrato de dados sobre aquela interface, verificado no CI do produtor — se a mudança quebra o contrato, o build dele falha, e ele descobre em minutos em vez de eu descobrir em produção. Esse é o único mecanismo que realmente funciona, porque coloca o sinal onde a decisão é tomada.\u003c/p>\n\u003cp>\u003cstrong>Estrutural: parar de ler tabelas internas de aplicação.\u003c/strong> A causa raiz é acoplamento a um detalhe de implementação de outro sistema. A alternativa é o produtor publicar uma interface estável e versionada — eventos com schema registrado, ou uma tabela/view explicitamente pública — e o pipeline consumir isso. Aí ele pode refatorar internamente à vontade.\u003c/p>\n\u003cp>\u003cstrong>Organizacional, e é a parte que decide:\u003c/strong> o time de aplicação precisa aceitar que consumidores analíticos existem e importam. Isso exige patrocínio e priorização; sem isso, o contrato é um documento que ninguém cumpre. Eu levaria a conversa nesse nível, com o custo do incidente quantificado, em vez de tratar como problema técnico isolado.\u003c/p>\n\u003cp>E, no imediato, um canal de comunicação simples: eles saberem quem avisar quando mudarem algo, e eu ter visibilidade das mudanças planejadas.\u003c/p>"},{"titleHtml":"🔴 P15. Qual a diferença entre governança centralizada e federada? Qual você recomenda?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Centralizada significa um time definindo padrões, aprovando mudanças e frequentemente executando o trabalho de dados. Vantagens: consistência, definições únicas, controle de acesso coerente, e uma visão global. Desvantagem: o time vira gargalo e não tem contexto de negócio suficiente sobre dezenas de domínios — as decisões ficam lentas e às vezes erradas por falta de contexto.\u003c/p>\n\u003cp>Federada distribui a responsabilidade para os domínios, com padrões globais definidos centralmente. Vantagem: quem conhece o dado cuida dele, e escala com a organização. Desvantagem: sem mecanismos fortes de padronização, cada domínio diverge e você recria silos com definições incompatíveis.\u003c/p>\n\u003cp>O modelo que eu recomendo é \u003cstrong>governança federada computacional\u003c/strong>, que é o quarto princípio do Data Mesh e o que torna o resto viável: os padrões globais são \u003cstrong>aplicados automaticamente pela plataforma\u003c/strong> em vez de dependerem de disciplina. Classificação de sensibilidade obrigatória para publicar, contrato validado em CI, política de acesso derivada de metadado, testes mínimos como condição de publicação. Assim o domínio tem autonomia dentro de trilhos que ele não consegue sair sem esforço deliberado.\u003c/p>\n\u003cp>E ajustaria pela maturidade e pelo tamanho: numa empresa pequena, centralizado funciona melhor e a sobrecarga de coordenação do federado não se paga. Em organizações grandes com domínios genuinamente independentes, federado é a única coisa que escala. O erro comum é adotar federação sem a parte computacional — aí você tem descentralização sem contrapesos, que é o silo de sempre com nome novo.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual dimensão de qualidade \u003cstrong>nenhum teste automático detecta\u003c/strong>?","a":["Unicidade da chave primária","A semântica: o campo não significa o que as pessoas acham — schema válido, valores plausíveis, e o número errado porque dois times definem receita de formas diferentes","Integridade referencial","Taxa de valores nulos"],"c":1,"e":"É a dimensão mais insidiosa e a que mais falta em contratos de dados. As demais (completude, acurácia, consistência, unicidade, validade, atualidade) têm testes concretos."},{"n":"🟡","levelName":"intermediario","q":"Onde os testes de qualidade devem rodar?","a":["Depois da publicação, como auditoria periódica","No pipeline, antes da publicação, com write-audit-publish: escreve em local temporário, valida, e publica atomicamente só se passar — dado ruim nunca fica visível","Apenas no ambiente de desenvolvimento","No BI, onde o dado é consumido"],"c":1,"e":"Se o erro é descoberto quando alguém questiona um número, ele já circulou, embasou decisões e destruiu confiança — e confiança perdida gera planilhas paralelas, o problema que a plataforma existia para resolver."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>nem todo teste\u003c/strong> deve bloquear a publicação?","a":["Porque testes bloqueantes são caros de manter","Porque se tudo bloqueia, as pessoas desligam testes para o pipeline rodar; classifique: bloqueante (invariante estrutural), alerta (desvio a investigar) e informativo (métrica acompanhada)","Porque bloquear viola SLAs de freshness","Porque só o time de dados pode bloquear pipelines"],"c":1,"e":"O outro extremo — nada bloqueia — vira ruído ignorado. E meça a taxa de ruído: alerta que dispara toda semana sem ação treina o time a ignorar tudo."},{"n":"🟡","levelName":"intermediario","q":"O que faz um \u003cstrong>contrato de dados\u003c/strong> funcionar de verdade?","a":["Ser assinado pelos gerentes das duas áreas","Ser verificado automaticamente: validação no CI do produtor (mudança que quebra o contrato falha o build), validação na ingestão, e Schema Registry com compatibilidade em mensageria — contrato que é só documento não muda nada","Ter mais de dez páginas de especificação","Ser revisado anualmente"],"c":1,"e":"E a parte difícil é organizacional: o time de aplicação precisa assumir responsabilidade por consumidores analíticos. O contrato coloca o sinal onde a decisão é tomada."},{"n":"🟡","levelName":"intermediario","q":"Qual a diferença entre \u003cstrong>pseudonimização e anonimização\u003c/strong>?","a":["São sinônimos na LGPD","Pseudonimizado (tokens reversíveis com tabela de mapeamento) continua sendo dado pessoal sujeito à lei; anônimo (reidentificação impossível por meios razoáveis) sai do escopo — e anonimizar de verdade é muito mais difícil do que parece","Anonimização é reversível; pseudonimização não","Pseudonimização só se aplica a dados de saúde"],"c":1,"e":"Remover nome e CPF não anonimiza: CEP + data de nascimento + sexo reidentificam a maioria das pessoas. Daí k-anonimato, l-diversidade e privacidade diferencial. A confusão gera exposição regulatória real."},{"n":"🔴","levelName":"avancado","q":"Como atender ao \u003cstrong>direito à eliminação\u003c/strong> em backups e logs imutáveis?","a":["É impossível — a lei abre exceção automática para imutáveis","Crypto-shredding: cifrar os dados de cada titular com chave individual e destruir a chave na exclusão — o dado permanece fisicamente mas se torna irrecuperável, sem reescrever nada","Reescrever todos os backups a cada pedido","Migrar os backups para fitas offline"],"c":1,"e":"Complementos: DELETE nos formatos de tabela para a camada analítica e tombstones em tópicos compactados no Kafka. E o desafio maior é propagar a exclusão pelas derivadas — por isso lineage vira requisito de compliance."},{"n":"🟡","levelName":"intermediario","q":"Para que serve o \u003cstrong>lineage\u003c/strong>, concretamente?","a":["Apenas para documentação de arquitetura","Análise de impacto (o que quebra se eu mudar), causa raiz (de onde veio o número errado), compliance (localizar todas as cópias de dados pessoais) e priorização (o que alimenta o relatório do conselho vs experimento morto)","Para acelerar as queries do warehouse","Para substituir o catálogo de dados"],"c":1,"e":"Column-level é bem mais útil (e mais difícil) que table-level. E lineage automático raramente é completo — perde UDFs e código customizado; apresentá-lo como completo é perigoso em compliance."},{"n":"🔴","levelName":"avancado","q":"Como medir se a \u003cstrong>qualidade de dados está melhorando\u003c/strong>?","a":["Pelo número de testes escritos por sprint","Por métricas de resultado: tempo de detecção, fração de incidentes achados pelo monitoramento vs reportados por usuários, incidentes recorrentes e taxa de ruído dos alertas","Pela quantidade de dashboards publicados","Pelo volume de dados processados sem erro de execução"],"c":1,"e":"Número de testes é métrica de atividade. Descobrir pelo usuário é o pior caso; cada incidente deveria virar um teste, levando a recorrência a zero. E times mantendo planilhas paralelas é o indicador indireto de desconfiança."}]},{"id":"12","fullTitle":"12 — Design de Sistemas de Dados","shortTitle":"Design de Sistemas de Dados","subtitle":"O framework de resposta · Estimativas de capacidade · Cenários completos resolvidos · Erros que reprovam · Como conduzir os 45 minutos","toc":[{"id":"sec-1-como-funciona-essa-rodada","title":"1. Como funciona essa rodada"},{"id":"sec-4-erros-que-reprovam-nessa-rodada","title":"4. Erros que reprovam nessa rodada"},{"id":"sec-5-checklist-mental-para-a-rodada","title":"5. Checklist mental para a rodada"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-como-funciona-essa-rodada\">\u003ch2>1. Como funciona essa rodada\u003c/h2>\u003ch3 id=\"h-1-1-o-que-está-sendo-avaliado\">1.1 O que está sendo avaliado\u003c/h3>\n\u003cp>Não é a arquitetura \"certa\" — não existe uma. O que se avalia:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Você faz as perguntas certas antes de projetar?\u003c/strong> A pergunta é deliberadamente vaga. Sair desenhando sem clarificar é o erro número um.\u003c/li>\u003cli>\u003cstrong>Você raciocina sobre escala com números?\u003c/strong> \"Muitos dados\" não é análise. \"500 GB/dia comprimido, 6 TB/mês, 70 TB/ano\" é.\u003c/li>\u003cli>\u003cstrong>Você conhece os trade-offs e os assume explicitamente?\u003c/strong> Toda escolha custa algo. Apresentar uma solução sem custo indica que você não conhece o custo.\u003c/li>\u003cli>\u003cstrong>Você prioriza?\u003c/strong> Em 45 minutos não dá para cobrir tudo. Saber o que é essencial e o que é detalhe é sinal de senioridade.\u003c/li>\u003cli>\u003cstrong>Você pensa em falha e operação?\u003c/strong> Júnior desenha o caminho feliz. Sênior desenha o que acontece quando o pipeline cai às 3h da manhã, e quem é acordado.\u003c/li>\u003cli>\u003cstrong>Você comunica bem?\u003c/strong> Estrutura, vocabulário preciso, e capacidade de mudar de nível de abstração conforme o interlocutor.\u003c/li>\u003c/ol>\n\u003ch3 id=\"h-1-2-o-framework-45-minutos\">1.2 O framework — 45 minutos\u003c/h3>\n\u003cp>\u003cstrong>Fase 1 — Clarificação (5–8 min).\u003c/strong> Nunca pule. Perguntas que valem a pena:\u003c/p>\n\u003cp>\u003cem>Funcionais:\u003c/em> Quem consome e para tomar qual decisão? Quais perguntas o sistema precisa responder? Quais são os casos de uso principais e quais estão fora de escopo?\u003c/p>\n\u003cp>\u003cem>Escala:\u003c/em> Qual o volume atual e a taxa de crescimento? Quantos eventos por segundo no pico? Quantos usuários simultâneos? Qual o tamanho do histórico a reter?\u003c/p>\n\u003cp>\u003cem>Latência:\u003c/em> Qual a defasagem aceitável entre o evento e o dado disponível? (Se a resposta for \"tempo real\", pergunte \u003cem>qual decisão\u003c/em> é tomada nesse prazo — na maioria das vezes o requisito real é de minutos.)\u003c/p>\n\u003cp>\u003cem>Consistência e correção:\u003c/em> O número pode mudar depois de exibido? Duplicata é tolerável? Perder um evento é tolerável?\u003c/p>\n\u003cp>\u003cem>Restrições:\u003c/em> Nuvem específica? Ferramentas já em uso? Tamanho e senioridade do time? Orçamento? Regulação — há PII, há exigência de retenção ou de residência de dados?\u003c/p>\n\u003cp>Feche essa fase declarando as premissas em voz alta: \"Vou assumir X, Y e Z. Se algum desses estiver errado, me interrompa.\" Isso protege você e mostra método.\u003c/p>\n\u003cp>\u003cstrong>Fase 2 — Estimativas (3–5 min).\u003c/strong> Números aproximados, em voz alta. Isso guia todas as decisões seguintes e demonstra raciocínio quantitativo. Não precisa ser exato — precisa ter a ordem de grandeza certa.\u003c/p>\n\u003cp>\u003cstrong>Fase 3 — Arquitetura de alto nível (10 min).\u003c/strong> Desenhe o fluxo em blocos: fontes → ingestão → armazenamento → processamento → serving → consumo. Fale sobre o fluxo antes de escolher tecnologias. Só então nomeie ferramentas, e sempre justificando pelo requisito, não pela popularidade.\u003c/p>\n\u003cp>\u003cstrong>Fase 4 — Aprofundamento (15 min).\u003c/strong> O entrevistador vai escolher uma área. Se ele não escolher, escolha você a mais interessante ou a mais arriscada — e diga por que escolheu. Candidatos que aprofundam sozinhos na parte difícil se destacam.\u003c/p>\n\u003cp>\u003cstrong>Fase 5 — Falhas, operação e evolução (5–8 min).\u003c/strong> O que quebra? Como detecta? Como recupera? Como reprocessa? Quanto custa? Como escala quando o volume multiplicar por 10? Reserve tempo para isso — é onde a senioridade aparece e é o que a maioria não alcança por má gestão de tempo.\u003c/p>\n\u003ch3 id=\"h-1-3-estimativas-como-fazer-rápido\">1.3 Estimativas: como fazer rápido\u003c/h3>\n\u003cp>Números de referência úteis para ter na cabeça:\u003c/p>\n\u003cul>\u003cli>1 dia ≈ 86.400 s ≈ 10⁵ s. Então \u003cstrong>1.000 eventos/s ≈ 100 milhões de eventos/dia\u003c/strong> (arredondando para cima). É a conversão mais útil de todas.\u003c/li>\u003cli>Pico costuma ser 2 a 5× a média. Dimensione pelo pico, não pela média.\u003c/li>\u003cli>Evento JSON típico: 0,5–2 KB. Em Parquet comprimido, o mesmo evento cai para algo como 50–200 bytes — uma redução de 5 a 10×.\u003c/li>\u003cli>1 TB/dia ≈ 365 TB/ano ≈ 0,37 PB/ano.\u003c/li>\u003cli>Uma linha de tabela relacional larga: ~1 KB. Uma linha estreita de fato: ~100 bytes.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Exemplo de raciocínio em voz alta:\u003c/strong>\u003c/p>\n\u003cblockquote>\u003cp>\"10.000 eventos/s no pico, média de 3.000/s. Por dia: 3.000 × 10⁵ ≈ 300 milhões de eventos. A 1 KB por evento em JSON, são 300 GB/dia brutos. Em Parquet comprimido, com fator de 8, ficam ~40 GB/dia, ou ~14 TB/ano. Isso é volume perfeitamente tratável — não preciso de arquitetura exótica. O ponto de atenção não é volume, é a taxa de 10.000/s no pico na ingestão, que define o dimensionamento de partições do Kafka.\"\u003c/p>\u003c/blockquote>\n\u003cp>Repare no que essa conclusão faz: ela \u003cstrong>redireciona o design\u003c/strong> para o gargalo real. É exatamente isso que se espera.\u003c/p>\n\u003ch3 id=\"h-1-4-vocabulário-de-blocos-arquiteturais\">1.4 Vocabulário de blocos arquiteturais\u003c/h3>\n\u003cp>Ter esse mapa mental acelera muito a resposta:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Camada\u003c/th>\u003cth>Função\u003c/th>\u003cth>Opções típicas\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ingestão batch\u003c/td>\u003ctd>Trazer dados em lotes\u003c/td>\u003ctd>Ferramentas de EL gerenciadas, jobs customizados, Kafka Connect\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ingestão CDC\u003c/td>\u003ctd>Capturar mudanças do OLTP\u003c/td>\u003ctd>Debezium, ferramentas nativas de nuvem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ingestão streaming\u003c/td>\u003ctd>Receber eventos contínuos\u003c/td>\u003ctd>Kafka, Kinesis, Pub/Sub\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage bruto\u003c/td>\u003ctd>Guardar tudo como veio\u003c/td>\u003ctd>Object storage + Parquet/Avro\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Formato de tabela\u003c/td>\u003ctd>ACID, time travel, upsert\u003c/td>\u003ctd>Iceberg, Delta, Hudi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Processamento batch\u003c/td>\u003ctd>Transformação pesada\u003c/td>\u003ctd>Spark, warehouse SQL, dbt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Processamento streaming\u003c/td>\u003ctd>Transformação contínua\u003c/td>\u003ctd>Flink, Spark Structured Streaming, Kafka Streams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Serving analítico\u003c/td>\u003ctd>Consulta de BI\u003c/td>\u003ctd>Snowflake, BigQuery, Redshift, Trino\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Serving baixa latência\u003c/td>\u003ctd>Consulta pontual rápida\u003c/td>\u003ctd>ClickHouse, Druid, Pinot, Redis, key-value store\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Orquestração\u003c/td>\u003ctd>Coordenar e agendar\u003c/td>\u003ctd>Airflow, Dagster\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qualidade\u003c/td>\u003ctd>Validar antes de publicar\u003c/td>\u003ctd>Frameworks de teste, checks no pipeline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Catálogo e governança\u003c/td>\u003ctd>Metadados, acesso, lineage\u003c/td>\u003ctd>Catálogo do provedor, Unity, DataHub, OpenMetadata\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Uma distinção que rende muito e que candidatos raramente fazem: \u003cstrong>serving analítico ≠ serving de baixa latência\u003c/strong>. Um warehouse responde consultas complexas em segundos sobre bilhões de linhas, mas não serve 10.000 requisições por segundo de um produto. Para isso, você precisa de um banco de baixa latência alimentado pelo pipeline. Reconhecer isso quando o cenário envolve um produto voltado ao usuário é um diferencial claro.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-4-erros-que-reprovam-nessa-rodada\">\u003ch2>4. Erros que reprovam nessa rodada\u003c/h2>\u003cp>\u003cstrong>Começar a desenhar sem clarificar.\u003c/strong> É o erro mais comum e o mais fatal. A pergunta é vaga de propósito.\u003c/p>\n\u003cp>\u003cstrong>Não fazer estimativas.\u003c/strong> Sem números, o design é opinião. E as estimativas frequentemente revelam que o gargalo não é onde você imaginava.\u003c/p>\n\u003cp>\u003cstrong>Escolher tecnologia antes de definir o problema.\u003c/strong> \"Vou usar Kafka, Spark e Snowflake\" antes de saber o volume e a latência mostra que você aplica um padrão decorado.\u003c/p>\n\u003cp>\u003cstrong>Superdimensionar.\u003c/strong> Propor Kafka, Flink e um lakehouse para 100 mil eventos por dia sinaliza falta de julgamento. Reconhecer que um Postgres e um cron resolveriam, e explicar em que ponto isso deixaria de valer, é uma resposta muito mais forte.\u003c/p>\n\u003cp>\u003cstrong>Apresentar solução sem trade-off.\u003c/strong> Toda escolha custa algo. Se você não menciona o custo, o entrevistador conclui que você não o conhece.\u003c/p>\n\u003cp>\u003cstrong>Só desenhar o caminho feliz.\u003c/strong> Sem falar de falha, retry, reprocessamento, monitoramento e custo, o design é de júnior.\u003c/p>\n\u003cp>\u003cstrong>Não gerenciar o tempo.\u003c/strong> Gastar 30 minutos na ingestão e não chegar em serving nem em operação. Declare a estrutura no começo e vá vigiando.\u003c/p>\n\u003cp>\u003cstrong>Não perguntar sobre PII e regulação.\u003c/strong> Em muitos domínios isso restringe a arquitetura de forma decisiva, e lembrar disso espontaneamente pesa.\u003c/p>\n\u003cp>\u003cstrong>Ignorar o time e o contexto.\u003c/strong> A melhor arquitetura para um time de 3 pessoas é diferente da melhor para 30. Perguntar sobre o time mostra maturidade.\u003c/p>\n\u003cp>\u003cstrong>Não assumir uma posição.\u003c/strong> Listar cinco opções sem escolher é evasivo. Escolha, justifique pelo requisito, e diga sob que condição você mudaria de ideia.\u003c/p>\n\u003cp>\u003cstrong>Defender a escolha até a morte.\u003c/strong> Se o entrevistador aponta um problema real, incorpore. Ele frequentemente está testando se você raciocina ou se apenas defende.\u003c/p>\n\u003cp>\u003cstrong>Confundir serving analítico com serving de baixa latência.\u003c/strong> Propor que um produto consulte o warehouse a cada requisição de usuário é um erro conceitual visível.\u003c/p>\n\u003cp>\u003cstrong>Esquecer o custo.\u003c/strong> Em 2026, custo é requisito de primeira classe. Um design que ignora quanto vai custar é incompleto.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-5-checklist-mental-para-a-rodada\">\u003ch2>5. Checklist mental para a rodada\u003c/h2>\u003cp>Antes de terminar, confira se você tocou em:\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Requisitos funcionais e casos de uso, com escopo do que ficou de fora\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Volume, taxa de pico, crescimento e retenção — com números\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Latência exigida, justificada por uma decisão de negócio\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Fontes e método de ingestão (batch, CDC, streaming) com justificativa\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Camadas de armazenamento e formato\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Modelo de dados e \u003cstrong>grão\u003c/strong> das tabelas centrais\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Processamento e onde ele roda\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Serving, separando analítico de baixa latência se aplicável\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Idempotência e estratégia de reprocessamento/backfill\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Qualidade: quais testes, onde rodam, o que bloqueia\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Falhas: o que quebra, como se detecta, como se recupera\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Monitoramento e SLA — incluindo atraso, não só falha\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> PII, acesso e conformidade\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Custo, em ordem de grandeza\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Como isso evolui se o volume crescer 10×\u003c/li>\u003cli>\u003cspan class=\"cb\">☐\u003c/span> Trade-offs assumidos explicitamente, e o que você faria diferente com mais tempo ou mais time\u003c/li>\u003c/ul>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟡 Cenário 1 — Pipeline analítico de e-commerce","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Enunciado típico:\u003c/strong> \u003cem>\"Desenhe a plataforma de dados de um e-commerce. Eles querem dashboards de vendas, análise de comportamento e alimentar um modelo de recomendação.\"\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Clarificação.\u003c/strong> Volume de pedidos por dia? Quantos eventos de navegação? Latência aceitável para os dashboards — diária basta ou precisa ser intradiária? A recomendação é em tempo real na sessão ou pré-calculada em batch? Quais fontes existem — banco transacional, eventos de front-end, ERP, plataforma de marketing? Há PII envolvida?\u003c/p>\n\u003cp>\u003cem>Premissas que eu assumiria:\u003c/em> 100 mil pedidos/dia, 50 milhões de eventos de navegação/dia, dashboards com atualização horária suficiente, recomendação pré-calculada diariamente com features servidas em baixa latência, e presença de PII (cliente).\u003c/p>\n\u003cp>\u003cstrong>Estimativa.\u003c/strong> 50 milhões de eventos × 1 KB ≈ 50 GB/dia brutos; ~7 GB/dia em Parquet; ~2,5 TB/ano. Pedidos são desprezíveis em volume. Conclusão: volume modesto, o desafio é arquitetura e qualidade, não escala.\u003c/p>\n\u003cp>\u003cstrong>Arquitetura.\u003c/strong>\u003c/p>\n\u003cp>\u003cem>Ingestão.\u003c/em> Dois caminhos distintos, e explicar por que são distintos é parte da resposta.\u003c/p>\n\u003cp>Do banco transacional (pedidos, clientes, produtos): \u003cstrong>CDC\u003c/strong>, porque preciso capturar updates e deletes — um pedido muda de status várias vezes, e polling por \u003ccode>updated_at\u003c/code> perderia estados intermediários e não capturaria deleções. Chave da mensagem = chave primária, para preservar ordem por entidade.\u003c/p>\n\u003cp>Dos eventos de front-end: coleta via SDK para um tópico de eventos. Volume alto, mas cada evento é imutável e independente, então append puro basta.\u003c/p>\n\u003cp>\u003cem>Armazenamento em camadas.\u003c/em> Bronze com o dado bruto append-only, particionado por data de ingestão — é o meu ponto de reprocessamento se a lógica mudar. Silver limpo, deduplicado, tipado, com sessões reconstruídas a partir dos eventos e o espelho das entidades derivado do CDC. Gold modelado dimensionalmente.\u003c/p>\n\u003cp>\u003cem>Modelagem na Gold.\u003c/em> Star schema. Fato de itens de pedido no grão de item — escolho o grão atômico porque sempre posso agregar para cima e nunca desagregar. Fato de eventos de navegação no grão de evento. Dimensões de cliente, produto, data e canal, com \u003cstrong>SCD Tipo 2 em cliente e produto\u003c/strong>, porque preciso que uma venda antiga seja atribuída à categoria e ao segmento vigentes na época, não aos atuais.\u003c/p>\n\u003cp>\u003cem>Processamento.\u003c/em> Batch horário para a camada analítica. SQL no warehouse ou Spark, dependendo do que o time já opera — e eu perguntaria isso, porque introduzir uma tecnologia nova custa mais do que a diferença de performance na maioria dos casos desse porte.\u003c/p>\n\u003cp>\u003cem>Serving.\u003c/em> Warehouse para BI. Para as features de recomendação, uma camada de baixa latência — key-value store ou feature store — alimentada pelo batch, porque o produto não pode consultar o warehouse a cada requisição de usuário.\u003c/p>\n\u003cp>\u003cem>Governança.\u003c/em> PII isolada na dimensão de cliente com mascaramento por papel; identificador substituto nas fatos.\u003c/p>\n\u003cp>\u003cstrong>Aprofundamento provável — \"como você reconstrói sessões?\"\u003c/strong> Agrupo eventos por usuário ordenados por event time e quebro sessão quando o gap entre eventos excede 30 minutos, que é a convenção usual — e confirmaria com o negócio, porque esse número é uma decisão deles. Em batch, isso é uma window function com \u003ccode>LAG\u003c/code> para calcular o gap e uma soma cumulativa para gerar o ID de sessão. Os pontos difíceis: sessões que cruzam a fronteira do dia, que exigem olhar uma janela com sobreposição em vez de processar cada dia isoladamente; usuários anônimos que depois logam, exigindo reconciliação de identidade; e eventos atrasados de dispositivos móveis offline, que podem chegar horas depois e reabrir uma sessão já fechada — o que eu trataria com uma janela de lookback no reprocessamento diário.\u003c/p>\n\u003cp>\u003cstrong>Falhas e operação.\u003c/strong> Monitorar lag do CDC e saúde do slot de replicação — slot abandonado enche o disco da produção, que é um incidente no banco, não no pipeline. Testes de qualidade com write-audit-publish: unicidade de pedido, integridade referencial contra as dimensões, volume comparado ao mesmo dia da semana anterior (sazonalidade semanal em e-commerce é fortíssima, comparar com ontem gera falso positivo todo domingo), e reconciliação da receita total contra o sistema transacional. Idempotência por partição de data para permitir reprocessamento. Alerta por SLA de freshness, não só por falha.\u003c/p>"},{"titleHtml":"🔴 Cenário 2 — Detecção de fraude em tempo real","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Enunciado típico:\u003c/strong> \u003cem>\"Desenhe um sistema que detecta transações fraudulentas em tempo real.\"\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>Clarificação.\u003c/strong> Qual o volume de transações por segundo, no pico? Qual a latência máxima aceitável para a decisão — a transação espera pela resposta? A decisão é bloquear automaticamente ou sinalizar para revisão humana? Qual o custo relativo de falso positivo versus falso negativo? O modelo já existe ou faz parte do escopo? Que features ele precisa?\u003c/p>\n\u003cp>\u003cem>Premissas:\u003c/em> 5.000 transações/s no pico, latência máxima de 200 ms com a transação bloqueada esperando, decisão automática de bloqueio acima de um limiar e revisão humana na faixa intermediária, modelo já treinado.\u003c/p>\n\u003cp>\u003cstrong>A observação que muda o design, e que deve vir cedo:\u003c/strong> se a transação espera pela resposta, isto \u003cstrong>não é um pipeline de dados\u003c/strong> — é um serviço síncrono de baixa latência com um pipeline de dados por trás. Confundir os dois é o erro central desse cenário. O caminho de decisão precisa ser um serviço; o pipeline alimenta as features e treina o modelo.\u003c/p>\n\u003cp>\u003cstrong>Arquitetura.\u003c/strong>\u003c/p>\n\u003cp>\u003cem>Caminho síncrono (decisão).\u003c/em> A transação chega ao serviço de scoring. Ele consulta um \u003cstrong>feature store online\u003c/strong> — um key-value store com latência de poucos milissegundos — para obter as features pré-calculadas do cliente, do dispositivo e do comerciante. Calcula as features que só existem no momento (valor da transação, hora, geolocalização, distância em relação à transação anterior), roda o modelo e devolve a decisão. Orçamento de latência: leitura de features ~10 ms, inferência ~20 ms, sobra folga confortável dentro dos 200 ms.\u003c/p>\n\u003cp>\u003cem>Caminho assíncrono (atualização de features).\u003c/em> Toda transação é publicada num tópico. Um job de streaming consome e atualiza as features agregadas em janela — \"número de transações deste cartão nos últimos 5 minutos\", \"valor médio na última hora\", \"número de países distintos hoje\" — e escreve no feature store online. Aqui, sim, é streaming de verdade, com estado por chave e watermark.\u003c/p>\n\u003cp>\u003cem>Caminho batch (treino e features lentas).\u003c/em> Os mesmos eventos vão para o data lake. Dali saem o treino do modelo, as features de janela longa (comportamento de 90 dias), e a análise de performance do modelo.\u003c/p>\n\u003cp>\u003cem>Feedback.\u003c/em> Confirmações de fraude e contestações voltam como rótulos, alimentando o retreino. Sem esse laço, o sistema degrada silenciosamente conforme os padrões de fraude mudam — e isso deve ser dito, porque é o que separa quem já colocou modelo em produção.\u003c/p>\n\u003cp>\u003cstrong>Pontos que o entrevistador vai cutucar:\u003c/strong>\u003c/p>\n\u003cp>\u003cem>\"E se o feature store estiver indisponível?\"\u003c/em> Preciso de um comportamento de degradação definido: usar um modelo mais simples com apenas as features da própria transação, ou aplicar uma política padrão. E essa política é uma decisão de negócio — em caso de indisponibilidade, aprova tudo (risco de fraude) ou bloqueia tudo (risco de perder receita legítima e irritar clientes)? Eu perguntaria em vez de assumir, e a resposta
