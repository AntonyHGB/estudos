0 datas gera até 6.000 arquivos pequenos. Como evitar?","a":["Reduzir o número de datas processadas por job","Fazer repartition pela coluna de data antes de gravar, concentrando cada data em poucas tasks — e, se uma data for muito maior, repartition(n, data) para balancear","Usar coalesce(6000) antes da escrita","Desligar o particionamento físico"],"c":1,"e":"Cada task escreve um arquivo por data presente nela — o produto cartesiano é o mecanismo clássico de small files. Cuidado adicional: overwrite com particionamento estático pode apagar a tabela inteira; prefira overwrite dinâmico ou as operações do formato de tabela."}]},{"id":"09","fullTitle":"09 — Apache Kafka","shortTitle":"Apache Kafka","subtitle":"Arquitetura e log · Partições e ordenação · Consumer groups e offsets · Replicação e ISR · Retenção e compaction · Garantias de entrega · Schema Registry · KRaft","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-o-que-kafka-é-e-o-que-não-é\">1.1 O que Kafka é (e o que não é)\u003c/h3>\n\u003cp>Kafka é um \u003cstrong>log distribuído, particionado, replicado e append-only\u003c/strong>. Essa definição responde a maior parte das perguntas conceituais.\u003c/p>\n\u003cp>A diferença fundamental para uma fila tradicional (RabbitMQ, SQS): numa fila, a mensagem é \u003cstrong>removida\u003c/strong> quando consumida. No Kafka, a mensagem \u003cstrong>permanece\u003c/strong> no log pelo período de retenção, e cada consumidor mantém sua própria posição de leitura (offset). Consequências:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Múltiplos consumidores independentes\u003c/strong> podem ler os mesmos dados sem interferir uns nos outros. Adicionar um novo consumidor não afeta os existentes e não exige mudar o produtor.\u003c/li>\u003cli>\u003cstrong>Reprocessamento\u003c/strong> é possível: basta voltar o offset. Isso é o que viabiliza a arquitetura Kappa e recuperação de bugs em consumidores.\u003c/li>\u003cli>\u003cstrong>Ordenação é preservada\u003c/strong> dentro de uma partição, porque o log é sequencial.\u003c/li>\u003cli>O broker é \u003cstrong>burro por design\u003c/strong>: ele não rastreia entrega por mensagem, não faz roteamento complexo, não gerencia estado de consumidor. Essa simplicidade é o que permite o throughput altíssimo.\u003c/li>\u003c/ul>\n\u003cp>Kafka atinge throughput alto por três mecanismos que vale saber nomear: \u003cstrong>escrita sequencial em disco\u003c/strong> (muito mais rápida que aleatória, e aproveitando o page cache do SO), \u003cstrong>zero-copy\u003c/strong> (dados vão do page cache direto para o socket sem passar pelo espaço de usuário) e \u003cstrong>batching e compressão\u003c/strong> de mensagens tanto no produtor quanto no armazenamento.\u003c/p>\n\u003ch3 id=\"h-1-2-tópicos-partições-e-ordenação\">1.2 Tópicos, partições e ordenação\u003c/h3>\n\u003cp>Um \u003cstrong>tópico\u003c/strong> é uma categoria lógica de mensagens. Ele é dividido em \u003cstrong>partições\u003c/strong>, e é a partição que é a unidade real de tudo:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Unidade de paralelismo.\u003c/strong> Cada partição é consumida por no máximo um consumidor dentro de um consumer group. Portanto \u003cstrong>o paralelismo máximo de um consumer group é o número de partições.\u003c/strong> Adicionar consumidores além disso deixa os extras ociosos. É uma das perguntas mais frequentes.\u003c/li>\u003cli>\u003cstrong>Unidade de ordenação.\u003c/strong> Kafka garante ordem \u003cstrong>dentro\u003c/strong> de uma partição, nunca entre partições. Se a ordem entre dois eventos importa, eles precisam ir para a mesma partição.\u003c/li>\u003cli>\u003cstrong>Unidade de replicação e de armazenamento.\u003c/strong>\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Como a partição é escolhida:\u003c/strong> se a mensagem tem \u003cstrong>chave\u003c/strong>, a partição é \u003ccode>hash(chave) % num_partições\u003c/code> — o que garante que todas as mensagens da mesma chave vão para a mesma partição, e portanto mantêm ordem relativa. Se não tem chave, o produtor distribui (com batching, o comportamento moderno agrupa mensagens sem chave em lotes por partição para eficiência, em vez de round-robin estrito por mensagem).\u003c/p>\n\u003cp>\u003cstrong>A decisão de chave é a decisão de design mais importante ao usar Kafka\u003c/strong>, e cai muito:\u003c/p>\n\u003cul>\u003cli>Chave = \u003ccode>user_id\u003c/code> garante ordem por usuário. Bom para CDC e para eventos de sessão.\u003c/li>\u003cli>Chave com distribuição desigual causa \u003cstrong>partition skew\u003c/strong>: uma partição recebe muito mais tráfego, seu consumidor vira gargalo, e escalar não resolve.\u003c/li>\u003cli>Sem chave, você ganha distribuição uniforme e perde ordem.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Aumentar o número de partições quebra a garantia de ordenação por chave\u003c/strong>, porque \u003ccode>hash(chave) % N\u003c/code> muda quando N muda: mensagens da mesma chave passam a ir para outra partição, e podem ser consumidas fora de ordem em relação às antigas. E \u003cstrong>não é possível reduzir\u003c/strong> o número de partições. Por isso o dimensionamento inicial de partições merece cuidado — e a heurística é dimensionar pelo throughput alvo dividido pelo throughput que um consumidor consegue processar, com folga para crescimento.\u003c/p>\n\u003cp>Partições demais também têm custo: mais file handles e metadados no broker, mais requisições de replicação, maior tempo de recuperação em falha de broker, e mais latência de fim a fim em alguns casos. É um trade-off, não \"quanto mais melhor\".\u003c/p>\n\u003ch3 id=\"h-1-3-consumer-groups-offsets-e-rebalance\">1.3 Consumer groups, offsets e rebalance\u003c/h3>\n\u003cp>Um \u003cstrong>consumer group\u003c/strong> é um conjunto de consumidores que dividem o trabalho de ler um tópico. Regras:\u003c/p>\n\u003cul>\u003cli>Cada partição é atribuída a \u003cstrong>exatamente um\u003c/strong> consumidor do grupo.\u003c/li>\u003cli>Um consumidor pode ler várias partições.\u003c/li>\u003cli>Grupos diferentes recebem \u003cstrong>todas\u003c/strong> as mensagens independentemente — é assim que se implementa fan-out.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Offset\u003c/strong> é a posição de leitura. Cada grupo mantém seu próprio offset committado por partição, armazenado num tópico interno do Kafka (\u003ccode>__consumer_offsets\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Quando commitar o offset determina a semântica de entrega\u003c/strong> — é o ponto mais importante:\u003c/p>\n\u003cul>\u003cli>Commitar \u003cstrong>antes\u003c/strong> de processar → at-most-once (se falhar depois do commit, a mensagem se perde).\u003c/li>\u003cli>Commitar \u003cstrong>depois\u003c/strong> de processar → at-least-once (se falhar antes do commit, a mensagem é reprocessada).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Auto-commit\u003c/strong> (\u003ccode>enable.auto.commit=true\u003c/code>) commita periodicamente em background, sem relação com o progresso real do processamento. Isso significa que ele pode commitar mensagens que ainda não foram processadas — produzindo perda — ou reprocessar mensagens já processadas. Para controle real da semântica, desligue o auto-commit e commite manualmente após o processamento. Saber disso é um marcador de experiência prática.\u003c/p>\n\u003cp>\u003cstrong>Rebalance\u003c/strong> é a redistribuição de partições entre consumidores do grupo, disparada quando: um consumidor entra, sai, morre, ou não envia heartbeat a tempo; ou quando o número de partições muda.\u003c/p>\n\u003cp>O rebalance clássico (eager) \u003cstrong>para o grupo inteiro\u003c/strong>: todos param, devolvem suas partições, e recebem uma nova atribuição — o famoso \"stop-the-world\". Em grupos grandes, isso causa pausas perceptíveis. Estratégias \u003cstrong>cooperativas\u003c/strong> (incremental cooperative rebalancing) redistribuem apenas as partições que precisam mudar, sem parar todo mundo, e são a recomendação moderna. \u003cstrong>Static membership\u003c/strong> permite que um consumidor que reinicia rapidamente reassuma suas partições sem disparar rebalance, o que é valioso em ambientes com deploy frequente ou Kubernetes.\u003c/p>\n\u003cp>\u003cstrong>Causa comum de rebalance indesejado, e ótima resposta de troubleshooting:\u003c/strong> processamento lento. Se o consumidor demora mais que \u003ccode>max.poll.interval.ms\u003c/code> entre chamadas de poll, o coordenador o considera morto e dispara rebalance — e aí a mensagem é reprocessada por outro consumidor, que também demora, e o grupo entra num ciclo de rebalances sem progredir. A correção é reduzir \u003ccode>max.poll.records\u003c/code>, aumentar o intervalo permitido, ou mover o processamento pesado para fora do loop de poll.\u003c/p>\n\u003ch3 id=\"h-1-4-replicação-isr-e-durabilidade\">1.4 Replicação, ISR e durabilidade\u003c/h3>\n\u003cp>Cada partição tem um \u003cstrong>líder\u003c/strong> e N-1 \u003cstrong>followers\u003c/strong> (o fator de replicação). Todas as leituras e escritas vão para o líder; os followers replicam.\u003c/p>\n\u003cp>\u003cstrong>ISR (In-Sync Replicas)\u003c/strong> é o conjunto de réplicas que estão suficientemente atualizadas em relação ao líder. Uma réplica que fica para trás além de um limite é removida do ISR e não é elegível para virar líder (em configuração segura).\u003c/p>\n\u003cp>\u003cstrong>As três configurações que determinam durabilidade\u003c/strong> — e a pergunta \"como você garante que não perde mensagem?\" espera exatamente essas três:\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>acks\u003c/code> no produtor:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ccode>acks=0\u003c/code>: não espera confirmação. Máximo throughput, pode perder tudo.\u003c/li>\u003cli>\u003ccode>acks=1\u003c/code>: espera só o líder. Se o líder morrer antes de replicar, perde.\u003c/li>\u003cli>\u003ccode>acks=all\u003c/code> (ou \u003ccode>-1\u003c/code>): espera todas as réplicas do ISR confirmarem. É o necessário para durabilidade.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>\u003ccode>min.insync.replicas\u003c/code> no tópico/broker:\u003c/strong> o número mínimo de réplicas que precisam estar no ISR para que uma escrita com \u003ccode>acks=all\u003c/code> seja aceita. Se cair abaixo, o produtor recebe erro em vez de escrever com durabilidade insuficiente.\u003c/p>\n\u003cp>\u003cstrong>A combinação correta:\u003c/strong> \u003ccode>replication.factor=3\u003c/code> + \u003ccode>min.insync.replicas=2\u003c/code> + \u003ccode>acks=all\u003c/code>. Isso significa: pelo menos duas cópias antes de confirmar, e você tolera a perda de um broker continuando a aceitar escritas. Se usar \u003ccode>min.insync.replicas=3\u003c/code> com fator 3, a perda de qualquer broker \u003cstrong>para as escritas\u003c/strong> — o que troca disponibilidade por durabilidade e raramente é o desejado.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>unclean.leader.election.enable\u003c/code>\u003c/strong>: se \u003ccode>true\u003c/code>, permite que uma réplica fora do ISR vire líder quando não há nenhuma no ISR. Isso mantém a disponibilidade ao custo de \u003cstrong>perder mensagens\u003c/strong> que existiam apenas nas réplicas mais atualizadas. É a escolha CAP explícita do Kafka: \u003ccode>false\u003c/code> (padrão moderno) é CP, \u003ccode>true\u003c/code> é AP. Excelente resposta para conectar Kafka ao teorema CAP.\u003c/p>\n\u003ch3 id=\"h-1-5-retenção-e-log-compaction\">1.5 Retenção e log compaction\u003c/h3>\n\u003cp>\u003cstrong>Retenção por tempo ou tamanho:\u003c/strong> mensagens são apagadas após N dias ou quando a partição excede um tamanho. É o modo padrão (\u003ccode>cleanup.policy=delete\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Log compaction\u003c/strong> (\u003ccode>cleanup.policy=compact\u003c/code>): em vez de apagar por idade, o Kafka mantém \u003cstrong>pelo menos o último valor de cada chave\u003c/strong>, para sempre. Mensagens antigas com a mesma chave são removidas na compactação.\u003c/p>\n\u003cp>Compaction transforma o tópico numa \u003cstrong>tabela de estado atual\u003c/strong>: relendo-o do início, você reconstrói o estado corrente de todas as chaves. É o mecanismo por trás de KTables no Kafka Streams, de tópicos de configuração, e do padrão de \"changelog\" de CDC.\u003c/p>\n\u003cp>Detalhes que caem:\u003c/p>\n\u003cul>\u003cli>Uma mensagem com valor \u003ccode>null\u003c/code> para uma chave é um \u003cstrong>tombstone\u003c/strong>: sinaliza deleção, e é mantida por um período configurável antes de ser removida, para que consumidores lentos consigam vê-la.\u003c/li>\u003cli>Compaction não garante remoção \u003cstrong>imediata\u003c/strong> de duplicatas — ela roda em background e o head do log (a parte mais recente) pode ter várias versões da mesma chave.\u003c/li>\u003cli>É possível combinar \u003ccode>delete\u003c/code> e \u003ccode>compact\u003c/code>.\u003c/li>\u003cli>Para \u003cstrong>LGPD/GDPR\u003c/strong>, compaction com tombstone é o mecanismo padrão de \"direito ao esquecimento\" em Kafka, já que o log é imutável e você não pode apagar uma mensagem no meio dele.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-6-garantias-de-entrega-e-transações\">1.6 Garantias de entrega e transações\u003c/h3>\n\u003cp>\u003cstrong>Produtor idempotente\u003c/strong> (\u003ccode>enable.idempotence=true\u003c/code>, padrão nas versões modernas): o produtor recebe um Producer ID e mantém um número de sequência por partição. O broker rastreia o maior número de sequência gravado por PID e partição, e descarta duplicatas de retry, ainda respondendo com ack. Isso elimina duplicação causada por reenvio — que é a fonte mais comum de duplicata.\u003c/p>\n\u003cp>Limite importante: idempotência do produtor cobre \u003cstrong>uma sessão do produtor e uma partição por vez\u003c/strong>. Não cobre reinício do produtor nem escrita atômica em múltiplas partições.\u003c/p>\n\u003cp>\u003cstrong>Transações\u003c/strong> resolvem isso: permitem que um conjunto de escritas em múltiplas partições e tópicos, mais o commit dos offsets consumidos, sejam atômicos. É o padrão \u003cstrong>read-process-write\u003c/strong>: consumir de um tópico, processar, produzir em outro, e commitar o offset — tudo ou nada. Consumidores configurados com \u003ccode>isolation.level=read_committed\u003c/code> só enxergam mensagens de transações commitadas.\u003c/p>\n\u003cp>\u003cstrong>Exactly-once semantics (EOS)\u003c/strong> no Kafka é essa combinação. Mas o escopo importa e é onde candidatos erram: EOS é de ponta a ponta quando a origem \u003cstrong>e\u003c/strong> o destino são Kafka. Se o destino é um sistema externo que não participa da transação, a garantia termina na fronteira — e você precisa de idempotência no destino para obter o efeito equivalente.\u003c/p>\n\u003cp>Custos de EOS: transações adicionam coordenação (um coordenador de transação, marcadores no log) e latência; consumidores em \u003ccode>read_committed\u003c/code> só leem até o ponto onde não há transação aberta pendente, o que pode adicionar atraso; e uma transação travada bloqueia o avanço dos leitores até expirar.\u003c/p>\n\u003ch3 id=\"h-1-7-schema-registry-e-evolução\">1.7 Schema Registry e evolução\u003c/h3>\n\u003cp>Kafka transporta bytes; ele não sabe nem se importa com o formato. Isso é ótimo para desempenho e péssimo para governança — nada impede um produtor de mudar o formato e quebrar todos os consumidores silenciosamente.\u003c/p>\n\u003cp>\u003cstrong>Schema Registry\u003c/strong> resolve: schemas (tipicamente Avro, Protobuf ou JSON Schema) são registrados e versionados; o produtor grava um identificador de schema no início da mensagem; o consumidor busca o schema pelo ID para desserializar. E o registry \u003cstrong>valida compatibilidade\u003c/strong> antes de aceitar uma nova versão.\u003c/p>\n\u003cp>Modos de compatibilidade:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Backward\u003c/strong>: consumidores com o schema novo leem dados escritos com o antigo. Permite adicionar campo opcional com default e remover campos. É o modo mais usado, porque permite atualizar consumidores primeiro.\u003c/li>\u003cli>\u003cstrong>Forward\u003c/strong>: consumidores com o schema antigo leem dados escritos com o novo. Permite atualizar produtores primeiro.\u003c/li>\u003cli>\u003cstrong>Full\u003c/strong>: ambos.\u003c/li>\u003cli>\u003cstrong>None\u003c/strong>: sem validação — evite.\u003c/li>\u003c/ul>\n\u003cp>A ordem de deploy depende do modo, e essa é uma pergunta prática boa: com backward compatibility, atualize os \u003cstrong>consumidores\u003c/strong> primeiro; com forward, os \u003cstrong>produtores\u003c/strong> primeiro.\u003c/p>\n\u003cp>Isso é a implementação técnica de um \u003cstrong>contrato de dados\u003c/strong> (ver arquivo 11) na camada de mensageria.\u003c/p>\n\u003ch3 id=\"h-1-8-kafka-connect-streams-e-o-ecossistema\">1.8 Kafka Connect, Streams e o ecossistema\u003c/h3>\n\u003cp>\u003cstrong>Kafka Connect\u003c/strong>: framework para integração sem escrever código — source connectors trazem dados de sistemas externos para o Kafka, sink connectors levam do Kafka para fora. Roda distribuído, com gestão de offsets e retries. É onde o Debezium (CDC) vive.\u003c/p>\n\u003cp>\u003cstrong>Kafka Streams\u003c/strong>: biblioteca (não cluster separado) para processamento de streams em Java, com estado local respaldado por tópicos de changelog. Conceitos: \u003cstrong>KStream\u003c/strong> (fluxo de eventos) e \u003cstrong>KTable\u003c/strong> (estado atual por chave, respaldado por tópico compactado). A dualidade stream-table é a ideia central: um stream de mudanças pode ser materializado como tabela, e uma tabela pode ser lida como stream de mudanças.\u003c/p>\n\u003cp>\u003cstrong>ksqlDB\u003c/strong>: SQL sobre streams, construído sobre Kafka Streams.\u003c/p>\n\u003cp>\u003cstrong>KRaft\u003c/strong>: o modo de consenso interno do Kafka baseado em Raft, que substituiu o ZooKeeper para gerenciamento de metadados. É o padrão e o recomendado a partir do Kafka 4.0, onde o ZooKeeper foi removido. Vantagens: menos um sistema para operar, failover de controlador mais rápido, e melhor escalabilidade em número de partições. Saber que ZooKeeper saiu de cena é um marcador simples de estar atualizado.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Achar que adicionar consumidores sempre aumenta o throughput.\u003c/strong> O teto é o número de partições. Consumidores extras no mesmo grupo ficam ociosos.\u003c/p>\n\u003cp>\u003cstrong>Dizer que Kafka garante ordenação global.\u003c/strong> Garante apenas dentro da partição. E mesmo isso se perde se o consumidor processar em paralelo internamente.\u003c/p>\n\u003cp>\u003cstrong>Esquecer que aumentar partições quebra a ordenação por chave.\u003c/strong> O hash muda, a chave passa a mapear para outra partição.\u003c/p>\n\u003cp>\u003cstrong>Deixar auto-commit ligado achando que tem at-least-once.\u003c/strong> Auto-commit commita por tempo, sem relação com o progresso do processamento — pode confirmar mensagens não processadas, gerando perda.\u003c/p>\n\u003cp>\u003cstrong>Configurar \u003ccode>acks=all\u003c/code> sem \u003ccode>min.insync.replicas\u003c/code>.\u003c/strong> Se o ISR encolher para uma réplica, \u003ccode>acks=all\u003c/code> significa \"espere essa única réplica\", e a durabilidade prometida não existe.\u003c/p>\n\u003cp>\u003cstrong>Usar \u003ccode>min.insync.replicas\u003c/code> igual ao fator de replicação.\u003c/strong> A perda de qualquer broker para as escritas.\u003c/p>\n\u003cp>\u003cstrong>Tratar Kafka como banco de dados.\u003c/strong> Ele é um log; consulta por chave arbitrária, query analítica e atualização pontual não são o modelo. Materialize num banco ou numa tabela para isso.\u003c/p>\n\u003cp>\u003cstrong>Ignorar o risco do slot de replicação em CDC.\u003c/strong> Slot abandonado retém WAL e pode encher o disco do banco de produção. É um incidente de produção, não do pipeline.\u003c/p>\n\u003cp>\u003cstrong>Não ter DLQ, ou ter uma que ninguém monitora.\u003c/strong> Sem DLQ, uma mensagem venenosa bloqueia a partição. Com DLQ sem dono, o dado é descartado com aparência de tratado.\u003c/p>\n\u003cp>\u003cstrong>Alertar sobre lag em número de mensagens.\u003c/strong> Dez mil mensagens pode ser um segundo ou um dia, dependendo da taxa. Alerte em tempo.\u003c/p>\n\u003cp>\u003cstrong>Escalar consumidores quando o gargalo é o sink.\u003c/strong> Piora, porque aumenta a pressão sobre o recurso já saturado.\u003c/p>\n\u003cp>\u003cstrong>Prometer exactly-once sem verificar o destino.\u003c/strong> A garantia termina onde a transação do Kafka termina. Se o sink é externo e não idempotente, não existe exactly-once.\u003c/p>\n\u003cp>\u003cstrong>Mencionar ZooKeeper como componente atual.\u003c/strong> Foi removido a partir do Kafka 4.0, substituído pelo KRaft. É um marcador simples e visível de estar desatualizado.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. O que é Kafka e como difere de uma fila tradicional?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um log distribuído, particionado, replicado e append-only. A diferença central para uma fila é que a mensagem não é removida quando consumida: ela permanece pelo período de retenção, e cada consumidor mantém sua própria posição de leitura.\u003c/p>\n\u003cp>Isso permite múltiplos consumidores independentes lendo os mesmos dados sem interferência, e permite reprocessar simplesmente voltando o offset. O broker é deliberadamente simples — não rastreia entrega por mensagem — e é essa simplicidade que sustenta o throughput alto.\u003c/p>"},{"titleHtml":"🟢 P2. O que é uma partição e por que ela existe?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É a subdivisão de um tópico, e é a unidade de tudo que importa: de paralelismo, porque cada partição é consumida por no máximo um consumidor dentro de um grupo; de ordenação, porque Kafka garante ordem dentro da partição e nunca entre partições; e de replicação e armazenamento.\u003c/p>\n\u003cp>A consequência prática mais citada é que o paralelismo máximo de um consumer group é o número de partições — adicionar consumidores além disso deixa os extras ociosos.\u003c/p>"},{"titleHtml":"🟢 P3. O que é um consumer group?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um conjunto de consumidores que dividem o trabalho de ler um tópico. Cada partição é atribuída a exatamente um consumidor do grupo, e um consumidor pode ler várias partições. Grupos diferentes recebem todas as mensagens de forma independente — é assim que se faz fan-out para vários sistemas consumindo o mesmo tópico.\u003c/p>\n\u003cp>Cada grupo mantém seu próprio offset committado por partição, armazenado num tópico interno do Kafka.\u003c/p>"},{"titleHtml":"🟢 P4. O que é offset?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É a posição sequencial de uma mensagem dentro de uma partição, e também o marcador de até onde um consumer group já leu. O consumidor commita o offset para registrar progresso, e ao reiniciar retoma dali.\u003c/p>\n\u003cp>O momento do commit determina a semântica de entrega: commitar antes de processar dá at-most-once; depois, at-least-once.\u003c/p>"},{"titleHtml":"🟡 P5. Como o Kafka garante ordenação? Quais os limites?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Ele garante ordem \u003cstrong>dentro de uma partição\u003c/strong>, porque o log é sequencial e append-only. Não há garantia de ordem entre partições.\u003c/p>\n\u003cp>Então, se a ordem entre dois eventos importa, eles precisam ir para a mesma partição — o que se consegue usando a mesma \u003cstrong>chave\u003c/strong>, já que a partição é escolhida por hash da chave. Para CDC de um banco, por exemplo, usar a chave primária como chave da mensagem garante que todas as mudanças de uma linha sejam ordenadas entre si.\u003c/p>\n\u003cp>Duas limitações importantes. Primeira: se você \u003cstrong>aumentar o número de partições\u003c/strong>, o hash passa a mapear a mesma chave para outra partição, e a garantia de ordem se quebra na transição. Segunda: dentro do consumidor, se você processar as mensagens em paralelo por thread, perde a ordem que o Kafka entregou — a garantia é da entrega, não do seu processamento.\u003c/p>"},{"titleHtml":"🟡 P6. Como você garante que uma mensagem não se perca?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Combinando três configurações. \u003ccode>acks=all\u003c/code> no produtor, para que ele espere a confirmação de todas as réplicas em sincronia, não só do líder. \u003ccode>replication.factor=3\u003c/code> no tópico. E \u003ccode>min.insync.replicas=2\u003c/code>, que exige pelo menos duas réplicas em sincronia para aceitar a escrita — assim você tolera a perda de um broker sem parar de escrever e sem escrever com durabilidade insuficiente.\u003c/p>\n\u003cp>Além disso, \u003ccode>unclean.leader.election.enable=false\u003c/code>, para não permitir que uma réplica desatualizada vire líder, o que descartaria mensagens confirmadas.\u003c/p>\n\u003cp>Do lado do consumidor, desligar o auto-commit e commitar após processar com sucesso, senão você pode confirmar leitura de algo que não foi processado.\u003c/p>\n\u003cp>E do lado do produtor, garantir que o retry esteja habilitado com produtor idempotente, para que o retry não gere duplicata.\u003c/p>\n\u003cp>\u003cem>Follow-up esperado:\u003c/em> \"Por que não \u003ccode>min.insync.replicas=3\u003c/code> com fator 3?\" → Porque aí a perda de qualquer broker interrompe as escritas. Você trocaria disponibilidade por uma durabilidade marginalmente maior, o que raramente é o compromisso desejado.\u003c/p>"},{"titleHtml":"🟡 P7. O que é rebalance e por que pode ser um problema?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É a redistribuição de partições entre os consumidores do grupo, disparada quando um consumidor entra, sai, morre ou perde o heartbeat, ou quando o número de partições muda.\u003c/p>\n\u003cp>O problema é que o rebalance clássico para o grupo inteiro: todos devolvem suas partições e recebem novas atribuições, o que causa uma pausa no consumo. Em grupos grandes isso é perceptível.\u003c/p>\n\u003cp>A causa mais comum de rebalance indesejado é \u003cstrong>processamento lento\u003c/strong>: se o consumidor demora mais que o intervalo máximo permitido entre polls, o coordenador o considera morto e dispara rebalance. Aí a mensagem é reprocessada por outro consumidor, que também demora, e o grupo entra num ciclo de rebalances sem progredir. Corrijo reduzindo o número de registros por poll, aumentando o intervalo permitido, ou tirando o processamento pesado do loop de poll.\u003c/p>\n\u003cp>Estruturalmente, uso rebalance cooperativo, que redistribui só as partições necessárias sem parar o grupo, e static membership, que permite a um consumidor que reinicia rapidamente reassumir suas partições sem disparar rebalance — muito útil com deploys frequentes.\u003c/p>"},{"titleHtml":"🟡 P8. O que é log compaction e quando usar?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Em vez de apagar mensagens por idade, o Kafka mantém pelo menos o último valor de cada chave, para sempre. Isso transforma o tópico numa tabela de estado atual: relendo do início, você reconstrói o estado corrente de todas as chaves.\u003c/p>\n\u003cp>Uso para tópicos que representam \u003cstrong>estado\u003c/strong>, não eventos: configuração, cadastro, changelog de CDC, e os stores respaldados do Kafka Streams. Para eventos — cliques, transações, logs — retenção por tempo é o correto, porque cada evento é significativo por si.\u003c/p>\n\u003cp>Detalhes: uma mensagem com valor nulo é um tombstone, que sinaliza deleção e é mantida por um período antes de ser removida, para que consumidores lentos a vejam. E a compactação roda em background, então a parte mais recente do log pode ter várias versões da mesma chave — compaction não garante unicidade instantânea.\u003c/p>\n\u003cp>É também o mecanismo padrão para atender direito ao esquecimento sob LGPD/GDPR em Kafka, já que o log é imutável e não se apaga uma mensagem no meio dele.\u003c/p>"},{"titleHtml":"🟡 P9. Como você dimensiona o número de partições?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Pelo throughput alvo dividido pelo throughput que um único consumidor consegue processar, com folga para crescimento — porque aumentar depois é problemático e diminuir é impossível.\u003c/p>\n\u003cp>O limite superior é o paralelismo desejado: com N partições, no máximo N consumidores trabalham simultaneamente naquele grupo.\u003c/p>\n\u003cp>Mas mais não é sempre melhor. Partições demais custam file handles e metadados no broker, mais requisições de replicação, tempo de recuperação maior quando um broker cai, e podem aumentar a latência fim a fim.\u003c/p>\n\u003cp>E lembraria que aumentar partições depois quebra a garantia de ordenação por chave, porque o mapeamento de hash muda. Então, se ordenação por chave for requisito, o dimensionamento inicial precisa ter folga real — ou você precisa de um plano de migração de tópico.\u003c/p>"},{"titleHtml":"🔴 P10. Explique exactly-once no Kafka e seus limites.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> São dois mecanismos que se somam.\u003c/p>\n\u003cp>\u003cstrong>Produtor idempotente:\u003c/strong> o produtor recebe um Producer ID e mantém número de sequência por partição; o broker rastreia o maior número gravado por PID e partição e descarta duplicatas de retry, ainda respondendo com ack. Isso elimina a fonte mais comum de duplicata, que é o reenvio. O limite é que cobre uma sessão do produtor e uma partição por vez — não cobre reinício nem escrita atômica em múltiplas partições.\u003c/p>\n\u003cp>\u003cstrong>Transações:\u003c/strong> permitem que escritas em múltiplas partições e tópicos, mais o commit dos offsets consumidos, sejam atômicas. É o padrão read-process-write: consumir, processar, produzir e commitar offset como unidade. Consumidores em \u003ccode>read_committed\u003c/code> só enxergam transações commitadas.\u003c/p>\n\u003cp>Os limites, que são o ponto da pergunta: isso é exactly-once de ponta a ponta \u003cstrong>quando origem e destino são Kafka\u003c/strong>. Se o destino é um banco ou uma API externa que não participa da transação, a garantia termina na fronteira, e você precisa de idempotência no destino para obter o efeito equivalente.\u003c/p>\n\u003cp>E há custo: transações adicionam coordenação e latência; consumidores em \u003ccode>read_committed\u003c/code> só leem até onde não há transação aberta pendente, o que atrasa; e uma transação travada bloqueia o avanço dos leitores até expirar. Na maioria dos sistemas eu preferiria at-least-once com escrita idempotente no destino, que dá o mesmo resultado observável com menos complexidade e melhor throughput.\u003c/p>"},{"titleHtml":"🔴 P11. Um consumer group está com lag crescente. Como investiga?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Primeiro, verifico se o lag é \u003cstrong>uniforme entre partições ou concentrado\u003c/strong>. Essa única observação separa dois problemas completamente diferentes.\u003c/p>\n\u003cp>\u003cstrong>Concentrado em poucas partições:\u003c/strong> ou há partition skew — a chave escolhida concentra tráfego numa partição — ou o consumidor daquelas partições está travado ou morto. Escalar não resolve skew; a correção é rever a chave ou redistribuir.\u003c/p>\n\u003cp>\u003cstrong>Uniforme:\u003c/strong> é capacidade ou gargalo compartilhado. Aí verifico, nesta ordem:\u003c/p>\n\u003cp>O \u003cstrong>sink\u003c/strong> — na maioria dos casos que já vi, o consumidor não está lento, está esperando um destino lento ou degradado. Escalar o consumidor nesse caso piora, porque aumenta a pressão sobre o gargalo.\u003c/p>\n\u003cp>\u003cstrong>Rebalances frequentes\u003c/strong> — se o grupo está em ciclo de rebalance por processamento lento entre polls, ele não progride. Isso aparece nos logs e é uma causa que passa despercebida com frequência.\u003c/p>\n\u003cp>\u003cstrong>Número de consumidores versus partições\u003c/strong> — se já tenho consumidores igual ao número de partições, adicionar mais não faz nada. Nesse caso a saída é aumentar partições (com o cuidado da ordenação) ou paralelizar o processamento dentro do consumidor, aceitando perder ordem.\u003c/p>\n\u003cp>\u003cstrong>Pico legítimo de volume\u003c/strong>, GC, ou recursos insuficientes.\u003c/p>\n\u003cp>Para recuperar, uma decisão precisa ser explícita: \u003cstrong>recuperar tudo ou pular para o presente?\u003c/strong> Se o consumo alimenta um alerta operacional, dado de horas atrás não tem valor e pode ser melhor avançar o offset e reprocessar o buraco em batch. Se alimenta uma tabela transacional, tem que recuperar tudo, em ordem.\u003c/p>\n\u003cp>Para prevenir: alerta sobre lag \u003cstrong>em tempo\u003c/strong>, não em número de mensagens — \"10 mil mensagens\" significa coisas diferentes conforme a taxa; monitoramento separado da latência do sink; e teste de carga com volume de pico.\u003c/p>"},{"titleHtml":"🔴 P12. Você precisa reprocessar 30 dias de um tópico com uma lógica corrigida. Como faz sem afetar os consumidores atuais?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Uso um \u003cstrong>consumer group novo\u003c/strong>. Como o offset é por grupo, um grupo novo lê o tópico independentemente, sem tocar no progresso do grupo em produção. Configuro para começar do início ou de um timestamp específico — Kafka permite buscar offset por timestamp, o que é a forma correta de dizer \"comece em 30 dias atrás\".\u003c/p>\n\u003cp>Antes de começar, três verificações:\u003c/p>\n\u003cp>\u003cstrong>A retenção cobre 30 dias?\u003c/strong> Se a retenção é de 7, os dados não existem mais e o plano inteiro muda: preciso da fonte original ou de uma camada bruta já persistida.\u003c/p>\n\u003cp>\u003cstrong>O destino tolera reescrita?\u003c/strong> Prefiro escrever numa tabela sombra e trocar atomicamente no fim, para que os consumidores nunca vejam estado parcial. Se escrever direto, a escrita precisa ser idempotente por chave para não duplicar.\u003c/p>\n\u003cp>\u003cstrong>Qual o impacto no cluster?\u003c/strong> Reprocessar 30 dias em velocidade máxima gera carga de leitura muito acima do normal e pode competir com os consumidores de produção pelo I/O dos brokers. Limito a taxa e, se possível, rodo em janela de menor uso.\u003c/p>\n\u003cp>Durante a execução, valido incrementalmente comparando com o resultado antigo em métricas-chave, em vez de descobrir no fim que algo estava errado desde o começo.\u003c/p>\n\u003cp>Se a lógica nova for para valer daí em diante, o corte precisa ser planejado: normalmente, deixo o novo consumidor alcançar o presente e então faço o switch, evitando janela de dupla escrita ou de buraco.\u003c/p>"},{"titleHtml":"🔴 P13. Como você lidaria com uma mensagem que sempre falha no processamento (poison pill)?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O risco é bloquear a partição inteira: se o consumidor tenta, falha, e reprocessa a mesma mensagem indefinidamente, nenhuma mensagem posterior daquela partição avança. É um modo de falha silencioso e grave, porque o consumidor parece vivo.\u003c/p>\n\u003cp>A solução padrão é \u003cstrong>dead letter queue\u003c/strong>: após N tentativas, a mensagem é publicada num tópico de DLQ com metadados de contexto — erro, stack trace, offset, timestamp, número de tentativas — e o offset original é commitado para o consumo prosseguir.\u003c/p>\n\u003cp>Alguns cuidados que separam uma resposta completa:\u003c/p>\n\u003cp>\u003cstrong>A DLQ precisa ser monitorada e ter dono.\u003c/strong> DLQ que ninguém olha é o mesmo que descartar, mas com a ilusão de que foi tratado.\u003c/p>\n\u003cp>\u003cstrong>Distinguir erro transitório de permanente.\u003c/strong> Timeout de rede merece retry; erro de desserialização não vai melhorar com repetição. Retentar indefinidamente um erro permanente desperdiça recursos e mascara o problema.\u003c/p>\n\u003cp>\u003cstrong>Ordenação.\u003c/strong> Se a ordem importa para aquela chave, mandar uma mensagem para a DLQ e seguir adiante significa que as mensagens seguintes daquela chave serão processadas sem a anterior — o que pode ser semanticamente inaceitável. Nesses casos, a alternativa é parar aquela chave especificamente, ou aceitar parar a partição e alertar.\u003c/p>\n\u003cp>\u003cstrong>Erro de desserialização\u003c/strong> é caso especial e comum: se o produtor mudou o formato, todas as mensagens novas falham. É exatamente o problema que Schema Registry com validação de compatibilidade previne — e a solução estrutural é essa, não a DLQ.\u003c/p>\n\u003cp>\u003cstrong>Reprocessamento da DLQ\u003c/strong> deve ser um processo explícito, com correção do código ou do dado antes de reinjetar.\u003c/p>"},{"titleHtml":"🔴 P14. Como você desenharia um pipeline CDC de um Postgres para um data lake usando Kafka?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Estruturaria em quatro camadas.\u003c/p>\n\u003cp>\u003cstrong>Captura.\u003c/strong> Debezium via Kafka Connect, lendo o WAL do Postgres com um slot de replicação. Uso a chave primária da tabela como chave da mensagem, para que todas as mudanças de uma linha caiam na mesma partição e mantenham ordem — isso é requisito, não otimização, porque aplicar um update antes do insert corrompe o resultado. Um tópico por tabela.\u003c/p>\n\u003cp>O ponto operacional crítico: \u003cstrong>monitorar o slot de replicação\u003c/strong>. Se o conector parar e o slot permanecer, o Postgres retém WAL indefinidamente e pode encher o disco da produção. Isso derruba o banco, não o pipeline — é o risco mais sério dessa arquitetura e precisa de alerta dedicado.\u003c/p>\n\u003cp>\u003cstrong>Snapshot inicial.\u003c/strong> O Debezium faz um snapshot consistente e depois continua do ponto correspondente do log. É a parte mais delicada, e em tabelas grandes vale usar snapshot incremental para não bloquear nem gerar um pico enorme.\u003c/p>\n\u003cp>\u003cstrong>Transporte.\u003c/strong> Retenção do tópico dimensionada para cobrir a janela de reprocessamento que eu quero suportar. Schema Registry com Avro e compatibilidade backward, para que uma mudança de DDL na origem não quebre os consumidores silenciosamente.\u003c/p>\n\u003cp>\u003cstrong>Ingestão no lake.\u003c/strong> Um sink escrevendo em formato de tabela transacional. E aqui uma decisão explícita: escrevo o \u003cstrong>histórico de mudanças\u003c/strong> append-only, com o tipo de operação e o timestamp, como camada bruta; e derivo dele o \u003cstrong>estado atual\u003c/strong> via MERGE por chave primária, numa camada seguinte. Manter os dois é o que permite tanto reconstruir o presente quanto atender auditoria e construir SCD Tipo 2 depois.\u003c/p>\n\u003cp>\u003cstrong>Cuidados adicionais:\u003c/strong> deletes precisam ser propagados explicitamente, senão o espelho fica com registros fantasma; a ordenação por chave precisa ser preservada também na escrita, não só no transporte; e mudanças de DDL na origem devem gerar alerta, porque nem toda evolução é graciosa.\u003c/p>\n\u003cp>Se o requisito de latência for de minutos e não segundos, eu ainda consideraria se o Kafka é necessário — um Connect escrevendo direto no lake, ou uma ferramenta gerenciada de CDC, pode ser suficiente e bem mais simples de operar. Kafka se justifica quando há múltiplos consumidores do mesmo fluxo, ou quando a capacidade de reprocessar do log tem valor.\u003c/p>"},{"titleHtml":"🔴 P15. O que mudou com o KRaft e por que isso importa?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O KRaft substituiu o ZooKeeper como sistema de gerenciamento de metadados do Kafka, usando um protocolo de consenso baseado em Raft implementado dentro do próprio Kafka. É o padrão e o modo recomendado, e o ZooKeeper foi removido a partir do Kafka 4.0.\u003c/p>\n\u003cp>Por que importa, na prática: elimina um sistema distribuído inteiro da operação — um cluster a menos para dimensionar, monitorar, atualizar e recuperar, com seu próprio modelo de falha. O failover de controlador é mais rápido, porque o estado de metadados já está replicado como um log em vez de precisar ser recarregado. E escala melhor em número de partições, porque a propagação de metadados deixa de depender de watches do ZooKeeper.\u003c/p>\n\u003cp>Conceitualmente, é um bom exemplo de um princípio geral de sistemas distribuídos: usar consenso apenas para metadados e coordenação, mantendo o caminho de dados fora dele. O Kafka faz consenso via KRaft para \"quem é o líder de cada partição, qual a configuração\", e replica os dados por um protocolo mais leve baseado em ISR. Misturar as duas coisas custaria muito throughput.\u003c/p>\n\u003cp>Para uma migração real, o que eu observaria é a versão mínima suportada e o caminho de migração, já que clusters em ZooKeeper precisam de um procedimento específico e há uma janela de convivência.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual a diferença fundamental entre \u003cstrong>Kafka e uma fila tradicional\u003c/strong>?","a":["Kafka é mais rápido por ser escrito em Scala","No Kafka a mensagem permanece no log pelo período de retenção e cada consumidor mantém seu próprio offset — múltiplos consumidores independentes e reprocessamento voltando o offset","Filas tradicionais não escalam horizontalmente","Kafka entrega mensagens em ordem global"],"c":1,"e":"Numa fila, a mensagem é removida ao ser consumida. O broker do Kafka é burro por design — não rastreia entrega por mensagem — e é isso que sustenta o throughput (junto com escrita sequencial, zero-copy e batching)."},{"n":"🟢","levelName":"basico","q":"Qual é o \u003cstrong>paralelismo máximo\u003c/strong> de um consumer group?","a":["Ilimitado — basta adicionar consumidores","O número de partições do tópico: cada partição é consumida por no máximo um consumidor do grupo; consumidores extras ficam ociosos","O número de brokers do cluster","O número de réplicas de cada partição"],"c":1,"e":"É uma das perguntas mais frequentes. Se o gargalo for o consumidor e já houver um por partição, a saída é aumentar partições (cuidado com a ordenação) ou paralelizar dentro do consumidor perdendo ordem."},{"n":"🟡","levelName":"intermediario","q":"O que acontece com a \u003cstrong>ordenação por chave\u003c/strong> se você aumentar o número de partições?","a":["Nada — a ordenação é preservada automaticamente","Quebra na transição: hash(chave) % N muda com N, e mensagens da mesma chave passam a ir para outra partição — por isso o dimensionamento inicial precisa de folga","A ordenação melhora, pois há menos contenção","Kafka redistribui o histórico automaticamente"],"c":1,"e":"Kafka garante ordem apenas dentro da partição, via chave. E não é possível reduzir partições. Partições demais também custam: metadados, replicação, recuperação mais lenta."},{"n":"🟡","levelName":"intermediario","q":"Qual combinação garante \u003cstrong>durabilidade\u003c/strong> de escrita no Kafka?","a":["acks=1 com replication.factor=3","acks=all + replication.factor=3 + min.insync.replicas=2 — pelo menos duas cópias confirmadas, tolerando a perda de um broker sem parar as escritas","acks=0 com retenção longa","min.insync.replicas=3 com replication.factor=3, para máxima segurança"],"c":1,"e":"A opção D para as escritas se qualquer broker cair — troca disponibilidade por durabilidade marginal. E unclean.leader.election=false impede que réplica desatualizada vire líder descartando mensagens confirmadas."},{"n":"🟡","levelName":"intermediario","q":"Qual o problema do \u003cstrong>auto-commit\u003c/strong> de offsets?","a":["Ele consome muita CPU do broker","Ele commita por tempo, sem relação com o progresso real: pode confirmar mensagens ainda não processadas (perda) — para controle da semântica, desligue e commite manualmente após processar","Ele impede o rebalance do grupo","Ele duplica os offsets no log"],"c":1,"e":"Commitar depois de processar = at-least-once; antes = at-most-once. Auto-commit te deixa num meio-termo imprevisível — saber disso é marcador de experiência prática."},{"n":"🟡","levelName":"intermediario","q":"Um consumer group entra em \u003cstrong>ciclo de rebalances\u003c/strong> sem progredir. Qual a causa clássica?","a":["Tópico com partições demais","Processamento mais lento que max.poll.interval.ms: o coordenador considera o consumidor morto, redistribui, o próximo também demora, e o ciclo se repete — reduza max.poll.records ou tire o trabalho pesado do loop de poll","Falta de réplicas no tópico","Chaves de mensagem muito grandes"],"c":1,"e":"Mitigações estruturais: rebalance cooperativo (redistribui só o necessário, sem stop-the-world) e static membership (reinício rápido não dispara rebalance — valioso com deploys frequentes)."},{"n":"🟡","levelName":"intermediario","q":"Para que serve \u003cstrong>log compaction\u003c/strong>?","a":["Comprimir mensagens com zstd para economizar disco","Manter pelo menos o último valor de cada chave: o tópico vira uma tabela de estado atual reconstituível do início — base de KTables, changelogs de CDC e do direito ao esquecimento via tombstones","Apagar mensagens mais rápido que a retenção por tempo","Ordenar o log por chave"],"c":1,"e":"Use para estado (cadastro, configuração); para eventos, retenção por tempo. Tombstone = mensagem com valor nulo sinalizando deleção, mantida por um período para consumidores lentos verem."},{"n":"🔴","levelName":"avancado","q":"Qual o \u003cstrong>escopo real\u003c/strong> do exactly-once (EOS) do Kafka?","a":["Ponta a ponta em qualquer arquitetura, incluindo sinks externos","De ponta a ponta apenas quando origem e destino são Kafka (read-process-write transacional); num sink externo a garantia termina na fronteira — é preciso idempotência no destino","Apenas dentro de uma única partição","Somente para produtores, nunca para consumidores"],"c":1,"e":"Produtor idempotente elimina duplicatas de retry; transações tornam atômicos os writes multi-partição + commit de offsets. Mas um banco externo não participa da transação do Kafka — e há custo real de throughput."}]},{"id":"10","fullTitle":"10 — Airflow e Orquestração","shortTitle":"Airflow e Orquestração","subtitle":"DAGs e scheduling · Data interval · Dependências · Sensores · Idempotência de tarefas · XCom · Executores · Airflow 3 · Alternativas","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-o-papel-de-um-orquestrador\">1.1 O papel de um orquestrador\u003c/h3>\n\u003cp>Um orquestrador responde três perguntas: \u003cstrong>quando\u003c/strong> algo roda, \u003cstrong>em que ordem\u003c/strong>, e \u003cstrong>o que acontece quando falha\u003c/strong>. Ele coordena; ele não processa. Um Airflow bem usado dispara trabalho em outros sistemas (warehouse, Spark, containers) e monitora o resultado.\u003c/p>\n\u003cp>O que um orquestrador entrega além do cron:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Dependências explícitas\u003c/strong> entre tarefas, em vez de acoplamento por horário.\u003c/li>\u003cli>\u003cstrong>Retry com política\u003c/strong>, backoff e limite.\u003c/li>\u003cli>\u003cstrong>Observabilidade\u003c/strong>: histórico de execuções, logs centralizados, duração, estado.\u003c/li>\u003cli>\u003cstrong>Backfill\u003c/strong>: reexecutar intervalos passados de forma controlada.\u003c/li>\u003cli>\u003cstrong>SLA e alertas\u003c/strong>, incluindo detecção de atraso, não só de falha.\u003c/li>\u003cli>\u003cstrong>Paralelismo controlado\u003c/strong>: limites por DAG, por tarefa, por pool de recursos.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-2-dag-tarefas-e-o-modelo-de-execução\">1.2 DAG, tarefas e o modelo de execução\u003c/h3>\n\u003cp>Um \u003cstrong>DAG\u003c/strong> é a definição do fluxo: tarefas e suas dependências, sem ciclos. No Airflow, é código Python que \u003cstrong>descreve\u003c/strong> o grafo — não que executa o trabalho. Essa distinção é a fonte de vários erros: código no corpo do DAG roda a cada parse do arquivo, que acontece a cada poucos segundos no scheduler, para todos os DAGs. Fazer uma consulta a banco ou chamada de API no nível do módulo é um erro clássico e custoso.\u003c/p>\n\u003cp>Componentes:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Operator\u003c/strong>: o modelo de uma tarefa (executar SQL, rodar um container, chamar uma API).\u003c/li>\u003cli>\u003cstrong>Task\u003c/strong>: uma instância de operator dentro de um DAG.\u003c/li>\u003cli>\u003cstrong>Task Instance\u003c/strong>: a execução de uma task para um intervalo específico.\u003c/li>\u003cli>\u003cstrong>DAG Run\u003c/strong>: a execução do DAG para um intervalo específico.\u003c/li>\u003cli>\u003cstrong>Sensor\u003c/strong>: uma tarefa que espera uma condição externa. Em modo \u003cem>reschedule\u003c/em> ele libera o worker entre verificações, em vez de ocupar um slot ocioso — a diferença importa muito em escala, e sensores em modo poke ocupando slots é uma causa clássica de deadlock de pool.\u003c/li>\u003cli>\u003cstrong>Hook\u003c/strong>: a abstração de conexão com um sistema externo.\u003c/li>\u003cli>\u003cstrong>Pool\u003c/strong>: limite de concorrência para um conjunto de tarefas, usado para não sobrecarregar um recurso compartilhado (um banco de origem, por exemplo).\u003c/li>\u003cli>\u003cstrong>Trigger rule\u003c/strong>: a condição sob a qual uma tarefa roda em função do estado das anteriores. O padrão é \u003ccode>all_success\u003c/code>, mas \u003ccode>all_done\u003c/code>, \u003ccode>one_failed\u003c/code> e \u003ccode>none_failed_min_one_success\u003c/code> permitem construir ramos de tratamento de erro e limpeza.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-3-data-interval-o-conceito-que-mais-confunde\">1.3 Data interval — o conceito que mais confunde\u003c/h3>\n\u003cp>O Airflow agenda por \u003cstrong>intervalo de dados\u003c/strong>, não por instante. Um DAG diário com intervalo \u003ccode>2026-08-13 00:00\u003c/code> a \u003ccode>2026-08-14 00:00\u003c/code> \u003cstrong>só é disparado no fim do intervalo\u003c/strong>, ou seja, à meia-noite de 14.\u003c/p>\n\u003cp>Isso é intencional e correto: o pipeline processa o dia 13, e o dia 13 só está completo depois que ele termina. O nome antigo dessa ideia, \u003ccode>execution_date\u003c/code>, era péssimo e causou anos de confusão, porque parecia ser \"quando rodou\" quando na verdade era \"o início do período processado\". Versões modernas usam \u003ccode>data_interval_start\u003c/code> e \u003ccode>data_interval_end\u003c/code>, que são explícitos.\u003c/p>\n\u003cp>\u003cstrong>Por que isso importa para o seu código:\u003c/strong> a tarefa deve usar o intervalo como parâmetro em toda a lógica — filtrar a origem por \u003ccode>data_interval_start\u003c/code> e \u003ccode>data_interval_end\u003c/code>, e escrever na partição correspondente. Se ela usa \u003ccode>now()\u003c/code> ou \u003ccode>current_date\u003c/code>, ela deixa de ser reexecutável no passado, e backfill passa a produzir resultado errado (todas as execuções processariam o dia de hoje). Esta é a conexão direta entre Airflow e o conceito de idempotência do arquivo 03.\u003c/p>\n\u003cp>\u003cstrong>Catchup\u003c/strong> controla se, ao ativar um DAG (ou depois de uma pausa), o Airflow executa todos os intervalos passados desde a data de início. Ligado por padrão em versões antigas, é uma armadilha conhecida: ativar um DAG com \u003ccode>start_date\u003c/code> há um ano dispara centenas de execuções de uma vez. Combine com \u003ccode>max_active_runs\u003c/code> para limitar a concorrência, ou desligue o catchup quando o histórico não for necessário.\u003c/p>\n\u003ch3 id=\"h-1-4-scheduling\">1.4 Scheduling\u003c/h3>\n\u003cp>Formas de agendar:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Cron ou intervalo fixo\u003c/strong> (\u003ccode>@daily\u003c/code>, expressão cron, timedelta).\u003c/li>\u003cli>\u003cstrong>Timetable customizada\u003c/strong>, para regras que cron não expressa — dias úteis considerando feriados, calendários fiscais.\u003c/li>\u003cli>\u003cstrong>Disparo por dataset/asset\u003c/strong>: o DAG roda quando outro DAG atualiza um dataset do qual ele depende. Isso é orquestração \u003cstrong>orientada a dados\u003c/strong> em vez de a tempo, e resolve o problema clássico de \"roda às 7h porque o outro roda às 6h\", que é uma suposição não verificada.\u003c/li>\u003cli>\u003cstrong>Externo\u003c/strong>: chamada de API, evento, ação manual.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Airflow 3\u003c/strong> avançou bastante nessa direção: os \"datasets\" evoluíram para \u003cstrong>assets\u003c/strong> com um decorador dedicado, o scheduler ficou mais orientado a eventos, e há \u003cstrong>watchers\u003c/strong> que observam fontes externas para disparar DAGs — com suporte a SQS de saída de fábrica e a base para outros gatilhos. A outra novidade importante da versão 3 é o \u003cstrong>versionamento de DAG\u003c/strong>: uma execução roda até o fim com a versão vigente quando começou, mesmo que uma nova versão seja publicada no meio, e a interface associa cada execução à versão que a produziu, incluindo estrutura de tarefas, código e logs. Isso resolve um problema real e antigo de auditoria — antes, você via logs de uma execução mas o código exibido já era outro. Backfills também passaram a ser gerenciados pelo scheduler como cidadãos de primeira classe.\u003c/p>\n\u003ch3 id=\"h-1-5-passagem-de-dados-entre-tarefas-xcom\">1.5 Passagem de dados entre tarefas: XCom\u003c/h3>\n\u003cp>\u003cstrong>XCom\u003c/strong> (\"cross-communication\") permite que uma tarefa passe um valor para outra. É armazenado no banco de metadados do Airflow.\u003c/p>\n\u003cp>\u003cstrong>A regra:\u003c/strong> XCom serve para \u003cstrong>metadados pequenos\u003c/strong> — um caminho de arquivo, um identificador de job, uma contagem, um flag. Nunca para dados. Passar um DataFrame ou um JSON de megabytes pelo XCom incha o banco de metadados, degrada o scheduler e é um antipadrão bem conhecido.\u003c/p>\n\u003cp>O padrão correto é passar \u003cstrong>referências\u003c/strong>: a tarefa A escreve o resultado em storage e passa o caminho pelo XCom; a tarefa B lê do caminho. Versões modernas suportam \u003cstrong>custom XCom backends\u003c/strong>, que persistem o valor em object storage transparentemente — o que resolve o problema sem mudar o código, mas não muda o princípio de que o orquestrador não deve ser um barramento de dados.\u003c/p>\n\u003ch3 id=\"h-1-6-executores-e-escalabilidade\">1.6 Executores e escalabilidade\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>SequentialExecutor\u003c/strong>: uma tarefa por vez. Só para desenvolvimento.\u003c/li>\u003cli>\u003cstrong>LocalExecutor\u003c/strong>: processos paralelos numa máquina. Suficiente para cargas pequenas e médias.\u003c/li>\u003cli>\u003cstrong>CeleryExecutor\u003c/strong>: workers distribuídos com fila de mensagens. O padrão histórico para escala, com workers de longa duração.\u003c/li>\u003cli>\u003cstrong>KubernetesExecutor\u003c/strong>: cada tarefa roda num pod próprio. Isolamento total, dependências por tarefa, escala elástica. O custo é latência de inicialização do pod, o que pesa quando as tarefas são muito curtas.\u003c/li>\u003cli>\u003cstrong>CeleryKubernetesExecutor / híbridos\u003c/strong>: rotear tarefas curtas para Celery e pesadas para Kubernetes.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Gargalos típicos do Airflow\u003c/strong>, que rendem boas respostas de troubleshooting:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Tempo de parse dos DAGs.\u003c/strong> O scheduler reprocessa os arquivos periodicamente. Código pesado no nível do módulo, importações lentas ou centenas de arquivos deixam o scheduler lento e atrasam todo o agendamento.\u003c/li>\u003cli>\u003cstrong>Banco de metadados.\u003c/strong> Ele é o coração do Airflow. XComs grandes, histórico não limpo e muitas task instances degradam tudo. Limpeza periódica de registros antigos é manutenção obrigatória.\u003c/li>\u003cli>\u003cstrong>Concorrência mal configurada.\u003c/strong> Paralelismo global, por DAG, por tarefa e por pool interagem, e o limite efetivo é o menor deles — o que causa a confusão de \"aumentei os workers e não melhorou\".\u003c/li>\u003cli>\u003cstrong>Sensores ocupando slots.\u003c/strong> Muitos sensores em modo poke consomem todos os slots disponíveis e travam o cluster esperando; modo reschedule ou deferrable operators resolvem.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Deferrable operators e triggerer\u003c/strong> são a solução moderna para espera: a tarefa registra uma condição e libera o worker, e um processo \u003ccode>triggerer\u003c/code> assíncrono monitora milhares de condições com pouquíssimo recurso, retomando a tarefa quando a condição é satisfeita. Para pipelines com muita espera — sensores de arquivo, jobs externos longos — a economia de recursos é enorme. É um ótimo detalhe para citar.\u003c/p>\n\u003ch3 id=\"h-1-7-boas-práticas-de-design-de-dag\">1.7 Boas práticas de design de DAG\u003c/h3>\n\u003cp>\u003cstrong>Tarefas atômicas e idempotentes.\u003c/strong> Cada tarefa faz uma coisa e pode ser reexecutada sem efeito colateral. Isso é o que torna retry automático seguro.\u003c/p>\n\u003cp>\u003cstrong>Parametrizar pelo data interval, nunca pelo relógio.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Evitar DAGs monolíticos.\u003c/strong> Um DAG com centenas de tarefas é difícil de testar, de reprocessar em parte, e uma falha no meio invalida muito trabalho. Prefira DAGs menores conectados por dependência de dataset.\u003c/p>\n\u003cp>\u003cstrong>Nada de trabalho pesado no corpo do DAG.\u003c/strong> O arquivo é parseado constantemente; consultas e chamadas externas no nível do módulo custam caro e podem derrubar o scheduler.\u003c/p>\n\u003cp>\u003cstrong>Não usar o Airflow como engine de processamento.\u003c/strong> Carregar milhões de linhas num DataFrame dentro de uma task é usar o orquestrador como cluster. Delegue ao warehouse ou ao Spark e deixe o Airflow coordenar.\u003c/p>\n\u003cp>\u003cstrong>Dependências declaradas, não implícitas por horário.\u003c/strong> Se o DAG B precisa do resultado do DAG A, expresse isso — por dataset/asset, ou por um sensor que verifica a condição real —, não colocando B uma hora depois de A.\u003c/p>\n\u003cp>\u003cstrong>Alertar em SLA, não só em falha.\u003c/strong> Um pipeline que termina 6 horas atrasado quebra o consumidor tanto quanto um que falha, e não gera alerta se você só monitora estado final.\u003c/p>\n\u003cp>\u003cstrong>Configuração e segredos fora do código.\u003c/strong> Connections, Variables e um backend de secrets. Credencial em código versionado é um achado de auditoria garantido.\u003c/p>\n\u003ch3 id=\"h-1-8-alternativas-e-como-posicioná-las\">1.8 Alternativas e como posicioná-las\u003c/h3>\n\u003cp>Vale conhecer para responder \"por que Airflow e não X\":\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Dagster\u003c/strong>: orientado a \u003cstrong>assets\u003c/strong> desde a concepção — você declara os dados que devem existir e o framework deriva a execução. Tem tipagem, testabilidade e lineage embutidos. É a alternativa conceitualmente mais distinta.\u003c/li>\u003cli>\u003cstrong>Prefect\u003c/strong>: foco em experiência de desenvolvimento e fluxos dinâmicos, com menos cerimônia.\u003c/li>\u003cli>\u003cstrong>dbt\u003c/strong>: não é orquestrador — é uma ferramenta de transformação que gera um DAG \u003cstrong>dentro\u003c/strong> do warehouse. Costuma ser orquestrado \u003cem>pelo\u003c/em> Airflow, não substituí-lo. Confundir os dois é um erro comum.\u003c/li>\u003cli>\u003cstrong>Mage, Kestra, Temporal\u003c/strong>: outras opções; Temporal em particular é orquestração de workflows de aplicação, com um modelo durável de execução, e não uma ferramenta de dados.\u003c/li>\u003cli>\u003cstrong>Orquestradores gerenciados de nuvem\u003c/strong> (Step Functions, Cloud Composer, MWAA, Data Factory): menos operação, mais lock-in.\u003c/li>\u003c/ul>\n\u003cp>A resposta honesta sobre o Airflow: é o padrão de fato, com o maior ecossistema de integrações e a maior base de conhecimento, e a versão 3 fechou boa parte da distância conceitual em relação aos concorrentes com asset-aware scheduling e versionamento. As críticas históricas — modelo centrado em tarefas em vez de dados, testabilidade limitada, complexidade operacional — motivaram os concorrentes e são as que você deve saber articular.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Confundir data interval com data de execução.\u003c/strong> Um DAG diário roda no fim do intervalo. Usar \u003ccode>now()\u003c/code> na lógica em vez do intervalo quebra o backfill de forma silenciosa.\u003c/p>\n\u003cp>\u003cstrong>Usar o Airflow como engine de processamento.\u003c/strong> Carregar milhões de linhas dentro de uma task transforma o scheduler em cluster de dados. Delegue.\u003c/p>\n\u003cp>\u003cstrong>Passar dados grandes por XCom.\u003c/strong> Incha o banco de metadados e degrada o scheduler para todos os DAGs. Passe referências.\u003c/p>\n\u003cp>\u003cstrong>Código pesado no corpo do DAG.\u003c/strong> O arquivo é parseado constantemente. Consulta a banco ou chamada de API no nível do módulo é multiplicada por cada ciclo de parse.\u003c/p>\n\u003cp>\u003cstrong>Ativar um DAG com catchup ligado e \u003ccode>start_date\u003c/code> antiga.\u003c/strong> Dispara centenas de execuções simultâneas, podendo derrubar a origem.\u003c/p>\n\u003cp>\u003cstrong>Sensores em modo poke ocupando todos os slots.\u003c/strong> Cluster travado com workers \"ocupados\" esperando. Use reschedule ou deferrable.\u003c/p>\n\u003cp>\u003cstrong>Dependência implícita por horário.\u003c/strong> \"Roda às 7h porque o outro roda às 6h\" não é dependência. Declare por dataset/asset ou use sensor.\u003c/p>\n\u003cp>\u003cstrong>Monitorar apenas falha, não atraso.\u003c/strong> Um pipeline que termina 6 horas atrasado quebra o consumidor e não gera alerta nenhum sem SLA.\u003c/p>\n\u003cp>\u003cstrong>Tarefas não idempotentes com retry ligado.\u003c/strong> O retry automático duplica dados. É o combo mais destrutivo e mais comum.\u003c/p>\n\u003cp>\u003cstrong>DAG monolítico com centenas de tarefas.\u003c/strong> Difícil de testar, de reprocessar em parte, e uma falha no meio invalida muito trabalho.\u003c/p>\n\u003cp>\u003cstrong>Não limpar o banco de metadados.\u003c/strong> Histórico acumulado degrada o scheduler progressivamente, e o sintoma aparece meses depois.\u003c/p>\n\u003cp>\u003cstrong>Aumentar workers sem verificar limites de concorrência.\u003c/strong> O limite efetivo é o menor entre paralelismo global, por DAG, por tarefa e por pool.\u003c/p>\n\u003cp>\u003cstrong>Achar que dbt substitui o orquestrador.\u003c/strong> Ele transforma dentro do warehouse; não ingere, não coordena entre sistemas, não gerencia o ciclo completo.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. O que é o Airflow e para que serve?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um orquestrador de workflows: define fluxos como DAGs em Python, agenda execuções, gerencia dependências entre tarefas, faz retry em falha e dá observabilidade sobre o histórico.\u003c/p>\n\u003cp>O ponto importante é que ele coordena, não processa. Um bom uso dispara trabalho no warehouse, no Spark ou em containers e monitora o resultado — não carrega dados dentro da própria tarefa.\u003c/p>"},{"titleHtml":"🟢 P2. O que é um operator, uma task e um DAG run?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Operator é o modelo de um tipo de tarefa — executar SQL, rodar um container, chamar uma API. Task é uma instância de operator dentro de um DAG. Task instance é a execução dessa task para um intervalo específico. E DAG run é a execução do DAG inteiro para um intervalo.\u003c/p>"},{"titleHtml":"🟢 P3. O que é um sensor?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É uma tarefa que espera uma condição externa — um arquivo existir, uma partição estar pronta, um job externo terminar — antes de liberar as tarefas seguintes.\u003c/p>\n\u003cp>O cuidado prático é que um sensor em modo poke ocupa um slot de worker o tempo inteiro da espera. Muitos sensores assim consomem todos os slots e travam o cluster esperando. Uso modo reschedule, que libera o worker entre verificações, ou deferrable operators, que registram a condição num processo assíncrono e liberam o worker completamente.\u003c/p>"},{"titleHtml":"🟢 P4. Como o Airflow lida com falha de uma tarefa?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Ele reexecuta conforme a política de retry configurada — número de tentativas e intervalo, tipicamente com backoff. Se esgotar as tentativas, a tarefa fica em estado de falha e as dependentes não rodam, a menos que tenham uma trigger rule diferente do padrão.\u003c/p>\n\u003cp>Isso só é seguro se a tarefa for idempotente. Retry automático sobre uma tarefa que faz \u003ccode>INSERT\u003c/code> sem deduplicação duplica dados a cada tentativa — e silenciosamente.\u003c/p>"},{"titleHtml":"🟡 P5. Explique o data interval. Por que um DAG diário roda depois do fim do dia?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O Airflow agenda por intervalo de dados, não por instante. Um DAG diário com intervalo do dia 13 é disparado à meia-noite do dia 14, porque o dia 13 só está completo depois que ele termina — e o pipeline processa o dia 13.\u003c/p>\n\u003cp>Isso importa para o código: a tarefa deve usar \u003ccode>data_interval_start\u003c/code> e \u003ccode>data_interval_end\u003c/code> como parâmetros para filtrar a origem e escolher a partição de escrita. Se ela usa \u003ccode>now()\u003c/code> internamente, deixa de ser reexecutável no passado, e um backfill passa a processar o dia de hoje em todas as execuções — que é o bug mais comum relacionado a esse conceito.\u003c/p>\n\u003cp>O nome antigo, \u003ccode>execution_date\u003c/code>, causou muita confusão porque parecia significar \"quando rodou\" quando na verdade era o início do período processado.\u003c/p>"},{"titleHtml":"🟡 P6. O que é catchup e quando desligar?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Catchup faz o Airflow executar todos os intervalos passados entre a \u003ccode>start_date\u003c/code> e agora quando um DAG é ativado ou despausado.\u003c/p>\n\u003cp>Desligo quando o histórico não faz sentido — um DAG que só precisa processar o presente, ou um cuja origem não tem dado antigo. E é uma armadilha conhecida: ativar um DAG com \u003ccode>start_date\u003c/code> há um ano dispara centenas de execuções simultâneas, que podem derrubar a origem ou estourar o custo.\u003c/p>\n\u003cp>Quando quero o histórico, mantenho o catchup ligado mas combino com \u003ccode>max_active_runs\u003c/code> para limitar a concorrência, e verifico se as execuções são independentes entre si — se houver estado acumulado, elas precisam rodar em ordem cronológica, não em paralelo.\u003c/p>"},{"titleHtml":"🟡 P7. O que é XCom e qual a limitação?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É o mecanismo de passar valores entre tarefas, armazenado no banco de metadados do Airflow.\u003c/p>\n\u003cp>A limitação é que ele serve para metadados pequenos — um caminho de arquivo, um ID de job, uma contagem. Passar dados de verdade incha o banco de metadados, que é o coração do Airflow, e degrada o scheduler para todo mundo.\u003c/p>\n\u003cp>O padrão correto é passar referências: a tarefa A escreve em storage e passa o caminho; a tarefa B lê de lá. Existem custom XCom backends que persistem em object storage transparentemente, o que ajuda, mas não muda o princípio de que o orquestrador não deve ser barramento de dados.\u003c/p>"},{"titleHtml":"🟡 P8. Quais são os executores e como escolher?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Sequential só para desenvolvimento. Local roda processos paralelos numa máquina e é suficiente para carga pequena e média. Celery distribui em workers de longa duração com uma fila de mensagens, e foi o padrão para escala. Kubernetes roda cada tarefa num pod próprio, dando isolamento total e dependências por tarefa, com escala elástica.\u003c/p>\n\u003cp>Escolho pelo perfil das tarefas. Kubernetes é ótimo quando as tarefas são pesadas, têm requisitos de recursos diferentes ou dependências conflitantes; o custo é a latência de inicialização do pod, que pesa se as tarefas forem muito curtas e frequentes. Celery tem latência menor porque os workers já estão de pé, mas exige que o ambiente seja comum a todas as tarefas.\u003c/p>\n\u003cp>Se a carga for mista, há configurações híbridas que roteiam tarefas curtas para Celery e pesadas para Kubernetes.\u003c/p>"},{"titleHtml":"🟡 P9. Como você garantiria que um DAG é idempotente?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Três coisas.\u003c/p>\n\u003cp>Primeiro, parametrizar tudo pelo data interval e nunca usar o relógio dentro da lógica — sem isso, backfill não funciona.\u003c/p>\n\u003cp>Segundo, escrita determinística: a tarefa sobrescreve a partição correspondente ao intervalo, ou faz MERGE por chave de negócio. Nunca \u003ccode>INSERT\u003c/code> puro, porque o retry automático duplicaria.\u003c/p>\n\u003cp>Terceiro, tarefas atômicas: cada uma faz uma coisa, de modo que reexecutar uma delas não exija desfazer o que outra fez.\u003c/p>\n\u003cp>E, para efeitos colaterais externos que não são idempotentes por natureza — enviar notificação, chamar API que cobra — mantenho uma tabela de controle do que já foi feito, ou uso a idempotency key do serviço de destino se ele suportar.\u003c/p>"},{"titleHtml":"🔴 P10. O scheduler do Airflow está lento e as tarefas demoram a ser agendadas. Como investiga?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Três frentes.\u003c/p>\n\u003cp>\u003cstrong>Tempo de parse dos DAGs.\u003c/strong> O scheduler reprocessa os arquivos de DAG periodicamente. Se algum tem código pesado no nível do módulo — uma consulta a banco, uma chamada de API, uma importação lenta — esse custo é pago repetidamente e atrasa tudo. Verifico as métricas de tempo de parse por arquivo e movo qualquer trabalho para dentro das tarefas. Também conto quantos arquivos de DAG existem: centenas de arquivos, especialmente com geração dinâmica, multiplicam o problema.\u003c/p>\n\u003cp>\u003cstrong>Banco de metadados.\u003c/strong> É o coração do Airflow e o gargalo mais comum. Verifico o tamanho das tabelas de task instance, log e XCom. Histórico não limpo e XComs grandes degradam todas as consultas do scheduler. Limpeza periódica de registros antigos é manutenção obrigatória e frequentemente esquecida.\u003c/p>\n\u003cp>\u003cstrong>Concorrência.\u003c/strong> Se as tarefas estão em fila e não executam, o limite efetivo é o menor entre paralelismo global, concorrência por DAG, concorrência por tarefa e o pool. Muita gente aumenta workers e não vê melhora porque o gargalo é um limite de configuração, não de capacidade. Verifico também se sensores em modo poke estão ocupando os slots — é a causa clássica de cluster travado com workers \"ocupados\" sem fazer nada.\u003c/p>\n\u003cp>E confirmaria se há mais de uma instância de scheduler, que é suportado e ajuda em escala, e se os recursos da máquina do scheduler são suficientes.\u003c/p>"},{"titleHtml":"🔴 P11. Como você estruturaria a orquestração de 200 pipelines com dependências entre si?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Não faria um DAG gigante nem 200 DAGs isolados acoplados por horário.\u003c/p>\n\u003cp>\u003cstrong>Dependências orientadas a dados.\u003c/strong> Cada pipeline declara os assets/datasets que produz e os que consome, e o disparo acontece quando as dependências são atualizadas. Isso elimina a fragilidade de \"roda às 7h porque o outro roda às 6h\" e dá o grafo de lineage de graça. É exatamente para isso que o asset-aware scheduling do Airflow 3 existe, e é o modelo nativo do Dagster.\u003c/p>\n\u003cp>\u003cstrong>Granularidade por domínio.\u003c/strong> DAGs por domínio de negócio ou por fonte, de tamanho compreensível — dezenas de tarefas, não centenas. Isso permite reprocessar uma parte sem tocar no resto e mantém o raio de explosão de uma falha pequeno.\u003c/p>\n\u003cp>\u003cstrong>Padronização por fábrica de DAGs.\u003c/strong> Com 200 pipelines, escrever cada um à mão gera divergência. Uma camada de geração a partir de configuração declarativa (YAML, ou uma função factory) garante que todos tenham retry, alerta, SLA, ownership e convenções de nomenclatura consistentes. O cuidado é que geração dinâmica de DAG pesa no parse, então a configuração precisa ser barata de ler.\u003c/p>\n\u003cp>\u003cstrong>Isolamento de recursos.\u003c/strong> Pools por sistema de origem, para que um backfill não derrube o banco que outros dez pipelines usam. Prioridades para o que é crítico.\u003c/p>\n\u003cp>\u003cstrong>Ownership e SLA por pipeline.\u003c/strong> Com 200 pipelines, \"o time de dados\" não é dono útil — cada um precisa de um responsável nomeado e de um SLA declarado, senão nada é priorizado quando várias coisas quebram ao mesmo tempo.\u003c/p>\n\u003cp>\u003cstrong>Observabilidade agregada.\u003c/strong> Um painel que responde \"o que está atrasado e quem depende disso\", não 200 DAGs para olhar um a um. Alerta por SLA violado, não só por falha.\u003c/p>"},{"titleHtml":"🔴 P12. Um DAG precisa processar arquivos que chegam em horários imprevisíveis. Como você desenharia?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Evitaria a solução ingênua de um sensor em modo poke esperando indefinidamente, que ocupa um slot de worker por toda a espera e não escala.\u003c/p>\n\u003cp>A melhor opção é \u003cstrong>disparo por evento\u003c/strong>: a chegada do arquivo gera uma notificação — evento de object storage, mensagem numa fila — que dispara o DAG. Assim não há espera nenhuma, e a latência é mínima. O Airflow 3 traz watchers para fontes externas, e é possível disparar por API a partir de uma função serverless que reage ao evento de storage.\u003c/p>\n\u003cp>Se o disparo por evento não estiver disponível, uso \u003cstrong>deferrable operators\u003c/strong>: a tarefa registra a condição e libera o worker; um processo triggerer assíncrono monitora milhares de condições com pouco recurso e retoma a tarefa quando ela é satisfeita. Se nem isso, sensor em modo reschedule, que ao menos libera o worker entre verificações.\u003c/p>\n\u003cp>Em qualquer caso, três cuidados: \u003cstrong>timeout com alerta\u003c/strong>, para que \"o arquivo nunca chegou\" seja um incidente visível e não uma espera silenciosa; \u003cstrong>idempotência\u003c/strong>, porque eventos de storage podem ser entregues mais de uma vez e o mesmo arquivo pode disparar duas execuções; e \u003cstrong>tratamento de chegada parcial\u003c/strong>, verificando se o arquivo está completo antes de processar — um arquivo grande pode gerar evento antes do upload terminar, dependendo do mecanismo, e a proteção usual é usar um marcador de conclusão ou verificar tamanho estável.\u003c/p>\n\u003cp>Se houver muitos arquivos pequenos chegando continuamente, eu consideraria agrupar em micro-batches por janela em vez de uma execução por arquivo, para não gerar milhares de DAG runs e small files.\u003c/p>"},{"titleHtml":"🔴 P13. Airflow ou Dagster? Como você decidiria?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> A diferença conceitual é o que orquestrar significa em cada um. O Airflow foi construído em torno de \u003cstrong>tarefas\u003c/strong>: você declara o que executar e em que ordem. O Dagster foi construído em torno de \u003cstrong>assets\u003c/strong>: você declara os dados que devem existir e como são produzidos, e o framework deriva a execução, o lineage e a materialização.\u003c/p>\n\u003cp>O modelo de assets tende a ser melhor para plataformas de dados, porque a pergunta operacional real quase nunca é \"essa tarefa rodou?\" e sim \"essa tabela está atualizada e correta?\". Dagster também nasceu com melhor testabilidade, tipagem entre etapas e ambientes de desenvolvimento.\u003c/p>\n\u003cp>A favor do Airflow: é o padrão de fato, com o maior ecossistema de integrações, a maior base de conhecimento e o maior mercado de profissionais — o que importa para contratar e para resolver problemas. E o Airflow 3 fechou boa parte da distância conceitual com asset-aware scheduling, versionamento de DAG e backfills gerenciados pelo scheduler.\u003c/p>\n\u003cp>Na prática eu decidiria pelo contexto: se a empresa já tem Airflow rodando bem, migrar 200 pipelines raramente se paga — o custo de migração e de reaprendizado é alto e o ganho é incremental. Para uma plataforma nova, com time pequeno e ênfase em qualidade e lineage, Dagster é uma escolha defensável. O erro seria tratar isso como questão de preferência técnica: é uma decisão de custo de migração, de contratação e de maturidade do time.\u003c/p>\n\u003cp>E acrescentaria que dbt não entra nessa comparação — ele transforma dentro do warehouse e é orquestrado por um dos dois, não uma alternativa a eles.\u003c/p>"},{"titleHtml":"🔴 P14. Como você testaria DAGs e pipelines de dados antes de ir para produção?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Em camadas, porque cada uma pega um tipo diferente de problema.\u003c/p>\n\u003cp>\u003cstrong>Testes estruturais do DAG\u003c/strong>, rodando em CI a cada commit: o arquivo é parseável, não há ciclos, todas as tarefas têm dono e retry configurados, os IDs seguem a convenção, não há importação pesada no nível do módulo. São baratos e pegam a maior parte dos erros bobos.\u003c/p>\n\u003cp>\u003cstrong>Testes unitários da lógica de transformação\u003c/strong>, com dados fabricados pequenos cobrindo casos de borda — NULL, duplicata, valor fora de domínio. Isso exige que a lógica esteja em funções separadas do operator, o que é uma boa prática por si só.\u003c/p>\n\u003cp>\u003cstrong>Testes de integração em ambiente de staging\u003c/strong>, com dado representativo — anonimizado se houver PII, e amostrado de forma a preservar casos raros, porque amostra aleatória perde justamente o que quebra.\u003c/p>\n\u003cp>\u003
