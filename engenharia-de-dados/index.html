strong>Cardinalidade adequada à granularidade\u003c/strong>: cardinalidade baixa demais mata o paralelismo; alta demais gera milhões de partições minúsculas, com overhead de metadados e o problema de small files. Miro partições de centenas de MB a poucos GB, e milhares de partições, não milhões.\u003c/p>\n\u003cp>Quando os critérios conflitam, uso particionamento composto: range por tempo para pruning, hash de uma chave de alta cardinalidade dentro do período para uniformidade. E, se o engine suportar, prefiro clustering/z-ordering para a segunda dimensão em vez de aninhar mais um nível de partição física.\u003c/p>\n\u003cp>Uma coisa que eu verificaria antes de decidir é o padrão real de consulta nos logs, não o que as pessoas dizem que consultam. E lembraria que essa decisão é cara de reverter — embora formatos como Iceberg permitam partition evolution sem reescrever o histórico, o que reduz o risco.\u003c/p>"},{"titleHtml":"🟡 P8. O que é quórum e por que clusters de consenso têm número ímpar de nós?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Quórum é o número mínimo de nós que precisa concordar para uma decisão valer, tipicamente a maioria. Com N nós, a maioria é ⌊N/2⌋+1, e você tolera a falha de ⌊(N−1)/2⌋.\u003c/p>\n\u003cp>Número ímpar porque, com 3 nós, a maioria é 2 e você tolera 1 falha; com 4 nós, a maioria é 3 e você continua tolerando só 1. O quarto nó não aumenta a tolerância, apenas o custo de coordenação e a chance de haver alguma falha. Então 3, 5 e 7 são as configurações racionais.\u003c/p>\n\u003cp>A maioria também é o que impede split-brain: dois lados de uma partição não podem ambos ter maioria, então no máximo um lado continua operando.\u003c/p>"},{"titleHtml":"🟡 P9. Qual a diferença entre replicação síncrona e assíncrona?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Síncrona confirma a escrita ao cliente só depois que a réplica confirmou. Garante que nada confirmado se perde numa falha do líder, ao custo de a latência de escrita incluir a réplica — e se a réplica ficar indisponível, as escritas travam.\u003c/p>\n\u003cp>Assíncrona confirma imediatamente e propaga depois. Latência baixa e o líder não depende da saúde das réplicas, mas existe uma janela em que dados já confirmados ao cliente ainda não chegaram — se o líder morrer nela, esses dados se perdem.\u003c/p>\n\u003cp>O meio-termo comum é semi-síncrona: síncrona para uma réplica e assíncrona para as demais, garantindo durabilidade em duas cópias sem esperar todas.\u003c/p>\n\u003cp>O efeito colateral prático da assíncrona é replication lag: ler de uma réplica logo após escrever no líder pode devolver o valor antigo. É por isso que garantias de sessão como read-your-writes existem — elas resolvem a percepção de bug do usuário sem exigir consistência forte global.\u003c/p>"},{"titleHtml":"🔴 P10. Um job Spark tem 200 tarefas; 199 terminam em 30 segundos e uma leva 40 minutos e estoura memória. Diagnóstico e solução.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O padrão é inequívoco: skew numa chave. A tarefa lenta recebeu uma fração enorme dos dados. Nem execução especulativa nem aumentar memória resolvem a causa — especulação dispararia uma cópia que recebe os mesmos dados e demora igual, e mais memória só adia o estouro.\u003c/p>\n\u003cp>Investigação: olho os bytes lidos pela tarefa lenta versus a mediana — se a razão é de duas ordens de grandeza, está confirmado. Depois identifico a chave, com um \u003ccode>GROUP BY\u003c/code> na chave de shuffle ordenado por contagem. Na esmagadora maioria das vezes, o culpado é NULL ou um valor sentinela.\u003c/p>\n\u003cp>Solução em ordem: se for NULL ou sentinela sem significado semântico, filtro ou substituo por uma chave aleatória antes do join — resolve na hora e é gratuito. Se for uma chave de negócio legítima e o outro lado for pequeno, forço broadcast join e elimino o shuffle. Se o AQE estiver desligado, ligo — o skew join adaptativo divide a partição grande automaticamente e é a solução de menor esforço.\u003c/p>\n\u003cp>Se a chave é legítima e nenhum lado é pequeno, aplico salting: replico o lado menor N vezes com sufixos e adiciono sufixo aleatório do lado grande, o que espalha a chave quente por N tarefas. Escolho N pela razão entre a chave quente e a mediana.\u003c/p>\n\u003cp>E aproveitaria para verificar se o skew é sintoma de um problema de modelagem — uma entidade \"catch-all\" concentrando 40% das transações costuma indicar que a modelagem está misturando casos que deveriam ser separados.\u003c/p>"},{"titleHtml":"🔴 P11. Você precisa fazer join entre uma tabela de 5 TB e outra de 200 GB. Como o engine faz isso e o que você pode otimizar?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Nenhuma das duas cabe em memória de um executor, então broadcast está fora por padrão e o engine vai escolher entre sort-merge join e shuffle hash join. Em ambos os casos, os dois lados são shuffleados pela chave de join, o que significa mover 5,2 TB pela rede — é aí que o custo está.\u003c/p>\n\u003cp>O que eu tentaria, em ordem de impacto:\u003c/p>\n\u003cp>\u003cstrong>Reduzir o que se move.\u003c/strong> Filtrar e projetar antes do join: se a consulta só usa 6 das 80 colunas e filtra 90% das linhas por data, aplicar isso antes reduz o volume drasticamente. Verificar se predicate pushdown e partition pruning estão realmente acontecendo no plano — frequentemente não estão, por causa de uma função aplicada na coluna de partição ou por incompatibilidade de tipo.\u003c/p>\n\u003cp>\u003cstrong>Reduzir o lado pequeno até caber em broadcast.\u003c/strong> 200 GB não cabe, mas 200 GB \u003cem>depois de filtrar e projetar\u003c/em> pode virar 2 GB. Essa é a otimização com maior retorno e a mais frequentemente esquecida.\u003c/p>\n\u003cp>\u003cstrong>Dynamic partition pruning.\u003c/strong> Se a tabela grande é particionada por uma coluna e o join com a menor restringe os valores dessa coluna, engines modernas conseguem podar partições da tabela grande em runtime, com base no resultado do lado menor. Isso pode eliminar a maior parte do I/O.\u003c/p>\n\u003cp>\u003cstrong>Bucketing / co-particionamento.\u003c/strong> Se esse join é recorrente, escrever as duas tabelas particionadas fisicamente pela chave de join com o mesmo número de buckets elimina o shuffle permanentemente. Custa reescrever as tabelas uma vez e disciplina para manter, e só compensa se o padrão for estável.\u003c/p>\n\u003cp>\u003cstrong>Verificar skew na chave de join\u003c/strong>, pelas razões da pergunta anterior.\u003c/p>\n\u003cp>E antes de tudo isso, eu questionaria se o join precisa ser nesse grão — frequentemente pré-agregar um dos lados antes do join reduz o problema em uma ordem de grandeza e é semanticamente equivalente.\u003c/p>"},{"titleHtml":"🔴 P12. Explique por que \"eventual consistency\" muitas vezes não é suficiente, e o que você usaria no lugar.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Consistência eventual afirma que, sem novas escritas, as réplicas convergem. O problema é o que ela \u003cstrong>não\u003c/strong> afirma: não diz em quanto tempo, nem o que você observa nesse meio-tempo. Na prática isso permite anomalias que usuários percebem como bug: ler o valor antigo logo depois de escrever; ver um valor, recarregar e ver outro mais antigo (leituras não monotônicas); ou ver uma resposta antes da pergunta que a originou (violação de causalidade).\u003c/p>\n\u003cp>Antes de saltar para consistência forte, que é cara, eu escalonaria:\u003c/p>\n\u003cp>\u003cstrong>Read-your-writes\u003c/strong> resolve a maior parte da percepção de bug: garanta que a sessão que escreveu sempre veja sua própria escrita, lendo do líder por um período ou rastreando a posição no log. Barato e de altíssimo retorno.\u003c/p>\n\u003cp>\u003cstrong>Leituras monotônicas\u003c/strong> garantem que você nunca vê o tempo andar para trás — normalmente fixando a sessão numa réplica.\u003c/p>\n\u003cp>\u003cstrong>Consistência causal\u003c/strong> garante que operações causalmente relacionadas apareçam na ordem certa para todos, permitindo divergência apenas entre operações genuinamente concorrentes. É um ponto de equilíbrio muito bom.\u003c/p>\n\u003cp>\u003cstrong>Linearizabilidade\u003c/strong> só onde há invariante de negócio que não pode ser violada: saldo que não pode ficar negativo, unicidade de um identificador, reserva de estoque limitado.\u003c/p>\n\u003cp>Em contexto analítico, a garantia que importa normalmente não é nenhuma dessas: é \u003cstrong>snapshot isolation\u003c/strong> — cada consulta enxerga um estado consistente da tabela num ponto no tempo, mesmo com escritas concorrentes. É o que formatos de tabela transacionais oferecem, e é suficiente, porque o problema em analytics não é ler valor antigo, é ler uma mistura de estados no meio de uma escrita.\u003c/p>"},{"titleHtml":"🔴 P13. Como funciona a tolerância a falhas no Spark, e qual a diferença entre lineage e checkpoint?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O Spark rastreia a \u003cstrong>linhagem\u003c/strong> de cada dataset: a sequência de transformações determinísticas que o produziu a partir de dados de entrada. Se uma partição se perde porque um executor morreu, ele recomputa apenas aquela partição reaplicando a linhagem. Isso é elegante porque não exige replicar dados intermediários.\u003c/p>\n\u003cp>O problema é que linhagem longa fica cara: se a cadeia tem 30 estágios e você perde uma partição no final, recomputar significa refazer muito trabalho — e em pipelines iterativos, a linhagem cresce sem limite.\u003c/p>\n\u003cp>\u003cstrong>Checkpoint\u003c/strong> trunca a linhagem: persiste o resultado num storage confiável e passa a tratá-lo como fonte, descartando o histórico de transformações. Custa I/O, então você paga adiantado para evitar recomputação cara depois. Uso quando a linhagem é longa, quando o dataset é reutilizado várias vezes, ou em jobs de streaming, onde checkpoint tem também o papel de guardar offsets e estado.\u003c/p>\n\u003cp>\u003ccode>cache\u003c/code>/\u003ccode>persist\u003c/code> é diferente e frequentemente confundido: guarda o dataset em memória ou disco local do executor para reutilização, mas \u003cstrong>mantém\u003c/strong> a linhagem, porque o cache pode ser perdido junto com o executor. Cache é otimização de performance; checkpoint é garantia de recuperação.\u003c/p>\n\u003cp>Vale acrescentar que tudo isso só funciona porque as transformações são determinísticas e sem efeito colateral. Se o código faz chamada externa ou usa aleatoriedade sem semente fixa, a recomputação pode produzir resultado diferente — e o modelo de recuperação silenciosamente deixa de ser correto.\u003c/p>"},{"titleHtml":"🔴 P14. O que é execução especulativa e quando ela não ajuda?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É o framework detectar uma tarefa anormalmente lenta em relação às outras do mesmo estágio e disparar uma cópia dela em outro nó, usando o resultado do que terminar primeiro e cancelando o outro. Existe para mitigar stragglers, que são um problema real em clusters grandes: como o estágio só termina quando a última tarefa termina, um nó degradado atrasa tudo.\u003c/p>\n\u003cp>Ela ajuda quando a lentidão é \u003cstrong>do nó\u003c/strong>: disco falhando, contenção de recursos com outro job, rede degradada, nó com hardware mais fraco. A cópia roda num nó saudável e termina rápido.\u003c/p>\n\u003cp>Não ajuda — e piora — quando a lentidão é \u003cstrong>dos dados\u003c/strong>. No caso de skew, a cópia recebe exatamente a mesma partição gigante e demora o mesmo tempo, e agora você está consumindo o dobro de recursos para o mesmo resultado. Também não ajuda se a tarefa é lenta por um gargalo compartilhado, como um sink externo com rate limit — a cópia disputa o mesmo gargalo.\u003c/p>\n\u003cp>E há um risco importante: especulação \u003cstrong>duplica execução\u003c/strong>. Se a tarefa tiver efeito colateral não idempotente, como escrever direto num sistema externo, você pode gerar escrita duplicada. É por isso que frameworks usam commit protocols com escrita em local temporário e rename atômico — e por isso sinks customizados precisam ser desenhados com isso em mente.\u003c/p>"},{"titleHtml":"🔴 P15. Um sistema precisa aceitar escritas em duas regiões geográficas, com baixa latência em ambas. Quais são as implicações?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Aceitar escrita em duas regiões com baixa latência local significa que você não pode coordenar sincronamente entre elas — a velocidade da luz impõe dezenas ou centenas de milissegundos de ida e volta, e coordenar em cada escrita mataria a latência. Isso te coloca em multi-leader ou leaderless, e a consequência inevitável é \u003cstrong>conflito de escrita\u003c/strong>.\u003c/p>\n\u003cp>As opções para resolver conflito, e nenhuma é gratuita:\u003c/p>\n\u003cp>\u003cstrong>Last-write-wins por timestamp\u003c/strong>: simples, mas perde dados silenciosamente e depende de relógios sincronizados, o que é uma premissa frágil. Aceitável para dados onde a última versão é a única que importa e a perda é tolerável.\u003c/p>\n\u003cp>\u003cstrong>CRDTs\u003c/strong> (tipos de dados que convergem por construção — contadores, sets, mapas): resolvem conflitos deterministicamente sem coordenação, mas restringem quais operações você pode expressar. Excelentes onde se aplicam.\u003c/p>\n\u003cp>\u003cstrong>Resolução no domínio da aplicação\u003c/strong>: guardar as versões conflitantes e deixar a lógica de negócio ou o usuário decidir. É o mais correto e o mais trabalhoso.\u003c/p>\n\u003cp>\u003cstrong>Particionar por região\u003c/strong> para evitar o conflito na origem: cada entidade tem uma região \"dona\" que aceita suas escritas, e as demais regiões leem replicado. Isso elimina conflitos por construção e frequentemente é a resposta certa — a maioria dos negócios tem afinidade geográfica natural, e usuários raramente escrevem de duas regiões ao mesmo tempo.\u003c/p>\n\u003cp>Eu começaria por essa última e só iria para resolução de conflito no que genuinamente precisa de escrita global. E onde houver invariante forte — estoque limitado, unicidade, saldo — aceitaria pagar a coordenação cross-region, porque nesses casos a consistência não é negociável e o custo de latência é o preço correto. Isso é PACELC na prática: escolhi latência sobre consistência para a maior parte, e o oposto para o núcleo transacional.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Em processamento distribuído, qual é o \u003cstrong>custo dominante\u003c/strong>?","a":["A computação nas CPUs","Mover dados pela rede — praticamente toda otimização de engine distribuída se resume a evitar movimentação","O armazenamento em disco","A serialização de logs"],"c":1,"e":"Rede é ordens de grandeza mais lenta que memória. Essa frase responde metade das perguntas do tópico: broadcast join, bucketing, predicate pushdown e pré-agregação existem para mover menos."},{"n":"🟢","levelName":"basico","q":"Quais operações \u003cstrong>disparam shuffle\u003c/strong>?","a":["map, filter e select","GROUP BY, JOIN (exceto broadcast), DISTINCT, ORDER BY global e repartition — tudo que exige reunir registros da mesma chave no mesmo lugar","Apenas escrita em disco","Somente operações em janelas temporais"],"c":1,"e":"E o shuffle é caro por quatro razões: rede, I/O de disco nos dois lados, serialização (CPU) e a barreira de sincronização — o estágio seguinte só começa quando o shuffle inteiro termina."},{"n":"🟡","levelName":"intermediario","q":"Job com 200 tarefas: 199 terminam em 30s e uma leva 40 minutos. Qual a causa provável e a primeira coisa a verificar?","a":["Cluster subdimensionado; adicionar executores","Data skew numa chave; verificar bytes lidos da tarefa lenta versus a mediana e procurar NULLs ou valores sentinela na chave de join, que são a causa mais comum","Rede degradada; trocar de zona de disponibilidade","GC excessivo; aumentar a memória"],"c":1,"e":"Mais recursos não resolvem skew — a tarefa gargalo continua igual, você só paga mais. NULLs e sentinelas (-1, UNKNOWN) concentrados são a causa mais frequente e a mais barata de corrigir (filtrar antes)."},{"n":"🟡","levelName":"intermediario","q":"O que é \u003cstrong>salting\u003c/strong> e quando usar?","a":["Adicionar criptografia à chave de particionamento","Adicionar sufixo aleatório à chave concentrada (e replicar o lado pequeno N vezes com todos os sufixos), quebrando a chave quente em N partições — quando AQE, broadcast e filtro não resolvem","Reduzir o número de partições para equilibrar","Ordenar os dados antes do shuffle"],"c":1,"e":"O custo: o lado replicado cresce N vezes e a lógica complica. Antes dele, tente na ordem: AQE (skew join automático, ligado por padrão no Spark ≥ 3.2), broadcast join e filtrar NULLs/sentinelas."},{"n":"🟡","levelName":"intermediario","q":"Qual é o erro na formulação popular do \u003cstrong>teorema CAP\u003c/strong> (escolha 2 de 3)?","a":["Não há erro — é exatamente assim","Partição de rede não é escolha, é fato: a escolha real entre consistência e disponibilidade só existe durante uma partição — e é por operação, não por sistema","O teorema tem 4 propriedades, não 3","CAP só se aplica a bancos relacionais"],"c":1,"e":"Um sistema que se diz CA só escolheu se comportar mal quando a partição acontecer. E o C de CAP é linearizabilidade, não o C de ACID. PACELC completa: sem partição, o trade-off diário é latência × consistência."},{"n":"🟡","levelName":"intermediario","q":"Por que clusters de consenso têm número \u003cstrong>ímpar\u003c/strong> de nós?","a":["Por convenção histórica dos fabricantes","Porque a tolerância é ⌊(N−1)/2⌋: 3 nós toleram 1 falha e 4 nós também toleram só 1 — o quarto nó não adiciona tolerância, só custo de coordenação","Porque números pares causam split-brain inevitável","Para facilitar o balanceamento de carga"],"c":1,"e":"Quórum = maioria = ⌊N/2⌋+1. A maioria também impede split-brain: dois lados de uma partição não podem ambos ter maioria. Configurações racionais: 3, 5, 7."},{"n":"🟡","levelName":"intermediario","q":"Qual garantia resolve o clássico \u003cem>editei meu perfil, recarreguei e voltou o antigo\u003c/em>, sem pagar consistência forte global?","a":["Linearizabilidade em todas as operações","Read-your-writes: a sessão que escreveu sempre vê a própria escrita (lendo do líder por um período ou rastreando a posição do log) — barata e de altíssimo retorno","Consistência eventual com timeout maior","Replicação síncrona para todas as réplicas"],"c":1,"e":"É a garantia mais subestimada. Em analytics, a garantia certa costuma ser outra: snapshot isolation — cada consulta vê um estado consistente da tabela, sem misturar estados no meio de uma escrita."},{"n":"🔴","levelName":"avancado","q":"Quando a \u003cstrong>execução especulativa\u003c/strong> NÃO ajuda contra uma tarefa lenta?","a":["Quando o nó tem disco degradado","Quando a causa é skew (a cópia recebe os mesmos dados e demora igual) ou um gargalo compartilhado como sink com rate limit — e ela ainda duplica execução, perigoso com efeitos colaterais não idempotentes","Quando o cluster tem nós heterogêneos","Quando a tarefa é curta demais"],"c":1,"e":"Especulação resolve straggler causado pelo nó (contenção, hardware); não resolve lentidão causada pelos dados. Distinguir os dois casos é exatamente o que a pergunta de entrevista testa."}]},{"id":"06","fullTitle":"06 — SQL Conceitual para Entrevista","shortTitle":"SQL Conceitual para Entrevista","subtitle":"Window functions · Tipos de join e seus custos · Ordem lógica de execução · Planos de execução · Índices · NULLs · Otimização de query","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-ordem-lógica-de-execução-a-base-de-metade-das-perguntas\">1.1 Ordem lógica de execução — a base de metade das perguntas\u003c/h3>\n\u003cp>SQL é declarativo: você escreve na ordem \u003ccode>SELECT ... FROM ... WHERE ...\u003c/code>, mas o banco avalia numa ordem diferente. A \u003cstrong>ordem lógica\u003c/strong> é:\u003c/p>\n\u003col>\u003cli>\u003ccode>FROM\u003c/code> / \u003ccode>JOIN\u003c/code> — monta o conjunto de linhas\u003c/li>\u003cli>\u003ccode>WHERE\u003c/code> — filtra linhas individuais\u003c/li>\u003cli>\u003ccode>GROUP BY\u003c/code> — agrupa\u003c/li>\u003cli>\u003ccode>HAVING\u003c/code> — filtra grupos\u003c/li>\u003cli>\u003ccode>SELECT\u003c/code> — projeta colunas e avalia expressões\u003c/li>\u003cli>\u003ccode>DISTINCT\u003c/code>\u003c/li>\u003cli>\u003ccode>ORDER BY\u003c/code>\u003c/li>\u003cli>\u003ccode>LIMIT\u003c/code> / \u003ccode>OFFSET\u003c/code>\u003c/li>\u003c/ol>\n\u003cp>Window functions são avaliadas \u003cstrong>depois\u003c/strong> do \u003ccode>GROUP BY\u003c/code>/\u003ccode>HAVING\u003c/code> e junto com o \u003ccode>SELECT\u003c/code>, antes do \u003ccode>DISTINCT\u003c/code> e do \u003ccode>ORDER BY\u003c/code>.\u003c/p>\n\u003cp>Essa ordem explica um conjunto grande de comportamentos que confundem gente:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Por que não dá para usar um alias do \u003ccode>SELECT\u003c/code> no \u003ccode>WHERE\u003c/code>?\u003c/strong> Porque o \u003ccode>WHERE\u003c/code> é avaliado antes do \u003ccode>SELECT\u003c/code> — o alias ainda não existe. (Alguns bancos permitem no \u003ccode>GROUP BY\u003c/code> e no \u003ccode>ORDER BY\u003c/code>, que vêm depois.)\u003c/li>\u003cli>\u003cstrong>Por que \u003ccode>WHERE\u003c/code> não aceita função de agregação?\u003c/strong> Porque a agregação só acontece no \u003ccode>GROUP BY\u003c/code>. Para filtrar por agregado, use \u003ccode>HAVING\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Por que não dá para filtrar por window function no \u003ccode>WHERE\u003c/code>?\u003c/strong> Porque ela é avaliada depois. A solução é envolver em subquery ou CTE e filtrar no nível externo — é a pergunta de \"top N por grupo\", uma das mais comuns que existem.\u003c/li>\u003cli>\u003cstrong>\u003ccode>WHERE\u003c/code> vs \u003ccode>HAVING\u003c/code>:\u003c/strong> \u003ccode>WHERE\u003c/code> filtra linhas antes de agrupar (mais eficiente, reduz o volume que entra na agregação); \u003ccode>HAVING\u003c/code> filtra grupos depois. Filtrar no \u003ccode>WHERE\u003c/code> quando possível é uma otimização real.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Cuidado:\u003c/strong> ordem \u003cem>lógica\u003c/em> não é ordem \u003cem>física\u003c/em>. O otimizador pode reordenar tudo desde que o resultado seja equivalente — inclusive empurrar filtros para dentro de joins e para o storage. A ordem lógica define a \u003cstrong>semântica\u003c/strong>; o plano define a \u003cstrong>execução\u003c/strong>.\u003c/p>\n\u003ch3 id=\"h-1-2-joins-e-seus-custos\">1.2 Joins e seus custos\u003c/h3>\n\u003cp>\u003cstrong>Tipos lógicos:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ccode>INNER\u003c/code>: só as linhas com correspondência dos dois lados.\u003c/li>\u003cli>\u003ccode>LEFT\u003c/code> / \u003ccode>RIGHT OUTER\u003c/code>: todas as linhas de um lado, NULL no outro quando não há par.\u003c/li>\u003cli>\u003ccode>FULL OUTER\u003c/code>: todas de ambos os lados.\u003c/li>\u003cli>\u003ccode>CROSS\u003c/code>: produto cartesiano.\u003c/li>\u003cli>\u003ccode>SEMI\u003c/code> (\u003ccode>EXISTS\u003c/code>, \u003ccode>IN\u003c/code>): linhas da esquerda que \u003cstrong>têm\u003c/strong> correspondência, sem duplicar e sem trazer colunas da direita.\u003c/li>\u003cli>\u003ccode>ANTI\u003c/code> (\u003ccode>NOT EXISTS\u003c/code>): linhas da esquerda que \u003cstrong>não têm\u003c/strong> correspondência.\u003c/li>\u003c/ul>\n\u003cp>Semi e anti join são o conceito mais subestimado dessa lista. Se você só precisa saber \"existe correspondência?\", um semi join é muito mais barato que um inner join seguido de \u003ccode>DISTINCT\u003c/code>, porque o engine para na primeira correspondência encontrada e não materializa duplicatas.\u003c/p>\n\u003cp>\u003cstrong>Algoritmos físicos\u003c/strong> — é isso que o entrevistador quer ouvir quando pergunta \"qual o custo de um join\":\u003c/p>\n\u003cp>\u003cstrong>Nested Loop Join.\u003c/strong> Para cada linha da tabela externa, procura correspondências na interna. Custo O(N×M) na forma ingênua, mas \u003cstrong>O(N × log M)\u003c/strong> se houver índice na chave de junção da tabela interna. É excelente quando a tabela externa é muito pequena e a interna tem índice; péssimo quando ambas são grandes sem índice.\u003c/p>\n\u003cp>\u003cstrong>Hash Join.\u003c/strong> Constrói uma tabela hash com o lado menor (build side) e varre o lado maior (probe side), consultando o hash. Custo aproximadamente O(N+M). É o algoritmo dominante em analytics. Requer que o build side caiba em memória — se não couber, o engine faz \u003cem>spill\u003c/em> para disco e particiona recursivamente, o que degrada bastante. Só funciona para condições de igualdade.\u003c/p>\n\u003cp>\u003cstrong>Sort-Merge Join.\u003c/strong> Ordena os dois lados pela chave e percorre em paralelo. Custo O(N log N + M log M), ou apenas O(N+M) se os dados já estiverem ordenados ou co-particionados. É o preferido quando os lados são grandes e comparáveis em tamanho, quando já há ordenação disponível, e é o único dos três que lida naturalmente com condições de desigualdade em alguns engines.\u003c/p>\n\u003cp>\u003cstrong>Broadcast (Map-side) Join\u003c/strong> — em engines distribuídas. Se um lado é pequeno, envia uma cópia dele para todos os nós e faz o join localmente, eliminando o shuffle. É a otimização de maior impacto em Spark e similares. O limite é a memória: o lado transmitido é replicado em cada executor.\u003c/p>\n\u003cp>\u003cstrong>O que determina a escolha:\u003c/strong> tamanho relativo das tabelas, existência de índices, cardinalidade estimada, seletividade dos filtros, e se os dados já estão ordenados ou particionados pela chave. O otimizador decide com base em \u003cstrong>estatísticas\u003c/strong> — e é por isso que estatísticas desatualizadas produzem planos catastróficos.\u003c/p>\n\u003cp>\u003cstrong>Ordem de join importa muito.\u003c/strong> Com N tabelas há um número fatorial de ordens possíveis. Juntar primeiro as tabelas que mais reduzem o volume mantém os resultados intermediários pequenos. Otimizadores tentam encontrar a melhor ordem, mas com muitas tabelas eles limitam a busca por custo de planejamento — e com estimativas ruins, erram feio.\u003c/p>\n\u003ch3 id=\"h-1-3-window-functions\">1.3 Window functions\u003c/h3>\n\u003cp>Uma window function computa um valor para cada linha considerando um \u003cstrong>conjunto de linhas relacionadas\u003c/strong>, sem colapsar as linhas como faz \u003ccode>GROUP BY\u003c/code>. Essa é a diferença essencial: agregação reduz N linhas a 1; window preserva as N linhas e adiciona a informação agregada a cada uma.\u003c/p>\n\u003cp>Anatomia:\u003c/p>\n\u003cpre>\u003ccode>FUNÇÃO() OVER (\n  PARTITION BY &lt;divide em grupos independentes&gt;\n  ORDER BY     &lt;define a ordem dentro do grupo&gt;\n  &lt;frame&gt;      &lt;define quais linhas do grupo entram no cálculo&gt;\n)\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Categorias:\u003c/strong>\u003c/p>\n\u003cp>\u003cem>Ranking:\u003c/em> \u003ccode>ROW_NUMBER()\u003c/code> (sempre único, sem empate), \u003ccode>RANK()\u003c/code> (empates recebem o mesmo valor e o próximo pula — 1,1,3), \u003ccode>DENSE_RANK()\u003c/code> (empates recebem o mesmo valor e não pula — 1,1,2), \u003ccode>NTILE(n)\u003c/code> (divide em n baldes), \u003ccode>PERCENT_RANK()\u003c/code>, \u003ccode>CUME_DIST()\u003c/code>.\u003c/p>\n\u003cp>A diferença entre \u003ccode>RANK\u003c/code> e \u003ccode>DENSE_RANK\u003c/code> é uma pergunta de entrevista clássica, e a resposta completa inclui \u003cstrong>quando usar cada uma\u003c/strong>: \u003ccode>ROW_NUMBER\u003c/code> para deduplicar (escolher uma linha por grupo), \u003ccode>RANK\u003c/code> quando lacunas na numeração são semanticamente corretas (posição em competição), \u003ccode>DENSE_RANK\u003c/code> quando você quer \"os 3 maiores valores distintos\" e não \"as 3 primeiras linhas\".\u003c/p>\n\u003cp>\u003cem>Offset:\u003c/em> \u003ccode>LAG(col, n)\u003c/code> e \u003ccode>LEAD(col, n)\u003c/code> acessam linhas anteriores/posteriores — a base de qualquer cálculo de variação período a período. \u003ccode>FIRST_VALUE\u003c/code>, \u003ccode>LAST_VALUE\u003c/code>, \u003ccode>NTH_VALUE\u003c/code>.\u003c/p>\n\u003cp>\u003cem>Agregação como window:\u003c/em> \u003ccode>SUM\u003c/code>, \u003ccode>AVG\u003c/code>, \u003ccode>COUNT\u003c/code>, \u003ccode>MIN\u003c/code>, \u003ccode>MAX\u003c/code> com \u003ccode>OVER\u003c/code> — dão totais acumulados, médias móveis e percentual sobre o total do grupo.\u003c/p>\n\u003cp>\u003cstrong>Frames — o detalhe que separa quem sabe de quem decorou.\u003c/strong>\u003c/p>\n\u003cp>O frame define quais linhas dentro da partição entram no cálculo:\u003c/p>\n\u003cul>\u003cli>\u003ccode>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\u003c/code> — do início até a linha atual (acumulado).\u003c/li>\u003cli>\u003ccode>ROWS BETWEEN 6 PRECEDING AND CURRENT ROW\u003c/code> — janela móvel de 7 linhas.\u003c/li>\u003cli>\u003ccode>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\u003c/code> — a partição inteira.\u003c/li>\u003cli>\u003ccode>RANGE\u003c/code> em vez de \u003ccode>ROWS\u003c/code> opera sobre \u003cstrong>valores\u003c/strong> da coluna de ordenação, não sobre contagem de linhas — o que muda o resultado quando há empates.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>A pegadinha mais famosa:\u003c/strong> quando você usa \u003ccode>ORDER BY\u003c/code> dentro do \u003ccode>OVER\u003c/code> sem especificar frame, o padrão é \u003ccode>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\u003c/code>. Isso significa que \u003ccode>SUM(x) OVER (PARTITION BY g ORDER BY d)\u003c/code> dá um \u003cstrong>acumulado\u003c/strong>, não o total do grupo. E \u003ccode>LAST_VALUE(x) OVER (PARTITION BY g ORDER BY d)\u003c/code> retorna o valor da \u003cstrong>linha atual\u003c/strong>, não o último da partição — porque o frame termina na linha corrente. Para o total do grupo, ou você omite o \u003ccode>ORDER BY\u003c/code>, ou especifica o frame como \u003ccode>UNBOUNDED FOLLOWING\u003c/code>. Saber isso é um marcador confiável de experiência real.\u003c/p>\n\u003cp>Um segundo detalhe: com \u003ccode>RANGE\u003c/code> e empates na coluna de ordenação, todas as linhas empatadas compartilham o mesmo valor acumulado, porque \u003ccode>RANGE\u003c/code> inclui todos os peers. Com \u003ccode>ROWS\u003c/code>, cada linha tem seu próprio acumulado. É a fonte de bugs sutis em cálculos de saldo.\u003c/p>\n\u003cp>\u003cstrong>Performance:\u003c/strong> window functions exigem particionar e ordenar os dados. Em engine distribuída, \u003ccode>PARTITION BY\u003c/code> gera shuffle pela chave e \u003ccode>ORDER BY\u003c/code> gera ordenação dentro da partição. Uma window sem \u003ccode>PARTITION BY\u003c/code> é especialmente cara: obriga a colocar \u003cstrong>tudo numa única partição\u003c/strong>, serializando o cálculo num único nó — é um erro grave em volume alto. Múltiplas windows com a mesma cláusula \u003ccode>OVER\u003c/code> costumam compartilhar um único shuffle; com cláusulas diferentes, cada uma pode gerar o seu.\u003c/p>\n\u003ch3 id=\"h-1-4-planos-de-execução\">1.4 Planos de execução\u003c/h3>\n\u003cp>Um plano de execução é a árvore de operadores que o banco vai executar. Ler plano é a habilidade prática mais valiosa deste arquivo.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>EXPLAIN\u003c/code> vs \u003ccode>EXPLAIN ANALYZE\u003c/code>:\u003c/strong> o primeiro mostra o plano \u003cstrong>estimado\u003c/strong>, sem executar; o segundo executa e mostra os números \u003cstrong>reais\u003c/strong>. A informação mais valiosa é a comparação entre linhas estimadas e linhas reais — uma divergência de ordem de grandeza indica estatísticas ruins ou correlação entre colunas que o otimizador não modelou, e é a causa raiz da maioria dos planos ruins.\u003c/p>\n\u003cp>\u003cstrong>O que procurar num plano:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Scan type.\u003c/strong> \u003ccode>Seq Scan\u003c/code> / \u003ccode>Full Table Scan\u003c/code> sobre tabela grande com filtro seletivo indica índice ausente ou não utilizável. Mas atenção: full scan \u003cstrong>não é sempre ruim\u003c/strong> — se a query lê 60% da tabela, varrer sequencialmente é mais rápido que pular por índice, e o otimizador sabe disso.\u003c/li>\u003cli>\u003cstrong>Estimativa vs realidade.\u003c/strong> Como acima. É o primeiro lugar para olhar.\u003c/li>\u003cli>\u003cstrong>Algoritmo de join escolhido.\u003c/strong> Nested loop com estimativa errada sobre uma tabela grande é o clássico \"a query rodava em 2 segundos e agora leva 40 minutos\".\u003c/li>\u003cli>\u003cstrong>Spill para disco.\u003c/strong> Operações de hash e sort que não cabem na memória de trabalho vazam para disco. É frequentemente a causa de lentidão desproporcional.\u003c/li>\u003cli>\u003cstrong>Ordem e volume dos intermediários.\u003c/strong> Se um join intermediário produz bilhões de linhas que depois são filtradas, a ordem está errada.\u003c/li>\u003cli>\u003cstrong>Filtros aplicados tarde.\u003c/strong> Predicados que poderiam ter sido empurrados para o scan mas aparecem no topo da árvore.\u003c/li>\u003cli>\u003cstrong>Em engines distribuídas:\u003c/strong> número de shuffles (\u003ccode>Exchange\u003c/code>), tamanho dos dados trocados, e se o broadcast aconteceu onde deveria.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Predicate pushdown\u003c/strong> é empurrar o filtro o mais perto possível da fonte, para ler menos dados. \u003cstrong>Projection pushdown / column pruning\u003c/strong> é o mesmo para colunas. Em formatos colunares e lakehouses, esses dois mecanismos são responsáveis pela maior parte do ganho de performance — e é por isso que aplicar uma função sobre a coluna filtrada (\u003ccode>WHERE YEAR(data) = 2026\u003c/code>) é tão danoso: impede o pushdown e o uso de índice, forçando varredura completa. A forma correta é \u003ccode>WHERE data &amp;gt;= '2026-01-01' AND data &amp;lt; '2027-01-01'\u003c/code>, que preserva a sargabilidade.\u003c/p>\n\u003cp>\u003cstrong>SARGable\u003c/strong> (Search ARGument able) é o termo para um predicado que o engine consegue usar para acesso direto via índice ou pruning. Predicados não-sargáveis: função sobre a coluna, \u003ccode>LIKE '%algo'\u003c/code> (curinga à esquerda), cast implícito por tipo incompatível, e \u003ccode>OR\u003c/code> sobre colunas diferentes em alguns casos. É um vocabulário que impressiona quando usado corretamente.\u003c/p>\n\u003ch3 id=\"h-1-5-índices\">1.5 Índices\u003c/h3>\n\u003cp>Um índice é uma estrutura auxiliar que acelera a busca ao custo de espaço e de escrita mais lenta (cada \u003ccode>INSERT\u003c/code>/\u003ccode>UPDATE\u003c/code>/\u003ccode>DELETE\u003c/code> precisa atualizar todos os índices afetados).\u003c/p>\n\u003cp>\u003cstrong>Tipos:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>B-tree\u003c/strong>: o padrão. Suporta igualdade, intervalo e ordenação. Cobre a esmagadora maioria dos casos.\u003c/li>\u003cli>\u003cstrong>Hash\u003c/strong>: só igualdade, e frequentemente sem vantagem real sobre B-tree nos bancos modernos.\u003c/li>\u003cli>\u003cstrong>Bitmap\u003c/strong>: eficiente para colunas de baixa cardinalidade em ambiente analítico, permitindo combinar condições com operações de bits. Péssimo sob escrita concorrente, por isso é raro em OLTP.\u003c/li>\u003cli>\u003cstrong>GIN / GiST / invertido\u003c/strong>: para busca em texto, arrays, JSON e dados geoespaciais.\u003c/li>\u003cli>\u003cstrong>Colunar / zone maps / min-max\u003c/strong>: em warehouses, o \"índice\" costuma ser estatística por bloco (min, max, contagem de nulos), permitindo pular blocos inteiros sem lê-los. Não é índice no sentido tradicional, mas cumpre o papel de pruning.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Conceitos que caem:\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Clustered vs non-clustered.\u003c/strong> Um índice clustered define a \u003cstrong>ordem física\u003c/strong> das linhas na tabela — por isso só pode haver um. Non-clustered é uma estrutura separada que aponta para as linhas. Buscar por índice non-clustered e depois buscar a linha completa é o \"bookmark lookup\", que pode ser caro se muitas linhas forem retornadas.\u003c/p>\n\u003cp>\u003cstrong>Covering index.\u003c/strong> Um índice que contém todas as colunas de que a query precisa, permitindo respondê-la \u003cstrong>sem tocar na tabela\u003c/strong> (index-only scan). É uma das otimizações de maior impacto e frequentemente subutilizada.\u003c/p>\n\u003cp>\u003cstrong>Índice composto e a regra do prefixo mais à esquerda.\u003c/strong> Um índice em \u003ccode>(a, b, c)\u003c/code> serve para filtros em \u003ccode>a\u003c/code>, em \u003ccode>(a,b)\u003c/code> e em \u003ccode>(a,b,c)\u003c/code> — mas \u003cstrong>não\u003c/strong> para um filtro só em \u003ccode>b\u003c/code> ou só em \u003ccode>c\u003c/code>. A ordem das colunas no índice é uma decisão de projeto: normalmente coloca-se primeiro a coluna usada em igualdade e com maior seletividade, e a coluna de intervalo por último, porque depois de um predicado de intervalo o índice deixa de conseguir refinar pelas colunas seguintes.\u003c/p>\n\u003cp>\u003cstrong>Seletividade.\u003c/strong> Índice em coluna de baixa cardinalidade (\u003ccode>ativo\u003c/code> booleano) tipicamente não ajuda: o otimizador vai preferir full scan porque metade das linhas seria retornada de qualquer forma. Índices funcionam quando filtram uma pequena fração das linhas.\u003c/p>\n\u003cp>\u003cstrong>Por que não indexar tudo:\u003c/strong> cada índice custa espaço, torna toda escrita mais lenta, consome cache que poderia servir dados, e aumenta o espaço de busca do otimizador (que pode acabar escolhendo pior). Índices não usados são puro custo, e identificá-los e removê-los é uma tarefa real de manutenção.\u003c/p>\n\u003cp>\u003cstrong>Em warehouses colunares\u003c/strong>, índices B-tree tradicionais frequentemente não existem ou não ajudam. O equivalente é \u003cstrong>particionamento\u003c/strong> (pular arquivos inteiros), \u003cstrong>clustering / sort keys / Z-ordering\u003c/strong> (agrupar fisicamente valores similares para melhorar o pruning por min-max), e as estatísticas por bloco. Saber traduzir o conceito de índice para o mundo analítico é uma resposta de nível intermediário/avançado.\u003c/p>\n\u003ch3 id=\"h-1-6-null-a-fonte-silenciosa-de-bugs\">1.6 NULL — a fonte silenciosa de bugs\u003c/h3>\n\u003cp>SQL usa lógica de três valores: verdadeiro, falso e \u003cstrong>desconhecido\u003c/strong>. NULL significa \"valor desconhecido\", não \"vazio\" nem \"zero\".\u003c/p>\n\u003cp>Consequências que caem em entrevista:\u003c/p>\n\u003cul>\u003cli>\u003ccode>NULL = NULL\u003c/code> é \u003cstrong>desconhecido\u003c/strong>, não verdadeiro. Comparação com NULL exige \u003ccode>IS NULL\u003c/code> / \u003ccode>IS NOT NULL\u003c/code>.\u003c/li>\u003cli>\u003ccode>WHERE coluna != 'X'\u003c/code> \u003cstrong>exclui\u003c/strong> as linhas onde a coluna é NULL, porque \u003ccode>NULL != 'X'\u003c/code> é desconhecido, e desconhecido não passa no filtro. Isso surpreende muita gente e é uma fonte real de números errados.\u003c/li>\u003cli>\u003ccode>NOT IN\u003c/code> com uma subquery que retorna qualquer NULL devolve \u003cstrong>conjunto vazio\u003c/strong>. Motivo: \u003ccode>x NOT IN (1, 2, NULL)\u003c/code> equivale a \u003ccode>x != 1 AND x != 2 AND x != NULL\u003c/code>, e a última condição é sempre desconhecida, o que torna a expressão inteira nunca verdadeira. \u003ccode>NOT EXISTS\u003c/code> não tem esse problema e é a alternativa segura. Esta é provavelmente a pegadinha mais cobrada de SQL em entrevistas de dados.\u003c/li>\u003cli>\u003ccode>COUNT(*)\u003c/code> conta linhas; \u003ccode>COUNT(coluna)\u003c/code> \u003cstrong>ignora NULLs\u003c/strong>. Diferença que muda resultados.\u003c/li>\u003cli>Funções de agregação (\u003ccode>SUM\u003c/code>, \u003ccode>AVG\u003c/code>) ignoram NULLs. \u003ccode>AVG\u003c/code> de uma coluna com NULLs divide pela contagem de não-nulos, não pelo total de linhas — o que pode ser ou não o que você quer.\u003c/li>\u003cli>\u003ccode>NULL\u003c/code> em concatenação de string propaga NULL na maioria dos bancos.\u003c/li>\u003cli>\u003ccode>GROUP BY\u003c/code> trata todos os NULLs como um único grupo, embora sejam \"desconhecidos diferentes\" logicamente. É uma inconsistência prática da especificação, e é bom saber.\u003c/li>\u003cli>\u003ccode>ORDER BY\u003c/code> posiciona NULLs de forma diferente entre bancos; use \u003ccode>NULLS FIRST\u003c/code> / \u003ccode>NULLS LAST\u003c/code> explicitamente.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-7-otimização-de-query-um-método\">1.7 Otimização de query: um método\u003c/h3>\n\u003cp>Quando perguntam \"essa query está lenta, o que você faz?\", o que se avalia é \u003cstrong>método\u003c/strong>, não truques. Uma sequência defensável:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Medir e delimitar.\u003c/strong> Está lenta sempre ou só às vezes? Lenta para todos ou para um conjunto de parâmetros? Regrediu recentemente? Se regrediu, algo mudou: volume, estatísticas, plano, ou infraestrutura.\u003c/li>\u003cli>\u003cstrong>Ler o plano com \u003ccode>EXPLAIN ANALYZE\u003c/code>.\u003c/strong> Comparar estimado com real.\u003c/li>\u003cli>\u003cstrong>Reduzir o volume lido.\u003c/strong> É quase sempre onde está o ganho: partition pruning, predicate pushdown, selecionar só as colunas necessárias, filtrar antes de juntar.\u003c/li>\u003cli>\u003cstrong>Verificar predicados sargáveis.\u003c/strong> Função sobre coluna filtrada, cast implícito e curinga à esquerda destroem uso de índice e pruning.\u003c/li>\u003cli>\u003cstrong>Verificar joins.\u003c/strong> Algoritmo escolhido, ordem, e se a cardinalidade estimada bate. Verificar explosão de linhas por chave duplicada.\u003c/li>\u003cli>\u003cstrong>Atualizar estatísticas.\u003c/strong> Frequentemente resolve sozinho, e é barato de testar.\u003c/li>\u003cli>\u003cstrong>Considerar índice ou clustering.\u003c/strong> Depois de esgotar o que é gratuito, não antes.\u003c/li>\u003cli>\u003cstrong>Reescrever a query.\u003c/strong> Substituir \u003ccode>NOT IN\u003c/code> por \u003ccode>NOT EXISTS\u003c/code>, \u003ccode>DISTINCT\u003c/code> por semi join, subquery correlacionada por join ou window, \u003ccode>OR\u003c/code> por \u003ccode>UNION ALL\u003c/code> quando isso permite usar índices.\u003c/li>\u003cli>\u003cstrong>Materializar.\u003c/strong> Se o cálculo é recorrente e caro, uma tabela agregada ou view materializada troca compute recorrente por storage e latência de atualização.\u003c/li>\u003cli>\u003cstrong>Questionar a pergunta.\u003c/strong> Frequentemente a query calcula muito mais do que o usuário precisa. Reduzir o escopo é a otimização mais eficaz que existe.\u003c/li>\u003c/ol>\n\u003cp>Sobre \u003cstrong>CTEs\u003c/strong>: em muitos bancos modernos elas são inlined e otimizadas junto com a query, mas em alguns (versões antigas do PostgreSQL, por exemplo) são \u003cstrong>materializadas\u003c/strong> e funcionam como barreira de otimização, impedindo predicate pushdown. Saber que o comportamento varia — e que é preciso verificar no plano em vez de assumir — é uma resposta melhor do que afirmar categoricamente.\u003c/p>\n\u003cp>Sobre \u003cstrong>\u003ccode>SELECT *\u003c/code>\u003c/strong>: em formato colunar é especialmente danoso, porque anula o column pruning que é a principal vantagem do formato. Também quebra contratos quando o schema muda.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Colocar filtro da tabela da direita no \u003ccode>WHERE\u003c/code> de um \u003ccode>LEFT JOIN\u003c/code>.\u003c/strong> Transforma o left em inner silenciosamente. A condição precisa ir no \u003ccode>ON\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Usar \u003ccode>NOT IN\u003c/code> com subquery que pode ter NULL.\u003c/strong> Retorna vazio sem erro. Use \u003ccode>NOT EXISTS\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Achar que \u003ccode>SUM(...) OVER (PARTITION BY x ORDER BY y)\u003c/code> dá o total do grupo.\u003c/strong> Dá o acumulado, por causa do frame padrão. E \u003ccode>LAST_VALUE\u003c/code> com \u003ccode>ORDER BY\u003c/code> retorna a linha atual pelo mesmo motivo.\u003c/p>\n\u003cp>\u003cstrong>Aplicar função na coluna filtrada.\u003c/strong> \u003ccode>WHERE YEAR(data) = 2026\u003c/code>, \u003ccode>WHERE UPPER(nome) = 'X'\u003c/code>, \u003ccode>WHERE CAST(id AS TEXT) = '5'\u003c/code> — todos destroem sargabilidade, uso de índice e partition pruning.\u003c/p>\n\u003cp>\u003cstrong>Usar \u003ccode>DISTINCT\u003c/code> para corrigir duplicação de join.\u003c/strong> Mascara o problema real (grão ou chave errada) e pode apagar linhas legitimamente distintas. Investigue a causa.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>COUNT(coluna)\u003c/code> achando que conta linhas.\u003c/strong> Ignora NULLs. \u003ccode>COUNT(*)\u003c/code> conta linhas.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>SELECT *\u003c/code> em tabela colunar.\u003c/strong> Anula o column pruning, que é a principal vantagem do formato, e quebra contratos quando o schema muda.\u003c/p>\n\u003cp>\u003cstrong>Assumir que full scan é sempre ruim.\u003c/strong> Se a query lê grande parte da tabela, scan é a escolha correta e o otimizador sabe disso.\u003c/p>\n\u003cp>\u003cstrong>Window function sem \u003ccode>PARTITION BY\u003c/code> em volume alto.\u003c/strong> Força todos os dados numa única partição, serializando o cálculo num nó só. É um dos erros mais caros em engine distribuída.\u003c/p>\n\u003cp>\u003cstrong>Confiar que o índice será usado só porque existe.\u003c/strong> Ele pode ser ignorado por baixa seletividade, por predicado não-sargável, por incompatibilidade de tipo, ou por estatísticas ruins. Confirme no plano.\u003c/p>\n\u003cp>\u003cstrong>Esquecer que \u003ccode>WHERE coluna != 'X'\u003c/code> exclui NULLs.\u003c/strong> Lógica de três valores. Se você quer incluí-los, precisa de \u003ccode>OR coluna IS NULL\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Otimizar antes de medir.\u003c/strong> Reescrever a query por instinto sem ler o plano é o hábito mais comum e o menos produtivo. O entrevistador está avaliando método.\u003c/p>\n\u003cp>\u003cstrong>Ignorar estatísticas.\u003c/strong> É a causa mais frequente de plano ruim, é a mais barata de corrigir, e quase ninguém menciona espontaneamente.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. Qual a diferença entre \u003ccode>WHERE\u003c/code> e \u003ccode>HAVING\u003c/code>?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> \u003ccode>WHERE\u003c/code> filtra linhas antes do agrupamento; \u003ccode>HAVING\u003c/code> filtra grupos depois da agregação. Por isso \u003ccode>WHERE\u003c/code> não aceita funções de agregação — elas ainda não foram calculadas. E quando é possível filtrar no \u003ccode>WHERE\u003c/code>, é melhor, porque reduz o volume que entra na agregação em vez de agregar tudo e descartar depois.\u003c/p>"},{"titleHtml":"🟢 P2. Diferença entre \u003ccode>INNER JOIN\u003c/code> e \u003ccode>LEFT JOIN\u003c/code>.","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Inner retorna só as linhas com correspondência dos dois lados. Left retorna todas as linhas da tabela da esquerda, preenchendo com NULL quando não há par à direita.\u003c/p>\n\u003cp>A pegadinha prática: se você coloca uma condição sobre a tabela da direita no \u003ccode>WHERE\u003c/code> de um \u003ccode>LEFT JOIN\u003c/code>, ele se comporta como inner, porque as linhas sem correspondência têm NULL naquela coluna e são eliminadas pelo filtro. Para preservar o comportamento de left, a condição precisa estar no \u003ccode>ON\u003c/code>, não no \u003ccode>WHERE\u003c/code>.\u003c/p>"},{"titleHtml":"🟢 P3. O que faz \u003ccode>GROUP BY\u003c/code> e o que é uma window function?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> \u003ccode>GROUP BY\u003c/code> colapsa várias linhas em uma por grupo, retornando os agregados. Window function calcula um valor considerando um conjunto de linhas relacionadas mas \u003cstrong>preserva\u003c/strong> todas as linhas — cada linha ganha o valor agregado junto com seus próprios dados.\u003c/p>\n\u003cp>É a diferença entre \"receita total por categoria\" (uma linha por categoria) e \"cada venda com a receita total da sua categoria ao lado\" (todas as vendas, mais uma coluna).\u003c/p>"},{"titleHtml":"🟢 P4. Diferença entre \u003ccode>RANK()\u003c/code>, \u003ccode>DENSE_RANK()\u003c/code> e \u003ccode>ROW_NUMBER()\u003c/code>.","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> \u003ccode>ROW_NUMBER\u003c/code> numera sequencialmente sem empate — se dois valores são iguais, um recebe 1 e o outro 2, arbitrariamente. \u003ccode>RANK\u003c/code> dá o mesmo número para empates e pula os seguintes: 1, 1, 3. \u003ccode>DENSE_RANK\u003c/code> dá o mesmo número para empates e não pula: 1, 1, 2.\u003c/p>\n\u003cp>Na prática, uso \u003ccode>ROW_NUMBER\u003c/code> para deduplicar — escolher uma linha por grupo; \u003ccode>RANK\u003c/code> quando a lacuna é semanticamente correta, como posição em competição; e \u003ccode>DENSE_RANK\u003c/code> quando quero os N maiores valores distintos, e não as N primeiras linhas.\u003c/p>"},{"titleHtml":"🟢 P5. O que é um índice e por que não indexar todas as colunas?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É uma estrutura auxiliar que permite localizar linhas sem varrer a tabela inteira. Não se indexa tudo porque cada índice ocupa espaço, torna toda escrita mais lenta (o índice precisa ser atualizado a cada insert, update e delete), consome cache que poderia guardar dados, e amplia o espaço de busca do otimizador.\u003c/p>\n\u003cp>Além disso, índice em coluna de baixa seletividade normalmente não é usado: se o filtro retorna metade da tabela, varredura sequencial é mais rápida que pular por índice, e o otimizador vai escolher o scan.\u003c/p>"},{"titleHtml":"🟡 P6. Explique os algoritmos de join e quando cada um é escolhido.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Nested loop percorre a tabela externa e, para cada linha, busca correspondências na interna — bom quando a externa é pequena e a interna tem índice na chave, porque aí o custo é N vezes log M. Ruim quando ambas são grandes sem índice.\u003c/p>\n\u003cp>Hash join constrói uma tabela hash com o lado menor e varre o maior consultando o hash. Custo aproximadamente linear na soma dos tamanhos, e é o dominante em analytics. Exige que o build side caiba em memória; se não couber, faz spill para disco e degrada.\u003c/p>\n\u003cp>Sort-merge ordena os dois lados e percorre em paralelo. Custa a ordenação, mas se os dados já estão ordenados ou co-particionados, é linear. É o preferido para dois lados grandes e comparáveis.\u003c/p>\n\u003cp>Em engine distribuída, tem ainda o broadcast join: se um lado é pequeno, uma cópia é enviada a todos os nós e o join é local, eliminando shuffle — é a otimização de maior impacto quando aplicável.\u003c/p>\n\u003cp>A escolha depende dos tamanhos relativos, de índices disponíveis, da cardinalidade estimada e de ordenação preexistente. E depende de \u003cstrong>estatísticas\u003c/strong> — estatísticas desatualizadas são a causa mais comum de o otimizador escolher nested loop sobre uma tabela que ele acha que tem mil linhas e tem dez milhões.\u003c/p>"},{"titleHtml":"🟡 P7. Você tem uma tabela de vendas e precisa do top 3 produtos por categoria. Como resolve conceitualmente?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Window function com \u003ccode>ROW_NUMBER()\u003c/code> ou \u003ccode>DENSE_RANK()\u003c/code> particionando por categoria e ordenando por valor decrescente, envolvido numa subquery ou CTE, e filtrando pelo ranking no nível externo.\u003c/p>\n\u003cp>Precisa da subquery porque window functions são avaliadas depois do \u003ccode>WHERE\u003c/code> na ordem lógica, então não dá para filtrar por elas diretamente no \u003ccode>WHERE\u003c/code>.\u003c/p>\n\u003cp>A escolha entre \u003ccode>ROW_NUMBER\u003c/code> e \u003ccode>DENSE_RANK\u003c/code> depende do que \"top 3\" significa para o negócio: \u003ccode>ROW_NUMBER\u003c/code> devolve exatamente 3 linhas, quebrando empates arbitrariamente; \u003ccode>DENSE_RANK\u003c/code> devolve todos os produtos que estão nos 3 maiores valores, podendo trazer mais de 3 linhas se houver empate. Eu perguntaria qual comportamento se espera em caso de empate — essa é a parte que o entrevistador está avaliando.\u003c/p>"},{"titleHtml":"🟡 P8. O que é predicate pushdown e por que \u003ccode>WHERE YEAR(data) = 2026\u003c/code> é problemático?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Predicate pushdown é empurrar o filtro o mais perto possível da fonte, para ler menos dados — no limite, até o formato de arquivo ou o storage, que consegue pular blocos e arquivos inteiros usando estatísticas de min/max.\u003c/p>\n\u003cp>\u003ccode>YEAR(data) = 2026\u003c/code> aplica uma função sobre a coluna, o que torna o predicado não-sargável: o engine não consegue mapear a condição para um intervalo de valores da coluna, então não usa índice e não faz pruning de partição — resultado, varredura completa. A forma correta é \u003ccode>data &amp;gt;= '2026-01-01' AND data &amp;lt; '2027-01-01'\u003c/code>, que preserva a relação direta com os valores armazenados.\u003c/p>\n\u003cp>O mesmo problema aparece com cast implícito por tipo incompatível e com \u003ccode>LIKE '%algo'\u003c/code>, onde o curinga à esquerda impede o uso da ordenação do índice.\u003c/p>"},{"titleHtml":"🟡 P9. \u003ccode>NOT IN\u003c/code> com subquery: qual o risco?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Se a subquery retornar qualquer NULL, o resultado é conjunto vazio. \u003ccode>x NOT IN (1, 2, NULL)\u003c/code> equivale a \u003ccode>x != 1 AND x != 2 AND x != NULL\u003c/code>, e essa última comparação é sempre desconhecida, o que impede a expressão de ser verdadeira para qualquer linha.\u003c/p>\n\u003cp>É especialmente perigoso porque falha silenciosamente: a query roda, retorna zero linhas, e alguém conclui que \"não tem nenhum caso\". Uso \u003ccode>NOT EXISTS\u003c/code>, que trata NULL corretamente e normalmente tem plano melhor por ser um anti join, ou \u003ccode>LEFT JOIN ... WHERE chave_direita IS NULL\u003c/code>.\u003c/p>"},{"titleHtml":"🟡 P10. Como você lê um plano de execução? O que procura primeiro?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Uso \u003ccode>EXPLAIN ANALYZE\u003c/code> para ter os números reais, não só as estimativas, e a primeira coisa que olho é a \u003cstrong>divergência entre linhas estimadas e linhas reais\u003c/strong>. Se o otimizador acha que um passo devolve mil linhas e ele devolve dez milhões, todas as decisões subsequentes estão erradas — e a causa costuma ser estatística desatualizada ou correlação entre colunas que ele não modela.\u003c/p>\n\u003cp>Depois procuro: full scan sobre tabela grande com filtro seletivo (índice ausente ou não utilizável); o algoritmo de join escolhido, especialmente nested loop com estimativa errada, que é o clássico da query que \"de repente\" ficou 100 vezes mais lenta; spill para disco em hash ou sort, que causa lentidão desproporcional; e o tamanho dos resultados intermediários, para ver se a ordem de join está mantendo tudo pequeno.\u003c/p>\n\u003cp>Em engine distribuída, olho também o número de shuffles e o volume trocado, e se o broadcast aconteceu onde deveria.\u003c/p>\n\u003cp>O que eu não faria é assumir que full scan é sempre ruim — se a query lê 60% da tabela, varrer é mais rápido que pular por índice, e o otimizador está certo.\u003c/p>"},{"titleHtml":"🟡 P11. O que é um covering index?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um índice que contém todas as colunas que a query precisa — as do filtro e as do \u003ccode>SELECT\u003c/code> — de modo que o banco responde a consulta lendo só o índice, sem tocar na tabela. Isso elimina o lookup de volta à tabela para cada linha, que é o custo dominante quando muitas linhas são retornadas por um índice non-clustered.\u003c/p>\n\u003cp>É uma das otimizações de maior impacto e mais subutilizadas. O custo é um índice mais largo, que ocupa mais espaço e torna a escrita mais cara — então vale para consultas frequentes e críticas, não para tudo.\u003c/p>"},{"titleHtml":"🔴 P12. \u003ccode>SUM(valor) OVER (PARTITION BY cliente ORDER BY data)\u003c/code> — o que isso retorna?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Um \u003cstrong>acumulado\u003c/strong> (running total) por cliente ao longo do tempo, não o total do cliente. Porque quando há \u003ccode>ORDER BY\u003c/code> dentro do \u003ccode>OVER\u003c/code> sem frame explícito, o padrão é \u003ccode>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\u003c/code> — ou seja, do início da partição até a linha atual.\u003c/p>\n\u003cp>Para obter o total do cliente em todas as linhas, ou removo o \u003ccode>ORDER BY\u003c/code>, ou especifico \u003ccode>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\u003c/code>.\u003c/p>\n\u003cp>Há um detalhe adicional: o padrão é \u003ccode>RANGE\u003c/code>, não \u003ccode>ROWS\u003c/code>. Com \u003ccode>RANGE\u003c/code>, linhas empatadas na coluna de ordenação compartilham o mesmo acumulado, porque todos os peers entram no frame. Com \u003ccode>ROWS\u003c/code>, cada linha tem o seu. Se houver múltiplas transações do mesmo cliente na mesma data, os dois produzem resultados diferentes, e isso é uma fonte real de bugs em cálculo de saldo.\u003c/p>\n\u003cp>\u003cem>Follow-up frequente:\u003c/em> \"E \u003ccode>LAST_VALUE\u003c/code> com \u003ccode>ORDER BY\u003c/code>?\" → Retorna o valor da linha atual, pelo mesmo motivo: o frame termina na linha corrente. Para o último valor da partição, é preciso frame explícito até \u003ccode>UNBOUNDED FOLLOWING\u003c/code> — ou usar \u003ccode>FIRST_VALUE\u003c/code> com ordenação invertida, que é a forma que eu prefiro porque é menos sujeita a erro.\u003c/p>"},{"titleHtml":"🔴 P13. Uma query que rodava em 2 segundos passou a levar 40 minutos, sem mudança no código. Como investiga?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Como o código não mudou, algo no ambiente mudou. Investigo em ordem de probabilidade.\u003c/p>\n\u003cp>\u003cstrong>Mudança de plano.\u003c/strong> É a causa mais frequente. O volume cresceu e ultrapassou um limiar que fez o otimizador trocar de algoritmo — tipicamente de hash join para nested loop, ou perder um broadcast join. Comparo o plano atual com o histórico, se o banco guardar.\u003c/p>\n\u003cp>\u003cstrong>Estatísticas desatualizadas.\u003c/strong> Se houve uma carga grande e as estatísticas não foram recoletadas, o otimizador estima com dados velhos. É barato de testar: atualizo as estatísticas e reexecuto.\u003c/p>\n\u003cp>\u003cstrong>Crescimento de dados ou skew novo.\u003c/strong> Uma chave que antes era balanceada passou a concentrar. Ou uma tabela cresceu e o build side do hash join deixou de caber em memória, passando a fazer spill.\u003c/p>\n\u003cp>\u003cstrong>Índice removido, desabilitado ou fragmentado.\u003c/strong> Vale conferir.\u003c/p>\n\u003cp>\u003cstrong>Contenção externa.\u003c/strong> Outra carga concorrente consumindo I/O, memória ou lock. Se a query está esperando lock, o plano está ótimo e o problema é outro completamente — verificar isso cedo evita horas perdidas.\u003c/p>\n\u003cp>\u003cstrong>Parameter sniffing\u003c/strong>, em bancos que cacheiam plano por consulta parametrizada: o plano foi compilado para um valor de parâmetro atípico e ficou cacheado. Sintoma característico: lenta para alguns parâmetros e rápida para outros.\u003c/p>\n\u003cp>Meu primeiro passo concreto seria \u003ccode>EXPLAIN ANALYZE\u003c/code> comparando estimado com real, e em paralelo verificar se há espera por lock ou recurso — porque essas duas checagens separam \"plano ruim\" de \"sistema ocupado\", que exigem soluções completamente diferentes.\u003c/p>"},{"titleHtml":"🔴 P14. Como você otimizaria uma consulta analítica que agrega bilhões de linhas e roda várias vezes por dia?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Vou de fora para dentro, do mais barato ao mais estrutural.\u003c/p>\n\u003cp>\u003cstrong>Primeiro, reduzir o que é lido.\u003c/strong> Verifico se há partition pruning acontecendo de fato — não basta a tabela ser particionada, o filtro precisa ser sargável sobre a coluna de partição. Verifico column pruning: \u003ccode>SELECT *\u003c/code> numa tabela colunar anula a principal vantagem do formato. E verifico se o filtro mais seletivo está sendo aplicado o mais cedo possível.\u003c/p>\n\u003cp>\u003cstrong>Segundo, o layout físico.\u003c/strong> Se as consultas filtram recorrentemente por uma segunda dimensão além da partição, clustering ou Z-ordering nessa coluna melhora muito o pruning por min/max, sem criar mais um nível de partição física. E conferir file sizing: milhares de arquivos pequenos custam mais em overhead de abertura do que em leitura.\u003c/p>\n\u003cp>\u003cstrong>Terceiro, evitar recomputar.\u003c/strong> Se a mesma agregação roda várias vezes por dia sobre dados que mudam uma vez por dia, materializar é a resposta óbvia: uma tabela agregada pré-calculada, ou view materializada com refresh incremental. Troco compute recorrente por storage e uma latência de atualização controlada — e essa é quase sempre a otimização de maior retorno nesse cenário.\u003c/p>\n\u003cp>\u003cstrong>Quarto, agregação incremental.\u003c/strong> Se o dado é append-only por período, agregar só o novo período e combinar com o histórico já agregado transforma um custo proporcional ao total num custo proporcional ao delta. Funciona para métricas aditivas; para \u003ccode>COUNT DISTINCT\u003c/code> exige estruturas aproximadas como HyperLogLog, que é um ótimo detalhe a mencionar.\u003c/p>\n\u003cp>\u003cstrong>Quinto, questionar o requisito.\u003c/strong> Muitas dessas queries calculam granularidade que ninguém usa, ou um histórico completo quando o usuário só olha 90 dias. Reduzir o escopo é a otimização mais eficaz e a mais ignorada.\u003c/p>\n\u003cp>Só depois disso eu consideraria mais hardware, que é a solução que resolve sintoma e mantém o custo para sempre.\u003c/p>"},{"titleHtml":"🔴 P15. Explique o problema de \"explosão de linhas\" em joins e como evitá-lo.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Acontece quando você junta por uma chave que não é única do lado direito. Se cada linha da esquerda casa com N linhas da direita, o resultado tem N vezes mais linhas — e qualquer \u003ccode>SUM\u003c/code> sobre a métrica da esquerda passa a contar N vezes o mesmo valor.\u003c/p>\n\u003cp>É especialmente perigoso porque \u003cstrong>o resultado parece plausível\u003c/strong>: os números só ficam maiores, não aparece erro, e ninguém percebe até alguém reconciliar com outra fonte. É a causa mais comum de \"o dashboard está com o número errado\" que eu já vi.\u003c/p>\n\u003cp>Onde costuma acontecer: juntar a fato com uma dimensão SCD Tipo 2 sem filtrar pelo intervalo de validade — cada fato casa com todas as versões históricas da dimensão. Juntar com uma tabela que tem duplicatas não detectadas. Ou juntar duas fatos de grãos diferentes, que é um erro de modelagem.\u003c/p>\n\u003cp>Como prevenir: testar unicidade da chave de junção do lado direito como parte do pipeline, e não confiar na suposição; ao juntar com SCD Tipo 2, sempre filtrar pela validade ou pela flag de corrente, conforme a semântica desejada; usar semi join quando você só precisa saber se existe correspondência, em vez de inner join com \u003ccode>DISTINCT\u003c/code> depois; e comparar a contagem de linhas antes e depois do join como asserção — se o join deveria preservar a cardinalidade da esquerda, essa asserção pega o problema imediatamente.\u003c/p>\n\u003cp>Sobre a \"correção\" com \u003ccode>DISTINCT\u003c/code>: ela é um mascaramento perigoso. \u003ccode>DISTINCT\u003c/code> remove linhas idênticas, mas se as linhas duplicadas diferirem em alguma coluna, elas sobrevivem — e se você tinha duas transações legitimamente idênticas, o \u003ccode>DISTINCT\u003c/code> apaga uma delas. Quando vejo \u003ccode>DISTINCT\u003c/code> depois de um join, minha primeira suspeita é que o grão está errado.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Por que o \u003cstrong>WHERE\u003c/strong> não aceita funções de agregação?","a":["Por limitação de sintaxe herdada do SQL-92","Porque na ordem lógica o WHERE é avaliado antes do GROUP BY — a agregação ainda não existe; para filtrar por agregado, use HAVING","Porque agregações são caras demais em filtros","Aceita, desde que a coluna esteja indexada"],"c":1,"e":"A ordem lógica (FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY) explica também por que alias do SELECT não funciona no WHERE e por que window function não pode ser filtrada diretamente."},{"n":"🟡","levelName":"intermediario","q":"Num \u003cstrong>LEFT JOIN\u003c/strong>, colocar uma condição da tabela da direita no WHERE faz o quê?","a":["Melhora a performance sem mudar o resultado","Transforma o LEFT em INNER silenciosamente: as linhas sem correspondência têm NULL naquela coluna e são eliminadas pelo filtro — a condição precisa ir no ON","Gera erro de sintaxe","Duplica as linhas da esquerda"],"c":1,"e":"É a pegadinha de join mais comum. No ON, a condição participa do pareamento e preserva as linhas da esquerda sem par."},{"n":"🟡","levelName":"intermediario","q":"Qual o risco de \u003cstrong>NOT IN\u003c/strong> com uma subquery?","a":["É mais lento que NOT EXISTS, mas sempre correto","Se a subquery retornar qualquer NULL, o resultado é conjunto vazio — x != NULL é desconhecido e a expressão nunca é verdadeira; use NOT EXISTS","Retorna duplicatas quando há empates","Ignora os índices da tabela externa"],"c":1,"e":"Falha silenciosamente: a query roda, retorna zero linhas, e alguém conclui que não há casos. É provavelmente a pegadinha de SQL mais cobrada em entrevistas de dados."},{"n":"🟡","levelName":"intermediario","q":"O que retorna \u003cstrong>SUM(valor) OVER (PARTITION BY cliente ORDER BY data)\u003c/strong>?","a":["O total do cliente em todas as linhas","Um acumulado (running total) por cliente: com ORDER BY no OVER sem frame explícito, o padrão é RANGE UNBOUNDED PRECEDING AND CURRENT ROW","A média móvel de 7 dias","O total geral da tabela"],"c":1,"e":"Para o total do grupo: remova o ORDER BY ou especifique frame até UNBOUNDED FOLLOWING. Detalhe extra: o padrão é RANGE, então linhas empatadas na data compartilham o acumulado — fonte de bugs em saldo."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>WHERE YEAR(data) = 2026\u003c/strong> é problemático?","a":["Porque YEAR só existe em alguns bancos","Porque a função sobre a coluna torna o predicado não-sargável: sem uso de índice e sem partition pruning, força varredura completa; o correto é data &gt;= 2026-01-01 AND data &lt; 2027-01-01","Porque compara inteiro com data","Porque o otimizador reescreve automaticamente e fica igual"],"c":1,"e":"O mesmo vale para cast implícito e LIKE com curinga à esquerda. Em lakes, o pruning por partição e por min/max depende de predicados sargáveis — e a falha é silenciosa: resultado certo, custo enorme."},{"n":"🟡","levelName":"intermediario","q":"Para \u003cstrong>deduplicar\u003c/strong> escolhendo uma linha por grupo, qual função usar?","a":["RANK(), que numera sem empates","ROW_NUMBER(), que gera numeração única por partição — filtra-se rn = 1 numa subquery; RANK e DENSE_RANK repetem números em empates","DENSE_RANK(), que é mais eficiente","NTILE(1), que agrupa tudo"],"c":1,"e":"RANK dá 1,1,3 e DENSE_RANK dá 1,1,2 em empates — ambos podem devolver mais de uma linha por grupo. DENSE_RANK serve para os N maiores valores distintos."},{"n":"🔴","levelName":"avancado","q":"Após um join, os totais do dashboard \u003cstrong>inflaram\u003c/strong>. Qual a causa mais comum e por que DISTINCT é uma correção perigosa?","a":["Índice corrompido; DISTINCT resolve corretamente","Explosão de linhas por chave não única do lado direito (ex.: SCD2 sem filtro de validade); DISTINCT mascara o problema de grão e pode apagar linhas legitimamente idênticas","Cache desatualizado; basta recarregar","Overflow numérico na soma"],"c":1,"e":"Cada linha da esquerda casando com N da direita multiplica o SUM — e o resultado parece plausível. Prevenção: testar unicidade da chave no pipeline e comparar contagem antes/depois do join."},{"n":"🔴","levelName":"avancado","q":"Ao ler um plano com \u003cstrong>EXPLAIN ANALYZE\u003c/strong>, qual é a primeira coisa a comparar?","a":["O tempo total com o da véspera","Linhas estimadas versus linhas reais: divergência de ordem de grandeza indica estatísticas ruins ou correlações não modeladas — a causa raiz da maioria dos planos catastróficos","O número de colunas retornadas","A versão do otimizador"],"c":1,"e":"Estatística desatualizada é a causa mais frequente de plano ruim, a mais barata de corrigir e a menos citada. Depois: full scan indevido, nested loop com estimativa errada, spill para disco."}]},{"id":"07","fullTitle":"07 — Formatos de Arquivo e Armazenamento","shortTitle":"Formatos de Arquivo e Armazenamento","subtitle":"Colunar vs linha · Parquet, ORC, Avro · Compressão e encoding · Particionamento físico · File sizing e small files · Object storage","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-orientação-a-linha-vs-orientação-a-coluna\">1.1 Orientação a linha vs orientação a coluna\u003c/h3>\n\u003cp>\u003cstrong>Orientado a linha\u003c/strong>: os valores de um mesmo registro ficam fisicamente juntos. Ler um registro inteiro custa uma leitura sequencial.\u003c/p>\n\u003cp>\u003cstrong>Orientado a coluna\u003c/strong>: os valores de uma mesma coluna ficam fisicamente juntos. Ler uma coluna inteira custa uma leitura sequencial; ler um registro inteiro exige tocar em N lugares.\u003c/p>\n\u003cp>Três consequências decorrem disso, e são a resposta completa para \"por que colunar é melhor em analytics\":\u003c/p>\n\u003cp>\u003cstrong>1. Menos I/O.\u003c/strong> Uma consulta analítica típica lê poucas colunas de uma tabela larga. Se a tabela tem 200 colunas e a query usa 5, o formato colunar lê 2,5% dos dados; o formato de linha lê 100%. Isso sozinho já é um ganho de uma a duas ordens de grandeza, e é o efeito dominante.\u003c/p>\n\u003cp>\u003cstrong>2. Compressão muito melhor.\u003c/strong> Valores de uma mesma coluna têm o mesmo tipo e frequentemente valores repetidos ou próximos. Isso permite técnicas que não funcionam em dados heterogêneos: dictionary encoding (substituir strings repetidas por IDs pequenos), run-length encoding (armazenar \"o valor X repete 5000 vezes\"), delta encoding (armazenar diferenças em vez de valores absolutos, ótimo para timestamps e IDs sequenciais), e bit-packing (usar só os bits necessários para o range real). Taxas de 5:1 a 20:1 são comuns, contra 2:1 ou 3:1 em formato de linha.\u003c/p>\n\u003cp>\u003cstrong>3. Execução vetorizada.\u003c/strong> Como os valores de uma coluna são do mesmo tipo e contíguos em memória, a CPU processa em lote com instruções SIMD, e há muito menos cache miss e branch misprediction. Isso é um ganho de CPU, separado do ganho de I/O, e frequentemente esquecido nas respostas.\u003c/p>\n\u003cp>\u003cstrong>Por que OLTP continua orientado a linha:\u003c/strong> ler ou escrever um registro completo em formato colunar exigiria tocar em N regiões diferentes do disco. E atualizar uma linha significaria alterar N estruturas comprimidas. Formato colunar é hostil a escrita pontual e a leitura de registro inteiro — que são exatamente os dois padrões do OLTP.\u003c/p>\n\u003ch3 id=\"h-1-2-parquet-orc-e-avro\">1.2 Parquet, ORC e Avro\u003c/h3>\n\u003cp>\u003cstrong>Apache Parquet\u003c/strong> — colunar, o padrão de fato em data lakes e lakehouses.\u003c/p>\n\u003cul>\u003cli>Estrutura hierárquica: arquivo → \u003cstrong>row groups\u003c/strong> (blocos horizontais, tipicamente 128 MB–1 GB) → \u003cstrong>column chunks\u003c/strong> (uma coluna dentro do row group) → \u003cstrong>pages\u003c/strong> (unidade de compressão e encoding, tipicamente ~1 MB).\u003c/li>\u003cli>Cada row group e cada page carrega \u003cstrong>estatísticas\u003c/strong>: min, max, contagem de nulos, e opcionalmente distinct count. É isso que permite ao engine pular blocos inteiros sem descomprimir — o mecanismo por trás do predicate pushdown eficiente.\u003c/li>\u003cli>Suporta estruturas aninhadas (o algoritmo de definition/repetition levels do Dremel), permitindo representar JSON complexo mantendo colunaridade.\u003c/li>\u003cli>Encodings: dictionary, RLE, delta, bit-packing, escolhidos automaticamente por coluna.\u003c/li>\u003cli>Suporta \u003cstrong>bloom filters\u003c/strong> opcionais por coluna, que ajudam em predicados de igualdade sobre colunas de alta cardinalidade, onde min/max não filtram bem.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Apache ORC\u003c/strong> — colunar, conceitualmente muito próximo do Parquet.\u003c/p>\n\u003cul>\u003cli>Organizado em \u003cstrong>stripes\u003c/strong> (equivalente aos row groups), com índices em três níveis: arquivo, stripe e \u003cstrong>row group de 10 mil linhas\u003c/strong>, o que dá um pruning mais fino que o Parquet em alguns casos.\u003c/li>\u003cli>Historicamente mais integrado ao ecossistema Hive/Hadoop e com suporte nativo a ACID no Hive.\u003c/li>\u003cli>Na prática, a diferença de performance entre ORC e Parquet é pequena e depende do caso; a decisão costuma ser ditada por qual o ecossistema suporta melhor. Parquet venceu em adoção fora do mundo Hive.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Apache Avro\u003c/strong> — \u003cstrong>orientado a linha\u003c/strong>, e esse é o ponto.\u003c/p>\n\u003cul>\u003cli>Schema em JSON armazenado junto com os dados, com regras de \u003cstrong>evolução de schema\u003c/strong> bem definidas (compatibilidade forward, backward e full).\u003c/li>\u003cli>Serialização binária compacta e rápida.\u003c/li>\u003cli>Como é orientado a linha, é bom para \u003cstrong>escrita\u003c/strong> e para \u003cstrong>transporte de registros completos\u003c/strong>, não para consulta analítica seletiva.\u003c/li>\u003cli>É o formato natural para mensagens em Kafka (com Schema Registry), para camada de ingestão bruta, e para casos onde você sempre lê o registro inteiro.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>A regra prática que responde a maioria das perguntas:\u003c/strong> Avro para escrever e transportar, Parquet/ORC para ler e analisar. Um pipeline típico ingere em Avro (ou JSON) e converte para Parquet na camada analítica.\u003c/p>\n\u003cp>\u003cstrong>JSON e CSV\u003c/strong> merecem menção pelo que têm de ruim: sem tipos (ou com tipos frouxos), sem compressão eficiente, sem estatísticas, sem schema aplicado, e caros de parsear. CSV tem ainda ambiguidades de escaping, encoding e delimitador que causam bugs reais. São formatos de \u003cstrong>interchange\u003c/strong>, aceitáveis na borda do sistema, nunca como camada de armazenamento analítico. Um detalhe técnico relevante: CSV e JSON não são \u003cstrong>splittable\u003c/strong> quando comprimidos com gzip, o que impede paralelizar a leitura de um arquivo grande — um único arquivo .csv.gz de 50 GB é processado por uma única task.\u003c/p>\n\u003ch3 id=\"h-1-3-compressão\">1.3 Compressão\u003c/h3>\n\u003cp>Dois eixos de decisão: \u003cstrong>taxa de compressão\u003c/strong> versus \u003cstrong>velocidade de compressão/descompressão\u003c/strong>, e \u003cstrong>splittability\u003c/strong>.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Snappy\u003c/strong>: rápido, taxa moderada. Foi por muito tempo o padrão em Parquet, porque o gargalo costumava ser CPU e não I/O.\u003c/li>\u003cli>\u003cstrong>Zstd (zstandard)\u003c/strong>: taxa significativamente melhor que Snappy com velocidade competitiva, e nível ajustável. Tornou-se a escolha preferida na maioria dos casos modernos, especialmente quando o storage é cobrado por byte e a rede é o gargalo.\u003c/li>\u003cli>\u003cstrong>Gzip\u003c/strong>: taxa boa, descompressão lenta. E, no nível de arquivo inteiro, não é splittable.\u003c/li>\u003cli>\u003cstrong>LZ4\u003c/strong>: muito rápido, taxa baixa. Bom para dados intermediários e shuffle.\u003c/li>\u003cli>\u003cstrong>Brotli\u003c/strong>: taxa alta, compressão lenta. Bom para dados escritos uma vez e lidos muitas.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Splittability\u003c/strong> é o conceito que mais cai. Um arquivo é splittable quando o engine consegue começar a ler do meio dele, permitindo que várias tasks processem partes diferentes do mesmo arquivo em paralelo. Um CSV comprimido com gzip \u003cstrong>não é splittable\u003c/strong>, porque você precisa descomprimir desde o início para chegar ao meio — então um arquivo de 50 GB vira uma única task, independentemente do tamanho do cluster.\u003c/p>\n\u003cp>Parquet e ORC contornam isso porque a compressão é aplicada \u003cstrong>por página/bloco interno\u003c/strong>, não ao arquivo inteiro. Cada row group pode ser lido independentemente, então o arquivo é splittable mesmo com gzip nas páginas. Explicar isso corretamente é um bom diferencial.\u003c/p>\n\u003cp>\u003cstrong>Compressão e formato interagem:\u003c/strong> a taxa que você obtém em Parquet vem majoritariamente do \u003cem>encoding\u003c/em> colunar (dictionary, RLE, delta), não do algoritmo de compressão genérico aplicado depois. Ordenar os dados por uma coluna de baixa cardinalidade antes de escrever pode melhorar dramaticamente a compressão, porque cria longas sequências de valores repetidos que o RLE captura. Isso é uma alavanca real e pouco usada.\u003c/p>\n\u003ch3 id=\"h-1-4-particionamento-físico-e-pruning\">1.4 Particionamento físico e pruning\u003c/h3>\n\u003cp>Particionar em disco significa organizar os arquivos em diretórios por valor de uma coluna:\u003c/p>\n\u003cpre>\u003ccode>/vendas/ano=2026/mes=08/dia=14/part-0001.parquet\u003c/code>\u003c/pre>\n\u003cp>O ganho é \u003cstrong>partition pruning\u003c/strong>: uma consulta que filtra por data lê apenas os diretórios relevantes, sem abrir os demais arq
