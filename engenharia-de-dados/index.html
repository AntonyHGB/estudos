Plataforma self-service\u003c/strong>: um time de plataforma provê a infraestrutura para que os domínios publiquem dados sem reinventar tudo.\u003c/li>\u003cli>\u003cstrong>Governança federada e computacional\u003c/strong>: padrões globais (identidade, formatos, políticas de acesso) aplicados automaticamente, com autonomia local dentro deles.\u003c/li>\u003c/ol>\n\u003cp>O problema que resolve é real: o time central de dados vira gargalo e não tem contexto de negócio suficiente sobre 40 domínios diferentes. O risco é igualmente real: sem governança federada forte e sem uma plataforma madura, mesh vira \"cada time faz o que quer\", que é o silo de sempre com nome novo. A resposta madura numa entrevista é reconhecer que mesh exige maturidade organizacional alta e que a maioria das empresas que dizem estar fazendo mesh está apenas descentralizando sem os contrapesos.\u003c/p>\n\u003cp>\u003cstrong>Data Fabric\u003c/strong> é mais um termo de fornecedor: uma camada de integração e metadados que unifica acesso a dados espalhados, frequentemente com automação e catálogo ativo. Onde mesh é descentralização organizacional, fabric é unificação tecnológica. Não são mutuamente exclusivos, e nenhum dos dois é obrigatório para fazer engenharia de dados bem feita.\u003c/p>\n\u003ch3 id=\"h-1-8-como-escolher-a-parte-que-vira-pergunta-de-arquitetura\">1.8 Como escolher (a parte que vira pergunta de arquitetura)\u003c/h3>\n\u003cp>\u003cstrong>Data warehouse puro (Snowflake, BigQuery, Redshift) se:\u003c/strong> o dado é majoritariamente estruturado e vem de sistemas transacionais; os consumidores são BI e analistas SQL; a equipe é pequena e não quer operar infraestrutura; governança e performance previsível importam mais que flexibilidade. É a escolha certa para a maioria das empresas que não são de tecnologia — e dizer isso mostra pragmatismo.\u003c/p>\n\u003cp>\u003cstrong>Data lake / lakehouse se:\u003c/strong> há volume alto de dado semiestruturado ou não estruturado; ML é caso de uso de primeira classe; você quer evitar lock-in de fornecedor no formato de storage; múltiplos engines precisam ler o mesmo dado; o custo de storage no warehouse virou proibitivo.\u003c/p>\n\u003cp>\u003cstrong>Ambos (o mais comum na prática):\u003c/strong> lake/lakehouse para ingestão bruta, processamento pesado e ML; warehouse ou camada Gold do lakehouse servindo BI. O dado flui do lake para o warehouse, ou o warehouse lê o lakehouse via tabelas externas. Reconhecer que a resposta usual é \"os dois, em camadas\" é mais forte do que defender uma escolha binária.\u003c/p>\n\u003cp>Note também a convergência: Snowflake e BigQuery leem e escrevem Iceberg; Databricks oferece warehouse SQL; a distinção entre as categorias está se dissolvendo na prática. A pergunta que sobra é menos sobre categoria e mais sobre \u003cstrong>onde ficam os dados, quem controla o formato, e qual engine paga a conta do compute\u003c/strong>.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Confundir formato de arquivo com formato de tabela.\u003c/strong> Parquet é formato de arquivo; Iceberg e Delta são formatos de tabela que ficam \u003cstrong>por cima\u003c/strong> do Parquet. Dizer \"usamos Iceberg em vez de Parquet\" revela que a arquitetura não foi entendida — Iceberg usa Parquet.\u003c/p>\n\u003cp>\u003cstrong>Achar que data lake é \"onde a gente joga arquivo\".\u003c/strong> Um data lake sem catálogo, sem contrato e sem ciclo de vida é um bucket. A definição de data lake inclui governança; sem ela é swamp por definição.\u003c/p>\n\u003cp>\u003cstrong>Dizer que o lakehouse elimina o data warehouse.\u003c/strong> Muitas empresas rodam os dois, e para muitas o warehouse puro continua sendo a resposta correta. Absolutismo arquitetural é um sinal de inexperiência.\u003c/p>\n\u003cp>\u003cstrong>Esquecer o catálogo.\u003c/strong> Candidatos descrevem lakehouse como \"Parquet + Iceberg no S3\" e param aí. Sem catálogo não há coordenação de commits nem controle de acesso. É componente de primeira classe.\u003c/p>\n\u003cp>\u003cstrong>Ignorar manutenção de tabela.\u003c/strong> Compactação de arquivos pequenos, expiração de snapshots e limpeza de arquivos órfãos não são opcionais — sem elas, o custo cresce e a performance degrada de forma silenciosa. Mencionar isso espontaneamente sinaliza experiência operacional real.\u003c/p>\n\u003cp>\u003cstrong>Tratar schema-on-read como ausência de schema.\u003c/strong> O schema existe sempre; a questão é se é declarado num lugar ou reimplementado por cada consumidor. Essa confusão é a raiz de metade dos problemas de qualidade em data lakes.\u003c/p>\n\u003cp>\u003cstrong>Confundir Data Mesh com tecnologia.\u003c/strong> Mesh é modelo organizacional. \"Implementamos data mesh com a ferramenta X\" é contradição em termos — ferramenta nenhuma cria ownership de domínio.\u003c/p>\n\u003cp>\u003cstrong>Assumir que time travel é grátis.\u003c/strong> Snapshots retêm arquivos que seriam deletados. Sem política de expiração, o storage cresce sem limite e o metadado degrada o planejamento das queries.\u003c/p>\n\u003cp>\u003cstrong>Superestimar o custo de join em lakehouse moderno.\u003c/strong> Engines com AQE e broadcast join lidam bem com dimensões pequenas. Justificar desnormalização extrema com \"join é caro\" sem qualificar tamanho e distribuição rende contra-argumento.\u003c/p>\n\u003cp>\u003cstrong>Descrever Bronze/Silver/Gold como obrigatório.\u003c/strong> É convenção útil, não lei. Aplicá-la a um pipeline trivial triplica custo e latência sem ganho — e um bom entrevistador vai testar exatamente se você aplica padrão sem pensar.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. Qual a diferença entre data warehouse e data lake?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Warehouse guarda dado estruturado, já limpo e modelado, com schema aplicado na escrita, em storage otimizado e acoplado ao engine — otimizado para BI e SQL, com governança forte. Data lake guarda qualquer tipo de dado, bruto, em object storage barato e aberto, com schema interpretado na leitura — otimizado para flexibilidade, ML e casos que você ainda não antecipou. O warehouse te dá confiança ao custo de rigidez; o lake te dá flexibilidade ao custo de governança que você precisa construir.\u003c/p>\n\u003cp>\u003cem>Follow-up:\u003c/em> \"Qual o principal risco do data lake?\" → Virar data swamp: sem catálogo, schema enforcement, transações ou qualidade, o dado existe mas ninguém sabe o que é nem confia nele. O custo de armazenar é baixo; o custo de não conseguir usar é alto.\u003c/p>"},{"titleHtml":"🟢 P2. O que é schema-on-read e schema-on-write?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Schema-on-write valida a estrutura no momento da ingestão — dado fora do formato é rejeitado, e quem lê tem garantia. Schema-on-read grava qualquer coisa e interpreta a estrutura na hora da consulta. O trade-off é onde o custo de validação cai: na entrada (ingestão mais lenta e rígida, leitura confiável) ou na saída (ingestão rápida, mas cada consumidor paga o custo e pode interpretar diferente). O ponto que costuma passar batido é que schema-on-read não elimina o schema — ele fragmenta a responsabilidade entre N consumidores, e é daí que vem a inconsistência.\u003c/p>"},{"titleHtml":"🟢 P3. O que é um lakehouse?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um padrão arquitetural que junta o storage barato e aberto do data lake com as garantias transacionais do warehouse. Na prática: dados em Parquet no object storage, mais um formato de tabela (Iceberg, Delta, Hudi) que adiciona uma camada de metadados provendo ACID, schema enforcement e evolution, time travel, e upserts/deletes eficientes. O que transforma um monte de arquivos numa tabela de verdade é essa camada de metadados — não o formato dos arquivos.\u003c/p>"},{"titleHtml":"🟡 P4. O que um formato de tabela como Iceberg ou Delta resolve que Parquet puro não resolve?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Parquet é formato de \u003cstrong>arquivo\u003c/strong>: define como um arquivo guarda dados colunares. Não diz nada sobre quais arquivos compõem uma tabela. Sem formato de tabela, \"a tabela\" é o conteúdo de um prefixo do storage, o que gera três problemas: escritas não são atômicas (um job que falha no meio deixa dado parcial visível); não há isolamento (um leitor pode pegar um estado inconsistente); e listar objetos para descobrir o que existe é lento e caro em escala.\u003c/p>\n\u003cp>O formato de tabela mantém um manifesto explícito de quais arquivos formam cada versão da tabela. Isso dá atomicidade (o commit troca o ponteiro de versão), snapshot isolation, time travel, schema evolution segura por ID de coluna, e UPDATE/DELETE eficientes em arquivos imutáveis.\u003c/p>\n\u003cp>\u003cem>Follow-up muito comum:\u003c/em> \"Como se faz DELETE numa tabela Iceberg se Parquet é imutável?\" → Duas estratégias. Copy-on-write reescreve os arquivos que contêm as linhas afetadas e registra a nova lista no commit. Merge-on-read grava um arquivo de delete (ou deletion vector) e aplica o filtro na leitura, com compactação posterior consolidando. CoW encarece a escrita e mantém a leitura rápida; MoR faz o oposto. A escolha depende da razão leitura/escrita da tabela.\u003c/p>"},{"titleHtml":"🟡 P5. O que é hidden partitioning e por que importa?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> No modelo Hive tradicional, a partição é uma coluna física separada (\u003ccode>dt\u003c/code>), e o usuário precisa filtrar explicitamente por ela para haver pruning. Se ele filtra por \u003ccode>event_timestamp\u003c/code> e não por \u003ccode>dt\u003c/code>, a query varre a tabela inteira — uma das maiores fontes de custo acidental em data lakes, porque falha silenciosamente: a query devolve o resultado certo, só que caríssima.\u003c/p>\n\u003cp>Com hidden partitioning, a partição é declarada como uma \u003cstrong>transformação\u003c/strong> de uma coluna real (\u003ccode>day(event_timestamp)\u003c/code>). O usuário filtra pela coluna natural e o engine deriva o pruning sozinho. Além disso, o esquema de particionamento pode evoluir sem reescrever dados históricos, porque cada arquivo carrega no metadado o esquema com que foi escrito.\u003c/p>"},{"titleHtml":"🟡 P6. O que é time travel e para que serve na prática?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Cada commit na tabela gera um snapshot identificável, então você pode consultar o estado em um snapshot ou timestamp anterior. Usos reais: auditoria e compliance (\"o que a tabela dizia no fechamento do mês?\"); reprodutibilidade de ML (treinar de novo exatamente com os dados de então); depuração (\"quando esse número mudou?\"); e rollback quando um pipeline escreveu dado errado — você reverte o ponteiro em vez de reprocessar tudo.\u003c/p>\n\u003cp>\u003cem>Follow-up crítico:\u003c/em> \"Isso não faz o storage crescer indefinidamente?\" → Sim, e por isso existe expiração de snapshots e limpeza de arquivos órfãos, que precisa rodar como manutenção periódica. O trade-off é janela de time travel versus custo de storage — em compliance, a retenção às vezes é obrigatória; no resto, 7 a 30 dias costuma bastar. Esquecer essa manutenção é um problema operacional real: além do custo, o metadado cresce e a listagem de snapshots degrada a performance de planejamento das queries.\u003c/p>"},{"titleHtml":"🟡 P7. Quando você recomendaria um data warehouse em vez de um lakehouse?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Quando o dado é majoritariamente estruturado e relacional, os consumidores são BI e analistas SQL, a equipe é pequena e não quer operar infraestrutura, e previsibilidade de performance e governança importam mais que flexibilidade de formato. Boa parte das empresas que não são de tecnologia está exatamente nesse caso, e montar um lakehouse ali é complexidade sem retorno.\u003c/p>\n\u003cp>Eu iria para lakehouse quando houvesse volume alto de dado semiestruturado ou não estruturado, ML como caso de uso de primeira classe, necessidade de múltiplos engines lendo o mesmo dado, preocupação com lock-in de formato, ou quando o custo de storage no warehouse virasse proibitivo.\u003c/p>\n\u003cp>Na prática a arquitetura mais comum é híbrida, e vale dizer isso: lake para ingestão bruta e processamento pesado, warehouse ou camada Gold servindo BI.\u003c/p>"},{"titleHtml":"🟡 P8. Explique a arquitetura Medallion. Ela é sempre necessária?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Bronze é o dado bruto como veio, append-only, com metadados de ingestão. Silver é o dado limpo, tipado, deduplicado e conformado entre fontes. Gold é o dado agregado e modelado para consumo. O valor central não é a nomenclatura, é ter um ponto de reprocessamento: se a lógica de negócio mudar ou tiver um bug, você reprocessa a partir do Bronze sem depender de a origem ainda ter o histórico — e frequentemente ela não tem.\u003c/p>\n\u003cp>Não é sempre necessária. Cada camada custa storage, compute e latência. Em pipelines simples com origem confiável e transformação leve, colapsar Bronze e Silver é uma decisão legítima. O erro é aplicar a arquitetura como ritual, criando três cópias de um dado que passa por uma transformação trivial.\u003c/p>"},{"titleHtml":"🔴 P9. Copy-on-Write ou Merge-on-Read? Como você decide?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um trade-off entre write amplification e read amplification.\u003c/p>\n\u003cp>CoW reescreve os arquivos de dados que contêm as linhas afetadas. Se você atualiza 100 linhas espalhadas por 100 arquivos de 500 MB, reescreve 50 GB para mudar 100 linhas. Em compensação, a leitura é limpa: os arquivos já refletem o estado final, sem trabalho de merge.\u003c/p>\n\u003cp>MoR grava só o delta (delete file ou deletion vector, mais os novos registros) e resolve o merge na leitura. A escrita é barata e rápida, mas cada leitura paga o custo de aplicar os deltas, e esse custo cresce até a compactação rodar.\u003c/p>\n\u003cp>Decido pela razão leitura/escrita e pela latência exigida. Tabela com ingestão frequente de upserts (CDC de um OLTP, por exemplo) e consulta esporádica: MoR, senão a ingestão não acompanha. Tabela atualizada uma vez por dia e consultada milhares de vezes: CoW, porque o custo de escrita é amortizado e a leitura fica ótima. Se precisar dos dois, MoR com compactação agressiva agendada é o meio-termo — e aí a compactação vira um job de primeira classe, com custo e monitoramento próprios, não um detalhe.\u003c/p>\n\u003cp>\u003cem>Follow-up:\u003c/em> \"O que acontece se a compactação não rodar em MoR?\" → O número de delete files e arquivos pequenos cresce, o planejamento da query fica caro, e a leitura degrada progressivamente. É uma falha silenciosa: nada quebra, só fica cada vez mais lento e caro, até alguém investigar.\u003c/p>"},{"titleHtml":"🔴 P10. Como você garante consistência quando múltiplos writers escrevem na mesma tabela do lakehouse?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Via \u003cstrong>controle de concorrência otimista\u003c/strong> no commit. Cada writer lê a versão atual dos metadados, faz seu trabalho, e tenta commitar uma nova versão condicionada à versão que leu não ter mudado. Se outro writer commitou nesse meio-tempo, o commit falha e o writer precisa revalidar e tentar de novo. Isso exige uma operação atômica de compare-and-swap no ponteiro da tabela, que é justamente o papel do \u003cstrong>catálogo\u003c/strong> — historicamente, object storage puro não oferecia essa garantia, e é por isso que catálogo não é um detalhe opcional da arquitetura.\u003c/p>\n\u003cp>O impacto prático é que conflito não é erro, é o mecanismo normal — mas se muitos writers disputam a mesma tabela, você entra em retry storm e a taxa de commit despenca. As mitigações são particionar a escrita para que writers não toquem os mesmos arquivos, serializar escritas por partição, ou consolidar escritores num único job de merge. Se a operação for append puro, os conflitos são muito mais raros, porque nenhum writer invalida os arquivos do outro — o que é um argumento a favor de desenhar pipelines como append + merge posterior em vez de N writers fazendo upsert concorrente.\u003c/p>"},{"titleHtml":"🔴 P11. O que é Data Mesh e qual sua opinião sobre adotá-lo?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Data Mesh é um modelo organizacional, não uma tecnologia — essa distinção é o principal. Quatro princípios: propriedade por domínio, dado tratado como produto (com dono, SLA, documentação e consumidores como clientes), plataforma self-service, e governança federada e computacional.\u003c/p>\n\u003cp>O problema que ele resolve é real: um time central de dados vira gargalo e não tem contexto de negócio suficiente sobre dezenas de domínios. Mas a adoção exige maturidade que a maioria das empresas não tem: sem plataforma self-service madura e sem governança automatizada, mesh vira descentralização sem contrapesos, o que é o silo de sempre com nome novo — e agora sem ninguém responsável pela consistência entre domínios.\u003c/p>\n\u003cp>Eu recomendaria mesh para organizações grandes, com múltiplos domínios de negócio genuinamente independentes, times de dados dentro dos domínios e um time de plataforma capaz. Para empresas menores, o time central funciona melhor e a sobrecarga de coordenação do mesh não se paga. O que eu adotaria em qualquer tamanho é o princípio de \"dado como produto\": dono explícito, contrato, SLA e documentação — isso tem valor independente da estrutura organizacional.\u003c/p>"},{"titleHtml":"🔴 P12. Sua empresa tem um data lake em S3 que virou um data swamp. Como você resolveria?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Eu trataria como problema de governança, não de tecnologia — trocar de ferramenta sem mudar o processo recria o swamp em seis meses. A sequência que eu seguiria:\u003c/p>\n\u003cp>\u003cstrong>Primeiro, inventário e triagem.\u003c/strong> Descobrir o que existe, quem escreveu, quem lê (logs de acesso do storage são ótimos para isso) e o que ninguém acessa há meses. Uma fração grande de qualquer swamp é dado morto, e deletar ou arquivar reduz o problema antes de resolvê-lo.\u003c/p>\n\u003cp>\u003cstrong>Segundo, catálogo e ownership.\u003c/strong> Todo dataset que fica precisa ter dono nomeado, descrição e classificação de sensibilidade. Sem dono, ninguém corrige nada, e a entropia vence.\u003c/p>\n\u003cp>\u003cstrong>Terceiro, estabelecer zonas com regras diferentes.\u003c/strong> Uma zona bruta append-only onde vale quase tudo, e uma zona curada onde só entra dado com schema declarado, testes de qualidade e dono. Isso evita a paralisia de tentar limpar tudo de uma vez e cria um caminho claro de promoção.\u003c/p>\n\u003cp>\u003cstrong>Quarto, migrar a zona curada para formato de tabela\u003c/strong> (Iceberg, por exemplo), o que traz schema enforcement, transações e time travel, e — importante — impede que o problema volte, porque escrever fora do padrão passa a falhar em vez de simplesmente funcionar mal.\u003c/p>\n\u003cp>\u003cstrong>Quinto, políticas operacionais:\u003c/strong> ciclo de vida e expiração, compactação de arquivos pequenos, e testes de qualidade rodando como parte do pipeline, não como auditoria posterior.\u003c/p>\n\u003cp>\u003cstrong>Sexto, e o que realmente decide o resultado:\u003c/strong> mudar o processo de entrada. Enquanto qualquer pessoa puder despejar arquivos no bucket sem contrato, o swamp se reconstitui. Isso é uma conversa de organização e de incentivos, não de ferramenta — e é a parte que a maioria dos planos de migração ignora.\u003c/p>"},{"titleHtml":"🔴 P13. Iceberg, Delta ou Hudi? Como você escolheria hoje?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Em 2026, para um lakehouse novo e aberto, Iceberg é a escolha padrão — tem a maior neutralidade de fornecedor, suporte amplo de engines e catálogos, e o REST Catalog padronizou a interface, o que reduz lock-in. O spec v3 trouxe deletion vectors, tipo variant, row lineage e tipos geoespaciais.\u003c/p>\n\u003cp>Delta faz sentido quando a empresa já está no ecossistema Databricks: a integração é mais profunda e o UniForm permite que leitores externos consumam a tabela como Iceberg. Hudi mantém vantagem específica em upsert de altíssima frequência, porque seu Merge-on-Read grava apenas as colunas alteradas em vez de a linha inteira, reduzindo write amplification.\u003c/p>\n\u003cp>Dito isso, os três estão convergindo e adotando as ideias uns dos outros, então eu não trataria a escolha como decisão de uma década. O que eu consideraria mais importante que o formato é \u003cstrong>o catálogo\u003c/strong>, porque é ele que arbitra commits, controla acesso e determina quais engines conseguem ler — e trocar de catálogo é mais doloroso que trocar de formato. Também pesaria muito o que os engines que a empresa já usa suportam nativamente, porque interoperabilidade real vale mais que a lista de features no papel.\u003c/p>"},{"titleHtml":"🔴 P14. Warehouse e lakehouse estão convergindo. Isso significa que a distinção acabou?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> A distinção de \u003cem>categoria de produto\u003c/em> está se dissolvendo — Snowflake e BigQuery leem e escrevem Iceberg, Databricks oferece SQL warehouse, e a maioria dos fornecedores atende os dois casos. Mas as perguntas de arquitetura por trás continuam válidas, e são elas que importam:\u003c/p>\n\u003cp>\u003cstrong>Onde o dado fisicamente vive e quem controla o formato?\u003c/strong> Se está em formato aberto no seu bucket, você pode trocar de engine. Se está em formato proprietário, migrar significa exportar tudo. Isso é uma decisão de risco de longo prazo, não de performance.\u003c/p>\n\u003cp>\u003cstrong>Quem paga o compute e como ele escala?\u003c/strong> Modelos de compute desacoplado permitem isolar cargas e pagar por uso; modelos acoplados dão performance mais previsível.\u003c/p>\n\u003cp>\u003cstrong>Onde o schema é aplicado?\u003c/strong> Ainda existe diferença real entre um sistema que rejeita dado fora do contrato e um que aceita tudo.\u003c/p>\n\u003cp>Então eu diria: a distinção comercial acabou, a distinção arquitetural não. E numa entrevista de arquitetura, o que se avalia é se você raciocina sobre essas três perguntas, não se conhece o posicionamento de marketing dos fornecedores.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual o insight central sobre \u003cstrong>schema-on-read\u003c/strong>?","a":["Ele elimina a necessidade de schema","Ele não elimina o schema — move a responsabilidade para a leitura e a fragmenta: cada consumidor pode interpretar o mesmo dado de forma diferente, e é daí que nasce a inconsistência","Ele é sempre superior ao schema-on-write","Ele valida os dados na ingestão"],"c":1,"e":"O schema sempre existe; a questão é se é declarado e aplicado num lugar só (on-write) ou reimplementado N vezes (on-read). É por isso que o lakehouse reconsolida o schema na camada de tabela."},{"n":"🟢","levelName":"basico","q":"O que um \u003cstrong>formato de tabela\u003c/strong> (Iceberg, Delta) resolve que Parquet puro não resolve?","a":["Compressão colunar mais eficiente","Um manifesto explícito de quais arquivos compõem cada versão da tabela — dando atomicidade, snapshot isolation, time travel, schema evolution segura e UPDATE/DELETE sobre arquivos imutáveis","Leitura vetorizada na CPU","Suporte a dados aninhados"],"c":1,"e":"Parquet é formato de arquivo; Iceberg/Delta são metadados por cima dele (Iceberg usa Parquet). Sem manifesto, a tabela é o que está no prefixo do S3: escrita parcial visível e listagem cara."},{"n":"🟡","levelName":"intermediario","q":"\u003cstrong>Copy-on-Write vs Merge-on-Read\u003c/strong>: como decidir?","a":["CoW para tudo — MoR é legado","Pela razão leitura/escrita: CoW encarece a escrita (reescreve arquivos) e mantém leitura limpa — bom para tabelas muito lidas; MoR grava deltas baratos e paga na leitura até compactar — bom para upserts frequentes","MoR para tudo — CoW é legado","Pelo tamanho da tabela: CoW para pequenas, MoR para grandes"],"c":1,"e":"É write amplification versus read amplification. Em MoR, a compactação vira job de primeira classe — sem ela, delete files se acumulam e a leitura degrada silenciosamente."},{"n":"🟡","levelName":"intermediario","q":"O que é \u003cstrong>hidden partitioning\u003c/strong> (Iceberg) e que problema resolve?","a":["Esconder partições sensíveis de usuários sem permissão","A partição é declarada como transformação de uma coluna real (day(event_ts)); o usuário filtra pela coluna natural e o pruning acontece sozinho — no modelo Hive, esquecer de filtrar pela coluna de partição varria a tabela inteira","Particionar automaticamente pela coluna de maior cardinalidade","Criptografar os diretórios de partição"],"c":1,"e":"A falha do modelo Hive é silenciosa: a query devolve o resultado certo, só que caríssima. O Iceberg também permite partition evolution sem reescrever o histórico."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>time travel não é grátis\u003c/strong>?","a":["Porque cada consulta ao passado reprocessa a tabela inteira","Porque snapshots retêm arquivos que seriam deletados: sem expiração de snapshots e limpeza de órfãos, o storage cresce sem limite e o metadado degrada o planejamento das queries","Porque exige uma réplica completa da tabela","Porque bloqueia escritas durante a consulta histórica"],"c":1,"e":"Expiração de snapshots e compactação são manutenção obrigatória de lakehouse. A janela de retenção é um trade-off entre custo e necessidade (compliance às vezes obriga reter)."},{"n":"🟡","levelName":"intermediario","q":"Qual o papel do \u003cstrong>catálogo\u003c/strong> num lakehouse com múltiplos writers?","a":["Apenas documentar as tabelas para usuários","Arbitrar os commits: o controle de concorrência otimista exige um compare-and-swap atômico no ponteiro da tabela, que o object storage puro historicamente não oferecia — além de concentrar acesso e governança","Comprimir os metadados do Iceberg","Substituir o formato de tabela"],"c":1,"e":"Sem catálogo, dois writers podem sobrescrever o trabalho um do outro. Conflito de commit não é erro, é o mecanismo normal — mas muitos writers na mesma tabela geram retry storm."},{"n":"🟡","levelName":"intermediario","q":"A arquitetura \u003cstrong>Medallion\u003c/strong> (Bronze/Silver/Gold) é obrigatória?","a":["Sim — é o padrão da indústria e deve ser sempre aplicada","Não: o valor real é ter um ponto de reprocessamento (Bronze bruto); cada camada custa storage, compute e latência, e em pipelines simples colapsar camadas é legítimo","Sim, por exigência dos formatos de tabela","Não, porque foi substituída pelo Data Vault"],"c":1,"e":"O erro é adotar a arquitetura como ritual, triplicando o custo de um dado que passa por transformação trivial. Se a lógica mudar e você só tiver o dado final, dependerá de a origem ainda ter o histórico."},{"n":"🔴","levelName":"avancado","q":"O que é o \u003cstrong>Data Mesh\u003c/strong>, essencialmente?","a":["Uma tecnologia de malha de serviços para dados","Um modelo organizacional: propriedade por domínio, dado como produto, plataforma self-service e governança federada computacional — não é uma ferramenta","Um formato de tabela concorrente do Iceberg","Uma topologia de rede para clusters de dados"],"c":1,"e":"Implementamos data mesh com a ferramenta X é contradição em termos. Sem plataforma madura e governança automatizada, mesh vira descentralização sem contrapesos — o silo de sempre com nome novo."}]},{"id":"03","fullTitle":"03 — ETL vs ELT, Orquestração, Idempotência e Reprocessamento","shortTitle":"ETL vs ELT, Orquestração, Idempotência e Reprocessamento","subtitle":"ETL vs ELT · Idempotência · Backfill · Reprocessamento · CDC · Full load vs incremental · Watermarks de ingestão","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-etl-vs-elt-a-mudança-de-ordem-e-o-porquê\">1.1 ETL vs ELT: a mudança de ordem e o porquê\u003c/h3>\n\u003cp>\u003cstrong>ETL (Extract, Transform, Load)\u003c/strong>: extrai da origem, transforma num servidor intermediário, carrega o resultado já pronto no destino.\u003c/p>\n\u003cp>\u003cstrong>ELT (Extract, Load, Transform)\u003c/strong>: extrai da origem, carrega o dado bruto no destino, e transforma \u003cstrong>dentro\u003c/strong> do destino usando o poder computacional dele.\u003c/p>\n\u003cp>A diferença não é só a ordem das letras. É uma consequência direta da economia de nuvem:\u003c/p>\n\u003cp>No mundo ETL clássico, o warehouse era caro e de capacidade fixa. Fazia sentido comprar um servidor de ETL separado (Informatica, DataStage, SSIS), transformar lá, e só carregar o resultado final — porque cada ciclo de CPU no warehouse era escasso e caro.\u003c/p>\n\u003cp>Com warehouses e lakehouses em nuvem, o compute é elástico e desacoplado do storage. Ficou mais barato e mais simples carregar tudo bruto e transformar lá dentro com SQL, escalando sob demanda. Isso é o que viabilizou ferramentas como dbt e o padrão moderno.\u003c/p>\n\u003cp>\u003cstrong>Vantagens do ELT:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>O dado bruto fica disponível.\u003c/strong> Se a regra de transformação estava errada, ou se aparece uma pergunta nova, você reprocessa a partir do bruto que já está no destino — sem reler da origem, que pode não ter mais o histórico ou pode não suportar a carga.\u003c/li>\u003cli>\u003cstrong>Transformações em SQL\u003c/strong>, acessível a mais gente que um framework proprietário, versionável em Git, testável.\u003c/li>\u003cli>\u003cstrong>Escala elástica\u003c/strong>: você usa o mesmo motor que já paga para consultas.\u003c/li>\u003cli>Separação clara entre ingestão (movimentação, responsabilidade do engenheiro de dados) e transformação (lógica de negócio, frequentemente do analytics engineer).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Quando ETL ainda faz sentido:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Dados sensíveis\u003c/strong> que não podem ser carregados brutos no destino por questão regulatória. Mascaramento, tokenização e anonimização precisam acontecer \u003cstrong>antes\u003c/strong> — em ELT, o PII entra no warehouse e você depende de controle de acesso, o que pode não satisfazer o regulador.\u003c/li>\u003cli>\u003cstrong>Redução de volume\u003c/strong>: se a origem gera 10 TB/dia e o negócio só precisa de agregados, filtrar antes economiza muito storage e ingestão.\u003c/li>\u003cli>\u003cstrong>Transformações que SQL não expressa bem\u003c/strong>: parsing complexo, chamadas a APIs de enriquecimento, aplicação de modelo de ML, processamento de imagem/texto.\u003c/li>\u003cli>\u003cstrong>Destino sem capacidade de transformação\u003c/strong> (um sistema legado, um banco pequeno).\u003c/li>\u003cli>\u003cstrong>Streaming\u003c/strong>, onde a transformação acontece em trânsito por natureza.\u003c/li>\u003c/ul>\n\u003cp>Na prática, arquiteturas reais são \u003cstrong>híbridas\u003c/strong>: um pouco de transformação leve na ingestão (tipagem, mascaramento de PII, deduplicação básica) e o grosso da lógica de negócio no destino. Responder \"ELT é o moderno, ETL é legado\" é raso e é contra-argumentável em dois segundos com o caso de PII.\u003c/p>\n\u003cp>Uma variação que vale conhecer: \u003cstrong>EtLT\u003c/strong> (com t minúsculo), que descreve exatamente esse híbrido — uma transformação mínima e obrigatória antes do load, e a transformação de negócio depois.\u003c/p>\n\u003cp>\u003cstrong>Reverse ETL\u003c/strong> é o movimento oposto: levar dados do warehouse \u003cstrong>de volta\u003c/strong> para sistemas operacionais (CRM, ferramenta de marketing, sistema de suporte). Existe porque as métricas mais valiosas (LTV, propensão de churn, segmento) são calculadas no warehouse mas precisam ser acionáveis onde as pessoas trabalham. Vale mencionar, mostra que você conhece o ciclo completo.\u003c/p>\n\u003ch3 id=\"h-1-2-idempotência-o-conceito-mais-importante-do-arquivo\">1.2 Idempotência — o conceito mais importante do arquivo\u003c/h3>\n\u003cp>\u003cstrong>Definição:\u003c/strong> uma operação é idempotente quando executá-la N vezes produz o mesmo resultado que executá-la uma vez.\u003c/p>\n\u003cp>\u003cstrong>Por que é o conceito central de engenharia de dados:\u003c/strong> porque falhas são certas. Um job vai falhar no meio, uma máquina vai morrer, alguém vai clicar em \"retry\", o orquestrador vai reexecutar uma tarefa por timeout de rede quando ela na verdade tinha concluído. Se o seu pipeline não é idempotente, cada uma dessas situações corrompe o dado — e o pior é que corrompe \u003cstrong>silenciosamente\u003c/strong>, porque os números continuam saindo, só que duplicados.\u003c/p>\n\u003cp>Sem idempotência, a única resposta a uma falha é intervenção manual: alguém precisa investigar o que foi escrito, apagar seletivamente, e reprocessar. Com idempotência, a resposta é \"roda de novo\", e isso é o que permite automatizar retries, backfills e recuperação de desastre.\u003c/p>\n\u003cp>\u003cstrong>O que quebra idempotência:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ccode>INSERT\u003c/code> puro sem chave de deduplicação: rodar duas vezes duplica tudo.\u003c/li>\u003cli>\u003ccode>UPDATE saldo = saldo + valor\u003c/code>: acumulativo, portanto não idempotente por definição.\u003c/li>\u003cli>Uso de \u003ccode>now()\u003c/code> ou \u003ccode>current_date\u003c/code> dentro da lógica: o resultado depende de \u003cem>quando\u003c/em> você rodou, então reexecutar amanhã produz resultado diferente.\u003c/li>\u003cli>Sequences e auto-increment que geram IDs novos a cada execução.\u003c/li>\u003cli>Consumo de fila com efeito colateral externo (enviar e-mail, chamar API que cobra).\u003c/li>\u003cli>Escrita em append num arquivo sem particionamento determinístico.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Como construir idempotência — em ordem de robustez:\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1. Escrita particionada com overwrite determinístico.\u003c/strong> O padrão mais usado e o mais simples de explicar. Cada execução processa uma janela de tempo bem definida e \u003cstrong>sobrescreve exatamente a partição correspondente\u003c/strong>. Rodar de novo reescreve a mesma partição com o mesmo conteúdo. É por isso que a maioria dos pipelines de batch particiona por data: a partição é a unidade de idempotência. Em SQL/Spark, isso é \u003ccode>INSERT OVERWRITE\u003c/code> na partição, ou \u003ccode>replaceWhere\u003c/code> / overwrite dinâmico de partição.\u003c/p>\n\u003cp>\u003cstrong>2. MERGE / UPSERT com chave de negócio.\u003c/strong> Em vez de inserir, você faz merge por uma chave natural: se a linha existe, atualiza; se não, insere. Rodar duas vezes atualiza para o mesmo valor. Exige que o destino suporte merge (warehouses modernos e formatos de tabela suportam).\u003c/p>\n\u003cp>\u003cstrong>3. Deduplicação por chave de idempotência (idempotency key).\u003c/strong> Cada registro carrega um identificador único e estável (um \u003ccode>event_id\u003c/code> gerado na origem, ou um hash determinístico do conteúdo + timestamp). A escrita ignora registros cujo ID já existe. Isso protege inclusive contra duplicação na origem.\u003c/p>\n\u003cp>\u003cstrong>4. Transação atômica ou padrão write-audit-publish.\u003c/strong> Você escreve num local temporário, valida, e só então \"publica\" atomicamente (troca de ponteiro, rename de diretório, commit de transação). Se falhar antes do publish, nada ficou visível. Formatos de tabela transacionais dão isso de graça.\u003c/p>\n\u003cp>\u003cstrong>Ponto crucial que quase ninguém menciona espontaneamente:\u003c/strong> idempotência exige que o job seja \u003cstrong>determinístico em relação a uma janela de tempo passada como parâmetro\u003c/strong>, não em relação ao relógio. O job deve receber a data lógica de execução como argumento e usá-la em toda a lógica. Se você usa \u003ccode>current_date\u003c/code> dentro do job, ele não é reexecutável no passado, e portanto backfill é impossível. Isso é o que Airflow chama de data interval (antigamente \u003ccode>execution_date\u003c/code>), e a confusão em torno disso é fonte inesgotável de bugs.\u003c/p>\n\u003ch3 id=\"h-1-3-backfill-e-reprocessamento\">1.3 Backfill e reprocessamento\u003c/h3>\n\u003cp>\u003cstrong>Backfill\u003c/strong> é preencher dados de períodos passados: ou porque o pipeline é novo e precisa de histórico, ou porque houve uma janela de falha, ou porque a lógica mudou e o histórico precisa refletir a nova regra.\u003c/p>\n\u003cp>\u003cstrong>Reprocessamento\u003c/strong> é reexecutar um período já processado, tipicamente porque havia bug ou porque a origem corrigiu dados retroativamente.\u003c/p>\n\u003cp>Tecnicamente, os dois são a mesma operação, e ambos dependem inteiramente de idempotência. Se o pipeline é idempotente e parametrizado por janela, backfill é \"rode as datas de X a Y\". Se não é, backfill é um projeto.\u003c/p>\n\u003cp>\u003cstrong>O que considerar num backfill de verdade:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Custo e concorrência.\u003c/strong> Reprocessar 2 anos de dados diários são 730 execuções. Rodar todas em paralelo pode derrubar a origem, estourar cota de compute ou custar uma fortuna. Rodar em série pode levar semanas. Airflow, por exemplo, tem \u003ccode>max_active_runs\u003c/code> justamente para isso. A resposta boa menciona controle explícito de paralelismo.\u003c/li>\u003cli>\u003cstrong>Ordem e dependências.\u003c/strong> Se o pipeline tem estado que depende do período anterior (saldo acumulado, SCD Tipo 2), você \u003cstrong>não pode\u003c/strong> rodar as datas em paralelo — precisa de ordem cronológica. Se cada dia é independente, pode paralelizar. Identificar em qual caso você está é parte da resposta.\u003c/li>\u003cli>\u003cstrong>Impacto na origem.\u003c/strong> Um backfill que lê o banco de produção 730 vezes pode degradar o sistema operacional. Ler de uma réplica, de um snapshot, ou da camada bruta já ingerida é o caminho.\u003c/li>\u003cli>\u003cstrong>Downstream.\u003c/strong> Reprocessar uma tabela invalida tudo que depende dela. Você precisa saber o lineage e decidir se propaga o reprocessamento em cascata, e como avisa os consumidores.\u003c/li>\u003cli>\u003cstrong>Visibilidade durante o processo.\u003c/strong> Se você sobrescreve partições enquanto usuários consultam, eles veem estados intermediários inconsistentes. Padrões de mitigação: escrever numa tabela sombra e trocar atomicamente no final; usar transações do formato de tabela; ou fazer o backfill em janela de baixo uso.\u003c/li>\u003cli>\u003cstrong>Backfill de código novo vs dado novo.\u003c/strong> Se você mudou a lógica, precisa decidir se o histórico é reescrito com a nova regra (relatórios antigos vão mudar — pode ser inaceitável para dado financeiro já reportado) ou se a nova regra vale só dali para frente. Essa é uma pergunta de negócio, e levantá-la é sinal de senioridade.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Padrão de reprocessamento seguro (write-audit-publish):\u003c/strong> escreva o resultado numa localização temporária; rode as validações de qualidade contra ela; se passar, publique atomicamente; se falhar, aborte sem ter afetado nada visível. Esse padrão resolve simultaneamente atomicidade e qualidade, e é um ótimo nome para citar.\u003c/p>\n\u003ch3 id=\"h-1-4-full-load-vs-incremental\">1.4 Full load vs incremental\u003c/h3>\n\u003cp>\u003cstrong>Full load (snapshot completo)\u003c/strong>: lê tudo da origem e sobrescreve o destino a cada execução.\u003c/p>\n\u003cul>\u003cli>\u003cem>A favor:\u003c/em> simples, naturalmente idempotente, imune a mudanças perdidas, autocorretivo (um erro se conserta sozinho na próxima carga).\u003c/li>\u003cli>\u003cem>Contra:\u003c/em> custo proporcional ao tamanho total, não ao volume de mudança; inviável acima de certo tamanho; não captura estados intermediários (se um registro mudou duas vezes entre cargas, você só vê o último); e não detecta deleções a menos que você compare.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Carga incremental\u003c/strong>: lê só o que mudou desde a última execução, usando uma coluna de controle (\u003ccode>updated_at\u003c/code>, ID crescente, versão).\u003c/p>\n\u003cul>\u003cli>\u003cem>A favor:\u003c/em> custo proporcional à mudança; permite janelas de execução mais frequentes.\u003c/li>\u003cli>\u003cem>Contra:\u003c/em> depende de a origem ter uma coluna confiável de atualização, o que frequentemente não é verdade; \u003cstrong>não captura hard deletes\u003c/strong> (a linha some da origem e você nunca fica sabendo); e é vulnerável a registros que chegam fora de ordem ou com timestamp de transação anterior ao commit.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>A armadilha clássica do incremental por \u003ccode>updated_at\u003c/code>\u003c/strong> — vale conhecer em detalhe porque cai como pergunta avançada: se você filtra \u003ccode>WHERE updated_at &amp;gt; ultimo_watermark\u003c/code>, pode perder registros. Uma transação que \u003cstrong>começou\u003c/strong> antes do seu corte mas \u003cstrong>commitou\u003c/strong> depois terá \u003ccode>updated_at\u003c/code> menor que o watermark mas só ficará visível depois — então na próxima execução ela já está \"no passado\" e é ignorada para sempre. Mitigações: usar uma janela com sobreposição (lookback de alguns minutos ou horas, aceitando reprocessar um pouco, o que só funciona se a escrita for idempotente); usar o log de transações via CDC em vez da coluna; ou usar um mecanismo de versão monotônica garantida pelo banco.\u003c/p>\n\u003cp>Outra armadilha: \u003ccode>updated_at\u003c/code> preenchido pela aplicação e não pelo banco pode ter clock skew entre servidores, ou simplesmente não ser atualizado por certos caminhos de código (updates em massa, correções manuais em SQL). Perguntar \"quem preenche essa coluna e ela é confiável em todos os caminhos de escrita?\" é uma das perguntas mais úteis que existem em ingestão.\u003c/p>\n\u003cp>\u003cstrong>Estratégia híbrida muito usada:\u003c/strong> incremental diário + full load semanal ou mensal para reconciliar. Você paga o custo do full ocasionalmente e ganha autocorreção contra deleções perdidas e drift acumulado. Mencionar isso é sinal de experiência prática.\u003c/p>\n\u003ch3 id=\"h-1-5-cdc-change-data-capture\">1.5 CDC — Change Data Capture\u003c/h3>\n\u003cp>CDC captura mudanças no banco de origem lendo o \u003cstrong>log de transações\u003c/strong> (WAL no Postgres, binlog no MySQL, redo log no Oracle) em vez de consultar as tabelas.\u003c/p>\n\u003cp>\u003cstrong>Por que é superior a polling por \u003ccode>updated_at\u003c/code>:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Captura \u003cstrong>todas\u003c/strong> as mudanças, incluindo deletes e updates em massa.\u003c/li>\u003cli>Captura a \u003cstrong>sequência\u003c/strong> de mudanças, não só o estado final — importante quando você precisa de histórico completo.\u003c/li>\u003cli>Impacto mínimo na origem: lê o log, não executa queries pesadas sobre as tabelas.\u003c/li>\u003cli>Latência baixa, viabilizando quase tempo real.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Custos e complicações:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Requer acesso privilegiado ao banco e configuração (nível de log, slot de replicação). Times de infraestrutura frequentemente resistem.\u003c/li>\u003cli>\u003cstrong>Slot de replicação abandonado é um risco operacional sério\u003c/strong>: se o consumidor CDC para e o slot permanece, o banco de origem retém WAL indefinidamente e pode encher o disco, derrubando a produção. É o tipo de detalhe que só quem operou conhece, e citá-lo tem peso.\u003c/li>\u003cli>Snapshot inicial: você precisa de uma carga inicial consistente com o ponto do log de onde vai continuar. Ferramentas como Debezium fazem isso, mas é a parte mais delicada.\u003c/li>\u003cli>Mudança de schema na origem (DDL) precisa ser propagada, e nem sempre é graciosa.\u003c/li>\u003cli>O consumidor precisa lidar com \u003cstrong>ordem\u003c/strong> e com a semântica de \"estado atual\" versus \"sequência de eventos\".\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Padrões de CDC:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Log-based\u003c/strong> (Debezium, ferramentas nativas de cloud): o padrão de ouro.\u003c/li>\u003cli>\u003cstrong>Trigger-based\u003c/strong>: triggers no banco gravam mudanças numa tabela de auditoria. Funciona sem acesso ao log, mas adiciona latência e carga a cada escrita da produção.\u003c/li>\u003cli>\u003cstrong>Query-based / polling\u003c/strong>: o \u003ccode>updated_at\u003c/code> já discutido. Mais simples, menos confiável.\u003c/li>\u003cli>\u003cstrong>Outbox pattern\u003c/strong>: a aplicação escreve, na mesma transação, na tabela de negócio e numa tabela de \"outbox\" de eventos. Um processo lê a outbox e publica. Garante que o evento e a mudança de estado sejam atômicos — resolve o problema de \"escrevi no banco mas falhei ao publicar no Kafka\". É um padrão de arquitetura de aplicação, mas engenheiros de dados precisam conhecer porque frequentemente são eles que pedem para o time de backend implementá-lo.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Duas semânticas de consumo de CDC\u003c/strong>, e confundi-las é erro comum: você pode querer o \u003cstrong>estado atual\u003c/strong> de cada entidade (aplicar as mudanças e manter uma tabela espelho, tipicamente via MERGE) ou o \u003cstrong>histórico de mudanças\u003c/strong> (guardar cada evento como uma linha, append-only, que é a base para SCD Tipo 2 e auditoria). Muitos pipelines precisam dos dois — o histórico como fonte, e o espelho materializado a partir dele.\u003c/p>\n\u003ch3 id=\"h-1-6-orquestração-o-que-é-e-o-que-não-é\">1.6 Orquestração: o que é e o que não é\u003c/h3>\n\u003cp>Um orquestrador coordena \u003cstrong>quando\u003c/strong> e \u003cstrong>em que ordem\u003c/strong> as tarefas rodam, cuida de dependências, retries, alertas e observabilidade. Ele normalmente não faz o processamento pesado — ele dispara e monitora quem faz.\u003c/p>\n\u003cp>Conceitos essenciais:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>DAG (Directed Acyclic Graph)\u003c/strong>: as tarefas e suas dependências, sem ciclos. Aciclicidade importa porque um ciclo tornaria impossível determinar a ordem de execução.\u003c/li>\u003cli>\u003cstrong>Task / operator\u003c/strong>: a unidade de trabalho.\u003c/li>\u003cli>\u003cstrong>Scheduling\u003c/strong>: baseado em tempo (cron) ou em evento (chegada de arquivo, mensagem, atualização de dataset/asset).\u003c/li>\u003cli>\u003cstrong>Retry com backoff\u003c/strong>: reexecução automática em falha, com espera crescente para não martelar um serviço já degradado.\u003c/li>\u003cli>\u003cstrong>SLA e alertas\u003c/strong>: detectar não só falha, mas atraso — um pipeline que \"roda\" mas termina 6 horas atrasado quebra o consumidor tanto quanto um que falha.\u003c/li>\u003cli>\u003cstrong>Sensor\u003c/strong>: espera uma condição externa (arquivo existe, partição pronta, API responde).\u003c/li>\u003cli>\u003cstrong>Backfill\u003c/strong>: reexecutar intervalos passados, discutido acima.\u003c/li>\u003cli>\u003cstrong>Idempotência das tarefas\u003c/strong>: pré-requisito de tudo, porque retry é automático.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Orquestração baseada em tempo vs em dados.\u003c/strong> O modelo clássico agenda por horário e assume que os dados estarão lá (\"roda às 6h, porque a origem termina às 5h\"). Isso é frágil: se a origem atrasa, o pipeline processa dado incompleto e produz resultado errado sem falhar. O modelo orientado a dados dispara quando o dado fica \u003cstrong>pronto\u003c/strong> — dependência declarada sobre datasets/assets, não sobre horário. Airflow 3 formalizou isso com asset-aware scheduling e watchers de fontes externas; Dagster foi construído em torno dessa ideia desde o início. Saber articular esse contraste é uma resposta forte de nível intermediário/avançado.\u003c/p>\n\u003cp>\u003cstrong>Anti-padrões de orquestração:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Fazer processamento pesado dentro do orquestrador em vez de delegá-lo ao engine apropriado. O scheduler não é cluster de processamento.\u003c/li>\u003cli>Um DAG monolítico gigante com centenas de tarefas: falha em cascata, difícil de testar, difícil de reprocessar em parte.\u003c/li>\u003cli>Dependências implícitas por horário (\"roda às 7h porque o outro roda às 6h\") em vez de dependências declaradas.\u003c/li>\u003cli>Passar volumes grandes de dados entre tarefas pelo mecanismo de metadados do orquestrador (XCom no Airflow) em vez de passar referências a storage.\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Dizer que \"ELT substituiu ETL\".\u003c/strong> É contra-argumentável em uma frase: dado com PII que não pode entrar bruto no destino. A resposta correta é que a maior parte das arquiteturas é híbrida.\u003c/p>\n\u003cp>\u003cstrong>Usar \u003ccode>current_date\u003c/code> ou \u003ccode>now()\u003c/code> dentro da lógica do job.\u003c/strong> É a causa raiz número um de pipelines não reprocessáveis. A data lógica tem que ser parâmetro.\u003c/p>\n\u003cp>\u003cstrong>Confundir idempotência com \"não dá erro se rodar de novo\".\u003c/strong> Um \u003ccode>INSERT\u003c/code> que roda duas vezes sem erro não é idempotente — ele duplicou. Idempotência é sobre o \u003cstrong>estado final\u003c/strong>, não sobre ausência de exceção.\u003c/p>\n\u003cp>\u003cstrong>Assumir que \u003ccode>updated_at\u003c/code> captura tudo.\u003c/strong> Não captura hard deletes, pode não ser atualizado por correções manuais ou updates em massa, e sofre o problema de transações longas que commitam depois do watermark. Perguntar \"quem preenche essa coluna e em quais caminhos?\" é o reflexo certo.\u003c/p>\n\u003cp>\u003cstrong>Fazer backfill sem pensar em concorrência e em downstream.\u003c/strong> Disparar 730 execuções em paralelo derruba a origem e/ou explode o custo. E reprocessar sem propagar deixa camadas inconsistentes entre si, o que é pior que o bug original.\u003c/p>\n\u003cp>\u003cstrong>Reescrever o histórico sem perguntar se pode.\u003c/strong> Em contextos financeiros e regulados, números já reportados não podem mudar. Levantar essa questão vale mais que a solução técnica.\u003c/p>\n\u003cp>\u003cstrong>Sobrescrever tabelas em produção enquanto usuários consultam.\u003c/strong> Estados intermediários geram números errados e destroem confiança. Write-audit-publish existe para isso.\u003c/p>\n\u003cp>\u003cstrong>Tratar o orquestrador como engine de processamento.\u003c/strong> Carregar um DataFrame de milhões de linhas dentro de uma task do Airflow em vez de delegar ao warehouse ou ao Spark. O scheduler não é cluster.\u003c/p>\n\u003cp>\u003cstrong>Dependência implícita por horário.\u003c/strong> \"Roda às 7h porque o outro roda às 6h\" não é dependência, é torcida. Declare a dependência ou use um sensor.\u003c/p>\n\u003cp>\u003cstrong>Não monitorar atraso, só falha.\u003c/strong> Um pipeline que termina 6 horas depois do necessário quebra o consumidor tanto quanto um que falha — e não gera alerta nenhum se você só monitora exit code.\u003c/p>\n\u003cp>\u003cstrong>Esquecer o risco operacional do CDC.\u003c/strong> Slot de replicação abandonado retendo WAL até encher o disco da produção é um incidente real e comum. Citá-lo espontaneamente separa quem operou de quem leu.\u003c/p>\n\u003cp>\u003cstrong>Testar transformação só com teste unitário.\u003c/strong> Lógica de negócio muda resultados sutilmente sem quebrar assert nenhum. Diff do output contra a versão anterior é a técnica que realmente pega isso.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. Qual a diferença entre ETL e ELT?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Em ETL a transformação acontece antes do carregamento, num sistema intermediário. Em ELT o dado bruto é carregado no destino e transformado lá dentro. A mudança aconteceu porque o compute em nuvem ficou elástico e barato: não faz mais sentido manter um servidor de transformação separado quando o warehouse escala sob demanda.\u003c/p>\n\u003cp>A vantagem principal do ELT é ter o dado bruto disponível no destino, o que permite reprocessar com lógica nova sem reler da origem. Mas ETL continua necessário em alguns casos — o mais importante é dado sensível que não pode entrar bruto no destino por questão regulatória, onde o mascaramento tem que acontecer antes.\u003c/p>"},{"titleHtml":"🟢 P2. O que é idempotência e por que importa em pipelines?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Uma operação é idempotente quando rodar N vezes dá o mesmo resultado que rodar uma vez. Importa porque falha é certeza: máquina morre, rede cai, alguém clica em retry, o orquestrador reexecuta por timeout. Sem idempotência, cada uma dessas situações duplica ou corrompe dados — e silenciosamente, porque os números continuam saindo.\u003c/p>\n\u003cp>Com idempotência, a resposta a qualquer falha é \"roda de novo\", e isso é o que permite automatizar retry, backfill e recuperação. Na prática eu garanto isso escrevendo por partição com overwrite determinístico, ou usando MERGE por chave de negócio, ou deduplicando por uma chave de idempotência do evento.\u003c/p>\n\u003cp>\u003cem>Follow-up quase certo:\u003c/em> \"Dê um exemplo de operação não-idempotente num pipeline.\" → \u003ccode>INSERT\u003c/code> sem chave de dedup; \u003ccode>UPDATE saldo = saldo + x\u003c/code>; qualquer lógica que use \u003ccode>current_date\u003c/code> internamente, porque o resultado passa a depender de quando você rodou.\u003c/p>"},{"titleHtml":"🟢 P3. O que é um DAG e por que precisa ser acíclico?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um grafo direcionado sem ciclos que representa tarefas e suas dependências. Precisa ser acíclico porque um ciclo tornaria impossível determinar uma ordem válida de execução — a tarefa A esperaria B, que esperaria A. A aciclicidade é o que permite fazer ordenação topológica e decidir o que pode rodar em paralelo.\u003c/p>"},{"titleHtml":"🟢 P4. O que é backfill?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É preencher dados de períodos passados — porque o pipeline é novo e precisa de histórico, porque houve uma janela de falha, ou porque a lógica mudou. Tecnicamente é reexecutar o pipeline para intervalos anteriores, e só funciona se o pipeline for idempotente e parametrizado pela janela de tempo em vez de usar o relógio. Se o job usa \u003ccode>current_date\u003c/code> internamente, backfill é impossível sem alterar o código.\u003c/p>"},{"titleHtml":"🟡 P5. Como você garante idempotência num pipeline de batch diário?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Três decisões combinadas.\u003c/p>\n\u003cp>Primeiro, o job recebe a \u003cstrong>data lógica de processamento como parâmetro\u003c/strong> e usa esse parâmetro em toda a lógica. Nunca \u003ccode>current_date\u003c/code> internamente — senão o job não é reexecutável no passado.\u003c/p>\n\u003cp>Segundo, a \u003cstrong>partição é a unidade de idempotência\u003c/strong>: o job processa a janela daquela data e sobrescreve exatamente a partição correspondente, com \u003ccode>INSERT OVERWRITE\u003c/code> ou equivalente. Rodar duas vezes reescreve a mesma partição com o mesmo conteúdo.\u003c/p>\n\u003cp>Terceiro, se o destino não permite overwrite de partição — por exemplo, uma tabela dimensão com SCD — uso \u003cstrong>MERGE por chave de negócio\u003c/strong>, que é naturalmente idempotente porque atualiza para o mesmo valor.\u003c/p>\n\u003cp>Para robustez extra, especialmente com fontes que podem duplicar, adiciono uma \u003cstrong>chave de idempotência\u003c/strong> por registro e deduplico na escrita.\u003c/p>\n\u003cp>\u003cem>Follow-up:\u003c/em> \"E se a escrita for para um sistema externo que não suporta nada disso, como uma API?\" → Aí eu manteria uma tabela de controle registrando o que já foi enviado, com a chave de idempotência, e consultaria antes de enviar. Se a API suportar idempotency key no header (muitas suportam), uso a nativa. Se nada disso existir, o mínimo é tornar o efeito colateral o último passo e desenhar para at-least-once, deixando explícito para o consumidor que duplicatas podem ocorrer.\u003c/p>"},{"titleHtml":"🟡 P6. Você descobriu que uma transformação estava com bug e precisa reprocessar 6 meses de dados. Como conduz?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Antes de rodar qualquer coisa, quatro perguntas.\u003c/p>\n\u003cp>\u003cstrong>O histórico deve ser reescrito?\u003c/strong> Se são dados financeiros já reportados, mudar o passado pode ser inaceitável — pode ser que a correção só valha dali para frente, com uma nota explicando a quebra de série. Essa é uma decisão de negócio, não minha.\u003c/p>\n\u003cp>\u003cstrong>Quem consome isso?\u003c/strong> Preciso do lineage para saber o que fica inválido a jusante e avisar os donos. Reprocessar uma tabela sem propagar deixa inconsistência entre camadas, que é pior que o bug original.\u003c/p>\n\u003cp>\u003cstrong>Qual o impacto na origem e no custo?\u003c/strong> Se o pipeline relê a origem, 180 execuções podem degradar o sistema operacional. Prefiro reprocessar a partir da camada bruta já ingerida. E limito o paralelismo explicitamente — rodar 180 execuções simultâneas normalmente é pior que rodar 10 por vez.\u003c/p>\n\u003cp>\u003cstrong>Os dias são independentes?\u003c/strong> Se houver estado acumulado ou SCD Tipo 2, tenho que rodar em ordem cronológica, não em paralelo.\u003c/p>\n\u003cp>Na execução, uso write-audit-publish: escrevo numa localização sombra, rodo validações comparando com o resultado antigo (contagens, somas de métricas-chave, distribuições), e só publico atomicamente se passar. Assim os usuários nunca veem estado intermediário, e se algo estiver errado eu descubro antes de publicar.\u003c/p>\n\u003cp>Depois, valido uma amostra manualmente com alguém do negócio, e documento a mudança — inclusive porque alguém vai perguntar daqui a três meses por que os números de março mudaram.\u003c/p>"},{"titleHtml":"🟡 P7. Carga full ou incremental? Como você decide?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Decido pelo tamanho da tabela, pela confiabilidade da coluna de controle e pela necessidade de detectar deleções.\u003c/p>\n\u003cp>Full load é simples, idempotente por natureza e autocorretivo — se um dia der errado, o próximo conserta. Uso enquanto o custo for aceitável, porque a simplicidade vale muito. O limite é quando o volume torna a janela de execução ou o custo inviáveis.\u003c/p>\n\u003cp>Incremental economiza, mas depende de a origem ter uma coluna de atualização confiável, e a primeira pergunta que faço é: quem preenche essa coluna e ela é atualizada em \u003cstrong>todos\u003c/strong> os caminhos de escrita? Correções manuais em SQL e updates em massa frequentemente não a atualizam. Além disso, incremental não captura hard deletes.\u003c/p>\n\u003cp>Na prática, o padrão que uso muito é híbrido: incremental diário para latência e custo, mais um full load semanal ou mensal para reconciliar e capturar deleções e drift.\u003c/p>\n\u003cp>\u003cem>Follow-up avançado esperado:\u003c/em> \"Existe algum risco no incremental por \u003ccode>updated_at\u003c/code> mesmo se a coluna for confiável?\" → Sim, e é sutil: uma transação que começa antes do seu corte e commita depois terá \u003ccode>updated_at\u003c/code> menor que o watermark mas só ficará visível depois — então na execução seguinte ela já está no passado e é ignorada para sempre. Mitigo com uma janela de lookback com sobreposição, aceitando reprocessar um pouco (o que só é seguro porque a escrita é idempotente), ou migrando para CDC baseado em log.\u003c/p>"},{"titleHtml":"🟡 P8. O que é CDC e quando você o usaria em vez de polling?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> CDC lê o log de transações do banco (WAL, binlog, redo log) em vez de consultar as tabelas. Usaria quando eu precisasse de latência baixa, quando precisasse capturar deletes e updates em massa que polling perde, quando a origem não tem coluna de atualização confiável, ou quando queries de extração estivessem impactando a produção — CDC lê o log, não sobrecarrega as tabelas.\u003c/p>\n\u003cp>Os custos são reais: exige acesso privilegiado e configuração do banco, o snapshot inicial precisa ser consistente com o ponto do log onde a captura continua, e mudanças de DDL na origem precisam ser tratadas. E há um risco operacional que vale mencionar: um slot de replicação abandonado faz o banco de origem reter WAL indefinidamente e pode encher o disco da produção. Isso precisa de monitoramento explícito.\u003c/p>\n\u003cp>\u003cem>Follow-up:\u003c/em> \"Qual a diferença entre consumir CDC como estado atual e como histórico?\" → São semânticas diferentes e ambas são válidas. Materializar o estado atual significa aplicar as mudanças via MERGE numa tabela espelho — bom para quem quer \"como está agora\". Guardar o histórico significa append-only de cada evento de mudança — é o que permite auditoria e é a base natural para construir SCD Tipo 2. Muitos pipelines mantêm os dois: o histórico como fonte de verdade e o espelho derivado dele.\u003c/p>"},{"titleHtml":"🟡 P9. O que é o outbox pattern e que problema resolve?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Resolve o problema do dual write: quando a aplicação precisa gravar no banco e publicar um evento numa fila, não há transação que cubra os dois sistemas. Se o banco commita e a publicação falha, o evento se perde; se publica e o banco faz rollback, você anunciou algo que não aconteceu.\u003c/p>\n\u003cp>O outbox resolve escrevendo, \u003cstrong>na mesma transação do banco\u003c/strong>, tanto na tabela de negócio quanto numa tabela de eventos (\"outbox\"). A transação garante atomicidade local. Depois, um processo separado — tipicamente via CDC sobre a tabela outbox — lê e publica os eventos. Se a publicação falhar, ela é retentada, porque o evento está durável no banco.\u003c/p>\n\u003cp>É um padrão do lado da aplicação, mas engenheiro de dados precisa conhecer porque frequentemente é quem identifica o problema e pede ao time de backend para implementá-lo. E porque explica por que eventos \"perdidos\" aparecem em integrações ingênuas.\u003c/p>"},{"titleHtml":"🟡 P10. Como você desenharia um pipeline para que ele seja fácil de reprocessar?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Cinco princípios.\u003c/p>\n\u003cp>\u003cstrong>Parametrizar pela janela de tempo\u003c/strong>, nunca usar o relógio dentro da lógica. Isso é o que torna reexecução no passado possível.\u003c/p>\n\u003cp>\u003cstrong>Particionar a saída pela mesma janela\u003c/strong>, para que a unidade de reprocessamento e a unidade de escrita coincidam. Assim reprocessar um dia afeta exatamente uma partição.\u003c/p>\n\u003cp>\u003cstrong>Preservar o dado bruto numa camada imutável.\u003c/strong> Se você só tem o resultado final, um bug de lógica exige reler da origem — que pode ter mudado, ter perdido histórico ou não suportar a carga.\u003c/p>\n\u003cp>\u003cstrong>Manter as tarefas pequenas e independentes\u003c/strong>, para reprocessar uma parte sem reprocessar tudo, e para que uma falha não invalide horas de trabalho.\u003c/p>\n\u003cp>\u003cstrong>Tornar as transformações determinísticas\u003c/strong>: nada de valores aleatórios, ordenação instável, ou dependência de estado externo mutável. Se o mesmo input não produz o mesmo output, você não consegue nem validar se o reprocessamento funcionou.\u003c/p>\n\u003cp>E como prática operacional, versionar o código junto com o dado produzido — saber qual versão da lógica gerou qual partição é o que torna possível decidir o que precisa ser reprocessado.\u003c/p>"},{"titleHtml":"🔴 P11. Seu pipeline diário depende de uma origem que às vezes atrasa. Se ele roda no horário, processa dado incompleto. Como resolve?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O problema raiz é que a dependência está expressa em \u003cstrong>tempo\u003c/strong> quando deveria estar expressa em \u003cstrong>dados\u003c/strong>. \"Roda às 6h porque a origem termina às 5h\" é uma suposição não verificada, e quando ela quebra o pipeline não falha — ele produz resultado errado silenciosamente, que é o pior modo de falha possível.\u003c/p>\n\u003cp>A solução em camadas:\u003c/p>\n\u003cp>\u003cstrong>Curto prazo:\u003c/strong> um sensor ou check de prontidão que verifica a condição real (o arquivo existe, a partição está completa, a contagem bate com um marcador de controle) antes de processar, com timeout e alerta. O pipeline espera em vez de processar lixo.\u003c/p>\n\u003cp>\u003cstrong>Melhor:\u003c/strong> a origem publica um sinal explícito de conclusão — um marcador de sucesso, uma linha numa tabela de controle, um evento. O consumidor reage ao sinal. Isso transforma a dependência temporal em dependência de dados de verdade.\u003c/p>\n\u003cp>\u003cstrong>Estrutural:\u003c/strong> usar orquestração orientada a dados, onde o downstream declara dependência sobre o dataset e é disparado quando ele é atualizado. Airflow 3 formalizou isso com asset-aware scheduling e watchers de fontes externas; Dagster foi desenhado assim desde o início.\u003c/p>\n\u003cp>Complementarmente: um \u003cstrong>SLA de completude\u003c/strong> monitorado (alertar se a origem não chegou até X), e um \u003cstrong>teste de qualidade que detecta incompletude\u003c/strong> (volume muito abaixo do esperado para o dia da semana) que \u003cstrong>falha o pipeline\u003c/strong> em vez de deixar passar. Processar dado incompleto e publicá-lo é pior do que atrasar — e essa priorização deve ser explícita e acordada com o negócio, não uma decisão técnica solitária.\u003c/p>"},{"titleHtml":"🔴 P12. Você precisa fazer backfill de 2 anos de dados diários. O pipeline lê de uma API com rate limit e escreve numa tabela que usuários consultam. Descreva sua abordagem.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Três restrições distintas, e cada uma exige uma decisão.\u003c/p>\n\u003cp>\u003cstrong>Rate limit da API.\u003c/strong> Não posso paralelizar livremente. Preciso de controle explícito de concorrência e de backoff exponencial com jitter em caso de 429. Estimaria o tempo total primeiro: se a 730 execuções com o limite dado o backfill leva três semanas, isso muda o plano — talvez negocie um limite temporário maior, talvez a API tenha endpoint de exportação em lote, talvez exista um dump histórico. Perguntar isso antes de começar economiza semanas.\u003c/p>\n\u003cp>\u003cstrong>Concorrência com o uso normal.\u003c/strong> O backfill não pode competir com a execução diária corrente nem consumir toda a cota. Eu daria prioridade à execução do dia (o negócio precisa do dado fresco) e rodaria o backfill em capacidade residual, provavelmente em janela de baixo uso.\u003c/p>\n\u003cp>\u003cstrong>Visibilidade para os usuários.\u003c/strong> Escrever partição por partição enquanto usuários consultam expõe estados parciais. Escreveria numa tabela sombra e faria a troca atômica ao final, ou publicaria partição por partição só se cada partição for autocontida e os usuários filtrarem por data — o que ainda assim significa que agregações do período inteiro ficam erradas durante o processo. Se o formato de tabela suportar transações, agrupo os commits.\u003c/p>\n\u003cp>\u003cstrong>Além disso:\u003c/strong> checkpoint de progresso persistido, para que uma falha na data 400 não obrigue a recomeçar do zero; idempotência por partição, para poder repetir qualquer intervalo; e validação incremental — comparar volumes e métricas-chave por período contra o esperado enquanto avança, em vez de descobrir no final que os primeiros seis meses vieram vazios porque a API paginava diferente para datas antigas.\u003c/p>\n\u003cp>Por fim, definiria explicitamente um critério de sucesso e um plano de rollback antes de começar.\u003c/p>"},{"titleHtml":"🔴 P13. Como você lida com um pipeline que precisa ser idempotente mas escreve num sistema externo com efeito colateral, como enviar notificações?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Efeito colateral externo é o caso em que idempotência verdadeira normalmente não existe do lado do pipeline, então a estratégia é empurrar a responsabilidade para onde ela pode ser resolvida.\u003c/p>\n\u003cp>\u003cstrong>Primeiro, separar as fases.\u003c/strong> Computo o que deve ser enviado e persisto isso numa tabela de \"intenções\", com uma chave de idempotência determinística por notificação. Essa fase é totalmente idempotente e reprocessável.\u003c/p>\n\u003cp>\u003cstrong>Segundo, um processo de entrega separado\u003c/strong> lê as intenções não entregues, envia, e marca como entregue. Se ele falhar após enviar e antes de marcar, haverá duplicata — isso é inerente, é a mesma limitação do problema de dual write.\u003c/p>\n\u003cp>\u003cstrong>Terceiro, deduplicação no destino.\u003c/strong> Se o serviço externo aceitar uma idempotency key (muitos aceitam), o próprio serviço descarta a repetição, e aí você tem exactly-once efetivo. Se não aceitar, a alternativa é um filtro de deduplicação do meu lado, com janela de retenção, aceitando que ele é probabilístico em falhas extremas.\u003c/p>\n\u003cp>\u003cstrong>E o mais importante: desenhar para at-least-once e tornar a duplicata inofensiva.\u003c/strong> Uma notificação repetida é ruim mas tolerável; uma cobrança repetida não é. Se o efeito colateral for financeiro ou irreversível, a chave de idempotência no destino deixa de ser opcional e vira requisito de integração — e isso é uma conversa a ter com o time dono do serviço antes de construir o pipeline, não depois.\u003c/p>"},{"titleHtml":"🔴 P14. Qual a diferença prática entre orquestração baseada em tempo e baseada em dados? Quando o modelo por tempo é suficiente?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> No modelo por tempo, cada pipeline tem um horário e assume que suas dependências terminaram. A dependência é implícita e não verificada, então quando a premissa quebra o sistema falha silenciosamente — processa dado incompleto e publica.\u003c/p>\n\u003cp>No modelo por dados, o pipeline declara dependência sobre datasets e é disparado quando eles são atualizados. As dependências ficam explícitas, o grafo de lineage vem de graça, e atrasos se propagam corretamente em vez de produzir dado errado.\u003c/p>\n\u003cp>O modelo por tempo continua suficiente quando: a fonte é genuinamente periódica e confiável (um extrato bancário que chega sempre às 3h com SLA contratual); o pipeline é a raiz do grafo e não depende de nada interno; ou o custo de processar dado incompleto é baixo e autocorretivo na execução seguinte.\u003c/p>\n\u003cp>Na prática, o mais comum é híbrido: um gatilho de tempo como piso (garantindo que o pipeline roda pelo menos uma vez por período, mesmo que nada dispare) combinado com sensores ou dependências de dados que garantem que ele só processa quando há o que processar. E, independentemente do modelo, um SLA monitorado — porque a pergunta que importa para o consumidor não é \"rodou?\" mas \"o dado está lá e está correto no horário que eu preciso?\".\u003c/p>"},{"titleHtml":"🔴 P15. Como você versionaria e testaria transformações de dados?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Trato transformação como software, com as adaptações que dados exigem.\u003c/p>\n\u003cp>\u003cstrong>Versionamento:\u003c/strong> código em Git, com revisão obrigatória. E — o ponto que dados adicionam — registrar qual versão do código produziu cada partição de saída, porque sem isso você não consegue decidir o que precisa de reprocessamento quando descobre um bug.\u003c/p>\n\u003cp>\u003cstrong>Testes em três níveis.\u003c/strong> Testes unitários da lógica pura com dados fabricados pequenos, cobrindo casos de borda (NULL, duplicata, valor fora de domínio) — rápidos, rodam em CI. Testes de contrato/schema, verificando que a entrada tem as colunas e tipos esperados, e falhando na ingestão em vez de deixar o erro se propagar. E testes de qualidade sobre o resultado real: unicidade de chave, integridade referencial contra as dimensões, faixas de valores, volume dentro do esperado para o período, e reconciliação contra a origem em métricas-chave.\u003c/p>\n\u003cp>\u003cstrong>Ambientes:\u003c/strong> dev/staging com dado representativo — anonimizado se houver PII, e amostrado de forma a preservar casos raros, porque uma amostra aleatória some justamente com o que quebra.\u003c/p>\n\u003cp>\u003cstrong>Antes de mergear mudança em transformação existente\u003c/strong>, rodar em paralelo e fazer \u003cstrong>diff do resultado\u003c/strong> contra a versão atual. É a técnica mais eficaz que existe para transformação de dados, porque testes unitários passam enquanto a lógica de negócio muda sutilmente em 3% das linhas — e é exatamente isso que quebra a confiança dos usuários.\u003c/p>\n\u003cp>\u003cstrong>Em produção\u003c/strong>, testes de qualidade rodando como parte do pipeline, com o padrão write-audit-publish: se a validação falha, o dado não é publicado. Detectar depois que publicou já é tarde: alguém tomou decisão com o número errado.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"O que significa um pipeline ser \u003cstrong>idempotente\u003c/strong>?","a":["Ele nunca gera erro ao rodar de novo","Executá-lo N vezes produz o mesmo estado final que executá-lo uma vez — o que torna retry, backfill e recuperação seguros","Ele roda em tempo constante","Ele não depende de nenhuma fonte externa"],"c":1,"e":"Cuidado com a opção A: um INSERT que roda duas vezes sem erro não é idempotente — duplicou. Idempotência é sobre o estado final, não sobre ausência de exceção."},{"n":"🟢","levelName":"basico","q":"Qual a principal vantagem do \u003cstrong>ELT\u003c/strong> sobre o ETL clássico?","a":["Elimina a necessidade de governança","O dado bruto fica disponível no destino: se a regra estava errada ou surge pergunta nova, você reprocessa sem reler da origem — que pode não ter mais o histórico","É sempre mais barato em qualquer cenário","Dispensa orquestração"],"c":1,"e":"E ETL ainda se justifica: PII que não pode entrar bruta no destino, redução de volume, transformações que SQL não expressa. Dizer que ELT substituiu ETL é contra-argumentável em uma frase."},{"n":"🟡","levelName":"intermediario","q":"Por que usar \u003cstrong>current_date dentro da lógica do job\u003c/strong> quebra o backfill?","a":["Porque a função é lenta em escala","Porque o job deixa de ser reexecutável no passado: todas as execuções do backfill processariam o dia de hoje — a data lógica precisa ser parâmetro","Porque fusos horários mudam o resultado","Porque o orquestrador não consegue fazer parse da função"],"c":1,"e":"É a causa raiz número um de pipelines não reprocessáveis. O job deve receber a janela (data_interval_start/end) como argumento e usá-la em toda a lógica, inclusive na escolha da partição de escrita."},{"n":"🟡","levelName":"intermediario","q":"Qual o risco sutil do incremental por \u003cstrong>updated_at &gt; watermark\u003c/strong>, mesmo com a coluna confiável?","a":["A coluna pode ter timezone errado","Uma transação que começou antes do corte mas commitou depois tem updated_at menor que o watermark e só fica visível depois — na próxima execução já está no passado e é perdida para sempre","O índice da coluna pode fragmentar","O watermark pode ser negativo"],"c":1,"e":"Mitigações: janela de lookback com sobreposição (só segura porque a escrita é idempotente) ou migrar para CDC baseado em log. E lembre: incremental não captura hard deletes."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>CDC baseado em log\u003c/strong> é superior a polling por updated_at?","a":["Porque é mais simples de configurar","Captura todas as mudanças (incluindo deletes e updates em massa), preserva a sequência, tem impacto mínimo na origem e latência baixa","Porque não exige acesso privilegiado ao banco","Porque dispensa snapshot inicial"],"c":1,"e":"Os custos existem: acesso privilegiado, snapshot inicial consistente, DDL da origem — e o risco operacional do slot de replicação abandonado, que retém WAL até encher o disco da produção."},{"n":"🟡","levelName":"intermediario","q":"Que problema o \u003cstrong>outbox pattern\u003c/strong> resolve?","a":["Filas que crescem sem limite","O dual write: gravar no banco e publicar um evento não têm transação em comum; o outbox grava evento e estado na mesma transação local, e um processo separado publica a partir da tabela","Mensagens fora de ordem no Kafka","Lentidão de escrita no banco de origem"],"c":1,"e":"Se o banco commita e a publicação falha, o evento se perde; se publica e o banco faz rollback, você anunciou o que não aconteceu. O outbox torna evento + mudança atômicos."},{"n":"🟡","levelName":"intermediario","q":"O que é o padrão \u003cstrong>write-audit-publish\u003c/strong>?","a":["Escrever, auditar o log de acesso e publicar métricas","Escrever o resultado num local temporário, validar a qualidade contra ele, e só então publicar atomicamente — dado ruim nunca fica visível","Publicar primeiro e auditar depois, para reduzir latência","Escrever em duas regiões e auditar a divergência"],"c":1,"e":"O antipadrão é publicar e auditar depois: quando o alerta chega, alguém já decidiu com o número errado. WAP resolve atomicidade e qualidade de uma vez."},{"n":"🔴","levelName":"avancado","q":"Num backfill de 2 anos de um pipeline com \u003cstrong>SCD Tipo 2 / estado acumulado\u003c/strong>, o que muda na execução?","a":["Nada — basta paralelizar as 730 execuções","As datas precisam rodar em ordem cronológica, não em paralelo, porque cada execução depende do estado deixado pela anterior","Só é possível reprocessar o último mês","O backfill deve rodar do mais recente para o mais antigo"],"c":1,"e":"Se cada dia é independente, paralelize (com limite explícito para não derrubar a origem). Com estado, a ordem é obrigatória. Identificar em qual caso você está é parte da resposta."}]},{"id":"04","fullTitle":"04 — Batch vs Streaming, Processamento em Tempo Real e Semânticas de Entrega","shortTitle":"Batch vs Streaming, Processamento em Temp
