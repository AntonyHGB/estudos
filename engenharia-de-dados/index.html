<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ Engenharia de Dados — Estudos</title>
<style>
:root{
  --accent:#0e7490;
  --accent-soft:#0e749018;
  --bg:#f8fafc; --panel:#ffffff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --code-bg:#f1f5f9; --shadow:0 1px 3px rgba(15,23,42,.08);
  --green:#16a34a; --yellow:#ca8a04; --red:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent:#22d3ee;
    --accent-soft:#22d3ee22;
    --bg:#0b1120; --panel:#111a2e; --text:#e2e8f0; --muted:#94a3b8;
    --border:#1e293b; --code-bg:#1a2440; --shadow:0 1px 3px rgba(0,0,0,.4);
    --green:#4ade80; --yellow:#facc15; --red:#f87171;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15.5px}
a{color:var(--accent)}
code{background:var(--code-bg);padding:.12em .38em;border-radius:5px;font-size:.88em;font-family:'Cascadia Code','JetBrains Mono',Consolas,monospace}
pre{background:var(--code-bg);padding:14px 16px;border-radius:10px;overflow-x:auto;border:1px solid var(--border)}
pre code{background:none;padding:0;font-size:.85em;line-height:1.5}
blockquote{margin:0 0 1em;padding:.6em 1em;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--muted)}
blockquote p{margin:.25em 0}
hr{border:none;border-top:1px solid var(--border);margin:1.6em 0}
h1,h2,h3,h4{line-height:1.3;scroll-margin-top:80px}
.table-wrap{overflow-x:auto;margin:1em 0;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92em}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--accent-soft);white-space:nowrap}
tr:last-child td{border-bottom:none}
.ref{color:var(--accent);font-weight:600}
.cb{color:var(--accent)}

/* layout */
.layout{display:flex;min-height:100vh}
aside{width:290px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,56px) 80px;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand .em{font-size:1.7em}
.brand h1{font-size:1.02em;margin:0;line-height:1.25}
.brand small{color:var(--muted);display:block;font-weight:400}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--text);text-decoration:none;font-size:.92em;margin:2px 0}
.nav-item:hover{background:var(--accent-soft)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){.nav-item.active{color:#0b1120}}
.nav-item .num{font-weight:700;font-size:.82em;opacity:.65;width:20px;flex-shrink:0}
.nav-item .prog{margin-left:auto;font-size:.72em;opacity:.75;white-space:nowrap;text-align:right}
.nav-label{font-size:.72em;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 10px 4px}

/* topo do tópico */
.topic-head h1{font-size:1.55em;margin:.1em 0 .15em}
.topic-head .sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin:18px 0 26px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.tab{padding:9px 18px;cursor:pointer;border:none;background:none;font:inherit;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{font-size:.8em;opacity:.7}

/* estudo */
.toc{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
.toc b{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.toc a{display:block;padding:3px 0;text-decoration:none;font-size:.93em}
.study-sec{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:8px 26px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
.study-sec>h2{border-bottom:2px solid var(--accent-soft);padding-bottom:.35em}

/* questões abertas */
.q-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.q-tools .spacer{flex:1}
.chip{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:5px 14px;cursor:pointer;font:inherit;font-size:.85em}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){.chip.active{color:#0b1120}}
.card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
.card.l-basico{border-left-color:var(--green)}
.card.l-intermediario{border-left-color:var(--yellow)}
.card.l-avancado{border-left-color:var(--red)}
.card-q{padding:15px 20px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.card-q:hover{background:var(--accent-soft)}
.card-q .qt{font-weight:600;flex:1}
.card-q .toggle{color:var(--muted);font-size:.82em;white-space:nowrap;padding-top:2px}
.card-a{display:none;padding:4px 22px 14px;border-top:1px dashed var(--border)}
.card.open .card-a{display:block}
.card-mark{display:flex;gap:6px;align-items:center;padding:8px 20px 12px;border-top:1px solid var(--border);flex-wrap:wrap;background:color-mix(in srgb, var(--panel) 70%, var(--bg))}
.card-mark span{font-size:.78em;color:var(--muted);margin-right:4px}
.mark-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:.85em}
.mark-btn.sel-ok{background:var(--green);border-color:var(--green);color:#fff}
.mark-btn.sel-meh{background:var(--yellow);border-color:var(--yellow);color:#fff}
.mark-btn.sel-bad{background:var(--red);border-color:var(--red);color:#fff}
.q-intro{margin-bottom:18px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-style:italic}

/* quiz de múltipla escolha */
.quiz-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
.quiz-head .score{font-weight:700;font-size:1.05em}
.quiz-head .score .ok{color:var(--green)}
.quiz-head .detail{color:var(--muted);font-size:.85em;flex:1}
.qz{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;margin-bottom:18px;box-shadow:var(--shadow);padding:16px 20px 14px}
.qz.l-basico{border-left-color:var(--green)}
.qz.l-intermediario{border-left-color:var(--yellow)}
.qz.l-avancado{border-left-color:var(--red)}
.qz .qnum{font-size:.75em;font-weight:700;color:var(--muted);letter-spacing:.05em}
.qz .qtext{font-weight:600;margin:4px 0 12px}
.alt{display:flex;gap:11px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;margin:7px 0;cursor:pointer;align-items:flex-start;transition:border-color .1s, background .1s}
.alt:hover{border-color:var(--accent);background:var(--accent-soft)}
.alt .letter{font-weight:700;color:var(--accent);flex-shrink:0}
.alt.locked{cursor:default}
.alt.locked:hover{border-color:var(--border);background:none}
.alt.correct{border-color:var(--green);background:color-mix(in srgb, var(--green) 14%, var(--panel))}
.alt.correct .letter{color:var(--green)}
.alt.wrong{border-color:var(--red);background:color-mix(in srgb, var(--red) 12%, var(--panel))}
.alt.wrong .letter{color:var(--red)}
.alt.dim{opacity:.55}
.qz-exp{margin-top:12px;padding:12px 16px;border-radius:10px;font-size:.94em;background:var(--accent-soft);border:1px solid var(--border)}
.qz-exp .verdict{font-weight:700;display:block;margin-bottom:4px}
.qz-exp .verdict.ok{color:var(--green)}
.qz-exp .verdict.nok{color:var(--red)}

/* home */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:24px 0}
.home-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.home-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.home-card .n{font-size:.78em;font-weight:700;color:var(--accent)}
.home-card .t{font-weight:600;margin:2px 0 6px}
.home-card .s{font-size:.83em;color:var(--muted)}
.home-card .qn{font-size:.76em;color:var(--muted);margin-top:8px}
.readme{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:8px 26px 18px;box-shadow:var(--shadow)}

.mobile-toggle{display:none}
@media (max-width: 860px){
  aside{position:fixed;z-index:30;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .mobile-toggle{display:block;position:fixed;bottom:18px;left:18px;z-index:40;background:var(--accent);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:1.3em;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  main{padding-top:16px}
}
</style>
</head>

  <main id="main"></main>

<script id="site-data" type="application/json">{"siteKey":"engenharia-de-dados","title":"Engenharia de Dados","emoji":"🛠️","readmeTitle":"Engenharia de Dados — Material para Entrevistas Técnicas","topics":[{"id":"01","fullTitle":"01 — Modelagem de Dados","shortTitle":"Modelagem de Dados","subtitle":"OLTP vs OLAP · Normalização · Star vs Snowflake · Slowly Changing Dimensions · Data Vault · One Big Table","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-a-pergunta-que-está-por-trás-de-toda-modelagem\">1.1 A pergunta que está por trás de toda modelagem\u003c/h3>\n\u003cp>Modelagem de dados é a resposta a uma única tensão: \u003cstrong>o formato que é ótimo para escrever não é o formato que é ótimo para ler.\u003c/strong>\u003c/p>\n\u003cp>Um sistema que registra pedidos precisa gravar um pedido por vez, rápido, sem duplicar informação e sem risco de inconsistência. Um sistema que responde \"qual foi a receita por região por mês nos últimos 3 anos\" precisa varrer bilhões de linhas e agregar. Esses dois objetivos são fisicamente opostos: o primeiro quer o dado espalhado em muitas tabelas pequenas e estreitas (escrita barata, atualização em um lugar só); o segundo quer o dado junto e pré-combinado (leitura barata, sem precisar reconstruir contexto a cada consulta).\u003c/p>\n\u003cp>Toda técnica deste arquivo é uma forma de gerenciar essa tensão. Se você entender isso, consegue derivar as respostas em vez de decorá-las.\u003c/p>\n\u003ch3 id=\"h-1-2-oltp-vs-olap\">1.2 OLTP vs OLAP\u003c/h3>\n\u003cp>\u003cstrong>OLTP (Online Transaction Processing)\u003c/strong> é o mundo do sistema operacional: o app, o checkout, o cadastro. Características:\u003c/p>\n\u003cul>\u003cli>Muitas transações pequenas e concorrentes, com leitura e escrita misturadas.\u003c/li>\u003cli>Acesso quase sempre por chave: \"me dê o pedido 12345\", \"atualize o saldo do cliente 987\".\u003c/li>\u003cli>Latência medida em milissegundos, para uma requisição de usuário.\u003c/li>\u003cli>Precisa de garantias ACID fortes, porque um erro é dinheiro ou dado corrompido de um cliente real.\u003c/li>\u003cli>Modelado \u003cstrong>normalizado\u003c/strong> (tipicamente 3FN), para que cada fato exista em um lugar só e uma atualização não precise ser replicada.\u003c/li>\u003cli>Armazenamento \u003cstrong>orientado a linha\u003c/strong>: como você lê o registro inteiro de uma entidade, faz sentido guardar os campos daquele registro fisicamente juntos.\u003c/li>\u003cli>Índices B-tree em chaves e colunas de busca; muitos índices, porque as consultas são seletivas.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>OLAP (Online Analytical Processing)\u003c/strong> é o mundo analítico: dashboards, relatórios, modelos, ciência de dados. Características:\u003c/p>\n\u003cul>\u003cli>Poucas consultas, mas cada uma varre muito dado.\u003c/li>\u003cli>Acesso por \u003cem>fatia\u003c/em>, não por chave: \"some \u003ccode>valor\u003c/code> de todas as vendas do último trimestre, agrupadas por categoria\".\u003c/li>\u003cli>Latência aceitável de segundos a minutos.\u003c/li>\u003cli>Carga em lote ou micro-lote; escrita append-only; updates raros e caros.\u003c/li>\u003cli>Modelado \u003cstrong>desnormalizado\u003c/strong> (star schema, wide tables), para eliminar joins do caminho crítico da consulta.\u003c/li>\u003cli>Armazenamento \u003cstrong>colunar\u003c/strong>: como uma consulta típica lê 4 colunas de uma tabela de 200, guardar cada coluna separada evita ler as outras 196.\u003c/li>\u003cli>Poucos ou nenhum índice tradicional; em vez disso, particionamento, clustering, min/max statistics por bloco e zone maps.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>O ponto que diferencia uma boa resposta:\u003c/strong> OLTP e OLAP não diferem só em \"como as pessoas usam\". Diferem em \u003cstrong>padrão de acesso\u003c/strong>, e todas as outras escolhas (layout físico, normalização, índices, garantias transacionais) são consequência do padrão de acesso. Se o entrevistador perguntar \"por que colunar é rápido em OLAP\", a resposta certa é sobre I/O: você lê só as colunas necessárias, e como valores de uma mesma coluna são do mesmo tipo e frequentemente similares, comprimem muito melhor (run-length, dictionary encoding). Menos bytes lidos = mais rápido. Não é magia, é volume de I/O.\u003c/p>\n\u003cp>Existe ainda \u003cstrong>HTAP\u003c/strong> (Hybrid Transactional/Analytical Processing) — sistemas que tentam servir os dois padrões na mesma engine (SingleStore, TiDB, alguns modos do Databricks e do Snowflake). Vale mencionar como nuance: o mercado tem convergido, mas a separação clássica ainda domina porque isolar cargas analíticas do banco de produção é uma decisão de risco operacional, não só de performance.\u003c/p>\n\u003ch3 id=\"h-1-3-normalização\">1.3 Normalização\u003c/h3>\n\u003cp>Normalização é o processo de decompor tabelas para eliminar redundância e anomalias de atualização.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>1FN\u003c/strong>: valores atômicos, sem grupos repetidos. Nada de um campo \u003ccode>telefones\u003c/code> com \"1199,1198\" dentro.\u003c/li>\u003cli>\u003cstrong>2FN\u003c/strong>: 1FN + todo atributo não-chave depende da chave primária \u003cstrong>inteira\u003c/strong> (só faz diferença com chave composta).\u003c/li>\u003cli>\u003cstrong>3FN\u003c/strong>: 2FN + nenhum atributo não-chave depende de outro atributo não-chave (sem dependência transitiva). Se você tem \u003ccode>cep\u003c/code>, \u003ccode>cidade\u003c/code> e \u003ccode>estado\u003c/code> na tabela de pedidos, \u003ccode>cidade\u003c/code> depende de \u003ccode>cep\u003c/code>, não do pedido — violação de 3FN.\u003c/li>\u003cli>\u003cstrong>BCNF\u003c/strong>: refinamento da 3FN para casos com múltiplas chaves candidatas sobrepostas. Raramente cobrado, bom mencionar de passagem.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>O benefício real da normalização não é economia de espaço.\u003c/strong> Espaço é barato. O benefício é \u003cstrong>integridade\u003c/strong>: se o nome de um produto existe num lugar só, é impossível ele estar diferente em dois lugares. Anomalia de atualização é o problema que a normalização resolve.\u003c/p>\n\u003cp>\u003cstrong>O custo é join.\u003c/strong> Cada nível de normalização adicional é um join a mais para reconstruir a informação. Em OLTP, isso é aceitável: você faz joins seletivos, com índices, retornando poucas linhas. Em OLAP, um join entre duas tabelas de bilhões de linhas custa um shuffle distribuído, e é aí que a desnormalização passa a valer a pena.\u003c/p>\n\u003cp>\u003cstrong>Desnormalização\u003c/strong> é a escolha deliberada de duplicar dados para evitar joins na leitura. Você troca integridade automática por velocidade de leitura — e assume a responsabilidade de manter as cópias consistentes no processo de ETL/ELT. Isso é aceitável em analytics porque a escrita é controlada por pipeline, não por milhares de usuários concorrentes.\u003c/p>\n\u003ch3 id=\"h-1-4-modelagem-dimensional-fatos-e-dimensões\">1.4 Modelagem dimensional: fatos e dimensões\u003c/h3>\n\u003cp>A modelagem dimensional (Kimball) organiza os dados analíticos em dois tipos de tabela:\u003c/p>\n\u003cp>\u003cstrong>Tabela fato\u003c/strong> guarda as \u003cem>medições\u003c/em> de um processo de negócio. Uma linha = um evento no grão definido (uma venda, um item de venda, um clique, um saldo diário). Contém:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Chaves estrangeiras\u003c/strong> para as dimensões (\u003ccode>sk_cliente\u003c/code>, \u003ccode>sk_produto\u003c/code>, \u003ccode>sk_data\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Métricas / medidas\u003c/strong> numéricas (\u003ccode>quantidade\u003c/code>, \u003ccode>valor_bruto\u003c/code>, \u003ccode>desconto\u003c/code>).\u003c/li>\u003cli>Opcionalmente, \u003cstrong>degenerate dimensions\u003c/strong>: atributos como \u003ccode>numero_do_pedido\u003c/code> que são identificadores sem tabela dimensão própria.\u003c/li>\u003c/ul>\n\u003cp>Tabelas fato são altas e estreitas: bilhões de linhas, poucas colunas, quase tudo numérico.\u003c/p>\n\u003cp>\u003cstrong>Tabela dimensão\u003c/strong> guarda o \u003cem>contexto\u003c/em> descritivo: quem, o quê, onde, quando. Uma linha = uma entidade (um cliente, um produto). Contém atributos textuais usados para filtrar e agrupar (\u003ccode>categoria\u003c/code>, \u003ccode>regiao\u003c/code>, \u003ccode>segmento_cliente\u003c/code>). São largas e baixas: muitas colunas, relativamente poucas linhas.\u003c/p>\n\u003cp>\u003cstrong>Grão (grain)\u003c/strong> é o conceito mais importante e o mais negligenciado. O grão é a definição precisa do que representa \u003cstrong>uma linha\u003c/strong> da tabela fato. \"Uma linha por item de pedido\" é diferente de \"uma linha por pedido\", e escolher errado quebra tudo depois. Declarar o grão é a primeira coisa que se faz ao modelar — antes de escolher dimensões, antes de escolher métricas. Numa entrevista, se o entrevistador pede para modelar algo e você começa dizendo \"primeiro eu defino o grão da fato como...\", você já se diferenciou.\u003c/p>\n\u003cp>\u003cstrong>Tipos de tabela fato:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Transacional\u003c/strong>: uma linha por evento que aconteceu. O mais comum. Aditiva, granular, append-only.\u003c/li>\u003cli>\u003cstrong>Snapshot periódico\u003c/strong>: uma linha por entidade por período (saldo de cada conta no fim de cada dia). Cresce previsivelmente, permite responder \"quanto tinha em X\" sem reconstruir histórico.\u003c/li>\u003cli>\u003cstrong>Snapshot acumulado (accumulating)\u003c/strong>: uma linha por processo com múltiplas etapas, atualizada conforme avança (um pedido com colunas \u003ccode>data_pedido\u003c/code>, \u003ccode>data_pagamento\u003c/code>, \u003ccode>data_envio\u003c/code>, \u003ccode>data_entrega\u003c/code>). Útil para medir lead time entre etapas. Diferente das outras, ela \u003cstrong>sofre update\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Factless fact\u003c/strong>: fato sem métrica numérica, que registra a ocorrência de um relacionamento (aluno matriculado numa turma num semestre; promoção vigente para um produto num dia). Serve para contar eventos ou para responder \"o que \u003cem>não\u003c/em> aconteceu\" (produtos em promoção que não venderam).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Tipos de métrica — cai como pegadinha:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Aditiva\u003c/strong>: pode somar em todas as dimensões (\u003ccode>valor_venda\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Semi-aditiva\u003c/strong>: pode somar em algumas dimensões, mas não em tempo (\u003ccode>saldo_conta\u003c/code> — somar saldos de contas diferentes no mesmo dia faz sentido; somar o saldo da mesma conta em dias diferentes não).\u003c/li>\u003cli>\u003cstrong>Não-aditiva\u003c/strong>: não pode somar em nenhuma dimensão (percentuais, taxas, ratios). A regra prática é armazenar numerador e denominador separadamente como métricas aditivas e calcular o ratio na consulta — nunca armazenar a média pré-calculada, porque média de médias está errada quando os grupos têm tamanhos diferentes.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-5-star-schema-vs-snowflake-schema\">1.5 Star schema vs Snowflake schema\u003c/h3>\n\u003cp>\u003cstrong>Star schema\u003c/strong>: uma tabela fato central ligada diretamente a dimensões \u003cstrong>desnormalizadas\u003c/strong>. A dimensão produto contém \u003ccode>produto\u003c/code>, \u003ccode>subcategoria\u003c/code>, \u003ccode>categoria\u003c/code>, \u003ccode>departamento\u003c/code> todos na mesma tabela, com redundância assumida.\u003c/p>\n\u003cp>\u003cstrong>Snowflake schema\u003c/strong>: as dimensões são \u003cstrong>normalizadas\u003c/strong> em sub-dimensões. \u003ccode>dim_produto\u003c/code> aponta para \u003ccode>dim_subcategoria\u003c/code>, que aponta para \u003ccode>dim_categoria\u003c/code>, e assim por diante. O diagrama parece um floco de neve.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Star\u003c/th>\u003cth>Snowflake\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Joins por consulta\u003c/td>\u003ctd>1 nível (fato → dim)\u003c/td>\u003ctd>Vários níveis (fato → dim → subdim)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Legibilidade para analista/BI\u003c/td>\u003ctd>Alta\u003c/td>\u003ctd>Baixa\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Redundância nas dimensões\u003c/td>\u003ctd>Alta\u003c/td>\u003ctd>Baixa\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integridade automática\u003c/td>\u003ctd>Menor (depende do ETL)\u003c/td>\u003ctd>Maior\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Espaço em disco\u003c/td>\u003ctd>Maior (irrelevante na prática)\u003c/td>\u003ctd>Menor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Performance de consulta\u003c/td>\u003ctd>Geralmente melhor\u003c/td>\u003ctd>Geralmente pior\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>A resposta madura é: prefira star por padrão.\u003c/strong> As razões:\u003c/p>\n\u003col>\u003cli>Dimensões são pequenas comparadas à fato. Economizar espaço numa tabela de 50 mil produtos é irrelevante quando a fato tem 5 bilhões de linhas.\u003c/li>\u003cli>Ferramentas de BI e otimizadores de query lidam melhor com star. Muitos engines têm otimizações específicas de star schema (star join optimization, bloom filters de dimensão para pruning da fato).\u003c/li>\u003cli>Analistas escrevem SQL contra esse modelo. Reduzir carga cognitiva humana tem valor econômico real.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Quando snowflake se justifica:\u003c/strong> dimensões genuinamente enormes onde a redundância pesa (raro); hierarquias que mudam com frequência e precisam ser mantidas num lugar só; ou quando a sub-dimensão é reutilizada por muitas dimensões diferentes e precisa ser conformada. Também aparece naturalmente quando a plataforma tem restrições de custo de storage — cada vez menos comum.\u003c/p>\n\u003cp>\u003cstrong>Dimensão conformada (conformed dimension)\u003c/strong> é o conceito que sustenta a escalabilidade do modelo: uma dimensão compartilhada por vários data marts, com o mesmo significado e as mesmas chaves. \u003ccode>dim_cliente\u003c/code> usada tanto pela fato de vendas quanto pela de suporte permite comparar receita e chamados pelo mesmo cliente. Sem dimensões conformadas, você tem silos que não se conversam — e o \u003cstrong>data warehouse bus matrix\u003c/strong> de Kimball (processos de negócio nas linhas, dimensões nas colunas) é a ferramenta de planejamento que garante isso.\u003c/p>\n\u003ch3 id=\"h-1-6-chaves-natural-surrogate-e-hash\">1.6 Chaves: natural, surrogate e hash\u003c/h3>\n\u003cp>\u003cstrong>Chave natural (business key)\u003c/strong>: o identificador que o negócio usa — CPF, SKU, \u003ccode>id\u003c/code> do sistema de origem.\u003c/p>\n\u003cp>\u003cstrong>Chave substituta (surrogate key)\u003c/strong>: um identificador sem significado de negócio, gerado pelo warehouse — normalmente um inteiro sequencial.\u003c/p>\n\u003cp>Por que usar surrogate key (esta pergunta cai muito):\u003c/p>\n\u003col>\u003cli>\u003cstrong>Permite SCD Tipo 2.\u003c/strong> Se o cliente muda de endereço e você quer manter as duas versões, precisa de duas linhas com a mesma chave natural. A chave primária tem que ser outra coisa.\u003c/li>\u003cli>\u003cstrong>Isola o warehouse de mudanças na origem.\u003c/strong> Se o sistema de origem trocar de formato de ID, ou se você integrar duas origens com IDs conflitantes, o warehouse não quebra.\u003c/li>\u003cli>\u003cstrong>Performance.\u003c/strong> Inteiro de 4/8 bytes é mais barato de comparar e armazenar em bilhões de linhas de fato do que uma string de 40 caracteres.\u003c/li>\u003cli>\u003cstrong>Lida com registros sem chave natural\u003c/strong> ou com origens diferentes que representam a mesma entidade.\u003c/li>\u003cli>\u003cstrong>Permite linhas especiais\u003c/strong> para casos de exceção: \u003ccode>-1 = desconhecido\u003c/code>, \u003ccode>-2 = não aplicável\u003c/code>, \u003ccode>-3 = ainda não chegou\u003c/code>. Isso é o que permite usar INNER JOIN em vez de LEFT JOIN entre fato e dimensão, evitando NULLs em chave estrangeira.\u003c/li>\u003c/ol>\n\u003cp>Uma variação moderna é a \u003cstrong>hash key\u003c/strong> (hash da chave natural, como em Data Vault): permite gerar a chave de forma determinística e paralela, sem coordenação central para gerar sequências — o que importa em ambientes distribuídos onde sequências são um gargalo. O custo é colisão (desprezível com SHA-256) e perda de ordenação natural.\u003c/p>\n\u003ch3 id=\"h-1-7-slowly-changing-dimensions-scd\">1.7 Slowly Changing Dimensions (SCD)\u003c/h3>\n\u003cp>O problema: atributos de dimensão mudam ao longo do tempo (cliente muda de cidade, produto muda de categoria). O que fazer com o histórico?\u003c/p>\n\u003cp>\u003cstrong>Tipo 0 — Retain original.\u003c/strong> O atributo nunca muda depois de gravado. Usado para dados imutáveis por definição (data de nascimento, data de abertura da conta).\u003c/p>\n\u003cp>\u003cstrong>Tipo 1 — Overwrite.\u003c/strong> Sobrescreve o valor antigo. Sem histórico. Simples e barato.\u003c/p>\n\u003cul>\u003cli>\u003cem>Quando usar:\u003c/em> correção de erro (o CEP estava digitado errado), ou quando o negócio explicitamente não se importa com o histórico daquele atributo.\u003c/li>\u003cli>\u003cem>Custo:\u003c/em> relatórios históricos mudam retroativamente. Se você sobrescrever a região do vendedor, o relatório de vendas de 2023 vai passar a atribuir as vendas antigas à região nova. Isso pode ser exatamente o desejado ou um desastre — depende do negócio, e essa é a pergunta que você deve fazer.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Tipo 2 — Add new row.\u003c/strong> A mudança gera uma \u003cstrong>nova linha\u003c/strong> na dimensão, com nova surrogate key. Colunas de controle: \u003ccode>data_inicio_validade\u003c/code>, \u003ccode>data_fim_validade\u003c/code>, \u003ccode>flag_registro_atual\u003c/code>, e frequentemente \u003ccode>versao\u003c/code>. A chave natural se repete entre as versões; a surrogate key é única.\u003c/p>\n\u003cul>\u003cli>É o \u003cstrong>padrão de fato\u003c/strong> para preservar histórico e o que quase toda entrevista quer ouvir.\u003c/li>\u003cli>Fatos antigas continuam apontando para a surrogate key da versão vigente \u003cstrong>no momento do evento\u003c/strong>, então relatórios históricos permanecem corretos. Isso se chama preservar o contexto histórico, e é o ponto central.\u003c/li>\u003cli>\u003cem>Custo:\u003c/em> a dimensão cresce; a lógica de carga fica mais complexa (detectar mudança, fechar a linha anterior, abrir a nova); consultas de \"estado atual\" precisam filtrar por \u003ccode>flag_registro_atual = true\u003c/code>.\u003c/li>\u003cli>Detalhe fino que impressiona: as datas de validade devem ser um intervalo semiaberto \u003ccode>[inicio, fim)\u003c/code> para evitar ambiguidade na borda, e a linha corrente costuma usar \u003ccode>9999-12-31\u003c/code> como fim em vez de NULL, porque NULL complica os predicados de BETWEEN.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Tipo 3 — Add new column.\u003c/strong> Mantém uma coluna adicional com o valor anterior (\u003ccode>regiao_atual\u003c/code>, \u003ccode>regiao_anterior\u003c/code>).\u003c/p>\n\u003cul>\u003cli>Preserva \u003cstrong>apenas uma\u003c/strong> mudança (ou um número fixo delas). Não é histórico completo.\u003c/li>\u003cli>\u003cem>Quando usar:\u003c/em> reorganizações pontuais onde o negócio quer analisar os dados \"pela estrutura antiga\" e \"pela nova\" simultaneamente por um período. É o caso clássico: mudança de território de vendas.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Tipo 4 — Mini-dimension / history table.\u003c/strong> Separa os atributos que mudam rápido numa tabela própria. Duas variantes usadas na prática:\u003c/p>\n\u003cul>\u003cli>Uma tabela \"corrente\" enxuta + uma tabela de histórico separada.\u003c/li>\u003cli>Uma \u003cstrong>mini-dimensão\u003c/strong> com combinações de atributos voláteis (faixa de renda, faixa etária, score), referenciada diretamente pela fato, evitando explodir a dimensão principal em milhões de versões.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Tipo 6 — Híbrido (1+2+3).\u003c/strong> Linhas versionadas como Tipo 2, mas com colunas adicionais que sempre carregam o valor \u003cstrong>atual\u003c/strong> do atributo. Isso permite responder as duas perguntas com a mesma tabela: \"quanto vendeu a região à qual o vendedor pertencia na época\" (coluna versionada) e \"quanto vendeu a região à qual ele pertence hoje\" (coluna atual). O nome vem de 1+2+3 = 6.\u003c/p>\n\u003cp>\u003cstrong>Tipo 7 — Dual keys.\u003c/strong> A fato carrega tanto a surrogate key (visão histórica) quanto a chave natural durável (visão atual), permitindo escolher a perspectiva no momento da consulta via views distintas.\u003c/p>\n\u003cp>\u003cstrong>Como um entrevistador testa isso de verdade:\u003c/strong> ele não pergunta \"o que é SCD Tipo 2\". Ele descreve um cenário — \"o gerente da loja mudou em junho; como você garante que as vendas de janeiro apareçam sob o gerente antigo?\" — e espera que você chegue ao Tipo 2 sozinho, e que pergunte se o negócio quer a visão histórica ou a atual.\u003c/p>\n\u003ch3 id=\"h-1-8-data-vault\">1.8 Data Vault\u003c/h3>\n\u003cp>Data Vault 2.0 é uma metodologia de modelagem para a camada de integração do warehouse (não para consumo final). Divide tudo em três estruturas:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Hub\u003c/strong>: a lista de chaves de negócio de uma entidade. Contém a business key, sua hash key, data de carga e sistema de origem. Nada mais. Um hub de cliente tem os CPFs existentes, ponto.\u003c/li>\u003cli>\u003cstrong>Link\u003c/strong>: relacionamentos entre hubs. Um link de \"cliente comprou produto\" contém as hash keys dos hubs envolvidos. Todos os relacionamentos são modelados como many-to-many, independentemente da cardinalidade real hoje.\u003c/li>\u003cli>\u003cstrong>Satellite\u003c/strong>: os atributos descritivos e seu histórico. Ligado a um hub ou link, com \u003ccode>load_date\u003c/code> e hash diff para detectar mudanças. Todo histórico vive aqui, sempre em modo insert-only.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Por que existe:\u003c/strong> a promessa é \u003cstrong>auditabilidade total e resiliência a mudança\u003c/strong>. Como tudo é insert-only e a estrutura é altamente decomposta, você consegue: (a) reconstruir o estado do dado em qualquer instante passado, incluindo o que a origem disse mesmo quando ela estava errada; (b) adicionar uma nova fonte ou um novo relacionamento sem refatorar o modelo existente — você acrescenta hubs, links e satélites, não altera os antigos; (c) carregar tudo em paralelo, porque as hash keys removem a dependência de lookup sequencial.\u003c/p>\n\u003cp>\u003cstrong>Custos, e são grandes:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Explosão de tabelas. Um modelo que teria 20 tabelas dimensionais pode ter 150 em Data Vault.\u003c/li>\u003cli>Consultar diretamente é impraticável — exige muitos joins. Por isso Data Vault \u003cstrong>sempre\u003c/strong> vem acompanhado de uma camada de apresentação (tipicamente star schema) construída em cima. Data Vault não substitui modelagem dimensional; ele fica atrás dela.\u003c/li>\u003cli>Curva de aprendizado alta e sensível a disciplina de equipe.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Quando usar:\u003c/strong> múltiplas fontes heterogêneas que mudam com frequência, exigência regulatória forte de auditoria (bancos, seguros, saúde), organizações grandes com muitas equipes contribuindo para o mesmo warehouse. \u003cstrong>Quando não usar:\u003c/strong> empresa pequena, poucas fontes, prazo curto. Aí é overhead puro e o star schema direto resolve.\u003c/p>\n\u003ch3 id=\"h-1-9-alternativas-modernas-one-big-table-e-wide-tables\">1.9 Alternativas modernas: One Big Table e Wide Tables\u003c/h3>\n\u003cp>Com engines colunares modernas, surgiu um contraponto ao star schema: a \u003cstrong>OBT (One Big Table)\u003c/strong>, uma tabela totalmente desnormalizada, com dimensões já achatadas dentro da fato.\u003c/p>\n\u003cul>\u003cli>\u003cem>A favor:\u003c/em> zero joins na consulta; compressão colunar torna a redundância barata; o usuário final não precisa saber modelar; performance excelente para o caso de uso específico.\u003c/li>\u003cli>\u003cem>Contra:\u003c/em> reprocessamento caro quando um atributo de dimensão muda (você precisa reescrever a tabela inteira, não uma linha da dimensão); explosão de tabelas quando cada time cria a sua; perda das dimensões conformadas e, com elas, da capacidade de cruzar domínios; e dificuldade de manter definições consistentes.\u003c/li>\u003c/ul>\n\u003cp>Na prática, o padrão comum hoje é \u003cstrong>star schema na camada modelada + OBT/wide tables como camada de consumo materializada para casos específicos\u003c/strong>. Se numa entrevista você disser \"star schema está obsoleto porque temos colunar\", vai levar contra-argumento. A resposta correta é que colunar mudou o \u003cem>peso\u003c/em> do trade-off, não o trade-off em si.\u003c/p>\n\u003cp>Vale conhecer também \u003cstrong>Medallion Architecture\u003c/strong> (Bronze/Silver/Gold), que é uma convenção de camadas, não de modelagem: Bronze = dado bruto ingerido como veio; Silver = limpo, deduplicado, conformado; Gold = agregado e modelado para consumo. Aparece muito em contextos Databricks. É ortogonal ao debate Kimball/Inmon/Vault — você pode usar star schema na camada Gold.\u003c/p>\n\u003cp>\u003cstrong>Inmon vs Kimball\u003c/strong> (a briga clássica, ainda cobrada): Inmon propõe um warehouse corporativo normalizado em 3FN como fonte única, e data marts dimensionais derivados dele (top-down). Kimball propõe construir data marts dimensionais diretamente, integrados por dimensões conformadas (bottom-up). Na prática, arquiteturas modernas são híbridas: uma camada de integração normalizada ou em Data Vault, e uma camada de consumo dimensional. A resposta que soa madura é reconhecer que a distinção importa menos hoje do que importava, porque o custo de storage e compute mudou as premissas econômicas dos dois modelos.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Dizer que normalização serve para economizar espaço.\u003c/strong> É o marcador mais rápido de quem decorou. Espaço é irrelevante em 2026; o objetivo é integridade e ausência de anomalias de atualização.\u003c/p>\n\u003cp>\u003cstrong>Tratar SCD como propriedade da tabela.\u003c/strong> O tipo de SCD é escolhido \u003cstrong>por atributo\u003c/strong>. A mesma \u003ccode>dim_cliente\u003c/code> pode ter \u003ccode>email\u003c/code> como Tipo 1 (correção) e \u003ccode>segmento\u003c/code> como Tipo 2 (histórico importa). Responder \"essa dimensão é Tipo 2\" sem qualificar mostra que você nunca implementou uma.\u003c/p>\n\u003cp>\u003cstrong>Esquecer de declarar o grão.\u003c/strong> Candidatos pulam direto para \"essa é a fato de vendas, essas são as dimensões\". Entrevistador vai perguntar \"o que é uma linha aqui?\" e a maioria hesita. Declare o grão como primeiro passo, sempre.\u003c/p>\n\u003cp>\u003cstrong>Fazer lookup de dimensão pela linha corrente ao carregar fatos históricos.\u003c/strong> Ao carregar um fato com data antiga, buscar \u003ccode>WHERE flag_atual = true\u003c/code> atribui o evento ao contexto errado. Tem que filtrar pelo intervalo de validade que contém a data do evento. É um bug silencioso: os números saem, só estão errados.\u003c/p>\n\u003cp>\u003cstrong>Somar métricas semi-aditivas ao longo do tempo.\u003c/strong> Somar saldos diários da mesma conta produz um número sem significado. Semi-aditivas exigem \u003ccode>LAST_VALUE\u003c/code> ou média no eixo tempo, e soma nos outros eixos.\u003c/p>\n\u003cp>\u003cstrong>Armazenar percentuais e médias pré-calculadas na fato.\u003c/strong> Média de médias e soma de percentuais estão errados sempre que os grupos têm tamanhos diferentes. Guarde numerador e denominador.\u003c/p>\n\u003cp>\u003cstrong>Confundir snowflake com normalização da tabela fato.\u003c/strong> Snowflake normaliza \u003cstrong>dimensões\u003c/strong>. A fato permanece intacta. Candidatos às vezes descrevem quebrar a fato em várias tabelas, o que não é snowflake — é outra coisa (e geralmente uma má ideia).\u003c/p>\n\u003cp>\u003cstrong>Achar que Data Vault substitui star schema.\u003c/strong> Ele fica na camada de integração; a camada de consumo continua sendo dimensional. Dizer \"modelamos em Data Vault, então não precisamos de dimensional\" indica que a pessoa leu sobre e não usou.\u003c/p>\n\u003cp>\u003cstrong>Usar NULL em chave estrangeira da fato.\u003c/strong> Sempre que a dimensão não é conhecida, aponte para uma linha especial (\u003ccode>-1 = desconhecido\u003c/code>). NULL em FK força LEFT JOIN, quebra contagens, e faz o dado \"sumir\" silenciosamente de relatórios que usam INNER JOIN.\u003c/p>\n\u003cp>\u003cstrong>Modelar many-to-many achatando em colunas numeradas.\u003c/strong> \u003ccode>categoria_1\u003c/code>, \u003ccode>categoria_2\u003c/code>, \u003ccode>categoria_3\u003c/code> parece prático e é uma armadilha: quebra assim que aparece um quarto valor, e consultar exige \u003ccode>OR\u003c/code> em todas as colunas. Use bridge table.\u003c/p>\n\u003cp>\u003cstrong>Não perguntar sobre a intenção do negócio.\u003c/strong> Muitas dessas perguntas não têm resposta certa sem contexto. \"O negócio quer ver as vendas antigas pela estrutura antiga ou pela atual?\" é uma pergunta que, feita na hora certa, vale mais que a resposta técnica. Entrevistadores frequentemente deixam ambiguidade de propósito, para ver se você a detecta.\u003c/p>\n\u003cp>\u003cstrong>Ignorar a dimensão de data.\u003c/strong> Quase todo modelo dimensional tem uma \u003ccode>dim_data\u003c/code> pré-populada com atributos de calendário (dia da semana, feriado, semana fiscal, trimestre). Candidatos esquecem de mencioná-la, e ela é a dimensão conformada mais universal que existe. Detalhe extra: ela normalmente usa uma surrogate key legível no formato \u003ccode>YYYYMMDD\u003c/code>, uma das poucas exceções à regra de \"surrogate key sem significado\", porque facilita particionamento e debug.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 P1. Qual a diferença entre OLTP e OLAP?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> OLTP serve o sistema operacional: transações pequenas e frequentes, acesso por chave, latência de milissegundos, ACID forte, modelo normalizado e armazenamento em linha. OLAP serve análise: poucas consultas que varrem muito dado, acesso por fatia e agregação, latência de segundos, carga em lote, modelo desnormalizado e armazenamento colunar. A diferença raiz é o padrão de acesso — todas as outras escolhas derivam dele. Separá-los também isola a carga analítica do banco de produção, o que é uma decisão de risco operacional além de performance.\u003c/p>\n\u003cp>\u003cem>Follow-up esperado:\u003c/em> \"Por que colunar é melhor para OLAP?\" → Porque a consulta lê poucas colunas de muitas; formato colunar permite ler só as necessárias, e valores de mesmo tipo e domínio na mesma coluna comprimem muito melhor (dictionary, run-length). Menos I/O e melhor uso de vetorização na CPU.\u003c/p>"},{"titleHtml":"🟢 P2. O que é normalização e até que forma normal se costuma ir?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É decompor tabelas para eliminar redundância e anomalias de atualização. 1FN exige valores atômicos; 2FN elimina dependência parcial da chave composta; 3FN elimina dependência transitiva entre atributos não-chave. Na prática, 3FN é o alvo em OLTP — BCNF e superiores raramente compensam. O ganho principal não é espaço, é integridade: cada fato existe em um lugar só, então é impossível ficar inconsistente. O custo é join na leitura, e é por isso que warehouses desnormalizam.\u003c/p>\n\u003cp>\u003cem>Pegadinha comum:\u003c/em> candidatos dizem que normalização serve para \"economizar espaço\". Espaço é o benefício menos importante e o mais desatualizado. Diga integridade.\u003c/p>"},{"titleHtml":"🟢 P3. O que é star schema? Explique fato e dimensão.","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É um modelo dimensional com uma tabela fato central ligada a dimensões desnormalizadas. A fato guarda as medições de um processo de negócio, uma linha por evento no grão definido, contendo chaves estrangeiras para dimensões e métricas numéricas. As dimensões guardam o contexto descritivo usado para filtrar e agrupar. Fatos são altas e estreitas; dimensões são largas e baixas. O nome vem do formato do diagrama.\u003c/p>\n\u003cp>\u003cem>Follow-up quase garantido:\u003c/em> \"O que é o grão?\" → É a definição precisa do que representa uma linha da fato. É a primeira decisão da modelagem, antes de escolher dimensões ou métricas, porque tudo depende dela. Exemplo: \"uma linha por item de pedido\" versus \"uma linha por pedido\" produz modelos incompatíveis.\u003c/p>"},{"titleHtml":"🟡 P4. Star ou snowflake? Justifique.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Por padrão, star. As dimensões são pequenas em relação à fato, então a economia de espaço do snowflake é irrelevante enquanto o custo de joins adicionais em cada consulta é real. Além disso, ferramentas de BI e otimizadores têm otimizações específicas para star join, e analistas escrevem SQL contra esse modelo — reduzir complexidade humana tem valor. Eu consideraria snowflake se a hierarquia mudasse com muita frequência e precisasse ser mantida num único lugar, ou se uma sub-dimensão fosse reutilizada por muitas dimensões diferentes e precisasse ser conformada.\u003c/p>\n\u003cp>\u003cem>Follow-up:\u003c/em> \"E se a dimensão tiver 500 milhões de linhas?\" → Aí o cálculo muda. Uma dimensão gigante (dimensão de usuário numa plataforma de consumo, por exemplo) pode justificar snowflake parcial, ou uma mini-dimensão separando os atributos de alta cardinalidade e alta volatilidade, ou uma abordagem de bridge table. Vale também questionar se aquilo é mesmo dimensão ou se virou uma fato disfarçada.\u003c/p>"},{"titleHtml":"🟡 P5. Explique SCD Tipo 1, 2 e 3, e diga quando usar cada um.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Tipo 1 sobrescreve — sem histórico, usado para correção de erro ou quando o negócio não quer histórico daquele atributo; o efeito colateral é que relatórios históricos mudam retroativamente. Tipo 2 cria uma nova linha com nova surrogate key e colunas de validade (\u003ccode>data_inicio\u003c/code>, \u003ccode>data_fim\u003c/code>, \u003ccode>flag_atual\u003c/code>) — preserva histórico completo e é o padrão para atributos onde o contexto histórico importa. Tipo 3 adiciona uma coluna com o valor anterior — preserva só uma mudança, útil em reorganizações pontuais onde o negócio quer ver os dados pelas duas estruturas ao mesmo tempo. Na prática, aplico o tipo por atributo, não por tabela: a mesma dimensão pode ter atributos Tipo 1 e Tipo 2.\u003c/p>\n\u003cp>\u003cem>Esse último ponto é o que separa a resposta boa da decorada.\u003c/em> Muita gente responde como se o tipo fosse uma propriedade da dimensão inteira.\u003c/p>\n\u003cp>\u003cem>Follow-ups comuns:\u003c/em>\u003c/p>\n\u003cul>\u003cli>\"Como você detecta que houve mudança?\" → Comparação campo a campo ou, mais eficiente, hash dos atributos relevantes (hash diff) comparado com o hash da versão corrente.\u003c/li>\u003cli>\"O que acontece com as tabelas fato já carregadas?\" → Nada. Elas continuam apontando para a surrogate key da versão que estava vigente no momento do evento. É exatamente isso que preserva a correção histórica.\u003c/li>\u003cli>\"E se um registro chegar atrasado, com data anterior à versão corrente?\" → Isso é late-arriving data e exige tratamento explícito: inserir a versão retroativamente e ajustar os intervalos de validade das linhas vizinhas. É um caso que quebra implementações ingênuas.\u003c/li>\u003c/ul>"},{"titleHtml":"🟡 P6. Por que usar surrogate keys em vez da chave natural?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Cinco motivos. Primeiro, e o mais importante: SCD Tipo 2 exige múltiplas linhas com a mesma chave natural, então a chave primária tem que ser outra coisa. Segundo, isolamento: se o sistema de origem mudar o formato do ID ou se eu integrar duas origens com IDs conflitantes, o warehouse não quebra. Terceiro, performance: um inteiro é mais barato de comparar e armazenar em bilhões de linhas de fato do que uma string longa. Quarto, permite linhas especiais na dimensão para \"desconhecido\" ou \"não aplicável\", o que evita NULL em chave estrangeira e permite usar INNER JOIN. Quinto, lida com entidades sem chave natural estável.\u003c/p>\n\u003cp>\u003cem>Follow-up:\u003c/em> \"E hash keys?\" → São a alternativa moderna usada em Data Vault e em ambientes distribuídos: geradas determinísticamente a partir da chave natural, permitindo carga paralela sem coordenação central para gerar sequências. O trade-off é perder ordenação e aceitar risco (desprezível) de colisão.\u003c/p>"},{"titleHtml":"🟡 P7. O que é uma factless fact table e para que serve?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> É uma tabela fato sem métrica numérica, que registra apenas a ocorrência de um relacionamento entre dimensões. Dois usos: registrar eventos que não têm medida (aluno matriculado numa turma num semestre — a métrica é a contagem de linhas), e registrar cobertura ou elegibilidade (quais produtos estavam em promoção em cada dia). O segundo uso é o mais interessante, porque permite responder perguntas sobre o que \u003cstrong>não\u003c/strong> aconteceu: fazendo a diferença entre a factless de promoções vigentes e a fato de vendas, você descobre quais produtos em promoção não venderam — algo que a fato de vendas sozinha nunca poderia responder, porque ausência de venda não gera linha.\u003c/p>"},{"titleHtml":"🟡 P8. Como você modelaria uma métrica que é um percentual, como taxa de conversão?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Não armazenaria o percentual. Percentual é não-aditivo: a média de médias está errada quando os grupos têm tamanhos diferentes. Armazenaria numerador e denominador como duas métricas aditivas (\u003ccode>conversoes\u003c/code> e \u003ccode>sessoes\u003c/code>) e calcularia a razão no momento da consulta, depois da agregação. Assim a métrica está correta em qualquer nível de agregação. O mesmo raciocínio vale para ticket médio, margem percentual e qualquer ratio.\u003c/p>"},{"titleHtml":"🔴 P9. O que é Data Vault e quando você o usaria em vez de modelagem dimensional?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Data Vault decompõe o modelo em hubs (chaves de negócio), links (relacionamentos, sempre modelados como many-to-many) e satellites (atributos e seu histórico, insert-only com hash diff). O objetivo é auditabilidade total e resiliência a mudança: como nada é atualizado ou deletado, você reconstrói o estado do dado em qualquer instante — inclusive o que a origem afirmou quando estava errada — e adicionar uma nova fonte significa acrescentar estruturas, não refatorar as existentes. As hash keys permitem carga totalmente paralela.\u003c/p>\n\u003cp>O ponto crucial é que Data Vault \u003cstrong>não substitui\u003c/strong> modelagem dimensional: ele fica na camada de integração, e você constrói star schemas em cima para consumo. Consultar o Vault diretamente é impraticável pelo volume de joins.\u003c/p>\n\u003cp>Eu usaria em contexto de muitas fontes heterogêneas e voláteis, exigência regulatória forte de auditoria, e várias equipes contribuindo para o mesmo warehouse. Não usaria numa empresa pequena com poucas fontes — a explosão de tabelas e a complexidade não se pagam.\u003c/p>\n\u003cp>\u003cem>Follow-up:\u003c/em> \"Qual o maior risco de adotar Data Vault?\" → Custo de manutenção subestimado e disciplina de equipe. O modelo só entrega o valor prometido se as convenções forem seguidas com rigor; times que \"quase\" seguem Data Vault acabam com o pior dos dois mundos: complexidade alta e auditabilidade incompleta.\u003c/p>"},{"titleHtml":"🔴 P10. Uma dimensão precisa suportar tanto a visão histórica quanto a visão atual do mesmo atributo. Como você resolve?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> SCD Tipo 6 — híbrido. As linhas são versionadas como Tipo 2, preservando o valor vigente na época em uma coluna, e adicionalmente cada linha carrega colunas com o valor \u003cstrong>atual\u003c/strong> do atributo, atualizadas em todas as versões quando há mudança (comportamento Tipo 1 aplicado sobre uma estrutura Tipo 2). Isso permite responder na mesma consulta \"quanto vendeu a região à qual o vendedor pertencia no momento da venda\" e \"quanto vendeu a região à qual ele pertence hoje\", só trocando a coluna.\u003c/p>\n\u003cp>A alternativa é Tipo 7: a fato carrega tanto a surrogate key quanto a chave natural durável, e você expõe duas views — uma que junta pela surrogate (histórica) e outra que junta pela chave durável com a linha corrente (atual). Tipo 7 evita reescrever as linhas antigas a cada mudança, ao custo de uma fato mais larga e de disciplina no consumo.\u003c/p>\n\u003cp>\u003cem>Follow-up esperado:\u003c/em> \"Qual o custo do Tipo 6 em uma dimensão com milhões de linhas?\" → Toda mudança exige atualizar todas as versões históricas daquela entidade, o que em engines colunares e formatos imutáveis (Parquet/Iceberg) significa reescrever arquivos inteiros. Em volume alto, Tipo 7 ou uma view calculada sobre Tipo 2 puro costumam sair mais barato.\u003c/p>"},{"titleHtml":"🔴 P11. Como você modelaria um relacionamento many-to-many entre fato e dimensão? Por exemplo, uma venda hospitalar com múltiplos diagnósticos.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Com uma \u003cstrong>bridge table\u003c/strong> (tabela ponte). Em vez de a fato apontar direto para a dimensão de diagnóstico, ela aponta para uma chave de \u003cem>grupo\u003c/em> de diagnósticos, e a bridge relaciona cada grupo aos diagnósticos individuais. Isso preserva o grão da fato — uma linha por atendimento — enquanto permite explodir para os diagnósticos quando necessário.\u003c/p>\n\u003cp>O problema clássico dessa estrutura é a \u003cstrong>dupla contagem\u003c/strong>: ao juntar fato → bridge → dimensão, o valor do atendimento aparece uma vez por diagnóstico, e um \u003ccode>SUM\u003c/code> ingênuo infla o total. A solução é adicionar um \u003cstrong>fator de alocação (weighting factor)\u003c/strong> na bridge, que distribui a métrica entre os membros do grupo somando 1.0 no total. Aí você tem duas leituras válidas e distintas: a alocada (soma corretamente, \"quanto do custo é atribuível a cada diagnóstico\") e a de impacto (não soma, \"quanto custaram os atendimentos que envolveram esse diagnóstico\"). Explicitar qual das duas o negócio quer é parte da resposta.\u003c/p>\n\u003cp>A alternativa simplória é achatar em colunas fixas (\u003ccode>diagnostico_1\u003c/code>, \u003ccode>diagnostico_2\u003c/code>, \u003ccode>diagnostico_3\u003c/code>), que só funciona se houver um limite baixo e estável, e que é péssima de consultar. Vale mencionar como o que \u003cstrong>não\u003c/strong> fazer.\u003c/p>"},{"titleHtml":"🔴 P12. Como você lida com late-arriving facts e late-arriving dimensions?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> São dois problemas distintos.\u003c/p>\n\u003cp>\u003cstrong>Late-arriving fact\u003c/strong> (o evento chega depois, mas a dimensão já existe): você precisa encontrar a versão da dimensão que estava \u003cstrong>vigente na data do evento\u003c/strong>, não a versão corrente. Isso significa que o lookup da surrogate key filtra por \u003ccode>data_evento BETWEEN data_inicio_validade AND data_fim_validade\u003c/code>, e não por \u003ccode>flag_atual = true\u003c/code>. Errar isso é o bug mais comum de carga de SCD Tipo 2 — e ele é silencioso, porque o resultado parece plausível.\u003c/p>\n\u003cp>\u003cstrong>Late-arriving dimension / early-arriving fact\u003c/strong> (o evento chega antes de a dimensão existir): você não pode descartar o fato nem deixar a FK nula. A solução padrão é criar uma \u003cstrong>linha inferida (inferred member)\u003c/strong> na dimensão, com a chave natural conhecida e os demais atributos preenchidos com valores default ou \"desconhecido\", marcada com uma flag de inferida. Quando a dimensão real chegar, você atualiza aquela linha (comportamento Tipo 1) em vez de criar uma nova, e desmarca a flag. Assim a fato nunca perde a ligação.\u003c/p>\n\u003cp>Um terceiro caso: a \u003cstrong>mudança de dimensão chega atrasada\u003c/strong>, com data de vigência anterior à linha corrente. Aí você precisa inserir a versão no meio do histórico e reajustar os intervalos de validade das linhas vizinhas — e, dependendo da política, reprocessar as fatos daquele período para reapontar as surrogate keys. É caro, e é por isso que vale definir explicitamente uma janela de tolerância (por exemplo, 7 dias) além da qual a correção retroativa não é feita automaticamente.\u003c/p>"},{"titleHtml":"🔴 P13. O star schema ainda faz sentido com engines colunares modernas e storage barato? Muita gente defende One Big Table.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> O trade-off mudou de peso, mas não desapareceu. Colunar mais compressão tornaram a redundância barata, e engines modernas fazem broadcast join de dimensões pequenas quase de graça — então o argumento \"joins são caros\" perdeu força para o caso comum.\u003c/p>\n\u003cp>O que OBT \u003cstrong>não\u003c/strong> resolve: quando um atributo de dimensão muda, você precisa reescrever a tabela inteira em vez de uma linha da dimensão, o que é caro e lento em volume alto. Você perde dimensões conformadas e, com elas, a capacidade de cruzar domínios de forma consistente — cada time cria a sua OBT, e as definições divergem. E você perde o ponto único de manutenção de definição de negócio.\u003c/p>\n\u003cp>Na prática, o padrão que eu defendo é star schema na camada modelada, com OBTs materializadas como camada de consumo para casos de uso específicos e de alto volume de acesso. Você mantém a governança do modelo dimensional e ganha a performance da desnormalização onde ela importa. Dizer que uma abordagem substitui a outra é o erro; elas ocupam camadas diferentes.\u003c/p>"},{"titleHtml":"🔴 P14. Você tem uma dimensão de cliente com 200 milhões de linhas e uns 10 atributos que mudam quase todo mês (score de crédito, faixa de gasto, segmento). SCD Tipo 2 nessa dimensão é viável?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> Não da forma ingênua. Com 200 milhões de clientes e mudança mensal em atributos voláteis, a dimensão cresceria ~2,4 bilhões de linhas por ano, o que é maior que muitas tabelas fato — isso é o sintoma clássico de \u003cstrong>rapidly changing dimension\u003c/strong> modelada errado.\u003c/p>\n\u003cp>A solução padrão é a \u003cstrong>mini-dimensão\u003c/strong> (SCD Tipo 4): separo os atributos voláteis numa dimensão própria, tipicamente convertendo valores contínuos em faixas (banding) — score vira faixa de score, gasto vira faixa de gasto. Isso limita a cardinalidade ao número de \u003cstrong>combinações distintas\u003c/strong> de faixas, que pode ser algo como dezenas de milhares em vez de bilhões. A tabela fato passa a referenciar duas chaves: a dimensão de cliente (com atributos estáveis, Tipo 2 normal) e a mini-dimensão (o perfil vigente no momento do evento).\u003c/p>\n\u003cp>Isso preserva a análise histórica — \"quanto compraram os clientes que na época estavam na faixa alta de score\" — sem explodir a dimensão. O custo é perda de granularidade dos atributos contínuos, e é uma conversa a ter com o negócio: as faixas precisam ser definidas por eles e mudá-las depois é doloroso.\u003c/p>\n\u003cp>Se o negócio exigir o valor exato e não a faixa, aí a alternativa é uma tabela de histórico separada (Tipo 4 clássico) consultada apenas quando necessário, com a dimensão principal mantendo só o estado corrente.\u003c/p>"},{"titleHtml":"🔴 P15. Como você decidiria o grão de uma tabela fato em um contexto ambíguo, e o que acontece se errar?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cem>Resposta modelo:\u003c/em> A regra é escolher o \u003cstrong>grão mais atômico\u003c/strong> que a origem permite, não o grão que as perguntas atuais exigem. Se a origem tem item de pedido, modele item de pedido, mesmo que hoje todo mundo pergunte só no nível de pedido. Motivo: você sempre pode agregar para cima, nunca desagregar para baixo. Modelar no grão agregado é uma decisão irreversível sem reprocessar tudo.\u003c/p>\n\u003cp>As exceções são custo e volume: se o grão atômico gera petabytes e nenhuma pergunta plausível desce até lá, um snapshot agregado pode se justificar — mas isso deve ser uma decisão explícita e documentada, idealmente mantendo o dado atômico numa camada bruta para reprocessamento futuro.\u003c/p>\n\u003cp>Se errar para cima (grão agregado demais), você perde a capacidade de responder perguntas novas e precisa reprocessar da origem. Se errar para baixo (mais granular que o necessário), você paga custo de storage e compute desnecessário — que é um erro muito mais barato de corrigir. Na dúvida, erre para baixo.\u003c/p>\n\u003cp>O outro erro clássico é \u003cstrong>misturar grãos na mesma tabela\u003c/strong>: linhas de item de pedido junto com linhas de frete no nível do pedido. Isso quebra qualquer agregação e é notoriamente difícil de detectar, porque a tabela \"parece\" certa até alguém somar.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual é a diferença \u003cstrong>raiz\u003c/strong> entre OLTP e OLAP, da qual todas as outras derivam?","a":["OLTP é mais antigo que OLAP","O padrão de acesso: OLTP acessa por chave em transações pequenas; OLAP acessa por fatia, varrendo e agregando muito dado — layout físico, normalização e índices são consequência disso","OLAP não suporta SQL","OLTP usa armazenamento colunar e OLAP usa linha"],"c":1,"e":"A opção D está invertida: OLTP é orientado a linha (lê o registro inteiro) e OLAP é colunar (lê poucas colunas de muitas). Colunar é rápido por I/O: menos bytes lidos e compressão muito melhor."},{"n":"🟢","levelName":"basico","q":"Qual deve ser a \u003cstrong>primeira decisão\u003c/strong> ao modelar uma tabela fato?","a":["Escolher o engine de banco de dados","Declarar o grão: a definição precisa do que representa uma linha — tudo o mais depende disso","Listar as métricas desejadas pelos analistas","Definir os índices da tabela"],"c":1,"e":"Uma linha por item de pedido versus uma linha por pedido produz modelos incompatíveis. A regra: escolher o grão mais atômico que a origem permite, porque agregar para cima é sempre possível; desagregar, nunca."},{"n":"🟡","levelName":"intermediario","q":"Qual é o motivo \u003cstrong>mais importante\u003c/strong> para usar surrogate keys em vez da chave natural?","a":["Economizar espaço em disco nas dimensões","SCD Tipo 2 exige múltiplas linhas com a mesma chave natural, então a chave primária precisa ser outra coisa","Evitar joins entre fato e dimensão","Chaves naturais não podem ser indexadas"],"c":1,"e":"Além do SCD2: isolamento de mudanças na origem, performance de inteiros em bilhões de linhas, linhas especiais (-1 = desconhecido, que evita NULL em FK) e integração de origens com IDs conflitantes."},{"n":"🟡","levelName":"intermediario","q":"Como funciona o \u003cstrong>SCD Tipo 2\u003c/strong>?","a":["Sobrescreve o valor antigo, sem histórico","Cada mudança gera uma nova linha na dimensão com nova surrogate key e colunas de validade; as fatos antigas continuam apontando para a versão vigente na época do evento","Adiciona uma coluna com o valor anterior","Move os atributos que mudam para uma tabela separada"],"c":1,"e":"A opção A é Tipo 1, a C é Tipo 3 e a D é Tipo 4 (mini-dimensão). O ponto central do Tipo 2 é preservar o contexto histórico: relatórios antigos permanecem corretos."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>saldo de conta\u003c/strong> é uma métrica semi-aditiva?","a":["Porque não pode ser somada em nenhuma dimensão","Porque pode ser somada entre contas no mesmo dia, mas somar saldos da mesma conta ao longo do tempo produz um número sem significado","Porque só pode ser somada com filtro de moeda","Porque saldo é sempre uma média"],"c":1,"e":"No eixo tempo, semi-aditivas exigem LAST_VALUE ou média, não soma. Já percentuais e ratios são não-aditivos: guarde numerador e denominador e calcule a razão após agregar — média de médias está errada."},{"n":"🟡","levelName":"intermediario","q":"Como modelar corretamente uma métrica de \u003cstrong>taxa de conversão\u003c/strong> no warehouse?","a":["Armazenar o percentual já calculado em cada linha","Armazenar numerador (conversões) e denominador (sessões) como métricas aditivas e calcular a razão na consulta, após a agregação","Armazenar a média diária do percentual","Pré-calcular a média mensal na carga"],"c":1,"e":"Assim a métrica está correta em qualquer nível de agregação. Média de médias e soma de percentuais erram sempre que os grupos têm tamanhos diferentes."},{"n":"🔴","levelName":"avancado","q":"Ao carregar um \u003cstrong>fato atrasado\u003c/strong> (late-arriving fact) numa fato ligada a dimensão SCD Tipo 2, o lookup da surrogate key deve:","a":["Buscar a linha com flag_registro_atual = true","Filtrar pelo intervalo de validade que contém a data do evento — buscar a versão corrente atribui o evento ao contexto errado, silenciosamente","Usar a chave natural diretamente na fato","Descartar o fato, pois chegou fora da janela"],"c":1,"e":"É o bug mais comum de carga com SCD2 — os números saem plausíveis, só que errados. Já o caso inverso (fato chega antes da dimensão) usa linha inferida (inferred member) atualizada depois."},{"n":"🔴","levelName":"avancado","q":"Dimensão de cliente com 200 milhões de linhas e atributos que mudam todo mês (score, faixa de gasto). SCD Tipo 2 ingênuo geraria bilhões de linhas. Qual a solução padrão?","a":["Usar SCD Tipo 1 e abrir mão de todo o histórico","Mini-dimensão (Tipo 4): separar os atributos voláteis em faixas (banding) numa dimensão própria, referenciada diretamente pela fato — a cardinalidade cai para as combinações de faixas","Particionar a dimensão por mês","Trocar a dimensão por uma tabela fato"],"c":1,"e":"É o sintoma clássico de rapidly changing dimension. A fato passa a carregar duas chaves: a dimensão estável do cliente e o perfil vigente na mini-dimensão. O custo é a perda de granularidade dos valores contínuos."}]},{"id":"02","fullTitle":"02 — Data Warehouse, Data Lake e Lakehouse","shortTitle":"Data Warehouse, Data Lake e Lakehouse","subtitle":"Diferenças reais · Schema-on-read vs schema-on-write · Formatos de tabela (Iceberg, Delta, Hudi) · Data mesh · Quando usar cada arquitetura","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-a-história-explica-a-arquitetura\">1.1 A história explica a arquitetura\u003c/h3>\n\u003cp>Você responde muito melhor a este tópico se souber \u003cem>por que\u003c/em> cada coisa apareceu, em vez de decorar uma tabela comparativa.\u003c/p>\n\u003cp>\u003cstrong>Data warehouse (anos 80–90).\u003c/strong> Storage e compute eram caros e acoplados: um appliance (Teradata, Netezza, Exadata) com discos e CPUs no mesmo caixote. Como cada byte custava, você só guardava dado que já sabia que ia usar, já limpo e já modelado. Daí \u003cstrong>schema-on-write\u003c/strong>: a estrutura é definida e validada no momento da ingestão. O resultado é um sistema com governança forte, performance excelente, SQL maduro, e uma limitação óbvia — se você quiser fazer uma pergunta nova sobre um dado que não foi modelado, o dado simplesmente não está lá. E escalar significava comprar outro appliance.\u003c/p>\n\u003cp>\u003cstrong>Data lake (2010s).\u003c/strong> Hadoop e depois o object storage em nuvem (S3, GCS, ADLS) mudaram a economia: storage virou quase gratuito e desacoplado do compute. Surge a tese oposta — guarde \u003cstrong>tudo\u003c/strong>, bruto, em arquivos, e decida a estrutura na hora de ler (\u003cstrong>schema-on-read\u003c/strong>). Isso destravou dado semiestruturado e não estruturado (JSON, logs, imagens, áudio), machine learning, e a possibilidade de fazer perguntas que não foram antecipadas.\u003c/p>\n\u003cp>O problema é que, sem as garantias que o warehouse dava, muitos data lakes viraram \u003cstrong>data swamps\u003c/strong>: sem catálogo, ninguém sabia o que existia; sem schema enforcement, arquivos com formatos incompatíveis conviviam na mesma pasta; sem transações, um job que falhava no meio deixava dado parcial visível; sem controle de qualidade, ninguém confiava nos números. E o dado bruto exigia trabalho pesado antes de virar resposta.\u003c/p>\n\u003cp>\u003cstrong>Lakehouse (final dos 2010s até hoje).\u003c/strong> A tentativa de ter os dois: dado em object storage aberto e barato, em formato colunar aberto (Parquet), \u003cstrong>mais\u003c/strong> uma camada de metadados transacional por cima que devolve as garantias do warehouse — ACID, schema enforcement e evolution, time travel, upserts e deletes eficientes. Essa camada é o que chamamos de \u003cstrong>formato de tabela\u003c/strong>: Apache Iceberg, Delta Lake, Apache Hudi.\u003c/p>\n\u003cp>O lakehouse não é uma ferramenta, é um padrão arquitetural. A percepção correta é: \u003cstrong>o formato de tabela é o que transforma um monte de arquivos Parquet num sistema com semântica de banco de dados.\u003c/strong>\u003c/p>\n\u003ch3 id=\"h-1-2-comparação-estruturada\">1.2 Comparação estruturada\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Dimensão\u003c/th>\u003cth>Data Warehouse\u003c/th>\u003cth>Data Lake\u003c/th>\u003cth>Lakehouse\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Dado\u003c/td>\u003ctd>Estruturado, curado\u003c/td>\u003ctd>Qualquer tipo, bruto\u003c/td>\u003ctd>Qualquer tipo, com camada curada\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Schema\u003c/td>\u003ctd>On-write (validado na ingestão)\u003c/td>\u003ctd>On-read (interpretado na leitura)\u003c/td>\u003ctd>On-write na camada de tabela, on-read na bruta\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>Proprietário, acoplado ao engine\u003c/td>\u003ctd>Object storage, arquivos abertos\u003c/td>\u003ctd>Object storage, formato aberto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transações\u003c/td>\u003ctd>ACID nativo\u003c/td>\u003ctd>Nenhuma\u003c/td>\u003ctd>ACID via formato de tabela\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Custo de storage\u003c/td>\u003ctd>Alto\u003c/td>\u003ctd>Muito baixo\u003c/td>\u003ctd>Muito baixo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Engines que leem\u003c/td>\u003ctd>Um (o do fornecedor)\u003c/td>\u003ctd>Vários, sem coordenação\u003c/td>\u003ctd>Vários, com coordenação transacional\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Usuário típico\u003c/td>\u003ctd>Analista, BI\u003c/td>\u003ctd>Cientista de dados, engenheiro\u003c/td>\u003ctd>Ambos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Risco principal\u003c/td>\u003ctd>Rigidez e custo\u003c/td>\u003ctd>Virar swamp\u003c/td>\u003ctd>Complexidade operacional\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Governança\u003c/td>\u003ctd>Forte, embutida\u003c/td>\u003ctd>Precisa ser construída\u003c/td>\u003ctd>Suportada pelo formato + catálogo\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"h-1-3-schema-on-write-vs-schema-on-read-o-trade-off-real\">1.3 Schema-on-write vs schema-on-read: o trade-off real\u003c/h3>\n\u003cp>Esta é a pergunta conceitual mais importante do tópico, e a maioria das respostas é rasa.\u003c/p>\n\u003cp>\u003cstrong>Schema-on-write\u003c/strong> move o custo de validação para a ingestão. Consequências: dado ruim é rejeitado na porta de entrada; quem lê tem garantia de estrutura; consultas são mais rápidas porque o engine conhece os tipos com antecedência; e mudar o schema é caro, porque exige migração. A rigidez é o preço da confiança.\u003c/p>\n\u003cp>\u003cstrong>Schema-on-read\u003c/strong> move o custo para a leitura. Consequências: ingestão é rápida e nunca falha por formato; você preserva informação que ainda não sabe usar; mas \u003cstrong>cada consumidor\u003c/strong> paga o custo de interpretar, e — o ponto crítico — \u003cstrong>cada consumidor pode interpretar de forma diferente\u003c/strong>. É aí que a inconsistência nasce. Dois times leem o mesmo JSON e discordam sobre o que significa um campo ausente.\u003c/p>\n\u003cp>O insight que impressiona: schema-on-read não elimina o schema, ele \u003cstrong>move a responsabilidade e a fragmenta\u003c/strong>. O schema sempre existe; a pergunta é se ele é declarado e aplicado num lugar só, ou implícito e reimplementado N vezes. É exatamente por isso que o lakehouse aplica schema na camada de tabela — para reconsolidar essa responsabilidade — e por isso contratos de dados (ver arquivo 11) viraram tema.\u003c/p>\n\u003ch3 id=\"h-1-4-formatos-de-tabela-o-que-iceberg-delta-e-hudi-realmente-\">1.4 Formatos de tabela: o que Iceberg, Delta e Hudi realmente fazem\u003c/h3>\n\u003cp>Um formato de tabela é uma especificação de \u003cstrong>metadados\u003c/strong> que fica sobre arquivos de dados (quase sempre Parquet). Ele resolve problemas que um diretório de arquivos não resolve:\u003c/p>\n\u003cp>\u003cstrong>Qual é o conjunto de arquivos que compõe a tabela agora?\u003c/strong> Sem formato de tabela, \"a tabela\" é \"tudo que está nesse prefixo do S3\" — o que significa que um job escrevendo agora torna dados parciais visíveis, e listar milhões de objetos é lento e caro. Com formato de tabela, existe um manifesto explícito: a versão N da tabela é \u003cem>esta lista de arquivos\u003c/em>. Isso dá \u003cstrong>atomicidade\u003c/strong> (a nova versão só fica visível quando o commit troca o ponteiro) e \u003cstrong>isolamento de snapshot\u003c/strong> (leitores em curso continuam vendo a versão antiga, consistente).\u003c/p>\n\u003cp>\u003cstrong>Como fazer UPDATE e DELETE em arquivos imutáveis?\u003c/strong> Parquet não permite alterar uma linha. Duas estratégias:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Copy-on-Write (CoW)\u003c/strong>: reescreve o arquivo inteiro que contém a linha afetada. Escrita cara, leitura rápida (nada extra a fazer). Bom para tabelas com leitura frequente e escrita rara.\u003c/li>\u003cli>\u003cstrong>Merge-on-Read (MoR)\u003c/strong>: grava um arquivo de delta (delete file, deletion vector ou log de mudanças) e resolve na leitura. Escrita barata, leitura mais cara até a compactação rodar. Bom para ingestão frequente e upserts em alto volume.\u003c/li>\u003c/ul>\n\u003cp>Saber explicar CoW vs MoR é o diferencial nesta parte. É um trade-off de write amplification versus read amplification, e a resposta correta depende da razão leitura/escrita da tabela.\u003c/p>\n\u003cp>\u003cstrong>Como consultar o passado?\u003c/strong> Cada commit gera um snapshot. Time travel é consultar o estado da tabela em um snapshot ou timestamp anterior — útil para auditoria, para reprodutibilidade de modelos de ML, e para rollback quando um pipeline escreveu lixo.\u003c/p>\n\u003cp>\u003cstrong>Como evoluir o schema sem reescrever tudo?\u003c/strong> Formatos modernos rastreiam colunas por \u003cstrong>ID\u003c/strong>, não por posição ou nome. Isso permite adicionar, remover e renomear colunas de forma segura, sem reescrever arquivos antigos e sem risco de leitura desalinhada.\u003c/p>\n\u003cp>\u003cstrong>Como particionar sem obrigar o usuário a saber da partição?\u003c/strong> O Iceberg introduziu \u003cstrong>hidden partitioning\u003c/strong>: a partição é derivada de uma coluna real por uma transformação declarada (por exemplo, \u003ccode>day(event_timestamp)\u003c/code>), e o engine aplica o pruning automaticamente quando você filtra por \u003ccode>event_timestamp\u003c/code>. No modelo antigo do Hive, você precisava filtrar explicitamente pela coluna de partição (\u003ccode>WHERE dt = '2026-08-14'\u003c/code>) ou a query varria tudo — uma das maiores fontes de custo acidental em data lakes. O Iceberg também permite \u003cstrong>partition evolution\u003c/strong>: mudar o esquema de particionamento sem reescrever dados históricos.\u003c/p>\n\u003cp>\u003cstrong>Estado do ecossistema (2026):\u003c/strong> Iceberg consolidou-se como a escolha padrão para lakehouses novos e abertos, com adoção ampla em catálogos e engines. O spec v3, ratificado em 2025, trouxe deletion vectors, tipo variant para semiestruturado, row lineage e tipos geoespaciais. Delta Lake, originado no Databricks, é maduro e tem o UniForm, que expõe tabelas Delta como se fossem Iceberg para leitores externos. Hudi mantém vantagem específica em cargas de upsert de altíssima frequência, com um Merge-on-Read que grava apenas colunas alteradas, reduzindo write amplification. A tendência é de \u003cstrong>convergência\u003c/strong>: os três formatos vêm adotando as ideias uns dos outros, e a discussão importante está migrando de \"qual formato\" para \"qual catálogo\" — porque é o catálogo que gerencia o commit, o controle de acesso e a interoperabilidade entre engines.\u003c/p>\n\u003cp>Numa entrevista, se você não trabalhou com os três, seja honesto e responda pelos conceitos: CoW vs MoR, snapshot isolation, hidden partitioning, schema evolution por ID de coluna. Isso vale mais do que citar recursos de release notes.\u003c/p>\n\u003ch3 id=\"h-1-5-catálogo-a-peça-que-candidatos-esquecem\">1.5 Catálogo: a peça que candidatos esquecem\u003c/h3>\n\u003cp>O \u003cstrong>catálogo\u003c/strong> é o serviço que mapeia nomes de tabela para a localização de seus metadados e que arbitra os commits. Sem ele, dois writers podem sobrescrever o trabalho um do outro, porque object storage historicamente não oferece operação de compare-and-swap confiável.\u003c/p>\n\u003cp>Opções: Hive Metastore (o legado, ainda onipresente), AWS Glue Data Catalog, Unity Catalog (Databricks), Polaris/Snowflake Open Catalog, Nessie (com semântica de branches tipo Git), e o \u003cstrong>Iceberg REST Catalog\u003c/strong>, que virou a interface padronizada e é o que permite trocar de implementação sem reescrever pipelines.\u003c/p>\n\u003cp>O catálogo é também onde vive a \u003cstrong>governança\u003c/strong>: controle de acesso por tabela, coluna e linha, políticas de mascaramento, e lineage. Mencionar o catálogo como componente distinto do formato mostra que você entende a arquitetura de verdade — muita gente trata \"Iceberg\" como se fosse uma coisa só.\u003c/p>\n\u003ch3 id=\"h-1-6-data-lakehouse-na-prática-camadas\">1.6 Data lakehouse na prática: camadas\u003c/h3>\n\u003cp>A organização mais comum é a \u003cstrong>arquitetura Medallion\u003c/strong>:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Bronze (raw)\u003c/strong>: dado ingerido como veio, sem transformação, com metadados de ingestão (origem, timestamp, arquivo de origem). Append-only. Serve como fonte de verdade para reprocessamento — se a lógica de negócio mudar, você reprocessa do Bronze sem precisar reler da origem.\u003c/li>\u003cli>\u003cstrong>Silver (cleansed / conformed)\u003c/strong>: dado limpo, tipado, deduplicado, com regras de qualidade aplicadas, chaves resolvidas e entidades conformadas entre fontes. É onde a maior parte da engenharia acontece.\u003c/li>\u003cli>\u003cstrong>Gold (curated / serving)\u003c/strong>: dado agregado e modelado para consumo — normalmente star schemas, métricas de negócio, features para ML.\u003c/li>\u003c/ul>\n\u003cp>Os nomes vêm do vocabulário Databricks, mas o padrão é antigo (raw / staging / mart). O valor real das camadas é ter um ponto de reprocessamento: se você só tem o dado final e a lógica estava errada, você depende da origem ainda ter o histórico — e frequentemente ela não tem.\u003c/p>\n\u003cp>Uma nuance que vale citar: camadas custam dinheiro e latência. Três cópias do dado e três jobs de transformação. Em pipelines simples, colapsar Bronze e Silver é uma decisão legítima. O erro é adotar a arquitetura como ritual.\u003c/p>\n\u003ch3 id=\"h-1-7-data-mesh-e-data-fabric\">1.7 Data Mesh e Data Fabric\u003c/h3>\n\u003cp>\u003cstrong>Data Mesh\u003c/strong> (Zhamak Dehghani) não é uma tecnologia, é um modelo \u003cstrong>organizacional\u003c/strong>, e essa é a primeira coisa a dizer. Quatro princípios:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Propriedade por domínio\u003c/strong>: o time que gera o dado é responsável por ele, em vez de um time central de dados ser gargalo para todos.\u003c/li>\u003cli>\u003cstrong>Dado como produto\u003c/strong>: cada dataset tem dono, SLA, documentação, versionamento e consumidores tratados como clientes.\u003c/li>\u003cli>\u003cstrong>
