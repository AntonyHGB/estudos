larificar:\u003c/strong> Quantos documentos e de que tipo? Com que frequência mudam? Quem são os usuários e qual o custo de uma resposta errada? Há controle de acesso por documento? Latência e orçamento aceitáveis? Existe um conjunto de perguntas e respostas de referência?\u003c/p>\n\u003cp>\u003cstrong>Enquadramento:\u003c/strong> Recuperação seguida de geração ancorada. \u003cstrong>A decisão mais importante é definir o que acontece quando o sistema não sabe\u003c/strong> — em contexto corporativo, \"não encontrei informação sobre isso\" é uma resposta boa e uma alucinação confiante é um incidente.\u003c/p>\n\u003cp>\u003cstrong>Pipeline offline:\u003c/strong> ingestão e normalização dos documentos (com metadados: fonte, data, autor, permissões); \u003cstrong>chunking\u003c/strong>, que eu trataria como decisão de primeira ordem e não detalhe — dividir respeitando estrutura (seções, parágrafos) com sobreposição, e um padrão eficaz é indexar chunks pequenos para a busca mas recuperar a janela maior ao redor para o contexto; embedding com modelo adequado ao idioma e domínio; indexação vetorial e índice léxico em paralelo.\u003c/p>\n\u003cp>\u003cstrong>Pipeline online:\u003c/strong> processamento da consulta (reescrita, e decomposição se for uma pergunta composta); \u003cstrong>recuperação híbrida\u003c/strong> (densa + BM25) com \u003cstrong>filtro de permissão aplicado na busca\u003c/strong>, não depois — vazar conteúdo que o usuário não pode ver é o pior modo de falha; \u003cstrong>reranking com cross-encoder\u003c/strong> sobre os top-N, que é a intervenção de melhor custo-benefício em qualidade; montagem do prompt com instrução explícita de responder só com base nas fontes e admitir insuficiência; geração com \u003cstrong>citações rastreáveis\u003c/strong>; e pós-processamento verificando se as citações existem e correspondem.\u003c/p>\n\u003cp>\u003cstrong>Avaliação em duas camadas\u003c/strong> — porque sem isso não dá para melhorar nada: \u003cstrong>recuperação\u003c/strong> (recall@k, MRR sobre um conjunto de perguntas com o documento correto anotado) e \u003cstrong>geração\u003c/strong> (fidelidade ao contexto, correção, taxa de recusa apropriada). Eu construiria um conjunto de avaliação fixo de algumas dezenas a centenas de perguntas com respostas de referência, e rodaria como \u003cstrong>teste de regressão\u003c/strong> a cada mudança de prompt, modelo ou índice — sistemas com LLM regridem de forma silenciosa e não-óbvia.\u003c/p>\n\u003cp>\u003cstrong>Riscos operacionais:\u003c/strong> documentos desatualizados ou contraditórios (mitigar com metadados de data e preferência por versões recentes, e sinalizando conflito em vez de escolher arbitrariamente); permissões; custo por consulta (cache exato e semântico, prompt caching, roteamento por dificuldade); e \u003cstrong>prompt injection através do conteúdo recuperado\u003c/strong>, especialmente se o assistente tiver acesso a ferramentas com efeito colateral.\u003c/p>\n\u003cp>\u003cstrong>Evolução:\u003c/strong> começar com recuperação híbrida + reranking + um modelo bom, medir onde estão as falhas, e só então considerar fine-tuning do modelo de embedding no domínio ou do gerador para formato.\u003c/p>"},{"titleHtml":"🔴 Previsão de demanda / estoque","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Clarificar:\u003c/strong> Quantos SKUs e locais? Qual o horizonte (dia, semana, mês)? Qual a granularidade da decisão? Qual o custo de faltar estoque versus sobrar? Há promoções, sazonalidade, feriados, lançamentos? Existe histórico de quanto tempo?\u003c/p>\n\u003cp>\u003cstrong>Enquadramento:\u003c/strong> Previsão de série temporal em larga escala, com uma característica que muda tudo: \u003cstrong>o custo dos erros é assimétrico\u003c/strong>. Faltar estoque perde venda e cliente; sobrar custa capital e possivelmente perda do produto. Isso significa que \u003cstrong>prever a média é a formulação errada\u003c/strong> — o correto é prever \u003cstrong>quantis\u003c/strong> com perda quantílica, e escolher o quantil pelo custo relativo (nível de serviço). Levantar isso é o ponto alto da resposta.\u003c/p>\n\u003cp>Segunda observação de enquadramento: o histórico registra \u003cstrong>vendas\u003c/strong>, não \u003cstrong>demanda\u003c/strong>. Quando o produto esgotou, a venda foi truncada e a demanda real era maior. Treinar em vendas sem corrigir isso ensina o modelo a subestimar exatamente os produtos que mais faltam — um feedback loop que se auto-reforça. Mencionar \u003cem>censored demand\u003c/em> é um diferencial claro.\u003c/p>\n\u003cp>\u003cstrong>Abordagem:\u003c/strong> baseline forte primeiro — sazonal ingênuo e médias móveis. Uma fração grande de projetos de forecasting não bate o baseline ingênuo, e não saber isso é constrangedor. Depois, gradient boosting com features de calendário, lags, janelas móveis, preço, promoção e estoque — que na prática é extremamente competitivo em varejo. Modelos globais (um modelo para todas as séries, com o ID da série como feature) costumam superar modelos por série, porque compartilham padrões entre SKUs e resolvem séries curtas. Modelos neurais de séries temporais quando há muitas séries e padrões complexos.\u003c/p>\n\u003cp>\u003cstrong>Cuidado com árvores:\u003c/strong> elas \u003cstrong>não extrapolam\u003c/strong>, então não conseguem prever crescimento continuado. Se há tendência, é preciso modelá-la explicitamente ou trabalhar com diferenças em vez de níveis.\u003c/p>\n\u003cp>\u003cstrong>Validação\u003c/strong> — walk-forward temporal com gap correspondente ao horizonte de previsão, avaliando por fold e não só na média, porque a degradação nos folds recentes é o sinal de drift que a média esconde. Métrica: WAPE ou MASE (que compara com o baseline ingênuo), evitando MAPE por causa dos zeros e da assimetria. E \u003cstrong>avaliar no nível de agregação em que a decisão é tomada\u003c/strong> — um erro por SKU pode se compensar no agregado, e o que importa é o nível em que o pedido é feito.\u003c/p>\n\u003cp>\u003cstrong>Fechando o ciclo:\u003c/strong> a previsão alimenta uma decisão de reposição, então a métrica final é de negócio — nível de serviço atingido, capital imobilizado, perdas. Um modelo com WAPE melhor que gera pior nível de serviço não é melhor.\u003c/p>"},{"titleHtml":"Por que não usar deep learning aqui?","level":null,"levelName":"sem-nivel","bodyHtml":"\u003cp>— Não é uma provocação, é um teste de julgamento. Resposta forte: em dados tabulares, gradient boosting geralmente iguala ou supera com muito menos custo de tuning e operação; deep learning paga quando há estrutura composicional (imagem, texto, sequência), volume muito grande, ou necessidade de integrar modalidades diferentes num único modelo. E a pergunta que decide: o ganho justifica o custo operacional?\u003c/p>"},{"titleHtml":"E se você tivesse 10× menos dados?","level":null,"levelName":"sem-nivel","bodyHtml":"\u003cp>— Modelo mais simples, regularização mais forte, transfer learning ou modelo pré-treinado em vez de treino do zero, validação cruzada repetida em vez de holdout único, e mais peso em conhecimento de domínio para features. E ser honesto sobre a incerteza: reportar intervalos, não pontos.\u003c/p>"},{"titleHtml":"E se a latência precisasse ser 10ms?","level":null,"levelName":"sem-nivel","bodyHtml":"\u003cp>— Pré-computar tudo que puder em batch, simplificar o modelo (destilação, quantização, menos features), cachear agressivamente, cortar features que exigem chamadas externas, e considerar mover parte da lógica para a etapa de geração de candidatos. E questionar o requisito: 10ms para qual percentil, e o que acontece se estourar?\u003c/p>"},{"titleHtml":"Como você sabe que o sistema está funcionando?","level":null,"levelName":"sem-nivel","bodyHtml":"\u003cp>— Monitoramento em camadas (ver \u003ca href=\"#\" class=\"topic-link\" data-topic=\"11\">11\u003c/a>) e, principalmente, a métrica de negócio com um holdout que permita medir o efeito do sistema inteiro, não só a diferença entre versões.\u003c/p>"},{"titleHtml":"O que você faria diferente se pudesse recomeçar?","level":null,"levelName":"sem-nivel","bodyHtml":"\u003cp>— Teste de reflexão. Respostas fortes: investir mais cedo em qualidade e definição de rótulos, montar o conjunto de avaliação antes do modelo, e resistir mais tempo à complexidade.\u003c/p>"}],"quiz":[{"n":"🟡","levelName":"intermediario","q":"Qual é o \u003cstrong>erro mais reprovador\u003c/strong> numa entrevista de ML system design?","a":["Começar pelo modelo, pulando objetivo, métrica e custo do erro","Não conhecer a arquitetura transformer em profundidade técnica","Propor um baseline simples demais para o problema apresentado","Não citar as ferramentas de mercado mais usadas atualmente"],"c":0,"e":"Um bom candidato passa os primeiros minutos sem mencionar algoritmo: a pergunta é subespecificada de propósito, e a qualidade das perguntas é metade da avaliação. Ninguém é reprovado por propor baseline — muita gente é reprovada por complexidade injustificada — e nomear ferramentas não substitui enquadrar o problema."},{"n":"🟡","levelName":"intermediario","q":"Na arquitetura de duas etapas, qual o objetivo de \u003cstrong>cada etapa\u003c/strong>?","a":["As duas etapas maximizam precision, mudando só o custo do modelo","Candidatos buscam precision alta e o ranking amplia o recall","Candidatos buscam recall alto e barato; ranking busca precision","As duas usam o mesmo modelo, alterando apenas o limiar aplicado"],"c":2,"e":"Não dá para pontuar milhões de itens com modelo caro dentro do orçamento de latência, então a primeira etapa precisa garantir que o item certo esteja no conjunto e a segunda ordena bem o topo. Erro na geração de candidatos é irrecuperável: nenhum ranking traz de volta o que não entrou."},{"n":"🟡","levelName":"intermediario","q":"Por que discutir o \u003cstrong>rótulo\u003c/strong> é a parte mais importante do enquadramento?","a":["Sem rótulo não há como calcular a acurácia do modelo final","O rótulo determina o tamanho do conjunto de dados disponível","O rótulo define qual arquitetura de rede deve ser escolhida","O rótulo disponível costuma ser proxy do objetivo verdadeiro"],"c":3,"e":"Você quer usuário satisfeito e tem usuário clicou, e raciocinar sobre essa distância é o sinal mais forte de senioridade — otimizar clique leva a clickbait. Volume de dados e escolha de arquitetura são consequências posteriores, e a impossibilidade de medir sem rótulo é verdadeira, mas não é o que torna a discussão importante."},{"n":"🔴","levelName":"avancado","q":"Em detecção de fraude, que \u003cstrong>reformulação do alvo\u003c/strong> alinha melhor o modelo ao negócio?","a":["Classificar a fraude em mais categorias e tratar cada uma","Modelar perda esperada: P(fraude) vezes o valor da transação","Prever o país de origem provável do autor da tentativa feita","Maximizar a acurácia global sobre o total de transações do dia"],"c":1,"e":"Pegar uma fraude de cinquenta mil vale mais que dez de cem, e alinhar o alvo ao dinheiro muda a métrica para recall ponderado por valor. Subdividir categorias não resolve a assimetria de valor, prever origem não é o objetivo, e acurácia global é inútil com 0,1% de positivos."},{"n":"🟡","levelName":"intermediario","q":"Quais estratégias atacam o \u003cstrong>cold start\u003c/strong> de usuários e itens novos?","a":["Aumentar o peso dos usuários novos na função de perda usada","Ignorar usuários novos até que acumulem histórico suficiente","Conteúdo, popularidade por segmento, onboarding e exploração","Duplicar os dados dos usuários existentes que mais se parecem"],"c":2,"e":"Atributos existem desde o dia zero, e modelos híbridos migram o peso do conteúdo para o colaborativo conforme o histórico aparece. Avaliar segmentado é essencial, porque usuários frequentes dominam o volume e escondem a falha. Ignorar o problema perde o usuário logo no início, e reponderar ou duplicar não cria informação nova."},{"n":"🔴","levelName":"avancado","q":"Por que treinar um ranker de busca \u003cstrong>diretamente em cliques\u003c/strong> é perigoso?","a":["Cliques vêm enviesados por posição e o modelo copia o ranking","Cliques são caros de coletar e exigem instrumentação dedicada","Cliques não guardam relação nenhuma com a relevância percebida","Cliques são eventos raros demais para treinar qualquer modelo"],"c":0,"e":"Usuários clicam mais no topo independentemente da relevância, então treinar direto ensina o modelo a reproduzir o ranking atual, congelando o sistema. Mitiga-se com modelos de clique que removem o viés, randomização controlada e ponderação por propensão inversa. Cliques são baratos, abundantes e correlacionados com relevância, só que de forma enviesada."},{"n":"🔴","levelName":"avancado","q":"Em previsão de demanda com custos assimétricos, qual a formulação correta?","a":["Prever a média com MSE e somar uma margem fixa de segurança","Prever quantis com perda quantílica, dado o nível de serviço","Prever a mediana com MAE, que é robusta a valores extremos","Classificar cada item em demanda alta ou baixa e reabastecer"],"c":1,"e":"Faltar estoque e sobrar custam valores diferentes, então a estatística central é a formulação errada — o quantil escolhido reflete essa assimetria. E o histórico registra vendas, não demanda: quando esgotou, a venda foi truncada, e treinar sem corrigir ensina o modelo a subestimar justamente o que mais falta."},{"n":"🟡","levelName":"intermediario","q":"Como responder à provocação \u003cstrong>por que não usar deep learning aqui?\u003c/strong> num problema tabular?","a":["Depende do caso, sem especificar de que fatores depende","Concordar e propor um transformer adaptado a dados tabulares","Deep learning é sempre superior, apenas mais caro de operar","Boosting iguala ou supera com muito menos custo de ajuste"],"c":3,"e":"Não é provocação, é teste de julgamento: a pergunta que decide é se o ganho justifica o custo operacional, e deep learning paga quando há estrutura composicional, volume enorme ou multimodalidade. Responder que depende sem dizer de quê é a forma mais rápida de parecer evasivo."}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('site-data').textContent);
DATA.readmeHtml = "<p>Material focado em <strong>conceitos e perguntas de entrevista</strong>, não em código para rodar. O objetivo é que você consiga <strong>defender</strong> cada conceito numa conversa: explicar a intuição, justificar trade-offs, e sobreviver aos follow-ups.</p>\n<hr>\n<h2 id=\"h-como-usar-este-material\">Como usar este material</h2>\n<p>Cada arquivo tem três seções:</p>\n<ol><li><strong>Resumo conceitual</strong> — a explicação densa. Leia primeiro. Fórmulas aparecem só quando esclarecem algo; não decore.</li><li><strong>Perguntas de entrevista</strong> — cada pergunta marcada com nível, seguida de uma resposta modelo (o que o entrevistador quer ouvir) e os follow-ups comuns.</li><li><strong>Armadilhas comuns</strong> — os erros conceituais que derrubam candidatos.</li></ol>\n<h3 id=\"h-níveis-de-dificuldade\">Níveis de dificuldade</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Marca</th><th>Nível</th><th>Quem costuma receber</th></tr></thead><tbody><tr><td>🟢</td><td><strong>Básico</strong></td><td>Triagem inicial, estágio, júnior. Errar aqui é eliminatório.</td></tr><tr><td>🟡</td><td><strong>Intermediário</strong></td><td>Pleno / sênior. É aqui que a maioria das entrevistas mora.</td></tr><tr><td>🔴</td><td><strong>Avançado</strong></td><td>Sênior / staff, ou follow-up de uma resposta boa demais. Errar não elimina, acertar diferencia.</td></tr></tbody></table></div>\n<h3 id=\"h-como-se-autoavaliar-você-não-sabe-seu-nível-hoje\">Como se autoavaliar (você não sabe seu nível hoje)</h3>\n<p>Faça isto por tópico, antes de ler o resumo:</p>\n<ol><li>Leia só o <strong>enunciado</strong> da pergunta e responda em voz alta, cronometrando ~2 minutos.</li><li>Só então leia a resposta modelo.</li><li>Marque-se: <strong>acertei o essencial</strong> / <strong>sabia o nome mas não a intuição</strong> / <strong>não sabia</strong>.</li></ol>\n<p>Regra prática de calibração:</p>\n<ul><li>Se você trava em 🟢 → comece pelos arquivos 01, 02, 03, 04. Nada mais.</li><li>Se 🟢 é confortável e 🟡 é ~50% → seu nível é pleno. O gap está em trade-offs e validação, não em algoritmos.</li><li>Se 🟡 é confortável → foque em 🔴, em 11 (MLOps) e 12 (System Design). É o que separa sênior de pleno na prática.</li></ul>\n<p><strong>O teste real:</strong> se você não consegue explicar o conceito sem usar o jargão, você não sabe o conceito. \"Regularização L1 zera coeficientes\" é jargão repetido. \"L1 zera coeficientes porque o gradiente da penalidade é constante em módulo, então ele continua empurrando o peso em direção a zero mesmo quando o peso já é minúsculo — diferente de L2, cuja força some junto com o peso\" é entendimento.</p>\n<hr>\n<h2 id=\"h-índice\">Índice</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>#</th><th>Tópico</th><th>Conteúdo</th></tr></thead><tbody><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"01\">01</a></td><td><strong>Fundamentos</strong></td><td>Supervisionado / não-supervisionado / reforço, bias-variance, overfitting, regularização L1/L2, teorema No Free Lunch</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"02\">02</a></td><td><strong>Métricas de avaliação</strong></td><td>Matriz de confusão, precision/recall/F1, ROC-AUC vs PR-AUC, quando cada métrica engana, métricas de regressão, calibração</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"03\">03</a></td><td><strong>Validação e dados</strong></td><td>Train/val/test, cross-validation e variantes, data leakage, validação temporal, desbalanceamento de classes</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"04\">04</a></td><td><strong>Modelos clássicos</strong></td><td>Regressão linear/logística, árvores, random forest, gradient boosting (XGBoost/LightGBM/CatBoost), SVM, kNN, Naive Bayes</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"05\">05</a></td><td><strong>Features e dimensionalidade</strong></td><td>Feature engineering, encoding de categóricas, escalonamento, missing values, curse of dimensionality, PCA, seleção de features</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"06\">06</a></td><td><strong>Otimização</strong></td><td>Gradiente descendente e variantes, learning rate, funções de perda, convexidade, Adam vs SGD</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"07\">07</a></td><td><strong>Redes neurais</strong></td><td>Backpropagation, ativações, batch norm, dropout, vanishing/exploding gradients, CNNs, RNNs</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"08\">08</a></td><td><strong>Deep learning moderno</strong></td><td>Transformers e atenção, embeddings, transfer learning, fine-tuning, LLMs, RAG</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"09\">09</a></td><td><strong>Não-supervisionado</strong></td><td>k-means, DBSCAN, hierárquico, avaliação de clusters, redução de dimensionalidade não-linear, detecção de anomalias</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"10\">10</a></td><td><strong>Estatística e probabilidade</strong></td><td>Bayes, distribuições, teste de hipótese, p-valor, intervalos de confiança, MLE/MAP</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"11\">11</a></td><td><strong>MLOps e produção</strong></td><td>Data drift vs concept drift, monitoramento, retreino, A/B testing, batch vs online serving, feature store</td></tr><tr><td><a href=\"#\" class=\"topic-link\" data-topic=\"12\">12</a></td><td><strong>ML System Design</strong></td><td>O framework de resposta, recomendação, ranking, detecção de fraude, busca</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"h-trilha-sugerida-de-estudo\">Trilha sugerida de estudo</h2>\n<h3 id=\"h-fase-1-fundação-inegociável-arquivos-01-02-03\">Fase 1 — Fundação inegociável (arquivos 01, 02, 03)</h3>\n<p>Não pule. <strong>A maioria das reprovações em entrevista de ML não é por não saber transformers — é por não saber explicar por que o AUC de 0.95 do candidato não significava nada porque havia leakage.</strong> Estes três tópicos são os mais cobrados em qualquer nível e são os que mais aparecem disfarçados dentro de outras perguntas.</p>\n<p>Sinal de que você terminou a fase: você consegue, de improviso, explicar por que acurácia é inútil num problema com 1% de positivos, e propor três métricas melhores justificando cada escolha pelo custo do erro.</p>\n<h3 id=\"h-fase-2-modelagem-prática-arquivos-04-05-06\">Fase 2 — Modelagem prática (arquivos 04, 05, 06)</h3>\n<p>O núcleo do trabalho real. O objetivo aqui não é decorar algoritmos, é conseguir responder <strong>\"por que você escolheu esse modelo?\"</strong> com algo além de \"porque funciona bem\". Gradient boosting e regressão logística são de longe os mais cobrados — domine esses dois profundamente antes de se preocupar com SVM.</p>\n<p>Sinal de que você terminou: você explica a diferença entre bagging e boosting em termos de bias e variância, sem decorar a frase.</p>\n<h3 id=\"h-fase-3-deep-learning-arquivos-07-08\">Fase 3 — Deep learning (arquivos 07, 08)</h3>\n<p>Peso variável conforme a vaga. Para vagas de <strong>ML tradicional / data science</strong>, o 07 basta e o 08 é conversa cultural. Para vagas de <strong>ML engineer / NLP / LLM</strong>, o 08 é o centro da entrevista.</p>\n<p>Atenção: entrevistadores de LLM adoram perguntar coisas básicas de forma nova (\"por que dividimos por √d_k na atenção?\"). Entenda os mecanismos, não a taxonomia de modelos.</p>\n<h3 id=\"h-fase-4-diferencial-de-sênior-arquivos-09-10-11-12\">Fase 4 — Diferencial de sênior (arquivos 09, 10, 11, 12)</h3>\n<ul><li><strong>10 (estatística)</strong> — cobrado pesado em vagas de data scientist e em empresas de produto (A/B testing).</li><li><strong>11 (MLOps)</strong> — o que separa quem já colocou modelo em produção de quem só treinou em notebook. Cobrado em quase toda vaga de ML engineer.</li><li><strong>12 (system design)</strong> — a rodada final da maioria dos processos sênior. Vale ler cedo mesmo se você for júnior, porque ele mostra <em>para que serve</em> tudo nos outros arquivos.</li><li><strong>09 (não-supervisionado)</strong> — menos cobrado, mas cai em vagas com segmentação de clientes ou detecção de anomalia.</li></ul>\n<h3 id=\"h-roteiro-por-tempo-disponível\">Roteiro por tempo disponível</h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Tempo até a entrevista</th><th>O que fazer</th></tr></thead><tbody><tr><td><strong>2 dias</strong></td><td>01, 02, 03 completos. Só as perguntas 🟢 e 🟡 dos outros.</td></tr><tr><td><strong>1 semana</strong></td><td>Fase 1 + Fase 2 completas, 11 e 12 lidos uma vez.</td></tr><tr><td><strong>1 mês</strong></td><td>Tudo, na ordem. Refaça as perguntas dos arquivos 01–03 na última semana — é o que mais cai e o que mais se esquece.</td></tr><tr><td><strong>Contínuo</strong></td><td>Um arquivo a cada 2-3 dias, e releia os 🔴 que você errou.</td></tr></tbody></table></div>\n<hr>\n<h2 id=\"h-regras-de-ouro-para-a-entrevista-em-si\">Regras de ouro para a entrevista em si</h2>\n<p><strong>Pense em voz alta.</strong> Entrevistador de ML avalia raciocínio, não a resposta final. Silêncio de 30 segundos é pior que um raciocínio parcialmente errado dito em voz alta.</p>\n<p><strong>Pergunte antes de responder.</strong> \"Qual o custo de um falso negativo aqui?\" vale mais que qualquer métrica que você escolha sozinho. Quase toda pergunta boa de ML é subespecificada de propósito.</p>\n<p><strong>Comece simples e justifique a complexidade.</strong> A resposta \"eu começaria com uma regressão logística como baseline para ter um número de referência, e só iria para gradient boosting se o ganho justificasse\" é sempre mais forte que \"eu usaria um transformer\". Ninguém é reprovado por propor um baseline; muita gente é reprovada por propor complexidade sem justificar.</p>\n<p><strong>Diga \"não sei\" e proponha como descobriria.</strong> \"Não tenho certeza se o LightGBM faz isso por padrão, mas o jeito de verificar seria X\" é uma resposta aceitável de sênior. Inventar comportamento de biblioteca é fatal, porque o entrevistador quase sempre sabe.</p>\n<p><strong>Traga o negócio de volta.</strong> Toda resposta técnica fica mais forte terminando em impacto: \"...o que importa aqui é que reduzir falso positivo em 2 pontos economiza X análises manuais por dia.\"</p>";
const SKEY = 'estudos:' + DATA.siteKey;
const LETTERS = ['A','B','C','D','E'];

/* localStorage seguro: em modo privado do iOS o acesso pode lancar excecao,
   e sem esta guarda o site inteiro morreria com tela em branco. */
const LS = (function(){
  try {
    var t = '__probe__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    return { ok: true, get: function(k){ return localStorage.getItem(k); },
             set: function(k,v){ try { localStorage.setItem(k, v); } catch(e){} },
             del: function(k){ try { localStorage.removeItem(k); } catch(e){} } };
  } catch (e) {
    var mem = {};
    return { ok: false, get: function(k){ return k in mem ? mem[k] : null; },
             set: function(k,v){ mem[k] = String(v); },
             del: function(k){ delete mem[k]; } };
  }
})();

if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }

var ordemRevisao = LS.get(SKEY + ':ordem') === '1';
function toggleOrdem(){
  ordemRevisao = !ordemRevisao;
  LS.set(SKEY + ':ordem', ordemRevisao ? '1' : '0');
  renderHome();
}
function getMark(t, i){ return LS.get(SKEY + ':' + t + ':' + i) || ''; }
function setMark(t, i, v){ var k = SKEY + ':' + t + ':' + i; if (v) LS.set(k, v); else LS.del(k); }
function getQuizAns(t, i){ var v = LS.get(SKEY + ':quiz:v2:' + t + ':' + i); return v === null ? null : +v; }
function setQuizAns(t, i, v){ LS.set(SKEY + ':quiz:v2:' + t + ':' + i, String(v)); }
function clearQuiz(t){
  var top = DATA.topics.find(function(x){ return x.id === t; });
  if (top) top.quiz.forEach(function(_, i){ LS.del(SKEY + ':quiz:v2:' + t + ':' + i); });
}
function topicProgress(t){
  var done = 0;
  t.cards.forEach(function(c, i){ if (getMark(t.id, i)) done++; });
  return { done: done, total: t.cards.length };
}
function quizProgress(t){
  var answered = 0, correct = 0;
  t.quiz.forEach(function(q, i){
    var a = getQuizAns(t.id, i);
    if (a !== null){ answered++; if (a === q.c) correct++; }
  });
  return { answered: answered, correct: correct, total: t.quiz.length };
}

/* ---------- codigo de progresso (transferencia entre aparelhos) ----------
   Empacota em bits: 2 por questao aberta (vazio/ok/parcial/errei) e 3 por
   questao de quiz (nao respondida + ate 5 alternativas). Resultado em
   base64url cabe folgado numa URL ou numa mensagem. */
var MARKS = ['', 'ok', 'meh', 'bad'];
function b64url(bytes){
  var s = '';
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(str){
  var s = str.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function encodeProgress(){
  var bits = [];
  var push = function(val, n){ for (var b = n - 1; b >= 0; b--) bits.push((val >> b) & 1); };
  push(2, 8);                    // versao do formato (2 = posicoes balanceadas)
  push(DATA.fp & 0xffff, 16);    // impressao digital do layout
  DATA.topics.forEach(function(t){
    t.cards.forEach(function(_, i){ push(MARKS.indexOf(getMark(t.id, i)) < 0 ? 0 : MARKS.indexOf(getMark(t.id, i)), 2); });
  });
  DATA.topics.forEach(function(t){
    t.quiz.forEach(function(_, i){
      var a = getQuizAns(t.id, i);
      push(a === null ? 0 : Math.min(a + 1, 7), 3);
    });
  });
  var bytes = new Uint8Array(Math.ceil(bits.length / 8));
  for (var i = 0; i < bits.length; i++) if (bits[i]) bytes[i >> 3] |= 128 >> (i & 7);
  return b64url(bytes);
}
function decodeProgress(code){
  var bytes;
  try { bytes = unb64url(code.trim()); } catch (e) { return { error: 'Código inválido — confira se foi copiado por inteiro.' }; }
  var pos = 0;
  var read = function(n){ var v = 0; for (var k = 0; k < n; k++){ var bit = (bytes[pos >> 3] >> (7 - (pos & 7))) & 1; v = (v << 1) | bit; pos++; } return v; };
  var need = 24;
  DATA.topics.forEach(function(t){ need += t.cards.length * 2 + t.quiz.length * 3; });
  if (bytes.length * 8 < need) return { error: 'Código incompleto para este material.' };
  var ver = read(8);
  if (ver !== 2) return { error: 'Código gerado antes do rebalanceamento do quiz — as respostas não valem mais.' };
  var fp = read(16);
  var marks = [], quiz = [], nMarks = 0, nQuiz = 0;
  DATA.topics.forEach(function(t){
    t.cards.forEach(function(_, i){ var v = read(2); marks.push([t.id, i, MARKS[v]]); if (v) nMarks++; });
  });
  DATA.topics.forEach(function(t){
    t.quiz.forEach(function(_, i){ var v = read(3); quiz.push([t.id, i, v]); if (v) nQuiz++; });
  });
  return { fpMatch: fp === (DATA.fp & 0xffff), marks: marks, quiz: quiz, nMarks: nMarks, nQuiz: nQuiz };
}
function applyProgress(p){
  p.marks.forEach(function(m){ setMark(m[0], m[1], m[2]); });
  p.quiz.forEach(function(q){ if (q[2] > 0) setQuizAns(q[0], q[1], q[2] - 1); else LS.del(SKEY + ':quiz:v2:' + q[0] + ':' + q[1]); });
}

/* ---------- desempenho por nivel ----------
   A media geral esconde o que importa: dar 90% no basico e 30% no avancado
   soma um numero confortavel que nao diz se voce esta pronto. */
var NIVEIS = ['🟢','🟡','🔴'];
var NOME_NIVEL = { '🟢':'Básico', '🟡':'Intermediário', '🔴':'Avançado' };

function statsNivel(topicoId){
  var acc = { '🟢':{ok:0,n:0,tot:0}, '🟡':{ok:0,n:0,tot:0}, '🔴':{ok:0,n:0,tot:0} };
  DATA.topics.forEach(function(t){
    if (topicoId && t.id !== topicoId) return;
    t.quiz.forEach(function(q, i){
      var nv = acc[q.n]; if (!nv) return;
      nv.tot++;
      var a = getQuizAns(t.id, i);
      if (a !== null){ nv.n++; if (a === q.c) nv.ok++; }
    });
  });
  return acc;
}
function barraPerf(st){
  var h = '';
  NIVEIS.forEach(function(nv){
    var s = st[nv];
    var pct = s.n ? Math.round(100 * s.ok / s.n) : 0;
    var cls = !s.n ? '' : pct >= 75 ? 'hi' : pct >= 50 ? 'mid' : 'lo';
    h += '<div class="perf-row"><span class="lv">' + nv + ' ' + NOME_NIVEL[nv] + '</span>' +
         '<span class="bar"><i class="' + cls + '" style="width:' + (s.n ? pct : 0) + '%"></i></span>' +
         '<span class="val">' + (s.n ? pct + '% (' + s.ok + '/' + s.n + ')' : '—') + '</span></div>';
  });
  return h;
}
function miniPerf(topicoId){
  var st = statsNivel(topicoId), partes = [];
  NIVEIS.forEach(function(nv){
    var s = st[nv];
    if (s.tot) partes.push(nv + ' ' + (s.n ? s.ok + '/' + s.n : '—'));
  });
  return partes.join(' · ');
}

/* ---------- o que precisa de revisao ---------- */
function quizErrados(){
  var out = [];
  DATA.topics.forEach(function(t){
    t.quiz.forEach(function(q, i){
      var a = getQuizAns(t.id, i);
      if (a !== null && a !== q.c) out.push({ t: t.id, i: i });
    });
  });
  return out;
}
function abertasRevisar(){
  var out = [];
  DATA.topics.forEach(function(t){
    t.cards.forEach(function(c, i){
      var m = getMark(t.id, i);
      if (m === 'meh' || m === 'bad') out.push({ t: t.id, i: i, m: m });
    });
  });
  return out;
}

/* ---------- repeticao espacada leve ----------
   Sem virar Anki: guarda quando o tema foi tocado pela ultima vez e usa o
   desempenho para decidir quem esta devendo revisao primeiro. */
function marcarRevisao(tid){ LS.set(SKEY + ':rev:' + tid, String(Date.now())); }
function infoRevisao(t){
  var ts = LS.get(SKEY + ':rev:' + t.id);
  var qp = quizProgress(t);
  var acc = qp.answered ? qp.correct / qp.answered : null;
  if (!ts) return { dias: null, acc: acc, devendo: qp.answered > 0, prio: qp.answered ? 5 : 0 };
  var dias = Math.floor((Date.now() - (+ts)) / 86400000);
  // Desempenho ruim encurta o intervalo: 70% ou menos pede revisao em 3 dias.
  var limite = acc === null ? 7 : acc <= 0.7 ? 3 : acc <= 0.9 ? 7 : 14;
  return { dias: dias, acc: acc, devendo: dias >= limite, prio: dias / limite };
}
function temasDevendo(){
  return DATA.topics.filter(function(t){ return t.quiz.length && infoRevisao(t).devendo; });
}
function textoRevisao(t){
  var r = infoRevisao(t);
  if (r.dias === null) return '';
  if (r.dias === 0) return 'revisado hoje';
  if (r.dias === 1) return 'revisado ontem';
  return 'há ' + r.dias + ' dias';
}

/* ---------- navegacao lateral ---------- */
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
  document.body.classList.remove('locked');
}
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('scrim').classList.add('on');
  document.body.classList.add('locked');
}
document.getElementById('menuBtn').addEventListener('click', function(){
  var open = document.getElementById('sidebar').classList.contains('open');
  if (open) closeSidebar(); else openSidebar();
});
document.getElementById('scrim').addEventListener('click', closeSidebar);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSidebar(); });

function renderSidebar(activeId){
  var el = document.getElementById('sidebar');
  var h = '<div class="brand"><span class="em">' + DATA.emoji + '</span><h1>' + DATA.title +
          '<small>material de entrevistas</small></h1></div>';
  h += '<a class="nav-item' + (activeId === 'home' ? ' active' : '') + '" href="#home"><span class="num">🏠</span> Início &amp; guia</a>';
  h += '<a class="nav-item' + (activeId === 'busca' ? ' active' : '') + '" href="#busca"><span class="num">🔎</span> Buscar</a>';
  h += '<div class="nav-label">Praticar</div>';
  h += '<a class="nav-item' + (activeId === 'simulado' ? ' active' : '') + '" href="#simulado"><span class="num">📝</span> Simulado</a>';
  var nRev = quizErrados().length + abertasRevisar().length;
  h += '<a class="nav-item' + (activeId === 'revisar' ? ' active' : '') + '" href="#revisar"><span class="num">🔁</span> Revisar erros' +
       '<span class="prog">' + (nRev ? nRev : '') + '</span></a>';
  h += '<a class="nav-item' + (activeId === 'sync' ? ' active' : '') + '" href="#sync"><span class="num">📲</span> Levar progresso</a>';
  h += '<div class="nav-label">Temas</div>';
  DATA.topics.forEach(function(t){
    var qp = quizProgress(t);
    var rev = infoRevisao(t);
    var badge = qp.total ? (qp.answered ? '🎯 ' + qp.correct + '/' + qp.answered : '🎯 ' + qp.total) : '';
    if (rev.devendo && qp.answered) badge = '⏰ ' + badge;
    h += '<a class="nav-item' + (activeId === t.id ? ' active' : '') + '" href="#topic/' + t.id + '">' +
         '<span class="num">' + t.id + '</span><span>' + t.shortTitle + '</span>' +
         '<span class="prog">' + badge + '</span></a>';
  });
  el.innerHTML = h;
  el.querySelectorAll('.nav-item').forEach(function(a){ a.addEventListener('click', closeSidebar); });
}

/* ---------- home ---------- */
function renderHome(){
  renderSidebar('home');
  document.getElementById('tbTitle').textContent = DATA.title;
  var totalQ = DATA.topics.reduce(function(a,t){ return a + t.cards.length; }, 0);
  var totalZ = DATA.topics.reduce(function(a,t){ return a + t.quiz.length; }, 0);
  var h = '<div class="topic-head"><h1>' + DATA.emoji + ' ' + DATA.title + '</h1>' +

       '<textarea id="impCode" placeholder="Cole o link ou o código aqui..."></textarea>' +
       '<button class="btn" onclick="doImport()">⬇️ Importar progresso</button>' +
       '<div id="impNote"></div></div>';
  h += '<div class="sync-box"><h3>Dica para o celular</h3>' +
       '<p>Instale o material na tela de início (no iPhone: Compartilhar → <em>Adicionar à Tela de Início</em>; no Android: menu → <em>Instalar app</em>). ' +
       'Além de abrir sem a barra do navegador e funcionar offline, isso protege seu progresso: o Safari apaga dados de sites não visitados por 7 dias, mas não os de apps instalados. ' +
       'Importe seu progresso <strong>depois</strong> de instalar — o app instalado tem armazenamento separado da aba normal.</p></div>';
  document.getElementById('main').innerHTML = h;

}
function copyText(txt, btn){
  var done = function(){ document.getElementById('copyNote').innerHTML = '<div class="note ok">✅ Copiado! Agora é só colar no outro aparelho.</div>'; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt, done); });
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  var ta = document.getElementById('expLink');
  ta.select(); ta.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); done(); }
  catch (e) { document.getElementById('copyNote').innerHTML = '<div class="note err">Não consegui copiar automaticamente — selecione o texto acima e copie manualmente.</div>'; }
}
function downloadBackup(){
  var payload = { v: 1, site: DATA.siteKey, code: encodeProgress() };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'progresso-' + DATA.siteKey + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}
function doImport(){
  var raw = document.getElementById('impCode').value.trim();
  var note = document.getElementById('impNote');
  if (!raw){ note.innerHTML = '<div class="note err">Cole o link ou o código primeiro.</div>'; return; }
  var m = raw.match(/[?&]p=([A-Za-z0-9_-]+)/);
  var code = m ? m[1] : raw;
  var p = decodeProgress(code);
  if (p.error){ note.innerHTML = '<div class="note err">' + p.error + '</div>'; return; }
  var aviso = p.fpMatch ? '' : '\n\nATENÇÃO: este código foi gerado para uma versão diferente do material. As marcações podem ficar trocadas.';
  if (!confirm('Importar ' + p.nMarks + ' marcações e ' + p.nQuiz + ' respostas de quiz?\n\nIsto substitui o progresso deste aparelho.' + aviso)) return;
  applyProgress(p);
  note.innerHTML = '<div class="note ok">✅ Progresso importado! ' + p.nMarks + ' marcações e ' + p.nQuiz + ' respostas restauradas.</div>';
  renderSidebar('sync');
}

/* ---------- simulado ----------
   Estudar tema a tema da uma falsa sensacao de dominio, porque o contexto ja
   entrega metade da resposta. Aqui as questoes vem de todos os temas
   misturadas e o gabarito so aparece no fim. */
function simGet(){ try { return JSON.parse(LS.get(SKEY + ':sim') || 'null'); } catch(e){ return null; } }
function simSet(s){ LS.set(SKEY + ':sim', JSON.stringify(s)); }
function simClear(){ LS.del(SKEY + ':sim'); }

function simIniciar(n){
  var todas = [];
  DATA.topics.forEach(function(t){ t.quiz.forEach(function(_, i){ todas.push([t.id, i]); }); });
  for (var k = todas.length - 1; k > 0; k--){
    var j = Math.floor(Math.random() * (k + 1));
    var tmp = todas[k]; todas[k] = todas[j]; todas[j] = tmp;
  }
  var itens = todas.slice(0, Math.min(n, todas.length));
  simSet({ itens: itens, resp: itens.map(function(){ return null; }), pos: 0, fim: false });
  renderSimulado();
}
function simEscolher(j){
  var s = simGet(); if (!s || s.fim) return;
  s.resp[s.pos] = j; simSet(s); renderSimulado();
}
function simIr(d){
  var s = simGet(); if (!s) return;
  s.pos = Math.max(0, Math.min(s.itens.length - 1, s.pos + d)); simSet(s); renderSimulado();
}
function simFinalizar(){
  var s = simGet(); if (!s) return;
  var faltam = s.resp.filter(function(r){ return r === null; }).length;
  if (faltam && !confirm(faltam + ' questão(ões) sem resposta serão contadas como erro. Finalizar mesmo assim?')) return;
  s.fim = true; simSet(s);
  s.itens.forEach(function(ref){ marcarRevisao(ref[0]); });
  renderSimulado();
}
function simQuestao(ref){
  var t = DATA.topics.find(function(x){ return x.id === ref[0]; });
  return { t: t, q: t.quiz[ref[1]] };
}

function renderSimulado(){
  renderSidebar('simulado');
  document.getElementById('tbTitle').textContent = 'Simulado';
  var s = simGet();
  var h = '';

  if (!s){
    var totalQ = DATA.topics.reduce(function(a,t){ return a + t.quiz.length; }, 0);
    h += '<div class="topic-head"><h1>📝 Simulado</h1>' +
         '<p class="sub">Questões sorteadas de todos os ' + DATA.topics.length + ' temas, misturadas. ' +
         'O gabarito só aparece no fim, com o resultado separado por tema e por nível.</p></div>';
    h += '<div class="sync-box"><h3>Quantas questões?</h3>' +
         '<div class="seg">' +
         '<button onclick="simIniciar(20)">20<br><span style="font-weight:400;font-size:.8em">~10 min</span></button>' +
         '<button onclick="simIniciar(40)">40<br><span style="font-weight:400;font-size:.8em">~20 min</span></button>' +
         '<button onclick="simIniciar(' + totalQ + ')">Todas<br><span style="font-weight:400;font-size:.8em">' + totalQ + ' questões</span></button>' +
         '</div>' +
         '<p style="color:var(--muted);font-size:.87em;margin-top:12px">As respostas do simulado são independentes do quiz por tema — fazer simulado não altera o seu progresso nos temas.</p>' +
         '</div>';
    document.getElementById('main').innerHTML = h;
    window.scrollTo(0,0);
    return;
  }

  if (s.fim){
    var acertos = 0;
    var porTema = {}, porNivel = { '🟢':{ok:0,n:0}, '🟡':{ok:0,n:0}, '🔴':{ok:0,n:0} };
    s.itens.forEach(function(ref, k){
      var o = simQuestao(ref), ok = s.resp[k] === o.q.c;
      if (ok) acertos++;
      if (!porTema[ref[0]]) porTema[ref[0]] = { ok:0, n:0, nome:o.t.shortTitle };
      porTema[ref[0]].n++; if (ok) porTema[ref[0]].ok++;
      var nv = porNivel[o.q.n]; if (nv){ nv.n++; if (ok) nv.ok++; }
    });
    var pct = Math.round(100 * acertos / s.itens.length);
    h += '<div class="topic-head"><h1>📝 Resultado do simulado</h1></div>';
    h += '<div class="resultado"><div class="nota">' + pct + '%</div>' +
         '<div class="sub">' + acertos + ' de ' + s.itens.length + ' questões</div></div>';

    h += '<div class="perf"><h3>Por nível</h3>';
    NIVEIS.forEach(function(nv){
      var d = porNivel[nv];
      var p = d.n ? Math.round(100 * d.ok / d.n) : 0;
      var cls = !d.n ? '' : p >= 75 ? 'hi' : p >= 50 ? 'mid' : 'lo';
      h += '<div class="perf-row"><span class="lv">' + nv + ' ' + NOME_NIVEL[nv] + '</span>' +
           '<span class="bar"><i class="' + cls + '" style="width:' + p + '%"></i></span>' +
           '<span class="val">' + (d.n ? p + '% (' + d.ok + '/' + d.n + ')' : '—') + '</span></div>';
    });
    h += '</div>';

    h += '<div class="perf"><h3>Por tema</h3>';
    Object.keys(porTema).sort().forEach(function(tid){
      var d = porTema[tid];
      var p = Math.round(100 * d.ok / d.n);
      var cls = p >= 75 ? 'hi' : p >= 50 ? 'mid' : 'lo';
      h += '<div class="perf-row"><span class="lv">' + tid + '</span>' +
           '<span class="bar"><i class="' + cls + '" style="width:' + p + '%"></i></span>' +
           '<span class="val">' + d.ok + '/' + d.n + '</span></div>';
    });
    h += '<p class="hint">Tema com desempenho baixo aqui é onde vale voltar a estudar.</p></div>';

    h += '<button class="btn" onclick="simClear();renderSimulado()">🔁 Novo simulado</button>' +
         '<button class="btn ghost" onclick="location.hash=\'#home\'">Voltar ao início</button>';

    h += '<h2 style="margin-top:26px">Revisão das questões</h2>';
    s.itens.forEach(function(ref, k){
      var o = simQuestao(ref), marcou = s.resp[k], ok = marcou === o.q.c;
      h += '<div class="qz l-' + o.q.levelName + '">' +
           '<div class="qnum">' + (k+1) + ' · TEMA ' + ref[0] + ' · ' + o.q.n + ' · ' + (ok ? '✅ acertou' : '❌ errou') + '</div>' +
           '<div class="qtext">' + o.q.q + '</div>';
      o.q.a.forEach(function(alt, j){
        var cls = 'alt locked' + (j === o.q.c ? ' correct' : (j === marcou ? ' wrong' : ' dim'));
        h += '<div class="' + cls + '"><span class="letter">' + LETTERS[j] + '</span><span>' + alt + '</span></div>';
      });
      h += '<div class="qz-exp">' + o.q.e + '</div></div>';
    });
    document.getElementById('main').innerHTML = h;
    window.scrollTo(0,0);
    return;
  }

  var ref = s.itens[s.pos], o = simQuestao(ref);
  var respondidas = s.resp.filter(function(r){ return r !== null; }).length;
  h += '<div class="sim-top"><span class="cont">' + (s.pos+1) + ' / ' + s.itens.length + '</span>' +
       '<span class="barra"><i style="width:' + Math.round(100*respondidas/s.itens.length) + '%"></i></span>' +
       '<button class="chip" onclick="simFinalizar()">Finalizar</button>' +
       '<button class="chip" onclick="if(confirm(\'Descartar este simulado?\')){simClear();renderSimulado()}">Sair</button></div>';
  h += '<div class="qz l-' + o.q.levelName + '">' +
       '<div class="qnum">' + o.q.n + ' · TEMA ' + ref[0] + '</div>' +
       '<div class="qtext">' + o.q.q + '</div>';
  o.q.a.forEach(function(alt, j){
    h += '<div class="alt' + (s.resp[s.pos] === j ? ' escolhida' : '') + '" onclick="simEscolher(' + j + ')">' +
         '<span class="letter">' + LETTERS[j] + '</span><span>' + alt + '</span></div>';
  });
  h += '</div>';
  h += '<div class="sim-nav">' +
       (s.pos > 0 ? '<button class="btn ghost" onclick="simIr(-1)">← Anterior</button>' : '') +
       (s.pos < s.itens.length - 1
          ? '<button class="btn" onclick="simIr(1)">Próxima →</button>'
          : '<button class="btn" onclick="simFinalizar()">Ver resultado</button>') +
       '</div>';
  document.getElementById('main').innerHTML = h;
  window.scrollTo(0,0);
}

/* ---------- revisar erros ---------- */
var revFeitos = {};
function revResponderQuiz(tid, i, j){
  var t = DATA.topics.find(function(x){ return x.id === tid; });
  setQuizAns(tid, i, j);
  marcarRevisao(tid);
  if (j === t.quiz[i].c) revFeitos[tid + ':' + i] = true;
  renderRevisar();
}
function revMarcar(tid, i, v){
  setMark(tid, i, v);
  marcarRevisao(tid);
  if (v === 'ok') revFeitos['a' + tid + ':' + i] = true;
  renderRevisar();
}
function renderRevisar(){
  renderSidebar('revisar');
  document.getElementById('tbTitle').textContent = 'Revisar erros';
  var errs = quizErrados();
  var abertas = abertasRevisar();
  var resolvidosQuiz = Object.keys(revFeitos).filter(function(k){ return k.indexOf('a') !== 0; });
  var resolvidasAb = Object.keys(revFeitos).filter(function(k){ return k.indexOf('a') === 0; });

  var h = '<div class="topic-head"><h1>🔁 Revisar erros</h1>' +
          '<p class="sub">Tudo que você errou ou marcou como dúvida, de todos os temas, reunido para refazer. Ao acertar, sai da lista.</p></div>';

  if (!errs.length && !abertas.length && !resolvidosQuiz.length && !resolvidasAb.length){
    h += '<p class="empty">Nada para revisar — você não tem questões erradas nem marcadas como dúvida.</p>';
    document.getElementById('main').innerHTML = h;
    window.scrollTo(0,0);
    return;
  }

  if (errs.length || resolvidosQuiz.length){
    h += '<h2>🎯 Quiz errado (' + errs.length + ')</h2>';
    var vistos = {};
    errs.concat(resolvidosQuiz.map(function(k){ var p = k.split(':'); return { t:p[0], i:+p[1] }; }))
      .forEach(function(r){
        var key = r.t + ':' + r.i;
        if (vistos[key]) return; vistos[key] = 1;
        var t = DATA.topics.find(function(x){ return x.id === r.t; });
        var q = t.quiz[r.i], ans = getQuizAns(r.t, r.i), acertou = ans === q.c;
        h += '<div class="qz l-' + q.levelName + '">' +
             '<div class="qnum">TEMA ' + r.t + ' · ' + q.n + (acertou ? ' · ✅ resolvido' : '') + '</div>' +
             '<div class="qtext">' + q.q + '</div>';
        q.a.forEach(function(alt, j){
          if (acertou){
            var cls = 'alt locked' + (j === q.c ? ' correct' : ' dim');
            h += '<div class="' + cls + '"><span class="letter">' + LETTERS[j] + '</span><span>' + alt + '</span></div>';
          } else {
            h += '<div class="alt" onclick="revResponderQuiz(\'' + r.t + '\',' + r.i + ',' + j + ')">' +
                 '<span class="letter">' + LETTERS[j] + '</span><span>' + alt + '</span></div>';
          }
        });
        if (acertou) h += '<div class="qz-exp"><span class="verdict ok">✅ Agora sim — sai da lista.</span>' + q.e + '</div>';
        else if (ans !== null) h += '<div class="qz-exp"><span class="verdict nok">Você marcou ' + LETTERS[ans] + ' da última vez.</span>Tente de novo antes de ver a explicação.</div>';
        h += '</div>';
      });
  }

  if (abertas.length || resolvidasAb.length){
    h += '<h2 style="margin-top:24px">❓ Questões abertas em dúvida (' + abertas.length + ')</h2>';
    var vistas = {};
    abertas.concat(resolvidasAb.map(function(k){ var p = k.slice(1).split(':'); return { t:p[0], i:+p[1] }; }))
      .forEach(function(r){
        var key = r.t + ':' + r.i;
        if (vistas[key]) return; vistas[key] = 1;
        var t = DATA.topics.find(function(x){ return x.id === r.t; });
        var c = t.cards[r.i], m = getMark(r.t, r.i);
        h += '<div class="card l-' + c.levelName + '" id="rev-' + r.t + '-' + r.i + '">' +
             '<div class="card-q" onclick="var e=document.getElementById(\'rev-' + r.t + '-' + r.i + '\');e.classList.toggle(\'open\')">' +
             '<span class="qt"><span style="color:var(--muted);font-size:.8em">TEMA ' + r.t + '</span><br>' + c.titleHtml + '</span>' +
             '<span class="toggle">ver ▾</span></div>' +
             '<div class="card-a">' + c.bodyHtml +
             '<div class="card-mark"><span class="lbl">' + (m === 'ok' ? '✅ resolvido — sai da lista' : 'Como você foi agora?') + '</span>' +
             '<button class="mark-btn' + (m==='ok'?' sel-ok':'') + '" onclick="revMarcar(\'' + r.t + '\',' + r.i + ',\'ok\')">✅ Acertei</button>' +
             '<button class="mark-btn' + (m==='meh'?' sel-meh':'') + '" onclick="revMarcar(\'' + r.t + '\',' + r.i + ',\'meh\')">⚠️ Parcial</button>' +
             '<button class="mark-btn' + (m==='bad'?' sel-bad':'') + '" onclick="revMarcar(\'' + r.t + '\',' + r.i + ',\'bad\')">❌ Errei</button>' +
             '</div></div></div>';
      });
  }
  document.getElementById('main').innerHTML = h;
  bindTopicLinks();
  window.scrollTo(0,0);
}

/* ---------- busca ---------- */
var _idx = null;
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function semTags(h){
  return h.replace(/<[^>]+>/g,' ')
          .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
          .replace(/&#39;/g,"'").replace(/&amp;/g,'&')
          .replace(/\s+/g,' ').trim();
}
function norm(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function idxBusca(){
  if (_idx) return _idx;
  _idx = [];
  DATA.topics.forEach(function(t){
    var re = /<section class="study-sec" id="([^"]+)"><h2>(.*?)<\/h2>/g, m, partes = [];
    while ((m = re.exec(t.studyHtml)) !== null) partes.push({ id:m[1], titulo:semTags(m[2]), ini:m.index });
    partes.forEach(function(p, k){
      var fim = k + 1 < partes.length ? partes[k+1].ini : t.studyHtml.length;
      _idx.push({ tid:t.id, tab:'estudo', tipo:'Estudo', ancora:p.id,
                  titulo:p.titulo, texto:semTags(t.studyHtml.slice(p.ini, fim)) });
    });
    t.cards.forEach(function(c, i){
      _idx.push({ tid:t.id, tab:'questoes', tipo:'Questão aberta', foco:'card-' + i,
                  titulo:semTags(c.titleHtml), texto:semTags(c.titleHtml + ' ' + c.bodyHtml) });
    });
    t.quiz.forEach(function(q, i){
      _idx.push({ tid:t.id, tab:'quiz', tipo:'Quiz', foco:'qz-' + i,
                  titulo:semTags(q.q), texto:semTags(q.q + ' ' + q.a.join(' · ') + ' ' + q.e) });
    });
  });
  return _idx;
}
function destacar(txt, alvo){
  var n = norm(txt), out = '', ini = 0, p = n.indexOf(alvo);
  while (p !== -1){
    out += escHtml(txt.slice(ini, p)) + '<mark>' + escHtml(txt.slice(p, p + alvo.length)) + '</mark>';
    ini = p + alvo.length;
    p = n.indexOf(alvo, ini);
  }
  return out + escHtml(txt.slice(ini));
}
var focoPendente = null;
function irPara(tid, tab, ancora, foco){
  focoPendente = { ancora: ancora, foco: foco };
  location.hash = '#topic/' + tid + '/' + tab;
}
function aplicarFoco(){
  if (!focoPendente) return;
  var f = focoPendente; focoPendente = null;
  setTimeout(function(){
    var el = document.getElementById(f.foco || f.ancora);
    if (!el) return;
    el.scrollIntoView({ block:'center' });
    var antes = el.style.outline;
    el.style.outline = '3px solid var(--accent)';
    el.style.outlineOffset = '3px';
    setTimeout(function(){ el.style.outline = antes; el.style.outlineOffset = ''; }, 1600);
  }, 60);
}
function buscar(){
  var termo = document.getElementById('q').value.trim();
  var alvo = norm(termo);
  var cx = document.getElementById('res');
  if (alvo.length < 2){ cx.innerHTML = '<p class="empty">Digite ao menos 2 caracteres.</p>'; return; }
  var achados = [];
  idxBusca().forEach(function(e){
    var p = norm(e.texto).indexOf(alvo);
    if (p === -1) return;
    var ini = Math.max(0, p - 70), fim = Math.min(e.texto.length, p + 160);
    achados.push({ e:e, trecho: (ini > 0 ? '… ' : '') + e.texto.slice(ini, fim) + (fim < e.texto.length ? ' …' : '') });
  });
  if (!achados.length){ cx.innerHTML = '<p class="empty">Nada encontrado para “' + escHtml(termo) + '”.</p>'; return; }
  var h = '<p style="color:var(--muted);font-size:.88em">' + achados.length + ' trecho(s) encontrados</p>';
  achados.slice(0, 40).forEach(function(a){
    var e = a.e;
    h += '<div class="hit" onclick="irPara(\'' + e.tid + '\',\'' + e.tab + '\',\'' + (e.ancora||'') + '\',\'' + (e.foco||'') + '\')">' +
         '<div class="onde">Tema ' + e.tid + ' · ' + e.tipo + '</div>' +
         '<div class="tit">' + destacar(e.titulo, alvo) + '</div>' +
         '<div class="trecho">' + destacar(a.trecho, alvo) + '</div></div>';
  });
  if (achados.length > 40) h += '<p class="empty">Mostrando os 40 primeiros de ' + achados.length + '.</p>';
  cx.innerHTML = h;
}
function renderBusca(){
  renderSidebar('busca');
  document.getElementById('tbTitle').textContent = 'Buscar';
  document.getElementById('main').innerHTML =
    '<div class="topic-head"><h1>🔎 Buscar no material</h1>' +
    '<p class="sub">Procura em resumos, questões abertas e quiz de todos os temas.</p></div>' +
    '<div class="busca-campo"><input id="q" type="search" placeholder="Ex.: idempotência, watermark, leakage..." autocomplete="off"></div>' +
    '<div id="res"></div>';
  var inp = document.getElementById('q');
  inp.addEventListener('input', buscar);
  inp.focus();
  window.scrollTo(0,0);
}

/* ---------- topico ---------- */
var levelFilter = 'todos';
var statusFilter = 'todas';

function renderTopic(id, tab){
  var t = DATA.topics.find(function(x){ return x.id === id; });
  if (!t){ location.hash = '#home'; return; }
  renderSidebar(id);
  document.getElementById('tbTitle').textContent = t.shortTitle;
  var cur = tab || 'estudo';
  if (cur === 'quiz' && !t.quiz.length) cur = 'questoes';

  var h = '<div class="topic-head"><h1>' + t.fullTitle + '</h1>' +
          (t.subtitle ? '<p class="sub">' + t.subtitle + '</p>' : '') + '</div>';
  h += '<div class="tabs">' +
       '<button class="tab' + (cur==='estudo'?' active':'') + '" onclick="goTab(\'' + id + '\',\'estudo\')">📖 Estudo</button>' +
       '<button class="tab' + (cur==='quiz'?' active':'') + '" onclick="goTab(\'' + id + '\',\'quiz\')">🎯 Quiz <span class="count">(' + t.quiz.length + ')</span></button>' +
       '<button class="tab' + (cur==='questoes'?' active':'') + '" onclick="goTab(\'' + id + '\',\'questoes\')">❓ Abertas <span class="count">(' + t.cards.length + ')</span></button>' +
       '</div>';

  if (cur === 'estudo'){
    if (t.toc.length > 1){
      h += '<nav class="toc"><b>Nesta página</b>';
      t.toc.forEach(function(s){
        h += '<a href="#' + s.id + '" onclick="event.preventDefault();document.getElementById(\'' + s.id + '\').scrollIntoView({behavior:\'smooth\'})">' + s.title + '</a>';
      });
      h += '</nav>';
    }
    h += t.studyHtml || '<p class="empty">Sem conteúdo de estudo neste tema.</p>';
  } else if (cur === 'quiz'){
    h += renderQuiz(t);
  } else {
    h += renderOpenQuestions(t);
  }
  document.getElementById('main').innerHTML = h;
  bindTopicLinks();
}

function goTab(id, tab){
  location.hash = '#topic/' + id + '/' + tab;
}

function renderQuiz(t){
  var qp = quizProgress(t);
  var h = '<div class="quiz-head">' +
          '<span class="score"><span class="ok">' + qp.correct + '</span> / ' + qp.answered + ' acertos</span>' +
          '<span class="detail">' + qp.answered + ' de ' + qp.total + ' respondidas — toque numa alternativa para responder.</span>' +
          '<button class="chip" onclick="if(confirm(\'Apagar suas respostas deste tema?\')){clearQuiz(\'' + t.id + '\');rerenderQuiz(\'' + t.id + '\');}">↺ Refazer</button>' +
          '</div>';
  // Acerto separado por nivel: e o que diz se o dominio e real ou so no basico.
  if (qp.answered) h += '<div class="perf"><h3>Neste tema, por nível</h3>' + barraPerf(statsNivel(t.id)) + '</div>';
  t.quiz.forEach(function(q, i){
    h += quizCardHtml(t, q, i);
  });
  return h;
}
function quizCardHtml(t, q, i){
  var ans = getQuizAns(t.id, i);
  var answered = ans !== null;
  var h = '<div class="qz l-' + q.levelName + '" id="qz-' + i + '">' +
          '<div class="qnum">QUESTÃO ' + (i+1) + ' DE ' + t.quiz.length + ' · ' + q.n + '</div>' +
          '<div class="qtext">' + q.q + '</div>';
  q.a.forEach(function(alt, j){
    var cls = 'alt';
    if (answered){
      cls += ' locked';
      if (j === q.c) cls += ' correct';
      else if (j === ans) cls += ' wrong';
      else cls += ' dim';
    }
    var click = answered ? '' : ' onclick="answerQuiz(\'' + t.id + '\',' + i + ',' + j + ')"';
    h += '<div class="' + cls + '"' + click + '><span class="letter">' + LETTERS[j] + '</span><span>' + alt + '</span></div>';
  });
  if (answered){
    var ok = ans === q.c;
    h += '<div class="qz-exp"><span class="verdict ' + (ok?'ok':'nok') + '">' +
         (ok ? '✅ Correto!' : '❌ Você marcou ' + LETTERS[ans] + ' — a correta é ' + LETTERS[q.c] + '.') +
         '</span>' + q.e + '</div>';
  }
  h += '</div>';
  return h;
}
/* Responder atualiza SO o card tocado: nada de re-render global, que perderia
   a posicao do scroll e fecharia as respostas ja abertas. */
function answerQuiz(tid, i, j){
  if (getQuizAns(tid, i) !== null) return;
  setQuizAns(tid, i, j);
  var t = DATA.topics.find(function(x){ return x.id === tid; });
  var el = document.getElementById('qz-' + i);
  if (el){
    var tmp = document.createElement('div');
    tmp.innerHTML = quizCardHtml(t, t.quiz[i], i);
    el.replaceWith(tmp.firstChild);
  }
  marcarRevisao(tid);
  var qp = quizProgress(t);
  var head = document.querySelector('.quiz-head');
  if (head){
    head.querySelector('.score').innerHTML = '<span class="ok">' + qp.correct + '</span> / ' + qp.answered + ' acertos';
    head.querySelector('.detail').textContent = qp.answered + ' de ' + qp.total + ' respondidas — toque numa alternativa para responder.';
    // O painel por nivel acompanha a resposta; se ainda nao existe (primeira do
    // tema), e criado logo depois do cabecalho, sem redesenhar a lista.
    var perf = document.querySelector('#main .perf');
    var corpo = '<h3>Neste tema, por nível</h3>' + barraPerf(statsNivel(tid));
    if (perf) perf.innerHTML = corpo;
    else {
      var novo = document.createElement('div');
      novo.className = 'perf';
      novo.innerHTML = corpo;
      head.insertAdjacentElement('afterend', novo);
    }
  }
  renderSidebar(tid);
}
function rerenderQuiz(tid){
  var t = DATA.topics.find(function(x){ return x.id === tid; });
  var main = document.getElementById('main');
  var head = main.querySelector('.quiz-head');
  if (!head) return;
  var wrapper = document.createElement('div');
  wrapper.innerHTML = renderQuiz(t);
  var first = main.querySelector('.quiz-head');
  var nodes = [];
  var n = first;
  while (n){ nodes.push(n); n = n.nextElementSibling; }
  nodes.forEach(function(x){ x.remove(); });
  while (wrapper.firstChild) main.appendChild(wrapper.firstChild);
  renderSidebar(tid);
}

function renderOpenQuestions(t){
  var h = '<div class="q-tools">' +
       chip('nivel','todos','Todos') + chip('nivel','🟢','🟢') + chip('nivel','🟡','🟡') + chip('nivel','🔴','🔴') +
       '<span class="spacer"></span>' +
       chip('status','todas','Todas') + chip('status','pendentes','Não marcadas') + chip('status','revisar','Revisar') +
       '</div>';
  if (t.questionsIntroHtml) h += '<div class="q-intro">' + t.questionsIntroHtml + '</div>';
  var shown = 0;
  t.cards.forEach(function(c, i){
    var mark = getMark(t.id, i);
    if (levelFilter !== 'todos' && c.level !== levelFilter) return;
    if (statusFilter === 'pendentes' && mark) return;
    if (statusFilter === 'revisar' && mark !== 'meh' && mark !== 'bad') return;
    shown++;
    h += '<div class="card l-' + c.levelName + '" id="card-' + i + '">' +
         '<div class="card-q" onclick="toggleCard(' + i + ')"><span class="qt">' + c.titleHtml + '</span>' +
         '<span class="toggle">ver ▾</span></div>' +
         '<div class="card-a">' + c.bodyHtml +
         '<div class="card-mark" id="cm-' + i + '"><span class="lbl">Como você foi?</span>' + markBtns(t.id, i, mark) +
         '</div></div></div>';
  });
  if (!shown) h += '<p class="empty">Nenhuma questão com esse filtro.</p>';
  return h;
}
function markBtns(tid, i, mark){
  var b = function(v, label){
    return '<button class="mark-btn' + (mark===v ? ' sel-' + v : '') + '" onclick="mark(\'' + tid + '\',' + i + ',\'' + v + '\')">' + label + '</button>';
  };
  return b('ok','✅ Acertei') + b('meh','⚠️ Parcial') + b('bad','❌ Errei') +
    (mark ? '<button class="mark-btn" onclick="mark(\'' + tid + '\',' + i + ',\'\')">limpar</button>' : '');
}
/* Marcar tambem atualiza so o proprio card. */
function mark(tid, i, v){
  setMark(tid, i, v);
  marcarRevisao(tid);
  var cm = document.getElementById('cm-' + i);
  if (cm) cm.innerHTML = '<span class="lbl">Como você foi?</span>' + markBtns(tid, i, getMark(tid, i));
  renderSidebar(tid);
}
function chip(kind, val, label){
  var active = (kind==='nivel' ? levelFilter : statusFilter) === val;
  return '<button class="chip' + (active?' active':'') + '" onclick="setFilter(\'' + kind + '\',\'' + val + '\')">' + label + '</button>';
}
function setFilter(kind, val){
  if (kind==='nivel') levelFilter = val; else statusFilter = val;
  var m = (location.hash || '').match(/^#topic\/(\d{2})(?:\/(\w+))?/);
  if (m) renderTopic(m[1], m[2] || 'estudo');
}
function toggleCard(i){
  var el = document.getElementById('card-' + i);
  el.classList.toggle('open');
  el.querySelector('.toggle').textContent = el.classList.contains('open') ? 'ocultar ▴' : 'ver ▾';
}
function bindTopicLinks(){
  document.querySelectorAll('.topic-link').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); location.hash = '#topic/' + a.dataset.topic; });
  });
}

/* ---------- roteamento (a aba entra no hash: #topic/03/quiz) ---------- */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function route(){
  var hash = location.hash || '#home';
  closeSidebar();
  // Os itens acertados ficam visiveis com a explicacao enquanto voce esta na
  // tela de revisao; ao sair, somem de vez.
  if (hash !== '#revisar') revFeitos = {};
  var m = hash.match(/^#topic\/(\d{2})(?:\/(\w+))?/);
  if (m){
    renderTopic(m[1], m[2] || 'estudo');
    window.scrollTo(0, 0);
    aplicarFoco();
  } else if (hash === '#sync'){
    renderSync();
  } else if (hash === '#simulado'){
    renderSimulado();
  } else if (hash === '#revisar'){
    renderRevisar();
  } else if (hash === '#busca'){
    renderBusca();
  } else {
    renderHome();
  }
}
window.addEventListener('hashchange', route);

/* Importa progresso vindo por link (?p=...) antes de desenhar a tela. */
(function(){
  var m = location.search.match(/[?&]p=([A-Za-z0-9_-]+)/);
  if (m){
    var p = decodeProgress(m[1]);
    if (!p.error){
      var aviso = p.fpMatch ? '' : '\n\nATENÇÃO: código gerado para outra versão do material.';
      if (confirm('Importar progresso deste link?\n\n' + p.nMarks + ' marcações e ' + p.nQuiz + ' respostas de quiz.\nIsto substitui o progresso deste aparelho.' + aviso)) {
        applyProgress(p);
      }
    }
    history.replaceState(null, '', location.pathname + location.hash);
  }
  route();
})();

/* Service worker: leitura offline depois da primeira visita. So faz sentido
   sob http(s) — em file:// o arquivo ja e local. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
