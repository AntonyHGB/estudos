<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Machine Lrn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>🧠 Machine Learning — Estudos</title>
<style>
:root{
  color-scheme:light dark;
  --accent:#7c3aed;
  --accent-soft:#7c3aed18;
  --bg:#f8fafc; --panel:#ffffff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --code-bg:#f1f5f9; --shadow:0 1px 3px rgba(15,23,42,.08);
  --green:#16a34a; --yellow:#ca8a04; --red:#dc2626;
  --bar:56px;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent:#c4b5fd;
    --accent-soft:#c4b5fd22;
    --bg:#0b1120; --panel:#111a2e; --text:#e2e8f0; --muted:#94a3b8;
    --border:#1e293b; --code-bg:#1a2440; --shadow:0 1px 3px rgba(0,0,0,.4);
    --green:#4ade80; --yellow:#facc15; --red:#f87171;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.65;font-size:15.5px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
code{background:var(--code-bg);padding:.12em .38em;border-radius:5px;font-size:.88em;
  font-family:'Cascadia Code','JetBrains Mono',Consolas,monospace;overflow-wrap:anywhere}
p,li,td,th,.qtext,.qt{overflow-wrap:break-word}
pre{background:var(--code-bg);padding:14px 16px;border-radius:10px;overflow-x:auto;border:1px solid var(--border)}
pre code{background:none;padding:0;font-size:.85em;line-height:1.5;overflow-wrap:normal}
blockquote{margin:0 0 1em;padding:.6em 1em;border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 8px 8px 0;color:var(--muted)}
blockquote p{margin:.25em 0}
hr{border:none;border-top:1px solid var(--border);margin:1.6em 0}
h1,h2,h3,h4{line-height:1.3;scroll-margin-top:80px}
.table-wrap{overflow-x:auto;margin:1em 0;border:1px solid var(--border);border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92em}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--accent-soft);white-space:nowrap}
tr:last-child td{border-bottom:none}
.ref{color:var(--accent);font-weight:600}
.cb{color:var(--accent)}

.layout{display:flex;min-height:100vh}
aside{width:290px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:18px 14px;
  padding-bottom:max(18px,env(safe-area-inset-bottom))}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,56px) 80px;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand .em{font-size:1.7em}
.brand h1{font-size:1.02em;margin:0;line-height:1.25}
.brand small{color:var(--muted);display:block;font-weight:400}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;
  color:var(--text);text-decoration:none;font-size:.92em;margin:2px 0;min-height:40px}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){.nav-item.active{color:#0b1120}}
.nav-item .num{font-weight:700;font-size:.82em;opacity:.65;width:20px;flex-shrink:0}
.nav-item .prog{margin-left:auto;font-size:.72em;opacity:.75;white-space:nowrap;text-align:right}
.nav-label{font-size:.72em;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 10px 4px}

.topbar{display:none}
.scrim{display:none;position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.5);
  opacity:0;transition:opacity .18s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.scrim.on{display:block;opacity:1}

.topic-head h1{font-size:1.55em;margin:.1em 0 .15em}
.topic-head .sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin:18px 0 26px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.tab{padding:11px 18px;cursor:pointer;border:none;background:none;font:inherit;font-weight:600;color:var(--muted);
  border-bottom:3px solid transparent;margin-bottom:-2px;min-height:44px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{font-size:.8em;opacity:.7}

.toc{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
.toc b{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.toc a{display:block;padding:6px 0;text-decoration:none;font-size:.93em}
.study-sec{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:8px 26px 18px;
  margin-bottom:22px;box-shadow:var(--shadow)}
.study-sec>h2{border-bottom:2px solid var(--accent-soft);padding-bottom:.35em}

.q-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.q-tools .spacer{flex:1}
.chip{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;
  padding:7px 15px;cursor:pointer;font:inherit;font-size:.85em;min-height:38px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){.chip.active{color:#0b1120}}
.card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;
  margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
.card.l-basico{border-left-color:var(--green)}
.card.l-intermediario{border-left-color:var(--yellow)}
.card.l-avancado{border-left-color:var(--red)}
.card-q{padding:15px 20px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.card-q .qt{font-weight:600;flex:1}
.card-q .toggle{color:var(--muted);font-size:.82em;white-space:nowrap;padding-top:2px}
.card-a{display:none;padding:4px 22px 14px;border-top:1px dashed var(--border)}
.card.open .card-a{display:block}
.card-mark{display:flex;gap:8px;align-items:center;padding:10px 20px 14px;border-top:1px solid var(--border);
  flex-wrap:wrap;background:color-mix(in srgb, var(--panel) 70%, var(--bg))}
.card-mark span.lbl{font-size:.78em;color:var(--muted);margin-right:4px}
.mark-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;
  padding:7px 12px;cursor:pointer;font-size:.85em;min-height:38px}
.mark-btn.sel-ok{background:var(--green);border-color:var(--green);color:#fff}
.mark-btn.sel-meh{background:var(--yellow);border-color:var(--yellow);color:#fff}
.mark-btn.sel-bad{background:var(--red);border-color:var(--red);color:#fff}
.q-intro{margin-bottom:18px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-style:italic}

.quiz-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:12px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
.quiz-head .score{font-weight:700;font-size:1.05em}
.quiz-head .score .ok{color:var(--green)}
.quiz-head .detail{color:var(--muted);font-size:.85em;flex:1;min-width:180px}
.qz{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;
  margin-bottom:18px;box-shadow:var(--shadow);padding:16px 20px 14px}
.qz.l-basico{border-left-color:var(--green)}
.qz.l-intermediario{border-left-color:var(--yellow)}
.qz.l-avancado{border-left-color:var(--red)}
.qz .qnum{font-size:.75em;font-weight:700;color:var(--muted);letter-spacing:.05em}
.qz .qtext{font-weight:600;margin:4px 0 12px}
.alt{display:flex;gap:11px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin:8px 0;
  cursor:pointer;align-items:flex-start;transition:border-color .1s, background .1s;min-height:44px}
.alt .letter{font-weight:700;color:var(--accent);flex-shrink:0}
.alt:active{border-color:var(--accent)}
.alt.locked{cursor:default}
.alt.correct{border-color:var(--green);background:color-mix(in srgb, var(--green) 14%, var(--panel))}
.alt.correct .letter{color:var(--green)}
.alt.wrong{border-color:var(--red);background:color-mix(in srgb, var(--red) 12%, var(--panel))}
.alt.wrong .letter{color:var(--red)}
.alt.dim{opacity:.55}
.qz-exp{margin-top:12px;padding:12px 16px;border-radius:10px;font-size:.94em;background:var(--accent-soft);border:1px solid var(--border)}
.qz-exp .verdict{font-weight:700;display:block;margin-bottom:4px}
.qz-exp .verdict.ok{color:var(--green)}
.qz-exp .verdict.nok{color:var(--red)}

.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:24px 0}
.home-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .12s}
.home-card .n{font-size:.78em;font-weight:700;color:var(--accent)}
.home-card .t{font-weight:600;margin:2px 0 6px}
.home-card .s{font-size:.83em;color:var(--muted)}
.home-card .qn{font-size:.76em;color:var(--muted);margin-top:8px}
.readme{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:8px 26px 18px;box-shadow:var(--shadow)}

.sync-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 22px;
  margin-bottom:18px;box-shadow:var(--shadow)}
.sync-box h3{margin:.2em 0 .5em}
.sync-box p{color:var(--muted);font-size:.92em}
.sync-box textarea{width:100%;min-height:80px;font-family:'Cascadia Code',Consolas,monospace;font-size:.82em;
  padding:10px;border-radius:9px;border:1px solid var(--border);background:var(--code-bg);color:var(--text);resize:vertical}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:10px 18px;
  cursor:pointer;font:inherit;font-weight:600;min-height:44px;margin:6px 6px 0 0}
@media (prefers-color-scheme: dark){.btn{color:#0b1120}}
.btn.ghost{background:var(--panel);color:var(--text);border-color:var(--border)}
.note{font-size:.85em;padding:10px 14px;border-radius:9px;margin-top:10px}
.note.ok{background:color-mix(in srgb, var(--green) 15%, var(--panel));border:1px solid var(--green)}
.note.err{background:color-mix(in srgb, var(--red) 12%, var(--panel));border:1px solid var(--red)}

/* desempenho por nível */
.perf{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 20px;
  margin-bottom:18px;box-shadow:var(--shadow)}
.perf h3{margin:.1em 0 .7em;font-size:1em}
.perf-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.9em}
.perf-row .lv{width:78px;flex-shrink:0}
.perf-row .bar{flex:1;height:9px;background:var(--code-bg);border-radius:99px;overflow:hidden;min-width:60px}
.perf-row .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.perf-row .bar i.hi{background:var(--green)}
.perf-row .bar i.mid{background:var(--yellow)}
.perf-row .bar i.lo{background:var(--red)}
.perf-row .val{width:74px;text-align:right;flex-shrink:0;color:var(--muted);font-variant-numeric:tabular-nums}
.perf .hint{color:var(--muted);font-size:.84em;margin:10px 0 0}
.mini-perf{font-size:.78em;color:var(--muted);margin-top:6px}

/* atalhos da home */
.acoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0 22px}
.acao{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);text-align:left;
  font:inherit;color:inherit;min-height:64px}
.acao b{font-size:.95em}
.acao span{font-size:.79em;color:var(--muted)}
.acao.destaque{border-color:var(--accent)}

/* busca */
.busca-campo{display:flex;gap:8px;margin-bottom:16px}
.busca-campo input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font:inherit;font-size:1em;min-height:46px}
.busca-campo input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hit{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:12px 16px;
  margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.hit .onde{font-size:.74em;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}
.hit .tit{font-weight:600;margin:3px 0}
.hit .trecho{font-size:.87em;color:var(--muted);line-height:1.5}
mark{background:var(--accent-soft);color:var(--text);font-weight:700;padding:0 2px;border-radius:3px}

/* simulado */
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.seg button{flex:1;min-width:96px;min-height:52px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);border-radius:11px;cursor:pointer;font:inherit;font-weight:600}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.seg button.on{color:#0b1120}}
.sim-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;padding:11px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.sim-top .cont{font-weight:700;font-variant-numeric:tabular-nums}
.sim-top .barra{flex:1;height:7px;background:var(--code-bg);border-radius:99px;overflow:hidden;min-width:80px}
.sim-top .barra i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sim-nav{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.sim-nav .btn{flex:1;min-width:120px}
.alt.escolhida{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.resultado{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;
  margin-bottom:18px;box-shadow:var(--shadow);text-align:center}
.resultado .nota{font-size:2.5em;font-weight:800;line-height:1.1}
.resultado .sub{color:var(--muted)}

@media (hover:hover) and (pointer:fine){
  .nav-item:hover{background:var(--accent-soft)}
  .acao:hover{border-color:var(--accent)}
  .hit:hover{border-color:var(--accent)}
  .card-q:hover{background:var(--accent-soft)}
  .alt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .alt.locked:hover{border-color:var(--border);background:none}
  .home-card:hover{transform:translateY(-2px);border-color:var(--accent)}
}

@media (max-width: 860px){
  html{scroll-behavior:auto}
  h1,h2,h3,h4{scroll-margin-top:calc(var(--bar) + 8px)}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:12px;height:var(--bar);
    padding:0 14px;background:color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--border)}
  .topbar button{border:none;background:none;color:var(--text);font-size:1.5em;cursor:pointer;
    width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .topbar .tb-title{font-weight:700;font-size:.98em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .layout{display:block}
  aside{position:fixed;top:0;left:0;z-index:30;width:min(300px,86vw);transform:translateX(-100%);
    transition:transform .2s ease;border-right:1px solid var(--border)}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  main{padding:18px 16px 64px;max-width:none}
  body.locked{overflow:hidden}
  .study-sec{padding:6px 16px 14px;border-radius:12px}
  .qz{padding:14px 15px 12px}
  .card-q{padding:14px 15px}
  .card-a{padding:4px 15px 12px}
  .card-mark{padding:10px 15px 12px}
  .quiz-head{padding:12px 15px}
  .toc{padding:12px 16px}
  .readme{padding:6px 16px 14px}
  .sync-box{padding:16px}
  .chip,.mark-btn{min-height:44px;padding:10px 16px;font-size:.88em}
  .nav-item{min-height:44px;padding:11px 12px}
  .tabs{gap:2px}
  .tab{padding:11px 12px;font-size:.94em}
  .topic-head h1{font-size:1.3em}
  .home-grid{grid-template-columns:1fr}
}
</style>
</head>

<header class="topbar">
  <button id="menuBtn" aria-label="Abrir menu de temas">☰</button>
  <span class="tb-title" id="tbTitle">Machine Learning</span>
</header>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>

<script id="site-data" type="application/json">{"siteKey":"machine-learning","title":"Machine Learning","short":"Machine Lrn","emoji":"🧠","fp":1095,"topics":[{"id":"01","fullTitle":"01 — Fundamentos","shortTitle":"Fundamentos","subtitle":"Tipos de aprendizado, bias-variance, overfitting/underfitting, regularização.","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-o-que-ml-está-realmente-fazendo\">1.1 O que ML está realmente fazendo\u003c/h3>\n\u003cp>Todo problema supervisionado é: existe uma função verdadeira desconhecida \u003ccode>f\u003c/code> que mapeia entradas \u003ccode>X\u003c/code> para saídas \u003ccode>y\u003c/code>, e você observa amostras ruidosas \u003ccode>y = f(X) + ε\u003c/code>. Seu modelo produz uma estimativa \u003ccode>f̂\u003c/code>. O que você quer minimizar não é o erro nos dados que você tem — é o \u003cstrong>erro esperado em dados que você nunca viu\u003c/strong>, o \u003cem>risco esperado\u003c/em>. Como você não tem acesso a essa distribuição, você minimiza o \u003cem>risco empírico\u003c/em> (erro no treino) e torce para que ele se aproxime do risco verdadeiro.\u003c/p>\n\u003cp>Toda a teoria de generalização vive nessa lacuna. Overfitting, regularização, validação — tudo é tentativa de controlar a diferença entre \"erro que eu consigo medir\" e \"erro que eu realmente quero\".\u003c/p>\n\u003cp>Uma consequência que vale internalizar: \u003cstrong>o modelo aprende a distribuição dos dados de treino, não o fenômeno do mundo.\u003c/strong> Se seu treino tem viés de amostragem, o modelo aprende o viés com a mesma fidelidade com que aprende o sinal. Isso não é bug, é a definição do que ele faz.\u003c/p>\n\u003ch3 id=\"h-1-2-supervisionado-não-supervisionado-por-reforço\">1.2 Supervisionado, não-supervisionado, por reforço\u003c/h3>\n\u003cp>\u003cstrong>Supervisionado\u003c/strong> — você tem pares \u003ccode>(X, y)\u003c/code>. O rótulo \u003ccode>y\u003c/code> fornece um sinal de erro direto e por amostra: para cada exemplo, você sabe exatamente o quanto errou. Subdivide-se em classificação (\u003ccode>y\u003c/code> categórico) e regressão (\u003ccode>y\u003c/code> contínuo). É de longe o mais usado na indústria porque é o que funciona de forma confiável quando existem rótulos.\u003c/p>\n\u003cp>O gargalo real do supervisionado quase nunca é o algoritmo — é obter rótulos corretos, em volume, e que representem o que você realmente quer prever. Boa parte do trabalho sênior é perceber que o rótulo disponível é um \u003cem>proxy\u003c/em> do objetivo verdadeiro (você quer prever \"usuário gostou\", mas seu rótulo é \"usuário clicou\") e raciocinar sobre a distorção que isso introduz.\u003c/p>\n\u003cp>\u003cstrong>Não-supervisionado\u003c/strong> — você só tem \u003ccode>X\u003c/code>. Não existe sinal de erro externo; o algoritmo otimiza um critério interno (compacidade de clusters, variância explicada, verossimilhança sob um modelo de densidade). A consequência prática decisiva: \u003cstrong>não existe uma resposta objetivamente certa e, portanto, não existe validação limpa\u003c/strong>. Avaliar clustering é intrinsecamente mais frágil do que avaliar classificação. Usos típicos: segmentação, redução de dimensionalidade, detecção de anomalias, compressão.\u003c/p>\n\u003cp>\u003cstrong>Auto-supervisionado\u003c/strong> (vale mencionar, é o que sustenta LLMs) — tecnicamente supervisionado, mas o rótulo é gerado automaticamente a partir da própria estrutura do dado: prever a próxima palavra, prever um trecho mascarado, prever se dois recortes vêm da mesma imagem. Isso resolve o gargalo de rotulagem e é a razão de o pré-treinamento em escala ser viável.\u003c/p>\n\u003cp>\u003cstrong>Por reforço\u003c/strong> — um agente age num ambiente, recebe recompensas, e aprende uma política que maximiza recompensa acumulada. Três diferenças estruturais em relação ao supervisionado, e são elas que o entrevistador quer ouvir:\u003c/p>\n\u003col>\u003cli>\u003cstrong>O feedback é avaliativo, não instrutivo.\u003c/strong> A recompensa diz \"isso foi bom\" mas não diz \"o certo era aquilo\". Você não recebe o gradiente da resposta correta.\u003c/li>\u003cli>\u003cstrong>O feedback é atrasado e o crédito é ambíguo\u003c/strong> (\u003cem>credit assignment problem\u003c/em>): a jogada que perdeu a partida de xadrez pode ter sido o lance 12, não o lance 40.\u003c/li>\u003cli>\u003cstrong>Os dados dependem da política.\u003c/strong> O agente coleta os próprios dados; mudar a política muda a distribuição de dados. Isso quebra a suposição i.i.d. e cria o dilema \u003cstrong>exploration vs exploitation\u003c/strong> — explorar ações desconhecidas custa recompensa no curto prazo mas é a única forma de descobrir algo melhor.\u003c/li>\u003c/ol>\n\u003cp>Onde aparece na prática: robótica, jogos, otimização de sistemas, e — o exemplo que todo entrevistador vai citar em 2026 — RLHF/RLAIF no alinhamento de LLMs.\u003c/p>\n\u003ch3 id=\"h-1-3-bias-variance-tradeoff\">1.3 Bias-variance tradeoff\u003c/h3>\n\u003cp>É a decomposição mais cobrada de todas. Para erro quadrático, o erro esperado num ponto se decompõe em:\u003c/p>\n\u003cpre>\u003ccode>E[(y - f̂(x))²]  =  Bias[f̂(x)]²  +  Var[f̂(x)]  +  σ²\n                    (erro sistemático) (instabilidade)  (ruído irredutível)\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Bias\u003c/strong> é o erro por suposições erradas do modelo. Formalmente, \u003ccode>E[f̂(x)] - f(x)\u003c/code>: a diferença entre a previsão média do seu modelo (média sobre diferentes datasets de treino) e a verdade. Alto bias significa que \u003cstrong>mesmo com dados infinitos\u003c/strong> o modelo erraria — ele é rígido demais para representar o fenômeno. Ajustar uma reta a dados quadráticos tem bias alto e nenhuma quantidade de dados resolve.\u003c/p>\n\u003cp>\u003cstrong>Variância\u003c/strong> é a sensibilidade do modelo à amostra específica de treino. Formalmente \u003ccode>E[(f̂(x) - E[f̂(x)])²]\u003c/code>. Alta variância significa que se você retreinasse com outra amostra da mesma população, obteria um modelo bem diferente. Isso é ruim porque a sua amostra específica contém ruído, e um modelo de alta variância modela esse ruído.\u003c/p>\n\u003cp>\u003cstrong>Ruído irredutível (σ²)\u003c/strong> é o piso. Vem da aleatoriedade intrínseca do fenômeno e de variáveis preditivas que você simplesmente não tem. Nenhum modelo passa desse piso — e reconhecer isso numa entrevista é um sinal forte de maturidade: quando alguém pergunta \"como você chegaria a 100% de acurácia?\", a resposta certa costuma ser \"provavelmente não chego, e se eu chegasse eu suspeitaria de leakage\".\u003c/p>\n\u003cp>\u003cstrong>A intuição que faz a ideia colar:\u003c/strong> imagine treinar o mesmo tipo de modelo 100 vezes, cada vez com uma amostra diferente da mesma população, e olhar as 100 previsões para um ponto fixo. Bias é o quanto o \u003cem>centro\u003c/em> dessa nuvem de previsões está deslocado da verdade. Variância é o quanto a nuvem está \u003cem>espalhada\u003c/em>. Um alvo de tiro: bias é mirar torto de forma consistente; variância é ter a mão trêmula.\u003c/p>\n\u003cp>O \u003cstrong>tradeoff\u003c/strong> existe porque aumentar a flexibilidade do modelo tipicamente reduz bias e aumenta variância. Mais profundidade na árvore, mais features, menos regularização — tudo empurra nessa direção.\u003c/p>\n\u003cp>\u003cstrong>Nuance importante para 🔴:\u003c/strong> o tradeoff clássico é uma curva em U (erro de teste desce, atinge mínimo, sobe). Isso é bem estabelecido para modelos clássicos. Em redes neurais muito sobre-parametrizadas observa-se o fenômeno de \u003cstrong>double descent\u003c/strong>: após o pico de erro no ponto de interpolação (onde o modelo tem parâmetros suficientes para ajustar exatamente o treino), continuar aumentando a capacidade faz o erro de teste \u003cem>voltar a cair\u003c/em>. A explicação corrente é que, entre as infinitas soluções que ajustam o treino perfeitamente, o viés implícito do SGD favorece as de menor norma, que generalizam melhor. Se você citar isso, cite como fenômeno observado — não afirme que \"invalida\" o bias-variance tradeoff, porque não invalida; ele reformula o que \"capacidade\" significa.\u003c/p>\n\u003ch3 id=\"h-1-4-overfitting-e-underfitting\">1.4 Overfitting e underfitting\u003c/h3>\n\u003cp>\u003cstrong>Overfitting\u003c/strong> = variância alta. O modelo decorou padrões da amostra de treino que não existem na população. Assinatura: \u003cstrong>erro de treino baixo, erro de validação muito maior, e a lacuna cresce com o treinamento\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Underfitting\u003c/strong> = bias alto. Assinatura: \u003cstrong>erro alto tanto em treino quanto em validação, e próximos entre si\u003c/strong>.\u003c/p>\n\u003cp>O diagnóstico correto vem de olhar os dois erros juntos, nunca um só:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Erro treino\u003c/th>\u003cth>Erro validação\u003c/th>\u003cth>Diagnóstico\u003c/th>\u003cth>Ação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Alto\u003c/td>\u003ctd>Alto (≈ treino)\u003c/td>\u003ctd>Underfitting\u003c/td>\u003ctd>Mais capacidade, melhores features, menos regularização, treinar mais\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Baixo\u003c/td>\u003ctd>Alto\u003c/td>\u003ctd>Overfitting\u003c/td>\u003ctd>Mais dados, mais regularização, menos capacidade, early stopping\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Baixo\u003c/td>\u003ctd>Baixo\u003c/td>\u003ctd>Bom\u003c/td>\u003ctd>Verifique se não é leakage bom demais\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alto\u003c/td>\u003ctd>Baixo\u003c/td>\u003ctd>Suspeito\u003c/td>\u003ctd>Bug, ou val mais fácil que treino, ou dropout/augmentation ativo só no treino\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Curvas de aprendizado\u003c/strong> (erro vs. quantidade de dados) são a ferramenta de diagnóstico que impressiona em entrevista, porque respondem a pergunta \"vale a pena coletar mais dados?\":\u003c/p>\n\u003cul>\u003cli>Se as curvas de treino e validação \u003cstrong>convergiram e ficaram juntas num erro alto\u003c/strong> → bias alto. Mais dados \u003cstrong>não\u003c/strong> ajudam. Você precisa de um modelo melhor ou features melhores.\u003c/li>\u003cli>Se ainda existe \u003cstrong>uma lacuna grande\u003c/strong> e a curva de validação ainda está descendo → variância alta. Mais dados ajudam.\u003c/li>\u003c/ul>\n\u003cp>Isso é ouro numa entrevista de system design, porque transforma \"vamos coletar mais dados\" de palpite em decisão fundamentada.\u003c/p>\n\u003ch3 id=\"h-1-5-regularização\">1.5 Regularização\u003c/h3>\n\u003cp>Regularização é qualquer coisa que restringe o espaço de soluções para reduzir variância, aceitando um pouco mais de bias. A forma clássica adiciona uma penalidade à função de custo:\u003c/p>\n\u003cpre>\u003ccode>J(w) = Perda(dados) + λ · Penalidade(w)\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>λ\u003c/code> controla o tradeoff: \u003ccode>λ = 0\u003c/code> é sem regularização; \u003ccode>λ → ∞\u003c/code> empurra todos os pesos a zero (bias máximo). \u003ccode>λ\u003c/code> é um hiperparâmetro e \u003cstrong>se escolhe por validação, nunca pelo teste\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>L2 (Ridge), penalidade \u003ccode>λ Σ wᵢ²\u003c/code>.\u003c/strong> Encolhe todos os coeficientes proporcionalmente ao seu tamanho, mas \u003cstrong>não zera nenhum\u003c/strong>. Por quê: o gradiente da penalidade é \u003ccode>2λw\u003c/code>, que \u003cstrong>encolhe junto com o peso\u003c/strong>. Quando \u003ccode>w\u003c/code> já é pequeno, a força que empurra para zero também é pequena, e ela equilibra com o gradiente da perda antes de chegar a zero. Efeito prático: com features correlacionadas, L2 \u003cem>distribui\u003c/em> o peso entre elas, o que estabiliza o modelo. Solução analítica: \u003ccode>w = (XᵀX + λI)⁻¹Xᵀy\u003c/code> — o \u003ccode>λI\u003c/code> torna a matriz invertível mesmo com multicolinearidade perfeita, que é a razão histórica do nome \"ridge\".\u003c/p>\n\u003cp>\u003cstrong>L1 (Lasso), penalidade \u003ccode>λ Σ |wᵢ|\u003c/code>.\u003c/strong> \u003cstrong>Zera coeficientes\u003c/strong>, produzindo soluções esparsas e, portanto, seleção automática de features. Por quê: o gradiente (subgradiente) da penalidade é \u003ccode>λ · sign(w)\u003c/code>, de \u003cstrong>magnitude constante\u003c/strong> independentemente do tamanho de \u003ccode>w\u003c/code>. Ele continua empurrando com a mesma força quando \u003ccode>w\u003c/code> é minúsculo, então chega em zero exatamente — e zero é um ponto estável porque a função tem um \"bico\" ali.\u003c/p>\n\u003cp>A explicação geométrica é a que os entrevistadores adoram: as curvas de nível da perda são elipses; a região de restrição de L2 é um círculo (bola L2), a de L1 é um losango (bola L1). O ponto de contato entre a elipse e a bola é a solução. O losango tem \u003cstrong>quinas nos eixos\u003c/strong>, e uma elipse tem probabilidade alta de tocar primeiro numa quina — e a quina é exatamente o ponto onde alguma coordenada vale zero. O círculo não tem quinas, então o contato quase nunca cai num eixo.\u003c/p>\n\u003cp>\u003cstrong>Elastic Net\u003c/strong> — combina as duas: \u003ccode>λ₁Σ|wᵢ| + λ₂Σwᵢ²\u003c/code>. Existe para resolver uma falha concreta do L1: com um grupo de features altamente correlacionadas, o L1 tende a escolher \u003cstrong>arbitrariamente uma\u003c/strong> e zerar as outras (instável — refaça o treino com outra amostra e ele escolhe outra). O termo L2 do Elastic Net faz o grupo ser selecionado ou descartado em conjunto, o que é mais estável e frequentemente mais interpretável.\u003c/p>\n\u003cp>\u003cstrong>Outras formas de regularização\u003c/strong> (importante saber que a palavra é mais ampla que L1/L2): early stopping, dropout, data augmentation, injeção de ruído, batch norm (efeito colateral regularizador), limitar profundidade de árvore, subsample/bagging, weight sharing em CNNs, e — a mais poderosa e menos citada — \u003cstrong>mais dados\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Detalhe que separa candidatos:\u003c/strong> o termo de bias/intercepto \u003cstrong>não deve ser regularizado\u003c/strong>. Ele não controla complexidade, só desloca a predição; penalizá-lo enviesa o modelo para prever perto de zero sem motivo. Bibliotecas maduras já tratam isso, mas saber a razão é um sinal de que você entende o que a penalidade faz.\u003c/p>\n\u003cp>\u003cstrong>E outro:\u003c/strong> regularização L1/L2 \u003cstrong>exige features escalonadas\u003c/strong>. A penalidade é aplicada à magnitude do coeficiente, e a magnitude do coeficiente depende da unidade da feature. Uma feature em metros e a mesma feature em quilômetros geram coeficientes com escalas 1000× diferentes e, portanto, penalidades completamente diferentes para o mesmo modelo. Sem padronizar, você está regularizando arbitrariamente com base em escolha de unidade.\u003c/p>\n\u003ch3 id=\"h-1-6-interpretação-bayesiana-bom-para\">1.6 Interpretação bayesiana (bom para 🔴)\u003c/h3>\n\u003cp>Regularização L2 é matematicamente equivalente a \u003cstrong>MAP com prior gaussiano\u003c/strong> sobre os pesos (média zero); L1 equivale a MAP com \u003cstrong>prior de Laplace\u003c/strong>. Isso não é curiosidade: dá um significado a \u003ccode>λ\u003c/code> — ele codifica quão fortemente você acredita, \u003cem>antes de ver os dados\u003c/em>, que os coeficientes são pequenos. Um prior de Laplace tem pico agudo em zero, o que é exatamente a crença \"a maioria das features é irrelevante\" e explica a esparsidade. Ver o detalhamento em \u003ca href=\"#\" class=\"topic-link\" data-topic=\"10\">10 — Estatística e probabilidade\u003c/a>.\u003c/p>\n\u003ch3 id=\"h-1-7-no-free-lunch\">1.7 No Free Lunch\u003c/h3>\n\u003cp>O teorema \u003cem>No Free Lunch\u003c/em> diz que, \u003cstrong>na média sobre todos os problemas possíveis\u003c/strong>, todos os algoritmos têm o mesmo desempenho. A implicação prática não é \"nada funciona\" — é que \u003cstrong>todo bom desempenho vem de suposições sobre a estrutura do problema que por acaso são verdadeiras\u003c/strong>. Redes convolucionais funcionam em imagens porque assumem localidade e invariância a translação, e imagens de fato têm isso. Não existe \"melhor algoritmo\" fora de contexto — só existe melhor \u003cem>encaixe entre as suposições do modelo e a estrutura dos dados\u003c/em>.\u003c/p>\n\u003cp>É a resposta certa para \"qual é o melhor algoritmo de ML?\", e a razão pela qual a resposta \"depende\" só é aceitável se você disser \u003cstrong>depende de quê\u003c/strong>.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Confundir \"erro de treino baixo\" com \"modelo bom\".\u003c/strong> O erro de treino sozinho não informa nada sobre generalização. Um modelo que decora a tabela tem erro de treino zero.\u003c/p>\n\u003cp>\u003cstrong>Achar que alto bias e alta variância são mutuamente exclusivos.\u003c/strong> Um modelo pode ter os dois: uma árvore rasa mas instável, ou uma rede mal-arquitetada com poucos dados. Não é uma escala unidimensional — o tradeoff descreve como \u003cem>tipicamente\u003c/em> eles se movem quando você mexe na capacidade, não uma lei.\u003c/p>\n\u003cp>\u003cstrong>Dizer \"L1 é melhor porque faz seleção de features\".\u003c/strong> Nem sempre você quer descartar features. Com features correlacionadas, L1 é instável e a escolha entre elas é arbitrária. Com sinal distribuído entre muitas features fracas, L1 destrói informação. A resposta certa depende da estrutura do sinal.\u003c/p>\n\u003cp>\u003cstrong>Regularizar sem escalonar.\u003c/strong> Torna a força efetiva da regularização dependente das unidades das features. Erro invisível e muito comum.\u003c/p>\n\u003cp>\u003cstrong>Tratar \u003ccode>λ\u003c/code> como constante universal.\u003c/strong> \u003ccode>λ\u003c/code> depende dos dados, da escala das features e do tamanho do dataset. Sempre se ajusta por validação.\u003c/p>\n\u003cp>\u003cstrong>Achar que mais dados sempre ajudam.\u003c/strong> Se o modelo tem bias alto, mais dados não movem a agulha. Curvas de aprendizado respondem isso — e a resposta muda uma decisão cara de negócio.\u003c/p>\n\u003cp>\u003cstrong>Confundir overfitting com \"modelo complexo demais\".\u003c/strong> Overfitting é uma relação entre capacidade do modelo, quantidade de dados e nível de ruído — não uma propriedade do modelo isolado. O mesmo modelo pode overfittar com 1000 amostras e generalizar bem com 1 milhão.\u003c/p>\n\u003cp>\u003cstrong>Dizer que redes neurais \"não overfittam\" porque funcionam sobre-parametrizadas.\u003c/strong> Elas overfittam sim, e facilmente — o que funciona é a combinação de escala de dados, regularização implícita do SGD e regularização explícita. Tirar tudo isso e treinar uma rede grande em dados pequenos gera overfitting espetacular.\u003c/p>\n\u003cp>\u003cstrong>Usar \"não-supervisionado\" como sinônimo de \"sem avaliação\".\u003c/strong> Você ainda pode e deve avaliar: métricas internas, estabilidade sob reamostragem, ou — melhor de tudo — desempenho numa tarefa downstream supervisionada.\u003c/p>\n\u003cp>\u003cstrong>Responder \"depende\" sem dizer de quê.\u003c/strong> É a forma mais rápida de parecer que você está evitando a pergunta. \"Depende do custo relativo dos erros — se falso negativo custa 50× mais, eu faria X\" é a versão que passa.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Qual a diferença entre aprendizado supervisionado e não-supervisionado?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> No supervisionado você tem pares entrada-rótulo, então cada exemplo fornece um sinal de erro direto: você compara a previsão com a resposta certa. Classificação e regressão são os dois casos, conforme o rótulo seja categórico ou contínuo. No não-supervisionado você só tem as entradas; o algoritmo otimiza um critério interno como compacidade de clusters ou variância explicada. A consequência prática mais importante é a avaliação: no supervisionado você mede erro contra a verdade em dados retidos, no não-supervisionado não existe verdade objetiva, então a validação é intrinsecamente mais frágil e frequentemente depende de julgamento humano ou de uma tarefa downstream.\u003c/p>\n\u003cp>\u003cstrong>Follow-up comum:\u003c/strong> \u003cem>\"Onde entra o auto-supervisionado?\"\u003c/em> — Tecnicamente é supervisionado, mas o rótulo é derivado automaticamente da estrutura do próprio dado (prever a próxima palavra, reconstruir um trecho mascarado). Isso remove o gargalo de rotulagem manual e é o que torna viável pré-treinar em escala — é a base dos LLMs.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Semi-supervisionado?\"\u003c/em> — Poucos dados rotulados e muitos não rotulados. A ideia central é usar a estrutura dos dados não rotulados (por exemplo, a suposição de que a fronteira de decisão passa por regiões de baixa densidade) para orientar o modelo. Pseudo-labeling e consistency regularization são as técnicas mais citadas.\u003c/p>"},{"titleHtml":"🟢 Explique overfitting. Como você detecta e como corrige?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Overfitting é quando o modelo aprende padrões específicos da amostra de treino que não generalizam — ele modelou o ruído junto com o sinal. Eu detecto comparando erro de treino e de validação: overfitting é erro de treino baixo com erro de validação significativamente maior, e a lacuna aumentando ao longo do treinamento. Isso é diferente de underfitting, onde ambos os erros são altos e próximos.\u003c/p>\n\u003cp>Para corrigir, ataco pelas causas: mais dados de treino é a solução mais confiável quando é viável; aumentar a regularização (L1/L2, dropout, early stopping); reduzir a capacidade do modelo (menos profundidade, menos features); data augmentation quando o domínio permite; e ensembles, que reduzem variância por média. A escolha depende do que está barato — se coletar dados custa caro, regularizo; se tenho dados de sobra, aumento eles antes de mexer no modelo.\u003c/p>\n\u003cp>\u003cstrong>Follow-up quase garantido:\u003c/strong> \u003cem>\"Como você sabe que a diferença entre 0.90 de treino e 0.87 de validação é overfitting e não flutuação amostral?\"\u003c/em> — Não sei olhando um número só. Eu olharia o intervalo de confiança dessa diferença via cross-validation: se o desvio-padrão entre folds é 0.03, uma diferença de 0.03 é ruído. Uma lacuna é preocupante quando é grande em relação à variabilidade entre folds e quando cresce sistematicamente com a capacidade do modelo.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"E se val e teste discordam?\"\u003c/em> — Sinal de que eu overfittei no conjunto de validação por seleção de hiperparâmetros — testei tantas configurações que escolhi a que teve sorte na validação. É o caso de usar nested cross-validation ou reservar um teste realmente intocado. Ver \u003ca href=\"#\" class=\"topic-link\" data-topic=\"03\">03 — Validação\u003c/a>.\u003c/p>"},{"titleHtml":"🟢 O que é o bias-variance tradeoff?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É a decomposição do erro esperado em três partes: bias ao quadrado, variância e ruído irredutível. Bias é erro por suposições rígidas demais — o modelo erraria mesmo com dados infinitos, porque não consegue representar o fenômeno. Variância é sensibilidade à amostra específica de treino — se eu retreinasse com outra amostra da mesma população, obteria um modelo bem diferente. Ruído irredutível é o piso que nenhum modelo ultrapassa.\u003c/p>\n\u003cp>O tradeoff aparece porque aumentar a flexibilidade do modelo geralmente reduz bias e aumenta variância. A intuição do alvo de tiro: bias é mirar consistentemente torto, variância é ter a mão trêmula. Na prática eu uso isso como ferramenta de diagnóstico — se treino e validação são ambos ruins, é bias e eu preciso de mais capacidade ou features melhores; se treino é bom e validação é ruim, é variância e eu preciso de regularização ou mais dados.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Dê um exemplo de modelo de alto bias e um de alta variância.\"\u003c/em> — Regressão linear em dados não-lineares é o exemplo canônico de alto bias. Uma árvore de decisão sem poda é o de alta variância: ela consegue ajustar exatamente qualquer conjunto de treino e muda drasticamente com pequenas mudanças nos dados. kNN com k=1 é outro: alta variância; e conforme k cresce, você troca variância por bias.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"Random forest reduz bias ou variância?\"\u003c/em> — Principalmente variância. Cada árvore individual é de alta variância e baixo bias; a média sobre árvores descorrelacionadas reduz a variância sem aumentar muito o bias. A chave é a descorrelação — daí a amostragem aleatória de features em cada split, além do bootstrap. Se as árvores fossem idênticas, a média não reduziria nada. Boosting, ao contrário, reduz principalmente bias, somando aprendizes fracos sequencialmente.\u003c/p>"},{"titleHtml":"🟡 Qual a diferença entre regularização L1 e L2? Quando você usaria cada uma?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> L2 adiciona a soma dos quadrados dos pesos ao custo, L1 adiciona a soma dos valores absolutos. A diferença prática decisiva é que \u003cstrong>L1 zera coeficientes e L2 só os encolhe\u003c/strong>.\u003c/p>\n\u003cp>O motivo é o gradiente da penalidade. Em L2 o gradiente é proporcional ao peso, então a força que empurra para zero encolhe junto com o peso e ela se equilibra com o gradiente da perda antes de chegar a zero. Em L1 o gradiente tem magnitude constante — ele continua empurrando com a mesma força mesmo quando o peso é minúsculo, então atinge zero exatamente. Geometricamente: a região de restrição do L1 é um losango com quinas nos eixos, e as curvas de nível da perda tendem a tocar primeiro numa quina, que é onde uma coordenada vale zero. A do L2 é uma esfera, sem quinas.\u003c/p>\n\u003cp>Uso L1 quando quero seleção automática de features, quando suspeito que a maioria das features é irrelevante, ou quando preciso de um modelo enxuto e interpretável. Uso L2 como padrão quando acredito que muitas features contribuem um pouco cada, e especialmente com features correlacionadas, porque L2 distribui peso entre elas em vez de escolher uma arbitrariamente. Elastic Net quando quero esparsidade mas tenho grupos de features correlacionadas — o termo L2 estabiliza a seleção dentro do grupo.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Por que L1 é instável com features correlacionadas?\"\u003c/em> — Se duas features são quase idênticas, várias combinações de coeficientes dão praticamente a mesma perda e a mesma penalidade L1 (porque |a| + |b| é constante ao longo de uma direção). A solução não é única e pequenas perturbações nos dados mudam qual feature é selecionada. L2 quebra esse empate porque a penalidade quadrática é estritamente minimizada quando o peso é dividido igualmente.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Você regulariza o intercepto?\"\u003c/em> — Não. O intercepto não controla complexidade, só desloca a predição. Penalizá-lo enviesa o modelo para prever perto de zero por nenhuma razão principiada.\u003c/p>\n\u003cp>\u003cstrong>Pegadinha:\u003c/strong> \u003cem>\"Preciso escalonar as features antes de regularizar?\"\u003c/em> — \u003cstrong>Sim, e isso não é opcional.\u003c/strong> A penalidade age sobre a magnitude do coeficiente, que é inversamente proporcional à escala da feature. Trocar metros por quilômetros muda o coeficiente por 1000× e portanto muda quanto aquela feature é penalizada, sem nada de substantivo ter mudado. Sem padronizar, sua escolha de unidades vira uma escolha de regularização.\u003c/p>"},{"titleHtml":"🟡 Erro de treino baixo, erro de validação alto. O que você faz?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É a assinatura de overfitting, mas antes de tratar como overfitting eu descartaria duas coisas mais graves. Primeiro, \u003cstrong>leakage invertido ou distribuições diferentes\u003c/strong>: a validação pode não vir da mesma distribuição do treino — split feito errado, período temporal diferente, grupos vazando. Segundo, um \u003cstrong>bug no pipeline\u003c/strong>: transformações ajustadas em treino aplicadas de forma inconsistente na validação.\u003c/p>\n\u003cp>Descartadas essas, eu trato como variância: primeiro tento curvas de aprendizado para saber se mais dados resolveriam — se a curva de validação ainda está descendo com mais dados, coletar dados é o melhor investimento. Se não, aumento a regularização progressivamente, reduzo a capacidade do modelo, e uso early stopping. Simplificar features também: com poucos exemplos e muitas features, o overfitting é quase garantido.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"E se, depois de tudo, a lacuna persistir?\"\u003c/em> — Aceito e reporto honestamente. Uma lacuna pequena e estável é normal; o que importa é o erro de validação absoluto, não a lacuna. Um modelo com 0.85 de treino e 0.84 de validação é pior que um com 0.95 de treino e 0.90 de validação, mesmo tendo lacuna menor. \u003cstrong>A lacuna é diagnóstico, não é métrica de objetivo.\u003c/strong>\u003c/p>"},{"titleHtml":"🟡 Como você diferencia aprendizado por reforço de supervisionado, e quando usaria RL?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Três diferenças estruturais. Primeiro, o feedback é \u003cstrong>avaliativo e não instrutivo\u003c/strong>: a recompensa diz que a ação foi boa ou ruim, mas não diz qual era a ação certa — eu não recebo o gradiente da resposta correta. Segundo, o feedback é \u003cstrong>atrasado\u003c/strong>, o que cria o problema de atribuição de crédito: numa partida perdida, qual das 40 jogadas foi a culpada? Terceiro, e mais importante, \u003cstrong>os dados dependem da política\u003c/strong>: o agente coleta os próprios dados, então mudar a política muda a distribuição dos dados. Isso quebra a suposição i.i.d. e cria o dilema exploração vs. explotação (exploration vs. exploitation).\u003c/p>\n\u003cp>Eu usaria RL quando o problema é \u003cstrong>sequencial\u003c/strong>, quando as ações \u003cstrong>afetam o estado futuro\u003c/strong>, e quando não tenho rótulos supervisionados do que é a ação ótima — só um sinal de qualidade do resultado. Se eu tenho as ações ótimas rotuladas, aprendizado supervisionado (imitation learning) é mais simples e mais estável e eu escolheria ele.\u003c/p>\n\u003cp>Na prática, RL puro é caro e instável, então costuma valer a pena só quando a simulação é barata (jogos, ambientes simulados) ou quando o ganho é grande o bastante para justificar (RLHF em LLMs, onde o objetivo — \"resposta útil\" — é difícil de especificar como perda supervisionada mas fácil de julgar comparativamente).\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"Por que RLHF em vez de só fine-tuning supervisionado?\"\u003c/em> — Porque para muitas propriedades desejáveis a gente sabe \u003cem>comparar\u003c/em> duas respostas mas não sabe \u003cem>escrever\u003c/em> a resposta ideal em volume. O RLHF explora isso: treina-se um modelo de recompensa a partir de comparações humanas e depois otimiza a política contra ele. O ponto de fragilidade é o \u003cstrong>reward hacking\u003c/strong> — o modelo otimiza o proxy (o modelo de recompensa) e não a preferência humana real, e a otimização excessiva contra um proxy imperfeito degrada a qualidade verdadeira. Por isso se usa uma penalidade KL contra o modelo de referência, para impedir que a política se afaste demais.\u003c/p>"},{"titleHtml":"🟡 Se você adiciona mais dados de treino, o que acontece com bias e variância?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Variância \u003cstrong>diminui\u003c/strong> — mais dados significam que o modelo é menos sensível a peculiaridades de qualquer amostra específica, e as estimativas dos parâmetros ficam mais estáveis. Bias \u003cstrong>essencialmente não muda\u003c/strong>, porque bias é uma propriedade da classe de modelos, não da quantidade de dados. Uma reta continua sendo uma reta com um bilhão de pontos.\u003c/p>\n\u003cp>Por isso a pergunta \"mais dados vão ajudar?\" é respondida por curvas de aprendizado: se treino e validação já convergiram juntos num erro alto, o problema é bias e mais dados são desperdício de orçamento — preciso de um modelo mais expressivo ou de features melhores. Se ainda há lacuna e a curva de validação está descendo, mais dados ajudam.\u003c/p>\n\u003cp>\u003cstrong>Nuance que vale citar:\u003c/strong> mais dados \u003cem>indiretamente\u003c/em> permitem reduzir bias, porque viabilizam usar um modelo de maior capacidade sem overfittar. É exatamente essa a lógica das leis de escala em deep learning — dados e capacidade escalam juntos.\u003c/p>"},{"titleHtml":"🔴 Explique por que a decomposição bias-variance é problemática para classificação.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A decomposição exata em três termos aditivos é derivada para \u003cstrong>erro quadrático\u003c/strong>. Para perda 0-1 ela não se decompõe de forma aditiva limpa — existem formulações propostas (Domingos, Kohavi-Wolpert), mas elas discordam entre si e envolvem definições diferentes de \"bias\" para perdas não-quadráticas. Um efeito contraintuitivo concreto: em classificação, a variância pode \u003cstrong>reduzir\u003c/strong> o erro. Se a previsão média está do lado errado da fronteira de decisão, ruído nas previsões faz parte delas cair do lado certo, o que baixa a taxa de erro.\u003c/p>\n\u003cp>Na prática eu uso bias-variance em classificação como \u003cstrong>linguagem qualitativa de diagnóstico\u003c/strong> — \"isso parece variância, vou regularizar\" — e não como decomposição numérica. Para decompor de fato, eu decomporia a \u003cstrong>log-loss\u003c/strong> ou o \u003cstrong>Brier score\u003c/strong>, que são perdas próprias e admitem tratamento mais limpo.\u003c/p>"},{"titleHtml":"🔴 O que é double descent e o que ele diz sobre o bias-variance tradeoff?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A curva clássica em U prevê que o erro de teste sobe monotonicamente depois que a capacidade passa do ponto ótimo. O que se observa empiricamente em modelos modernos é diferente: o erro sobe até um pico no \u003cstrong>limiar de interpolação\u003c/strong> — o ponto onde o modelo tem parâmetros suficientes para ajustar o treino exatamente — e depois, ao continuar aumentando a capacidade, \u003cstrong>volta a cair\u003c/strong>, frequentemente abaixo do mínimo da primeira descida.\u003c/p>\n\u003cp>A explicação corrente é sobre \u003cstrong>viés implícito da otimização\u003c/strong>: no regime muito sobre-parametrizado existem infinitas soluções que zeram o erro de treino, e o SGD não escolhe uma qualquer — ele converge preferencialmente para soluções de menor norma, que são mais suaves e generalizam melhor. Perto do limiar de interpolação existe exatamente \u003cem>uma\u003c/em> solução que interpola, e ela é forçada a ser contorcida, daí o pico.\u003c/p>\n\u003cp>Isso não invalida o bias-variance tradeoff; ele mostra que \u003cstrong>contagem de parâmetros é uma medida ruim de capacidade efetiva\u003c/strong>. A capacidade que importa é a do conjunto de soluções que o otimizador de fato alcança, não a do espaço de hipóteses nominal. Também se observa double descent em função do número de épocas e da quantidade de dados, não só do tamanho do modelo.\u003c/p>"},{"titleHtml":"🔴 Qual o \"melhor\" algoritmo de machine learning?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Não existe, e o teorema No Free Lunch formaliza isso: na média sobre todos os problemas possíveis, todos os algoritmos têm desempenho equivalente. O que isso realmente significa é que \u003cstrong>todo bom desempenho vem de suposições sobre a estrutura do problema que por acaso são verdadeiras\u003c/strong>. CNNs funcionam em imagens porque assumem localidade e invariância a translação, e imagens têm isso. Modelos lineares funcionam quando a relação é aproximadamente linear.\u003c/p>\n\u003cp>Dito isso, na prática existem defaults muito razoáveis por tipo de dado, e eu daria isso como resposta concreta em vez de me esconder no \"depende\": para \u003cstrong>dados tabulares\u003c/strong>, gradient boosting é o padrão que vence na esmagadora maioria dos casos, com regressão logística como baseline obrigatório. Para \u003cstrong>imagem, texto e áudio\u003c/strong>, redes neurais pré-treinadas com fine-tuning. A razão da divisão é que dados tabulares têm features heterogêneas e já semanticamente significativas — não há estrutura espacial ou sequencial para uma rede explorar — enquanto imagem e texto têm exatamente a estrutura composicional que arquiteturas profundas foram feitas para capturar.\u003c/p>"},{"titleHtml":"🔴 Você tem 500 exemplos rotulados e 500 mil não rotulados. Como aborda?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Com 500 rótulos, meu inimigo principal é variância, então todas as decisões vão nessa direção.\u003c/p>\n\u003cp>Primeiro, \u003cstrong>validação antes de tudo\u003c/strong>: com 500 exemplos, um único split de validação é ruído puro. Eu usaria k-fold repetido ou até leave-one-out, e reportaria intervalos, não pontos. Sem isso, toda decisão seguinte é chute.\u003c/p>\n\u003cp>Segundo, aproveitar os não rotulados. As opções por ordem de custo-benefício: (a) \u003cstrong>pré-treinamento auto-supervisionado\u003c/strong> ou uso de um modelo de fundação já pré-treinado no domínio, extraindo embeddings e treinando só um classificador leve por cima — quase sempre o maior ganho por esforço; (b) \u003cstrong>pseudo-labeling\u003c/strong> com limiar de confiança alto e iterativo, sabendo que ele amplifica os próprios erros e precisa de controle; (c) \u003cstrong>active learning\u003c/strong> — usar o modelo para escolher quais 200 exemplos adicionais rotular, priorizando os de maior incerteza ou maior representatividade, o que costuma valer muito mais que 200 rótulos aleatórios.\u003c/p>\n\u003cp>Terceiro, \u003cstrong>modelo simples e fortemente regularizado\u003c/strong>: regressão logística ou modelo linear sobre embeddings, não uma rede treinada do zero. Com 500 exemplos, capacidade é veneno.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Riscos do pseudo-labeling?\"\u003c/em> — Confirmation bias: o modelo rotula com seus próprios vieses, treina neles, fica mais confiante nos mesmos erros. Mitigo com limiar alto, poucas iterações, monitorando num conjunto rotulado real que nunca recebe pseudo-rótulos, e revertendo se a métrica cair.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"No tradeoff bias-variance, o que significa um modelo com \u003cstrong>alta variância\u003c/strong>?","a":["Sensível à amostra de treino: outra amostra, outro modelo","Rígido demais: erraria mesmo com dados infinitos disponíveis","Erro alto no treino e na validação, e próximos entre si","Já atingiu o ruído irredutível, que é o piso do problema"],"c":0,"e":"Variância é sensibilidade à amostra: o modelo aprende o ruído junto com o sinal. Rigidez que erra mesmo com dados infinitos descreve bias alto; erro alto e próximo nos dois conjuntos é a assinatura de underfitting, portanto também bias; e o ruído irredutível é o piso que nenhum modelo ultrapassa."},{"n":"🟢","levelName":"basico","q":"Qual é a assinatura clássica de \u003cstrong>overfitting\u003c/strong>?","a":["Erro baixo no treino e baixo na validação, sem lacuna aparente","Erro alto no treino e alto na validação, muito próximos entre si","Erro baixo no treino e bem maior na validação, com lacuna crescente","Erro alto no treino e baixo na validação, invertendo o esperado"],"c":2,"e":"O modelo decorou padrões da amostra que não generalizam, e a lacuna cresce com o treinamento. Erros altos e próximos indicam underfitting; ambos baixos é o cenário bom, salvo suspeita de leakage; e treino pior que validação costuma ser dropout ou augmentation ativos só no treino, o que é esperado."},{"n":"🟡","levelName":"intermediario","q":"Por que a regularização \u003cstrong>L1 zera coeficientes\u003c/strong> e a L2 não?","a":["L2 só funciona quando as features já estão todas padronizadas","A penalidade L1 é sempre numericamente maior que a penalidade L2","L1 remove features correlacionadas antes mesmo de treinar o modelo","O gradiente da penalidade tem módulo constante e não enfraquece"],"c":3,"e":"O subgradiente do valor absoluto não diminui quando o peso encolhe, então empurra até zero exatamente, e o bico da função torna o zero estável. Em L2 a força é proporcional ao peso e some antes de chegar lá. A magnitude da penalidade depende de lambda, não da norma; L1 não pré-seleciona nada; e padronizar é exigência das duas."},{"n":"🟡","levelName":"intermediario","q":"Você adiciona muito mais dados de treino. O que acontece com bias e variância?","a":["O bias cai e a variância permanece exatamente onde estava antes","A variância cai e o bias praticamente não muda com mais dados","Os dois caem de forma proporcional ao volume que foi acrescentado","Nenhum dos dois muda: só o tempo de treinamento cresce muito"],"c":1,"e":"Mais dados estabilizam as estimativas, mas uma reta continua sendo uma reta com um bilhão de pontos — bias é propriedade da classe de modelos. Por isso curvas de aprendizado respondem se vale a pena coletar mais: com curvas juntas num erro alto, o problema é bias e coletar não move a agulha."},{"n":"🟡","levelName":"intermediario","q":"Nas curvas de aprendizado, treino e validação \u003cstrong>convergiram juntas num erro alto\u003c/strong>. O que indica?","a":["Leakage: o resultado ficou bom demais para a dificuldade real","Variância alta: coletar mais dados vai fechar a lacuna que sobrou","Bias alto: mais dados não ajudam, precisa de modelo mais expressivo","Learning rate alto demais, fazendo a perda oscilar sem convergir"],"c":2,"e":"Curvas juntas e altas significam modelo rígido demais, e mais dados são desperdício de orçamento. Se houvesse lacuna grande com a validação ainda descendo, aí sim seria variância e coletar ajudaria. Leakage produz o oposto, resultado bom demais, e learning rate alto aparece como perda instável, não como patamar."},{"n":"🟡","levelName":"intermediario","q":"Por que regularização L1/L2 \u003cstrong>exige features escalonadas\u003c/strong>?","a":["A penalidade age sobre a magnitude, que depende da unidade usada","O otimizador diverge sempre que as escalas forem muito diferentes","L1 e L2 só são definidas para valores entre zero e um, por norma","O intercepto precisa ser penalizado na mesma escala das features"],"c":0,"e":"Trocar metros por quilômetros muda o coeficiente por mil e portanto muda quanto aquela feature é penalizada, sem nada substantivo mudar. Escalas diferentes atrapalham a otimização, mas isso é outro efeito e não causa divergência garantida; as normas valem para qualquer valor real; e o intercepto justamente não deve ser regularizado."},{"n":"🔴","levelName":"avancado","q":"O que o fenômeno de \u003cstrong>double descent\u003c/strong> mostra sobre o tradeoff bias-variance?","a":["O tradeoff bias-variância foi invalidado para redes neurais fundas","Contagem de parâmetros mede mal a capacidade efetiva do modelo","O erro de teste cai de forma monotônica conforme o modelo cresce","Redes sobre-parametrizadas não conseguem interpolar o treino"],"c":1,"e":"Depois do pico no limiar de interpolação, o erro volta a cair porque, entre as infinitas soluções que zeram o treino, o SGD prefere as de menor norma. Isso reformula o que capacidade significa, sem invalidar o tradeoff. A queda não é monotônica, justamente por causa do pico, e sobre-parametrizar é o que permite interpolar."},{"n":"🔴","levelName":"avancado","q":"Segundo o teorema \u003cstrong>No Free Lunch\u003c/strong>, por que CNNs funcionam bem em imagens?","a":["O teorema garante vantagem de redes profundas em alta dimensão","Elas têm mais parâmetros que os outros modelos disponíveis hoje","Na média sobre todos os problemas elas superam as alternativas","Suas suposições, localidade e invariância, valem para imagens"],"c":3,"e":"O NFL diz que, na média sobre todos os problemas possíveis, todos os algoritmos empatam — o que torna a afirmação de superioridade média o oposto do teorema. Todo bom desempenho vem do encaixe entre viés indutivo e estrutura real dos dados. Contagem de parâmetros não explica nada, e o teorema não garante vantagem a ninguém."}]},{"id":"02","fullTitle":"02 — Métricas de Avaliação","shortTitle":"Métricas de Avaliação","subtitle":"Matriz de confusão, precision/recall/F1, ROC-AUC vs PR-AUC, quando cada métrica engana, métricas de regressão, calibração.","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-o-erro-conceitual-que-define-este-tópico\">1.1 O erro conceitual que define este tópico\u003c/h3>\n\u003cp>Métrica não é detalhe de implementação. \u003cstrong>A métrica é a definição operacional do que \"bom\" significa no seu problema.\u003c/strong> Escolher a métrica errada faz o modelo otimizar a coisa errada com total competência técnica. Um modelo com 99,9% de acurácia num problema de detecção de fraude com 0,1% de fraudes pode ser o modelo que prevê \"nunca é fraude\" — perfeito pela métrica, inútil pelo negócio.\u003c/p>\n\u003cp>Por isso a primeira coisa a fazer numa pergunta de métrica é \u003cstrong>perguntar sobre o custo dos erros\u003c/strong>. Falso positivo e falso negativo quase nunca custam a mesma coisa, e a métrica certa é a que reflete essa assimetria.\u003c/p>\n\u003ch3 id=\"h-1-2-matriz-de-confusão-a-base-de-tudo\">1.2 Matriz de confusão — a base de tudo\u003c/h3>\n\u003cp>Para classificação binária, com \"positivo\" sendo a classe de interesse (geralmente a rara: fraude, doença, churn):\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Previsto Positivo\u003c/th>\u003cth>Previsto Negativo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Real Positivo\u003c/strong>\u003c/td>\u003ctd>TP (verdadeiro positivo)\u003c/td>\u003ctd>FN (falso negativo) — \u003cem>erro tipo II\u003c/em>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Real Negativo\u003c/strong>\u003c/td>\u003ctd>FP (falso positivo) — \u003cem>erro tipo I\u003c/em>\u003c/td>\u003ctd>TN (verdadeiro negativo)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Truque de memória que funciona sob pressão: o segundo termo é \u003cstrong>o que o modelo disse\u003c/strong>, o primeiro diz \u003cstrong>se ele acertou\u003c/strong>. \"Falso positivo\" = ele disse positivo, e foi falso.\u003c/p>\n\u003cp>Todas as métricas de classificação são funções dessas quatro células. Se você entender a matriz, você deriva qualquer métrica na hora e não precisa decorar nenhuma.\u003c/p>\n\u003ch3 id=\"h-1-3-as-métricas-fundamentais\">1.3 As métricas fundamentais\u003c/h3>\n\u003cp>\u003cstrong>Acurácia\u003c/strong> = \u003ccode>(TP + TN) / total\u003c/code>. Fração de acertos. Intuitiva e quase sempre inadequada, porque trata os dois tipos de erro como equivalentes e é dominada pela classe majoritária.\u003c/p>\n\u003cp>\u003cstrong>Precision (precisão / valor preditivo positivo)\u003c/strong> = \u003ccode>TP / (TP + FP)\u003c/code>. \u003cem>Das que eu marquei como positivas, quantas eram mesmo?\u003c/em> Denominador = \u003cstrong>o que o modelo previu\u003c/strong>. É a métrica que importa quando \u003cstrong>agir sobre um positivo custa caro\u003c/strong>: bloquear a transação de um cliente legítimo, enviar um caminhão, iniciar quimioterapia, mostrar um anúncio irrelevante.\u003c/p>\n\u003cp>\u003cstrong>Recall (revocação / sensibilidade / TPR)\u003c/strong> = \u003ccode>TP / (TP + FN)\u003c/code>. \u003cem>Dos positivos que existiam, quantos eu peguei?\u003c/em> Denominador = \u003cstrong>a realidade\u003c/strong>. É a métrica que importa quando \u003cstrong>deixar passar um positivo custa caro\u003c/strong>: câncer não detectado, fraude que passou, falha de equipamento não prevista.\u003c/p>\n\u003cp>\u003cstrong>Especificidade (TNR)\u003c/strong> = \u003ccode>TN / (TN + FP)\u003c/code>. Recall da classe negativa. Aparece em contexto médico e é o complemento do FPR (\u003ccode>FPR = 1 - especificidade\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>F1\u003c/strong> = média harmônica de precision e recall = \u003ccode>2PR / (P + R)\u003c/code>. Usa-se média \u003cstrong>harmônica\u003c/strong> e não aritmética porque a harmônica pune desequilíbrio: com P=1.0 e R=0.0, a média aritmética daria 0.5 (parece razoável, mas o modelo é inútil) enquanto a F1 dá 0. F1 força as duas a serem decentes.\u003c/p>\n\u003cp>\u003cstrong>F-beta\u003c/strong> = \u003ccode>(1+β²)·P·R / (β²·P + R)\u003c/code>. Generaliza F1 permitindo ponderar. \u003cstrong>β &gt; 1 favorece recall\u003c/strong> (F2 é comum em medicina e fraude), \u003cstrong>β &lt; 1 favorece precision\u003c/strong> (F0.5). Regra de leitura: β é quantas vezes recall vale mais que precision. Citar F-beta em entrevista é um sinal forte, porque mostra que você entende que F1 embute a suposição — geralmente falsa — de que os dois erros custam o mesmo.\u003c/p>\n\u003ch3 id=\"h-1-4-o-trade-off-precision-recall-e-o-limiar\">1.4 O trade-off precision-recall e o limiar\u003c/h3>\n\u003cp>Ponto central e frequentemente mal compreendido: \u003cstrong>a maioria dos classificadores produz um score contínuo, não uma classe.\u003c/strong> A classe surge de comparar o score a um limiar (por padrão 0.5, que é uma convenção arbitrária, não uma escolha principiada).\u003c/p>\n\u003cp>Mover o limiar move você ao longo da curva precision-recall:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Limiar alto\u003c/strong> → o modelo só marca positivo quando está muito confiante → \u003cstrong>precision sobe, recall cai\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Limiar baixo\u003c/strong> → marca positivo facilmente → \u003cstrong>recall sobe, precision cai\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>Consequência prática que impressiona: \u003cstrong>\"melhorar precision sem perder recall\" exige um modelo melhor; só mexer no limiar apenas troca um pelo outro.\u003c/strong> Se um entrevistador diz \"a precision está baixa, o que você faz?\", a primeira resposta é \"subiria o limiar, mas isso custa recall — a pergunta certa é qual o custo relativo, e se nenhum ponto da curva é aceitável, aí sim preciso de um modelo melhor ou de features melhores.\"\u003c/p>\n\u003cp>\u003cstrong>Como escolher o limiar de forma principiada:\u003c/strong> atribua custos. Se um FN custa \u003ccode>C_FN\u003c/code> e um FP custa \u003ccode>C_FP\u003c/code>, o limiar ótimo de decisão em teoria da decisão é \u003ccode>C_FP / (C_FP + C_FN)\u003c/code>. Se um FN custa 10× um FP, o limiar ótimo é ~0.09 — bem longe de 0.5. Essa fórmula só é válida se o modelo estiver \u003cstrong>calibrado\u003c/strong> (ver 1.7), o que é uma boa deixa para o próximo assunto.\u003c/p>\n\u003ch3 id=\"h-1-5-roc-auc-vs-pr-auc-a-pergunta-que-mais-separa-candidatos\">1.5 ROC-AUC vs PR-AUC — a pergunta que mais separa candidatos\u003c/h3>\n\u003cp>\u003cstrong>Curva ROC\u003c/strong>: TPR (recall) no eixo Y contra FPR (\u003ccode>FP / (FP + TN)\u003c/code>) no eixo X, varrendo todos os limiares. \u003cstrong>ROC-AUC\u003c/strong> é a área sob ela.\u003c/p>\n\u003cp>A interpretação probabilística do AUC vale muito mais que a fórmula: \u003cstrong>AUC é a probabilidade de que um exemplo positivo escolhido aleatoriamente receba um score maior que um exemplo negativo escolhido aleatoriamente.\u003c/strong> Ou seja, AUC mede \u003cstrong>qualidade de ordenação\u003c/strong>, não qualidade de classificação. AUC = 0.5 é aleatório; AUC = 1.0 é separação perfeita; AUC &lt; 0.5 significa que o modelo está ordenando ao contrário (inverta as previsões e você tem um modelo melhor que aleatório).\u003c/p>\n\u003cp>\u003cstrong>Curva PR\u003c/strong>: precision no eixo Y contra recall no eixo X. \u003cstrong>PR-AUC\u003c/strong> (≈ \u003cem>average precision\u003c/em>) é a área sob ela.\u003c/p>\n\u003cp>\u003cstrong>A diferença crítica, e é isto que o entrevistador quer:\u003c/strong> o \u003cstrong>FPR tem TN no denominador\u003c/strong>. Quando os negativos são a esmagadora maioria, TN é gigantesco, e um número absurdo de falsos positivos mal move o FPR. Exemplo concreto: 1.000 positivos e 1.000.000 negativos. Se o modelo produz 10.000 falsos positivos, o FPR é 1% — a curva ROC continua parecendo ótima. Mas a precision é \u003ccode>1000/(1000+10000)\u003c/code> ≈ 9% — o modelo é inútil na prática, e a curva PR mostra isso imediatamente.\u003c/p>\n\u003cp>\u003cstrong>Regra:\u003c/strong> com forte desbalanceamento e quando a classe positiva rara é a que importa, \u003cstrong>use PR-AUC\u003c/strong>. ROC-AUC dá uma impressão otimista porque a métrica que ela usa no eixo X é diluída pela massa de negativos. Precision e recall \u003cstrong>ignoram TN completamente\u003c/strong>, e é exatamente por isso que servem melhor.\u003c/p>\n\u003cp>\u003cstrong>Outra diferença que vale citar:\u003c/strong> ROC-AUC é \u003cstrong>invariante à prevalência\u003c/strong> — se você reamostrar mudando a proporção de classes, o ROC-AUC não muda. PR-AUC \u003cstrong>muda\u003c/strong>. Isso é vantagem ou desvantagem conforme o que você quer: a invariância é boa para comparar o poder discriminativo do modelo entre populações com prevalências diferentes; é ruim quando você quer que a métrica reflita a realidade operacional, onde a prevalência importa muito. O baseline de um classificador aleatório em PR-AUC é a própria prevalência (0.001 no exemplo acima), enquanto em ROC-AUC é sempre 0.5.\u003c/p>\n\u003ch3 id=\"h-1-6-métricas-de-regressão\">1.6 Métricas de regressão\u003c/h3>\n\u003cp>\u003cstrong>MSE\u003c/strong> = \u003ccode>(1/n)Σ(y - ŷ)²\u003c/code>. Penaliza erros grandes quadraticamente — \u003cstrong>muito sensível a outliers\u003c/strong>. Diferenciável em todo ponto e a otimização em forma fechada existe, que é a razão histórica de ser o padrão. Interpretação estatística: minimizar MSE estima a \u003cstrong>média condicional\u003c/strong> \u003ccode>E[y|x]\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>RMSE\u003c/strong> = \u003ccode>√MSE\u003c/code>. Mesma coisa, mas na unidade da variável-alvo, o que a torna comunicável (\"erro típico de R$ 320\").\u003c/p>\n\u003cp>\u003cstrong>MAE\u003c/strong> = \u003ccode>(1/n)Σ|y - ŷ|\u003c/code>. Penaliza linearmente, \u003cstrong>robusto a outliers\u003c/strong>. Minimizar MAE estima a \u003cstrong>mediana condicional\u003c/strong>. Essa é a distinção que vale ouro em entrevista: MSE e MAE não são \"duas versões do mesmo erro\" — elas estimam \u003cstrong>estatísticas diferentes\u003c/strong> da distribuição condicional. Se sua distribuição é assimétrica, elas produzem modelos sistematicamente diferentes, e a escolha é sobre qual estatística você quer.\u003c/p>\n\u003cp>\u003cstrong>Huber loss\u003c/strong> — quadrática perto de zero, linear longe. Compromisso: robusta a outliers como MAE, mas diferenciável em zero como MSE, o que ajuda a otimização.\u003c/p>\n\u003cp>\u003cstrong>MAPE\u003c/strong> = \u003ccode>(100/n)Σ|y-ŷ|/|y|\u003c/code>. Erro percentual, atraente porque é comparável entre escalas. \u003cstrong>Três armadilhas:\u003c/strong> explode quando \u003ccode>y\u003c/code> está perto de zero, é indefinida em \u003ccode>y = 0\u003c/code>, e é \u003cstrong>assimétrica\u003c/strong> — penaliza superestimar mais que subestimar (subestimar tem erro percentual máximo de 100%, superestimar é ilimitado). Isso enviesa modelos de previsão de demanda para baixo. Alternativas: sMAPE (menos assimétrica, mas com seus próprios problemas) ou \u003cstrong>WAPE\u003c/strong> (\u003ccode>Σ|y-ŷ| / Σ|y|\u003c/code>), que é o que mais se usa em forecasting de varejo por ser robusta a zeros e refletir volume.\u003c/p>\n\u003cp>\u003cstrong>R²\u003c/strong> = \u003ccode>1 - SS_res/SS_tot\u003c/code>. Fração da variância explicada. Ler com cuidado: R² \u003cstrong>pode ser negativo\u003c/strong> em dados de teste (significa pior que prever a média), e ele \u003cstrong>nunca diminui\u003c/strong> ao adicionar features no treino — daí o R² ajustado, que penaliza número de parâmetros. R² também é enganoso entre datasets: um R² de 0.3 pode ser excelente em predição de comportamento humano e péssimo em física.\u003c/p>\n\u003cp>\u003cstrong>Nota sobre séries temporais:\u003c/strong> compare sempre com um baseline ingênuo (\u003ccode>ŷ_t = y_{t-1}\u003c/code>, ou sazonal \u003ccode>ŷ_t = y_{t-s}\u003c/code>). É espantosamente comum um modelo sofisticado não bater o \"amanhã será igual a hoje\", e é a primeira coisa que um entrevistador experiente vai perguntar. MASE é a métrica que formaliza essa comparação.\u003c/p>\n\u003ch3 id=\"h-1-7-calibração-o-diferencial\">1.7 Calibração — o diferencial\u003c/h3>\n\u003cp>Um modelo é \u003cstrong>calibrado\u003c/strong> se, entre os exemplos aos quais ele atribui score 0.7, aproximadamente 70% são de fato positivos. Isso é \u003cstrong>ortogonal à discriminação\u003c/strong>: um modelo pode ter AUC de 0.95 (ordena perfeitamente) e ser totalmente descalibrado (todos os scores comprimidos entre 0.4 e 0.6).\u003c/p>\n\u003cp>\u003cstrong>Quando calibração importa mais que ranking:\u003c/strong> sempre que o score for usado como \u003cstrong>probabilidade\u003c/strong> numa decisão a jusante — cálculo de valor esperado, precificação de risco, \u003ccode>receita_esperada = p(clique) × valor\u003c/code>, ou aplicação de limiar por custo. Se você vai multiplicar o score por um valor monetário, ele \u003cstrong>precisa\u003c/strong> ser uma probabilidade de verdade. Se você só vai ordenar (mostrar os top-10), calibração é irrelevante e AUC basta.\u003c/p>\n\u003cp>\u003cstrong>Como medir:\u003c/strong> \u003cem>reliability diagram\u003c/em> (binar os scores previstos e plotar a fração real de positivos contra o score médio do bin; a diagonal é a calibração perfeita), \u003cstrong>ECE\u003c/strong> (Expected Calibration Error — média ponderada dos desvios da diagonal) e \u003cstrong>Brier score\u003c/strong> (\u003ccode>média de (p - y)²\u003c/code> — uma \u003cem>proper scoring rule\u003c/em>, que decompõe em calibração + refinamento).\u003c/p>\n\u003cp>\u003cstrong>Como corrigir:\u003c/strong> \u003cstrong>Platt scaling\u003c/strong> (ajustar uma regressão logística sobre os scores) ou \u003cstrong>isotonic regression\u003c/strong> (ajustar uma função monótona não-paramétrica; mais flexível, precisa de mais dados, tende a overfittar com poucos). Crucial: a calibração deve ser ajustada num \u003cstrong>conjunto separado\u003c/strong>, não no treino do modelo.\u003c/p>\n\u003cp>\u003cstrong>Quem é naturalmente descalibrado:\u003c/strong> SVMs (a saída não é probabilidade nenhuma), Naive Bayes (a suposição de independência empurra scores para os extremos 0 e 1), random forests (a média de votos comprime scores na direção do centro), e redes neurais modernas — que são notoriamente \u003cstrong>superconfiantes\u003c/strong>. Regressão logística treinada com log-loss é razoavelmente calibrada por construção, porque a log-loss é uma proper scoring rule.\u003c/p>\n\u003cp>\u003cstrong>Armadilha muito boa para citar:\u003c/strong> aplicar reamostragem para desbalanceamento (SMOTE, undersampling, class weights) \u003cstrong>destrói a calibração\u003c/strong>, porque muda a prevalência que o modelo enxerga. Os scores passam a refletir a distribuição reamostrada, não a real. Se você precisa de probabilidades, ou recalibre depois, ou corrija o intercepto analiticamente.\u003c/p>\n\u003ch3 id=\"h-1-8-multiclasse-micro-macro-weighted\">1.8 Multiclasse: micro, macro, weighted\u003c/h3>\n\u003cp>Ao agregar precision/recall/F1 sobre K classes:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Macro\u003c/strong> — calcula a métrica por classe e tira a \u003cstrong>média simples\u003c/strong>. Cada classe pesa igual, \u003cstrong>independentemente do tamanho\u003c/strong>. Use quando as classes raras importam tanto quanto as frequentes. É a que mais penaliza ignorar classes minoritárias.\u003c/li>\u003cli>\u003cstrong>Weighted\u003c/strong> — média ponderada pelo suporte (nº de exemplos reais de cada classe). Dominada pelas classes grandes.\u003c/li>\u003cli>\u003cstrong>Micro\u003c/strong> — agrega TP, FP, FN globalmente e calcula uma vez. \u003cstrong>Em classificação multiclasse de rótulo único, micro-F1 = micro-precision = micro-recall = acurácia\u003c/strong>, porque cada erro é simultaneamente um FP de uma classe e um FN de outra. Saber isso é um sinal claro de domínio; reportar \"micro-F1\" achando que é diferente de acurácia é um sinal claro do contrário.\u003c/li>
