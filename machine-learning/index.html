otiva ensembles.\u003c/li>\u003cli>\u003cstrong>Não extrapola\u003c/strong> — a predição é sempre a média de folhas observadas, portanto limitada ao intervalo dos alvos vistos no treino. Uma árvore \u003cstrong>jamais\u003c/strong> prevê um valor fora da faixa de treino. Isso é decisivo em séries temporais com tendência: gradient boosting não consegue prever crescimento continuado, e é por isso que se costuma modelar diferenças ou detrend antes.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Controle de complexidade:\u003c/strong> profundidade máxima, mínimo de amostras por folha/split, número máximo de folhas, e \u003cstrong>cost-complexity pruning\u003c/strong> (crescer completa e podar depois, penalizando o número de folhas). Podar depois é geralmente melhor que parar cedo, porque um split ruim pode habilitar um split ótimo abaixo dele — o critério guloso não enxerga isso.\u003c/p>\n\u003ch3 id=\"h-1-4-ensembles-bagging-vs-boosting\">1.4 Ensembles: bagging vs boosting\u003c/h3>\n\u003cp>\u003cstrong>Bagging (Bootstrap Aggregating):\u003c/strong> treinar M modelos em amostras bootstrap dos dados e agregar (média/voto). Reduz \u003cstrong>variância\u003c/strong> sem alterar muito o bias. A matemática que sustenta: se você faz a média de M variáveis com variância \u003ccode>σ²\u003c/code> e correlação par-a-par \u003ccode>ρ\u003c/code>, a variância da média é \u003ccode>ρσ² + (1-ρ)σ²/M\u003c/code>. O segundo termo some com M grande; \u003cstrong>o primeiro termo, \u003ccode>ρσ²\u003c/code>, é o piso\u003c/strong>. Ou seja, \u003cstrong>a correlação entre os modelos é o que limita o ganho\u003c/strong> — daí toda a engenharia de descorrelação. Modelos-base devem ser de baixo bias e alta variância (árvores profundas). Paralelizável.\u003c/p>\n\u003cp>\u003cstrong>Random Forest\u003c/strong> = bagging de árvores + \u003cstrong>amostragem aleatória de features em cada split\u003c/strong>. Essa segunda parte é o insight central: sem ela, todas as árvores escolheriam a mesma feature dominante na raiz e ficariam altamente correlacionadas, e a média não reduziria quase nada. Ao forçar cada split a considerar só um subconjunto aleatório (tipicamente \u003ccode>√p\u003c/code> para classificação, \u003ccode>p/3\u003c/code> para regressão), as árvores ficam individualmente piores e coletivamente muito melhores. \u003cstrong>Explicar isso é a resposta que distingue quem entende de quem decorou.\u003c/strong>\u003c/p>\n\u003cp>Bônus da RF: \u003cstrong>erro OOB (out-of-bag)\u003c/strong> — cada árvore não vê ~37% dos dados (a probabilidade de um exemplo não ser sorteado em n tentativas com reposição é \u003ccode>(1-1/n)^n → 1/e ≈ 0.368\u003c/code>), o que dá uma estimativa de validação praticamente de graça.\u003c/p>\n\u003cp>\u003cstrong>Boosting:\u003c/strong> treinar modelos \u003cstrong>sequencialmente\u003c/strong>, cada um corrigindo os erros do anterior. Reduz principalmente \u003cstrong>bias\u003c/strong>, somando aprendizes fracos (árvores rasas) numa função forte. Não paralelizável entre árvores (embora a construção de cada árvore seja paralelizável). \u003cstrong>Pode overfittar\u003c/strong> se você adicionar árvores demais — ao contrário da random forest, onde adicionar árvores nunca piora, só converge.\u003c/p>\n\u003cp>\u003cstrong>Gradient Boosting:\u003c/strong> formaliza boosting como \u003cstrong>gradiente descendente no espaço de funções\u003c/strong>. A cada iteração, ajusta-se uma árvore ao \u003cstrong>gradiente negativo da perda\u003c/strong> em relação às predições atuais (os \"pseudo-resíduos\") e soma-se essa árvore ao modelo com um fator de encolhimento (learning rate). Para MSE, o gradiente negativo é literalmente o resíduo \u003ccode>y - ŷ\u003c/code>, e é daí que vem a intuição \"cada árvore aprende o erro da anterior\" — mas a formulação geral funciona para \u003cstrong>qualquer perda diferenciável\u003c/strong>, o que é o que torna o método tão versátil (log-loss, Huber, ranking, Poisson, quantílica).\u003c/p>\n\u003ch3 id=\"h-1-5-xgboost-lightgbm-catboost\">1.5 XGBoost, LightGBM, CatBoost\u003c/h3>\n\u003cp>Todos são implementações de gradient boosting em árvores. As diferenças:\u003c/p>\n\u003cp>\u003cstrong>XGBoost\u003c/strong> — o que o tornou dominante: \u003cstrong>regularização explícita na função objetivo\u003c/strong> (penaliza o número de folhas e a norma L2 dos valores das folhas), uso da \u003cstrong>segunda derivada\u003c/strong> (aproximação de Newton, não só o gradiente), tratamento nativo de missing values aprendendo uma direção padrão por split, e uma implementação altamente otimizada. Cresce árvores \u003cstrong>level-wise\u003c/strong> (por nível) por padrão, o que produz árvores balanceadas e regularização mais uniforme. Versões recentes suportam categóricas nativamente e crescimento leaf-wise opcional (\u003ccode>grow_policy='lossguide'\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>LightGBM\u003c/strong> — otimizado para velocidade em datasets grandes. Duas ideias principais: \u003cstrong>crescimento leaf-wise\u003c/strong> (best-first — expande sempre a folha de maior ganho, em vez de nível a nível), o que atinge menor perda com menos folhas mas produz árvores desbalanceadas e \u003cstrong>overfitta mais facilmente em datasets pequenos\u003c/strong> (daí a importância de \u003ccode>num_leaves\u003c/code> e \u003ccode>min_data_in_leaf\u003c/code>); e \u003cstrong>histogram-based splitting\u003c/strong>, que discretiza features contínuas em bins, reduzindo drasticamente o custo de encontrar splits. Também tem \u003cstrong>suporte nativo a categóricas\u003c/strong> com um algoritmo de particionamento de categorias, embora com cardinalidade muito alta ele fique lento e valha agrupar categorias raras. Regra prática: \u003cstrong>LightGBM para dados grandes, XGBoost quando o dataset é menor e a estabilidade importa mais que velocidade.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>CatBoost\u003c/strong> — foco em features categóricas e em evitar um viés sutil. Usa \u003cstrong>ordered target statistics\u003c/strong>: o target encoding de cada linha é calculado usando apenas linhas \"anteriores\" numa permutação aleatória, o que evita que o encoding de uma linha use o próprio rótulo dela — um leakage sutil que infla o treino. Também usa \u003cstrong>oblivious trees\u003c/strong> (mesma condição de split em todo um nível), que são mais rápidas na inferência e agem como regularização. Costuma ser o mais forte \"out of the box\" com muitas categóricas de alta cardinalidade.\u003c/p>\n\u003cp>\u003cstrong>A resposta honesta em 2026:\u003c/strong> a diferença de acurácia entre os três é pequena na maioria dos problemas reais, e \u003cstrong>feature engineering e validação correta importam muito mais que a escolha da biblioteca\u003c/strong>. Dizer isso numa entrevista é mais forte que defender apaixonadamente uma delas.\u003c/p>\n\u003cp>\u003cstrong>Hiperparâmetros que realmente importam\u003c/strong> (por ordem de impacto): \u003ccode>learning_rate\u003c/code> (menor = melhor, com mais árvores; a dupla \u003ccode>learning_rate\u003c/code> + \u003ccode>n_estimators\u003c/code> é o eixo principal), profundidade / \u003ccode>num_leaves\u003c/code>, \u003ccode>min_child_weight\u003c/code> / \u003ccode>min_data_in_leaf\u003c/code>, \u003ccode>subsample\u003c/code> e \u003ccode>colsample_bytree\u003c/code> (estocasticidade que regulariza), e as penalidades L1/L2. \u003cstrong>Early stopping em um conjunto de validação\u003c/strong> é o mecanismo prático que define \u003ccode>n_estimators\u003c/code> e é obrigatório.\u003c/p>\n\u003ch3 id=\"h-1-6-svm\">1.6 SVM\u003c/h3>\n\u003cp>Encontra o hiperplano que \u003cstrong>maximiza a margem\u003c/strong> — a distância aos pontos mais próximos de cada classe. A intuição: entre infinitos separadores possíveis, o de margem máxima é o mais \"seguro\", porque é o que mais tolera perturbação nos dados antes de errar. A teoria de generalização associa margem grande a menor risco esperado.\u003c/p>\n\u003cp>\u003cstrong>Soft margin (C):\u003c/strong> dados reais não são separáveis, então permite-se violação com penalidade. \u003ccode>C\u003c/code> controla o trade-off: \u003cstrong>C alto\u003c/strong> = pouca tolerância a erro = margem estreita = \u003cstrong>mais overfitting\u003c/strong>; \u003cstrong>C baixo\u003c/strong> = mais tolerância = margem larga = mais regularização. \u003ccode>C\u003c/code> é essencialmente o inverso da força de regularização.\u003c/p>\n\u003cp>\u003cstrong>Kernel trick:\u003c/strong> o problema dual depende dos dados \u003cstrong>apenas por produtos internos\u003c/strong> \u003ccode>x_i · x_j\u003c/code>. Substituindo o produto interno por uma função kernel \u003ccode>K(x_i, x_j)\u003c/code>, você opera implicitamente num espaço de alta dimensão \u003cstrong>sem nunca calcular as coordenadas nesse espaço\u003c/strong>. O RBF corresponde a um espaço de dimensão infinita. Entender que o truque é \"produto interno em outro espaço, calculado barato\" — e não \"projetar os dados\" — é o que se está avaliando.\u003c/p>\n\u003cp>Kernels: linear (texto de alta dimensão, dados já separáveis), polinomial, \u003cstrong>RBF\u003c/strong> (\u003ccode>exp(-γ||x-x'||²)\u003c/code>, o padrão para não-linearidade). \u003ccode>γ\u003c/code> controla o alcance de influência de cada ponto: \u003cstrong>γ alto\u003c/strong> = influência local = fronteiras muito flexíveis = overfitting; \u003cstrong>γ baixo\u003c/strong> = suave, aproximando o linear. \u003ccode>C\u003c/code> e \u003ccode>γ\u003c/code> interagem e devem ser ajustados juntos.\u003c/p>\n\u003cp>\u003cstrong>Vetores de suporte\u003c/strong> são os pontos na margem ou violando-a. \u003cstrong>Só eles definem a solução\u003c/strong> — remover qualquer outro ponto não muda nada. Isso torna SVM eficiente em memória na predição, mas também frágil: os pontos que definem o modelo são os mais próximos da fronteira, ou seja, potencialmente os mais ruidosos.\u003c/p>\n\u003cp>\u003cstrong>Quando SVM ainda vale (2026):\u003c/strong> datasets pequenos a médios (até ~dezenas de milhares) com muitas features, especialmente \u003ccode>p &amp;gt; n\u003c/code> (texto, bioinformática). \u003cstrong>Quando não vale:\u003c/strong> datasets grandes — o treino é entre \u003ccode>O(n²)\u003c/code> e \u003ccode>O(n³)\u003c/code>, o que o torna proibitivo; quando você precisa de probabilidades (SVM produz distâncias, não probabilidades; o Platt scaling do \u003ccode>probability=True\u003c/code> é um remendo caro); e em dados tabulares heterogêneos, onde gradient boosting é melhor e mais fácil. SVM perdeu espaço, mas continua sendo pergunta de entrevista pela riqueza conceitual (margem, dual, kernel).\u003c/p>\n\u003ch3 id=\"h-1-7-knn\">1.7 kNN\u003c/h3>\n\u003cp>Sem treino: guarda os dados e, na predição, encontra os k vizinhos mais próximos e agrega (voto ou média). É o exemplo canônico de aprendizado \u003cstrong>preguiçoso\u003c/strong> (lazy) e \u003cstrong>não-paramétrico\u003c/strong> — a complexidade do modelo cresce com os dados.\u003c/p>\n\u003cp>\u003cstrong>k controla o bias-variance de forma pura:\u003c/strong> \u003ccode>k=1\u003c/code> tem erro de treino zero e variância máxima (a fronteira contorna cada ponto, inclusive ruído); \u003ccode>k\u003c/code> grande suaviza, aumentando bias; \u003ccode>k = n\u003c/code> prevê sempre a classe majoritária (bias total).\u003c/p>\n\u003cp>\u003cstrong>O que quebra o kNN:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Escalonamento é obrigatório.\u003c/strong> A distância é dominada pela feature de maior amplitude numérica. Salário em reais versus idade em anos: o salário determina tudo.\u003c/li>\u003cli>\u003cstrong>Curse of dimensionality.\u003c/strong> Em alta dimensão, todas as distâncias convergem para valores parecidos, e \"vizinho mais próximo\" deixa de ser um conceito significativo. É o algoritmo mais afetado por isso.\u003c/li>\u003cli>\u003cstrong>Custo de predição \u003ccode>O(n·p)\u003c/code> por consulta.\u003c/strong> Escala mal. Mitigações: KD-tree/Ball-tree (que degradam para busca linear acima de ~20 dimensões) ou \u003cstrong>ANN\u003c/strong> — HNSW, IVF, produto quantizado — que é exatamente a tecnologia por trás dos bancos de dados vetoriais usados em RAG. Essa conexão é ótima de fazer numa entrevista moderna: \u003cstrong>busca vetorial em RAG é kNN aproximado sobre embeddings\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Features irrelevantes envenenam a distância\u003c/strong>, porque contribuem ruído para a métrica sem contribuir sinal.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-8-naive-bayes\">1.8 Naive Bayes\u003c/h3>\n\u003cp>Aplica o teorema de Bayes com a suposição \"ingênua\" de que as features são \u003cstrong>condicionalmente independentes dado a classe\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode>P(y|x₁...xₚ) ∝ P(y) · Π P(xⱼ|y)\u003c/code>\u003c/pre>\n\u003cp>A suposição é quase sempre falsa (em texto, \"nova\" e \"york\" não são independentes). Mesmo assim funciona surpreendentemente bem para \u003cstrong>classificação\u003c/strong>, e a razão é importante: para classificar, você só precisa que a \u003cstrong>ordenação\u003c/strong> das probabilidades entre classes esteja correta, não que os valores estejam. A violação da independência distorce as magnitudes — empurrando as probabilidades para 0 e 1, tornando o modelo \u003cstrong>muito descalibrado\u003c/strong> — mas frequentemente preserva qual classe é a maior. Então \u003cstrong>Naive Bayes é um classificador decente e um estimador de probabilidade ruim\u003c/strong>. Essa distinção é uma resposta 🔴 excelente.\u003c/p>\n\u003cp>Variantes: \u003cstrong>Multinomial\u003c/strong> (contagens, texto), \u003cstrong>Bernoulli\u003c/strong> (presença/ausência), \u003cstrong>Gaussiano\u003c/strong> (features contínuas, assumindo normalidade por classe).\u003c/p>\n\u003cp>\u003cstrong>Suavização de Laplace\u003c/strong> é essencial: sem ela, uma palavra nunca vista numa classe dá \u003ccode>P(x|y) = 0\u003c/code> e zera o produto inteiro — um único termo desconhecido veta a classe. Somar 1 (ou α) a todas as contagens evita isso.\u003c/p>\n\u003cp>\u003cstrong>Detalhe de implementação que vale saber:\u003c/strong> calcula-se em \u003cstrong>log\u003c/strong> (\u003ccode>log P(y) + Σ log P(xⱼ|y)\u003c/code>), porque o produto de milhares de probabilidades pequenas causa underflow numérico.\u003c/p>\n\u003cp>\u003cstrong>Quando usar:\u003c/strong> baseline rapidíssimo em classificação de texto, datasets muito pequenos (a forte suposição age como regularização brutal, o que ajuda quando não há dados para estimar dependências), e situações que exigem treino em tempo real com atualização incremental trivial.\u003c/p>\n\u003ch3 id=\"h-1-9-tabela-de-decisão\">1.9 Tabela de decisão\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Modelo\u003c/th>\u003cth>Bias\u003c/th>\u003cth>Variância\u003c/th>\u003cth>Escalonar?\u003c/th>\u003cth>Interpretável\u003c/th>\u003cth>Escala (n grande)\u003c/th>\u003cth>Melhor uso\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Regressão linear/logística\u003c/td>\u003ctd>Alto\u003c/td>\u003ctd>Baixa\u003c/td>\u003ctd>\u003cstrong>Sim\u003c/strong> (com reg.)\u003c/td>\u003ctd>Alta\u003c/td>\u003ctd>Excelente\u003c/td>\u003ctd>Baseline, interpretabilidade, regulação\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Árvore de decisão\u003c/td>\u003ctd>Baixo\u003c/td>\u003ctd>\u003cstrong>Alta\u003c/strong>\u003c/td>\u003ctd>Não\u003c/td>\u003ctd>Alta (se rasa)\u003c/td>\u003ctd>Boa\u003c/td>\u003ctd>Regras explicáveis, baseline não-linear\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Random Forest\u003c/td>\u003ctd>Baixo\u003c/td>\u003ctd>Média\u003c/td>\u003ctd>Não\u003c/td>\u003ctd>Média\u003c/td>\u003ctd>Boa\u003c/td>\u003ctd>Padrão robusto, pouco tuning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gradient Boosting\u003c/td>\u003ctd>Baixo\u003c/td>\u003ctd>Média-alta\u003c/td>\u003ctd>Não\u003c/td>\u003ctd>Média\u003c/td>\u003ctd>Boa\u003c/td>\u003ctd>\u003cstrong>Padrão vencedor em tabular\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SVM (RBF)\u003c/td>\u003ctd>Baixo\u003c/td>\u003ctd>Média\u003c/td>\u003ctd>\u003cstrong>Sim\u003c/strong>\u003c/td>\u003ctd>Baixa\u003c/td>\u003ctd>Ruim (O(n²–n³))\u003c/td>\u003ctd>p &gt; n, datasets pequenos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>kNN\u003c/td>\u003ctd>Baixo (k pequeno)\u003c/td>\u003ctd>Alta\u003c/td>\u003ctd>\u003cstrong>Sim\u003c/strong>\u003c/td>\u003ctd>Média\u003c/td>\u003ctd>Ruim na predição\u003c/td>\u003ctd>Baseline, poucos dados, busca por similaridade\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Naive Bayes\u003c/td>\u003ctd>Alto\u003c/td>\u003ctd>Baixa\u003c/td>\u003ctd>Não\u003c/td>\u003ctd>Média\u003c/td>\u003ctd>Excelente\u003c/td>\u003ctd>Texto, baseline instantâneo\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Dizer que os coeficientes da logística são mudanças em probabilidade.\u003c/strong> São em log-odds; \u003ccode>exp(w)\u003c/code> é razão de chances.\u003c/p>\n\u003cp>\u003cstrong>Escalonar para árvores, não escalonar para SVM/kNN.\u003c/strong> Exatamente ao contrário do necessário. Árvores são invariantes à escala; SVM e kNN dependem de distância e quebram sem escalonamento.\u003c/p>\n\u003cp>\u003cstrong>Achar que random forest é só \"várias árvores\".\u003c/strong> A amostragem de features em cada split é o mecanismo essencial; sem descorrelação, a média não reduz variância.\u003c/p>\n\u003cp>\u003cstrong>Dizer que boosting não overfitta.\u003c/strong> Overfitta com árvores demais. Early stopping é obrigatório.\u003c/p>\n\u003cp>\u003cstrong>Achar que gradient boosting só funciona com MSE.\u003c/strong> Funciona com qualquer perda diferenciável — é o ponto da formulação por gradiente.\u003c/p>\n\u003cp>\u003cstrong>Esquecer que árvores não extrapolam.\u003c/strong> Fatal em séries com tendência: o modelo nunca prevê acima do máximo visto no treino.\u003c/p>\n\u003cp>\u003cstrong>Confundir importância de features com causalidade.\u003c/strong> SHAP e importâncias explicam o modelo, não o mundo.\u003c/p>\n\u003cp>\u003cstrong>Usar split count como importância.\u003c/strong> Enviesa para features de alta cardinalidade.\u003c/p>\n\u003cp>\u003cstrong>Usar SVM em dataset grande.\u003c/strong> O(n²–n³) torna inviável.\u003c/p>\n\u003cp>\u003cstrong>Achar que as probabilidades do Naive Bayes são confiáveis.\u003c/strong> São sistematicamente extremas por conta da violação de independência.\u003c/p>\n\u003cp>\u003cstrong>Não rodar um baseline linear.\u003c/strong> Sem ele você não sabe quanto sua complexidade comprou, e essa é a primeira pergunta de qualquer entrevistador experiente.\u003c/p>\n\u003cp>\u003cstrong>Escolher biblioteca por preferência pessoal e defendê-la com fervor.\u003c/strong> A resposta madura é que a diferença entre XGBoost, LightGBM e CatBoost é pequena e a decisão é empírica.\u003c/p>\n\u003cp>\u003cstrong>Deixar \u003ccode>n_estimators\u003c/code> fixo sem early stopping.\u003c/strong> É o hiperparâmetro que menos deveria ser chutado, porque a validação define ele diretamente.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Qual a diferença entre regressão linear e logística?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Linear prevê um valor contínuo e não tem restrição de faixa; logística prevê a probabilidade de uma classe e restringe a saída a [0,1] aplicando a sigmoide ao mesmo preditor linear. A logística é, na verdade, linear na \u003cstrong>log-odds\u003c/strong>: \u003ccode>log(p/(1-p)) = w·x + b\u003c/code>.\u003c/p>\n\u003cp>Elas também usam perdas diferentes: linear usa erro quadrático, logística usa log-loss, que é a verossimilhança negativa sob Bernoulli. Isso não é arbitrário — usar MSE com a sigmoide torna o problema não-convexo e satura o gradiente quando o modelo está confiante e errado, o que trava o aprendizado justo quando ele mais precisaria corrigir.\u003c/p>\n\u003cp>\u003cstrong>Follow-up quase garantido:\u003c/strong> \u003cem>\"O que significa um coeficiente de 0.5 na logística?\"\u003c/em> — Que um aumento de uma unidade naquela feature aumenta a log-odds em 0.5, ou seja, multiplica a \u003cstrong>razão de chances\u003c/strong> por \u003ccode>e^0.5 ≈ 1.65\u003c/code>, um aumento de 65% nas chances. \u003cstrong>Não\u003c/strong> é um aumento de 0.5 na probabilidade — o efeito sobre a probabilidade depende de onde você está na curva, sendo máximo perto de 0.5 e quase nulo nos extremos.\u003c/p>"},{"titleHtml":"🟢 O que é uma árvore de decisão e qual sua principal fraqueza?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Particiona o espaço recursivamente, escolhendo a cada nó o corte que mais reduz impureza — Gini ou entropia em classificação, variância em regressão. A predição é a estatística da folha em que o exemplo cai.\u003c/p>\n\u003cp>A principal fraqueza é \u003cstrong>alta variância\u003c/strong>: uma pequena mudança nos dados pode alterar o split da raiz, e isso cascateia mudando a árvore inteira. Por isso árvores isoladas raramente são usadas para predição — usam-se ensembles, que existem exatamente para atacar essa variância.\u003c/p>\n\u003cp>Uma segunda limitação estrutural é que as fronteiras são paralelas aos eixos, então uma fronteira diagonal exige uma escada de muitos splits para ser aproximada. E uma terceira, muito importante na prática: \u003cstrong>árvores não extrapolam\u003c/strong> — a predição é sempre a média de valores vistos, então nunca sai da faixa de alvos do treino.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Preciso escalonar features para uma árvore?\"\u003c/em> — Não. A árvore só usa a ordem dos valores para escolher pontos de corte, então é invariante a qualquer transformação monótona. Isso também significa que aplicar log numa feature não muda nada numa árvore, ao contrário do que acontece num modelo linear.\u003c/p>"},{"titleHtml":"🟡 Explique a diferença entre bagging e boosting.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Bagging treina modelos \u003cstrong>em paralelo\u003c/strong> em amostras bootstrap e agrega por média ou voto. Ele reduz \u003cstrong>variância\u003c/strong> — a média de modelos ruidosos e descorrelacionados é mais estável que qualquer um deles. Por isso os modelos-base devem ser de baixa polarização e alta variância: árvores profundas.\u003c/p>\n\u003cp>Boosting treina modelos \u003cstrong>sequencialmente\u003c/strong>, cada um focando nos erros do anterior, e soma-os. Ele reduz principalmente \u003cstrong>bias\u003c/strong> — parte de aprendizes fracos, árvores rasas, e os compõe numa função forte.\u003c/p>\n\u003cp>Três consequências práticas. Bagging é paralelizável e boosting não é (entre árvores). Boosting geralmente atinge acurácia maior mas é mais sensível a hiperparâmetros e a ruído. E \u003cstrong>boosting pode overfittar com árvores demais\u003c/strong>, enquanto adicionar árvores a uma random forest nunca piora — só converge.\u003c/p>\n\u003cp>\u003cstrong>Follow-up quase garantido:\u003c/strong> \u003cem>\"Por que a random forest amostra features em cada split, além do bootstrap?\"\u003c/em> — Para \u003cstrong>descorrelacionar as árvores\u003c/strong>. A variância da média de M modelos com correlação ρ é \u003ccode>ρσ² + (1-ρ)σ²/M\u003c/code>: o segundo termo desaparece com M grande, mas o primeiro, \u003ccode>ρσ²\u003c/code>, é um piso que só cai reduzindo a correlação. Só com bootstrap, todas as árvores escolheriam a mesma feature dominante na raiz e ficariam muito parecidas, então a média não ganharia quase nada. Ao restringir cada split a um subconjunto aleatório de features, cada árvore fica individualmente pior e o conjunto fica muito melhor.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"O que é o erro OOB?\"\u003c/em> — Cada árvore bootstrap não vê cerca de 37% dos dados, porque a chance de um exemplo nunca ser sorteado em n tentativas com reposição tende a 1/e. Avaliar cada exemplo apenas nas árvores que não o viram dá uma estimativa de validação essencialmente de graça, sem precisar de CV.\u003c/p>"},{"titleHtml":"🟡 Como o gradient boosting funciona? Por que ele geralmente vence em dados tabulares?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Gradient boosting é gradiente descendente no \u003cstrong>espaço de funções\u003c/strong>. Você começa com uma predição constante e, a cada iteração, calcula o gradiente negativo da perda em relação às predições atuais — os pseudo-resíduos — ajusta uma árvore rasa a esses pseudo-resíduos e a soma ao modelo, multiplicada por um learning rate pequeno. Para erro quadrático, o gradiente negativo é literalmente o resíduo, e é daí que vem a intuição de \"cada árvore aprende o erro da anterior\"; mas a formulação geral vale para qualquer perda diferenciável, o que é o que dá versatilidade ao método.\u003c/p>\n\u003cp>Ele vence em tabular por várias razões combinadas. \u003cstrong>Captura interações automaticamente\u003c/strong> — cada caminho da árvore é uma conjunção de condições, sem precisar especificar nada. \u003cstrong>Lida naturalmente com features heterogêneas\u003c/strong> — escalas diferentes, categóricas, distribuições assimétricas, sem pré-processamento. \u003cstrong>É invariante a transformações monótonas.\u003c/strong> \u003cstrong>Trata missing values nativamente.\u003c/strong> E — o ponto de fundo — dados tabulares \u003cstrong>não têm a estrutura composicional\u003c/strong> (localidade, invariância a translação) que redes profundas foram feitas para explorar; as features já são semanticamente significativas, então não há hierarquia de representações a descobrir.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Quais hiperparâmetros importam mais?\"\u003c/em> — \u003ccode>learning_rate\u003c/code> junto com o número de árvores é o eixo principal: learning rate menor com mais árvores costuma generalizar melhor, e eu deixo o número de árvores ser definido por early stopping numa validação. Depois, profundidade ou \u003ccode>num_leaves\u003c/code>, o mínimo de amostras por folha, e a estocasticidade (\u003ccode>subsample\u003c/code>, \u003ccode>colsample_bytree\u003c/code>), que regulariza. As penalidades L1/L2 explícitas são ajuste fino.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"Gradient boosting overfitta?\"\u003c/em> — Sim, e de duas formas. Com árvores demais, porque cada uma continua reduzindo o erro de treino indefinidamente — early stopping resolve. E com árvores profundas demais, que capturam ruído. É a diferença fundamental para random forest, onde mais árvores nunca piora. É também por isso que boosting é mais sensível a rótulos ruidosos: ele foca sequencialmente nos exemplos mal-classificados, e se esses são erros de rotulagem, ele os persegue ativamente.\u003c/p>"},{"titleHtml":"🟡 XGBoost, LightGBM e CatBoost: quais as diferenças e quando usar cada um?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Os três são gradient boosting em árvores, e a diferença de acurácia entre eles é pequena na maioria dos problemas reais — feature engineering e validação correta importam muito mais.\u003c/p>\n\u003cp>\u003cstrong>XGBoost\u003c/strong> popularizou a regularização explícita no objetivo, penalizando número de folhas e a norma dos valores das folhas, e usa a segunda derivada da perda numa aproximação tipo Newton. Cresce árvores \u003cstrong>level-wise\u003c/strong> por padrão, o que dá árvores balanceadas e regularização mais uniforme.\u003c/p>\n\u003cp>\u003cstrong>LightGBM\u003c/strong> é otimizado para velocidade com duas ideias: crescimento \u003cstrong>leaf-wise\u003c/strong>, que expande sempre a folha de maior ganho e atinge menor perda com menos folhas, e splitting baseado em histogramas, que discretiza features contínuas em bins. O custo é que leaf-wise \u003cstrong>overfitta mais facilmente em datasets pequenos\u003c/strong>, então \u003ccode>num_leaves\u003c/code> e o mínimo de dados por folha precisam ser controlados. Também tem suporte nativo a categóricas.\u003c/p>\n\u003cp>\u003cstrong>CatBoost\u003c/strong> foca em categóricas com \u003cem>ordered target statistics\u003c/em>, que calcula o encoding de cada linha usando apenas linhas anteriores numa permutação — isso evita um leakage sutil em que o rótulo da própria linha entra no encoding dela. Usa árvores obliviosas, que são rápidas na inferência e funcionam como regularização.\u003c/p>\n\u003cp>Na prática: \u003cstrong>LightGBM quando o dataset é grande e velocidade importa; CatBoost quando há muitas categóricas de alta cardinalidade; XGBoost quando o dataset é menor e eu prefiro estabilidade e árvores balanceadas.\u003c/strong> Eu testaria dois deles com early stopping e escolheria pelo resultado na validação, sem religião.\u003c/p>"},{"titleHtml":"🟡 Explique o kernel trick.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> A formulação dual do SVM depende dos dados \u003cstrong>apenas através de produtos internos\u003c/strong> entre pares de pontos. Isso permite substituir o produto interno por uma função kernel \u003ccode>K(x, x')\u003c/code>, que corresponde ao produto interno num espaço de features de maior dimensão — \u003cstrong>sem nunca calcular as coordenadas naquele espaço\u003c/strong>. É isso que é o truque: você obtém o poder de um espaço de alta dimensão pagando o custo de uma função de dois vetores no espaço original.\u003c/p>\n\u003cp>O RBF, \u003ccode>exp(-γ||x-x'||²)\u003c/code>, corresponde a um espaço de dimensão infinita, o que seria impossível de computar explicitamente. O parâmetro γ controla o alcance da influência de cada ponto: γ alto torna a influência muito local e as fronteiras muito flexíveis, levando a overfitting; γ baixo suaviza e aproxima o comportamento linear. γ e C interagem e precisam ser ajustados juntos.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Por que SVM não é mais tão usado?\"\u003c/em> — Escala. O treino é entre O(n²) e O(n³), o que é proibitivo com centenas de milhares de exemplos. Além disso, não produz probabilidades diretamente, e em dados tabulares gradient boosting é melhor e requer menos cuidado com escalonamento. SVM continua bom em regimes com muitas features e poucas amostras, como texto ou bioinformática.\u003c/p>\n\u003cp>\u003cstrong>Pegadinha:\u003c/strong> \u003cem>\"É obrigatório escalonar para SVM?\"\u003c/em> — Sim. O RBF depende de distância euclidiana e o kernel linear é afetado pela magnitude relativa dos coeficientes penalizados. Sem escalonar, features de maior amplitude dominam. É um dos erros mais comuns com SVM.\u003c/p>"},{"titleHtml":"🟡 Quando você usaria regressão logística em vez de gradient boosting?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Vários cenários concretos.\u003c/p>\n\u003cp>\u003cstrong>Quando interpretabilidade é requisito, não preferência\u003c/strong> — crédito, seguros, saúde, contextos com exigência regulatória de explicar decisões individualmente. Coeficientes como razões de chances são auditáveis de um jeito que SHAP não é.\u003c/p>\n\u003cp>\u003cstrong>Quando os dados são poucos\u003c/strong> — com centenas de exemplos, um modelo linear regularizado generaliza melhor e é muito mais estável.\u003c/p>\n\u003cp>\u003cstrong>Quando preciso de probabilidades bem calibradas\u003c/strong> — a logística é calibrada por construção porque a log-loss é uma proper scoring rule.\u003c/p>\n\u003cp>\u003cstrong>Quando a relação é aproximadamente linear\u003c/strong> — se a logística já captura o sinal, o boosting não vai adicionar quase nada e custa muito mais.\u003c/p>\n\u003cp>\u003cstrong>Quando latência e simplicidade operacional importam\u003c/strong> — a inferência é um produto escalar; o modelo é um vetor de coeficientes, versionável, auditável e trivial de servir em qualquer stack.\u003c/p>\n\u003cp>E, sempre: \u003cstrong>como baseline obrigatório\u003c/strong>. Se meu boosting supera a logística em 1 ponto de AUC, o modelo certo para produzir é quase sempre a logística, porque a diferença não paga a complexidade operacional. Não conhecer esse número é não saber se a complexidade se justifica.\u003c/p>"},{"titleHtml":"🔴 Por que redes neurais raramente superam gradient boosting em dados tabulares?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Algumas razões que se somam.\u003c/p>\n\u003cp>\u003cstrong>Ausência de estrutura para explorar.\u003c/strong> O sucesso de redes profundas vem de vieses indutivos alinhados à estrutura dos dados: convolução assume localidade e invariância a translação, atenção assume relações contextuais entre tokens. Dados tabulares não têm estrutura espacial nem sequencial; a ordem das colunas é arbitrária. Uma MLP tem viés indutivo fraco e precisa aprender tudo dos dados.\u003c/p>\n\u003cp>\u003cstrong>Heterogeneidade das features.\u003c/strong> Tabular mistura escalas, tipos, categóricas de alta cardinalidade, distribuições assimétricas e muitos missing. Árvores lidam com isso nativamente e são invariantes a transformações monótonas; redes exigem normalização cuidadosa e sofrem com features de cauda pesada.\u003c/p>\n\u003cp>\u003cstrong>Fronteiras irregulares e não-suaves.\u003c/strong> Redes têm viés para funções suaves; tabular frequentemente tem descontinuidades reais (regras de negócio, faixas de preço, limiares regulatórios), que árvores modelam com um split e redes aproximam mal.\u003c/p>\n\u003cp>\u003cstrong>Regime de dados.\u003c/strong> A maioria dos problemas tabulares tem milhares a milhões de linhas, não bilhões. Redes precisam de muito mais dados para compensar o viés indutivo fraco.\u003c/p>\n\u003cp>\u003cstrong>Custo de tuning.\u003c/strong> Boosting funciona bem perto do default; redes exigem escolhas de arquitetura, otimizador, schedule e normalização, então na prática comparações justas por orçamento de tuning favorecem boosting.\u003c/p>\n\u003cp>\u003cstrong>A nuance honesta:\u003c/strong> em datasets tabulares muito grandes, com muitas categóricas de alta cardinalidade, ou quando é preciso integrar tabular com texto/imagem num único modelo, arquiteturas neurais competem e às vezes vencem. Mas para o caso tabular puro e mediano, boosting continua sendo o padrão razoável, e isso é consistente com o que benchmarks independentes vêm mostrando.\u003c/p>"},{"titleHtml":"🔴 Como você interpreta um modelo de gradient boosting?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Em camadas, e a chave é saber o que cada ferramenta responde e o que ela não responde.\u003c/p>\n\u003cp>\u003cstrong>Importância de features nativa\u003c/strong> — cuidado, é ambígua e frequentemente enganosa. \"Gain\" (redução total de perda atribuída à feature) é a mais defensável; \"split count\" enviesa para features de alta cardinalidade, porque elas oferecem mais pontos de corte possíveis; \"cover\" é raramente útil. Nenhuma delas indica \u003cstrong>direção\u003c/strong> do efeito, e todas dividem crédito arbitrariamente entre features correlacionadas.\u003c/p>\n\u003cp>\u003cstrong>Permutation importance\u003c/strong> — embaralha uma feature e mede a queda na métrica de validação. Vantagem: mede impacto no desempenho real, não na estrutura interna. Desvantagem: com features correlacionadas, embaralhar uma cria pontos impossíveis no espaço de features e subestima a importância de ambas (o modelo compensa com a correlacionada).\u003c/p>\n\u003cp>\u003cstrong>SHAP\u003c/strong> — a ferramenta principal. Atribui a cada feature a contribuição para a predição \u003cstrong>daquele exemplo\u003c/strong>, com garantias teóricas de aditividade e consistência derivadas de valores de Shapley. Dá tanto explicação local (por que este cliente foi negado) quanto global (agregando magnitudes). O TreeSHAP é exato e rápido em modelos de árvore.\u003c/p>\n\u003cp>\u003cstrong>PDP e ICE\u003c/strong> — mostram o efeito marginal de uma feature no intervalo de valores. PDP é a média (e pode esconder heterogeneidade: se metade dos casos sobe e metade desce, a média é plana); ICE mostra curvas individuais e revela essa heterogeneidade.\u003c/p>\n\u003cp>\u003cstrong>O caveat que eu enunciaria explicitamente:\u003c/strong> tudo isso é \u003cstrong>associação, não causalidade\u003c/strong>. SHAP explica o que o modelo faz, não o que aconteceria se você intervisse no mundo. Se alguém pergunta \"então se eu aumentar essa variável, o resultado muda?\", a resposta é que o modelo não responde isso — precisa de desenho causal. Confundir explicabilidade de modelo com inferência causal é um erro caro e comum em contextos de negócio.\u003c/p>"},{"titleHtml":"🔴 Naive Bayes assume independência entre features, o que é quase sempre falso. Por que ainda funciona?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Porque classificação só precisa que a \u003cstrong>ordenação\u003c/strong> entre as classes esteja correta, não que as probabilidades estejam corretas. A violação da independência faz o modelo contar evidência correlacionada múltiplas vezes — se \"nova\" e \"york\" aparecem juntas, ele trata como duas evidências independentes — o que empurra as probabilidades para os extremos 0 e 1. Mas esse efeito frequentemente atinge todas as classes de forma parecida e preserva qual é a maior.\u003c/p>\n\u003cp>Ou seja: \u003cstrong>Naive Bayes é um classificador razoável e um estimador de probabilidade ruim.\u003c/strong> Se eu preciso da classe, ele pode servir; se eu preciso do valor da probabilidade para uma conta a jusante, ele é inadequado sem recalibração.\u003c/p>\n\u003cp>Há também um efeito de regularização: a suposição forte reduz drasticamente o número de parâmetros a estimar, o que ajuda muito com poucos dados. Com muitos dados, modelos que aprendem as dependências superam ele consistentemente.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Por que suavização de Laplace?\"\u003c/em> — Sem ela, uma palavra nunca vista naquela classe dá probabilidade condicional zero, e como o modelo multiplica, um único termo zera a classe inteira. Somar uma constante a todas as contagens evita esse veto. E na implementação se trabalha em log, somando log-probabilidades, porque multiplicar milhares de números pequenos causa underflow.\u003c/p>"},{"titleHtml":"🔴 Você tem 10 milhões de linhas e 500 features tabulares, prevendo uma classe rara (0,5%). Qual modelo e por quê?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Começaria por \u003cstrong>LightGBM\u003c/strong>, pelo tamanho — o splitting por histogramas e o crescimento leaf-wise foram feitos para esse regime — e com \u003cstrong>regressão logística regularizada como baseline\u003c/strong> para saber quanto a complexidade está de fato comprando.\u003c/p>\n\u003cp>Decisões específicas para este cenário:\u003c/p>\n\u003cp>\u003cstrong>Sobre a raridade:\u003c/strong> 0,5% de 10 milhões são 50 mil positivos, o que é bastante em termos absolutos. Então eu \u003cstrong>não começaria reamostrando\u003c/strong>. Usaria \u003ccode>scale_pos_weight\u003c/code> ou nada, com PR-AUC como métrica e o limiar definido pela capacidade operacional real. Undersampling da majoritária eu consideraria como otimização de custo de treino, não como remédio estatístico — e se usasse, recalibraria os scores depois.\u003c/p>\n\u003cp>\u003cstrong>Sobre 500 features:\u003c/strong> verificaria redundância e, mais importante, \u003cstrong>disponibilidade em tempo de inferência\u003c/strong> — features que existem no warehouse mas não em tempo real são leakage disfarçado. Boosting tolera features irrelevantes razoavelmente bem, então eu não faria seleção agressiva antes de ter um baseline; usaria permutation importance ou SHAP para podar depois, com olho no custo de manter cada feature em produção.\u003c/p>\n\u003cp>\u003cstrong>Sobre validação:\u003c/strong> se há componente temporal — e com esse volume quase certamente há — split temporal com gap, não k-fold aleatório. Com 10 milhões de linhas, um holdout único é grande o bastante para ser preciso, então eu não pagaria o custo de CV completa.\u003c/p>\n\u003cp>\u003cstrong>Sobre o objetivo:\u003c/strong> confirmaria com o negócio o que se faz com a predição. Se o output alimenta uma fila de revisão humana com capacidade fixa, a métrica é precision@k naquele k, e possivelmente ponderada por valor — pegar as fraudes caras importa mais que pegar muitas fraudes baratas. Isso pode mudar até a formulação, de classificação para regressão sobre perda esperada.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Na regressão logística, o que significa um coeficiente de 0,5 numa feature?","a":["A log-odds sobe 0,5 e a razão de chances é multiplicada por e^0,5","A probabilidade prevista aumenta em 0,5 por unidade daquela feature","A feature explica metade da variância observada no alvo binário","A acurácia do modelo sobe cinquenta por cento graças à feature"],"c":0,"e":"O coeficiente age na log-odds, e o efeito sobre a probabilidade depende de onde você está na curva, sendo máximo perto de 0,5 e quase nulo nos extremos — por isso lê-lo como variação de probabilidade é o erro clássico. Variância explicada é conceito de regressão linear, e acurácia não se decompõe por feature."},{"n":"🟢","levelName":"basico","q":"É necessário \u003cstrong>escalonar features\u003c/strong> para árvores de decisão?","a":["Sim, mas apenas com profundidade acima de dez níveis","Sim, sempre, como em qualquer modelo supervisionado","Não: a árvore usa só a ordem dos valores para cortar","Não, porque a árvore normaliza os dados internamente"],"c":2,"e":"Árvores comparam valores com limiares, então escala e qualquer transformação monótona, como log, não mudam nada — o que também significa que log não ajuda numa árvore. Não há normalização interna: simplesmente não é necessária. Quem exige escalonamento é kNN, SVM, k-means, PCA e modelos regularizados."},{"n":"🟡","levelName":"intermediario","q":"Qual a diferença central entre \u003cstrong>bagging\u003c/strong> e \u003cstrong>boosting\u003c/strong>?","a":["Bagging usa árvores rasas e boosting usa árvores bem profundas","Bagging reduz bias em paralelo; boosting reduz variância em série","Os dois reduzem variância, mas o boosting converge mais rápido","Bagging reduz variância em paralelo; boosting reduz bias em série"],"c":3,"e":"Bagging faz média de modelos de alta variância e baixo bias, descorrelacionados; boosting soma aprendizes fracos sequencialmente. A troca dos papéis aparece invertida numa das opções, e a profundidade também: bagging usa árvores profundas e boosting, rasas. Boosting ainda pode overfittar com árvores demais, enquanto a random forest só converge."},{"n":"🟡","levelName":"intermediario","q":"Por que a random forest \u003cstrong>amostra features em cada split\u003c/strong>, além do bootstrap?","a":["Para acelerar o treino de cada árvore individual do conjunto","Para descorrelacionar: a correlação é o piso da variância da média","Para impedir que features categóricas dominem todos os splits","Para reduzir o bias de cada árvore quando tomada isoladamente"],"c":1,"e":"Só com bootstrap, todas as árvores escolheriam a mesma feature dominante na raiz e a média não ganharia quase nada; restringindo cada split, cada árvore fica pior e o conjunto muito melhor. Velocidade é efeito colateral, categóricas não são o alvo do mecanismo, e o bias individual até sobe um pouco."},{"n":"🟡","levelName":"intermediario","q":"O que é o erro \u003cstrong>OOB (out-of-bag)\u003c/strong> da random forest?","a":["É o erro médio das árvores sobre o próprio conjunto de treino","É o erro medido em amostras externas, separadas antes do treino","Cada árvore não vê cerca de 37% dos dados, e eles viram validação","É a métrica que sinaliza profundidade excessiva nas árvores criadas"],"c":2,"e":"A chance de um exemplo nunca ser sorteado em n tentativas com reposição tende a 1/e, e avaliar cada exemplo só nas árvores que não o viram dá validação praticamente de graça. Não há conjunto externo separado, o erro no próprio treino seria otimista, e o OOB não mede profundidade."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>árvores não extrapolam\u003c/strong>, e onde isso é decisivo?","a":["A predição é média de folhas vistas, presa à faixa do treino","A profundidade limitada impede prever valores muito distantes","Elas só aceitam features categóricas depois de discretizadas","Elas extrapolam normalmente, desde que sejam usadas em ensemble"],"c":0,"e":"Nenhum valor fora do intervalo de alvos do treino é alcançável, e por isso gradient boosting não prevê crescimento continuado — com tendência, modela-se a diferença ou faz-se detrend antes. Profundidade não muda isso, o tipo de feature é irrelevante, e o ensemble herda a mesma limitação de cada árvore."},{"n":"🟡","levelName":"intermediario","q":"Qual o risco específico do crescimento \u003cstrong>leaf-wise\u003c/strong> do LightGBM?","a":["Fica mais lento que o level-wise quando o dataset é muito grande","Overfitta mais fácil em dados pequenos, exigindo controle de folhas","Não consegue lidar com features categóricas de alta cardinalidade","Impede o uso de early stopping por não ter validação incremental"],"c":1,"e":"Expandir sempre a folha de maior ganho atinge perda menor com menos folhas, mas produz árvores desbalanceadas que capturam ruído com poucos dados — daí controlar num_leaves e o mínimo por folha. É mais rápido, não mais lento; trata categóricas nativamente; e early stopping funciona normalmente."},{"n":"🔴","levelName":"avancado","q":"Por que redes neurais raramente superam gradient boosting em \u003cstrong>dados tabulares\u003c/strong>?","a":["Redes exigem GPU e boosting roda apenas em processadores comuns","Redes neurais não conseguem lidar com valores ausentes nos dados","Gradient boosting tem mais parâmetros efetivos que uma rede densa","Tabular não tem a estrutura composicional que o viés das redes usa"],"c":3,"e":"Convolução assume localidade e atenção assume relação entre tokens; em tabular a ordem das colunas é arbitrária, as features já são semanticamente significativas, e regras de negócio criam descontinuidades que a árvore modela com um corte. Redes lidam com missing após imputação, contagem de parâmetros não é o critério, e boosting também roda em GPU."}]},{"id":"05","fullTitle":"05 — Features e Dimensionalidade","shortTitle":"Features e Dimensionalidade","subtitle":"Feature engineering, encoding de categóricas, escalonamento, missing values, curse of dimensionality, PCA, seleção de features.","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-por-que-feature-engineering-ainda-importa\">1.1 Por que feature engineering ainda importa\u003c/h3>\n\u003cp>A frase clichê é \"feature engineering é onde se ganha a competição\". A versão precisa: \u003cstrong>modelos aprendem a relação entre a representação que você dá e o alvo. Mudar a representação muda o que é fácil de aprender.\u003c/strong> Uma feature \u003ccode>dia_da_semana\u003c/code> extraída de um timestamp transforma um padrão que uma árvore precisaria de dezenas de splits para aproximar numa única condição. \u003ccode>preço / preço_médio_da_categoria\u003c/code> codifica em uma coluna uma comparação que o modelo teria que descobrir através de uma interação.\u003c/p>\n\u003cp>Isso não desapareceu com deep learning — mudou de lugar. Em imagem e texto, a rede aprende a representação, então feature engineering manual sumiu. Em \u003cstrong>dados tabulares\u003c/strong>, que é a maioria dos problemas de negócio, ele continua sendo o maior alavancador de desempenho, à frente da escolha de algoritmo.\u003c/p>\n\u003cp>\u003cstrong>A categoria mais valiosa de features é quase sempre a que codifica conhecimento de domínio ou agregações temporais:\u003c/strong> frequência de eventos em janelas (últimos 7/30/90 dias), razões e diferenças em relação a uma referência (média do grupo, valor anterior do próprio cliente), tempo desde o último evento, e contagens de entidades relacionadas. Esse repertório é o que se espera de alguém experiente numa pergunta aberta.\u003c/p>\n\u003cp>\u003cstrong>E a advertência que anda junto:\u003c/strong> toda feature agregada é uma fonte potencial de leakage temporal. Uma \"média de gastos do cliente\" tem que ser calculada apenas com dados anteriores ao instante da predição, o que na prática significa agregação com janela e ponto de corte, não \u003ccode>groupby\u003c/code> na tabela inteira. Ver \u003ca href=\"#\" class=\"topic-link\" data-topic=\"03\">03\u003c/a>.\u003c/p>\n\u003ch3 id=\"h-1-2-encoding-de-variáveis-categóricas\">1.2 Encoding de variáveis categóricas\u003c/h3>\n\u003cp>\u003cstrong>One-hot encoding\u003c/strong> — uma coluna binária por categoria. Não impõe ordem, o que é a virtude central. Custo: explode a dimensionalidade com alta cardinalidade, e cada coluna resultante fica esparsa e com pouco sinal individual. Detalhe: descartar uma categoria (\u003cem>drop first\u003c/em>) evita colinearidade perfeita, o que importa em modelos lineares com intercepto (a \"armadilha da variável dummy\") e é irrelevante em árvores.\u003c/p>\n\u003cp>\u003cstrong>Label / ordinal encoding\u003c/strong> — mapeia categorias para inteiros. \u003cstrong>Correto apenas quando existe ordem real\u003c/strong> (baixo/médio/alto). Aplicar a categorias nominais em modelos lineares, kNN ou SVM é um erro grave, porque cria uma relação de ordem e distância inventada: \"São Paulo=1, Rio=2, Recife=3\" faz o modelo acreditar que Rio está entre os outros dois. \u003cstrong>Em árvores é menos destrutivo\u003c/strong> — a árvore pode isolar valores com múltiplos splits — mas ainda é subótimo, porque ela precisa de vários cortes para separar um grupo que o one-hot ou o suporte nativo separaria com um.\u003c/p>\n\u003cp>\u003cstrong>Target encoding (mean encoding)\u003c/strong> — substitui a categoria pela média do alvo naquela categoria. Poderoso com alta cardinalidade porque comprime muita informação em uma coluna. \u003cstrong>É também a técnica mais perigosa do arsenal\u003c/strong>, por duas razões:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Leakage direto:\u003c/strong> se a média inclui a própria linha, o rótulo dela vaza para a feature. Com categorias raras (uma única linha), a feature vira o próprio rótulo, e o modelo aprende a copiar. É o leakage mais insidioso que existe porque não parece leakage.\u003c/li>\u003cli>\u003cstrong>Overfitting em categorias raras:\u003c/strong> a média sobre 2 observações é ruído.\u003c/li>\u003c/ol>\n\u003cp>Mitigações obrigatórias: \u003cstrong>suavização\u003c/strong> em direção à média global, com peso proporcional à contagem (\u003ccode>(soma + m·média_global) / (n + m)\u003c/code>), e cálculo \u003cstrong>out-of-fold\u003c/strong> — a codificação de cada linha usa apenas outros folds. O CatBoost automatiza isso com \u003cem>ordered target statistics\u003c/em>, usando apenas linhas anteriores numa permutação.\u003c/p>\n\u003cp>\u003cstrong>Frequency / count encoding\u003c/strong> — substitui pela frequência da categoria. Simples, sem leakage de alvo, e surpreendentemente útil: raridade em si costuma ser informativa (um CEP raro, um dispositivo raro).\u003c/p>\n\u003cp>\u003cstrong>Hashing (hashing trick)\u003c/strong> — aplica uma função de hash e usa o resto módulo \u003ccode>d\u003c/code>. Dimensão fixa independentemente da cardinalidade, sem precisar armazenar o vocabulário, e lida com categorias novas naturalmente. Custo: \u003cstrong>colisões\u003c/strong> (categorias distintas colapsam) e perda total de interpretabilidade. Ideal para produção com cardinalidade aberta e crescente.\u003c/p>\n\u003cp>\u003cstrong>Embeddings\u003c/strong> — representação densa aprendida. Padrão em redes neurais e o único caminho quando a cardinalidade é enorme (milhões de IDs de produto/usuário) e existe estrutura de similaridade a capturar.\u003c/p>\n\u003cp>\u003cstrong>O problema das categorias não vistas\u003c/strong> — uma categoria que aparece só em produção. Estratégias: bucket \u003ccode>\"__unknown__\"\u003c/code> treinado deliberadamente (agrupando categorias raras no treino para que o modelo aprenda a lidar com o bucket), hashing (que absorve qualquer valor), ou fallback para a média global no target encoding. \u003cstrong>Isso precisa ser decidido no design, não descoberto em produção\u003c/strong> — e mencionar isso é um sinal claro de experiência real.\u003c/p>\n\u003ch3 id=\"h-1-3-escalonamento\">1.3 Escalonamento\u003c/h3>\n\u003cp>\u003cstrong>Quem precisa:\u003c/strong> tudo que depende de \u003cstrong>distância\u003c/strong> (kNN, k-means, SVM, PCA), tudo que usa \u003cstrong>regularização\u003c/strong> (a penalidade depende da magnitude do coeficiente, que depende da unidade da feature) e \u003cstrong>redes neurais\u003c/strong> (features em escalas muito diferentes criam superfícies de perda mal-condicionadas e desestabilizam a otimização).\u003c/p>\n\u003cp>\u003cstrong>Quem não precisa:\u003c/strong> árvores e ensembles de árvores. Elas só usam a ordem dos valores.\u003c/p>\n\u003cp>\u003cstrong>Métodos:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>StandardScaler (z-score):\u003c/strong> \u003ccode>(x - μ)/σ\u003c/code>. Padrão. Não limita a faixa e preserva outliers.\u003c/li>\u003cli>\u003cstrong>MinMaxScaler:\u003c/strong> para [0,1]. Útil quando há necessidade de faixa fixa (algumas redes, processamento de imagem). \u003cstrong>Muito sensível a outliers\u003c/strong> — um único valor extremo comprime todo o resto num intervalo minúsculo.\u003c/li>\u003cli>\u003cstrong>RobustScaler:\u003c/strong> usa mediana e IQR. Recomendado com outliers.\u003c/li>\u003cli>\u003cstrong>Log / Box-Cox / Yeo-Johnson:\u003c/strong> para distribuições assimétricas de cauda longa. Log é transformação, não escalonamento, e muda a natureza da relação: torna multiplicativa uma relação que era aditiva. Especialmente útil em variáveis monetárias.\u003c/li>\u003cli>\u003cstrong>Quantile transform / rank-gauss:\u003c/strong> mapeia para uma distribuição alvo (uniforme ou normal) pelos ranks. Muito robusto, destrói a forma original, e é popular em redes neurais sobre dados tabulares.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Regra inegociável:\u003c/strong> o scaler é \u003cstrong>ajustado no treino\u003c/strong> e aplicado em validação/teste com os parâmetros do treino. Ajustar em tudo é leakage.\u003c/p>\n\u003ch3 id=\"h-1-4-missing-values\">1.4 Missing values\u003c/h3>\n\u003cp>Antes de escolher a técnica, \u003cstrong>diagnostique o mecanismo\u003c/strong> — é isso que o entrevistador quer:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>MCAR\u003c/strong> (missing completely at random) — a ausência é independente de tudo. Remover linhas é imparcial (só perde eficiência). Raro na prática.\u003c/li>\u003cli>\u003cstrong>MAR\u003c/strong> (missing at random) — a ausência depende de outras variáveis \u003cstrong>observadas\u003c/strong>. Ex.: renda faltante mais frequente entre jovens, e você observa idade. Imputação condicionada às observadas funciona bem.\u003c/li>\u003cli>\u003cstrong>MNAR\u003c/strong> (missing not at random) — a ausência depende do \u003cstrong>próprio valor não observado\u003c/strong>. Ex.: pessoas de renda muito alta se recusam a informar. \u003cstrong>Qualquer imputação é enviesada\u003c/strong>, porque a informação que resolveria o viés não está nos dados. A melhor resposta é modelar explicitamente a ausência.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>A observação que vale mais que todas as técnicas: a ausência costuma ser informativa.\u003c/strong> Em dados de negócio, MNAR é a regra, não a exceção — um campo vazio geralmente significa que algo não aconteceu, que o cliente não completou uma etapa, ou que um sistema não tinha aquele dado. Por isso, \u003cstrong>quase sempre vale criar um indicador binário \u003ccode>x_is_missing\u003c/code>\u003c/strong> junto com a imputação. Frequentemente esse indicador é mais preditivo que o valor imputado.\u003c/p>\n\u003cp>\u003cstrong>Técnicas:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Remover linhas\u003c/strong> — só com poucos missing e MCAR. Perigoso: pode enviesar a amostra silenciosamente se a ausência é sistemática.\u003c/li>\u003cli>\u003cstrong>Remover a coluna\u003c/strong> — se a maioria está ausente e não há sinal no padrão de ausência.\u003c/li>\u003cli>\u003cstrong>Imputar por média/mediana/moda\u003c/strong> — baseline. Distorce a distribuição (reduz a variância artificialmente) e enfraquece correlações. Mediana para distribuições assimétricas.\u003c/li>\u003cli>\u003cstrong>Imputar por constante fora do domínio\u003c/strong> (-999) — funciona bem \u003cstrong>em árvores\u003c/strong>, porque a árvore pode isolar o valor com um split e efetivamente aprender \"ausente\". É péssimo em modelos lineares e kNN, onde -999 é um valor numérico com significado.\u003c/li>\u003cli>\u003cstrong>Imputação por modelo\u003c/strong> (kNN, MICE, iterativa) — mais precisa, mais cara, e com risco de leakage se ajustada fora do treino. MICE também dá múltiplas imputações, o que permite propagar a incerteza.\u003c/li>\u003cli>\u003cstrong>Deixar o modelo tratar\u003c/strong> — XGBoost e LightGBM aprendem uma \u003cstrong>direção padrão por split\u003c/strong> para valores ausentes, o que frequentemente é melhor que qualquer imputação porque a decisão é otimizada junto com a perda. Se você usa boosting, esta costuma ser a melhor resposta.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Cuidado operacional:\u003c/strong> a estratégia de imputação precisa ser reproduzível em tempo de inferência. Imputar pela média do batch atual em produção é um bug clássico — o valor muda a cada batch e o modelo passa a ver algo diferente do que viu no treino.\u003c/p>\n\u003ch3 id=\"h-1-5-curse-of-dimensionality\">1.5 Curse of dimensionality\u003c/h3>\n\u003cp>Conjunto de fenômenos contraintuitivos em alta dimensão:\u003c/p>\n\u003cp>\u003cstrong>O volume cresce exponencialmente.\u003c/strong> Para manter a mesma densidade de amostragem, o número de pontos necessários cresce exponencialmente com \u003ccode>p\u003c/code>. Com 10 pontos cobrindo bem uma dimensão, você precisaria de 10^20 para cobrir 20 dimensões igualmente.\u003c/p>\n\u003cp>\u003cstrong>As distâncias se concentram.\u003c/strong> Em alta dimensão, a razão entre a distância ao vizinho mais próximo e ao mais distante tende a 1. Consequência direta: \u003cstrong>\"vizinho mais próximo\" deixa de ser um conceito significativo\u003c/strong>, o que quebra kNN, k-means e qualquer método baseado em distância. Esse é o efeito mais citado e o mais importante.\u003c/p>\n\u003cp>\u003cstrong>Tudo fica esparso e tudo fica na \"casca\".\u003c/strong> Numa hiperesfera de alta dimensão, quase todo o volume está próximo da superfície. Os dados ficam nos cantos do espaço, longe do centro e uns dos outros.\u003c/p>\n\u003cp>\u003cstrong>Overfitting fica trivial.\u003c/strong> Com \u003ccode>p &amp;gt; n\u003c/code>, existe sempre um hiperplano que separa perfeitamente qualquer rotulação — inclusive rótulos aleatórios. Correlações espúrias com o alvo aparecem por acaso: com 10.000 features aleatórias e 100 amostras, algumas terão correlação alta com o alvo puramente por sorte. É a razão de a seleção de features precisar ser feita dentro do CV.\u003c/p>\n\u003cp>\u003cstrong>Por que ML funciona apesar disso — a hipótese da variedade (manifold hypothesis).\u003c/strong> Dados reais de alta dimensão tipicamente vivem próximos de uma variedade de dimensão intrínseca muito menor. Uma imagem de 1 megapixel tem um milhão de dimensões, mas o conjunto de imagens plausíveis ocupa uma fração infinitesimal desse espaço. \u003cstrong>A dimensão que importa é a intrínseca, não a nominal\u003c/strong>, e é isso que redução de dimensionalidade e representation learning exploram. Citar isso transforma uma resposta boa em uma resposta forte.\u003c/p>\n\u003ch3 id=\"h-1-6-pca\">1.6 PCA\u003c/h3>\n\u003cp>Encontra as direções ortogonais de \u003cstrong>máxima variância\u003c/strong> e projeta os dados nelas. Formalmente: autovetores da matriz de covariância (ou vetores singulares via SVD, que é o que se usa na prática por estabilidade numérica), ordenados por autovalor. O k-ésimo componente é a direção de maior variância ortogonal aos k-1 anteriores.\u003c/p>\n\u003cp>\u003cstrong>Pontos que precisam estar corretos:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Padronizar antes é essencial\u003c/strong> quando as features têm unidades diferentes. PCA maximiza variância, e variância depende da unidade — uma feature em milímetros terá variância enorme comparada à mesma em quilômetros e dominará o primeiro componente por artefato de escala.\u003c/li>\u003cli>\u003cstrong>Os componentes são combinações lineares de todas as features originais\u003c/strong>, portanto \u003cstrong>não são interpretáveis\u003c/strong> como as features de origem. Se interpretabilidade é requisito, PCA é o caminho errado.\u003c/li>\u003cli>\u003cstrong>PCA é não-supervisionado\u003c/strong>: ignora o alvo. A direção de maior variância \u003cstrong>não é necessariamente a mais preditiva\u003c/strong> — é perfeitamente possível descartar o componente que carrega todo o sinal preditivo. Se você quer projeção supervisionada, o método análogo é o \u003cstrong>LDA\u003c/strong>, que maximiza a separação entre classes.\u003c/li>\u003cli>\u003cstrong>Só captura estrutura linear.\u003c/strong> Para estrutura não-linear, kernel PCA, autoencoders, UMAP.\u003c/li>\u003cli>\u003cstrong>Sensível a outliers\u003c/strong>, porque variância é sensível a outliers.\u003c/li>\u003cli>Escolha de \u003ccode>k\u003c/code>: variância explicada acumulada (85–95% é o costume), gráfico de scree procurando o \"cotovelo\", ou — o melhor critério — desempenho na tarefa a jusante medido em validação.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Usos legítimos:\u003c/strong> compressão e velocidade, remoção de multicolinearidade (os componentes são ortogonais por construção), denoising (descartar componentes de baixa variância remove ruído), e visualização em 2D (embora t-SNE/UMAP sejam melhores para isso).\u003c/p>\n\u003cp>\u003cstrong>Quando é uma má ideia:\u003c/strong> quando você precisa de interpretabilidade; quando o modelo já lida bem com muitas features (boosting); quando a variância não corresponde a informação relevante; e — erro comum — \u003cstrong>como \"seleção de features\"\u003c/strong>, que ele não é: PCA cria features novas usando todas as originais, então você ainda precisa coletar e servir todas elas em produção. Não reduz o custo de aquisição de dados.\u003c/p>\n\u003ch3 id=\"h-1-7-seleção-de-features\">1.7 Seleção de features\u003c/h3>\n\u003cp>\u003cstrong>Por que selecionar:\u003c/strong> reduz overfitting (menos oportunidade de correlação espúria), acelera treino e inferência, melhora interpretabilidade, e — o motivo mais subestimado — \u003cstrong>reduz custo operacional e superfície de falha em produção\u003c/strong>. Cada feature é um pipeline que pode quebrar, atrasar ou driftar.\u003c/p>\n\u003cp>\u003cstrong>Três famílias:\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Filter\u003c/strong> — usa estatísticas dos dados, independentemente do modelo: correlação, informação mútua, qui-quadrado, ANOVA, variância. Rápido e escalável. Limitação séria: avalia features \u003cstrong>isoladamente\u003c/strong>, então descarta features que só são úteis em interação (uma feature com correlação zero com o alvo pode ser essencial em combinação com outra — XOR é o exemplo canônico) e mantém redundantes.\u003c/p>\n\u003cp>\u003cstrong>Wrapper\u003c/strong> — usa o desempenho do próprio modelo: forward selection, backward elimination, \u003cstrong>RFE\u003c/strong> (Recursive Feature Elimination). Captura interações e considera o modelo específico. Caro (muitos treinos) e propenso a overfittar na validação se você não for cuidadoso.\u003c/p>\n\u003cp>\u003cstrong>Embedded\u003c/strong> — a seleção acontece durante o treino: \u003cstrong>L1/Lasso\u003c/strong> zerando coeficientes, importância de features em modelos de árvore. Melhor custo-benefício na prática.\u003c/p>\n\u003cp>\u003cstrong>A regra que mais cai:\u003c/strong> \u003cstrong>seleção de features é parte do treino e tem que estar dentro do CV.\u003c/strong> Selecionar as top-k por correlação usando o dataset inteiro e depois fazer CV é leakage, e produz resultados espetacularmente falsos quando \u003ccode>p &amp;gt;&amp;gt; n\u003c/code> — é possível obter AUC de 0.9 a partir de features puramente aleatórias assim.\u003c/p>\n\u003cp>\u003cstrong>Alternativa robusta:\u003c/strong> permutation importance calculada na validação, ou SHAP agregado. Ambos medem impacto no desempenho real. Cuidado com features correlacionadas em ambos: elas dividem crédito e cada uma parece menos importante do que é.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Ajustar scaler ou imputador no dataset inteiro.\u003c/strong> Leakage clássico. \u003ccode>fit\u003c/code> só no treino, dentro de cada fold.\u003c/p>\n\u003cp>\u003cstrong>Label encoding em categóricas nominais para modelos que usam distância.\u003c/strong> Cria ordem inexistente.\u003c/p>\n\u003cp>\u003cstrong>Target encoding sem out-of-fold e sem suavização.\u003c/strong> Leakage direto e overfitting em categorias raras.\u003c/p>\n\u003cp>\u003cstrong>Não planejar categorias não vistas.\u003c/strong> Quebra em produção no primeiro valor novo.\u003c/p>\n\u003cp>\u003cstrong>Escalonar para árvores.\u003c/strong> Inofensivo, mas revela que você não sabe por que escalona.\u003c/p>\n\u003cp>\u003cstrong>Não escalonar antes do PCA.\u003c/strong> Faz o primeiro componente refletir escolha de unidade.\u003c/p>\n\u003cp>\u003cstrong>Achar que PCA é seleção de features.\u003c/strong> Ele cria features novas a partir de todas as originais; você continua precisando coletar todas.\u003c/p>\n\u003cp>\u003cstrong>Usar PCA assumindo que variância = informação preditiva.\u003c/strong> PCA é cego ao alvo.\u003c/p>\n\u003cp>\u003cstrong>Fazer seleção de features fora do CV.\u003c/strong> Produz resultados falsos, especialmente com p &gt;&gt; n.\u003c/p>\n\u003cp>\u003cstrong>Imputar sem indicador de ausência.\u003c/strong> Joga fora sinal que muitas vezes é o mais forte que existe.\u003c/p>\n\u003cp>\u003cstrong>Imputar com a média sem notar que o mecanismo é MNAR.\u003c/strong> Enviesa sistematicamente e a imputação parece razoável.\u003c/p>\n\u003cp>\u003cstrong>Calcular features agregadas sem ponto de corte temporal.\u003c/strong> Leakage silencioso e muito comum.\u003c/p>\n\u003cp>\u003cstrong>Adicionar features sem verificar disponibilidade em inferência.\u003c/strong> Treino-serving skew.\u003c/p>\n\u003cp>\u003cstrong>Codificar hora ou mês como inteiro em modelo linear.\u003c/strong> Hora 23 e hora 0 ficam a 23 unidades de distância. Use codificação cíclica.\u003c/p>\n\u003cp>\u003cstrong>Otimizar o modelo antes de investir em features.\u003c/strong> Em tabular, features quase sempre pagam mais que troca de algoritmo.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Como você codifica variáveis categóricas?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Depende da cardinalidade e do modelo.\u003c/p>\n\u003cp>\u003cstrong>Baixa cardinalidade\u003c/strong> (até algumas dezenas): one-hot, porque não impõe ordem nenhuma. \u003cstrong>Ordinal de verdade\u003c/strong> (baixo/médio/alto): ordinal encoding, porque a ordem é informação real que eu quero preservar. \u003cstrong>Alta cardinalidade\u003c/strong> (milhares de CEPs, IDs de produto): one-hot explode, então uso target encoding com suavização e cálculo out-of-fold, ou frequency encoding, ou hashing se a cardinalidade é aberta em produção, ou embeddings se estou usando rede neural.\u003c/p>\n\u003cp>Se estou usando LightGBM ou CatBoost, considero o \u003cstrong>suporte nativo a categóricas\u003c/strong>, que costuma ser melhor que one-hot em alta cardinalidade porque a árvore particiona o conjunto de categorias diretamente, sem precisar de um split por categoria.\u003c/p>\n\u003cp>Uma coisa que eu decidiria explicitamente no design, não em produção: \u003cstrong>o que acontece com uma categoria nunca vista\u003c/strong>. Agrupo categorias raras num bucket \"outros\" já no treino, para que o modelo aprenda a lidar com ele, ou uso hashing, que absorve qualquer valor.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Por que não usar label encoding em tudo? É mais simples.\"\u003c/em> — Porque inventa ordem e distância que não existem. \"SP=1, RJ=2, Recife=3\" faz um modelo linear ou um kNN acreditarem que RJ está entre os outros dois. Em árvore o dano é menor, porque ela pode isolar valores com múltiplos splits, mas ainda é subótimo: ela precisa de vários cortes para separar um grupo que o one-hot separaria com um.\u003c/p>"},{"titleHtml":"🟢 Quando você precisa escalonar features?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Quando o algoritmo usa distância ou magnitude. Isso inclui kNN, k-means, SVM e PCA, porque todos operam sobre distâncias e a feature de maior amplitude domina; modelos com regularização L1/L2, porque a penalidade age sobre a magnitude do coeficiente, que depende da unidade da feature; e redes neurais, porque escalas muito diferentes criam superfícies de perda mal-condicionadas e desestabilizam a otimização.\u003c/p>\n\u003cp>Não preciso escalonar em árvores e ensembles de árvores, porque elas usam apenas a ordem dos valores para escolher pontos de corte.\u003c/p>\n\u003cp>Escolho o método pelo dado: StandardScaler como padrão, RobustScaler com outliers, MinMax quando preciso de faixa fixa (e sabendo que ele é muito sensível a outliers — um valor extremo comprime tudo o mais num intervalo minúsculo), e log ou quantile transform para distribuições de cauda longa.\u003c/p>\n\u003cp>E o ponto que não é opcional: \u003cstrong>ajusto o scaler apenas no treino\u003c/strong> e aplico nos demais conjuntos com os parâmetros do treino. Ajustar no dataset inteiro é leakage.\u003c/p>"},{"titleHtml":"🟡 Como você lida com missing values?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Começo diagnosticando o \u003cstrong>mecanismo\u003c/strong>, porque ele determina o que é válido. Se é MCAR, remover linhas é imparcial. Se é MAR — a ausência depende de variáveis que eu observo — imputação condicionada funciona. Se é MNAR, ou seja, a ausência depende do próprio valor que falta, como renda alta não declarada, então qualquer imputação é enviesada e a informação que corrigiria isso não está nos dados.\u003c/p>\n\u003cp>Na prática de dados de negócio, MNAR é a regra: um campo vazio quase sempre significa que algo não aconteceu. Por isso \u003cstrong>quase sempre crio um indicador binário de ausência\u003c/strong> junto com a imputação — frequentemente ele é mais preditivo que o valor imputado.\u003c/p>\n\u003cp>Sobre a imputação em si: mediana ou moda como baseline; constante fora do domínio se estou usando árvores, porque a árvore pode isolar aquele valor com um split e aprender \"ausente\" como categoria; imputação por modelo (MICE, kNN) quando vale o custo. E se estou usando XGBoost ou LightGBM, \u003cstrong>frequentemente a melhor opção é não imputar nada\u003c/strong> — eles aprendem uma direção padrão para valores ausentes em cada split, otimizada junto com a perda, o que costuma bater imputação manual.\u003c/p>\n\u003cp>Detalhe operacional: a imputação precisa ser reproduzível em inferência. Imputar pela média do batch atual em produção é um bug comum, porque o valor muda a cada batch.\u003c/p>"},{"titleHtml":"🟡 O que é PCA e quando você usaria?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> PCA encontra as direções ortogonais de máxima variância — os autovetores da matriz de covariância, na prática obtidos por SVD — e projeta os dados nas primeiras k. É redução de dimensionalidade linear e não-supervisionada.\u003c/p>\n\u003cp>Uso para compressão e velocidade, para eliminar multicolinearidade (os componentes são ortogonais por construção), para denoising, e para visualizar em 2D.\u003c/p>\n\u003cp>Duas coisas que eu sempre verificaria. Primeiro, \u003cstrong>padronizar antes\u003c/strong> é obrigatório com unidades diferentes, senão a feature de maior variância numérica domina o primeiro componente por artefato de escala. Segundo, \u003cstrong>PCA ignora o alvo\u003c/strong>: a direção de maior variância não é necessariamente a mais preditiva, e é perfeitamente possível descartar exatamente o componente que carregava o sinal. Se eu quero projeção que preserva separabilidade entre classes, LDA é o método análogo supervisionado.\u003c/p>\n\u003cp>Não usaria quando interpretabilidade importa, porque os componentes são combinações de todas as features originais; nem quando a estrutura é não-linear, onde kernel PCA, autoencoders ou UMAP são apropriados; nem — e isso é um erro comum — \u003cstrong>como substituto de seleção de features\u003c/strong>, porque PCA usa todas as features originais para construir os componentes, então eu continuo tendo que coletar e servir todas elas em produção.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Como escolhe o número de componentes?\"\u003c/em> — Variância explicada acumulada, tipicamente 85 a 95%; ou o cotovelo no scree plot; mas o melhor critério é \u003cstrong>desempenho na tarefa a jusante medido em validação\u003c/strong>, tratando k como hiperparâmetro qualquer.\u003c/p>"},{"titleHtml":"🟡 O que é a maldição da dimensionalidade?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É o conjunto de efeitos que tornam alta dimensão contraintuitiva. O volume do espaço cresce exponencialmente com o número de features, então a densidade de amostragem despenca — manter a mesma cobertura exigiria um número exponencial de pontos.\u003c/p>\n\u003cp>O efeito mais consequente é que \u003cstrong>as distâncias se concentram\u003c/strong>: em alta dimensão, a razão entre a distância ao vizinho mais próximo e ao mais distante tende a 1. Isso significa que \"vizinho mais próximo\" perde significado, o que quebra kNN, k-means e qualquer método baseado em distância. Também fica trivial overfittar: com mais features que amostras, sempre existe um separador perfeito, inclusive para rótulos aleatórios, e correlações espúrias com o alvo aparecem por puro acaso.\u003c/p>\n\u003cp>A razão de ML funcionar apesar disso é a \u003cstrong>hipótese da variedade\u003c/strong>: dados reais de alta dimensão vivem próximos de uma variedade de dimensão intrínseca muito menor. Uma imagem tem um milhão de pixels, mas o conjunto de imagens plausíveis ocupa uma fração infinitesimal desse espaço. A dimensão que importa é a intrínseca, não a nominal — e é exatamente isso que redução de dimensionalidade e representation learning exploram.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Como você mitiga?\"\u003c/em> — Redução de dimensionalidade, seleção de features, regularização forte, e usar modelos com viés indutivo apropriado. Em prática moderna, o mais efetivo costuma ser usar embeddings pré-treinados, que já projetam num espaço denso de dimensão intrínseca razoável.\u003c/p>"},{"titleHtml":"🟡 Explique target encoding e seus riscos.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Target encoding substitui cada categoria pela média do alvo naquela categoria. É muito eficaz com alta cardinalidade porque comprime informação de milhares de níveis numa única coluna numérica, e o modelo recebe direto a relação categoria-alvo.\u003c/p>\n\u003cp>É também a técnica mais perigosa que eu uso, por dois motivos. O primeiro é \u003cstrong>leakage direto\u003c/strong>: se a média inclui a própria linha, o rótulo dela entra na feature. No limite de uma categoria com uma única observação, a feature \u003cstrong>é\u003c/strong> o rótulo, e o modelo aprende a copiá-lo. O treino fica espetacular e produção falha completamente. O segundo é \u003cstrong>overfitting em categorias raras\u003c/strong>: a média sobre duas observações é ruído.\u003c/p>\n\u003cp>As mitigações são obrigatórias, não opcionais: \u003cstrong>suavização\u003c/strong> em direção à média global, com peso proporcional à contagem, de forma que categorias raras sejam puxadas para o global; e cálculo \u003cstrong>out-of-fold\u003c/strong>, em que o encoding de cada linha usa apenas dados de outros folds. O CatBoost automatiza isso com ordered target statistics, calculando o encoding de cada linha só com linhas anteriores numa permutação aleatória, o que é a versão mais rigorosa.\u003c/p>\n\u003cp>E preciso decidir o que acontece com uma categoria não vista em produção — normalmente fallback para a média global.\u003c/p>"},{"titleHtml":"🟡 Como você faz seleção de features?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Primeiro eu perguntaria por que estou selecionando, porque o objetivo muda o método. Se é para reduzir overfitting, se é para acelerar inferência, ou se é para reduzir custo operacional — cada feature em produção é um pipeline que pode quebrar ou driftar, e essa é a razão mais subestimada.\u003c/p>\n\u003cp>Na prática eu combino. Começo com \u003cstrong>filtros baratos\u003c/strong> para eliminar o óbvio: variância zero, duplicatas, features com quase tudo ausente. Depois uso \u003cstrong>métodos embedded\u003c/strong>, que são os de melhor custo-benefício: L1 zerando coeficientes num modelo linear, ou importância de features num modelo de árvore. Para uma decisão final mais confiável, uso \u003cstrong>permutation importance na validação\u003c/strong>, porque ela mede impacto no desempenho real e não na estrutura interna do modelo, ou SHAP agregado.\u003c/p>\n\u003cp>A regra que eu não quebro: \u003cstrong>a seleção é parte do procedimento de treino e tem que estar dentro do CV\u003c/strong>. Selecionar as top-k por correlação usando o dataset inteiro e depois validar é leakage, e com muitas features e poucas amostras ele produz resultados espetacularmente falsos — dá para obter AUC de 0.9 a partir de ruído puro assim.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"Por que métodos de filtro univariados podem falhar?\"\u003c/em> — Porque avaliam cada feature isoladamente. Uma feature com correlação zero com o alvo pode ser essencial em interação com outra — o XOR é o exemplo canônico, onde nenhuma das duas variáveis tem correlação marginal e juntas determinam o alvo perfeitamente. E filtros univariados mantêm features redundantes, porque não olham a relação entre elas.\u003c/p>
