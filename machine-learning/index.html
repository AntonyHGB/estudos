r BatchNorm com batch muito pequeno.\u003c/strong> As estatísticas ficam ruidosas e o método degrada.\u003c/p>\n\u003cp>\u003cstrong>Usar dropout pesado junto com BatchNorm sem cuidado.\u003c/strong> As duas interagem mal, porque o dropout altera a variância que o BN estimou.\u003c/p>\n\u003cp>\u003cstrong>Estranhar perda de treino maior que a de validação.\u003c/strong> É esperado com dropout e augmentation ativos.\u003c/p>\n\u003cp>\u003cstrong>Achar que o teorema da aproximação universal explica por que redes funcionam.\u003c/strong> É um resultado de existência; não diz nada sobre otimização ou generalização.\u003c/p>\n\u003cp>\u003cstrong>Dizer que transformers tornaram CNNs obsoletas.\u003c/strong> Depende do regime de dados; CNNs continuam vantajosas com menos dados.\u003c/p>\n\u003cp>\u003cstrong>Ajustar hiperparâmetros antes de verificar se a rede consegue overfittar um lote pequeno.\u003c/strong> É otimizar sobre um bug.\u003c/p>\n\u003cp>\u003cstrong>Ignorar restrições de latência e memória na escolha da arquitetura.\u003c/strong> O modelo que não cabe em produção não é uma solução.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Por que redes neurais precisam de funções de ativação não-lineares?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Porque a composição de transformações lineares é uma transformação linear. Sem não-linearidade, uma rede de 100 camadas colapsa matematicamente numa única matriz — é equivalente a uma regressão linear, com muito mais parâmetros e nenhum poder expressivo adicional. A não-linearidade é o que permite compor funções progressivamente mais complexas e é a razão inteira de a profundidade fazer sentido.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Qual ativação você usa e por quê?\"\u003c/em> — ReLU como default, porque tem derivada exatamente 1 na região ativa e portanto não contribui um fator de encolhimento para a cadeia de gradientes, e porque é trivialmente barata. GELU em transformers, por ser suave e empiricamente melhor nesse contexto. Leaky ReLU se eu suspeitar de neurônios mortos. Sigmoide e tanh só em saídas ou dentro de gates recorrentes.\u003c/p>"},{"titleHtml":"🟢 Explique backpropagation.","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É o cálculo eficiente do gradiente da perda em relação a todos os parâmetros, usando a regra da cadeia. No forward pass, calculam-se as ativações camada a camada e guardam-se os valores intermediários. No backward pass, propaga-se a derivada da perda para trás; em cada camada calculam-se duas coisas: o gradiente em relação aos pesos daquela camada, que é usado na atualização, e o gradiente em relação à entrada, que é passado para a camada anterior.\u003c/p>\n\u003cp>O que faz backprop ser eficiente e não só \"a regra da cadeia\" é o \u003cstrong>reuso\u003c/strong>: calcular cada derivada parcial independentemente repetiria os mesmos produtos milhões de vezes. Ao calcular os gradientes intermediários uma vez e reutilizá-los, o custo do backward fica comparável ao do forward — cerca de duas vezes — em vez de proporcional ao número de parâmetros. É isso que torna viável treinar redes grandes.\u003c/p>\n\u003cp>Formalmente é diferenciação automática em modo reverso, que é o modo eficiente quando há muitas entradas e uma saída escalar — exatamente o caso de ML.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Backprop é o algoritmo de otimização?\"\u003c/em> — Não. Backprop calcula o gradiente; quem usa esse gradiente para atualizar os pesos é o otimizador, SGD ou Adam. Confundir os dois é comum.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Posso inicializar todos os pesos em zero?\"\u003c/em> — Não. Todos os neurônios de uma camada receberiam o mesmo gradiente e permaneceriam idênticos indefinidamente — a simetria nunca quebra e a camada inteira se comporta como um único neurônio. É preciso inicialização aleatória, e a escala importa: He para ReLU, Xavier para tanh, porque elas preservam a variância do sinal e do gradiente ao longo das camadas.\u003c/p>"},{"titleHtml":"🟡 O que é vanishing gradient e como se resolve?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> O gradiente de uma camada inicial é o produto de muitos fatores, pela regra da cadeia através das camadas. Se esses fatores são consistentemente menores que 1, o produto decai exponencialmente com a profundidade e as primeiras camadas praticamente não recebem sinal de aprendizado. Sigmoide agrava isso porque sua derivada máxima é 0.25 — em dez camadas, o fator acumulado já é da ordem de 10⁻⁶.\u003c/p>\n\u003cp>As soluções atacam pontos diferentes da cadeia. \u003cstrong>ReLU e GELU\u003c/strong> têm derivada próxima de 1 na região ativa, então não encolhem. \u003cstrong>Inicialização He ou Xavier\u003c/strong> escala os pesos para preservar a variância do sinal entre camadas. \u003cstrong>Normalização\u003c/strong> mantém as ativações numa faixa bem-comportada. E a mais importante, \u003cstrong>conexões residuais\u003c/strong>: escrever \u003ccode>y = x + F(x)\u003c/code> faz o gradiente em relação a \u003ccode>x\u003c/code> incluir um termo igual a 1, que é a derivada da identidade, então existe um caminho pelo qual o gradiente flui sem ser multiplicado por pesos. Isso quebra a cadeia puramente multiplicativa e é o que tornou possível treinar redes de centenas de camadas.\u003c/p>\n\u003cp>Para o lado da explosão, gradient clipping por norma, que é padrão em RNNs e em treino de LLMs.\u003c/p>"},{"titleHtml":"🟡 O que batch normalization faz e por que ajuda?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Normaliza cada feature usando média e variância do mini-batch e depois aplica escala e deslocamento aprendíveis, que permitem à rede desfazer a normalização se for útil.\u003c/p>\n\u003cp>Os efeitos observados são consistentes: permite learning rates maiores, acelera muito a convergência, reduz a sensibilidade à inicialização, e regulariza um pouco, porque o ruído das estatísticas do batch age como perturbação.\u003c/p>\n\u003cp>Sobre o mecanismo, eu seria honesto: a explicação original foi redução do internal covariate shift, mas trabalhos posteriores questionaram isso e argumentam que o efeito principal é \u003cstrong>suavizar a superfície de perda\u003c/strong>, tornando os gradientes mais previsíveis e permitindo passos maiores. A explicação original é contestada e eu não a apresentaria como fato estabelecido.\u003c/p>\n\u003cp>\u003cstrong>Follow-up que quase sempre vem:\u003c/strong> \u003cem>\"Como o BatchNorm se comporta na inferência?\"\u003c/em> — Diferente do treino. No treino usa as estatísticas do batch atual; na inferência usa médias móveis acumuladas durante o treino, porque na inferência pode haver um único exemplo e não existe batch. Isso significa que o mesmo modelo produz saídas diferentes em modo de treino e de avaliação, e esquecer de colocar o modelo em modo de avaliação é um dos bugs mais comuns em PyTorch. O sintoma é métrica de validação inexplicavelmente ruim ou instável.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"Por que transformers usam LayerNorm em vez de BatchNorm?\"\u003c/em> — Porque LayerNorm normaliza sobre as features de cada exemplo individualmente, o que o torna independente do tamanho do batch, idêntico em treino e inferência, e naturalmente compatível com sequências de comprimento variável. BatchNorm degrada com batches pequenos, complica treino distribuído porque as estatísticas são por dispositivo, e não lida bem com padding em sequências. Os LLMs modernos usam RMSNorm, que é uma simplificação do LayerNorm sem subtração de média, mais barata e empiricamente equivalente. E aplicam a normalização \u003cstrong>antes\u003c/strong> do bloco (pre-norm), mantendo o caminho residual limpo, o que é bem mais estável em grande profundidade que o post-norm original.\u003c/p>"},{"titleHtml":"🟡 O que é dropout e por que funciona?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Durante o treino, zera aleatoriamente cada ativação com probabilidade p. Na inferência todos os neurônios ficam ativos — na prática usa-se inverted dropout, escalando por \u003ccode>1/(1-p)\u003c/code> no treino para que a inferência não precise de ajuste.\u003c/p>\n\u003cp>Funciona por três razões complementares. \u003cstrong>Impede coadaptação\u003c/strong>: um neurônio não pode depender da presença de outro específico, porque aquele pode sumir, o que força representações redundantes e distribuídas. \u003cstrong>É um ensemble implícito\u003c/strong>: cada máscara define uma sub-rede diferente, e treinar com dropout aproxima treinar exponencialmente muitas sub-redes com pesos compartilhados. E é \u003cstrong>injeção de ruído\u003c/strong>, que é uma forma geral de regularização.\u003c/p>\n\u003cp>Valores típicos de 0.2 a 0.5 em camadas densas. Em convolucionais é menos usado, porque ativações vizinhas são espacialmente correlacionadas e zerar posições isoladas remove pouca informação — usam-se variantes que zeram regiões inteiras. Em transformers, valores baixos, e em treino de LLMs de larga escala frequentemente zero, porque com corpus enorme e essencialmente uma passada pelos dados, overfitting não é o gargalo.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Por que a perda de treino é maior que a de validação?\"\u003c/em> — Provavelmente porque dropout e data augmentation estão ativos no treino e desligados na avaliação. A perda de treino é medida com a rede degradada de propósito. É esperado, não é bug.\u003c/p>"},{"titleHtml":"🟡 Por que CNNs funcionam bem em imagens?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Por três vieses indutivos que correspondem à estrutura real de imagens.\u003c/p>\n\u003cp>\u003cstrong>Localidade\u003c/strong> — padrões visuais relevantes são locais: uma borda envolve pixels vizinhos, não pixels em cantos opostos. Filtros pequenos codificam isso.\u003c/p>\n\u003cp>\u003cstrong>Compartilhamento de pesos\u003c/strong> — o mesmo filtro é aplicado em todas as posições, o que impõe que uma feature útil numa região é útil em qualquer região. Isso reduz parâmetros drasticamente: uma camada convolucional tem \u003ccode>k·k·C_in·C_out\u003c/code> parâmetros, \u003cstrong>independente do tamanho da imagem\u003c/strong>, contra bilhões numa camada densa equivalente.\u003c/p>\n\u003cp>\u003cstrong>Equivariância a translação\u003c/strong> — deslocar a entrada desloca as ativações correspondentemente; com pooling isso vira invariância aproximada, que é o comportamento desejado, já que um gato é um gato em qualquer canto da foto.\u003c/p>\n\u003cp>Somando isso, a profundidade cria uma hierarquia: o campo receptivo cresce com as camadas, então as primeiras detectam bordas e texturas e as profundas detectam partes e objetos.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"Vision Transformers substituíram CNNs?\"\u003c/em> — Não substituíram; a escolha depende do regime. ViTs superam CNNs quando há muitos dados ou pré-treinamento em grande escala, justamente porque têm viés indutivo mais fraco e podem aprender relações que a convolução restringe. Em regimes de dados menores, o viés indutivo mais forte da CNN compensa a falta de dados e ela costuma vencer. Na prática de 2026 convivem: híbridos, ConvNets modernizadas e ViTs, e a decisão é por escala de dados, latência e orçamento.\u003c/p>"},{"titleHtml":"🟡 Por que RNNs foram substituídas por transformers?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Três razões, e a primeira é a decisiva.\u003c/p>\n\u003cp>\u003cstrong>Sequencialidade.\u003c/strong> Numa RNN, o passo \u003ccode>t\u003c/code> depende do \u003ccode>t-1\u003c/code>, então não existe paralelização ao longo do comprimento da sequência. Como o treino moderno depende de saturar GPUs, isso é um teto estrutural. Transformers processam todas as posições em paralelo no treino.\u003c/p>\n\u003cp>\u003cstrong>Caminho longo entre posições distantes.\u003c/strong> Ligar a posição 1 à posição 500 numa RNN exige 500 passos e o sinal degrada pelo caminho. Em atenção, qualquer par de posições está a distância 1, o que torna dependências longas diretamente representáveis.\u003c/p>\n\u003cp>\u003cstrong>Gargalo de informação.\u003c/strong> A RNN comprime todo o passado num vetor de estado de tamanho fixo. A atenção acessa todas as representações anteriores diretamente.\u003c/p>\n\u003cp>LSTMs mitigaram o problema de gradiente com o caminho aditivo do estado de célula, mas não resolveram a sequencialidade nem o gargalo.\u003c/p>\n\u003cp>RNNs ainda têm nicho: inferência em streaming com estado de tamanho constante, sequências muito longas com restrição de memória, e dispositivos de borda. Vale mencionar que modelos de espaço de estados como a família Mamba retomam a inferência recorrente de custo constante com treino paralelizável, o que é uma linha de pesquisa ativa.\u003c/p>"},{"titleHtml":"🔴 Explique o que a LSTM resolve e como.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Ela resolve o vanishing gradient em sequências longas. Numa RNN simples, o gradiente através do tempo envolve multiplicar repetidamente pela mesma matriz de recorrência, então ele decai ou explode exponencialmente com a distância temporal — dependências de longo prazo não são aprendidas.\u003c/p>\n\u003cp>A LSTM introduz um \u003cstrong>estado de célula\u003c/strong> cuja atualização é essencialmente \u003cstrong>aditiva\u003c/strong>, controlada por gates: o forget gate decide quanto do estado anterior manter, o input gate decide quanto da nova informação escrever, e o output gate decide quanto expor.\u003c/p>\n\u003cp>O ponto conceitual é que o caminho do estado da célula é aditivo, não uma multiplicação repetida por uma matriz de pesos. Isso é o mesmo princípio das conexões residuais e é o que permite o gradiente fluir por centenas de passos sem decair. Os gates são o mecanismo, mas o \u003cstrong>caminho aditivo é a razão\u003c/strong>.\u003c/p>\n\u003cp>A GRU simplifica para dois gates sem estado de célula separado, com menos parâmetros e desempenho geralmente comparável — a escolha entre elas é empírica.\u003c/p>"},{"titleHtml":"🔴 Sua rede não está aprendendo — a perda não se move. Como você depura?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Eu seguiria uma sequência que vai do mais provável e mais barato para o mais caro.\u003c/p>\n\u003cp>\u003cstrong>Primeiro, o teste decisivo: tentar overfittar deliberadamente um lote pequeno\u003c/strong>, tipo 32 exemplos, até a perda chegar perto de zero. Se a rede não consegue nem decorar 32 exemplos, existe um bug estrutural e nenhum ajuste de hiperparâmetro vai resolver. Esse teste isola o problema em minutos.\u003c/p>\n\u003cp>Se ela não consegue, eu procuraria por: \u003cstrong>rótulos desconectados da perda\u003c/strong> — embaralhamento errado, índice trocado, dimensão errada; \u003cstrong>learning rate essencialmente zero\u003c/strong>, ou um schedule que zerou logo no início; \u003cstrong>gradientes que não chegam\u003c/strong> — verificaria as normas de gradiente por camada, e gradiente zero nas camadas iniciais indica saturação ou ReLUs mortas; \u003cstrong>problema na inicialização\u003c/strong>, escala muito pequena colapsando o sinal; \u003cstrong>esquecer de zerar os gradientes\u003c/strong> entre passos, o que em alguns frameworks acumula; e \u003cstrong>a saída da rede não conectada à perda\u003c/strong> por um erro de forma que passa silenciosamente por broadcasting.\u003c/p>\n\u003cp>Se ela \u003cstrong>consegue\u003c/strong> overfittar o lote pequeno mas não aprende no dataset completo, o problema é outro: dados ruidosos ou rótulos errados, learning rate inadequado para o regime completo, capacidade insuficiente, features sem sinal, ou normalização ausente com features em escalas muito diferentes.\u003c/p>\n\u003cp>Eu também plotaria a distribuição das ativações e dos gradientes por camada. Ativações todas em zero indicam ReLUs mortas; ativações saturando indicam problema de escala ou inicialização.\u003c/p>"},{"titleHtml":"🔴 Como você decide o tamanho e a profundidade da rede?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Empiricamente e por etapas, mas com um princípio: eu começaria por \u003cstrong>arquiteturas conhecidas para o domínio\u003c/strong>, não do zero. A chance de eu projetar uma arquitetura melhor que uma padrão bem estabelecida é baixa, e o tempo é melhor gasto em dados e validação.\u003c/p>\n\u003cp>O procedimento que eu usaria: começar com algo comprovadamente capaz de overfittar os dados, confirmar que ele overfitta — o que prova que a capacidade é suficiente e o pipeline funciona — e então \u003cstrong>adicionar regularização até a validação parar de melhorar\u003c/strong>. Essa ordem é melhor que começar pequeno, porque ela separa claramente \"não tenho capacidade\" de \"não estou generalizando\".\u003c/p>\n\u003cp>Sobre profundidade versus largura: profundidade dá composição hierárquica e é o que permite representar certas funções com exponencialmente menos parâmetros que redes rasas. Largura dá capacidade por camada. Na prática, ir fundo exige residuais e normalização, sem os quais a otimização quebra. Também consideraria o regime de dados: com poucos dados, capacidade grande sem regularização forte é veneno, e usar um modelo pré-treinado com fine-tuning quase sempre bate treinar do zero.\u003c/p>\n\u003cp>E consideraria as \u003cstrong>restrições de produção desde o início\u003c/strong> — latência, memória, custo por inferência. Um modelo 2% melhor que não cabe no orçamento de latência é um modelo pior. Frequentemente a resposta certa é o menor modelo que atende o requisito de qualidade, e não o melhor modelo possível.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Por que redes neurais precisam de \u003cstrong>ativações não-lineares\u003c/strong>?","a":["Sem ela, compor camadas lineares dá uma transformação linear","Sem ela, o cálculo do gradiente fica numericamente instável","Sem ela, ocorre overflow numérico nas camadas mais profundas","Sem ela, não é possível usar batches maiores no treinamento"],"c":0,"e":"Cem camadas sem ativação colapsam numa única matriz, equivalente a uma regressão linear com muito mais parâmetros e nenhum poder extra — é a razão inteira de a profundidade fazer sentido. Instabilidade numérica e overflow existem, mas são problemas de escala e inicialização, não a justificativa da não-linearidade."},{"n":"🟢","levelName":"basico","q":"O que acontece se você inicializar \u003cstrong>todos os pesos em zero\u003c/strong>?","a":["A perda vira NaN logo no primeiro passo da otimização feita","A rede treina normalmente, apenas convergindo bem mais devagar","Todos os neurônios recebem o mesmo gradiente e seguem idênticos","O modelo converge direto para o mínimo global da perda usada"],"c":2,"e":"A simetria nunca quebra e a camada inteira se comporta como um único neurônio. É preciso inicialização aleatória com escala adequada: He para ReLU e Xavier para tanh, que preservam a variância do sinal entre camadas. Não há convergência lenta nem explosão — simplesmente não há aprendizado diferenciado."},{"n":"🟡","levelName":"intermediario","q":"O que é o problema de \u003cstrong>dying ReLU\u003c/strong>?","a":["A ReLU não pode ser usada na camada de saída de nenhum modelo","A ReLU satura em valores altos, tal como acontece com a sigmoide","A ReLU explode o gradiente em redes com muitas camadas fundas","Entradas sempre negativas zeram saída e gradiente para sempre"],"c":3,"e":"O neurônio morre em definitivo, e a causa típica é learning rate alto empurrando o bias para o negativo; Leaky ReLU e PReLU resolvem dando gradiente no lado negativo. A ReLU não satura para valores altos, ao contrário da sigmoide, e não é ela que causa explosão — isso vem do produto de fatores maiores que um."},{"n":"🟡","levelName":"intermediario","q":"Qual mecanismo das \u003cstrong>conexões residuais\u003c/strong> resolve o vanishing gradient?","a":["Elas reduzem o número efetivo de camadas que precisam treinar","O caminho aditivo dá ao gradiente uma rota sem multiplicação","Elas normalizam as ativações na entrada de cada bloco novo","Elas dobram o learning rate aplicado às camadas iniciais"],"c":1,"e":"Escrever a saída como entrada mais função faz o gradiente incluir o termo da identidade, quebrando a cadeia puramente multiplicativa — é o que permitiu treinar centenas de camadas, e o mesmo princípio do estado de célula da LSTM. Normalizar é papel do LayerNorm ou do BatchNorm, que são complementares e não a mesma coisa."},{"n":"🟡","levelName":"intermediario","q":"Por que o \u003cstrong>BatchNorm\u003c/strong> se comporta diferente em treino e inferência?","a":["A inferência usa batches maiores e estatísticas mais estáveis","Ele é desligado automaticamente quando o modelo entra em eval","No treino usa o batch; na inferência, médias móveis acumuladas","Não há diferença: o comportamento é idêntico nos dois modos"],"c":2,"e":"Na inferência pode haver um único exemplo, sem batch para estimar estatística, então usam-se as médias acumuladas — e por isso o mesmo modelo produz saídas diferentes nos dois modos, com esquecer o modo de avaliação sendo bug clássico. Ele não é desligado, apenas troca a fonte da estatística, e o dropout tem pegadinha equivalente."},{"n":"🟡","levelName":"intermediario","q":"Por que transformers usam \u003cstrong>LayerNorm\u003c/strong> em vez de BatchNorm?","a":["Normaliza por exemplo: independe do batch e trata sequências","É mais antigo e por isso mais testado em produção que o outro","O BatchNorm não é diferenciável e não permite backpropagation","O LayerNorm elimina a necessidade de conexões residuais no bloco"],"c":0,"e":"Sendo por exemplo, ele independe do tamanho do batch, é idêntico em treino e inferência e lida com comprimento variável — enquanto o BatchNorm degrada com batch pequeno e não lida bem com padding. Os LLMs modernos usam RMSNorm em pre-norm. O BatchNorm é diferenciável, e residuais continuam necessárias."},{"n":"🟡","levelName":"intermediario","q":"A perda de \u003cstrong>treino está maior\u003c/strong> que a de validação. O que provavelmente explica?","a":["Existe um bug grave no split entre treino e validação usados","Dropout e augmentation agem só no treino, degradando a medida","É sinal claro de overfitting severo na etapa de treinamento","O learning rate está baixo demais para o tamanho do modelo"],"c":1,"e":"A perda de treino é medida com a rede deliberadamente degradada, então esse é o único cenário da tabela de diagnóstico em que treino pior que validação é esperado. Overfitting produz o contrário, treino bem melhor que validação; e se não houver dropout nem augmentation, aí sim vale investigar bug ou validação mais fácil."},{"n":"🔴","levelName":"avancado","q":"O que a \u003cstrong>LSTM\u003c/strong> resolve em relação à RNN simples, e por qual mecanismo?","a":["Reduz o número total de parâmetros em relação à RNN simples","Paraleliza o processamento ao longo do eixo temporal da série","Elimina a necessidade de manter qualquer estado oculto interno","Estado de célula com atualização aditiva controlada por gates"],"c":3,"e":"Na RNN o gradiente multiplica repetidamente a mesma matriz e decai exponencialmente com a distância; o caminho aditivo é a razão de a LSTM funcionar, e os gates são o mecanismo. Ela não paraleliza o tempo — essa limitação é justamente o que motivou os transformers — mantém estado e tem mais parâmetros, não menos."}]},{"id":"08","fullTitle":"08 — Deep Learning Moderno","shortTitle":"Deep Learning Moderno","subtitle":"Transformers e atenção, embeddings, transfer learning, fine-tuning, LLMs e RAG (conceitual).","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-atenção-o-mecanismo\">1.1 Atenção — o mecanismo\u003c/h3>\n\u003cp>\u003cstrong>O problema que ela resolve:\u003c/strong> numa RNN, para relacionar a posição 1 com a 500, o sinal atravessa 500 passos e degrada. Atenção permite que qualquer posição consulte diretamente qualquer outra, em um único passo.\u003c/p>\n\u003cp>\u003cstrong>A formulação:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Attention(Q, K, V) = softmax( QKᵀ / √d_k ) V\u003c/code>\u003c/pre>\n\u003cp>A analogia de \u003cstrong>recuperação de informação\u003c/strong> é a melhor forma de explicar:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Query (Q)\u003c/strong> — o que esta posição está procurando.\u003c/li>\u003cli>\u003cstrong>Key (K)\u003c/strong> — o que cada posição oferece como \"rótulo indexável\".\u003c/li>\u003cli>\u003cstrong>Value (V)\u003c/strong> — o conteúdo que cada posição entrega se for selecionada.\u003c/li>\u003c/ul>\n\u003cp>\u003ccode>QKᵀ\u003c/code> calcula a compatibilidade entre cada query e cada key por produto interno. O softmax transforma isso em pesos que somam 1 — uma média ponderada suave sobre todas as posições. Multiplicar por \u003ccode>V\u003c/code> produz a saída: uma mistura dos conteúdos, ponderada pela relevância. É uma \u003cstrong>busca em dicionário diferenciável e suave\u003c/strong>, em que em vez de recuperar uma entrada você recupera uma combinação convexa de todas.\u003c/p>\n\u003cp>\u003cstrong>Por que dividir por \u003ccode>√d_k\u003c/code> — a pergunta favorita.\u003c/strong> Se os componentes de q e k são aproximadamente independentes com média 0 e variância 1, o produto interno de dois vetores de dimensão \u003ccode>d_k\u003c/code> tem variância \u003ccode>d_k\u003c/code>, portanto desvio-padrão \u003ccode>√d_k\u003c/code>. Com \u003ccode>d_k = 64\u003c/code>, os scores variam numa faixa de ordem 8; com \u003ccode>d_k\u003c/code> maior, ainda mais. Scores grandes empurram o softmax para uma distribuição quase one-hot, e nessa região \u003cstrong>o gradiente do softmax é praticamente zero\u003c/strong> — o treino estagna. Dividir por \u003ccode>√d_k\u003c/code> normaliza a variância dos scores para ~1, mantendo o softmax numa região com gradiente saudável. Note que é um argumento \u003cstrong>sobre gradientes\u003c/strong>, não sobre \"estabilidade numérica\" genérica.\u003c/p>\n\u003cp>\u003cstrong>Self-attention vs cross-attention:\u003c/strong> em self-attention, Q, K e V vêm da mesma sequência (cada posição olha as outras do mesmo texto). Em cross-attention, Q vem de uma sequência e K/V de outra — é o mecanismo que conecta o decoder ao encoder em tradução, e o que conecta texto e imagem em modelos multimodais.\u003c/p>\n\u003cp>\u003cstrong>Multi-head attention:\u003c/strong> em vez de uma atenção com dimensão \u003ccode>d\u003c/code>, usam-se \u003ccode>h\u003c/code> cabeças com dimensão \u003ccode>d/h\u003c/code> cada, em paralelo, e concatenam-se as saídas. A razão: uma única atenção produz \u003cstrong>uma\u003c/strong> distribuição de pesos, forçando uma média que mistura tudo. Múltiplas cabeças permitem que diferentes subespaços capturem diferentes tipos de relação simultaneamente (uma cabeça pode acompanhar concordância sintática, outra correferência). O custo total é aproximadamente o mesmo, porque as dimensões são divididas.\u003c/p>\n\u003cp>\u003cstrong>Máscara causal:\u003c/strong> em modelos autoregressivos, a posição \u003ccode>t\u003c/code> não pode ver posições futuras. Implementa-se somando \u003ccode>-∞\u003c/code> aos scores das posições proibidas antes do softmax, o que zera os pesos correspondentes. É isso que permite treinar em paralelo sobre a sequência inteira e ainda assim ter um modelo que gera token a token.\u003c/p>\n\u003cp>\u003cstrong>Complexidade:\u003c/strong> \u003ccode>O(n²·d)\u003c/code> em tempo e \u003ccode>O(n²)\u003c/code> em memória para a matriz de atenção, onde \u003ccode>n\u003c/code> é o comprimento da sequência. \u003cstrong>É o gargalo central de contexto longo.\u003c/strong> Mitigações: atenção esparsa/local, aproximações lineares, e — o que de fato se usa em produção — \u003cstrong>FlashAttention\u003c/strong>, que não muda a complexidade assintótica mas reorganiza o cálculo em blocos que cabem na memória rápida da GPU, evitando materializar a matriz \u003ccode>n×n\u003c/code> inteira. Ganho grande de memória e velocidade sem aproximação.\u003c/p>\n\u003ch3 id=\"h-1-2-a-arquitetura-transformer\">1.2 A arquitetura Transformer\u003c/h3>\n\u003cp>Um bloco típico (na variante pre-norm, que é o padrão moderno):\u003c/p>\n\u003cpre>\u003ccode>x = x + Attention(Norm(x))\nx = x + FFN(Norm(x))\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Componentes e o porquê de cada um:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Conexões residuais\u003c/strong> em torno de cada sub-camada — permitem o gradiente fluir por dezenas ou centenas de blocos.\u003c/li>\u003cli>\u003cstrong>Normalização\u003c/strong> (LayerNorm, ou RMSNorm nos modelos modernos) — estabiliza. Aplicada \u003cstrong>antes\u003c/strong> do bloco (pre-norm), o que é notavelmente mais estável em grande profundidade que o post-norm do artigo original, que exigia warmup cuidadoso para não divergir.\u003c/li>\u003cli>\u003cstrong>Feed-forward por posição\u003c/strong> — duas camadas densas aplicadas independentemente a cada posição, com dimensão interna tipicamente 4× a do modelo. É onde está a maior parte dos parâmetros. Nos LLMs modernos usa-se \u003cstrong>SwiGLU\u003c/strong> em vez de ReLU/GELU simples.\u003c/li>\u003cli>\u003cstrong>Codificação posicional\u003c/strong> — atenção é \u003cstrong>permutação-equivariante\u003c/strong>: sem informação de posição, ela vê a sequência como um conjunto e \"o cachorro mordeu o homem\" seria idêntico a \"o homem mordeu o cachorro\". Isso é essencial e cai com frequência.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Codificação posicional, evolução:\u003c/strong> o artigo original usou senoides fixas; depois vieram embeddings posicionais aprendidos; o padrão em 2026 é \u003cstrong>RoPE (Rotary Position Embedding)\u003c/strong>, que codifica posição \u003cstrong>rotacionando\u003c/strong> os vetores de query e key por um ângulo proporcional à posição. A propriedade elegante: o produto interno entre duas posições depende apenas da \u003cstrong>diferença\u003c/strong> entre elas, o que dá uma noção de posição relativa naturalmente e se estende melhor a sequências mais longas do que o modelo viu no treino (especialmente com técnicas de interpolação/escala da base). Alternativa também usada: ALiBi, que aplica um viés linear proporcional à distância.\u003c/p>\n\u003cp>\u003cstrong>Três famílias:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Encoder-only\u003c/strong> (BERT) — atenção bidirecional, pré-treinado com masked language modeling. Bom para \u003cstrong>compreensão\u003c/strong>: classificação, NER, embeddings de sentença. Não gera texto naturalmente.\u003c/li>\u003cli>\u003cstrong>Decoder-only\u003c/strong> (família GPT, Llama, e essencialmente todos os LLMs modernos) — atenção causal, pré-treinado prevendo o próximo token. \u003cstrong>É a arquitetura dominante em 2026\u003c/strong>, porque a mesma formulação serve para geração e — via prompting — para praticamente qualquer tarefa.\u003c/li>\u003cli>\u003cstrong>Encoder-decoder\u003c/strong> (T5, modelos de tradução) — o encoder codifica a entrada, o decoder gera atendendo ao encoder por cross-attention. Natural para seq2seq com entrada e saída bem distintas.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>O que define um LLM moderno em 2026\u003c/strong> (útil para mostrar atualidade): decoder-only com \u003cstrong>RoPE\u003c/strong>, \u003cstrong>RMSNorm\u003c/strong> em pre-norm, \u003cstrong>SwiGLU\u003c/strong> na camada feed-forward, \u003cstrong>Grouped-Query Attention\u003c/strong> (GQA) e, cada vez mais, \u003cstrong>Mixture-of-Experts\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>GQA\u003c/strong> merece explicação porque é uma pergunta boa: em multi-head attention padrão, cada cabeça tem suas próprias keys e values, e durante a geração todos precisam ser mantidos no \u003cstrong>KV cache\u003c/strong> — cujo tamanho cresce com o comprimento do contexto e domina a memória de inferência. GQA mantém muitas cabeças de query mas \u003cstrong>compartilha um número menor de cabeças de key/value entre grupos\u003c/strong>, reduzindo o KV cache proporcionalmente com perda mínima de qualidade. É otimização de \u003cstrong>inferência\u003c/strong>, não de treino, e saber essa distinção é o que impressiona.\u003c/p>\n\u003cp>\u003cstrong>MoE\u003c/strong> (Mixture-of-Experts): substitui a camada feed-forward densa por muitos \"experts\", ativando apenas alguns por token via uma rede de roteamento. Resultado: \u003cstrong>muito mais parâmetros (capacidade) por unidade de FLOPs de inferência\u003c/strong>. O custo é complexidade de treino (balanceamento de carga entre experts) e de memória (todos os parâmetros precisam estar disponíveis, mesmo que poucos sejam usados por token).\u003c/p>\n\u003ch3 id=\"h-1-3-embeddings\">1.3 Embeddings\u003c/h3>\n\u003cp>\u003cstrong>A ideia:\u003c/strong> representar objetos discretos (palavras, usuários, produtos, imagens) como vetores densos num espaço onde \u003cstrong>proximidade geométrica corresponde a similaridade semântica\u003c/strong>. Contraste com one-hot, onde todos os itens são igualmente distantes entre si e a dimensão é o tamanho do vocabulário.\u003c/p>\n\u003cp>\u003cstrong>Evolução conceitual:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Word2Vec / GloVe\u003c/strong> — embeddings \u003cstrong>estáticos\u003c/strong>: uma palavra tem um vetor, independentemente do contexto. Aprendidos pela hipótese distribucional (\"uma palavra é caracterizada pela companhia que mantém\"). Limitação decisiva: \"banco\" de sentar e \"banco\" financeiro têm o mesmo vetor.\u003c/li>\u003cli>\u003cstrong>Embeddings contextuais\u003c/strong> (BERT em diante) — o vetor de um token depende da frase inteira. Resolve polissemia.\u003c/li>\u003cli>\u003cstrong>Embeddings de sentença/documento\u003c/strong> — modelos treinados especificamente para que a similaridade entre vetores de textos inteiros seja significativa, tipicamente com \u003cstrong>aprendizado contrastivo\u003c/strong> (aproximar pares relacionados, afastar não relacionados). Este é o tipo usado em busca semântica e RAG.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Ponto que cai muito:\u003c/strong> os embeddings de um LLM generativo \u003cstrong>não são automaticamente bons embeddings de recuperação\u003c/strong>. Modelos causais são treinados para prever o próximo token, não para que a média dos estados ocultos seja um bom resumo semântico. Modelos de embedding dedicados são treinados com objetivo contrastivo e superam consistentemente esse uso improvisado.\u003c/p>\n\u003cp>\u003cstrong>Similaridade:\u003c/strong> \u003cstrong>cosseno\u003c/strong> é o padrão, porque mede ângulo e ignora magnitude — o que é desejável, já que a magnitude frequentemente reflete frequência ou comprimento, não semântica. Se os vetores estão normalizados a norma 1, cosseno e produto interno são equivalentes, e a ordenação por distância euclidiana é a mesma. Vale saber isso porque bancos vetoriais oferecem as três métricas e a escolha precisa ser consistente com o treino do modelo.\u003c/p>\n\u003cp>\u003cstrong>Embeddings de entidades em sistemas de produção\u003c/strong> (usuários, itens): aprendidos por fatoração de matrizes ou como camada de embedding numa rede. Capturam similaridade comportamental e são a base de recomendação moderna, além de resolverem o problema de alta cardinalidade categórica.\u003c/p>\n\u003ch3 id=\"h-1-4-transfer-learning-e-fine-tuning\">1.4 Transfer learning e fine-tuning\u003c/h3>\n\u003cp>\u003cstrong>Premissa:\u003c/strong> representações aprendidas numa tarefa com muitos dados transferem para tarefas relacionadas com poucos dados. É o que tornou deep learning viável fora de laboratórios com datasets gigantes.\u003c/p>\n\u003cp>\u003cstrong>Estratégias, em ordem de custo:\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>Feature extraction\u003c/strong> — congelar o modelo pré-treinado, usá-lo como extrator de embeddings, treinar só um classificador leve por cima. Barato, rápido, e o padrão quando há \u003cstrong>muito poucos dados\u003c/strong> (centenas de exemplos). O modelo grande não pode overfittar porque não é atualizado.\u003c/li>\u003cli>\u003cstrong>Fine-tuning completo\u003c/strong> — atualizar todos os pesos, com learning rate \u003cstrong>muito menor\u003c/strong> que o de treino do zero (tipicamente 10 a 100× menor), para não destruir as representações aprendidas. Precisa de mais dados e mais computação.\u003c/li>\u003cli>\u003cstrong>Fine-tuning parcial\u003c/strong> — congelar as primeiras camadas (features gerais: bordas, sintaxe) e treinar as últimas (features específicas da tarefa). Compromisso razoável.\u003c/li>\u003cli>\u003cstrong>PEFT (Parameter-Efficient Fine-Tuning)\u003c/strong> — o padrão para LLMs.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>LoRA\u003c/strong> é o método PEFT que você precisa saber explicar. A ideia: em vez de atualizar a matriz \u003ccode>W\u003c/code> (que pode ter centenas de milhões de parâmetros), aprender uma \u003cstrong>atualização de baixo posto\u003c/strong> \u003ccode>ΔW = BA\u003c/code>, onde \u003ccode>B\u003c/code> é \u003ccode>d×r\u003c/code> e \u003ccode>A\u003c/code> é \u003ccode>r×k\u003c/code> com \u003ccode>r\u003c/code> pequeno (4 a 64). Treina-se apenas \u003ccode>A\u003c/code> e \u003ccode>B\u003c/code>; \u003ccode>W\u003c/code> fica congelada. Resultado: uma fração minúscula dos parâmetros treináveis, muito menos memória de otimizador, e adaptadores pequenos que podem ser trocados por tarefa e \u003cstrong>mesclados de volta em \u003ccode>W\u003c/code> na inferência\u003c/strong>, sem custo adicional de latência. A justificativa: a atualização necessária para adaptar a uma tarefa específica tende a ter \u003cstrong>posto intrínseco baixo\u003c/strong>. \u003cstrong>QLoRA\u003c/strong> combina LoRA com quantização do modelo base (4 bits), permitindo fine-tuning de modelos grandes em uma única GPU.\u003c/p>\n\u003cp>\u003cstrong>Catastrophic forgetting:\u003c/strong> ao ajustar para uma nova tarefa, o modelo pode perder capacidade nas anteriores. Mitigações: learning rate baixo, congelamento parcial, misturar dados das tarefas antigas no treino, ou métodos PEFT — que, ao manter os pesos base intactos, mitigam o problema estruturalmente.\u003c/p>\n\u003cp>\u003cstrong>Quando fine-tuning é a escolha errada:\u003c/strong> quando o que falta é \u003cstrong>conhecimento factual atualizável\u003c/strong> (aí é RAG), quando há pouquíssimos exemplos (few-shot prompting resolve mais barato), e quando o requisito muda com frequência (fine-tuning cria um artefato estático que precisa ser refeito).\u003c/p>\n\u003ch3 id=\"h-1-5-llms-conceitos-que-caem\">1.5 LLMs — conceitos que caem\u003c/h3>\n\u003cp>\u003cstrong>Pré-treinamento:\u003c/strong> prever o próximo token em corpus massivo. Objetivo auto-supervisionado, o que remove o gargalo de rotulagem. É onde a maior parte da capacidade é adquirida.\u003c/p>\n\u003cp>\u003cstrong>Pós-treinamento / alinhamento:\u003c/strong> tipicamente \u003cstrong>SFT\u003c/strong> (fine-tuning supervisionado em exemplos de instrução-resposta), seguido de otimização por preferências — \u003cstrong>RLHF\u003c/strong> (treinar um modelo de recompensa a partir de comparações humanas e otimizar a política com PPO, com penalidade KL contra o modelo de referência) ou \u003cstrong>DPO\u003c/strong> (otimiza diretamente sobre os pares de preferência, sem treinar um modelo de recompensa separado nem rodar RL, o que é bem mais simples e estável). O risco central desta etapa é \u003cstrong>reward hacking\u003c/strong>: otimizar excessivamente contra um proxy imperfeito degrada a qualidade real.\u003c/p>\n\u003cp>\u003cstrong>Tokenização:\u003c/strong> modelos operam sobre subpalavras (BPE, WordPiece, SentencePiece), não caracteres nem palavras. Consequências práticas que aparecem em entrevista: explica por que LLMs erram em contar letras ou manipular caracteres (eles não veem letras), por que idiomas sub-representados no tokenizador consomem mais tokens e portanto custam mais, e por que números são tratados de forma inconsistente.\u003c/p>\n\u003cp>\u003cstrong>Contexto e KV cache:\u003c/strong> durante a geração, recomputar a atenção sobre todo o prefixo a cada token seria quadrático. O KV cache guarda as keys e values já computadas, tornando cada novo token linear no comprimento. O custo é \u003cstrong>memória\u003c/strong>, que cresce linearmente com o contexto e com o número de camadas — e é o principal limitador de throughput em serving. É o que GQA, MQA e atenção multi-latente atacam.\u003c/p>\n\u003cp>\u003cstrong>Decodificação:\u003c/strong> \u003cem>greedy\u003c/em> (sempre o token mais provável — determinístico e repetitivo), \u003cem>beam search\u003c/em> (mantém k hipóteses — bom para tradução, ruim para texto aberto porque produz saídas insossas), \u003cem>sampling\u003c/em> com \u003cstrong>temperatura\u003c/strong> (T&lt;1 concentra a distribuição e torna o texto mais conservador; T&gt;1 achata e torna mais diverso e mais errático), \u003cstrong>top-k\u003c/strong> e \u003cstrong>top-p / nucleus\u003c/strong> (restringem o conjunto de candidatos antes de amostrar, cortando a cauda de tokens absurdos).\u003c/p>\n\u003cp>\u003cstrong>Alucinação:\u003c/strong> o modelo é otimizado para produzir continuações \u003cstrong>plausíveis\u003c/strong>, não verdadeiras. Não existe, no objetivo de treino, um termo que penalize falsidade especificamente. Mitigações: RAG (ancorar em fontes recuperadas), pedir citações verificáveis, decodificação mais conservadora, verificação por ferramentas externas, e — a mais robusta em produção — desenhar o sistema para que respostas sem fonte sejam recusadas.\u003c/p>\n\u003cp>\u003cstrong>Escala:\u003c/strong> as leis de escala descrevem como a perda cai previsivelmente com parâmetros, dados e computação. A lição prática mais duradoura é que modelos anteriores eram \u003cstrong>subtreinados em dados\u003c/strong> para seu tamanho: para um orçamento fixo de computação, existe uma proporção mais eficiente entre tamanho do modelo e volume de tokens. Isso mudou a prática de \"modelos cada vez maiores\" para \"modelos bem dimensionados treinados em muito mais dados\", com foco crescente em custo de inferência.\u003c/p>\n\u003ch3 id=\"h-1-6-rag-retrieval-augmented-generation\">1.6 RAG (Retrieval-Augmented Generation)\u003c/h3>\n\u003cp>\u003cstrong>O problema:\u003c/strong> o conhecimento de um LLM está congelado nos pesos, é caro de atualizar, não é atribuível a fontes, e não cobre dados privados.\u003c/p>\n\u003cp>\u003cstrong>A solução:\u003c/strong> recuperar documentos relevantes em tempo de consulta e incluí-los no prompt como contexto.\u003c/p>\n\u003cp>\u003cstrong>O pipeline, e cada etapa é uma pergunta potencial:\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Indexação (offline):\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>Chunking\u003c/strong> — dividir documentos em pedaços. \u003cstrong>É a decisão mais subestimada do pipeline.\u003c/strong> Chunks pequenos são precisos mas perdem contexto; grandes trazem contexto mas diluem o sinal do embedding e consomem janela. Estratégias: tamanho fixo com sobreposição, divisão por estrutura (seções, parágrafos), ou chunking semântico. Um padrão útil é indexar chunks pequenos para a busca mas recuperar a janela maior ao redor para o contexto.\u003c/li>\u003cli>\u003cstrong>Embedding\u003c/strong> — transformar cada chunk num vetor com um modelo de embedding dedicado.\u003c/li>\u003cli>\u003cstrong>Indexação vetorial\u003c/strong> — armazenar num índice ANN (HNSW, IVF-PQ). Isso é kNN aproximado, com o trade-off explícito entre recall da busca e latência.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Consulta (online):\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>Processamento da query\u003c/strong> — reescrita, expansão, ou decomposição em subperguntas. Importa porque a pergunta do usuário raramente é formulada como o documento que a responde.\u003c/li>\u003cli>\u003cstrong>Recuperação\u003c/strong> — busca vetorial e/ou léxica.\u003c/li>\u003cli>\u003cstrong>Reranking\u003c/strong> — reordenar os top-N candidatos com um modelo mais caro e preciso (tipicamente um \u003cstrong>cross-encoder\u003c/strong>, que processa query e documento juntos e portanto captura interações que embeddings independentes não capturam). Esta é a etapa com \u003cstrong>melhor relação custo-benefício\u003c/strong> para melhorar qualidade, e citá-la é um sinal claro de experiência prática.\u003c/li>\u003cli>\u003cstrong>Geração\u003c/strong> — montar o prompt com o contexto e instruções, incluindo instrução explícita para responder apenas com base nas fontes e admitir quando não sabe.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Busca híbrida\u003c/strong> — combinar busca densa (embeddings, boa para similaridade semântica e paráfrase) com busca esparsa (BM25, boa para termos exatos, códigos de produto, nomes próprios, siglas). Fundir com Reciprocal Rank Fusion. \u003cstrong>Quase sempre supera qualquer uma isolada\u003c/strong>, e é a resposta esperada para \"como você melhoraria a recuperação?\".\u003c/p>\n\u003cp>\u003cstrong>RAG vs fine-tuning — a pergunta clássica:\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>RAG\u003c/th>\u003cth>Fine-tuning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Melhor para\u003c/td>\u003ctd>Conhecimento factual, dados que mudam, dados privados\u003c/td>\u003ctd>Formato, estilo, tom, comportamento, tarefas específicas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Atualização\u003c/td>\u003ctd>Reindexar (barato, imediato)\u003c/td>\u003ctd>Retreinar (caro, lento)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Atribuição\u003c/td>\u003ctd>Natural (você tem as fontes)\u003c/td>\u003ctd>Impossível\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Custo de inferência\u003c/td>\u003ctd>Maior (contexto longo + busca)\u003c/td>\u003ctd>Igual ao base\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Alucinação\u003c/td>\u003ctd>Reduz (mas não elimina)\u003c/td>\u003ctd>Não reduz\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Regra: \u003cstrong>RAG para o que o modelo precisa saber; fine-tuning para como ele deve se comportar.\u003c/strong> E não são excludentes — a combinação é comum.\u003c/p>\n\u003cp>\u003cstrong>Onde RAG falha, na prática:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Recuperação ruim\u003c/strong> — se o documento certo não é recuperado, nenhuma qualidade de LLM salva. \u003cstrong>A maioria das falhas de RAG é falha de recuperação, não de geração\u003c/strong>, e dizer isso é a resposta que separa quem construiu de quem leu sobre.\u003c/li>\u003cli>\u003cstrong>Chunking inadequado\u003c/strong> — a informação está partida entre chunks e nenhum sozinho responde.\u003c/li>\u003cli>\u003cstrong>Contexto contraditório\u003c/strong> — documentos conflitantes, e o modelo escolhe arbitrariamente.\u003c/li>\u003cli>\u003cstrong>Perda no meio (lost in the middle)\u003c/strong> — com contexto longo, informação no meio do prompt tende a ser menos utilizada que a do início e do fim. Argumento a favor de recuperar poucos chunks bons em vez de muitos medianos.\u003c/li>\u003cli>\u003cstrong>O modelo ignora o contexto\u003c/strong> e responde pelo conhecimento paramétrico, inclusive contradizendo a fonte.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Avaliação de RAG\u003c/strong> — precisa ser em duas camadas, e responder isso bem é diferencial: \u003cstrong>recuperação\u003c/strong> (recall@k, MRR, NDCG — o documento certo está entre os recuperados?) e \u003cstrong>geração\u003c/strong> (fidelidade ao contexto/*groundedness*, relevância da resposta, correção factual). Frameworks de avaliação com LLM como juiz são comuns, mas exigem validação contra julgamento humano num conjunto de referência, senão você está confiando num avaliador não calibrado.\u003c/p>\n\u003ch3 id=\"h-1-7-agentes-e-uso-de-ferramentas-contexto-de-2026\">1.7 Agentes e uso de ferramentas (contexto de 2026)\u003c/h3>\n\u003cp>Vale conhecer conceitualmente, porque aparece cada vez mais: LLMs que decidem chamar funções externas (busca, código, APIs), observam o resultado e iteram. Padrões: \u003cem>tool calling\u003c/em> estruturado, laços de raciocínio-ação, e memória entre passos. Os problemas práticos que valem citar: \u003cstrong>acúmulo de erro\u003c/strong> ao longo de trajetórias longas, \u003cstrong>custo e latência\u003c/strong> de múltiplas chamadas, \u003cstrong>avaliação difícil\u003c/strong> (o resultado depende de uma trajetória inteira, não de uma saída), e \u003cstrong>segurança\u003c/strong> — prompt injection através de conteúdo recuperado ou de saídas de ferramentas é um risco real quando o agente tem permissões de escrita.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Explicar atenção sem explicar Q, K e V como papéis distintos.\u003c/strong> Recitar a fórmula sem a intuição de recuperação não convence.\u003c/p>\n\u003cp>\u003cstrong>Dizer que o \u003ccode>√d_k\u003c/code> é \"para estabilidade numérica\".\u003c/strong> É sobre a variância dos scores e a saturação do gradiente do softmax.\u003c/p>\n\u003cp>\u003cstrong>Esquecer que atenção não tem noção de ordem.\u003c/strong> Codificação posicional é essencial, não um detalhe.\u003c/p>\n\u003cp>\u003cstrong>Achar que transformers eliminaram o problema de contexto longo.\u003c/strong> A complexidade quadrática continua sendo o gargalo; FlashAttention melhora constantes e memória, não a assintótica.\u003c/p>\n\u003cp>\u003cstrong>Confundir FlashAttention com atenção aproximada.\u003c/strong> Ela é exata; a otimização é de acesso à memória.\u003c/p>\n\u003cp>\u003cstrong>Usar os estados ocultos de um LLM generativo como embeddings de recuperação.\u003c/strong> Modelos de embedding dedicados, treinados com objetivo contrastivo, são consistentemente melhores.\u003c/p>\n\u003cp>\u003cstrong>Achar que fine-tuning é o jeito de adicionar conhecimento factual.\u003c/strong> É caro, congela de novo, não dá atribuição e não garante absorção. RAG resolve melhor.\u003c/p>\n\u003cp>\u003cstrong>Tratar RAG como solução completa para alucinação.\u003c/strong> Reduz, não elimina — o modelo pode ignorar ou contradizer o contexto.\u003c/p>\n\u003cp>\u003cstrong>Ignorar a etapa de reranking.\u003c/strong> É frequentemente a melhoria de melhor custo-benefício em RAG.\u003c/p>\n\u003cp>\u003cstrong>Não avaliar recuperação e geração separadamente.\u003c/strong> Sem isso você não sabe o que consertar.\u003c/p>\n\u003cp>\u003cstrong>Usar LLM como juiz sem validar contra humano.\u003c/strong> É um avaliador não calibrado, com vieses conhecidos de comprimento e posição.\u003c/p>\n\u003cp>\u003cstrong>Achar que contexto maior é sempre melhor.\u003c/strong> Contexto longo dilui, custa mais, e há evidência de que informação no meio é menos utilizada.\u003c/p>\n\u003cp>\u003cstrong>Ignorar tokenização ao explicar limitações.\u003c/strong> Contagem de letras, manipulação de caracteres e custo por idioma são consequências diretas dela.\u003c/p>\n\u003cp>\u003cstrong>Falar de modelos específicos e versões em vez de mecanismos.\u003c/strong> Modelos mudam a cada trimestre; mecanismos duram. Entrevistadores testam mecanismos.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 O que é um embedding?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É a representação de um objeto discreto — palavra, usuário, produto — como um vetor denso de dimensão relativamente baixa, aprendido de forma que \u003cstrong>proximidade geométrica corresponda a similaridade semântica ou comportamental\u003c/strong>. É o contraste com one-hot, onde a dimensão é o tamanho do vocabulário e todos os itens são igualmente distantes entre si, sem nenhuma noção de que \"cachorro\" está mais perto de \"gato\" do que de \"guarda-chuva\".\u003c/p>\n\u003cp>Embeddings estáticos como Word2Vec dão um vetor por palavra independentemente do contexto, o que falha com polissemia. Embeddings contextuais, de modelos tipo BERT em diante, produzem um vetor que depende da frase inteira. E para busca e RAG usa-se um terceiro tipo: modelos de embedding de sentença treinados com objetivo contrastivo, para que a similaridade entre textos inteiros seja significativa.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Qual métrica de similaridade?\"\u003c/em> — Cosseno é o padrão, porque mede ângulo e ignora magnitude, que costuma refletir frequência ou comprimento e não semântica. Se os vetores estão normalizados, cosseno e produto interno são equivalentes e a ordenação por distância euclidiana coincide. O importante é usar a métrica consistente com a que o modelo foi treinado.\u003c/p>"},{"titleHtml":"🟢 O que transfer learning e por que funciona?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É reutilizar um modelo treinado numa tarefa com muitos dados como ponto de partida para outra tarefa com poucos dados. Funciona porque as representações de baixo e médio nível são amplamente compartilhadas entre tarefas do mesmo domínio: bordas e texturas servem para qualquer tarefa de visão, e estrutura sintática e semântica geral servem para qualquer tarefa de linguagem. O que é específico da tarefa costuma estar nas camadas finais.\u003c/p>\n\u003cp>Na prática eu escolheria a estratégia pelo volume de dados: com centenas de exemplos, congelo o modelo e treino só uma cabeça leve por cima, porque o modelo grande não pode overfittar se não é atualizado; com milhares, fine-tuning das últimas camadas ou completo, com learning rate muito menor que o de treino do zero para não destruir o que foi aprendido; e para LLMs, métodos PEFT como LoRA, que treinam uma fração minúscula dos parâmetros.\u003c/p>"},{"titleHtml":"🟡 Explique o mecanismo de atenção.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É uma busca em dicionário diferenciável. Cada posição gera três vetores: uma \u003cstrong>query\u003c/strong>, que representa o que ela está procurando; uma \u003cstrong>key\u003c/strong>, que representa o que ela oferece; e um \u003cstrong>value\u003c/strong>, que é o conteúdo que ela entrega se for selecionada.\u003c/p>\n\u003cp>O produto interno entre a query de uma posição e as keys de todas as outras mede compatibilidade. O softmax transforma essas compatibilidades em pesos que somam 1, e a saída é a média ponderada dos values. Ou seja, em vez de recuperar uma entrada de um dicionário, você recupera uma combinação convexa de todas, ponderada por relevância — e isso é diferenciável, então dá para aprender.\u003c/p>\n\u003cp>Isso resolve o problema estrutural das RNNs: qualquer par de posições fica a distância 1, em vez de precisar atravessar centenas de passos recorrentes. E como não há dependência sequencial, o treino paraleliza sobre a sequência inteira.\u003c/p>\n\u003cp>\u003cstrong>Follow-up quase garantido:\u003c/strong> \u003cem>\"Por que dividir por raiz de d_k?\"\u003c/em> — Se os componentes de q e k são aproximadamente independentes com variância 1, o produto interno de vetores de dimensão \u003ccode>d_k\u003c/code> tem variância \u003ccode>d_k\u003c/code>, então desvio-padrão \u003ccode>√d_k\u003c/code>. Scores grandes empurram o softmax para uma distribuição quase one-hot, e nessa região \u003cstrong>o gradiente do softmax é praticamente zero\u003c/strong>, o que faz o treino estagnar. Dividir por \u003ccode>√d_k\u003c/code> normaliza a variância dos scores e mantém o softmax numa faixa com gradiente saudável. É um argumento sobre gradiente, não sobre overflow numérico.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Por que múltiplas cabeças?\"\u003c/em> — Uma única atenção produz uma distribuição de pesos, forçando o modelo a fazer uma média que mistura tipos diferentes de relação. Múltiplas cabeças operam em subespaços diferentes e podem capturar relações distintas em paralelo — uma acompanhando dependência sintática, outra correferência. O custo total é praticamente o mesmo, porque a dimensão é dividida entre as cabeças.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"Qual a complexidade e como se lida com contexto longo?\"\u003c/em> — Quadrática no comprimento da sequência, tanto em tempo quanto na memória da matriz de atenção. É o gargalo central de contexto longo. As abordagens são atenção esparsa ou local, aproximações lineares, e — a que de fato se usa em produção — FlashAttention, que não muda a complexidade assintótica mas reorganiza o cálculo em blocos que cabem na memória rápida da GPU, evitando materializar a matriz inteira. Ganho grande de memória e velocidade, sem aproximar nada.\u003c/p>"},{"titleHtml":"🟡 Por que transformers precisam de codificação posicional?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Porque a atenção é permutação-equivariante: ela calcula compatibilidades entre pares de vetores sem nenhuma noção de ordem. Sem informação posicional, o modelo veria a sequência como um conjunto, e \"o cachorro mordeu o homem\" seria idêntico a \"o homem mordeu o cachorro\".\u003c/p>\n\u003cp>O artigo original usava senoides fixas de frequências diferentes; depois vieram embeddings posicionais aprendidos. O padrão em 2026 é \u003cstrong>RoPE\u003c/strong>, que codifica a posição rotacionando os vetores de query e key por um ângulo proporcional à posição. A propriedade elegante é que o produto interno entre duas posições passa a depender apenas da \u003cstrong>diferença\u003c/strong> entre elas, o que dá posição relativa naturalmente e se estende melhor a contextos mais longos do que o modelo viu no treino, especialmente com técnicas de escala da base. ALiBi é a alternativa também usada, aplicando um viés linear proporcional à distância.\u003c/p>"},{"titleHtml":"🟡 RAG ou fine-tuning?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Resolvem problemas diferentes, e a regra que eu uso é: \u003cstrong>RAG para o que o modelo precisa saber; fine-tuning para como ele deve se comportar.\u003c/strong>\u003c/p>\n\u003cp>RAG quando o problema é conhecimento — fatos específicos, dados privados, informação que muda. Ele permite atualizar reindexando, em vez de retreinando; permite atribuição a fontes, o que é frequentemente um requisito e não um extra; e reduz alucinação ao ancorar a resposta em texto recuperado.\u003c/p>\n\u003cp>Fine-tuning quando o problema é comportamento — formato de saída consistente, tom, seguir um estilo específico, ou uma tarefa especializada que o modelo base não executa bem. Fine-tuning não é bom mecanismo para injetar fatos: é caro, o conhecimento fica congelado de novo, não dá atribuição, e não há garantia de que o fato foi de fato absorvido.\u003c/p>\n\u003cp>Não são excludentes, e a combinação é comum: fine-tuning para o modelo seguir o formato e usar as fontes corretamente, RAG para fornecer os fatos. E antes de qualquer um dos dois eu tentaria \u003cstrong>prompting bem feito com few-shot\u003c/strong>, porque frequentemente resolve por uma fração do custo — começar pelo mais barato é parte da resposta.\u003c/p>"},{"titleHtml":"🟡 Como você melhoraria um sistema de RAG que está retornando respostas ruins?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Primeiro eu \u003cstrong>diagnosticaria em qual etapa está o problema\u003c/strong>, porque as correções são completamente diferentes. O teste: pegar as consultas ruins e verificar se o documento correto está entre os recuperados. Se não está, é falha de \u003cstrong>recuperação\u003c/strong>; se está e a resposta ainda é ruim, é falha de \u003cstrong>geração\u003c/strong>. Na minha experiência a maioria das falhas de RAG é de recuperação.\u003c/p>\n\u003cp>\u003cstrong>Se é recuperação\u003c/strong>, na ordem de custo-benefício: adicionar \u003cstrong>reranking\u003c/strong> com um cross-encoder sobre os top-N candidatos, que é a intervenção com melhor retorno porque o cross-encoder processa query e documento juntos e captura interações que embeddings independentes não capturam; adotar \u003cstrong>busca híbrida\u003c/strong>, combinando densa com BM25, porque a densa erra em termos exatos, siglas e códigos de produto e a léxica cobre exatamente isso; revisar o \u003cstrong>chunking\u003c/strong>, que é a decisão mais subestimada — chunks grandes demais diluem o embedding, pequenos demais perdem contexto, e uma tática eficaz é indexar chunks pequenos mas recuperar a janela ao redor; e trocar o \u003cstrong>modelo de embedding\u003c/strong> por um treinado para recuperação no idioma e domínio certos, ou reescrever a query, porque a pergunta do usuário raramente é formulada como o documento que a responde.\u003c/p>\n\u003cp>\u003cstrong>Se é geração\u003c/strong>, o modelo tem o contexto certo e ainda erra: eu reforçaria a instrução para responder apenas com base nas fontes e admitir quando não há informação suficiente; reduziria o número de chunks, porque contexto longo demais dilui e existe o efeito de a informação no meio do prompt ser menos utilizada; pediria \u003cstrong>citação explícita\u003c/strong> de trechos, o que tanto melhora a fidelidade quanto torna o erro auditável; e reduziria a temperatura.\u003c/p>\n\u003cp>E eu montaria uma \u003cstrong>avaliação em duas camadas\u003c/strong> — métricas de recuperação como recall@k e MRR, e métricas de geração como fidelidade ao contexto e correção — sobre um conjunto fixo de perguntas com respostas de referência. Sem isso, toda melhoria é impressão.\u003c/p>"},{"titleHtml":"🟡 O que é LoRA e por que ele é usado?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> LoRA é fine-tuning eficiente em parâmetros. Em vez de atualizar a matriz de pesos inteira, ele aprende uma \u003cstrong>atualização de baixo posto\u003c/strong>: \u003ccode>ΔW = BA\u003c/code>, onde \u003ccode>B\u003c/code> e \u003ccode>A\u003c/code> são matrizes finas com posto \u003ccode>r\u003c/code> pequeno, tipicamente entre 4 e 64. Os pesos originais ficam congelados e só \u003ccode>A\u003c/code> e \u003ccode>B\u003c/code> são treinados.\u003c/p>\n\u003cp>Os ganhos: uma fração minúscula de parâmetros treináveis, o que reduz drasticamente a memória do otimizador — que é o que normalmente domina o consumo em fine-tuning; adaptadores pequenos que podem ser armazenados e trocados por tarefa, servindo muitas variantes a partir de um único modelo base; e, na inferência, o adaptador pode ser \u003cstrong>mesclado de volta\u003c/strong> na matriz original, então \u003cstrong>não há custo adicional de latência\u003c/strong>.\u003c/p>\n\u003cp>A justificativa conceitual é que a atualização necessária para adaptar um modelo a uma tarefa específica tende a ter posto intrínseco baixo — a adaptação vive num subespaço pequeno. QLoRA combina isso com quantização do modelo base em 4 bits, o que viabiliza fine-tuning de modelos grandes numa única GPU.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Quando fine-tuning completo é melhor?\"\u003c/em> — Quando a adaptação exige mudança substancial de capacidade, não só de estilo — por exemplo um domínio muito distante do pré-treinamento, ou um idioma pouco representado. E quando há dados abundantes e computação disponível. Para a maioria dos casos práticos de adaptação de comportamento, LoRA atinge qualidade comparável por uma fração do custo.\u003c/p>"},{"titleHtml":"🔴 Por que LLMs alucinam e como você mitiga?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Porque o objetivo de treino é produzir continuações \u003cstrong>plausíveis\u003c/strong> dada a distribuição do corpus, não continuações \u003cstrong>verdadeiras\u003c/strong>. Não existe, na função de perda, um termo que penalize falsidade especificamente — uma frase falsa e fluente tem perda baixa se for estatisticamente típica. Some-se a isso que o modelo não tem um mecanismo interno de verificação, não tem acesso a fontes, e o pós-treinamento por preferências pode inclusive \u003cstrong>piorar\u003c/strong> o problema, porque respostas confiantes e completas costumam ser preferidas por avaliadores humanos em relação a \"não sei\" — o que ensina o modelo a preencher lacunas com confiança.\u003c/p>\n\u003cp>Mitigações, em camadas. \u003cstrong>Ancorar em fontes com RAG\u003c/strong> é a mais efetiva para conhecimento factual, junto com instrução explícita para responder só com base no contexto e admitir insuficiência. \u003cstrong>Exigir citações verificáveis\u003c/strong>, o que torna a alucinação detectável em vez de invisível. \u003cstrong>Verificação externa\u003c/strong> por ferramentas — executar o código, consultar a API, checar o cálculo. \u003cstrong>Decodificação mais conservadora\u003c/strong>, temperatura baixa para tarefas factuais. \u003cstrong>Estimativa de confiança\u003c/strong>, usando consistência entre múltiplas amostragens como sinal — respostas que variam entre amostras são menos confiáveis.\u003c/p>\n\u003cp>E o ponto de desenho de sistema: \u003cstrong>a mitigação mais robusta é arquitetural, não do modelo\u003c/strong>. Desenhar o produto para que a resposta sem fonte seja recusada, para que o usuário veja o trecho de origem, e para que ações consequentes exijam confirmação. Você não elimina alucinação no modelo; você constrói um sistema em que ela é detectada e contida.\u003c/p>"},{"titleHtml":"🔴 Como você avaliaria um sistema baseado em LLM?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Em camadas, porque não existe uma métrica única, e o erro comum é ficar só na camada de baixo.\u003c/p>\n\u003cp>\u003cstrong>Camada 1 — componentes com verdade objetiva.\u003c/strong> Se há recuperação, avaliar recuperação separadamente com recall@k, MRR, NDCG. Se há chamada de ferramenta, avaliar se a ferramenta certa foi chamada com os argumentos certos. Essas partes têm resposta certa e devem ser medidas isoladamente, porque falhas aqui são as mais fáceis de corrigir e as mais fáceis de confundir com falha do modelo.\u003c/p>\n\u003cp>\u003cstrong>Camada 2 — tarefas com resposta verificável.\u003c/strong> Onde existe saída checável — código que roda, JSON que valida contra schema, resposta numérica, classificação — construir um conjunto de teste e medir exatamente. É a camada mais confiável e a que eu maximizaria.\u003c/p>\n\u003cp>\u003cstrong>Camada 3 — qualidade aberta.\u003c/strong> Aqui uso um LLM como juiz com rubrica explícita e critérios separados (fidelidade ao contexto, relevância, completude, formato). Com duas ressalvas obrigatórias: o juiz precisa ser \u003cstrong>validado contra julgamento humano\u003c/strong> num subconjunto, medindo concordância, senão você está confiando num avaliador não calibrado; e ele tem vieses conhecidos, como preferir respostas longas e preferir a primeira opção apresentada, o que se mitiga alternando a ordem e controlando comprimento.\u003c/p>\n\u003cp>\u003cstrong>Camada 4 — avaliação humana\u003c/strong> em amostra, com rubrica e múltiplos avaliadores, medindo concordância entre eles. Cara, mas é a âncora de verdade das camadas acima.\u003c/p>\n\u003cp>\u003cstrong>Camada 5 — online.\u003c/strong> A/B test com métricas de produto: taxa de resolução, retomadas de conversa, escalonamento para humano, satisfação, e custo por interação. É o que de fato decide.\u003c/p>\n\u003cp>Eu adicionaria duas coisas que costumam faltar: \u003cstrong>testes de regressão\u003c/strong> com um conjunto fixo de casos que rodam a cada mudança de prompt ou modelo, porque sistemas com LLM regridem de forma silenciosa e não-óbvia; e \u003cstrong>avaliação adversarial\u003c/strong> — prompt injection, casos de borda, entradas fora de domínio — especialmente se o sistema tem acesso a ferramentas com efeitos colaterais.\u003c/p>"},{"titleHtml":"🔴 Explique a diferença entre modelos encoder-only, decoder-only e encoder-decoder. Por que decoder-only dominou?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> \u003cstrong>Encoder-only\u003c/strong>, como BERT, usa atenção bidirecional — cada token vê todo o contexto dos dois lados — e é pré-treinado prevendo tokens mascarados. Isso dá representações muito boas para \u003cstrong>compreensão\u003c/strong>: classificação, NER, embeddings. Não gera texto naturalmente, porque o objetivo de treino não é autoregressivo.\u003c/p>\n\u003cp>\u003cstrong>Decoder-only\u003c/strong> usa atenção causal, cada token vê apenas os anteriores, e é pré-treinado prevendo o próximo token.\u003c/p>\n\u003cp>\u003cstrong>Encoder-decoder\u003c/strong> codifica a entrada bidirecionalmente e gera a saída atendendo ao encoder via cross-attention. É natural quando entrada e saída são objetos claramente distintos, como em tradução.\u003c/p>\n\u003cp>Decoder-only dominou por várias razões que se somam. \u003cstrong>O objetivo de treino é o mais simples e mais eficiente em dados\u003c/strong>: cada token do corpus fornece um sinal de treino, enquanto no masked language modeling só os tokens mascarados (tipicamente 15%) contribuem. \u003cstrong>A mesma formulação serve para tudo\u003c/strong> — com prompting, classificação, extração e geração viram todas continuação de texto, o que elimina a necessidade de arquiteturas por tarefa. \u003cstrong>A arquitetura é mais simples\u003c/strong>, sem cross-attention e sem dois conjuntos de parâmetros, o que facilita escalar. E \u003cstrong>a inferência incremental com KV cache é natural\u003c/strong>, o que importa muito em serving.\u003c/p>\n\u003cp>A nuance honesta: encoder-only continua sendo a escolha certa para embeddings e classificação de alto volume, porque é muito menor e mais barato para essas tarefas específicas. Usar um LLM generativo para classificar sentimento em milhões de documentos é desperdiçar duas ordens de grandeza de custo.\u003c/p>"},{"titleHtml":"🔴 Um LLM em produção está lento e caro. O que você faz?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Eu atacaria em quatro frentes, medindo primeiro onde está o custo — tokens de entrada, tokens de saída, ou número de chamadas.\u003c/p>\n\u003cp>\u003cstrong>Reduzir tokens.\u003c/strong> Prompts costumam crescer sem controle. Comprimir instruções, remover few-shot examples redundantes, e — no caso de RAG — recuperar menos chunks e melhores, o que reduz custo e frequentemente \u003cstrong>melhora\u003c/strong> qualidade pelo efeito de diluição em contexto longo. Limitar o comprimento máximo da saída.\u003c/p>\n\u003cp>\u003cstrong>Reduzir chamadas.\u003c/strong> \u003cstrong>Cache\u003c/strong> é o maior ganho isolado: cache exato para consultas repetidas, cache semântico para consultas parecidas, e \u003cstrong>prompt caching\u003c/strong> para prefixos fixos, que a maioria dos provedores oferece e que reduz muito o custo de instruções longas repetidas.\u003c/p>\n\u003cp>\u003cstrong>Reduzir o tamanho do modelo.\u003c/strong> Roteamento por dificuldade — um modelo pequeno atende a maioria dos casos e escala para o grande apenas quando necessário, com um classificador ou heurística decidindo. \u003cstrong>Destilação\u003c/strong> — treinar um modelo menor com saídas do maior na sua distribuição real de consultas, o que frequentemente atinge qualidade próxima numa tarefa restrita por uma fração do custo. \u003cstrong>Quantização\u003c/strong> para 8 ou 4 bits, se você mesmo serve o modelo.\u003c/p>\n\u003cp>\u003cstrong>Otimizar o serving\u003c/strong>, se for infraestrutura própria: continuous batching, PagedAttention para gerenciar o KV cache com menos fragmentação, GQA ou MQA para reduzir o tamanho do cache, e speculative decoding, que usa um modelo pequeno para propor tokens e o grande apenas para verificar — o que acelera sem alterar a distribuição de saída.\u003c/p>\n\u003cp>Sobre latência percebida: \u003cstrong>streaming\u003c/strong> muda a experiência mais que qualquer otimização, porque o tempo até o primeiro token importa mais que o tempo total para o usuário.\u003c/p>\n\u003cp>E eu estabeleceria antes o que estou disposto a perder: cada uma dessas medidas tem um custo em qualidade, então preciso de um conjunto de avaliação fixo para medir a degradação e decidir conscientemente, em vez de descobrir por reclamação de usuário.\u003c/p>"}],"quiz":[{"n":"🟡","levelName":"intermediario","q":"Por que a atenção divide os scores por \u003cstrong>√d_k\u003c/strong>?","a":["Scores grandes saturam o softmax numa região de gradiente nulo","Evita overflow numérico ao exponenciar valores muito grandes","Normaliza os values antes da soma ponderada feita na atenção","Compensa a quantidade de cabeças usada na atenção multi-head"],"c":0,"e":"O produto interno de vetores de dimensão d_k tem variância d_k, e scores grandes empurram o softmax para quase one-hot, onde o gradiente some e o treino estagna. É um argumento sobre gradiente, e responder estabilidade numérica é o que os entrevistadores descontam. O número de cabeças já é compensado pela divisão da dimensão."},{"n":"🟢","levelName":"basico","q":"Por que transformers precisam de \u003cstrong>codificação posicional\u003c/strong>?","a":["Serve para reduzir o tamanho do vocabulário do tokenizador","Serve para acelerar o treinamento em sequências muito longas","A atenção é permutação-equivariante e não enxerga a ordem","É requisito para poder aplicar a máscara causal no decoder"],"c":2,"e":"Sem posição, a sequência vira um conjunto e as frases o cachorro mordeu o homem e o homem mordeu o cachorro ficam idênticas. O padrão moderno é RoPE, em que o produto interno passa a depender só da diferença entre posições. Não acelera treino, não afeta vocabulário, e a máscara causal funciona de forma independente."},{"n":"🟡","levelName":"intermediario","q":"Qual o propósito da \u003cstrong>multi-head attention\u003c/strong>?","a":["Substituir a camada feed-forward que viria logo em seguida","Aumentar o número total de parâmetros treináveis do bloco","Reduzir a complexidade quadrática da atenção no comprimento","Subespaços diferentes capturam tipos distintos de relação"],"c":3,"e":"Uma atenção única produz uma só distribuição de pesos, forçando uma média que mistura sintaxe, correferência e tudo mais. Como a dimensão é dividida entre as cabeças, o custo total fica praticamente o mesmo, então não é sobre aumentar parâmetros. A complexidade continua quadrática, e a feed-forward permanece no bloco."},{"n":"🟡","levelName":"intermediario","q":"O que é o \u003cstrong>KV cache\u003c/strong> e qual seu custo?","a":["Guarda prompts repetidos entre usuários para reaproveitar custo","Guarda keys e values já computados, tornando cada token linear","Guarda embeddings de documentos usados na etapa de recuperação","Guarda os gradientes acumulados durante o ajuste fino do modelo"],"c":1,"e":"Sem ele, cada novo token exigiria recomputar a atenção sobre todo o prefixo, o que seria quadrático; o custo é memória crescendo com contexto e camadas, e é isso que GQA e MQA atacam. Cache de prompt entre usuários existe, mas é outra técnica; embeddings de documento pertencem ao RAG; e gradiente não vive na inferência."},{"n":"🟡","levelName":"intermediario","q":"Quando usar \u003cstrong>RAG\u003c/strong> e quando usar \u003cstrong>fine-tuning\u003c/strong>?","a":["São intercambiáveis: a escolha se resolve apenas pelo custo","RAG para mudar o estilo; ajuste fino para acrescentar fatos","RAG para o que o modelo precisa saber; ajuste para como agir","Ajuste fino substitui RAG sempre que houver GPU disponível"],"c":2,"e":"Fine-tuning é ruim para injetar fato: é caro, congela o conhecimento de novo, não dá atribuição e não garante absorção — por isso a inversão de papéis aparece numa das opções. Os dois combinam bem, e antes de qualquer um deles vale tentar prompting com poucos exemplos, que resolve muito por fração do custo."},{"n":"🟡","levelName":"intermediario","q":"Como o \u003cstrong>LoRA\u003c/strong> consegue ajuste barato sem custo extra de latência?","a":["Aprende atualização de baixo posto e mescla os pesos ao final","Quantiza o modelo base para quatro bits durante o atendimento","Congela todas as camadas exceto a última, que é então retreinada","Destila o modelo grande num outro modelo menor e mais barato"],"c":0,"e":"Treinam-se apenas duas matrizes finas, o que derruba a memória do otimizador, e o adaptador pode ser mesclado na matriz original. Quantizar o base é o QLoRA, que combina as duas ideias; congelar tudo menos a última camada é outra estratégia, bem mais limitada; e destilação treina um modelo diferente."},{"n":"🔴","levelName":"avancado","q":"O que o \u003cstrong>FlashAttention\u003c/strong> faz?","a":["Aproxima a atenção com esparsidade, aceitando perda de qualidade","Reorganiza o cálculo exato em blocos na memória rápida da GPU","Reduz a complexidade da atenção para n log n no comprimento","Comprime o KV cache com perda controlada durante a geração"],"c":1,"e":"É exato, não aproximado, e a otimização é de acesso à memória: evita materializar a matriz n por n inteira. A complexidade assintótica continua quadrática — o ganho é de constante e de memória. Confundir com atenção aproximada ou com compressão de cache é a armadilha da pergunta."},{"n":"🔴","levelName":"avancado","q":"Num sistema de RAG com respostas ruins, qual o \u003cstrong>primeiro diagnóstico\u003c/strong>?","a":["Fazer ajuste fino do gerador com exemplos do próprio domínio","Trocar o modelo por um maior e elevar a temperatura da geração","Aumentar para cinquenta o número de trechos enviados ao modelo","Ver se o documento certo foi recuperado; se sim, reranking ajuda"],"c":3,"e":"Se o documento certo não é recuperado, nenhuma qualidade de gerador salva — e a maioria das falhas é de recuperação. O cross-encoder processa consulta e documento juntos, capturando o que embeddings independentes não capturam, e busca híbrida complementa. Mais trechos diluem o contexto e ajuste fino não corrige recuperação."}]},{"id":"09","fullTitle":"09 — Aprendizado Não-Supervisionado","shortTitle":"Aprendizado Não-Supervisionado","subtitle":"Clustering (k-means, DBSCAN, hierárquico), avaliação de clusters, redução de dimensionalidade não-linear, detecção de anomalias.","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-o-problema-estrutural\">1.1 O problema estrutural\u003c/h3>\n\u003cp>Sem rótulos, \u003cstrong>não existe critério objetivo de acerto\u003c/strong>. O algoritmo otimiza um
