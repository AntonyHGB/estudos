\u003c/ul>\n\u003ch3 id=\"h-1-9-métricas-de-ranking-essenciais-para-busca-e-recomendação\">1.9 Métricas de ranking (essenciais para busca e recomendação)\u003c/h3>\n\u003cp>Quando a saída é uma \u003cstrong>lista ordenada\u003c/strong>, precision/recall globais não capturam o que importa: a \u003cstrong>posição\u003c/strong> do item relevante.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Precision@k / Recall@k\u003c/strong> — restritos aos k primeiros. Simples e o que o negócio geralmente entende.\u003c/li>\u003cli>\u003cstrong>MAP\u003c/strong> (Mean Average Precision) — média da precision calculada em cada posição de acerto. Considera ordem, mas trata relevância como binária.\u003c/li>\u003cli>\u003cstrong>NDCG\u003c/strong> — o padrão. Usa ganho por relevância graduada com \u003cstrong>desconto logarítmico por posição\u003c/strong> (um acerto na posição 1 vale mais que na posição 10) e normaliza pelo ranking ideal, o que torna comparável entre consultas com números diferentes de itens relevantes.\u003c/li>\u003cli>\u003cstrong>MRR\u003c/strong> — recíproco da posição do primeiro acerto. Apropriado quando existe essencialmente uma resposta certa (busca navegacional, QA).\u003c/li>\u003c/ul>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Reportar acurácia sem comparar com o baseline da classe majoritária.\u003c/strong> É o erro mais eliminatório do tópico. Sempre diga qual seria a acurácia de prever sempre a classe mais comum.\u003c/p>\n\u003cp>\u003cstrong>Confundir os denominadores de precision e recall.\u003c/strong> Precision divide pelo que o modelo previu; recall divide pelo que existe na realidade. Trocar isso na entrevista é fatal porque é o conceito mais básico.\u003c/p>\n\u003cp>\u003cstrong>Usar ROC-AUC sob desbalanceamento severo.\u003c/strong> O FPR é diluído pela massa de TN. Use PR-AUC.\u003c/p>\n\u003cp>\u003cstrong>Achar que AUC alto significa boas probabilidades.\u003c/strong> AUC mede ordenação e é invariante a transformações monótonas. Não diz nada sobre calibração.\u003c/p>\n\u003cp>\u003cstrong>Otimizar limiar no conjunto de teste.\u003c/strong> Infla o resultado. Limiar é hiperparâmetro: escolhe-se na validação.\u003c/p>\n\u003cp>\u003cstrong>Reportar F1 sem dizer o limiar.\u003c/strong> F1 avalia o par (modelo, limiar). Sem o limiar o número não é reproduzível nem comparável.\u003c/p>\n\u003cp>\u003cstrong>Reportar micro-F1 em multiclasse achando que é diferente de acurácia.\u003c/strong> Em rótulo único, são iguais.\u003c/p>\n\u003cp>\u003cstrong>Usar MAPE com valores próximos de zero.\u003c/strong> Explode e é assimétrica. Prefira WAPE ou MAE.\u003c/p>\n\u003cp>\u003cstrong>Comparar R² entre datasets diferentes.\u003c/strong> R² depende da variância da variável-alvo naquele dataset. 0.3 pode ser excelente ou terrível dependendo do domínio.\u003c/p>\n\u003cp>\u003cstrong>Esquecer que reamostragem quebra calibração.\u003c/strong> SMOTE, undersampling e class weights alteram a prevalência aprendida. Recalibre se precisar de probabilidades.\u003c/p>\n\u003cp>\u003cstrong>Avaliar sistema de ranking com métricas de classificação.\u003c/strong> Ignora posição, que é o que o produto inteiro é.\u003c/p>\n\u003cp>\u003cstrong>Não comparar séries temporais com o baseline ingênuo.\u003c/strong> Se o modelo não bate \"amanhã = hoje\", não há nada a celebrar.\u003c/p>\n\u003cp>\u003cstrong>Escolher métrica antes de perguntar o custo dos erros.\u003c/strong> É a diferença entre um candidato que responde a pergunta e um que responde a pergunta certa.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Explique precision e recall. Quando você prioriza cada uma?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Precision é, das previsões positivas, quantas estavam certas — o denominador é o que o modelo previu. Recall é, dos positivos reais, quantos o modelo encontrou — o denominador é a realidade.\u003c/p>\n\u003cp>Priorizo precision quando \u003cstrong>agir sobre um falso positivo é caro\u003c/strong>: bloquear a conta de um cliente legítimo, despachar um técnico, iniciar um tratamento invasivo. Priorizo recall quando \u003cstrong>deixar passar um positivo é caro\u003c/strong>: triagem de câncer, detecção de fraude de alto valor, falha crítica de equipamento.\u003c/p>\n\u003cp>Na prática eu não escolho no abstrato — pergunto o custo relativo dos dois erros e uso isso. Se um falso negativo custa 20× um falso positivo, isso define diretamente onde eu coloco o limiar. E o ponto de partida da conversa é que os dois se trocam mutuamente ao mover o limiar: melhorar um sem piorar o outro exige um modelo melhor, não um limiar diferente.\u003c/p>\n\u003cp>\u003cstrong>Follow-up quase garantido:\u003c/strong> \u003cem>\"Como você faria um modelo com 100% de recall?\"\u003c/em> — Trivial e inútil: preveja positivo para tudo. Recall = 100%, precision = prevalência. É exatamente por isso que nenhuma das duas se reporta sozinha — sempre em par, ou via F-beta com o β justificado pelo custo dos erros.\u003c/p>"},{"titleHtml":"🟢 Sua acurácia é 99% num problema de detecção de fraude. É bom?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Provavelmente não significa nada. Se a taxa de fraude é 1%, o modelo que prevê \"nunca é fraude\" tem 99% de acurácia e recall zero — completamente inútil. A primeira coisa que eu faria é comparar com esse baseline trivial da classe majoritária.\u003c/p>\n\u003cp>Eu olharia a matriz de confusão inteira e reportaria precision, recall e PR-AUC. Preferiria PR-AUC a ROC-AUC porque, com essa proporção, o FPR fica diluído pela massa de verdadeiros negativos e o ROC parece bom mesmo quando a precision é terrível. E antes disso tudo, eu perguntaria o custo relativo: quanto custa investigar uma transação legítima versus quanto custa uma fraude passar. É isso que define a métrica e o limiar, não a acurácia.\u003c/p>\n\u003cp>\u003cstrong>Pegadinha frequente:\u003c/strong> \u003cem>\"Então acurácia nunca serve?\"\u003c/em> — Serve quando as classes são aproximadamente balanceadas \u003cstrong>e\u003c/strong> os erros custam parecido. Nesse caso ela é interpretável e comunica bem. O problema não é a acurácia em si, é usá-la sem checar essas duas condições.\u003c/p>"},{"titleHtml":"🟡 Qual a diferença entre ROC-AUC e PR-AUC? Quando você usa cada uma?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> ROC plota TPR contra FPR; PR plota precision contra recall. A diferença estrutural é que \u003cstrong>FPR tem verdadeiros negativos no denominador e precision não tem\u003c/strong>.\u003c/p>\n\u003cp>Isso importa muito sob desbalanceamento. Com 1.000 positivos e 1 milhão de negativos, dez mil falsos positivos dão um FPR de 1% — a curva ROC continua linda. Mas a precision é 9%: o modelo é inutilizável, e a curva PR mostra isso na hora. Então a regra que eu uso é: \u003cstrong>classe positiva rara e é ela que importa → PR-AUC\u003c/strong>; classes balanceadas ou os dois lados importam igualmente → ROC-AUC é adequado e tem a vantagem de ser mais estável.\u003c/p>\n\u003cp>Também vale saber que ROC-AUC é invariante à prevalência e PR-AUC não. Isso é bom para comparar poder discriminativo entre populações com prevalências diferentes, e ruim quando você quer que a métrica reflita a realidade operacional. O baseline aleatório de PR-AUC é a própria prevalência, enquanto o de ROC-AUC é sempre 0.5 — então um PR-AUC de 0.3 pode ser excelente se a prevalência é 1%.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"O que AUC significa exatamente?\"\u003c/em> — É a probabilidade de um positivo aleatório receber score maior que um negativo aleatório. Ou seja, mede \u003cstrong>ordenação\u003c/strong>, não classificação. Um modelo com AUC 0.95 e scores todos comprimidos entre 0.45 e 0.55 ordena perfeitamente e é péssimo como estimador de probabilidade.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"AUC de 0.3 — o que aconteceu?\"\u003c/em> — O modelo aprendeu a ordenação invertida, o que quase sempre indica bug: rótulos trocados, sinal invertido, ou eu passei a coluna errada como score positivo. Um modelo genuinamente aleatório daria 0.5. Curiosamente, inverter as previsões daria AUC 0.7 — o que confirma que há sinal, só está com o sinal trocado.\u003c/p>"},{"titleHtml":"🟡 O que é F1 e quando ele é a métrica errada?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> F1 é a média harmônica de precision e recall. É harmônica e não aritmética porque pune desequilíbrio: com precision 1.0 e recall 0.0, a aritmética daria 0.5 e a harmônica dá 0.\u003c/p>\n\u003cp>F1 é a métrica errada em três situações. Primeiro, \u003cstrong>quando os erros têm custos diferentes\u003c/strong> — F1 assume implicitamente que precision e recall valem o mesmo, o que quase nunca é verdade. Nesse caso uso F-beta com o β derivado do custo relativo. Segundo, \u003cstrong>quando eu preciso de probabilidades e não de classes\u003c/strong> — F1 exige um limiar fixado, então ele avalia o par (modelo, limiar), não o modelo; para comparar modelos independentemente do limiar, PR-AUC é melhor. Terceiro, \u003cstrong>quando os verdadeiros negativos importam\u003c/strong> — F1 os ignora completamente, então em um problema onde acertar a classe negativa tem valor, ele omite metade da história.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"Você reporta F1 usando qual limiar?\"\u003c/em> — Se eu escolho o limiar que maximiza F1 \u003cstrong>no mesmo conjunto onde reporto\u003c/strong>, estou overfittando o limiar e o número reportado é otimista. O correto é escolher o limiar na validação e reportar o F1 no teste com aquele limiar fixo. É um erro comum e ele infla resultados de forma silenciosa.\u003c/p>"},{"titleHtml":"🟡 Quando MAE é melhor que RMSE?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Quando existem outliers que eu não quero que dominem o ajuste. RMSE penaliza quadraticamente, então um único erro grande pode pesar mais que centenas de erros pequenos, e o modelo vai se distorcer para acomodar aquele ponto.\u003c/p>\n\u003cp>A forma mais profunda de dizer isso é que as duas métricas estimam \u003cstrong>estatísticas diferentes\u003c/strong>: minimizar erro quadrático estima a \u003cstrong>média condicional\u003c/strong>, minimizar erro absoluto estima a \u003cstrong>mediana condicional\u003c/strong>. Em distribuições assimétricas — que é o caso de praticamente qualquer variável monetária — isso produz modelos sistematicamente diferentes, não só mais ou menos robustos. Então a pergunta certa não é \"qual é mais robusta\", é \"eu quero prever a média ou a mediana?\". Se eu vou somar as previsões (previsão de receita total), a média é o que soma corretamente e RMSE é apropriada. Se eu quero o caso típico, mediana e MAE.\u003c/p>\n\u003cp>Uso Huber quando quero robustez mas preciso de boa diferenciabilidade na otimização.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"E MAPE?\"\u003c/em> — Atraente por ser percentual e comparável entre escalas, mas com três problemas: indefinida em zero, explode perto de zero, e é assimétrica — penaliza superestimativa mais que subestimativa, porque subestimar tem erro máximo de 100% e superestimar é ilimitado. Isso enviesa previsões de demanda para baixo de forma sistemática. Em varejo eu preferiria WAPE, que é robusta a zeros e pondera por volume.\u003c/p>"},{"titleHtml":"🟡 O que é calibração e por que ela importa?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Um modelo é calibrado se, dentre os exemplos aos quais ele dá score 0.7, cerca de 70% são realmente positivos. É ortogonal à discriminação: dá para ter AUC 0.95 e calibração horrível, porque AUC só olha ordenação e é invariante a qualquer transformação monótona dos scores.\u003c/p>\n\u003cp>Importa sempre que o score entra numa conta a jusante como se fosse probabilidade: valor esperado, precificação de risco, decisão por custo, \u003ccode>lance = p(conversão) × margem\u003c/code>. Se eu multiplico um score descalibrado por dinheiro, o resultado é lixo mesmo com um modelo que ordena bem. Se eu só vou ordenar e mostrar os top-N, calibração não importa.\u003c/p>\n\u003cp>Meço com reliability diagram, ECE ou Brier score. Corrijo com Platt scaling ou isotonic regression, sempre ajustados num conjunto separado. Vale saber quem é naturalmente descalibrado: SVM não produz probabilidade nenhuma, Naive Bayes empurra scores para os extremos por causa da suposição de independência, random forest comprime na direção do centro, e redes neurais modernas são notoriamente superconfiantes.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴 excelente:\u003c/strong> \u003cem>\"Você aplicou SMOTE. O que acontece com a calibração?\"\u003c/em> — Quebra. A reamostragem muda a prevalência que o modelo enxerga, então os scores passam a refletir a distribuição artificial e não a real — superestimam sistematicamente a probabilidade da classe positiva. Se eu preciso de probabilidades, recalibro depois num conjunto com a prevalência real, ou corrijo o intercepto analiticamente pelo log-odds da razão de reamostragem.\u003c/p>"},{"titleHtml":"🟡 Multiclasse: qual a diferença entre macro-F1, micro-F1 e weighted-F1?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Macro calcula F1 por classe e tira a média simples — cada classe pesa igual independente do tamanho, então classes raras têm o mesmo peso das frequentes. É o que eu uso quando as classes minoritárias importam. Weighted pondera pelo suporte, então as classes grandes dominam. Micro agrega TP, FP e FN globalmente antes de calcular.\u003c/p>\n\u003cp>O ponto que vale destacar: em classificação multiclasse de rótulo único, \u003cstrong>micro-F1 é numericamente igual à acurácia\u003c/strong>, porque cada erro conta simultaneamente como um falso positivo de uma classe e um falso negativo de outra. Então reportar micro-F1 achando que traz informação nova sobre desbalanceamento é um erro — não traz. Se o problema é desbalanceamento, macro é a métrica que expõe isso.\u003c/p>\n\u003cp>Em multi-rótulo (onde um exemplo pode ter várias classes), micro e acurácia deixam de coincidir e micro passa a ser informativa.\u003c/p>"},{"titleHtml":"🟡 Como você escolhe o limiar de classificação?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Não uso 0.5 por padrão — é uma convenção, não uma escolha. Escolho por um dos três caminhos, na ordem de preferência.\u003c/p>\n\u003cp>\u003cstrong>Por custo:\u003c/strong> se eu tenho os custos de FP e FN, o limiar ótimo de decisão é \u003ccode>C_FP / (C_FP + C_FN)\u003c/code>. Se um FN custa 10× um FP, o limiar é cerca de 0.09. Isso só é válido se o modelo estiver calibrado, então eu verifico a calibração antes.\u003c/p>\n\u003cp>\u003cstrong>Por restrição operacional:\u003c/strong> frequentemente o negócio impõe capacidade — a equipe de fraude consegue investigar 200 casos por dia. Aí o limiar é definido pelo percentil que gera 200 alertas, e a métrica relevante vira precision@200.\u003c/p>\n\u003cp>\u003cstrong>Por otimização de métrica:\u003c/strong> escolher o limiar que maximiza F-beta na curva PR. Crucial fazer isso \u003cstrong>no conjunto de validação\u003c/strong> e reportar no teste com o limiar já fixo — caso contrário o número reportado está inflado.\u003c/p>\n\u003cp>Em produção, eu monitoraria esse limiar, porque a distribuição de scores desloca com o tempo e um limiar fixo produz volumes de alerta muito diferentes conforme o drift.\u003c/p>"},{"titleHtml":"🔴 Seu modelo tem AUC 0.85 offline mas o negócio diz que ele não funciona. Como investiga?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Trataria como uma discrepância entre a métrica e o objetivo, e checaria em ordem:\u003c/p>\n\u003cp>\u003cstrong>A métrica não é o objetivo.\u003c/strong> AUC mede ordenação sobre toda a faixa de scores, mas o negócio pode operar só nos top-1%. Um modelo pode ter AUC ótimo e desempenho ruim na cauda que importa. Eu recalcularia precision@k na faixa operacional real.\u003c/p>\n\u003cp>\u003cstrong>Desbalanceamento mascarando.\u003c/strong> Com positivos raros, AUC 0.85 pode conviver com precision de 5%. Reportaria PR-AUC e a curva de precision no volume de alertas que eles realmente processam.\u003c/p>\n\u003cp>\u003cstrong>Calibração.\u003c/strong> Se eles usam o score numa conta de valor esperado, um modelo descalibrado destrói a decisão mesmo ordenando bem.\u003c/p>\n\u003cp>\u003cstrong>Leakage ou split inválido.\u003c/strong> AUC bom demais offline com desempenho ruim online é a assinatura clássica de leakage ou de validação temporalmente inválida. Verificaria se o split respeitou o tempo e se alguma feature contém informação do futuro.\u003c/p>\n\u003cp>\u003cstrong>Distribuição de produção diferente.\u003c/strong> O conjunto de teste pode não representar o tráfego real — período diferente, filtros de amostragem, população diferente.\u003c/p>\n\u003cp>\u003cstrong>Feedback loop / seleção.\u003c/strong> Se o modelo antigo já filtrava casos, o dado de treino só contém o que passou pelo filtro, então a avaliação é sobre uma população enviesada e não sobre o tráfego que o modelo verá.\u003c/p>\n\u003cp>\u003cstrong>O modelo é bom mas o processo não usa ele bem.\u003c/strong> Latência alta demais, alertas chegando tarde, o time ignorando o score. Métrica boa não sobrevive a um processo ruim, e é surpreendentemente comum ser esta a causa.\u003c/p>\n\u003cp>A conclusão que eu daria: a métrica offline precisa ser redesenhada para espelhar a decisão real, e o teste definitivo é um A/B online com métrica de negócio.\u003c/p>"},{"titleHtml":"🔴 Como você avalia um sistema de recomendação?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Em três camadas, e a resposta ruim é ficar só na primeira.\u003c/p>\n\u003cp>\u003cstrong>Offline, métricas de ranking:\u003c/strong> NDCG@k é o padrão porque considera relevância graduada e desconta por posição; Precision@k e Recall@k para comunicação com o negócio; MRR quando existe essencialmente uma resposta certa. Métricas de classificação globais são inadequadas porque ignoram posição, e posição é o produto inteiro.\u003c/p>\n\u003cp>\u003cstrong>Offline, métricas além da acurácia:\u003c/strong> cobertura de catálogo, diversidade intra-lista, novidade, e a distribuição de exposição entre itens. Um recomendador que só recomenda os 100 itens mais populares tem NDCG decente e mata o negócio no médio prazo pelo colapso da cauda longa.\u003c/p>\n\u003cp>\u003cstrong>Online, que é o que decide:\u003c/strong> A/B test com métricas de negócio — CTR, conversão, tempo de sessão, retenção. E aqui está o ponto mais importante: \u003cstrong>métricas offline de recomendação são notoriamente pouco correlacionadas com resultado online\u003c/strong>, porque os dados offline são enviesados pelo sistema atual (você só observa feedback de itens que o sistema antigo mostrou — \u003cem>presentation bias\u003c/em>). Então offline serve para descartar candidatos ruins e o A/B decide.\u003c/p>\n\u003cp>Eu também alertaria sobre o alvo: otimizar CTR de curto prazo costuma degradar satisfação de longo prazo (clickbait). A métrica de decisão deveria ser retenção ou valor de sessão, com CTR como métrica secundária de diagnóstico.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Como avalia o cold start?\"\u003c/em> — Segmentando a avaliação: métricas separadas para usuários novos, itens novos e a cauda longa. A métrica agregada esconde falhas de cold start porque usuários frequentes dominam o volume.\u003c/p>"},{"titleHtml":"🔴 Quando ROC-AUC pode ser enganoso mesmo com classes balanceadas?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Alguns casos.\u003c/p>\n\u003cp>\u003cstrong>Quando só uma região da curva importa.\u003c/strong> AUC integra sobre todos os limiares, inclusive regiões que você nunca vai operar. Dois modelos podem ter o mesmo AUC com curvas que se cruzam: um melhor em FPR baixo, outro em FPR alto. Se eu opero em FPR baixo, o AUC agregado esconde exatamente a diferença que decide. Nesse caso uso \u003cstrong>AUC parcial\u003c/strong> na região de interesse, ou reporto TPR num FPR fixo.\u003c/p>\n\u003cp>\u003cstrong>Quando o custo dos erros é assimétrico.\u003c/strong> AUC trata todos os pontos da curva como igualmente relevantes, o que equivale a assumir uma distribuição implícita de custos que provavelmente não é a sua.\u003c/p>\n\u003cp>\u003cstrong>Quando eu preciso de probabilidades.\u003c/strong> AUC é invariante a qualquer transformação monótona dos scores, então é literalmente cego a calibração.\u003c/p>\n\u003cp>\u003cstrong>Quando há dependência entre exemplos.\u003c/strong> Se o conjunto de teste tem múltiplas amostras do mesmo usuário ou paciente, o AUC é otimista porque o modelo pode estar reconhecendo o indivíduo, não a condição. Isso pede agrupamento no split e, idealmente, AUC calculado por grupo.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Qual a diferença entre os denominadores de \u003cstrong>precision\u003c/strong> e \u003cstrong>recall\u003c/strong>?","a":["Precision divide pelo previsto positivo; recall, pelo real","Precision divide pelo real positivo; recall, pelo previsto","Ambos dividem pelo total de exemplos avaliados no conjunto","Precision usa TN no denominador e recall usa FP no dele"],"c":0,"e":"Precision responde quantas das marcadas estavam certas, então o denominador é o que o modelo previu; recall responde quantas das existentes foram encontradas, e o denominador é a realidade. Trocar os dois é o erro mais eliminatório do tópico. Nenhuma das duas usa verdadeiro negativo, e é por isso que servem sob desbalanceamento."},{"n":"🟢","levelName":"basico","q":"Um modelo de fraude tem 99% de acurácia com 1% de taxa de fraude. Qual a primeira verificação?","a":["Comemorar: 99% é excelente em qualquer problema de classificação","Subir o limiar de decisão para melhorar ainda mais o resultado","Comparar com o baseline trivial de prever sempre a classe comum","Aplicar SMOTE para elevar a acurácia da classe minoritária rara"],"c":2,"e":"Com 1% de positivos, o modelo que nunca prevê fraude também tem 99% e recall zero. O certo é olhar a matriz de confusão, precision, recall e PR-AUC, e perguntar o custo de cada erro. Subir o limiar piora o recall justamente onde ele já é o problema, e reamostrar antes de diagnosticar ataca sintoma e quebra a calibração."},{"n":"🟡","levelName":"intermediario","q":"Por que \u003cstrong>ROC-AUC engana\u003c/strong> sob desbalanceamento severo, enquanto PR-AUC não?","a":["ROC-AUC ignora completamente os verdadeiros positivos do teste","PR-AUC é invariante à prevalência, ao contrário do ROC-AUC","A curva ROC não pode ser calculada com classes desbalanceadas","O FPR tem TN no denominador e dilui muitos falsos positivos"],"c":3,"e":"Com um milhão de negativos, dez mil falsos positivos dão FPR de 1% e curva ROC bonita, enquanto a precision desaba para 9%. A invariância à prevalência aparece trocada numa das opções: quem é invariante é o ROC-AUC, e é justamente por isso que ele não reflete a realidade operacional. A curva ROC é calculável sempre."},{"n":"🟡","levelName":"intermediario","q":"O que o valor de \u003cstrong>AUC\u003c/strong> significa exatamente?","a":["A fração de previsões corretas que o modelo faz no conjunto","A chance de um positivo receber score maior que um negativo","A probabilidade de o modelo estar bem calibrado nos extremos","O limiar de classificação que maximiza o F1 naquele conjunto"],"c":1,"e":"AUC mede ordenação, não classificação nem calibração: um modelo com AUC 0,95 e scores comprimidos entre 0,45 e 0,55 ordena perfeitamente e é péssimo como estimador de probabilidade. Fração de acertos é acurácia, e o AUC é invariante a qualquer transformação monótona, o que o torna cego a calibração e independente de limiar."},{"n":"🟡","levelName":"intermediario","q":"Quando \u003cstrong>calibração\u003c/strong> importa mais que ranking?","a":["Sempre que o AUC do modelo passar de 0,9 no conjunto de teste","Quando o objetivo é só exibir os dez itens mais relevantes","Quando o score entra numa conta como se fosse probabilidade","Quando as classes estão aproximadamente balanceadas na base"],"c":2,"e":"Se você multiplica o score por dinheiro, ele precisa ser probabilidade de verdade — valor esperado, precificação de risco, limiar por custo. Para apenas ordenar e mostrar o topo, calibração é irrelevante e o AUC basta. AUC alto não implica calibração, porque mede só ordenação, e balanceamento não tem relação com o assunto."},{"n":"🟡","levelName":"intermediario","q":"Minimizar \u003cstrong>MSE\u003c/strong> e minimizar \u003cstrong>MAE\u003c/strong> estimam, respectivamente:","a":["A média e a mediana condicionais, respectivamente","A mediana e a média condicionais, respectivamente","Os dois estimam a média, mudando só a robustez","A moda e a média condicionais, respectivamente"],"c":0,"e":"Não são duas versões do mesmo erro: minimizar erro quadrático estima a média condicional e minimizar erro absoluto estima a mediana condicional. Em distribuições assimétricas isso produz modelos sistematicamente diferentes, então a pergunta certa não é qual é mais robusta, e sim qual estatística você quer prever."},{"n":"🟡","levelName":"intermediario","q":"Em classificação multiclasse de \u003cstrong>rótulo único\u003c/strong>, qual a relação entre micro-F1 e acurácia?","a":["Micro-F1 é sempre menor que a acurácia nesse mesmo cenário","São numericamente iguais em classificação de rótulo único","Micro-F1 é mais sensível às classes raras do que a acurácia","Não têm relação definida: dependem da matriz de confusão"],"c":1,"e":"Cada erro é simultaneamente um falso positivo de uma classe e um falso negativo de outra, e as contagens globais colapsam na acurácia. Reportar micro-F1 achando que traz informação nova sobre desbalanceamento é o erro — quem expõe isso é a macro-F1, que dá peso igual a cada classe independentemente do tamanho."},{"n":"🔴","levelName":"avancado","q":"Um falso negativo custa \u003cstrong>10× mais\u003c/strong> que um falso positivo. Qual o limiar ótimo (modelo calibrado)?","a":["Depende só da prevalência da classe positiva na população","0,5, que é o padrão adotado pelas bibliotecas de modelagem","0,9, para exigir bem mais confiança antes de sinalizar algo","Cerca de 0,09, pois o limiar ótimo é C_FP/(C_FP + C_FN)"],"c":3,"e":"Pela teoria da decisão, o limiar sai de 1 dividido por 11, bem longe do 0,5 convencional — e a fórmula só vale com o modelo calibrado, o que precisa ser verificado antes. Exigir mais confiança vai na direção oposta do custo assimétrico descrito, e a prevalência afeta o resultado, mas não define sozinha o limiar ótimo."}]},{"id":"03","fullTitle":"03 — Validação e Dados","shortTitle":"Validação e Dados","subtitle":"Train/val/test, cross-validation, data leakage, validação temporal, desbalanceamento de classes.","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-por-que-separar-dados\">1.1 Por que separar dados\u003c/h3>\n\u003cp>Você quer estimar o desempenho do modelo em dados que ele nunca viu. Qualquer dado que influenciou o modelo — no ajuste dos parâmetros, na escolha de hiperparâmetros, na seleção de features, na decisão de arquitetura — está contaminado e não serve para essa estimativa. Isso é mais amplo do que parece: \u003cstrong>toda decisão tomada olhando um conjunto de dados consome a virgindade daquele conjunto.\u003c/strong>\u003c/p>\n\u003cp>Os três papéis:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Treino\u003c/strong> — ajusta os parâmetros do modelo.\u003c/li>\u003cli>\u003cstrong>Validação\u003c/strong> — escolhe hiperparâmetros, seleciona modelo, define limiar, decide quando parar (early stopping).\u003c/li>\u003cli>\u003cstrong>Teste\u003c/strong> — estima o desempenho final. \u003cstrong>Usado uma vez, no fim.\u003c/strong>\u003c/li>\u003c/ul>\n\u003cp>O teste é sagrado precisamente porque cada olhada nele o transforma progressivamente em validação. Se você testa 50 configurações no conjunto de teste e escolhe a melhor, aquele número é otimista: você selecionou o que teve sorte naquela amostra específica. Esse fenômeno tem nome — \u003cem>overfitting por seleção de modelo\u003c/em>, ou o problema das comparações múltiplas aplicado a ML.\u003c/p>\n\u003cp>Proporções típicas: 60/20/20 ou 70/15/15 para datasets de porte médio. Com milhões de amostras, 98/1/1 é perfeitamente razoável, porque 1% de 10 milhões são 100 mil exemplos — mais que suficiente para uma estimativa precisa. \u003cstrong>O que importa é o tamanho absoluto dos conjuntos de avaliação, não a porcentagem.\u003c/strong> Essa observação é um bom sinal em entrevista.\u003c/p>\n\u003ch3 id=\"h-1-2-cross-validation\">1.2 Cross-validation\u003c/h3>\n\u003cp>Com dados escassos, um único split de validação é ruidoso: sua estimativa depende de quais exemplos calharam de cair na validação. \u003cstrong>k-fold cross-validation\u003c/strong> divide os dados em k partes, treina k vezes usando k-1 partes e validando na restante, e agrega os k resultados.\u003c/p>\n\u003cp>Vantagens: usa todos os dados para treino e validação (em rodadas diferentes), e — o que mais importa e menos se fala — \u003cstrong>fornece uma estimativa da variabilidade\u003c/strong>, não só um ponto. Reportar \"0.84 ± 0.03\" em vez de \"0.84\" muda a conversa: se dois modelos diferem em 0.01 e o desvio entre folds é 0.03, a diferença é ruído e escolher o \"melhor\" é superstição.\u003c/p>\n\u003cp>Custo: k vezes mais treinos.\u003c/p>\n\u003cp>\u003cstrong>Escolha de k.\u003c/strong> k=5 e k=10 são padrão. k maior → cada treino usa mais dados → estimativa com menos bias, mas mais custo e os folds ficam mais correlacionados entre si (os conjuntos de treino se sobrepõem quase totalmente), o que aumenta a variância da média estimada. \u003cstrong>LOOCV\u003c/strong> (k=n) tem bias mínimo e variância alta, além de ser caro — na prática raramente é a melhor escolha, exceto com pouquíssimos dados.\u003c/p>\n\u003cp>\u003cstrong>Variantes que você precisa saber:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Stratified k-fold\u003c/strong> — preserva a proporção de classes em cada fold. \u003cstrong>Deve ser o padrão em classificação\u003c/strong>, especialmente com desbalanceamento, senão um fold pode não ter nenhum exemplo da classe rara.\u003c/li>\u003cli>\u003cstrong>Group k-fold\u003c/strong> — garante que todas as amostras de um mesmo grupo (usuário, paciente, sessão, dispositivo) fiquem no mesmo fold. Obrigatório sempre que houver múltiplas linhas por entidade, senão o modelo memoriza a entidade e a estimativa é otimista.\u003c/li>\u003cli>\u003cstrong>Time series split\u003c/strong> — folds sequenciais no tempo, sempre treinando no passado e validando no futuro (ver 1.4).\u003c/li>\u003cli>\u003cstrong>Repeated k-fold\u003c/strong> — repete o k-fold com embaralhamentos diferentes, reduzindo o ruído da partição. Útil com datasets pequenos.\u003c/li>\u003cli>\u003cstrong>Nested CV\u003c/strong> — CV interna para escolher hiperparâmetros, externa para estimar desempenho. É o jeito correto de obter uma estimativa não-enviesada quando você faz muita busca de hiperparâmetros. Caro (k_ext × k_int treinos), mas é a resposta tecnicamente correta para \"como você evita overfittar na validação?\".\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-3-data-leakage-o-tópico-mais-importante-deste-arquivo\">1.3 Data leakage — o tópico mais importante deste arquivo\u003c/h3>\n\u003cp>\u003cstrong>Leakage é qualquer informação disponível no treino que não estará disponível no momento da predição real.\u003c/strong> Ele produz métricas offline espetaculares e falha total em produção. A assinatura é sempre a mesma: \u003cem>resultado bom demais\u003c/em>.\u003c/p>\n\u003cp>Regra de ouro que resolve a maioria dos casos: \u003cstrong>congele mentalmente o instante da predição e pergunte, para cada feature, \"eu teria esse valor, com esse conteúdo, naquele instante?\"\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Os tipos, em ordem de frequência:\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1. Leakage de pré-processamento (o mais comum).\u003c/strong> Ajustar qualquer transformação usando o dataset inteiro antes de dividir. Padronizar com a média/desvio global vaza estatísticas do teste para o treino. O mesmo vale para: imputação de missing pela média global, seleção de features usando correlação com o alvo calculada em tudo, PCA ajustado em tudo, target encoding, discretização por quantis, e reamostragem. \u003cstrong>A correção é sempre a mesma: divida primeiro, ajuste (\u003ccode>fit\u003c/code>) apenas no treino, aplique (\u003ccode>transform\u003c/code>) nos demais.\u003c/strong> Um pipeline que encapsula as transformações junto com o modelo torna isso automático dentro de CV — se você citar isso, mostra que sabe como o erro é evitado na prática, não só que ele existe.\u003c/p>\n\u003cp>\u003cstrong>2. Leakage temporal.\u003c/strong> Usar informação do futuro para prever o passado. Split aleatório em dados temporais é o caso clássico: você treina com dezembro e valida com junho. Também aparece de forma sutil em features agregadas (\"média de compras do cliente\") calculadas sobre todo o histórico, incluindo o período que você está prevendo.\u003c/p>\n\u003cp>\u003cstrong>3. Leakage de alvo (target leakage).\u003c/strong> Uma feature que é consequência do alvo, não causa. Exemplos reais: \u003ccode>valor_indenização\u003c/code> num modelo de previsão de sinistro (só é preenchido se houve sinistro); \u003ccode>numero_de_visitas_ao_oncologista\u003c/code> prevendo câncer; \u003ccode>data_de_cancelamento\u003c/code> prevendo churn; \u003ccode>status_da_conta = 'bloqueada'\u003c/code> prevendo fraude. Sintoma clássico: \u003cstrong>uma única feature com importância dominante e AUC próximo de 1\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>4. Leakage de grupo/duplicata.\u003c/strong> O mesmo indivíduo, sessão ou item aparecendo em treino e teste. O modelo reconhece a entidade, não o padrão. Muito comum em dados médicos (múltiplos exames do mesmo paciente), em imagens (frames do mesmo vídeo) e em dados web (múltiplas linhas do mesmo usuário). Duplicatas exatas ou quase-exatas entre treino e teste são a versão mais grosseira.\u003c/p>\n\u003cp>\u003cstrong>5. Leakage por reamostragem antes do split.\u003c/strong> Aplicar SMOTE antes de dividir faz com que exemplos sintéticos gerados a partir de pontos de treino apareçam no teste — o modelo já viu quase exatamente aquele ponto. Regra: \u003cstrong>reamostragem é parte do treino, sempre depois do split, e nunca aplicada ao conjunto de validação/teste.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>6. Leakage por seleção de features fora do CV.\u003c/strong> Escolher as top-100 features por correlação com o alvo usando todos os dados e depois fazer CV. A seleção já viu os folds de validação. Em datasets com muitas features e poucas amostras, isso sozinho produz AUC de 0.9 a partir de ruído puro — é um resultado clássico e conhecido em genômica.\u003c/p>\n\u003cp>\u003cstrong>Como detectar leakage na prática:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Desempenho \u003cstrong>suspeito de tão bom\u003c/strong> para a dificuldade conhecida do problema.\u003c/li>\u003cli>\u003cstrong>Uma feature dominando\u003c/strong> a importância. Investigue a semântica e a origem dela, não a estatística.\u003c/li>\u003cli>\u003cstrong>Discrepância grande entre offline e produção\u003c/strong> — o sintoma que aparece tarde demais.\u003c/li>\u003cli>\u003cstrong>Ablação:\u003c/strong> remova a feature suspeita; se a métrica desaba de 0.97 para 0.72, você achou.\u003c/li>\u003cli>\u003cstrong>Auditoria de dicionário de dados:\u003c/strong> para cada feature, quando ela é escrita no sistema de origem? Se for escrita depois do evento que você prevê, é leakage.\u003c/li>\u003cli>\u003cstrong>Teste com dados de um período futuro real\u003c/strong> — o teste mais honesto que existe.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-4-validação-temporal\">1.4 Validação temporal\u003c/h3>\n\u003cp>Se o objetivo é prever o futuro, \u003cstrong>a validação deve simular prever o futuro\u003c/strong>. Split aleatório em série temporal é sempre errado, por três razões: quebra a dependência temporal, usa o futuro para prever o passado, e ignora que a distribuição muda com o tempo (não-estacionariedade).\u003c/p>\n\u003cp>\u003cstrong>Esquemas corretos:\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Rolling forward / walk-forward\u003c/strong> — múltiplos folds, cada um treinando num período e validando no período imediatamente seguinte. Duas variantes:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Janela expansiva:\u003c/strong> o treino cresce a cada fold (usa todo o histórico). Melhor quando o processo é razoavelmente estável e mais dados ajudam.\u003c/li>\u003cli>\u003cstrong>Janela deslizante:\u003c/strong> o treino tem tamanho fixo e desliza. Melhor quando há drift forte e dados antigos atrapalham mais do que ajudam.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Gap / embargo\u003c/strong> — deixar um intervalo entre o fim do treino e o começo da validação. Necessário quando (a) o alvo tem horizonte (você prevê o que acontece nos próximos 30 dias, então rótulos perto da borda dependem de dados dentro do período de validação) ou (b) há autocorrelação forte. Sem o gap, há vazamento sutil na fronteira. Isso é padrão em finanças e é um detalhe que impressiona.\u003c/p>\n\u003cp>\u003cstrong>Ponto sutil e muito bom para citar:\u003c/strong> em validação temporal, os folds mais recentes são os mais representativos do que virá. Fazer a média simples de todos os folds pode mascarar que o modelo vem degradando. \u003cstrong>Olhe a série de métricas por fold, não só a média\u003c/strong> — uma tendência decrescente é um sinal de concept drift que a média esconde.\u003c/p>\n\u003cp>\u003cstrong>Outro ponto:\u003c/strong> ao treinar o modelo final para produção, você retreina com \u003cstrong>todos\u003c/strong> os dados, incluindo o período de validação. A validação serviu para estimar desempenho e escolher hiperparâmetros; jogar fora os dados mais recentes seria absurdo justamente porque são os mais relevantes.\u003c/p>\n\u003ch3 id=\"h-1-5-desbalanceamento-de-classes\">1.5 Desbalanceamento de classes\u003c/h3>\n\u003cp>Primeiro: \u003cstrong>desbalanceamento não é automaticamente um problema.\u003c/strong> É um problema quando (a) a classe rara é a que importa e (b) o modelo aprende a ignorá-la. Com sinal forte e dados suficientes, um modelo aprende classes raras sem intervenção. A pergunta certa é \"o modelo está detectando a classe rara?\", não \"as classes estão balanceadas?\".\u003c/p>\n\u003cp>O que o desbalanceamento realmente causa: com pouquíssimos exemplos positivos, o gradiente da classe majoritária domina e o mínimo da perda fica perto de \"prever sempre a majoritária\". \u003cstrong>O problema profundo é quantidade absoluta de exemplos da classe rara, não a proporção.\u003c/strong> 1% de 10 milhões são 100 mil positivos e isso é bastante; 1% de 1.000 são 10 positivos e nenhuma técnica salva isso.\u003c/p>\n\u003cp>\u003cstrong>Abordagens, em ordem do que eu tentaria:\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1. Mudar a métrica e o limiar (sempre primeiro).\u003c/strong> Muitas vezes o \"problema de desbalanceamento\" é só um problema de olhar acurácia e usar limiar 0.5. Trocar para PR-AUC e escolher o limiar por custo resolve sem tocar nos dados. \u003cstrong>Esta é a resposta que separa um bom candidato: reamostragem não deveria ser o primeiro reflexo.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2. Class weights / cost-sensitive learning.\u003c/strong> Pesar a perda inversamente à frequência da classe. Vantagem sobre reamostragem: não duplica nem descarta dados, é uma linha de configuração, e é matematicamente mais limpo. Em XGBoost/LightGBM, \u003ccode>scale_pos_weight\u003c/code>; em muitos estimadores do scikit-learn, \u003ccode>class_weight='balanced'\u003c/code>. É o meu padrão.\u003c/p>\n\u003cp>\u003cstrong>3. Undersampling da majoritária.\u003c/strong> Descarta informação, mas é barato e acelera treino. Faz sentido quando a majoritária é enorme e redundante. Variantes informadas (Tomek links, NearMiss) removem exemplos seletivamente.\u003c/p>\n\u003cp>\u003cstrong>4. Oversampling da minoritária.\u003c/strong> Duplicar exemplos aumenta o risco de overfitting nos exemplos duplicados. \u003cstrong>SMOTE\u003c/strong> gera exemplos sintéticos interpolando entre vizinhos da classe minoritária, o que é melhor que duplicar. Limitações do SMOTE que valem citar: funciona mal em alta dimensão (a interpolação em espaço esparso gera pontos em regiões implausíveis), não funciona bem com features categóricas (há a variante SMOTE-NC), e pode interpolar entre um ponto minoritário e um vizinho que na verdade é ruído, criando exemplos sintéticos dentro do território da classe majoritária e borrando a fronteira.\u003c/p>\n\u003cp>\u003cstrong>5. Coletar mais dados da classe rara\u003c/strong>, se possível. Sempre a melhor opção quando viável.\u003c/p>\n\u003cp>\u003cstrong>6. Reformular como detecção de anomalia\u003c/strong>, quando a classe rara é rara demais (&lt;0.1%) ou heterogênea demais para ser modelada como classe. Ver \u003ca href=\"#\" class=\"topic-link\" data-topic=\"09\">09\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Regras não-negociáveis sobre reamostragem:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Somente no treino.\u003c/strong> Nunca no teste ou na validação — eles devem refletir a distribuição real, senão sua métrica não significa nada operacionalmente.\u003c/li>\u003cli>\u003cstrong>Dentro do CV, não antes.\u003c/strong> Reamostrar antes de fazer CV vaza exemplos sintéticos entre folds.\u003c/li>\u003cli>\u003cstrong>Ela quebra a calibração.\u003c/strong> Os scores passam a refletir a prevalência artificial. Recalibre se precisar de probabilidades.\u003c/li>\u003c/ul>\n\u003ch3 id=\"h-1-6-distribuição-de-val-teste\">1.6 Distribuição de val/teste\u003c/h3>\n\u003cp>Uma regra que vale ouro em entrevista: \u003cstrong>validação e teste devem vir da mesma distribuição, e essa distribuição deve ser a de produção.\u003c/strong> Se o modelo vai rodar em fotos de celular de baixa qualidade, não valide em fotos profissionais.\u003c/p>\n\u003cp>Corolário útil: quando os dados de treino abundantes vêm de uma fonte e os dados que importam vêm de outra escassa, o correto \u003cstrong>não\u003c/strong> é misturar tudo e dividir aleatoriamente. É colocar os dados da distribuição-alvo em val/teste (e um pouco no treino), e usar a fonte abundante só no treino. Isso permite diagnosticar separadamente overfitting de \u003cem>data mismatch\u003c/em> — para o qual se usa um conjunto extra (\"train-dev\"), retirado da distribuição de treino e não usado para treinar: se o erro sobe de treino para train-dev, é variância; se sobe de train-dev para val, é mismatch de distribuição.\u003c/p>\n\u003chr>\u003c/section>\n\u003csection class=\"study-sec\" id=\"sec-3-armadilhas-comuns\">\u003ch2>3. Armadilhas comuns\u003c/h2>\u003cp>\u003cstrong>Ajustar transformações antes do split.\u003c/strong> O leakage mais comum e mais silencioso. \u003ccode>fit\u003c/code> só no treino, e dentro de cada fold do CV.\u003c/p>\n\u003cp>\u003cstrong>Split aleatório em dados temporais.\u003c/strong> Invalida a estimativa inteira. E o modelo parece ótimo, o que torna o erro difícil de perceber.\u003c/p>\n\u003cp>\u003cstrong>Ignorar agrupamento.\u003c/strong> Mesmo usuário/paciente/sessão em treino e teste. Use group k-fold.\u003c/p>\n\u003cp>\u003cstrong>Reamostrar antes do split.\u003c/strong> Exemplos sintéticos derivados do treino aparecem no teste.\u003c/p>\n\u003cp>\u003cstrong>Reamostrar o conjunto de teste.\u003c/strong> O teste tem que refletir a distribuição real ou a métrica não significa nada operacionalmente.\u003c/p>\n\u003cp>\u003cstrong>Usar o teste múltiplas vezes.\u003c/strong> Cada olhada o transforma em validação. Se você já olhou muitas vezes, seja honesto sobre isso ao reportar.\u003c/p>\n\u003cp>\u003cstrong>Reportar a métrica média do CV sem o desvio.\u003c/strong> Sem a variabilidade, não dá para saber se a diferença entre modelos é real.\u003c/p>\n\u003cp>\u003cstrong>Assumir que desbalanceamento sempre exige reamostragem.\u003c/strong> Frequentemente métrica correta + limiar correto + class weights resolvem melhor e mais simples.\u003c/p>\n\u003cp>\u003cstrong>Achar que SMOTE \"cria informação\".\u003c/strong> Ele interpola dentro do que já existe. Não adiciona sinal novo; muda o formato do problema de otimização.\u003c/p>\n\u003cp>\u003cstrong>Esquecer que reamostragem quebra calibração.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Otimizar hiperparâmetros no teste.\u003c/strong> Mesmo \"só uma olhadinha\" para escolher entre duas opções contamina.\u003c/p>\n\u003cp>\u003cstrong>Não checar disponibilidade das features em tempo de inferência.\u003c/strong> Feature que existe no warehouse mas chega tarde em produção é leakage disfarçado de engenharia.\u003c/p>\n\u003cp>\u003cstrong>Usar k-fold não estratificado em classificação desbalanceada.\u003c/strong> Alguns folds podem ficar sem exemplos da classe rara.\u003c/p>\n\u003cp>\u003cstrong>Achar que CV valida o modelo final.\u003c/strong> CV valida o \u003cem>procedimento\u003c/em>. O modelo que vai para produção é outro artefato e precisa de um holdout próprio ou de monitoramento em produção.\u003c/p>\u003c/section>","questionsIntroHtml":"","cards":[{"titleHtml":"🟢 Por que dividir em treino, validação e teste? Por que não só treino e teste?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Porque cada decisão tomada olhando um conjunto contamina esse conjunto. O treino ajusta parâmetros. A validação escolhe hiperparâmetros, seleciona o modelo, define o limiar e decide quando parar. Se eu usar o teste para essas escolhas, ele deixa de ser uma estimativa imparcial: eu estaria escolhendo a configuração que teve sorte naquela amostra específica, e o número reportado seria otimista.\u003c/p>\n\u003cp>O caso extremo torna óbvio: se eu testo 100 modelos no conjunto de teste e reporto o melhor, aquele resultado é essencialmente o máximo de 100 amostras ruidosas, não o desempenho esperado. O teste tem que ser usado uma vez, no fim.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Que proporção você usa?\"\u003c/em> — 70/15/15 ou 60/20/20 como padrão, mas o que importa é o \u003cstrong>tamanho absoluto\u003c/strong> dos conjuntos de avaliação. Com 10 milhões de amostras, 98/1/1 é ótimo, porque 100 mil exemplos já dão uma estimativa precisa e é melhor usar o resto para treinar. Com 500 amostras, nenhum split fixo é confiável e eu iria para cross-validation repetida.\u003c/p>"},{"titleHtml":"🟢 O que é cross-validation e por que usar?","level":"🟢","levelName":"basico","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Dividir os dados em k partes, treinar k vezes usando k-1 partes e validando na restante, e agregar. Uso quando os dados são escassos, por dois motivos. Primeiro, todos os exemplos são usados tanto para treinar quanto para validar, em rodadas diferentes, o que aproveita melhor dados limitados. Segundo — e isso é o que mais uso na prática — ele dá uma \u003cstrong>estimativa da variabilidade\u003c/strong>, não só um número. Reportar 0.84 ± 0.03 muda decisões: se dois modelos diferem em 0.01 e o desvio entre folds é 0.03, a diferença é ruído e escolher o \"melhor\" é superstição.\u003c/p>\n\u003cp>O custo é k vezes mais treinos, então em deep learning com treinos caros eu costumo usar um holdout único bem dimensionado.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"k=5 ou k=10?\"\u003c/em> — k maior significa mais dados por treino, portanto menos bias na estimativa, mas mais custo e folds mais correlacionados entre si, o que aumenta a variância da média. 5 e 10 são os padrões razoáveis; LOOCV tem bias mínimo mas variância alta e custo proibitivo, e só considero com dados muito escassos.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Sempre uso k-fold simples?\"\u003c/em> — Não. Em classificação uso \u003cstrong>stratified\u003c/strong>, para garantir a proporção de classes em cada fold — sem isso, com desbalanceamento, um fold pode não ter nenhum positivo. Se há múltiplas linhas por entidade, uso \u003cstrong>group k-fold\u003c/strong>. Em série temporal, k-fold aleatório é inválido e uso split temporal.\u003c/p>"},{"titleHtml":"🟡 O que é data leakage? Dê exemplos e diga como você detecta.","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Leakage é ter no treino alguma informação que não estará disponível no momento real da predição. O resultado é métrica offline excelente e falha em produção.\u003c/p>\n\u003cp>Os tipos que mais vejo: \u003cstrong>pré-processamento\u003c/strong> — padronizar ou imputar usando estatísticas do dataset inteiro antes de dividir, o que vaza informação do teste; \u003cstrong>temporal\u003c/strong> — split aleatório em dados com tempo, treinando em dezembro para prever junho; \u003cstrong>target leakage\u003c/strong> — uma feature que é consequência do alvo, como \u003ccode>valor_da_indenização\u003c/code> num modelo de previsão de sinistro, que só é preenchido quando houve sinistro; e \u003cstrong>leakage de grupo\u003c/strong> — o mesmo paciente ou usuário em treino e teste, fazendo o modelo reconhecer a entidade em vez do padrão.\u003c/p>\n\u003cp>Detecto por sinais: resultado bom demais para a dificuldade conhecida do problema, uma feature dominando a importância, e discrepância entre offline e online. A investigação decisiva é semântica, não estatística: para cada feature suspeita, eu pergunto \u003cstrong>quando aquele campo é escrito no sistema de origem\u003c/strong>. Se é escrito depois do evento que estou prevendo, é leakage. Confirmo por ablação: remover a feature e ver se a métrica desaba.\u003c/p>\n\u003cp>A prevenção estrutural é encapsular todo o pré-processamento num pipeline que é ajustado dentro de cada fold, para que seja impossível ajustar em dados de validação por descuido.\u003c/p>\n\u003cp>\u003cstrong>Follow-up muito comum:\u003c/strong> \u003cem>\"Onde exatamente você aplica o StandardScaler?\"\u003c/em> — Ajusto (\u003ccode>fit\u003c/code>) somente no treino e aplico (\u003ccode>transform\u003c/code>) em validação e teste com os parâmetros do treino. Dentro de CV, isso precisa acontecer \u003cstrong>dentro de cada fold\u003c/strong>, não uma vez antes — por isso o pipeline. Ajustar antes do CV é o leakage mais comum que existe e é sutil porque o efeito costuma ser pequeno e não levanta suspeita.\u003c/p>\n\u003cp>\u003cstrong>Follow-up 🔴:\u003c/strong> \u003cem>\"O efeito de padronizar antes do split é grande?\"\u003c/em> — Geralmente pequeno, e é exatamente por isso que é perigoso: ele não gera um resultado absurdo que te alerta, só um viés otimista silencioso. Fica grave com datasets pequenos, com features de cauda pesada, e com transformações mais agressivas como target encoding ou seleção de features, onde o efeito pode ser enorme.\u003c/p>"},{"titleHtml":"🟡 Como você valida um modelo de série temporal?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Nunca com split aleatório. Uso validação walk-forward: múltiplos folds, cada um treinando num período e validando no período imediatamente seguinte, sempre passado → futuro. Escolho entre janela expansiva, que acumula todo o histórico e é melhor quando o processo é estável, e janela deslizante de tamanho fixo, melhor quando há drift forte e dados antigos atrapalham.\u003c/p>\n\u003cp>Duas coisas que eu adicionaria e que costumam ser esquecidas. Primeiro, \u003cstrong>um gap entre treino e validação\u003c/strong> quando o alvo tem horizonte — se eu prevejo o que acontece nos próximos 30 dias, os rótulos perto da borda do treino dependem de dados que caem dentro da validação, e sem o gap há vazamento na fronteira. Segundo, \u003cstrong>olhar a série de métricas por fold e não só a média\u003c/strong>: se o desempenho vem caindo nos folds mais recentes, isso é concept drift e a média esconde. Os folds recentes são os mais representativos do que vai acontecer.\u003c/p>\n\u003cp>Também tomo cuidado com features agregadas: uma média histórica por cliente precisa ser calculada usando apenas dados anteriores ao ponto de predição, o que na prática significa agregações com janela e ponto de corte, não \u003ccode>groupby\u003c/code> sobre a tabela inteira.\u003c/p>\n\u003cp>E, para produção, retreino com todos os dados incluindo o período de validação — jogar fora os dados mais recentes seria perder justamente os mais relevantes.\u003c/p>"},{"titleHtml":"🟡 Como você lida com desbalanceamento de classes?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Primeiro eu questionaria se é de fato um problema. Desbalanceamento só importa se a classe rara é a que interessa e se o modelo está de fato ignorando ela. Com sinal forte e volume absoluto suficiente, modelos aprendem classes raras sem intervenção — 1% de 10 milhões são 100 mil positivos, o que é bastante. O problema real é \u003cstrong>quantidade absoluta\u003c/strong>, não proporção.\u003c/p>\n\u003cp>Na ordem que eu tentaria: \u003cstrong>primeiro mudar a métrica e o limiar\u003c/strong> — muita coisa que se chama \"problema de desbalanceamento\" é só usar acurácia com limiar 0.5. Trocar para PR-AUC e escolher o limiar pelo custo dos erros frequentemente resolve sem tocar nos dados. \u003cstrong>Segundo, class weights\u003c/strong> — pesar a perda inversamente à frequência, que é mais limpo que reamostrar porque não duplica nem descarta dados. \u003cstrong>Terceiro, reamostragem\u003c/strong> — undersampling se a majoritária for enorme e redundante, SMOTE se eu precisar de mais sinal da minoritária. \u003cstrong>Quarto, coletar mais dados da classe rara.\u003c/strong> E se a classe for rara demais ou heterogênea demais, eu reformularia como detecção de anomalia.\u003c/p>\n\u003cp>As regras que não quebro: reamostragem só no treino, nunca em validação e teste, porque eles precisam refletir a distribuição real; dentro do CV e não antes; e sabendo que ela \u003cstrong>quebra a calibração\u003c/strong> — se eu precisar de probabilidades, recalibro depois.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Quando SMOTE falha?\"\u003c/em> — Em alta dimensão, porque interpolar em espaço esparso gera pontos em regiões implausíveis do espaço de features; com categóricas, porque interpolação não faz sentido — precisa da variante SMOTE-NC; e quando há ruído na classe minoritária, porque interpolar a partir de um outlier gera exemplos sintéticos dentro do território da majoritária, borrando a fronteira. Em muitos casos práticos class weights performa igual ou melhor com muito menos complexidade.\u003c/p>"},{"titleHtml":"🟡 Você tem AUC de 0.98 offline e 0.62 em produção. O que aconteceu?","level":"🟡","levelName":"intermediario","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Essa magnitude de queda é quase sempre leakage ou split inválido, não drift. Eu investigaria em ordem de probabilidade:\u003c/p>\n\u003cp>\u003cstrong>Leakage de alvo\u003c/strong> — alguma feature que só existe depois do evento. Verificaria a importância das features e a semântica de qualquer uma dominante, checando quando aquele campo é escrito no sistema de origem.\u003c/p>\n\u003cp>\u003cstrong>Split temporal inválido\u003c/strong> — se o split foi aleatório mas o problema é temporal, o modelo viu o futuro. Refaria a avaliação com walk-forward.\u003c/p>\n\u003cp>\u003cstrong>Leakage de grupo\u003c/strong> — o mesmo usuário em treino e teste, com o modelo memorizando entidades.\u003c/p>\n\u003cp>\u003cstrong>Leakage de pré-processamento\u003c/strong> — transformações ajustadas antes do split.\u003c/p>\n\u003cp>\u003cstrong>Diferença de distribuição\u003c/strong> — o conjunto offline não representa o tráfego real: filtros de amostragem, período diferente, ou viés de seleção do sistema anterior, onde eu só tenho rótulos para os casos que o sistema antigo deixou passar.\u003c/p>\n\u003cp>\u003cstrong>Disponibilidade de features em produção\u003c/strong> — uma feature que existe no data warehouse mas chega tarde ou vem nula em tempo real. Esse é sutil e muito comum: o valor está lá offline, mas no momento da inferência ainda não foi computado.\u003c/p>\n\u003cp>O teste diagnóstico mais rápido: treinar num período e avaliar num período posterior real. Se a métrica cai para perto de 0.62, o problema é a validação; se continua alta, o problema está na engenharia de serving ou nas features em tempo real.\u003c/p>"},{"titleHtml":"🔴 Como você evita overfittar no conjunto de validação?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> É um problema real e subestimado: se eu testo centenas de configurações contra o mesmo conjunto de validação, acabo selecionando o que teve sorte naquela amostra. É o problema das comparações múltiplas aplicado à seleção de modelos, e o resultado é que a estimativa de validação fica otimista mesmo o teste estando intocado.\u003c/p>\n\u003cp>Mitigações, da mais barata à mais correta:\u003c/p>\n\u003cp>\u003cstrong>Limitar o número de comparações\u003c/strong> e preferir busca aleatória ou bayesiana a grid exaustivo — menos avaliações, menos chance de sorte.\u003c/p>\n\u003cp>\u003cstrong>Usar CV em vez de holdout único\u003c/strong> para a seleção, o que reduz a variância do critério de escolha.\u003c/p>\n\u003cp>\u003cstrong>Regra do erro-padrão:\u003c/strong> entre modelos cujo desempenho está dentro de um erro-padrão do melhor, escolher o \u003cstrong>mais simples\u003c/strong>. Isso reconhece explicitamente que diferenças dentro do ruído não são diferenças.\u003c/p>\n\u003cp>\u003cstrong>Nested cross-validation:\u003c/strong> CV interna para escolher hiperparâmetros, externa para estimar desempenho. É a resposta formalmente correta, porque a estimativa externa nunca viu a seleção. Caro, mas é o que eu usaria se o número reportado tivesse consequência séria.\u003c/p>\n\u003cp>\u003cstrong>Reservar um teste realmente intocado\u003c/strong> e olhá-lo uma vez só. Se ele discorda muito da validação, isso é a evidência de que eu overfittei a validação.\u003c/p>\n\u003cp>\u003cstrong>Follow-up:\u003c/strong> \u003cem>\"Como você sabe que overfittou a validação?\"\u003c/em> — Discrepância entre validação e teste, e o padrão suspeito de o melhor modelo mudar de posição com pequenas perturbações do split. Se reembaralhar os folds troca qual configuração vence, eu estava escolhendo ruído.\u003c/p>"},{"titleHtml":"🔴 Você está prevendo churn. Descreva o desenho completo de treino e validação.","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Começaria definindo o problema com precisão, porque é aqui que a maioria dos erros nasce.\u003c/p>\n\u003cp>\u003cstrong>Definição de churn e horizonte.\u003c/strong> \"Churn\" precisa de uma definição operacional: não usar o produto por 30 dias? cancelar a assinatura? Sem isso não há rótulo. E preciso do horizonte de predição: prevejo churn nos próximos 30 dias a partir de hoje? Essa escolha define tudo o mais.\u003c/p>\n\u003cp>\u003cstrong>Ponto de corte e construção do rótulo.\u003c/strong> Para cada cliente escolho um instante de referência \u003ccode>T\u003c/code>. Todas as features usam \u003cstrong>exclusivamente\u003c/strong> dados até \u003ccode>T\u003c/code>. O rótulo é se ele deu churn no intervalo \u003ccode>(T, T + 30 dias]\u003c/code>. Isso torna explícito o que é passado e o que é futuro — a fonte número um de leakage aqui é calcular features agregando o histórico inteiro, incluindo o período do rótulo.\u003c/p>\n\u003cp>\u003cstrong>Split temporal, não aleatório.\u003c/strong> Treino com pontos de referência até uma data, validação num período posterior, teste num período ainda posterior. E com \u003cstrong>gap de pelo menos 30 dias\u003c/strong> entre treino e validação, porque rótulos perto da borda do treino dependem de eventos dentro do período de validação.\u003c/p>\n\u003cp>\u003cstrong>Agrupamento por cliente.\u003c/strong> Se o mesmo cliente aparece em múltiplos pontos de referência, ele não pode estar em treino e teste. Combino split temporal com agrupamento por cliente.\u003c/p>\n\u003cp>\u003cstrong>Leakage a auditar explicitamente:\u003c/strong> qualquer campo preenchido pela equipe de retenção (\u003ccode>contato_de_retencao\u003c/code>, \u003ccode>oferta_de_desconto\u003c/code>), porque ele é consequência de alguém já ter percebido o risco de churn, não causa; campos de status atualizados no cancelamento; e tickets de suporte abertos depois de \u003ccode>T\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Desbalanceamento.\u003c/strong> Churn mensal costuma ser 2–5%. Usaria PR-AUC como métrica principal e escolheria o limiar pela capacidade da equipe de retenção — se eles conseguem contatar 500 clientes por mês, a métrica que importa é precision@500, e ainda melhor seria ponderar por valor do cliente, porque salvar um cliente grande vale mais.\u003c/p>\n\u003cp>\u003cstrong>Avaliação final.\u003c/strong> A pergunta real do negócio não é \"quem vai dar churn\" e sim \"em quem vale a pena intervir\", que é um problema de \u003cstrong>uplift\u003c/strong> — nem todo cliente com alto risco é influenciável pela intervenção, e alguns clientes só cancelam \u003cem>porque\u003c/em> foram contatados. Se houver orçamento, eu proporia um teste com grupo de controle para medir o efeito causal da intervenção, e não só a acurácia da previsão. Essa distinção entre predição e efeito causal é o que faz o projeto dar retorno de verdade.\u003c/p>"},{"titleHtml":"🔴 Quando cross-validation é uma má ideia?","level":"🔴","levelName":"avancado","bodyHtml":"\u003cp>\u003cstrong>Resposta modelo:\u003c/strong> Vários casos.\u003c/p>\n\u003cp>\u003cstrong>Dados temporais\u003c/strong> — k-fold aleatório usa o futuro para prever o passado e produz estimativa inválida, geralmente otimista. Usar walk-forward.\u003c/p>\n\u003cp>\u003cstrong>Dados agrupados sem group-aware CV\u003c/strong> — múltiplas amostras por entidade fazem o modelo memorizar a entidade.\u003c/p>\n\u003cp>\u003cstrong>Custo de treino proibitivo\u003c/strong> — treinar um modelo grande 10 vezes pode ser inviável. Nesse caso, um holdout único bem dimensionado é o compromisso razoável, aceitando maior variância na estimativa.\u003c/p>\n\u003cp>\u003cstrong>Dados muito pequenos com alta variância entre folds\u003c/strong> — CV com poucos exemplos gera estimativas tão ruidosas que decisões baseadas nelas são arbitrárias. Ajuda usar k-fold repetido, mas o problema de fundo é falta de dados e nenhuma técnica de validação cria informação.\u003c/p>\n\u003cp>\u003cstrong>Quando o pré-processamento é caro e não pode ser refeito por fold\u003c/strong> — aí a tentação é ajustar uma vez antes, o que introduz leakage. Se não dá para fazer certo, holdout é preferível a um CV enviesado.\u003c/p>\n\u003cp>\u003cstrong>Quando existe dependência espacial\u003c/strong> — dados geográficos vizinhos são correlacionados; split aleatório superestima. Precisa de CV com blocos espaciais.\u003c/p>\n\u003cp>\u003cstrong>E um caso conceitual:\u003c/strong> quando a pergunta não é \"qual o desempenho esperado\" e sim \"esse modelo específico funciona nesta população específica\". CV estima o desempenho do \u003cem>procedimento\u003c/em> de treino, não de um modelo em particular — cada fold produz um modelo diferente. Para validar um artefato específico que vai para produção, você precisa de um holdout que aquele artefato nunca viu.\u003c/p>"}],"quiz":[{"n":"🟢","levelName":"basico","q":"Por que o conjunto de \u003cstrong>teste\u003c/strong> deve ser usado uma única vez, no fim?","a":["Escolher entre N configurações pelo teste seleciona a de sorte","Testar é computacionalmente caro e consome muito orçamento","O conjunto de teste costuma ser menor que o de validação","Existe exigência regulatória de separar os três conjuntos"],"c":0,"e":"É o problema das comparações múltiplas: testar cem modelos e reportar o melhor equivale a reportar o máximo de cem amostras ruidosas. Hiperparâmetro, limiar e early stopping se decidem na validação. Custo computacional e tamanho relativo não são o motivo, e não há regra legal envolvida."},{"n":"🟢","levelName":"basico","q":"O que é \u003cstrong>data leakage\u003c/strong>?","a":["Vazamento de dados pessoais para terceiros fora da empresa","Perda de registros durante a ingestão dos dados de origem","Informação no treino que não existirá no momento da predição","Usar features em excesso e assim sobrecarregar o modelo final"],"c":2,"e":"A regra prática é congelar o instante da predição e perguntar, para cada feature, se você teria aquele valor ali — e a assinatura é sempre resultado bom demais. Perda de registro é problema de ingestão, exposição de dado pessoal é de privacidade, e excesso de features causa overfitting, que é outro fenômeno."},{"n":"🟡","levelName":"intermediario","q":"Onde o \u003cstrong>StandardScaler\u003c/strong> deve ser ajustado num fluxo com cross-validation?","a":["Tanto faz: o efeito de padronizar é sempre desprezível aqui","No dataset inteiro antes de dividir, para manter consistência","Na validação, que é onde a métrica acaba sendo de fato medida","Só no treino, e dentro de cada fold, via pipeline encapsulado"],"c":3,"e":"Ajustar no dataset inteiro vaza estatísticas do teste para o treino, e o efeito costuma ser pequeno — o que o torna perigoso, porque é viés otimista silencioso, e fica grave com target encoding e seleção de features. Ajustar na validação inverte o papel dos conjuntos, e o pipeline existe para tornar o erro impossível por descuido."},{"n":"🟡","levelName":"intermediario","q":"Como validar corretamente um modelo de \u003cstrong>série temporal\u003c/strong>?","a":["k-fold aleatório estratificado pelas classes do alvo que se prevê","Walk-forward: treinar no passado e validar no período seguinte","Holdout aleatório de vinte por cento das linhas disponíveis","Leave-one-out, que aproveita o máximo dos dados em cada rodada"],"c":1,"e":"Split aleatório usa o futuro para prever o passado, e é inválido em qualquer das três variações embaralhadas. O gap entre treino e validação evita vazamento na borda quando o rótulo tem horizonte, e olhar a métrica por fold revela degradação que a média esconde."},{"n":"🟡","levelName":"intermediario","q":"Por que aplicar \u003cstrong>SMOTE antes do split\u003c/strong> treino/teste é um erro grave?","a":["O conjunto de teste fica balanceado demais para medir acurácia","O SMOTE só funciona em problemas de regressão com alvo contínuo","Exemplos sintéticos vindos do treino aparecem também no teste","A geração sintética reduz o volume total de dados disponível"],"c":2,"e":"O modelo já viu quase exatamente aquele ponto, e a métrica infla. Reamostragem é parte do treino: depois do split, dentro do CV, e nunca aplicada a validação ou teste, que precisam refletir a distribuição real. SMOTE é para classificação, aumenta o volume em vez de reduzir, e o desbalanceamento do teste é consequência, não causa."},{"n":"🟡","levelName":"intermediario","q":"Um dataset médico tem vários exames por paciente. Qual o risco de um split aleatório simples?","a":["O mesmo paciente cai em treino e teste e o modelo o reconhece","Os folds acabam ficando com tamanhos bastante diferentes","O modelo não converge quando os dados são agrupados assim","Nenhum risco, desde que o split seja estratificado por classe"],"c":0,"e":"É leakage de grupo: o modelo aprende a identificar o indivíduo em vez do padrão clínico, e a estimativa fica otimista. A solução é manter todas as amostras de uma entidade no mesmo fold. Tamanho desigual de fold é efeito colateral gerenciável, e estratificar por classe não impede a mesma pessoa de cruzar a fronteira."},{"n":"🔴","levelName":"avancado","q":"AUC de \u003cstrong>0,98 offline e 0,62 em produção\u003c/strong>. Qual a causa mais provável?","a":["Drift natural dos dados acumulado ao longo de algumas semanas","Leakage ou split inválido: a queda é grande demais para ser drift","Azar amostral na janela específica que foi avaliada em produção","Falta de épocas de treino: o modelo ainda não convergiu direito"],"c":1,"e":"Drift degrada aos poucos; queda abrupta dessa magnitude aponta feature que só existe depois do evento, split aleatório em problema temporal, ou mesma entidade nos dois lados. O teste rápido é treinar num período e avaliar num posterior real: se cair para perto de 0,62, o problema era a validação. Convergência não explica desempenho offline excelente."},{"n":"🔴","levelName":"avancado","q":"Para que serve \u003cstrong>nested cross-validation\u003c/strong>?","a":["Substituir o conjunto de teste depois do modelo ir a produção","Acelerar a busca de hiperparâmetros em datasets muito grandes","Aumentar o volume efetivo de dados usados no treinamento","Estimar sem viés quando há muita busca de hiperparâmetros"],"c":3,"e":"Selecionando e estimando no mesmo CV, a estimativa fica otimista, porque a escolha já viu aqueles folds; o laço externo nunca vê a seleção. O custo é multiplicar os treinos, então ele não acelera nada, não cria dados novos, e não substitui o monitoramento do artefato que foi para produção."}]},{"id":"04","fullTitle":"04 — Modelos Clássicos","shortTitle":"Modelos Clássicos","subtitle":"Regressão linear e logística, árvores, random forest, gradient boosting, SVM, kNN, Naive Bayes.","toc":[{"id":"sec-1-resumo-conceitual","title":"1. Resumo conceitual"},{"id":"sec-3-armadilhas-comuns","title":"3. Armadilhas comuns"}],"studyHtml":"\u003csection class=\"study-sec\" id=\"sec-1-resumo-conceitual\">\u003ch2>1. Resumo conceitual\u003c/h2>\u003ch3 id=\"h-1-1-regressão-linear\">1.1 Regressão linear\u003c/h3>\n\u003cp>Modela \u003ccode>y = w·x + b\u003c/code>, ajustando \u003ccode>w\u003c/code> para minimizar o erro quadrático. Tem solução analítica (\u003ccode>w = (XᵀX)⁻¹Xᵀy\u003c/code>, as equações normais), o que é elegante mas raramente usado em escala porque inverter uma matriz \u003ccode>p×p\u003c/code> custa \u003ccode>O(p³)\u003c/code> e a inversão é numericamente instável com multicolinearidade — na prática se usa decomposição QR/SVD ou gradiente descendente.\u003c/p>\n\u003cp>\u003cstrong>As suposições\u003c/strong> (cobradas com frequência, e o valor está em saber \u003cstrong>o que cada violação quebra\u003c/strong>):\u003c/p>\n\u003col>\u003cli>\u003cstrong>Linearidade\u003c/strong> nos parâmetros — a relação entre features e alvo é linear. Violar isso gera bias; a correção é adicionar termos polinomiais, interações ou transformações (log).\u003c/li>\u003cli>\u003cstrong>Independência dos resíduos\u003c/strong> — violada em séries temporais e dados agrupados. Não enviesa os coeficientes, mas \u003cstrong>subestima os erros-padrão\u003c/strong>, então seus p-valores e intervalos de confiança ficam otimistas demais.\u003c/li>\u003cli>\u003cstrong>Homocedasticidade\u003c/strong> — variância constante dos resíduos. Violar não enviesa os coeficientes, mas invalida a inferência. Corrige-se com erros-padrão robustos ou transformando o alvo.\u003c/li>\u003cli>\u003cstrong>Normalidade dos resíduos\u003c/strong> — necessária apenas para inferência exata em amostras pequenas. Em amostras grandes o TCL cobre. \u003cstrong>Não é necessária para a estimativa dos coeficientes.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Ausência de multicolinearidade perfeita\u003c/strong> — com colinearidade alta, os coeficientes ficam instáveis e com erros-padrão enormes, mas as \u003cstrong>previsões continuam boas\u003c/strong>.\u003c/li>\u003c/ol>\n\u003cp>O ponto que impressiona: \u003cstrong>essas suposições existem para a inferência estatística (p-valores, intervalos de confiança), não para a predição.\u003c/strong> Se você só quer prever, violar normalidade e homocedasticidade não te impede de ter um modelo útil. Se você vai afirmar \"esta variável tem efeito significativo\", elas passam a importar muito. Saber separar os dois usos é sinal de maturidade estatística.\u003c/p>\n\u003cp>\u003cstrong>Multicolinearidade:\u003c/strong> quando features são fortemente correlacionadas, \u003ccode>XᵀX\u003c/code> fica mal-condicionada. Consequência: coeficientes com variância enorme, sinais que trocam com pequenas mudanças nos dados, e interpretação individual sem sentido — mas capacidade preditiva preservada. Diagnóstico via \u003cstrong>VIF\u003c/strong> (Variance Inflation Factor; VIF &gt; 5–10 é sinal de alerta). Correções: remover redundantes, PCA, ou regularização L2, que é literalmente o \u003ccode>λI\u003c/code> adicionado a \u003ccode>XᵀX\u003c/code> para estabilizá-la.\u003c/p>\n\u003ch3 id=\"h-1-2-regressão-logística\">1.2 Regressão logística\u003c/h3>\n\u003cp>Apesar do nome, é classificação. Modela a \u003cstrong>log-odds\u003c/strong> como função linear das features:\u003c/p>\n\u003cpre>\u003ccode>log( p / (1-p) ) = w·x + b        ⟺        p = σ(w·x + b) = 1 / (1 + e^(-(w·x+b)))\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Por que a sigmoide e não uma reta?\u003c/strong> Porque probabilidade tem que estar em [0,1] e uma função linear não respeita isso. A sigmoide é a inversa da função logit, que mapeia (0,1) para toda a reta real. E há uma razão mais profunda: a logística é o \u003cstrong>modelo linear generalizado canônico para a distribuição de Bernoulli\u003c/strong> — a log-odds é a \u003cem>link function\u003c/em> natural, o que dá à escolha uma justificativa teórica em vez de conveniência.\u003c/p>\n\u003cp>\u003cstrong>Interpretação dos coeficientes\u003c/strong> (cobrada muito):\u003ccode>w_j\u003c/code> é a mudança na \u003cstrong>log-odds\u003c/strong> para um aumento unitário em \u003ccode>x_j\u003c/code>, mantendo o resto constante. \u003ccode>exp(w_j)\u003c/code> é a \u003cstrong>razão de chances (odds ratio)\u003c/strong>: se \u003ccode>exp(w_j) = 1.5\u003c/code>, a chance aumenta 50% por unidade da feature. \u003cstrong>\u003ccode>w_j\u003c/code> NÃO é a mudança na probabilidade\u003c/strong> — o efeito na probabilidade depende de onde você está na curva (é máximo perto de \u003ccode>p = 0.5\u003c/code> e quase nulo nos extremos). Errar isso é comum e é um sinal ruim.\u003c/p>\n\u003cp>\u003cstrong>Por que log-loss e não MSE?\u003c/strong> Duas razões, e a segunda é a que separa candidatos:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Estatística:\u003c/strong> log-loss é a log-verossimilhança negativa sob o modelo de Bernoulli. Minimizar log-loss = fazer MLE. É a perda principiada.\u003c/li>\u003cli>\u003cstrong>De otimização:\u003c/strong> MSE aplicado à saída da sigmoide é \u003cstrong>não-convexa\u003c/strong> em \u003ccode>w\u003c/code>, criando mínimos locais. A log-loss composta com a sigmoide é \u003cstrong>convexa\u003c/strong>, garantindo mínimo global. Além disso, o gradiente da log-loss em relação aos pesos vale simplesmente \u003ccode>(p - y)·x\u003c/code> — a sigmoide se cancela — enquanto com MSE o gradiente carrega o fator \u003ccode>σ'(z)\u003c/code>, que \u003cstrong>satura perto de 0 e 1\u003c/strong>, fazendo o aprendizado quase parar exatamente quando o modelo está confiante e errado. É o mesmo argumento de saturação que aparece em \u003ca href=\"#\" class=\"topic-link\" data-topic=\"07\">07 — Redes neurais\u003c/a>.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Por que a logística continua relevante em 2026:\u003c/strong> é rápida, calibrada por construção (log-loss é uma proper scoring rule), interpretável em nível regulatório (crédito, saúde), escala para bilhões de linhas, e é o \u003cstrong>baseline obrigatório\u003c/strong>. Se seu gradient boosting supera a logística em 1 ponto de AUC, a resposta certa raramente é usar o boosting.\u003c/p>\n\u003cp>\u003cstrong>Separação perfeita:\u003c/strong> se uma feature separa perfeitamente as classes, o MLE não existe — os coeficientes divergem para infinito buscando previsões de 0 e 1 exatos. Detecta-se por coeficientes gigantescos e erros-padrão gigantescos. Regularização resolve, o que é uma boa razão prática para sempre usar um pouco de L2.\u003c/p>\n\u003ch3 id=\"h-1-3-árvores-de-decisão\">1.3 Árvores de decisão\u003c/h3>\n\u003cp>Particionam o espaço recursivamente com splits do tipo \u003ccode>x_j ≤ t\u003c/code>, escolhendo a cada nó o split que mais reduz uma medida de impureza.\u003c/p>\n\u003cp>\u003cstrong>Critérios de impureza (classificação):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Gini:\u003c/strong> \u003ccode>1 - Σ p_i²\u003c/code>. Interpretação: probabilidade de classificar errado um elemento rotulado aleatoriamente segundo a distribuição do nó.\u003c/li>\u003cli>\u003cstrong>Entropia:\u003c/strong> \u003ccode>-Σ p_i log p_i\u003c/code>. O ganho de informação é a redução de entropia.\u003c/li>\u003c/ul>\n\u003cp>Na prática \u003cstrong>produzem árvores quase idênticas\u003c/strong>; Gini é ligeiramente mais rápido (sem logaritmo) e é o padrão em várias bibliotecas. Se um entrevistador insiste na diferença, a resposta honesta é \"raramente importa, e é um hiperparâmetro que eu não priorizaria ajustar\" — isso é melhor que inventar uma distinção grande.\u003c/p>\n\u003cp>Para regressão, o critério é redução de variância (MSE), e a predição da folha é a média dos alvos nela.\u003c/p>\n\u003cp>\u003cstrong>Propriedades essenciais:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Captura interações e não-linearidades automaticamente\u003c/strong> — cada caminho da raiz à folha é uma conjunção de condições, o que é uma interação de ordem alta sem você especificar nada. É a principal razão de árvores dominarem dados tabulares.\u003c/li>\u003cli>\u003cstrong>Invariante a transformações monótonas das features\u003c/strong> — a árvore só usa a \u003cstrong>ordem\u003c/strong> dos valores para escolher os pontos de corte. Por isso \u003cstrong>escalonamento é desnecessário\u003c/strong> em árvores, e aplicar log numa feature não muda nada (o que também significa que log não ajuda em árvores, ao contrário de modelos lineares).\u003c/li>\u003cli>\u003cstrong>Lida com missing values\u003c/strong> de forma nativa em várias implementações (surrogate splits em CART, direção padrão aprendida em XGBoost/LightGBM).\u003c/li>\u003cli>\u003cstrong>Fronteiras de decisão paralelas aos eixos\u003c/strong> — a limitação estrutural. Uma fronteira diagonal exige uma escada de muitos splits para ser aproximada. É a razão de árvores serem ruins em problemas geométricos/de sinal e ótimas em dados tabulares heterogêneos.\u003c/li>\u003cli>\u003cstrong>Alta variância\u003c/strong> — pequenas mudanças nos dados mudam o split raiz e cascateiam, produzindo uma árvore inteiramente diferente. É a fraqueza que m
